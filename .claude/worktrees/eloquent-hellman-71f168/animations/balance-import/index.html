<script type="text/babel">
/* inlined: animations.jsx */

// animations.jsx
// Reusable animation starter: Stage, Timeline, Sprite, easing helpers.
// Usage (in an HTML file that loads React + Babel):
//
//   <Stage width={1280} height={720} duration={10} background="#f6f4ef">
//     <MyScene />
//   </Stage>
//
// Inside <Stage>, any child can call useTime() to read the current
// playhead (seconds). Or wrap content in <Sprite start={1} end={4}>...</Sprite>
// to only render during that window -- children receive a `localTime` and
// `progress` via the useSprite() hook.
//
// ─────────────────────────────────────────────────────────────────────────────

// ── Easing functions (hand-rolled, Popmotion-style) ─────────────────────────
// All easings take t ∈ [0,1] and return eased t ∈ [0,1] (may overshoot for back/elastic).
const Easing = {
  linear: (t) => t,

  // Quad
  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),

  // Cubic
  easeInCubic:    (t) => t * t * t,
  easeOutCubic:   (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),

  // Quart
  easeInQuart:    (t) => t * t * t * t,
  easeOutQuart:   (t) => 1 - (--t) * t * t * t,
  easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),

  // Expo
  easeInExpo:  (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
  easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeInOutExpo: (t) => {
    if (t === 0) return 0;
    if (t === 1) return 1;
    if (t < 0.5) return 0.5 * Math.pow(2, 20 * t - 10);
    return 1 - 0.5 * Math.pow(2, -20 * t + 10);
  },

  // Sine
  easeInSine:    (t) => 1 - Math.cos((t * Math.PI) / 2),
  easeOutSine:   (t) => Math.sin((t * Math.PI) / 2),
  easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,

  // Back (overshoot)
  easeOutBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  easeInBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return c3 * t * t * t - c1 * t * t;
  },
  easeInOutBack: (t) => {
    const c1 = 1.70158, c2 = c1 * 1.525;
    return t < 0.5
      ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
      : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
  },

  // Elastic
  easeOutElastic: (t) => {
    const c4 = (2 * Math.PI) / 3;
    if (t === 0) return 0;
    if (t === 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  },
};

// ── Core interpolation helpers ──────────────────────────────────────────────

// Clamp a value to [min, max]
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

// interpolate([0, 0.5, 1], [0, 100, 50], ease?) -> fn(t)
// Popmotion-style: linearly maps t across input keyframes to output values,
// with optional easing per segment (single fn or array of fns).
function interpolate(input, output, ease = Easing.linear) {
  return (t) => {
    if (t <= input[0]) return output[0];
    if (t >= input[input.length - 1]) return output[output.length - 1];
    for (let i = 0; i < input.length - 1; i++) {
      if (t >= input[i] && t <= input[i + 1]) {
        const span = input[i + 1] - input[i];
        const local = span === 0 ? 0 : (t - input[i]) / span;
        const easeFn = Array.isArray(ease) ? (ease[i] || Easing.linear) : ease;
        const eased = easeFn(local);
        return output[i] + (output[i + 1] - output[i]) * eased;
      }
    }
    return output[output.length - 1];
  };
}

// animate({from, to, start, end, ease})(t) — simpler single-segment tween.
// Returns `from` before `start`, `to` after `end`.
function animate({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeInOutCubic }) {
  return (t) => {
    if (t <= start) return from;
    if (t >= end) return to;
    const local = (t - start) / (end - start);
    return from + (to - from) * ease(local);
  };
}

// ── Timeline context ────────────────────────────────────────────────────────

const TimelineContext = React.createContext({ time: 0, duration: 10, playing: false });

const useTime = () => React.useContext(TimelineContext).time;
const useTimeline = () => React.useContext(TimelineContext);

// ── Sprite ──────────────────────────────────────────────────────────────────
// Renders children only when the playhead is inside [start, end]. Provides
// a sub-context with `localTime` (seconds since start) and `progress` (0..1).
//
//   <Sprite start={2} end={5}>
//     {({ localTime, progress }) => <Thing x={progress * 100} />}
//   </Sprite>
//
// Or as a plain wrapper — children can call useSprite() themselves.

const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });
const useSprite = () => React.useContext(SpriteContext);

function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {
  const { time } = useTimeline();
  const visible = time >= start && time <= end;
  if (!visible && !keepMounted) return null;

  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 && isFinite(duration)
    ? clamp(localTime / duration, 0, 1)
    : 0;

  const value = { localTime, progress, duration, visible };

  return (
    <SpriteContext.Provider value={value}>
      {typeof children === 'function' ? children(value) : children}
    </SpriteContext.Provider>
  );
}

// ── Sample sprite components ────────────────────────────────────────────────

// TextSprite: fades/slides text in on entry, holds, then fades out on exit.
// Props: text, x, y, size, color, font, entryDur, exitDur, align
function TextSprite({
  text,
  x = 0, y = 0,
  size = 48,
  color = '#111',
  font = 'Inter, system-ui, sans-serif',
  weight = 600,
  entryDur = 0.45,
  exitDur = 0.35,
  entryEase = Easing.easeOutBack,
  exitEase = Easing.easeInCubic,
  align = 'left',
  letterSpacing = '-0.01em',
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let ty = 0;

  if (localTime < entryDur) {
    const t = entryEase(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    ty = (1 - t) * 16;
  } else if (localTime > exitStart) {
    const t = exitEase(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    ty = -t * 8;
  }

  const translateX = align === 'center' ? '-50%' : align === 'right' ? '-100%' : '0';

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      transform: `translate(${translateX}, ${ty}px)`,
      opacity,
      fontFamily: font,
      fontSize: size,
      fontWeight: weight,
      color,
      letterSpacing,
      whiteSpace: 'pre',
      lineHeight: 1.1,
      willChange: 'transform, opacity',
    }}>
      {text}
    </div>
  );
}

// ImageSprite: scales + fades in; optional Ken Burns drift during hold.
function ImageSprite({
  src,
  x = 0, y = 0,
  width = 400, height = 300,
  entryDur = 0.6,
  exitDur = 0.4,
  kenBurns = false,
  kenBurnsScale = 1.08,
  radius = 12,
  fit = 'cover',
  placeholder = null, // {label: string} for striped placeholder
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutCubic(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    scale = 0.96 + 0.04 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInCubic(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = (kenBurns ? kenBurnsScale : 1) + 0.02 * t;
  } else if (kenBurns) {
    const holdSpan = exitStart - entryDur;
    const holdT = holdSpan > 0 ? (localTime - entryDur) / holdSpan : 0;
    scale = 1 + (kenBurnsScale - 1) * holdT;
  }

  const content = placeholder ? (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'repeating-linear-gradient(135deg, #e9e6df 0 10px, #dcd8cf 10px 20px)',
      color: '#6b6458',
      fontFamily: 'JetBrains Mono, ui-monospace, monospace',
      fontSize: 13,
      letterSpacing: '0.04em',
      textTransform: 'uppercase',
    }}>
      {placeholder.label || 'image'}
    </div>
  ) : (
    <img src={src} alt="" style={{ width: '100%', height: '100%', objectFit: fit, display: 'block' }} />
  );

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      borderRadius: radius,
      overflow: 'hidden',
      willChange: 'transform, opacity',
    }}>
      {content}
    </div>
  );
}

// RectSprite: simple rectangle that animates position/size/color via props.
// Useful demo primitive — takes a `render` fn for per-frame customization.
function RectSprite({
  x = 0, y = 0,
  width = 100, height = 100,
  color = '#111',
  radius = 8,
  entryDur = 0.4,
  exitDur = 0.3,
  render, // optional: (ctx) => style overrides
}) {
  const spriteCtx = useSprite();
  const { localTime, duration } = spriteCtx;
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutBack(clamp(localTime / entryDur, 0, 1));
    opacity = clamp(localTime / entryDur, 0, 1);
    scale = 0.4 + 0.6 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInQuad(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = 1 - 0.15 * t;
  }

  const overrides = render ? render(spriteCtx) : {};

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      background: color,
      borderRadius: radius,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      willChange: 'transform, opacity',
      ...overrides,
    }} />
  );
}


function Stage({
  width = 1280,
  height = 720,
  duration = 10,
  background = '#f6f4ef',
  fps = 60,
  loop = true,
  autoplay = true,
  persistKey = 'animstage',
  children,
}) {
  const [time, setTime] = React.useState(() => {
    try {
      const v = parseFloat(localStorage.getItem(persistKey + ':t') || '0');
      return isFinite(v) ? clamp(v, 0, duration) : 0;
    } catch { return 0; }
  });
  const [playing, setPlaying] = React.useState(autoplay);
  const [hoverTime, setHoverTime] = React.useState(null);
  const [scale, setScale] = React.useState(1);

  const stageRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  // Persist playhead
  React.useEffect(() => {
    try { localStorage.setItem(persistKey + ':t', String(time)); } catch {}
  }, [time, persistKey]);

  // Auto-scale to fit viewport
  React.useEffect(() => {
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const barH = 44; // playback bar height
      const s = Math.min(
        el.clientWidth / width,
        (el.clientHeight - barH) / height
      );
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener('resize', measure);
    return () => {
      ro.disconnect();
      window.removeEventListener('resize', measure);
    };
  }, [width, height]);

  // Animation loop
  React.useEffect(() => {
    if (!playing) {
      lastTsRef.current = null;
      return;
    }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      setTime((t) => {
        let next = t + dt;
        if (next >= duration) {
          if (loop) next = next % duration;
          else { next = duration; setPlaying(false); }
        }
        return next;
      });
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      lastTsRef.current = null;
    };
  }, [playing, duration, loop]);

  // Keyboard: space = play/pause, ← → = seek
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        setPlaying(p => !p);
      } else if (e.code === 'ArrowLeft') {
        setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.code === 'ArrowRight') {
        setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.key === '0' || e.code === 'Home') {
        setTime(0);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [duration]);

  const displayTime = hoverTime != null ? hoverTime : time;

  const ctxValue = React.useMemo(
    () => ({ time: displayTime, duration, playing, setTime, setPlaying }),
    [displayTime, duration, playing]
  );

  return (
    <div
      ref={stageRef}
      style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column',
        alignItems: 'center',
        background: '#0a0a0a',
        fontFamily: 'Inter, system-ui, sans-serif',
      }}
    >
      {/* Canvas area — vertically centered in remaining space */}
      <div style={{
        flex: 1,
        width: '100%',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        overflow: 'hidden',
        minHeight: 0,
      }}>
        <div
          ref={canvasRef}
          style={{
            width, height,
            background,
            position: 'relative',
            transform: `scale(${scale})`,
            transformOrigin: 'center',
            flexShrink: 0,
            boxShadow: '0 20px 60px rgba(0,0,0,0.4)',
            overflow: 'hidden',
          }}
        >
          <TimelineContext.Provider value={ctxValue}>
            {children}
          </TimelineContext.Provider>
        </div>
      </div>

      {/* Playback bar — stacked below canvas, never overlapping */}
      <PlaybackBar
        time={displayTime}
        actualTime={time}
        duration={duration}
        playing={playing}
        onPlayPause={() => setPlaying(p => !p)}
        onReset={() => { setTime(0); }}
        onSeek={(t) => setTime(t)}
        onHover={(t) => setHoverTime(t)}
      />
    </div>
  );
}

// ── Playback bar ────────────────────────────────────────────────────────────
// Play/pause, return-to-begin, scrub track, time display.
// Uses fixed-width time fields so layout doesn't thrash.

function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek, onHover }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);

  const timeFromEvent = React.useCallback((e) => {
    const rect = trackRef.current.getBoundingClientRect();
    const x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    return x * duration;
  }, [duration]);

  const onTrackMove = (e) => {
    if (!trackRef.current) return;
    const t = timeFromEvent(e);
    if (dragging) {
      onSeek(t);
    } else {
      onHover(t);
    }
  };

  const onTrackLeave = () => {
    if (!dragging) onHover(null);
  };

  const onTrackDown = (e) => {
    setDragging(true);
    const t = timeFromEvent(e);
    onSeek(t);
    onHover(null);
  };

  React.useEffect(() => {
    if (!dragging) return;
    const onUp = () => setDragging(false);
    const onMove = (e) => {
      if (!trackRef.current) return;
      const t = timeFromEvent(e);
      onSeek(t);
    };
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mousemove', onMove);
    return () => {
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('mousemove', onMove);
    };
  }, [dragging, timeFromEvent, onSeek]);

  const pct = duration > 0 ? (time / duration) * 100 : 0;
  const fmt = (t) => {
    const total = Math.max(0, t);
    const m = Math.floor(total / 60);
    const s = Math.floor(total % 60);
    const cs = Math.floor((total * 100) % 100);
    return `${String(m).padStart(1, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
  };

  const mono = 'JetBrains Mono, ui-monospace, SFMono-Regular, monospace';

  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 12,
      padding: '8px 16px',
      background: 'rgba(20,20,20,0.92)',
      borderTop: '1px solid rgba(255,255,255,0.08)',
      width: '100%',
      maxWidth: 680,
      alignSelf: 'center',

      borderRadius: 8,
      color: '#f6f4ef',
      fontFamily: 'Inter, system-ui, sans-serif',
      userSelect: 'none',
      flexShrink: 0,
    }}>
      <IconButton onClick={onReset} title="Return to start (0)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        </svg>
      </IconButton>
      <IconButton onClick={onPlayPause} title="Play/pause (space)">
        {playing ? (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="3" y="2" width="3" height="10" fill="currentColor"/>
            <rect x="8" y="2" width="3" height="10" fill="currentColor"/>
          </svg>
        ) : (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 2l9 5-9 5V2z" fill="currentColor"/>
          </svg>
        )}
      </IconButton>

      {/* Current time: fixed width so it doesn't thrash */}
      <div style={{
        fontFamily: mono,
        fontSize: 12,
        fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'right',
        color: '#f6f4ef',
      }}>
        {fmt(time)}
      </div>

      {/* Scrub track */}
      <div
        ref={trackRef}
        onMouseMove={onTrackMove}
        onMouseLeave={onTrackLeave}
        onMouseDown={onTrackDown}
        style={{
          flex: 1,
          height: 22,
          position: 'relative',
          cursor: 'pointer',
          display: 'flex', alignItems: 'center',
        }}
      >
        <div style={{
          position: 'absolute',
          left: 0, right: 0, height: 4,
          background: 'rgba(255,255,255,0.12)',
          borderRadius: 2,
        }}/>
        <div style={{
          position: 'absolute',
          left: 0, width: `${pct}%`, height: 4,
          background: 'oklch(72% 0.12 250)',
          borderRadius: 2,
        }}/>
        <div style={{
          position: 'absolute',
          left: `${pct}%`, top: '50%',
          width: 12, height: 12,
          marginLeft: -6, marginTop: -6,
          background: '#fff',
          borderRadius: 6,
          boxShadow: '0 2px 4px rgba(0,0,0,0.4)',
        }}/>
      </div>

      {/* Duration: fixed width */}
      <div style={{
        fontFamily: mono,
        fontSize: 12,
        fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'left',
        color: 'rgba(246,244,239,0.55)',
      }}>
        {fmt(duration)}
      </div>
    </div>
  );
}

function IconButton({ children, onClick, title }) {
  const [hover, setHover] = React.useState(false);
  return (
    <button
      onClick={onClick}
      title={title}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        width: 28, height: 28,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: hover ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)',
        border: '1px solid rgba(255,255,255,0.1)',
        borderRadius: 6,
        color: '#f6f4ef',
        cursor: 'pointer',
        padding: 0,
        transition: 'background 120ms',
      }}
    >
      {children}
    </button>
  );
}


Object.assign(window, {
  Easing, interpolate, animate, clamp,
  TimelineContext, useTime, useTimeline,
  Sprite, SpriteContext, useSprite,
  TextSprite, ImageSprite, RectSprite,
  Stage, PlaybackBar,
});


</script>
<script type="text/babel">
/* inlined: fm_shared.jsx */
// fm_shared.jsx — Design tokens + shared FM components
// Reverse-engineered to match the TIK workflow visual language.

const FM = {
  // Text
  TEXT:    'oklch(96% 0.008 250)',
  DIM:     'oklch(72% 0.015 250)',
  DIMMER:  'oklch(50% 0.012 250)',

  // Surfaces
  PANEL:    'rgba(18,20,26,0.55)',
  PANEL_HI: 'rgba(28,30,38,0.85)',
  BORDER:    'rgba(255,255,255,0.06)',
  BORDER_HI: 'rgba(255,255,255,0.12)',

  // Accents
  ACCENT:   'oklch(72% 0.14 248)',
  ACCENT_S: 'oklch(72% 0.14 248 / 0.16)',

};

function FMPanel({ x = 0, y = 0, w, h, elevated = false, children }) {

      position: 'absolute', left: x, top: y, width: w, height: h,
      background: elevated ? FM.PANEL_HI : FM.PANEL,

    }}>{children}</div>
  );
}

function FMGlow({ x, y, size = 500, color = FM.ACCENT, opacity = 0.1 }) {
  return (
    <div style={{
      position: 'absolute',
      left: x - size / 2, top: y - size / 2,
      width: size, height: size,
      background: `radial-gradient(circle, ${color} 0%, transparent 60%)`,
      opacity, pointerEvents: 'none',
      filter: 'blur(24px)',
    }} />
  );
}

function FMChip({ label, color = FM.ACCENT, soft = FM.ACCENT_S }) {
  return (
    <div style={{
      display: 'inline-flex', alignItems: 'center',
      padding: '3px 9px', borderRadius: 100,
      background: soft, border: `1px solid ${color}`,
      fontFamily: FM.MONO, fontSize: 9, color,
      letterSpacing: '0.12em', textTransform: 'uppercase',
      whiteSpace: 'nowrap',
    }}>{label}</div>
  );
}

// Animated bezier arc with traveling dot.
// curveDir: vertical curvature offset multiplier (negative = up, positive = down)
function FMArc({ fromX, fromY, toX, toY, progress, color = FM.ACCENT, curveDir = 0 }) {
  const dx = toX - fromX, dy = toY - fromY;
  const cx = fromX + dx * 0.5;
  const cy = fromY + dy * 0.5 + curveDir * 60;
  const path = `M ${fromX} ${fromY} Q ${cx} ${cy} ${toX} ${toY}`;
  // Arc length approximation
  const len = Math.hypot(dx, dy) + Math.abs(curveDir) * 30;
  // Dot position on quadratic bezier at t=progress
  const t = progress;
  const dotX = (1 - t) * (1 - t) * fromX + 2 * (1 - t) * t * cx + t * t * toX;
  const dotY = (1 - t) * (1 - t) * fromY + 2 * (1 - t) * t * cy + t * t * toY;
  return (
    <svg style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'visible' }}
         width="1280" height="720" viewBox="0 0 1280 720">
      <path d={path} stroke={color} strokeWidth="1.2" fill="none"
        opacity="0.45"
        strokeDasharray={len}
        strokeDashoffset={len * (1 - progress)} />
      {progress > 0.02 && progress < 0.98 && (
        <circle cx={dotX} cy={dotY} r="3.5" fill={color}
          style={{ filter: `drop-shadow(0 0 6px ${color})` }} />
      )}
    </svg>
  );
}

// Particle stream — dots traveling fromX,fromY -> toX,toY in a line.
function FMStream({ fromX, fromY, toX, toY, progress, color = FM.ACCENT, count = 8, active = true }) {
  const dx = toX - fromX, dy = toY - fromY;
  return (
    <svg style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}
         width="1280" height="720" viewBox="0 0 1280 720">
      {Array.from({ length: count }).map((_, i) => {
        const phase = (progress * 1.4 + i / count) % 1;
        const opacity = active ? 0.9 * Math.sin(phase * Math.PI) : 0;
        return (
          <circle key={i}
            cx={fromX + dx * phase} cy={fromY + dy * phase}
            r="2.2" fill={color}
            opacity={opacity}
            style={{ filter: `drop-shadow(0 0 4px ${color})` }} />
        );
      })}
    </svg>
  );
}

// Bottom-left scene caption: "01 / 06 — Label"
function SceneCaption({ n, total, t, label }) {
  const inP = Easing.easeOutCubic(clamp(t / 0.5, 0, 1));
  return (
    <div style={{
      position: 'absolute', left: 80, bottom: 70,
      display: 'flex', alignItems: 'center', gap: 14,
      opacity: inP,
    }}>
      <div style={{ fontFamily: FM.MONO, fontSize: 10, color: FM.DIMMER, letterSpacing: '0.22em' }}>
        {String(n).padStart(2, '0')} / {String(total).padStart(2, '0')}
      </div>
      <div style={{ width: 28, height: 1, background: FM.BORDER_HI }} />
      <div style={{ fontFamily: FM.SANS, fontSize: 15, fontWeight: 500, color: FM.TEXT }}>
        {label}
      </div>
    </div>
  );
}

Object.assign(window, { FM, FMPanel, FMGlow, FMChip, FMArc, FMStream, SceneCaption });

        background: METHODS[0].soft,
        border: `1px solid ${METHODS[0].color}60`,
        borderRadius: 10, padding: '14px 16px',
      }}>
        <div style={{ fontFamily: FM.SANS, fontSize: 11, fontWeight: 700, color: METHODS[0].color, marginBottom: 8 }}>💵 Cash Conversion</div>
        <div style={{ fontFamily: FM.MONO, fontSize: 10, color: FM.TEXT, marginBottom: 4 }}>CITS Balances workflow</div>
        <div style={{
          display: 'inline-block', padding: '3px 8px',
          background: 'rgba(34,197,94,0.12)', border: '1px solid rgba(34,197,94,0.30)',
          borderRadius: 4, fontFamily: FM.MONO, fontSize: 9, color: FM.SUCCESS,
        }}>✓ Test mode available</div>
      </div>

      {/* Mapping + TIK card */}
      <div style={{
        position: 'absolute', right: 70, top: 100 + (1 - mapTikIn) * 14,
        width: 210, opacity: mapTikIn,
        background: 'rgba(255,255,255,0.03)',
        border: '1px solid rgba(255,255,255,0.10)',
        borderRadius: 10, padding: '14px 16px',
      }}>
        <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>
          <span style={{ fontFamily: FM.SANS, fontSize: 11, fontWeight: 700, color: METHODS[1].color }}>🗺 Mapping</span>
          <span style={{ fontFamily: FM.SANS, fontSize: 11, color: FM.DIM }}>+</span>
          <span style={{ fontFamily: FM.SANS, fontSize: 11, fontWeight: 700, color: METHODS[2].color }}>📦 TIK</span>
        </div>
        <div style={{ fontFamily: FM.MONO, fontSize: 10, color: FM.TEXT, marginBottom: 6 }}>Day of Wire workflow</div>
        <div style={{
          display: 'inline-block', padding: '3px 8px',
          background: 'rgba(234,179,8,0.10)', border: '1px solid rgba(234,179,8,0.30)',
          borderRadius: 4, fontFamily: FM.MONO, fontSize: 9, color: FM.WARN,
        }}>⚠ Production only — no test</div>
      </div>

      {/* Merge arrow */}
      <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none', opacity: mergeIn }}>
        <line x1={280} y1={175} x2={400} y2={255} stroke={FM.ACCENT} strokeWidth={1.2} strokeOpacity={0.5} />
        <line x1={520} y1={175} x2={400} y2={255} stroke={FM.ACCENT} strokeWidth={1.2} strokeOpacity={0.5} />
      </svg>

      {/* Shared step */}
      <div style={{
        position: 'absolute', left: '50%', top: 250,
        transform: `translateX(-50%) translateY(${(1 - mergeIn) * 12}px)`,
        opacity: mergeIn,
        background: 'rgba(255,255,255,0.05)',
        border: `1px solid rgba(${FM.ACCENT}, 0.25)`,
        borderRadius: 10, padding: '10px 22px',
        fontFamily: FM.SANS, fontSize: 11, fontWeight: 600, color: FM.TEXT,
        textAlign: 'center', whiteSpace: 'nowrap',
      }}>Run balance import queries — validate load</div>

      {/* Validate note */}
      <div style={{
        position: 'absolute', left: '50%', bottom: 65,
        transform: `translateX(-50%) translateY(${(1 - validateIn) * 8}px)`,
        opacity: validateIn,
        fontFamily: FM.MONO, fontSize: 9, color: FM.DIM,
        letterSpacing: '0.08em', whiteSpace: 'nowrap',
        background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.08)',
        borderRadius: 6, padding: '6px 16px',
      }}>Confirm record counts match prior recordkeeper</div>

      <SceneCaption n={5} total={TOTAL} t={t} label="Informatica Load" />

    </div>
  );
}

// ── Scene 6 — P3 Settings & Completion ────────────────────────────────────────
function Scene6() {
  const { localTime: t, duration } = useSprite();
  const exitT = duration - 0.5;
  const sceneOut = t > exitT ? 1 - Easing.easeInCubic(clamp((t - exitT) / 0.5, 0, 1)) : 1;
  const sceneIn  = Easing.easeOutCubic(clamp(t / 0.6, 0, 1));

  const rowIn = (i) => Easing.easeOutCubic(clamp((t - 0.3 - i * 0.35) / 0.7, 0, 1));
  const footIn = Easing.easeOutCubic(clamp((t - 1.8) / 0.8, 0, 1));
  const checkIn = (i) => Easing.easeOutCubic(clamp((t - 2.2 - i * 0.25) / 0.6, 0, 1));

  const ROWS = [
    { method: METHODS[0], settings: ['No Hold', 'Batch', 'Process Immediate'], warn: false },
    { method: METHODS[1], settings: ['No Hold', 'Batch', 'Process Immediate'], warn: false },
    { method: METHODS[2], settings: ['No Hold', 'Online', '⚠ Do NOT Process Immediate'], warn: true },
  ];

  const CHECKS = ['Apply to accounts', 'Run backup queries', 'Balance import complete'];
  const checkLen = 80;

  return (
    <div style={{ position: 'absolute', inset: 0, opacity: sceneIn * sceneOut }}>
      <FMGlow x={400} y={220} size={700} opacity={0.11} />

      <div style={{
        position: 'absolute', top: 52, left: 0, right: 0, textAlign: 'center',
        fontFamily: FM.SANS, fontSize: 13, fontWeight: 600,
        letterSpacing: '0.12em', color: FM.DIM, textTransform: 'uppercase',
      }}>P3 Settings & Completion</div>

      {/* Method setting rows */}
      {ROWS.map((row, i) => {
        const ri = rowIn(i);
        const m = row.method;
        return (
          <div key={m.id} style={{
            position: 'absolute',
            left: 70, right: 70,
            top: 100 + i * 58 + (1 - ri) * 12,
            opacity: ri,
            display: 'flex', alignItems: 'center', gap: 12,
            background: 'rgba(255,255,255,0.03)',
            border: `1px solid ${row.warn ? 'rgba(234,179,8,0.20)' : m.soft}`,
            borderRadius: 8, padding: '10px 14px',
          }}>
            <div style={{
              fontFamily: FM.SANS, fontSize: 10, fontWeight: 700,
              color: m.color, width: 100, flexShrink: 0, letterSpacing: '0.04em',
            }}>{m.icon} {m.abbr}</div>
            <div style={{ display: 'flex', gap: 8 }}>
              {row.settings.map((s, j) => (
                <div key={j} style={{
                  padding: '3px 9px',
                  background: s.startsWith('⚠') ? 'rgba(234,179,8,0.10)' : 'rgba(255,255,255,0.06)',
                  border: `1px solid ${s.startsWith('⚠') ? 'rgba(234,179,8,0.30)' : 'rgba(255,255,255,0.10)'}`,
                  borderRadius: 4,
                  fontFamily: FM.MONO, fontSize: 9,
                  color: s.startsWith('⚠') ? FM.WARN : FM.TEXT,
                  letterSpacing: '0.06em',
                }}>{s}</div>
              ))}
            </div>
          </div>
        );
      })}

      {/* Final steps with animated checkmarks */}
      <div style={{
        position: 'absolute', left: '50%', bottom: 55,
        transform: `translateX(-50%) translateY(${(1 - footIn) * 10}px)`,
        opacity: footIn,
        display: 'flex', gap: 20, alignItems: 'center',
      }}>
        {CHECKS.map((c, i) => {
          const ci = checkIn(i);
          return (
            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
              <svg width={16} height={16} viewBox="0 0 16 16" style={{ flexShrink: 0 }}>
                <circle cx={8} cy={8} r={7} fill="none" stroke={FM.SUCCESS} strokeWidth={1.2} strokeOpacity={0.4} />
                <path d="M4.5 8.2 L7 10.5 L11.5 5.5" fill="none" stroke={FM.SUCCESS} strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round"
                  strokeDasharray={checkLen} strokeDashoffset={checkLen * (1 - ci)} />
              </svg>
              <span style={{
                fontFamily: FM.SANS, fontSize: 10, fontWeight: 600,
                color: ci > 0.5 ? FM.SUCCESS : FM.DIM,
                letterSpacing: '0.04em', whiteSpace: 'nowrap',
              }}>{c}</span>
            </div>
          );
        })}
      </div>

      <SceneCaption n={6} total={TOTAL} t={t} label="P3 Settings & Completion" />

    </div>
  );
}

Object.assign(window, { Scene1, Scene2, Scene3, Scene4, Scene5, Scene6 });

</script>

<script type="text/babel" data-presets="react">
const SCENES = [
  { n: 1, s:  0.0, e:  5.0, label: 'Three Methods, One Goal' },
  { n: 2, s:  5.0, e: 10.0, label: 'Day of Wire — Pre-Receipt' },
  { n: 3, s: 10.0, e: 15.0, label: 'File Prep by Method' },
  { n: 4, s: 15.0, e: 20.0, label: 'CONV File — Critical Fork' },
  { n: 5, s: 20.0, e: 25.0, label: 'Informatica Load' },
  { n: 6, s: 25.0, e: 30.0, label: 'P3 Settings & Completion' },
];
const DURATION = 30;

function App() {
  return (
    <Stage
      width={1280} height={720}
      duration={DURATION}
      background="#08090C"
      persistKey="balance-import-anim"
      loop={true}
    >
      {/* Grid overlay */}
      <div style={{
        position: 'absolute', inset: 0,
        backgroundImage: `
          linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px)
        `,
        backgroundSize: '40px 40px',
        maskImage: 'radial-gradient(ellipse at center, black 10%, transparent 72%)',
        WebkitMaskImage: 'radial-gradient(ellipse at center, black 10%, transparent 72%)',
        pointerEvents: 'none',
      }} />
      {/* Vignette */}
      <div style={{
        position: 'absolute', inset: 0,
        background: 'radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.55) 100%)',
        pointerEvents: 'none',
      }} />

      <Sprite start={0.0}  end={5.0}>  <Scene1 /> </Sprite>
      <Sprite start={5.0}  end={10.0}> <Scene2 /> </Sprite>
      <Sprite start={10.0} end={15.0}> <Scene3 /> </Sprite>
      <Sprite start={15.0} end={20.0}> <Scene4 /> </Sprite>
      <Sprite start={20.0} end={25.0}> <Scene5 /> </Sprite>
      <Sprite start={25.0} end={30.0}> <Scene6 /> </Sprite>
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
