name: Publish current TA Wiki

on:
  push:
    branches: [main]
    paths:
      - 'current/TA Wiki.html'
      - 'current/assets/**'
      - 'current/SS/**'
      - '.github/workflows/publish-current-wiki.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: current-ta-wiki-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Prepare current wiki site
        run: |
          mkdir -p _site
          cp 'current/TA Wiki.html' _site/index.html
          cp -R current/assets _site/assets
          cp -R current/SS _site/SS

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
