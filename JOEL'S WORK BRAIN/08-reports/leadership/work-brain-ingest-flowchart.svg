<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Joel's Work Brain ingest flowchart</title>
  <desc id="desc">A hand-drawn style flowchart showing how raw information enters the Work Brain, gets organized into folders, and becomes searchable reports, reminders, and evolving institutional memory.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.82 0 0 0 0 0.78 0 0 0 0 0.68 0 0 0 .08 0"/>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="6" dy="8" stdDeviation="0.9" flood-color="#222" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#23201c"/>
    </marker>
    <style>
      .bg { fill: #f7f1e3; }
      .ink { fill: #23201c; }
      .muted { fill: #5e574c; }
      .panel { fill: #fffdf6; stroke: #23201c; stroke-width: 4; filter: url(#shadow); }
      .panel-soft { fill: #fbf7ea; stroke: #23201c; stroke-width: 3; filter: url(#shadow); }
      .tape { fill: #ead46f; opacity: .86; stroke: #23201c; stroke-width: 2; }
      .green { fill: #8cc977; stroke: #23201c; stroke-width: 2; }
      .red { fill: #e56f61; stroke: #23201c; stroke-width: 2; }
      .yellow { fill: #f4da72; stroke: #23201c; stroke-width: 2; }
      .cream { fill: #fff9df; stroke: #23201c; stroke-width: 3; }
      .folder { fill: #fffaf0; stroke: #23201c; stroke-width: 3; }
      .line { fill: none; stroke: #23201c; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #547b47; stroke-width: 4; stroke-dasharray: 13 11; stroke-linecap: round; marker-end: url(#arrow); }
      text { font-family: "Segoe Print", "Comic Sans MS", "Bradley Hand", cursive; fill: #23201c; }
      .title { font-size: 62px; font-weight: 800; letter-spacing: 0; }
      .sub { font-size: 25px; fill: #5e574c; }
      .h { font-size: 30px; font-weight: 800; }
      .h2 { font-size: 24px; font-weight: 800; }
      .body { font-size: 22px; }
      .small { font-size: 18px; fill: #484238; }
      .tiny { font-size: 15px; fill: #4d463c; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1100" filter="url(#paper)"/>

  <g transform="rotate(-2 320 75)">
    <rect class="tape" x="238" y="42" width="190" height="34" rx="4"/>
  </g>
  <text class="title" x="90" y="94">WORK BRAIN: FROM RAW NOISE TO USEFUL MEMORY</text>
  <text class="sub" x="94" y="134">Voice memos, docs, PDFs, and messy notes go in. Organized knowledge, reminders, and boss-ready answers come out.</text>

  <g transform="translate(88 186)">
    <rect class="panel" x="0" y="0" width="310" height="650" rx="18"/>
    <rect class="tape" x="48" y="-17" width="132" height="30" rx="4" transform="rotate(-4 48 -17)"/>
    <text class="h" x="28" y="48">1. Feed the Brain</text>
    <text class="small" x="30" y="86">Raw inputs can be ugly.</text>
    <text class="small" x="30" y="111">That is the point.</text>

    <g transform="translate(28 148)">
      <rect class="cream" x="0" y="0" width="250" height="78" rx="12"/>
      <circle class="red" cx="31" cy="39" r="15"/>
      <text class="body" x="62" y="34">Voice memo</text>
      <text class="tiny" x="62" y="58">transcription block</text>
    </g>
    <g transform="translate(28 246)">
      <rect class="cream" x="0" y="0" width="250" height="78" rx="12"/>
      <path d="M30 20 h48 v40 h-48 z M38 31 h31 M38 43 h31 M38 55 h20" fill="none" stroke="#23201c" stroke-width="3"/>
      <text class="body" x="92" y="34">Raw text files</text>
      <text class="tiny" x="92" y="58">as-is notes</text>
    </g>
    <g transform="translate(28 344)">
      <rect class="cream" x="0" y="0" width="250" height="78" rx="12"/>
      <path d="M33 18 h42 l18 18 v31 h-60 z" fill="#fff" stroke="#23201c" stroke-width="3"/>
      <text class="h2" x="44" y="55">PDF</text>
      <text class="body" x="108" y="34">PDFs</text>
      <text class="tiny" x="108" y="58">uploaded as-is</text>
    </g>
    <g transform="translate(28 442)">
      <rect class="cream" x="0" y="0" width="250" height="78" rx="12"/>
      <path d="M34 18 h52 v44 h-52 z M45 31 h30 M45 44 h30 M45 57 h21" fill="#fff" stroke="#23201c" stroke-width="3"/>
      <text class="body" x="104" y="34">Word docs</text>
      <text class="tiny" x="104" y="58">procedures, emails, lists</text>
    </g>
    <g transform="translate(28 548)">
      <circle class="green" cx="18" cy="18" r="10"/>
      <text class="small" x="42" y="24">No perfect formatting required.</text>
    </g>
  </g>

  <path class="line" d="M420 510 C485 510, 500 510, 560 510"/>

  <g transform="translate(565 190)">
    <rect class="panel" x="0" y="0" width="355" height="650" rx="18"/>
    <rect class="tape" x="136" y="-18" width="150" height="31" rx="4" transform="rotate(3 136 -18)"/>
    <text class="h" x="28" y="48">2. Follow the Rules</text>
    <text class="small" x="30" y="85">The agent reads the operating</text>
    <text class="small" x="30" y="111">instructions before filing anything.</text>

    <g transform="translate(32 150)">
      <rect class="panel-soft" x="0" y="0" width="290" height="118" rx="14"/>
      <text class="h2" x="22" y="38">AGENTS + SCHEMA</text>
      <text class="small" x="22" y="68">What counts as a plan,</text>
      <text class="small" x="22" y="94">person, process, reminder.</text>
    </g>
    <g transform="translate(32 295)">
      <rect class="panel-soft" x="0" y="0" width="290" height="118" rx="14"/>
      <text class="h2" x="22" y="38">INGEST WORKFLOW</text>
      <text class="small" x="22" y="68">Capture source, extract objects,</text>
      <text class="small" x="22" y="94">update index, append log.</text>
    </g>
    <g transform="translate(32 440)">
      <rect class="panel-soft" x="0" y="0" width="290" height="138" rx="14"/>
      <text class="h2" x="22" y="38">MEMORY RULE</text>
      <text class="small" x="22" y="68">New data never floats away.</text>
      <text class="small" x="22" y="94">It lands on named pages,</text>
      <text class="small" x="22" y="120">with links and history.</text>
    </g>
  </g>

  <path class="line" d="M944 510 C990 510, 1013 510, 1050 510"/>

  <g transform="translate(1055 174)">
    <rect class="panel" x="0" y="0" width="660" height="682" rx="18"/>
    <rect class="tape" x="380" y="-17" width="160" height="32" rx="4" transform="rotate(-3 380 -17)"/>
    <text class="h" x="30" y="48">3. Chunk It Into Useful Folders</text>
    <text class="small" x="32" y="85">The brain breaks one messy input into many clean pages.</text>
    <text class="small" x="32" y="111">Each page has a job, a status, links, and history.</text>

    <g transform="translate(34 154)">
      <path class="folder" d="M0 28 h96 l22 24 h166 q14 0 14 14 v92 q0 14-14 14 h-270 q-14 0-14-14 v-116 q0-14 14-14 z"/>
      <text class="h2" x="24" y="83">01 Daily Dumps</text>
      <text class="tiny" x="24" y="112">source summary + open items</text>
    </g>
    <g transform="translate(342 154)">
      <path class="folder" d="M0 28 h96 l22 24 h166 q14 0 14 14 v92 q0 14-14 14 h-270 q-14 0-14-14 v-116 q0-14 14-14 z"/>
      <text class="h2" x="24" y="83">02 Plans</text>
      <text class="tiny" x="24" y="112">client status + next action</text>
    </g>
    <g transform="translate(34 344)">
      <path class="folder" d="M0 28 h96 l22 24 h166 q14 0 14 14 v92 q0 14-14 14 h-270 q-14 0-14-14 v-116 q0-14 14-14 z"/>
      <text class="h2" x="24" y="83">04 People</text>
      <text class="tiny" x="24" y="112">contacts + open asks</text>
    </g>
    <g transform="translate(342 344)">
      <path class="folder" d="M0 28 h96 l22 24 h166 q14 0 14 14 v92 q0 14-14 14 h-270 q-14 0-14-14 v-116 q0-14 14-14 z"/>
      <text class="h2" x="24" y="83">05 Processes</text>
      <text class="tiny" x="24" y="112">rules, lessons, checklists</text>
    </g>
    <g transform="translate(34 534)">
      <path class="folder" d="M0 28 h96 l22 24 h166 q14 0 14 14 v92 q0 14-14 14 h-270 q-14 0-14-14 v-116 q0-14 14-14 z"/>
      <text class="h2" x="24" y="83">06 Reminders</text>
      <text class="tiny" x="24" y="112">silence, risk, forgotten tasks</text>
    </g>
    <g transform="translate(342 534)">
      <path class="folder" d="M0 28 h96 l22 24 h166 q14 0 14 14 v92 q0 14-14 14 h-270 q-14 0-14-14 v-116 q0-14 14-14 z"/>
      <text class="h2" x="24" y="83">08 Reports</text>
      <text class="tiny" x="24" y="112">snapshots, profiles, briefs</text>
    </g>
  </g>

  <g transform="translate(95 902)">
    <rect class="panel" x="0" y="0" width="500" height="146" rx="18"/>
    <text class="h" x="26" y="44">Why It Matters</text>
    <text class="body" x="28" y="82">The system turns scattered knowledge into a reliable operating map.</text>
    <text class="body" x="28" y="114">No more "I know I said that somewhere" hunting.</text>
  </g>

  <path class="line" d="M610 975 C674 975, 690 975, 742 975"/>

  <g transform="translate(760 902)">
    <rect class="panel" x="0" y="0" width="445" height="146" rx="18"/>
    <text class="h" x="26" y="44">Ask It Anything</text>
    <text class="body" x="28" y="82">Current caseload. Stale risks. People maps. Process digests.</text>
    <text class="body" x="28" y="114">Boss-ready one-pagers. Training guides. Weekly plans.</text>
  </g>

  <path class="line" d="M1221 975 C1280 975, 1300 975, 1350 975"/>

  <g transform="translate(1365 902)">
    <rect class="panel" x="0" y="0" width="350" height="146" rx="18"/>
    <text class="h" x="26" y="44">Never Forgets</text>
    <text class="body" x="28" y="82">Every mention adds history.</text>
    <text class="body" x="28" y="114">Quiet items can resurface as reminders.</text>
  </g>

  <path class="loop" d="M1570 884 C1655 748, 1656 330, 1438 284"/>
  <text class="small" x="1515" y="686" transform="rotate(-72 1515 686)">keep feeding it</text>
  <text class="small" x="1537" y="718" transform="rotate(-72 1537 718)">it keeps organizing</text>

  <g transform="translate(450 392)">
    <circle class="yellow" cx="0" cy="0" r="22"/>
    <text class="h2" x="-8" y="9">+</text>
  </g>
  <g transform="translate(982 392)">
    <circle class="green" cx="0" cy="0" r="22"/>
    <text class="h2" x="-8" y="9">+</text>
  </g>

  <g transform="translate(1272 92)">
    <rect class="panel-soft" x="0" y="0" width="410" height="58" rx="16"/>
    <circle class="green" cx="34" cy="29" r="11"/>
    <text class="body" x="60" y="36">Ever-evolving brain, not a static archive.</text>
  </g>

  <g transform="translate(96 858)">
    <text class="tiny" x="0" y="0">Current Work Brain folders: daily dumps, plans, projects, people, processes, reminders, brief sheets, reports.</text>
  </g>
</svg>
