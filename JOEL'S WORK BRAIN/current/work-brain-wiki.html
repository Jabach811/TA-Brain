f the sheet is locked…</li><li>Key takeaway: It is okay for an FMC estimate not to trade; it is not okay for a trade to happen with no FMC record.</li></ul>\n<h3 id=\"informatica-election-load-troubleshooting-lesson/05\">Informatica Election Load Troubleshooting <code>lesson/05</code></h3>\n<ul><li>Category: Informatica</li><li>Plan in question: Reusable lesson</li><li>Source: <code>05-processes/informatica-election-load-troubleshooting.md</code></li><li>Issue: When an Informatica elections load kicks out because participants exist in the plan but not on the import file, pause and diagnose before switching tools.</li><li>Resolution: Identify participants in the plan but missing from the import file; Confirm whether those participants should be excluded or added; Ask Dave Shloat or another Informatica SME if override behavior exists.</li><li>Key takeaway: On 2026-04-28 Joel hit an elections load blocker. If Informatica cannot be made to work, EDS may be the fallback, but the root issue should be understood first.</li></ul>\n<h3 id=\"informatica-file-separation-lesson/06\">Informatica File Separation <code>lesson/06</code></h3>\n<ul><li>Category: Loans</li><li>Plan in question: Calliditas</li><li>Source: <code>05-processes/informatica-file-separation.md</code></li><li>Issue: Keep live files and working files in separate folders when running Informatica loads.</li><li>Resolution: Put live input files in a clean folder; Move drafts/working files somewhere else; Confirm the parameter file points to the intended input file.</li><li>Key takeaway: Calliditas showed that a parameter file can reference the wrong input file when multiple similar files sit in the same folder. The workflow may appear successful while nothing expected lands in P3.</li></ul>\n<h3 id=\"informatica-loan-troubleshooting-lesson/07\">Informatica Loan Troubleshooting <code>lesson/07</code></h3>\n<ul><li>Category: Loans</li><li>Plan in question: Calliditas</li><li>Source: <code>05-processes/informatica-loan-troubleshooting.md</code></li><li>Issue: If Informatica says a loan load succeeded but P3 does not show the expected result, do not stop at the success message.</li><li>Resolution: Confirm the parameter file points to the right input file; Confirm the input file header/source matches expectations; Check case number / plan references.</li><li>Key takeaway: Calliditas showed a silent-style failure where the workflow appeared fine, but the P3 step did not show the expected load because the parameter file referenced the wrong input file.</li></ul>\n<h3 id=\"limited-access-census-freshness-lesson/17\">Limited Access Census Freshness <code>lesson/17</code></h3>\n<ul><li>Category: Payroll</li><li>Plan in question: Medical College of Wisconsin</li><li>Source: <code>05-processes/limited-access-census-freshness.md</code></li><li>Issue: An early census was treated like the final limited-access population, but a later block of hires was missing.</li><li>Resolution: Plan In Question medical-college-of-wisconsin Issue An early census was treated like the final limited-access population, but a later block of hires was missing. Resolution Ask whether the population will change, whether there are upcoming hire blocks, and wh…</li><li>Key takeaway: Limited access needs a final-enough census early enough for TC checks and participant access.</li></ul>\n<h3 id=\"loan-report-mismatch-handling-lesson/31\">Loan Report Mismatch Handling <code>lesson/31</code></h3>\n<ul><li>Category: Loans</li><li>Plan in question: Denali Water Solutions / Wallace Farm</li><li>Source: <code>05-processes/loan-report-mismatch-handling.md</code></li><li>Issue: Loan reports showed payments tied to a fund that did not line up cleanly with the loan.</li><li>Resolution: Plan In Question denali-water-solutions-wallace-farm Issue Loan reports showed payments tied to a fund that did not line up cleanly with the loan. Resolution Aggregate/massage the loan data only after confirming totals and understanding which fund reporting a…</li><li>Key takeaway: A small loan count can still hide a messy reporting issue.</li></ul>\n<h3 id=\"loan-review-discipline-lesson/08\">Loan Review Discipline <code>lesson/08</code></h3>\n<ul><li>Category: Loans</li><li>Plan in question: Calliditas</li><li>Source: <code>05-processes/loan-review-discipline.md</code></li><li>Issue: Small loan files still require slow, careful validation.</li><li>Resolution: go slow; check the output; inspect each loan.</li><li>Key takeaway: The trap is thinking that a small file is safe because it loaded. Loaded does not mean correct. The better rule is almost the opposite: if the file is small, there is no excuse not to inspect every record.</li></ul>\n<h3 id=\"mapping-day-one-readiness-lesson/21\">Mapping Day-One Readiness <code>lesson/21</code></h3>\n<ul><li>Category: Payroll</li><li>Plan in question: Cardinal Heating</li><li>Source: <code>05-processes/mapping-day-one-readiness.md</code></li><li>Issue: Money that should have been mapped day one was placed in Advanced Employer because the mapping path was not ready.</li><li>Resolution: Plan In Question cardinal-heating Issue Money that should have been mapped day one was placed in Advanced Employer because the mapping path was not ready. Resolution Read final files correctly, know the expected mapped funds, and be prepared to apply money th…</li><li>Key takeaway: Mapping plans are not wait-and-see plans once wire/final-file data is available.</li></ul>\n<h3 id=\"multi-plan-id-separation-lesson/27\">Multi-Plan ID Separation <code>lesson/27</code></h3>\n<ul><li>Category: Payroll</li><li>Plan in question: Vera Institute of Justice</li><li>Source: <code>05-processes/multi-plan-id-separation.md</code></li><li>Issue: Multi-plan implementations can blur vendor plan numbers and TA plan numbers.</li><li>Resolution: Plan In Question vera-institute-of-justice Issue Multi-plan implementations can blur vendor plan numbers and TA plan numbers. Resolution Keep a clear crosswalk of vendor plan IDs, TA plan IDs, file names, and processing steps for each plan. Why It Matters Tre…</li><li>Key takeaway: Treat related plans as related, not interchangeable.</li></ul>\n<h3 id=\"mva-funding-and-wire-handling-lesson/26\">MVA Funding And Wire Handling <code>lesson/26</code></h3>\n<ul><li>Category: Payroll</li><li>Plan in question: Pella Carolina</li><li>Source: <code>05-processes/mva-funding-and-wire-handling.md</code></li><li>Issue: MVA funding and later-arriving money were not nailed down early enough.</li><li>Resolution: Plan In Question pella-carolina Issue MVA funding and later-arriving money were not nailed down early enough. Resolution Identify whether MVA is participant-funded, covered by a separate wire, or handled another way; track every wire component when it arrives…</li><li>Key takeaway: Every dollar needs an owner and a destination before conversion day.</li></ul>\n<h3 id=\"nbi-update-after-load-lesson/09\">NBI Update After Load <code>lesson/09</code></h3>\n<ul><li>Category: NBI</li><li>Plan in question: Reusable lesson</li><li>Source: <code>05-processes/nbi-update-after-load.md</code></li><li>Issue: After census, elections, balances, or other deliverables are loaded and checked, send the NBI/status update promptly.</li><li>Resolution: Confirm the load is complete; Do a quick quality check; Confirm expected participants/elections/balances show correctly.</li><li>Key takeaway: When NBI was down in late April, updates stacked up. The catch-up work created risk that loaded work would not be visible to the broader team.</li></ul>\n<h3 id=\"nqdc-excess-asset-handling-lesson/33\">NQDC Excess Asset Handling <code>lesson/33</code></h3>\n<ul><li>Category: Payroll</li><li>Plan in question: Thunder Valley Casino</li><li>Source: <code>05-processes/nqdc-excess-asset-handling.md</code></li><li>Issue: A large extra amount appeared that was not participant money.</li><li>Resolution: Plan In Question thunder-valley-casino Issue A large extra amount appeared that was not participant money. Resolution Confirm whether the difference is participant money, asset-liability variance, dividend, or forfeiture/excess asset before allocating. Why It…</li><li>Key takeaway: NQDC money may not reconcile one-to-one to participant balances.</li></ul>\n<h3 id=\"p2-ref-number-fund-link-lesson/10\">P2 Ref Number Fund Link <code>lesson/10</code></h3>\n<ul><li>Category: Plan setup</li><li>Plan in question: COCC</li><li>Source: <code>05-processes/p2-ref-number-fund-link.md</code></li><li>Issue: When you create a reference number in P2, you must point it to the fund in P3.</li><li>Resolution: In P2: create the reference number; In P3: sign in (Edge) and point the reference to the correct fund; Confirm it is not stuck in limbo before moving on.</li><li>Key takeaway: If the P2 reference is not pointed to the fund in P3, the work can get stuck in limbo and require Product Support to fix. This is a preventable trap during finish-line posting (ex: COCC).</li></ul>\n<h3 id=\"payroll-file-delivery-troubleshooting-lesson/11\">Payroll File Delivery Troubleshooting <code>lesson/11</code></h3>\n<ul><li>Category: Payroll</li><li>Plan in question: COCC, Havern School</li><li>Source: <code>05-processes/payroll-file-delivery-troubleshooting.md</code></li><li>Issue: Use this when payroll contacts say a test or payroll file was sent, but Joel cannot find it in the expected FTP/intake location.</li><li>Resolution: 1. Confirm the exact sender, send date/time, filename, and destination folder. 2. Check whether the sender used the actual payroll company path or an advisor/intermediary path. 3. Confirm the specs were sent to the party who is actually building the file. 4.…</li><li>Key takeaway: Use this when payroll contacts say a test or payroll file was sent, but Joel cannot find it in the expected FTP/intake location.</li></ul>\n<h3 id=\"payroll-vendor-deadline-enforcement-lesson/18\">Payroll Vendor Deadline Enforcement <code>lesson/18</code></h3>\n<ul><li>Category: Payroll</li><li>Plan in question: Church Farm School</li><li>Source: <code>05-processes/payroll-vendor-deadline-enforcement.md</code></li><li>Issue: Payroll setup dragged because external contacts were slow and follow-up was not firm enough early.</li><li>Resolution: Plan In Question church-farm-school Issue Payroll setup dragged because external contacts were slow and follow-up was not firm enough early. Resolution Maintain deadline integrity, state what is needed, and escalate from friendly asks to direct operating requ…</li><li>Key takeaway: Payroll vendors do not automatically protect your deadlines; the DC has to keep the project moving.</li></ul>\n<h3 id=\"pella-adp-deferral-handling-lesson/12\">Pella ADP Deferral Handling <code>lesson/12</code></h3>\n<ul><li>Category: Payroll</li><li>Plan in question: Pella</li><li>Source: <code>05-processes/pella-adp-deferral-handling.md</code></li><li>Issue: For Pella ADP data, chase the deferral report early and assume the default-election status may be ambiguous.</li><li>Resolution: Identify the real client/vendor contact early; Request the deferral report early; Confirm liquidation/wire timing.</li><li>Key takeaway: ADP records may not allow full confidence about whether participants are truly in default and still within the auto-escalation window. Waiting too long for the report created pain in the prior Pella work.</li></ul>\n<h3 id=\"recovery-ownership-after-a-plan-goes-sideways-lesson/37\">Recovery Ownership After A Plan Goes Sideways <code>lesson/37</code></h3>\n<ul><li>Category: Payroll</li><li>Plan in question: Sibley Memorial Hospital</li><li>Source: <code>05-processes/recovery-ownership-after-plan-goes-sideways.md</code></li><li>Issue: Sibley/Cardinal created a personal and operational low point, but Joel recovered by asking for help and staying with the work.</li><li>Resolution: Plan In Question sibley-memorial-hospital Issue Sibley/Cardinal created a personal and operational low point, but Joel recovered by asking for help and staying with the work. Resolution Lean on senior help, clarify whether the issue is recoverable, and then o…</li><li>Key takeaway: A bad plan can become the turning point if it changes the operating discipline going forward.</li></ul>\n<h3 id=\"reference-number-cleanup-lesson/13\">Reference Number Cleanup <code>lesson/13</code></h3>\n<ul><li>Category: Plan setup</li><li>Plan in question: COCC</li><li>Source: <code>05-processes/reference-number-cleanup.md</code></li><li>Issue: When a bad reference number/source issue appears, capture the exact bad ref, the short/incorrect amount, and whether the original ref number also needs deletion.</li><li>Resolution: Identify the bad reference number; Identify the correct reference number; Confirm the short/incorrect amount.</li><li>Key takeaway: COCC had a bad reference number/source cleanup issue tied to a short amount. The details matter because deleting or correcting the wrong reference can create more cleanup.</li></ul>\n<h3 id=\"secondary-fund-code-mapping-lesson/32\">Secondary Fund-Code Mapping <code>lesson/32</code></h3>\n<ul><li>Category: Payroll</li><li>Plan in question: Health Concepts</li><li>Source: <code>05-processes/secondary-fund-code-mapping.md</code></li><li>Issue: Health Concepts had 80+ funds and Nationwide secondary fund codes that made mapping harder.</li><li>Resolution: Plan In Question health-concepts Issue Health Concepts had 80+ funds and Nationwide secondary fund codes that made mapping harder. Resolution Map both the visible fund and secondary code layer so TOA/final records reconcile. Why It Matters Some vendors requir…</li><li>Key takeaway: Some vendors require two mapping dimensions before the money makes sense.</li></ul>\n<h3 id=\"startup-treated-merger-deferrals-lesson/14\">Startup-Treated Merger Deferrals <code>lesson/14</code></h3>\n<ul><li>Category: Payroll</li><li>Plan in question: International School of Denver</li><li>Source: <code>05-processes/startup-treated-merger-deferrals.md</code></li><li>Issue: When an existing plan is treated like a startup, deferral loading may need special handling so participants can be live without un-QC&#x27;d elections showing.</li><li>Resolution: do not load deferrals before live date; let participants enter changes after access opens; later load the client-provided deferral file with the live effective date.</li><li>Key takeaway: International School of Denver raised a tricky pattern: the plan behaves like a startup, but participants may already have existing payroll/election context. Loading elections on live date could create a QC delay or visible bad data.</li></ul>\n<h3 id=\"transfer-in-kind-residual-dividends-lesson/30\">Transfer-In-Kind Residual Dividends <code>lesson/30</code></h3>\n<ul><li>Category: Payroll</li><li>Plan in question: COCC</li><li>Source: <code>05-processes/transfer-in-kind-residual-dividends.md</code></li><li>Issue: COCC had residual dividends, staged share movement, and reports with front-loaded monthly dividend values.</li><li>Resolution: Plan In Question cocc Issue COCC had residual dividends, staged share movement, and reports with front-loaded monthly dividend values. Resolution Separate actual received shares/cash from front-loaded report values, process in chunks when needed, and prorate…</li><li>Key takeaway: TIK residuals need their own tracking lane; reports may include values that have not arrived yet.</li></ul>\n<h3 id=\"transfer-in-kind-setup-timing-lesson/23\">Transfer-In-Kind Setup Timing <code>lesson/23</code></h3>\n<ul><li>Category: Payroll</li><li>Plan in question: Sibley Memorial Hospital</li><li>Source: <code>05-processes/transfer-in-kind-setup-timing.md</code></li><li>Issue: Transfer-in-kind setup/re-registration work was handled too late, adding risk when assets did not arrive as expected.</li><li>Resolution: Plan In Question sibley-memorial-hospital Issue Transfer-in-kind setup/re-registration work was handled too late, adding risk when assets did not arrive as expected. Resolution Get transfer-in-kind setup to Matt O&#x27;Connell early and verify registration/account…</li><li>Key takeaway: TIK timing is front-end work. Waiting until wire/liquidation day is already late.</li></ul>\n<h3 id=\"vesting-override-decision-lesson/15\">Vesting Override Decision <code>lesson/15</code></h3>\n<ul><li>Category: Plan setup</li><li>Plan in question: Reusable lesson</li><li>Source: <code>05-processes/vesting-override-decision.md</code></li><li>Issue: A decision rule for choosing between a broad years-of-service override and a surgical EDS source-by-source override.</li><li>Resolution: Decision Rule If all non-100% vested sources share the same rule, consider the 55 YOS catch-all. If sources differ or only some sources should be overridden, use EDS by source ID.</li><li>Key takeaway: A decision rule for choosing between a broad years-of-service override and a surgical EDS source-by-source override.</li></ul>\n<h3 id=\"wire-readiness-before-money-arrives-lesson/16\">Wire Readiness Before Money Arrives <code>lesson/16</code></h3>\n<ul><li>Category: Payroll</li><li>Plan in question: Educators Credit Union</li><li>Source: <code>05-processes/wire-readiness-before-money-arrives.md</code></li><li>Issue: A wire arrived before Joel understood exactly what money was expected or what process would be needed.</li><li>Resolution: Plan In Question educators-credit-union Issue A wire arrived before Joel understood exactly what money was expected or what process would be needed. Resolution Use meetings and plan coding to identify expected wires before receipt; if money is coming, know wh…</li><li>Key takeaway: The wire should never be the first time the DC realizes money is involved.</li></ul>\n<h3 id=\"years-of-service-vesting-validation-lesson/25\">Years Of Service Vesting Validation <code>lesson/25</code></h3>\n<ul><li>Category: Payroll</li><li>Plan in question: Stamets</li><li>Source: <code>05-processes/years-of-service-vesting-validation.md</code></li><li>Issue: Late base-file timing made years-of-service and vesting validation harder than it needed to be.</li><li>Resolution: Plan In Question stamets Issue Late base-file timing made years-of-service and vesting validation harder than it needed to be. Resolution Compare vendor years-of-service data against TA/load data and resolve vesting presentation before go-live pressure. Why I…</li><li>Key takeaway: Years of service is not just a census field; it can change what participants see online.</li></ul>", "resolvedLinks": [], "backlinks": []}], "counts": {"wikiPages": 40, "sources": 38, "rawFiles": 40}}</script>
  <script>
    const payload = JSON.parse(document.getElementById("wikiPayload").textContent);
    const pages = payload.pages;
    const namespaceInfo = payload.namespaceInfo;
    const namespaceOrder = payload.namespaceOrder;
    const pageMap = new Map(pages.map(page => [page.id, page]));
    const qs = sel => document.querySelector(sel);
    function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
    function openPage(id, updateHash = true) {
      if (id === "__home") { renderHome(); if (updateHash) history.replaceState(null, "", "#__home"); return; }
      if (id === "__all-pages") { renderAllPages(); if (updateHash) history.replaceState(null, "", "#__all-pages"); return; }
      const page = pageMap.get(id) || pages[0];
      qs(".article-shell").classList.toggle("lesson-mode", page.id === "one-offs/running-sheet");
      qs("#article").innerHTML = renderArticle(page);
      renderRightRail(page);
      renderSidebar(page.id);
      qs("#breadcrumbs").innerHTML = "Joel's Work Brain / " + escapeHtml(namespaceInfo[page.namespace].label) + " / <strong>" + escapeHtml(page.title) + "</strong>";
      qs("#pageMetaShort").textContent = namespaceInfo[page.namespace].label + " / " + (page.updated || "unknown");
      if (updateHash) history.replaceState(null, "", "#" + page.id);
      qs("#sidebar").classList.remove("open");
    }
    function renderSidebar(currentId = "") {
      qs("#sidebarNav").innerHTML = namespaceOrder.map(ns => {
        const group = pages.filter(page => page.namespace === ns).sort((a,b) => a.title.localeCompare(b.title));
        if (!group.length) return "";
        const open = currentId ? group.some(page => page.id === currentId) : ["plans","open-items","one-offs"].includes(ns);
        return `<details class="namespace" ${open ? "open" : ""}><summary><span>${escapeHtml(namespaceInfo[ns].label)}</span><span class="count">${group.length}</span></summary><ul class="nav-list">${group.map(page => `<li><button class="nav-item ${page.id === currentId ? "active" : ""}" data-open="${escapeHtml(page.id)}" type="button">${escapeHtml(page.title)}</button></li>`).join("")}</ul></details>`;
      }).join("");
    }
    function renderArticle(page) {
      if (page.id === "one-offs/running-sheet") return renderLessonRegister(page);
      return `<h1><span class="h1-title">${escapeHtml(page.title)}</span></h1><p class="lede">${escapeHtml(page.summary)}</p><div class="metadata-line">${escapeHtml(namespaceInfo[page.namespace].label)} / <code>${escapeHtml(page.rel)}</code> / Updated ${escapeHtml(page.updated || "unknown")} / ${page.sources} source${page.sources === 1 ? "" : "s"}</div>${page.html}`;
    }
    function renderLessonRegister(page) {
      const entries = page.lessonEntries || [];
      const categories = ["All", ...Array.from(new Set(entries.map(entry => entry.category))).sort()];
      const planCount = new Set(entries.map(entry => entry.planTitle || "General / cross-plan")).size;
      return `<section class="lesson-register"><div class="lesson-hero"><h1>Lessons Register</h1><p>A field log for things worth remembering: what plan/context exposed the issue, what actually went wrong, how it was resolved, and the rule to carry into the next plan.</p><div class="lesson-metrics"><div class="lesson-metric"><strong>${entries.length}</strong><span>lessons</span></div><div class="lesson-metric"><strong>${categories.length - 1}</strong><span>buckets</span></div><div class="lesson-metric"><strong>${planCount}</strong><span>plan contexts</span></div></div></div><div class="lesson-toolbar">${categories.map((category, index) => `<button type="button" class="lesson-filter ${index === 0 ? "active" : ""}" data-lesson-filter="${escapeHtml(category)}">${escapeHtml(category)}</button>`).join("")}</div><div class="lesson-grid">${entries.map(entry => renderLessonCard(entry)).join("")}</div></section>`;
    }
    function renderLessonCard(entry) {
      const plan = entry.planId ? `<span class="wiki-link lesson-plan" data-open="${escapeHtml(entry.planId)}">${escapeHtml(entry.planDetail || entry.planTitle)}</span>` : `<span class="lesson-plan">${escapeHtml(entry.planDetail || entry.planTitle)}</span>`;
      return `<article class="lesson-card" data-category="${escapeHtml(entry.category)}"><aside class="lesson-side"><span class="lesson-id">${escapeHtml(entry.caseId || entry.category)}</span><h2 class="lesson-title">${escapeHtml(entry.title)}</h2><span class="tag">${escapeHtml(entry.category)}</span>${plan}<div class="lesson-source">${escapeHtml(entry.rel)} / ${escapeHtml(entry.updated)}</div></aside><div class="lesson-body"><section class="lesson-cell"><span class="lesson-label">Issue</span><p>${escapeHtml(entry.issue)}</p></section><section class="lesson-cell"><span class="lesson-label">Resolution</span><p>${escapeHtml(entry.resolution)}</p></section><section class="lesson-cell lesson-takeaway"><span class="lesson-label">Key Takeaway</span><p>${escapeHtml(entry.takeaway)}</p></section></div></article>`;
    }
    function renderRightRail(page) {
      if (!page) {
        qs("#rightRail").innerHTML = `<div class="infobox"><div class="infobox-title">Work Brain</div><div class="infobox-row"><div class="infobox-key">Pages</div><div class="infobox-value">${payload.counts.wikiPages}</div></div><div class="infobox-row"><div class="infobox-key">Plans</div><div class="infobox-value">${payload.counts.sources}</div></div></div>`;

      }

        qs("#rightRail").innerHTML = "";

      const toc = page.headings || [];
      const backlinks = page.backlinks || [];
      const metaRows = page.metadataRows && page.metadataRows.length
        ? page.metadataRows.map(row => `<div class="infobox-row"><div class="infobox-key">${escapeHtml(row.key)}</div><div class="infobox-value">${row.value}</div></div>`).join("")
        : `<div class="infobox-row"><div class="infobox-key">Type</div><div class="infobox-value">${escapeHtml(namespaceInfo[page.namespace].label)}</div></div><div class="infobox-row"><div class="infobox-key">Source</div><div class="infobox-value">${escapeHtml(page.rel)}</div></div><div class="infobox-row"><div class="infobox-key">Updated</div><div class="infobox-value">${escapeHtml(page.updated || "unknown")}</div></div>`;
      qs("#rightRail").innerHTML =
        `<div class="infobox"><div class="infobox-title">${escapeHtml(page.title)}</div>${metaRows}</div>` +
        (toc.length ? `<section class="rail-box"><h3>Contents</h3><ol class="toc-list">${toc.map(h => `<li><a href="#${escapeHtml(h.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""))}">${escapeHtml(h)}</a></li>`).join("")}</ol></section>` : "") +
        (page.tags.length ? `<section class="rail-box"><h3>Categories</h3><div class="tag-list">${page.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div></section>` : "") +
        `<section class="rail-box"><h3>Referenced By</h3><ul class="backlink-list">${backlinks.length ? backlinks.map(link => `<li><span class="wiki-link" data-open="${escapeHtml(link.id)}">${escapeHtml(link.title)}</span></li>`).join("") : "<li>No backlinks found.</li>"}</ul></section>`;
    }
    function renderHome() {
      qs(".article-shell").classList.remove("lesson-mode");
      const recent = [...pages].sort((a,b) => String(b.updated).localeCompare(String(a.updated))).slice(0, 12);
      const cornerstone = ["open-items/open-items-dashboard","plans/pella","plans/banayn","plans/international-school-of-denver","one-offs/running-sheet"].map(id => pageMap.get(id)).filter(Boolean);
      qs("#article").innerHTML = `<h1><span class="h1-title">Joel's Work Brain</span></h1><p class="lede">A plan-centric tracking system built around plan information, open items, and one-off lessons. Source files are the truth; the dashboard is a generated read-only view.</p><div class="metadata-line">Generated ${escapeHtml(payload.generatedAt)} / ${payload.counts.wikiPages} pages / ${payload.counts.sources} plans</div><div class="home-grid"><section class="wiki-panel"><h2>Core Sections</h2><ul>${namespaceOrder.map(ns => `<li><span class="wiki-link" data-open="__all-pages">${escapeHtml(namespaceInfo[ns].label)}</span> <span class="metadata-line">${pages.filter(p => p.namespace === ns).length}</span></li>`).join("")}</ul></section><section class="wiki-panel"><h2>Cornerstone Articles</h2><ul>${cornerstone.map(page => `<li><span class="wiki-link" data-open="${escapeHtml(page.id)}">${escapeHtml(page.title)}</span></li>`).join("")}</ul></section><section class="wiki-panel"><h2>Recently Updated</h2><ul>${recent.map(page => `<li><span class="wiki-link" data-open="${escapeHtml(page.id)}">${escapeHtml(page.title)}</span> <span class="metadata-line">${escapeHtml(page.updated)}</span></li>`).join("")}</ul></section><section class="wiki-panel"><h2>Operating Model</h2><p>Deprecated source views are hidden from this app. Edit open items in their source files, then regenerate the dashboard.</p></section></div>`;
      renderRightRail(null); renderSidebar(""); qs("#breadcrumbs").textContent = "Joel's Work Brain / Home";
    }
    function renderAllPages() {
      qs(".article-shell").classList.remove("lesson-mode");
      qs("#article").innerHTML = `<h1>All Pages</h1><p class="lede">Every Work Brain markdown object, classified into the personal wiki namespaces.</p><div class="namespace-cards">${namespaceOrder.map(ns => { const group = pages.filter(page => page.namespace === ns).sort((a,b) => a.title.localeCompare(b.title)); return `<section class="namespace-card"><h2>${escapeHtml(namespaceInfo[ns].label)} <span class="metadata-line">${group.length}</span></h2><p>${escapeHtml(namespaceInfo[ns].description)}</p><ul>${group.map(page => `<li><span class="wiki-link" data-open="${escapeHtml(page.id)}">${escapeHtml(page.title)}</span> <span class="metadata-line">${escapeHtml(page.rel)}</span></li>`).join("")}</ul></section>`; }).join("")}</div>`;
      renderRightRail(null); renderSidebar(""); qs("#breadcrumbs").textContent = "Joel's Work Brain / All Pages";
    }
    function runSearch(query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      return pages.filter(page => [page.title, page.summary, page.rel, page.namespace].join(" ").toLowerCase().includes(q)).slice(0, 24);
    }
    document.addEventListener("click", event => {
      const opener = event.target.closest("[data-open]");
      if (opener) openPage(opener.dataset.open);
      const filter = event.target.closest("[data-lesson-filter]");
      if (filter) {
        const category = filter.dataset.lessonFilter;
        document.querySelectorAll(".lesson-filter").forEach(button => button.classList.toggle("active", button === filter));
        document.querySelectorAll(".lesson-card").forEach(card => card.classList.toggle("is-hidden", category !== "All" && card.dataset.category !== category));
      }
    });
    qs("#menuButton").addEventListener("click", () => qs("#sidebar").classList.toggle("open"));
    qs("#searchInput").addEventListener("input", event => {
      const results = runSearch(event.target.value);
      const panel = qs("#searchResults");
      panel.classList.toggle("open", !!event.target.value);
      panel.innerHTML = results.length ? results.map(page => `<button class="search-result" data-open="${escapeHtml(page.id)}" type="button"><strong>${escapeHtml(page.title)}</strong><span>${escapeHtml(namespaceInfo[page.namespace].label)} / ${escapeHtml(page.rel)}</span></button>`).join("") : `<button class="search-result" type="button"><strong>No results</strong><span>Try a plan, open item, project, or lesson.</span></button>`;
    });
    window.addEventListener("hashchange", () => openPage(location.hash.slice(1) || "__home", false));
    renderSidebar("");
    openPage(location.hash.slice(1) || "__home", false);
  </script>
</body>
</html>
