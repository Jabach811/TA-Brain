: Weekly review</li><li class=\"\"><span class=\"box\"></span>Confirm no duplicate file grabs in daily automation -- Owner: Joel / Codex; Due: 2026-05-06; Severity: S2 High; Last mentioned: 2026-05-06; Reminder: Same day test</li></ul>\n<h3 id=\"email-mover-vba-project/04-span-class-status-tag-status-active-active-/span\">Email Mover VBA <code>project/04</code> -- <span class=\"status-tag status-active\">Active</span></h3>\n<ul class=\"check-list\"><li class=\"\"><span class=\"box\"></span>Put skin on output/userform move summary -- Owner: Joel; Due: Ongoing; Severity: S3 Medium; Last mentioned: 2026-05-06; Reminder: Side-project lane</li><li class=\"\"><span class=\"box\"></span>Review/refactor VBA macros and userforms -- Owner: Joel; Due: Ongoing; Severity: S3 Medium; Last mentioned: 2026-05-06; Reminder: Side-project lane</li></ul>\n<h3 id=\"lumina-/-illumina-ai-service-project/05-span-class-status-tag-status-active-active-/span\">Lumina / Illumina AI Service <code>project/05</code> -- <span class=\"status-tag status-active\">Active</span></h3>\n<ul class=\"check-list\"><li class=\"\"><span class=\"box\"></span>Prep AI presentation deck/demo examples for Nick / manager meeting -- Owner: Joel; Due: 2026-05-08; Severity: S2 High; Last mentioned: 2026-05-07; Reminder: Before meeting</li><li class=\"\"><span class=\"box\"></span>Confirm what Lumina/Illumina can do vs Copilot -- Owner: Joel; Severity: S3 Medium; Last mentioned: 2026-05-06; Reminder: Weekly review</li><li class=\"\"><span class=\"box\"></span>Identify 1-2 concrete use-cases to pilot (automation, report generation, macros) -- Owner: Joel; Severity: S3 Medium; Last mentioned: 2026-05-06; Reminder: Weekly review</li><li class=\"\"><span class=\"box\"></span>Follow up with Nick on next steps / rollout -- Owner: Joel / Nick; Severity: S3 Medium; Last mentioned: 2026-05-06; Reminder: Weekly check</li></ul>\n<h3 id=\"profile-builder-project/06-span-class-status-tag-status-active-active-/span\">Profile Builder entioned: 2026-05-06; Reminder: Weekly project check</li></ul>\n<h3 id=\"visual-deliverables-and-pitch-decks-project/08-span-class-status-tag-status-active-active-/span\">Visual Deliverables and Pitch Decks <code>project/08</code> -- <span class=\"status-tag status-active\">Active</span></h3>\n<ul class=\"check-list\"><li class=\"\"><span class=\"box\"></span>Prep the strongest decks/examples for the 2026-05-08 AI meeting -- Owner: Joel; Due: 2026-05-08; Severity: S2 High; Last mentioned: 2026-05-07; Reminder: Before meeting</li><li class=\"\"><span class=\"box\"></span>Build a few more strong deliverables for next boss review -- Owner: Joel; Due: End of next month target; Severity: S3 Medium; Last mentioned: 2026-04-27; Reminder: Weekly project check</li><li class=\"\"><span class=\"box\"></span>Keep compiling input files for visuals and walkthroughs -- Owner: Joel; Due: Ongoing; Severity: S3 Medium; Last mentioned: 2026-05-07; Reminder: Weekly project check</li><li class=\"\"><span class=\"box\"></span>Show the work to Anita / other leaders if a good opening appears -- Owner: Joel; Due: When possible; Severity: S3 Medium; Last mentioned: 2026-05-07; Reminder: Weekly project check</li></ul>", "resolvedLinks": [], "backlinks": []}, {"id": "one-offs/running-sheet", "slug": "running-sheet", "namespace": "one-offs", "namespaceLabel": "One-off / Lessons Learned", "namespaceDescription": "Internal projects and durable one-off lessons.", "rel": "one-offs-running-sheet.md", "title": "Lessons Register", "summary": "A custom register for reusable lessons. Each entry names the plan/context, the issue, the resolution, and the key takeaway.", "updated": "2026-05-08", "created": "", "sources": 37, "tags": ["one-off", "lesson", "running-sheet", "work-brain"], "headings": ["Register"], "metadataRows": [{"key": "Type", "value": "Lessons register"}, {"key": "Status", "value": "<span class=\"status-tag status-active\">Active</span>"}, {"key": "Updated", "value": "2026-05-08"}, {"key": "Sources", "value": "37"}, {"key": "Linked from", "value": "Lessons source folder"}], "status": "Active", "caseId": "", "links": [], "lessonEntries": [{"group": "Lessons", "type": "lesson", "title": "ADP Segmented Ownership Model", "category": "Payroll", "caseId": "lesson/19", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/adp-segmented-ownership-model.md", "planTitle": "AVL USA", "planId": "plans/avl-usa", "planDetail": "", "issue": "ADP work stalled because different ADP groups owned specs, system setup, file initiation, and file transmission.", "resolution": "Plan In Question avl-usa Issue ADP work stalled because different ADP groups owned specs, system setup, file initiation, and file transmission. Resolution Identify the owner for each ADP step and make sure the client and ADP understand the TA process and file…", "takeaway": "With ADP, one contact rarely owns the whole path. Map the ownership before waiting weeks on the wrong person.", "lessons": "Related Avl Usa"}, {"group": "Lessons", "type": "lesson", "title": "Advanced Employer Is Not A Parking Lot", "category": "Payroll", "caseId": "lesson/22", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/advanced-employer-not-parking-lot.md", "planTitle": "Sibley Memorial Hospital", "planId": "plans/sibley-memorial-hospital", "planDetail": "", "issue": "Money was parked in Advanced Employer even though only part of it belonged there.", "resolution": "Plan In Question sibley-memorial-hospital Issue Money was parked in Advanced Employer even though only part of it belonged there. Resolution Break down the money by processing type before receipt: mapped, hold/Advanced Employer, transfer-in-kind, residual, or…", "takeaway": "Advanced Employer is a tool, not a default answer for uncertainty.", "lessons": "Related Sibley Memorial Hospital"}, {"group": "Lessons", "type": "lesson", "title": "Advanced Employer Wire Coverage", "category": "Files", "caseId": "lesson/01", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/advanced-employer-wire-coverage.md", "planTitle": "Pella", "planId": "plans/pella", "planDetail": "", "issue": "When someone covers a wire, make clear whether the money needs to be placed into Advanced Employer and what reference/contact details they need.", "resolution": "Confirm covering person; Confirm wire date; Provide client contact.", "takeaway": "Pella needed Jessica to cover the wire while Joel was out. The key handoff was making sure she could put the wire into Advanced Employer and had the right contacts.", "lessons": "Related Pella Jessica"}, {"group": "Lessons", "type": "lesson", "title": "Advisor Group Patterns: WTW And ExcelWise", "category": "Payroll", "caseId": "lesson/36", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/advisor-group-patterns-wtw-excelwise.md", "planTitle": "TMG", "planId": "plans/tmg", "planDetail": "", "issue": "WTW and ExcelWise plans show recurring advisor-group patterns, expectations, and client intensity.", "resolution": "Plan In Question tmg Issue WTW and ExcelWise plans show recurring advisor-group patterns, expectations, and client intensity. Resolution Recognize QK63233 as WTW-style and QK63283 as ExcelWise-style work; expect thorough questions and advisor-driven urgency.…", "takeaway": "Advisor-group plans have personalities. Knowing the pattern helps set expectations early.", "lessons": "Related TMG"}, {"group": "Lessons", "type": "lesson", "title": "Ask For Help Before The Hole Gets Deep", "category": "Payroll", "caseId": "lesson/24", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/ask-for-help-before-the-hole.md", "planTitle": "Sibley Memorial Hospital", "planId": "plans/sibley-memorial-hospital", "planDetail": "", "issue": "Joel waited too long to ask questions on a complicated hybrid conversion and got stuck in a large recovery effort.", "resolution": "Plan In Question sibley-memorial-hospital Issue Joel waited too long to ask questions on a complicated hybrid conversion and got stuck in a large recovery effort. Resolution Ask Earl/Rob/manager/SMEs early when a plan has unfamiliar money movement, mapping, T…", "takeaway": "The earlier the question, the smaller the hole.", "lessons": "Related Sibley Memorial Hospital"}, {"group": "Lessons", "type": "lesson", "title": "Base File First", "category": "Files", "caseId": "lesson/02", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/base-file-first.md", "planTitle": "Multiple plans", "planId": "plans/banayn", "planDetail": "Banayn, International School of Denver", "issue": "After a plan is assigned or intake begins, the base file should become one of the first concrete work products.", "resolution": "Confirm plan treatment and setup assumptions; Build the base file early; Review for obvious missing fields.", "takeaway": "Base file meetings go better when the file is already prepared. Waiting creates avoidable pressure and makes it easier to get caught underprepared. Joel's shorthand from the May 5 dump: make the base file the first real move after plan int…", "lessons": "Related Banayn International School Of Denver"}, {"group": "Lessons", "type": "lesson", "title": "Blackout Report Cutoff Discipline", "category": "Loans", "caseId": "lesson/20", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/blackout-report-cutoff-discipline.md", "planTitle": "Health Advocates", "planId": "plans/health-advocates", "planDetail": "", "issue": "Vendor blackout/access cutoff prevented early loan report capture, delaying payroll restart work.", "resolution": "Plan In Question health-advocates Issue Vendor blackout/access cutoff prevented early loan report capture, delaying payroll restart work. Resolution Capture loan/election/deferral reports before blackout if access will be limited or cut off. Why It Matters If…", "takeaway": "If a report is available on demand before blackout, get it while the door is still open.", "lessons": "Related Health Advocates"}, {"group": "Lessons", "type": "lesson", "title": "Census Cleanup Across All Tables", "category": "Payroll", "caseId": "lesson/29", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/census-cleanup-all-tables.md", "planTitle": "COCC", "planId": "plans/cocc", "planDetail": "", "issue": "Participants were loaded into the wrong plan and had to be removed.", "resolution": "Plan In Question cocc Issue Participants were loaded into the wrong plan and had to be removed. Resolution When clearing a bad census load, tell Broad Support to clear every related table, not only the employee table. Why It Matters Deleting from one table is…", "takeaway": "Deleting from one table is not a clean participant removal.", "lessons": "Related COCC"}, {"group": "Lessons", "type": "lesson", "title": "Coverage Planning", "category": "Payroll", "caseId": "lesson/03", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/coverage-planning.md", "planTitle": "Pella", "planId": "plans/pella", "planDetail": "", "issue": "When Joel will be out near a wire, asset movement, payroll event, or go-live window, coverage needs to be assigned early and with contacts attached.", "resolution": "Confirm the exact out-of-office date; Identify the event that needs coverage; Assign the covering person.", "takeaway": "Late-April Pella and Havern work showed that coverage is not just \"someone knows.\" The covering person needs contacts, expected amounts if possible, plan context, and what to do with the money/data.", "lessons": "Related Pella Jessica"}, {"group": "Lessons", "type": "lesson", "title": "Day-Two Managed Advice Conversion", "category": "Payroll", "caseId": "lesson/28", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/day-two-managed-advice-conversion.md", "planTitle": "Vera Institute of Justice", "planId": "plans/vera-institute-of-justice", "planDetail": "", "issue": "Defaulted vendor participants needed a second managed-advice rebalance after the initial investment.", "resolution": "Plan In Question vera-institute-of-justice Issue Defaulted vendor participants needed a second managed-advice rebalance after the initial investment. Resolution Provide the TC with the list of participants defaulted at the vendor so day-two managed advice can…", "takeaway": "Managed advice can be a second conversion step, not just a default investment detail.", "lessons": "Related Vera Institute Of Justice"}, {"group": "Lessons", "type": "lesson", "title": "DC P3 Checklist", "category": "Plan setup", "caseId": "lesson/04", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/dc-p3-checklist.md", "planTitle": "Leiby's Dairy", "planId": "plans/leibys-dairy", "planDetail": "", "issue": "When P3 is available for a plan, run a quick standardized DC check before the work drifts.", "resolution": "Confirm sources are present; Confirm classes are present; Confirm auto-enroll details.", "takeaway": "Joel identified that early P3 checks can catch missing setup details before they turn into downstream cleanup. Leiby is the current seed plan for this checklist.", "lessons": "Related Leibys Dairy Base File First"}, {"group": "Lessons", "type": "lesson", "title": "Default Election Effective-Date Timing", "category": "Payroll", "caseId": "lesson/34", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/default-election-effective-date-timing.md", "planTitle": "TMG", "planId": "plans/tmg", "planDetail": "", "issue": "Default elections were loaded with a future effective date, blocking participants from changing elections during early access.", "resolution": "Plan In Question tmg Issue Default elections were loaded with a future effective date, blocking participants from changing elections during early access. Resolution If elections are defaulted before early access, use an effective date before the early-access…", "takeaway": "Default-election timing can break early access even when the election values are correct.", "lessons": "Related TMG"}, {"group": "Lessons", "type": "lesson", "title": "Fund Management Calendar Discipline", "category": "Payroll", "caseId": "lesson/35", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/fund-management-calendar-discipline.md", "planTitle": "TMG", "planId": "plans/tmg", "planDetail": "", "issue": "A large Advanced Employer trade was not placed on the Fund Management Calendar.", "resolution": "Plan In Question tmg Issue A large Advanced Employer trade was not placed on the Fund Management Calendar. Resolution Put estimated trades on the FMC as soon as possible, update them with test/final values, and email the required groups if the sheet is locked…", "takeaway": "It is okay for an FMC estimate not to trade; it is not okay for a trade to happen with no FMC record.", "lessons": "Related TMG"}, {"group": "Lessons", "type": "lesson", "title": "Informatica Election Load Troubleshooting", "category": "Informatica", "caseId": "lesson/05", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/informatica-election-load-troubleshooting.md", "planTitle": "General / cross-plan", "planId": "", "planDetail": "Reusable lesson", "issue": "When an Informatica elections load kicks out because participants exist in the plan but not on the import file, pause and diagnose before switching tools.", "resolution": "Identify participants in the plan but missing from the import file; Confirm whether those participants should be excluded or added; Ask Dave Shloat or another Informatica SME if override behavior exists.", "takeaway": "On 2026-04-28 Joel hit an elections load blocker. If Informatica cannot be made to work, EDS may be the fallback, but the root issue should be understood first.", "lessons": "Related Dave Shloat"}, {"group": "Lessons", "type": "lesson", "title": "Informatica File Separation", "category": "Loans", "caseId": "lesson/06", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/informatica-file-separation.md", "planTitle": "Calliditas", "planId": "plans/calliditas", "planDetail": "", "issue": "Keep live files and working files in separate folders when running Informatica loads.", "resolution": "Put live input files in a clean folder; Move drafts/working files somewhere else; Confirm the parameter file points to the intended input file.", "takeaway": "Calliditas showed that a parameter file can reference the wrong input file when multiple similar files sit in the same folder. The workflow may appear successful while nothing expected lands in P3.", "lessons": "Related Calliditas Informatica Loan Troubleshooting"}, {"group": "Lessons", "type": "lesson", "title": "Informatica Loan Troubleshooting", "category": "Loans", "caseId": "lesson/07", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/informatica-loan-troubleshooting.md", "planTitle": "Calliditas", "planId": "plans/calliditas", "planDetail": "", "issue": "If Informatica says a loan load succeeded but P3 does not show the expected result, do not stop at the success message.", "resolution": "Confirm the parameter file points to the right input file; Confirm the input file header/source matches expectations; Check case number / plan references.", "takeaway": "Calliditas showed a silent-style failure where the workflow appeared fine, but the P3 step did not show the expected load because the parameter file referenced the wrong input file.", "lessons": "Related Calliditas Informatica File Separation"}, {"group": "Lessons", "type": "lesson", "title": "Limited Access Census Freshness", "category": "Payroll", "caseId": "lesson/17", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/limited-access-census-freshness.md", "planTitle": "Medical College of Wisconsin", "planId": "plans/medical-college-of-wisconsin", "planDetail": "", "issue": "An early census was treated like the final limited-access population, but a later block of hires was missing.", "resolution": "Plan In Question medical-college-of-wisconsin Issue An early census was treated like the final limited-access population, but a later block of hires was missing. Resolution Ask whether the population will change, whether there are upcoming hire blocks, and wh…", "takeaway": "Limited access needs a final-enough census early enough for TC checks and participant access.", "lessons": "Related Medical College Of Wisconsin"}, {"group": "Lessons", "type": "lesson", "title": "Loan Report Mismatch Handling", "category": "Loans", "caseId": "lesson/31", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/loan-report-mismatch-handling.md", "planTitle": "Denali Water Solutions / Wallace Farm", "planId": "plans/denali-water-solutions-wallace-farm", "planDetail": "", "issue": "Loan reports showed payments tied to a fund that did not line up cleanly with the loan.", "resolution": "Plan In Question denali-water-solutions-wallace-farm Issue Loan reports showed payments tied to a fund that did not line up cleanly with the loan. Resolution Aggregate/massage the loan data only after confirming totals and understanding which fund reporting a…", "takeaway": "A small loan count can still hide a messy reporting issue.", "lessons": "Related Denali Water Solutions Wallace Farm"}, {"group": "Lessons", "type": "lesson", "title": "Loan Review Discipline", "category": "Loans", "caseId": "lesson/08", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/loan-review-discipline.md", "planTitle": "Calliditas", "planId": "plans/calliditas", "planDetail": "", "issue": "Small loan files still require slow, careful validation.", "resolution": "go slow; check the output; inspect each loan.", "takeaway": "The trap is thinking that a small file is safe because it loaded. Loaded does not mean correct. The better rule is almost the opposite: if the file is small, there is no excuse not to inspect every record.", "lessons": "Related Calliditas"}, {"group": "Lessons", "type": "lesson", "title": "Mapping Day-One Readiness", "category": "Payroll", "caseId": "lesson/21", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/mapping-day-one-readiness.md", "planTitle": "Cardinal Heating", "planId": "plans/cardinal-heating", "planDetail": "", "issue": "Money that should have been mapped day one was placed in Advanced Employer because the mapping path was not ready.", "resolution": "Plan In Question cardinal-heating Issue Money that should have been mapped day one was placed in Advanced Employer because the mapping path was not ready. Resolution Read final files correctly, know the expected mapped funds, and be prepared to apply money th…", "takeaway": "Mapping plans are not wait-and-see plans once wire/final-file data is available.", "lessons": "Related Cardinal Heating"}, {"group": "Lessons", "type": "lesson", "title": "Multi-Plan ID Separation", "category": "Payroll", "caseId": "lesson/27", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/multi-plan-id-separation.md", "planTitle": "Vera Institute of Justice", "planId": "plans/vera-institute-of-justice", "planDetail": "", "issue": "Multi-plan implementations can blur vendor plan numbers and TA plan numbers.", "resolution": "Plan In Question vera-institute-of-justice Issue Multi-plan implementations can blur vendor plan numbers and TA plan numbers. Resolution Keep a clear crosswalk of vendor plan IDs, TA plan IDs, file names, and processing steps for each plan. Why It Matters Tre…", "takeaway": "Treat related plans as related, not interchangeable.", "lessons": "Related Vera Institute Of Justice"}, {"group": "Lessons", "type": "lesson", "title": "MVA Funding And Wire Handling", "category": "Payroll", "caseId": "lesson/26", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/mva-funding-and-wire-handling.md", "planTitle": "Pella Carolina", "planId": "plans/pella-carolina", "planDetail": "", "issue": "MVA funding and later-arriving money were not nailed down early enough.", "resolution": "Plan In Question pella-carolina Issue MVA funding and later-arriving money were not nailed down early enough. Resolution Identify whether MVA is participant-funded, covered by a separate wire, or handled another way; track every wire component when it arrives…", "takeaway": "Every dollar needs an owner and a destination before conversion day.", "lessons": "Related Pella Carolina"}, {"group": "Lessons", "type": "lesson", "title": "NBI Update After Load", "category": "NBI", "caseId": "lesson/09", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/nbi-update-after-load.md", "planTitle": "General / cross-plan", "planId": "", "planDetail": "Reusable lesson", "issue": "After census, elections, balances, or other deliverables are loaded and checked, send the NBI/status update promptly.", "resolution": "Confirm the load is complete; Do a quick quality check; Confirm expected participants/elections/balances show correctly.", "takeaway": "When NBI was down in late April, updates stacked up. The catch-up work created risk that loaded work would not be visible to the broader team.", "lessons": "Captured as a reusable lesson."}, {"group": "Lessons", "type": "lesson", "title": "NQDC Excess Asset Handling", "category": "Payroll", "caseId": "lesson/33", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/nqdc-excess-asset-handling.md", "planTitle": "Thunder Valley Casino", "planId": "plans/thunder-valley-casino", "planDetail": "", "issue": "A large extra amount appeared that was not participant money.", "resolution": "Plan In Question thunder-valley-casino Issue A large extra amount appeared that was not participant money. Resolution Confirm whether the difference is participant money, asset-liability variance, dividend, or forfeiture/excess asset before allocating. Why It…", "takeaway": "NQDC money may not reconcile one-to-one to participant balances.", "lessons": "Related Thunder Valley Casino"}, {"group": "Lessons", "type": "lesson", "title": "P2 Ref Number Fund Link", "category": "Plan setup", "caseId": "lesson/10", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/p2-ref-number-fund-link.md", "planTitle": "COCC", "planId": "plans/cocc", "planDetail": "", "issue": "When you create a reference number in P2, you must point it to the fund in P3.", "resolution": "In P2: create the reference number; In P3: sign in (Edge) and point the reference to the correct fund; Confirm it is not stuck in limbo before moving on.", "takeaway": "If the P2 reference is not pointed to the fund in P3, the work can get stuck in limbo and require Product Support to fix. This is a preventable trap during finish-line posting (ex: COCC).", "lessons": "Related COCC Reference Number Cleanup"}, {"group": "Lessons", "type": "lesson", "title": "Payroll File Delivery Troubleshooting", "category": "Payroll", "caseId": "lesson/11", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/payroll-file-delivery-troubleshooting.md", "planTitle": "Multiple plans", "planId": "plans/cocc", "planDetail": "COCC, Havern School", "issue": "Use this when payroll contacts say a test or payroll file was sent, but Joel cannot find it in the expected FTP/intake location.", "resolution": "1. Confirm the exact sender, send date/time, filename, and destination folder. 2. Check whether the sender used the actual payroll company path or an advisor/intermediary path. 3. Confirm the specs were sent to the party who is actually building the file. 4.…", "takeaway": "Use this when payroll contacts say a test or payroll file was sent, but Joel cannot find it in the expected FTP/intake location.", "lessons": "Related Coverage Planning NBI Update After Load Havern School COCC"}, {"group": "Lessons", "type": "lesson", "title": "Payroll Vendor Deadline Enforcement", "category": "Payroll", "caseId": "lesson/18", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/payroll-vendor-deadline-enforcement.md", "planTitle": "Church Farm School", "planId": "plans/church-farm-school", "planDetail": "", "issue": "Payroll setup dragged because external contacts were slow and follow-up was not firm enough early.", "resolution": "Plan In Question church-farm-school Issue Payroll setup dragged because external contacts were slow and follow-up was not firm enough early. Resolution Maintain deadline integrity, state what is needed, and escalate from friendly asks to direct operating requ…", "takeaway": "Payroll vendors do not automatically protect your deadlines; the DC has to keep the project moving.", "lessons": "Related Church Farm School"}, {"group": "Lessons", "type": "lesson", "title": "Pella ADP Deferral Handling", "category": "Payroll", "caseId": "lesson/12", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/pella-adp-deferral-handling.md", "planTitle": "Pella", "planId": "plans/pella", "planDetail": "", "issue": "For Pella ADP data, chase the deferral report early and assume the default-election status may be ambiguous.", "resolution": "Identify the real client/vendor contact early; Request the deferral report early; Confirm liquidation/wire timing.", "takeaway": "ADP records may not allow full confidence about whether participants are truly in default and still within the auto-escalation window. Waiting too long for the report created pain in the prior Pella work.", "lessons": "Related Pella Kimberly Morrissey"}, {"group": "Lessons", "type": "lesson", "title": "Recovery Ownership After A Plan Goes Sideways", "category": "Payroll", "caseId": "lesson/37", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/recovery-ownership-after-plan-goes-sideways.md", "planTitle": "Sibley Memorial Hospital", "planId": "plans/sibley-memorial-hospital", "planDetail": "", "issue": "Sibley/Cardinal created a personal and operational low point, but Joel recovered by asking for help and staying with the work.", "resolution": "Plan In Question sibley-memorial-hospital Issue Sibley/Cardinal created a personal and operational low point, but Joel recovered by asking for help and staying with the work. Resolution Lean on senior help, clarify whether the issue is recoverable, and then o…", "takeaway": "A bad plan can become the turning point if it changes the operating discipline going forward.", "lessons": "Related Sibley Memorial Hospital"}, {"group": "Lessons", "type": "lesson", "title": "Reference Number Cleanup", "category": "Plan setup", "caseId": "lesson/13", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/reference-number-cleanup.md", "planTitle": "COCC", "planId": "plans/cocc", "planDetail": "", "issue": "When a bad reference number/source issue appears, capture the exact bad ref, the short/incorrect amount, and whether the original ref number also needs deletion.", "resolution": "Identify the bad reference number; Identify the correct reference number; Confirm the short/incorrect amount.", "takeaway": "COCC had a bad reference number/source cleanup issue tied to a short amount. The details matter because deleting or correcting the wrong reference can create more cleanup.", "lessons": "Related COCC"}, {"group": "Lessons", "type": "lesson", "title": "Secondary Fund-Code Mapping", "category": "Payroll", "caseId": "lesson/32", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/secondary-fund-code-mapping.md", "planTitle": "Health Concepts", "planId": "plans/health-concepts", "planDetail": "", "issue": "Health Concepts had 80+ funds and Nationwide secondary fund codes that made mapping harder.", "resolution": "Plan In Question health-concepts Issue Health Concepts had 80+ funds and Nationwide secondary fund codes that made mapping harder. Resolution Map both the visible fund and secondary code layer so TOA/final records reconcile. Why It Matters Some vendors requir…", "takeaway": "Some vendors require two mapping dimensions before the money makes sense.", "lessons": "Related Health Concepts"}, {"group": "Lessons", "type": "lesson", "title": "Startup-Treated Merger Deferrals", "category": "Payroll", "caseId": "lesson/14", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/startup-treated-merger-deferrals.md", "planTitle": "International School of Denver", "planId": "plans/international-school-of-denver", "planDetail": "", "issue": "When an existing plan is treated like a startup, deferral loading may need special handling so participants can be live without un-QC'd elections showing.", "resolution": "do not load deferrals before live date; let participants enter changes after access opens; later load the client-provided deferral file with the live effective date.", "takeaway": "International School of Denver raised a tricky pattern: the plan behaves like a startup, but participants may already have existing payroll/election context. Loading elections on live date could create a QC delay or visible bad data.", "lessons": "Related International School Of Denver"}, {"group": "Lessons", "type": "lesson", "title": "Transfer-In-Kind Residual Dividends", "category": "Payroll", "caseId": "lesson/30", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/transfer-in-kind-residual-dividends.md", "planTitle": "COCC", "planId": "plans/cocc", "planDetail": "", "issue": "COCC had residual dividends, staged share movement, and reports with front-loaded monthly dividend values.", "resolution": "Plan In Question cocc Issue COCC had residual dividends, staged share movement, and reports with front-loaded monthly dividend values. Resolution Separate actual received shares/cash from front-loaded report values, process in chunks when needed, and prorate…", "takeaway": "TIK residuals need their own tracking lane; reports may include values that have not arrived yet.", "lessons": "Related COCC"}, {"group": "Lessons", "type": "lesson", "title": "Transfer-In-Kind Setup Timing", "category": "Payroll", "caseId": "lesson/23", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/transfer-in-kind-setup-timing.md", "planTitle": "Sibley Memorial Hospital", "planId": "plans/sibley-memorial-hospital", "planDetail": "", "issue": "Transfer-in-kind setup/re-registration work was handled too late, adding risk when assets did not arrive as expected.", "resolution": "Plan In Question sibley-memorial-hospital Issue Transfer-in-kind setup/re-registration work was handled too late, adding risk when assets did not arrive as expected. Resolution Get transfer-in-kind setup to Matt O'Connell early and verify registration/account…", "takeaway": "TIK timing is front-end work. Waiting until wire/liquidation day is already late.", "lessons": "Related Sibley Memorial Hospital"}, {"group": "Lessons", "type": "lesson", "title": "Vesting Override Decision", "category": "Plan setup", "caseId": "lesson/15", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/vesting-override-decision.md", "planTitle": "General / cross-plan", "planId": "", "planDetail": "Reusable lesson", "issue": "A decision rule for choosing between a broad years-of-service override and a surgical EDS source-by-source override.", "resolution": "Decision Rule If all non-100% vested sources share the same rule, consider the 55 YOS catch-all. If sources differ or only some sources should be overridden, use EDS by source ID.", "takeaway": "A decision rule for choosing between a broad years-of-service override and a surgical EDS source-by-source override.", "lessons": "Captured as a reusable lesson."}, {"group": "Lessons", "type": "lesson", "title": "Wire Readiness Before Money Arrives", "category": "Payroll", "caseId": "lesson/16", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/wire-readiness-before-money-arrives.md", "planTitle": "Educators Credit Union", "planId": "plans/educators-credit-union", "planDetail": "", "issue": "A wire arrived before Joel understood exactly what money was expected or what process would be needed.", "resolution": "Plan In Question educators-credit-union Issue A wire arrived before Joel understood exactly what money was expected or what process would be needed. Resolution Use meetings and plan coding to identify expected wires before receipt; if money is coming, know wh…", "takeaway": "The wire should never be the first time the DC realizes money is involved.", "lessons": "Related Educators Credit Union"}, {"group": "Lessons", "type": "lesson", "title": "Years Of Service Vesting Validation", "category": "Payroll", "caseId": "lesson/25", "status": "Complete", "updated": "2026-05-08", "rel": "05-processes/years-of-service-vesting-validation.md", "planTitle": "Stamets", "planId": "plans/stamets", "planDetail": "", "issue": "Late base-file timing made years-of-service and vesting validation harder than it needed to be.", "resolution": "Plan In Question stamets Issue Late base-file timing made years-of-service and vesting validation harder than it needed to be. Resolution Compare vendor years-of-service data against TA/load data and resolve vesting presentation before go-live pressure. Why I…", "takeaway": "Years of service is not just a census field; it can change what participants see online.", "lessons": "Related Stamets"}], "markdown": "# Lessons Register\n\n<aside class=\"metadata-card\">\n<div class=\"metadata-row\"><span class=\"metadata-key\">Type</span><span class=\"metadata-value\">Lessons register</span></div>\n<div class=\"metadata-row\"><span class=\"metadata-key\">Status</span><span class=\"metadata-value\"><span class=\"status-tag status-active\">Active</span></span></div>\n<div class=\"metadata-row\"><span class=\"metadata-key\">Updated</span><span class=\"metadata-value\">2026-05-08</span></div>\n<div class=\"metadata-row\"><span class=\"metadata-key\">Sources</span><span class=\"metadata-value\">37</span></div>\n<div class=\"metadata-row\"><span class=\"metadata-key\">Linked from</span><span class=\"metadata-value\">Lessons source folder</span></div>\n</aside>\n\nA custom register for reusable lessons. Each entry names the plan/context, the issue, the resolution, and the key takeaway.\n\n## Register\n\n### ADP Segmented Ownership Model `lesson/19`\n\n- Category: Payroll\n- Plan in question: AVL USA\n- Source: `05-processes/adp-segmented-ownership-model.md`\n- Issue: ADP work stalled because different ADP groups owned specs, system setup, file initiation, and file transmission.\n- Resolution: Plan In Question avl-usa Issue ADP work stalled because different ADP groups owned specs, system setup, file initiation, and file transmission. Resolution Identify the owner for each ADP step and make sure the client and ADP understand the TA process and file…\n- Key takeaway: With ADP, one contact rarely owns the whole path. Map the ownership before waiting weeks on the wrong person.\n\n### Advanced Employer Is Not A Parking Lot `lesson/22`\n\n- Category: Payroll\n- Plan in question: Sibley Memorial Hospital\n- Source: `05-processes/advanced-employer-not-parking-lot.md`\n- Issue: Money was parked in Advanced Employer even though only part of it belonged there.\n- Resolution: Plan In Question sibley-memorial-hospital Issue Money was parked in Advanced Employer even though only part of it belonged there. Resolution Break down the money by processing type before receipt: mapped, hold/Advanced Employer, transfer-in-kind, residual, or…\n- Key takeaway: Advanced Employer is a tool, not a default answer for uncertainty.\n\n### Advanced Employer Wire Coverage `lesson/01`\n\n- Category: Files\n- Plan in question: Pella\n- Source: `05-processes/advanced-employer-wire-coverage.md`\n- Issue: When someone covers a wire, make clear whether the money needs to be placed into Advanced Employer and what reference/contact details they need.\n- Resolution: Confirm covering person; Confirm wire date; Provide client contact.\n- Key takeaway: Pella needed Jessica to cover the wire while Joel was out. The key handoff was making sure she could put the wire into Advanced Employer and had the right contacts.\n\n### Advisor Group Patterns: WTW And ExcelWise `lesson/36`\n\n- Category: Payroll\n- Plan in question: TMG\n- Source: `05-processes/advisor-group-patterns-wtw-excelwise.md`\n- Issue: WTW and ExcelWise plans show recurring advisor-group patterns, expectations, and client intensity.\n- Resolution: Plan In Question tmg Issue WTW and ExcelWise plans show recurring advisor-group patterns, expectations, and client intensity. Resolution Recognize QK63233 as WTW-style and QK63283 as ExcelWise-style work; expect thorough questions and advisor-driven urgency.…\n- Key takeaway: Advisor-group plans have personalities. Knowing the pattern helps set expectations early.\n\n### Ask For Help Before The Hole Gets Deep `lesson/24`\n\n- Category: Payroll\n- Plan in question: Sibley Memorial Hospital\n- Source: `05-processes/ask-for-help-before-the-hole.md`\n- Issue: Joel waited too long to ask questions on a complicated hybrid conversion and got stuck in a large recovery effort.\n- Resolution: Plan In Question sibley-memorial-hospital Issue Joel waited too long to ask questions on a complicated hybrid conversion and got stuck in a large recovery effort. Resolution Ask Earl/Rob/manager/SMEs early when a plan has unfamiliar money movement, mapping, T…\n- Key takeaway: The earlier the question, the smaller the hole.\n\n### Base File First `lesson/02`\n\n- Category: Files\n- Plan in question: Banayn, International School of Denver\n- Source: `05-processes/base-file-first.md`\n- Issue: After a plan is assigned or intake begins, the base file should become one of the first concrete work products.\n- Resolution: Confirm plan treatment and setup assumptions; Build the base file early; Review for obvious missing fields.\n- Key takeaway: Base file meetings go better when the file is already prepared. Waiting creates avoidable pressure and makes it easier to get caught underprepared. Joel's shorthand from the May 5 dump: make the base file the first real move after plan int…\n\n### Blackout Report Cutoff Discipline `lesson/20`\n\n- Category: Loans\n- Plan in question: Health Advocates\n- Source: `05-processes/blackout-report-cutoff-discipline.md`\n- Issue: Vendor blackout/access cutoff prevented early loan report capture, delaying payroll restart work.\n- Resolution: Plan In Question health-advocates Issue Vendor blackout/access cutoff prevented early loan report capture, delaying payroll restart work. Resolution Capture loan/election/deferral reports before blackout if access will be limited or cut off. Why It Matters If…\n- Key takeaway: If a report is available on demand before blackout, get it while the door is still open.\n\n### Census Cleanup Across All Tables `lesson/29`\n\n- Category: Payroll\n- Plan in question: COCC\n- Source: `05-processes/census-cleanup-all-tables.md`\n- Issue: Participants were loaded into the wrong plan and had to be removed.\n- Resolution: Plan In Question cocc Issue Participants were loaded into the wrong plan and had to be removed. Resolution When clearing a bad census load, tell Broad Support to clear every related table, not only the employee table. Why It Matters Deleting from one table is…\n- Key takeaway: Deleting from one table is not a clean participant removal.\n\n### Coverage Planning `lesson/03`\n\n- Category: Payroll\n- Plan in question: Pella\n- Source: `05-processes/coverage-planning.md`\n- Issue: When Joel will be out near a wire, asset movement, payroll event, or go-live window, coverage needs to be assigned early and with contacts attached.\n- Resolution: Confirm the exact out-of-office date; Identify the event that needs coverage; Assign the covering person.\n- Key takeaway: Late-April Pella and Havern work showed that coverage is not just \"someone knows.\" The covering person needs contacts, expected amounts if possible, plan context, and what to do with the money/data.\n\n### Day-Two Managed Advice Conversion `lesson/28`\n\n- Category: Payroll\n- Plan in question: Vera Institute of Justice\n- Source: `05-processes/day-two-managed-advice-conversion.md`\n- Issue: Defaulted vendor participants needed a second managed-advice rebalance after the initial investment.\n- Resolution: Plan In Question vera-institute-of-justice Issue Defaulted vendor participants needed a second managed-advice rebalance after the initial investment. Resolution Provide the TC with the list of participants defaulted at the vendor so day-two managed advice can…\n- Key takeaway: Managed advice can be a second conversion step, not just a default investment detail.\n\n### DC P3 Checklist `lesson/04`\n\n- Category: Plan setup\n- Plan in question: Leiby's Dairy\n- Source: `05-processes/dc-p3-checklist.md`\n- Issue: When P3 is available for a plan, run a quick standardized DC check before the work drifts.\n- Resolution: Confirm sources are present; Confirm classes are present; Confirm auto-enroll details.\n- Key takeaway: Joel identified that early P3 checks can catch missing setup details before they turn into downstream cleanup. Leiby is the current seed plan for this checklist.\n\n### Default Election Effective-Date Timing `lesson/34`\n\n- Category: Payroll\n- Plan in question: TMG\n- Source: `05-processes/default-election-effective-date-timing.md`\n- Issue: Default elections were loaded with a future effective date, blocking participants from changing elections during early access.\n- Resolution: Plan In Question tmg Issue Default elections were loaded with a future effective date, blocking participants from changing elections during early access. Resolution If elections are defaulted before early access, use an effective date before the early-access…\n- Key takeaway: Default-election timing can break early access even when the election values are correct.\n\n### Fund Management Calendar Discipline `lesson/35`\n\n- Category: Payroll\n- Plan in question: TMG\n- Source: `05-processes/fund-management-calendar-discipline.md`\n- Issue: A large Advanced Employer trade was not placed on the Fund Management Calendar.\n- Resolution: Plan In Question tmg Issue A large Advanced Employer trade was not placed on the Fund Management Calendar. Resolution Put estimated trades on the FMC as soon as possible, update them with test/final values, and email the required groups if the sheet is locked…\n- Key takeaway: It is okay for an FMC estimate not to trade; it is not okay for a trade to happen with no FMC record.\n\n### Informatica Election Load Troubleshooting `lesson/05`\n\n- Category: Informatica\n- Plan in question: Reusable lesson\n- Source: `05-processes/informatica-election-load-troubleshooting.md`\n- Issue: When an Informatica elections load kicks out because participants exist in the plan but not on the import file, pause and diagnose before switching tools.\n- Resolution: Identify participants in the plan but missing from the import file; Confirm whether those participants should be excluded or added; Ask Dave Shloat or another Informatica SME if override behavior exists.\n- Key takeaway: On 2026-04-28 Joel hit an elections load blocker. If Informatica cannot be made to work, EDS may be the fallback, but the root issue should be understood first.\n\n### Informatica File Separation `lesson/06`\n\n- Category: Loans\n- Plan in question: Calliditas\n- Source: `05-processes/informatica-file-separation.md`\n- Issue: Keep live files and working files in separate folders when running Informatica loads.\n- Resolution: Put live input files in a clean folder; Move drafts/working files somewhere else; Confirm the parameter file points to the intended input file.\n- Key takeaway: Calliditas showed that a parameter file can reference the wrong input file when multiple similar files sit in the same folder. The workflow may appear successful while nothing expected lands in P3.\n\n### Informatica Loan Troubleshooting `lesson/07`\n\n- Category: Loans\n- Plan in question: Calliditas\n- Source: `05-processes/informatica-loan-troubleshooting.md`\n- Issue: If Informatica says a loan load succeeded but P3 does not show the expected result, do not stop at the success message.\n- Resolution: Confirm the parameter file points to the right input file; Confirm the input file header/source matches expectations; Check case number / plan references.\n- Key takeaway: Calliditas showed a silent-style failure where the workflow appeared fine, but the P3 step did not show the expected load because the parameter file referenced the wrong input file.\n\n### Limited Access Census Freshness `lesson/17`\n\n- Category: Payroll\n- Plan in question: Medical College of Wisconsin\n- Source: `05-processes/limited-access-census-freshness.md`\n- Issue: An early census was treated like the final limited-access population, but a later block of hires was missing.\n- Resolution: Plan In Question medical-college-of-wisconsin Issue An early census was treated like the final limited-access population, but a later block of hires was missing. Resolution Ask whether the population will change, whether there are upcoming hire blocks, and wh…\n- Key takeaway: Limited access needs a final-enough census early enough for TC checks and participant access.\n\n### Loan Report Mismatch Handling `lesson/31`\n\n- Category: Loans\n- Plan in question: Denali Water Solutions / Wallace Farm\n- Source: `05-processes/loan-report-mismatch-handling.md`\n- Issue: Loan reports showed payments tied to a fund that did not line up cleanly with the loan.\n- Resolution: Plan In Question denali-water-solutions-wallace-farm Issue Loan reports showed payments tied to a fund that did not line up cleanly with the loan. Resolution Aggregate/massage the loan data only after confirming totals and understanding which fund reporting a…\n- Key takeaway: A small loan count can still hide a messy reporting issue.\n\n### Loan Review Discipline `lesson/08`\n\n- Category: Loans\n- Plan in question: Calliditas\n- Source: `05-processes/loan-review-discipline.md`\n- Issue: Small loan files still require slow, careful validation.\n- Resolution: go slow; check the output; inspect each loan.\n- Key takeaway: The trap is thinking that a small file is safe because it loaded. Loaded does not mean correct. The better rule is almost the opposite: if the file is small, there is no excuse not to inspect every record.\n\n### Mapping Day-One Readiness `lesson/21`\n\n- Category: Payroll\n- Plan in question: Cardinal Heating\n- Source: `05-processes/mapping-day-one-readiness.md`\n- Issue: Money that should have been mapped day one was placed in Advanced Employer because the mapping path was not ready.\n- Resolution: Plan In Question cardinal-heating Issue Money that should have been mapped day one was placed in Advanced Employer because the mapping path was not ready. Resolution Read final files correctly, know the expected mapped funds, and be prepared to apply money th…\n- Key takeaway: Mapping plans are not wait-and-see plans once wire/final-file data is available.\n\n### Multi-Plan ID Separation `lesson/27`\n\n- Category: Payroll\n- Plan in question: Vera Institute of Justice\n- Source: `05-processes/multi-plan-id-separation.md`\n- Issue: Multi-plan implementations can blur vendor plan numbers and TA plan numbers.\n- Resolution: Plan In Question vera-institute-of-justice Issue Multi-plan implementations can blur vendor plan numbers and TA plan numbers. Resolution Keep a clear crosswalk of vendor plan IDs, TA plan IDs, file names, and processing steps for each plan. Why It Matters Tre…\n- Key takeaway: Treat related plans as related, not interchangeable.\n\n### MVA Funding And Wire Handling `lesson/26`\n\n- Category: Payroll\n- Plan in question: Pella Carolina\n- Source: `05-processes/mva-funding-and-wire-handling.md`\n- Issue: MVA funding and later-arriving money were not nailed down early enough.\n- Resolution: Plan In Question pella-carolina Issue MVA funding and later-arriving money were not nailed down early enough. Resolution Identify whether MVA is participant-funded, covered by a separate wire, or handled another way; track every wire component when it arrives…\n- Key takeaway: Every dollar needs an owner and a destination before conversion day.\n\n### NBI Update After Load `lesson/09`\n\n- Category: NBI\n- Plan in question: Reusable lesson\n- Source: `05-processes/nbi-update-after-load.md`\n- Issue: After census, elections, balances, or other deliverables are loaded and checked, send the NBI/status update promptly.\n- Resolution: Confirm the load is complete; Do a quick quality check; Confirm expected participants/elections/balances show correctly.\n- Key takeaway: When NBI was down in late April, updates stacked up. The catch-up work created risk that loaded work would not be visible to the broader team.\n\n### NQDC Excess Asset Handling `lesson/33`\n\n- Category: Payroll\n- Plan in question: Thunder Valley Casino\n- Source: `05-processes/nqdc-excess-asset-handling.md`\n- Issue: A large extra amount appeared that was not participant money.\n- Resolution: Plan In Question thunder-valley-casino Issue A large extra amount appeared that was not participant money. Resolution Confirm whether the difference is participant money, asset-liability variance, dividend, or forfeiture/excess asset before allocating. Why It…\n- Key takeaway: NQDC money may not reconcile one-to-one to participant balances.\n\n### P2 Ref Number Fund Link `lesson/10`\n\n- Category: Plan setup\n- Plan in question: COCC\n- Source: `05-processes/p2-ref-number-fund-link.md`\n- Issue: When you create a reference number in P2, you must point it to the fund in P3.\n- Resolution: In P2: create the reference number; In P3: sign in (Edge) and point the reference to the correct fund; Confirm it is not stuck in limbo before moving on.\n- Key takeaway: If the P2 reference is not pointed to the fund in P3, the work can get stuck in limbo and require Product Support to fix. This is a preventable trap during finish-line posting (ex: COCC).\n\n### Payroll File Delivery Troubleshooting `lesson/11`\n\n- Category: Payroll\n- Plan in question: COCC, Havern School\n- Source: `05-processes/payroll-file-delivery-troubleshooting.md`\n- Issue: Use this when payroll contacts say a test or payroll file was sent, but Joel cannot find it in the expected FTP/intake location.\n- Resolution: 1. Confirm the exact sender, send date/time, filename, and destination folder. 2. Check whether the sender used the actual payroll company path or an advisor/intermediary path. 3. Confirm the specs were sent to the party who is actually building the file. 4.…\n- Key takeaway: Use this when payroll contacts say a test or payroll file was sent, but Joel cannot find it in the expected FTP/intake location.\n\n### Payroll Vendor Deadline Enforcement `lesson/18`\n\n- Category: Payroll\n- Plan in question: Church Farm School\n- Source: `05-processes/payroll-vendor-deadline-enforcement.md`\n- Issue: Payroll setup dragged because external contacts were slow and follow-up was not firm enough early.\n- Resolution: Plan In Question church-farm-school Issue Payroll setup dragged because external contacts were slow and follow-up was not firm enough early. Resolution Maintain deadline integrity, state what is needed, and escalate from friendly asks to direct operating requ…\n- Key takeaway: Payroll vendors do not automatically protect your deadlines; the DC has to keep the project moving.\n\n### Pella ADP Deferral Handling `lesson/12`\n\n- Category: Payroll\n- Plan in question: Pella\n- Source: `05-processes/pella-adp-deferral-handling.md`\n- Issue: For Pella ADP data, chase the deferral report early and assume the default-election status may be ambiguous.\n- Resolution: Identify the real client/vendor contact early; Request the deferral report early; Confirm liquidation/wire timing.\n- Key takeaway: ADP records may not allow full confidence about whether participants are truly in default and still within the a …\n- Key takeaway: Some vendors require two mapping dimensions before the money makes sense.\n\n### Startup-Treated Merger Deferrals `lesson/14`\n\n- Category: Payroll\n- Plan in question: International School of Denver\n- Source: `05-processes/startup-treated-merger-deferrals.md`\n- Issue: When an existing plan is treated like a startup, deferral loading may need special handling so participants can be live without un-QC'd elections showing.\n- Resolution: do not load deferrals before live date; let participants enter changes after access opens; later load the client-provided deferral file with the live effective date.\n- Key takeaway: International School of Denver raised a tricky pattern: the plan behaves like a startup, but participants may already have existing payroll/election context. Loading elections on live date could create a QC delay or visible bad data.\n\n### Transfer-In-Kind Residual Dividends `lesson/30`\n\n- Category: Payroll\n- Plan in question: COCC\n- Source: `05-processes/transfer-in-kind-residual-dividends.md`\n- Issue: COCC had residual dividends, staged share movement, and reports with front-loaded monthly dividend values.\n- Resolution: Plan In Question cocc Issue COCC had residual dividends, staged share movement, and reports with front-loaded monthly dividend values. Resolution Separate actual received shares/cash from front-loaded report values, process in chunks when needed, and prorate…\n- Key takeaway: TIK residuals need their own tracking lane; reports may include values that have not arrived yet.\n\n### Transfer-In-Kind Setup Timing `lesson/23`\n\n- Category: Payroll\n- Plan in question: Sibley Memorial Hospital\n- Source: `05-processes/transfer-in-kind-setup-timing.md`\n- Issue: Transfer-in-kind setup/re-registration work was handled too late, adding risk when assets did not arrive as expected.\n- Resolution: Plan In Question sibley-memorial-hospital Issue Transfer-in-kind setup/re-registration work was handled too late, adding risk when assets did not arrive as expected. Resolution Get transfer-in-kind setup to Matt O'Connell early and verify registration/account…\n- Key takeaway: TIK timing is front-end work. Waiting until wire/liquidation day is already late.\n\n### Vesting Override Decision `lesson/15`\n\n- Category: Plan setup\n- Plan in question: Reusable lesson\n- Source: `05-processes/vesting-override-decision.md`\n- Issue: A decision rule for choosing between a broad years-of-service override and a surgical EDS source-by-source override.\n- Resolution: Decision Rule If all non-100% vested sources share the same rule, consider the 55 YOS catch-all. If sources differ or only some sources should be overridden, use EDS by source ID.\n- Key takeaway: A decision rule for choosing between a broad years-of-service override and a surgical EDS source-by-source override.\n\n### Wire Readiness Before Money Arrives `lesson/16`\n\n- Category: Payroll\n- Plan in question: Educators Credit Union\n- Source: `05-processes/wire-readiness-before-money-arrives.md`\n- Issue: A wire arrived before Joel understood exactly what money was expected or what process would be needed.\n- Resolution: Plan In Question educators-credit-union Issue A wire arrived before Joel understood exactly what money was expected or what process would be needed. Resolution Use meetings and plan coding to identify expected wires before receipt; if money is coming, know wh…\n- Key takeaway: The wire should never be the first time the DC realizes money is involved.\n\n### Years Of Service Vesting Validation `lesson/25`\n\n- Category: Payroll\n- Plan in question: Stamets\n- Source: `05-processes/years-of-service-vesting-validation.md`\n- Issue: Late base-file timing made years-of-service and vesting validation harder than it needed to be.\n- Resolution: Plan In Question stamets Issue Late base-file timing made years-of-service and vesting validation harder than it needed to be. Resolution Compare vendor years-of-service data against TA
