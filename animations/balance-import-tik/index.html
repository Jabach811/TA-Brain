<script type="text/babel">
/* inlined: animations.jsx */

// animations.jsx
// Reusable animation starter: Stage, Timeline, Sprite, easing helpers.
// Usage (in an HTML file that loads React + Babel):
//
//   <Stage width={1280} height={720} duration={10} background="#f6f4ef">
//     <MyScene />
//   </Stage>
//
// Inside <Stage>, any child can call useTime() to read the current
// playhead (seconds). Or wrap content in <Sprite start={1} end={4}>...</Sprite>
// to only render during that window -- children receive a `localTime` and
// `progress` via the useSprite() hook.
//
// ─────────────────────────────────────────────────────────────────────────────

// ── Easing functions (hand-rolled, Popmotion-style) ─────────────────────────
// All easings take t ∈ [0,1] and return eased t ∈ [0,1] (may overshoot for back/elastic).
const Easing = {
  linear: (t) => t,

  // Quad
  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),

  // Cubic
  easeInCubic:    (t) => t * t * t,
  easeOutCubic:   (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),

  // Quart
  easeInQuart:    (t) => t * t * t * t,
  easeOutQuart:   (t) => 1 - (--t) * t * t * t,
  easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),

  // Expo
  easeInExpo:  (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
  easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeInOutExpo: (t) => {
    if (t === 0) return 0;
    if (t === 1) return 1;
    if (t < 0.5) return 0.5 * Math.pow(2, 20 * t - 10);
    return 1 - 0.5 * Math.pow(2, -20 * t + 10);
  },

  // Sine
  easeInSine:    (t) => 1 - Math.cos((t * Math.PI) / 2),
  easeOutSine:   (t) => Math.sin((t * Math.PI) / 2),
  easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,

  // Back (overshoot)
  easeOutBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  easeInBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return c3 * t * t * t - c1 * t * t;
  },
  easeInOutBack: (t) => {
    const c1 = 1.70158, c2 = c1 * 1.525;
    return t < 0.5
      ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
      : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
  },

  // Elastic
  easeOutElastic: (t) => {
    const c4 = (2 * Math.PI) / 3;
    if (t === 0) return 0;
    if (t === 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  },
};

// ── Core interpolation helpers ──────────────────────────────────────────────

// Clamp a value to [min, max]
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

// interpolate([0, 0.5, 1], [0, 100, 50], ease?) -> fn(t)
// Popmotion-style: linearly maps t across input keyframes to output values,
// with optional easing per segment (single fn or array of fns).
function interpolate(input, output, ease = Easing.linear) {
  return (t) => {
    if (t <= input[0]) return output[0];
    if (t >= input[input.length - 1]) return output[output.length - 1];
    for (let i = 0; i < input.length - 1; i++) {
      if (t >= input[i] && t <= input[i + 1]) {
        const span = input[i + 1] - input[i];
        const local = span === 0 ? 0 : (t - input[i]) / span;
        const easeFn = Array.isArray(ease) ? (ease[i] || Easing.linear) : ease;
        const eased = easeFn(local);
        return output[i] + (output[i + 1] - output[i]) * eased;
      }
    }
    return output[output.length - 1];
  };
}

// animate({from, to, start, end, ease})(t) — simpler single-segment tween.
// Returns `from` before `start`, `to` after `end`.
function animate({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeInOutCubic }) {
  return (t) => {
    if (t <= start) return from;
    if (t >= end) return to;
    const local = (t - start) / (end - start);
    return from + (to - from) * ease(local);
  };
}

// ── Timeline context ────────────────────────────────────────────────────────

const TimelineContext = React.createContext({ time: 0, duration: 10, playing: false });

const useTime = () => React.useContext(TimelineContext).time;
const useTimeline = () => React.useContext(TimelineContext);

// ── Sprite ──────────────────────────────────────────────────────────────────
// Renders children only when the playhead is inside [start, end]. Provides
// a sub-context with `localTime` (seconds since start) and `progress` (0..1).
//
//   <Sprite start={2} end={5}>
//     {({ localTime, progress }) => <Thing x={progress * 100} />}
//   </Sprite>
//
// Or as a plain wrapper — children can call useSprite() themselves.

const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });
const useSprite = () => React.useContext(SpriteContext);

function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {
  const { time } = useTimeline();
  const visible = time >= start && time <= end;
  if (!visible && !keepMounted) return null;

  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 && isFinite(duration)
    ? clamp(localTime / duration, 0, 1)
    : 0;

  const value = { localTime, progress, duration, visible };

  return (
    <SpriteContext.Provider value={value}>
      {typeof children === 'function' ? children(value) : children}
    </SpriteContext.Provider>
  );
}

// ── Sample sprite components ────────────────────────────────────────────────

// TextSprite: fades/slides text in on entry, holds, then fades out on exit.
// Props: text, x, y, size, color, font, entryDur, exitDur, align
function TextSprite({
  text,
  x = 0, y = 0,
  size = 48,
  color = '#111',
  font = 'Inter, system-ui, sans-serif',
  weight = 600,
  entryDur = 0.45,
  exitDur = 0.35,
  entryEase = Easing.easeOutBack,
  exitEase = Easing.easeInCubic,
  align = 'left',
  letterSpacing = '-0.01em',
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let ty = 0;

  if (localTime < entryDur) {
    const t = entryEase(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    ty = (1 - t) * 16;
  } else if (localTime > exitStart) {
    const t = exitEase(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    ty = -t * 8;
  }

  const translateX = align === 'center' ? '-50%' : align === 'right' ? '-100%' : '0';

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      transform: `translate(${translateX}, ${ty}px)`,
      opacity,
      fontFamily: font,
      fontSize: size,
      fontWeight: weight,
      color,
      letterSpacing,
      whiteSpace: 'pre',
      lineHeight: 1.1,
      willChange: 'transform, opacity',
    }}>
      {text}
    </div>
  );
}

// ImageSprite: scales + fades in; optional Ken Burns drift during hold.
function ImageSprite({
  src,
  x = 0, y = 0,
  width = 400, height = 300,
  entryDur = 0.6,
  exitDur = 0.4,
  kenBurns = false,
  kenBurnsScale = 1.08,
  radius = 12,
  fit = 'cover',
  placeholder = null, // {label: string} for striped placeholder
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutCubic(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    scale = 0.96 + 0.04 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInCubic(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = (kenBurns ? kenBurnsScale : 1) + 0.02 * t;
  } else if (kenBurns) {
    const holdSpan = exitStart - entryDur;
    const holdT = holdSpan > 0 ? (localTime - entryDur) / holdSpan : 0;
    scale = 1 + (kenBurnsScale - 1) * holdT;
  }

  const content = placeholder ? (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'repeating-linear-gradient(135deg, #e9e6df 0 10px, #dcd8cf 10px 20px)',
      color: '#6b6458',
      fontFamily: 'JetBrains Mono, ui-monospace, monospace',
      fontSize: 13,
      letterSpacing: '0.04em',
      textTransform: 'uppercase',
    }}>
      {placeholder.label || 'image'}
    </div>
  ) : (
    <img src={src} alt="" style={{ width: '100%', height: '100%', objectFit: fit, display: 'block' }} />
  );

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      borderRadius: radius,
      overflow: 'hidden',
      willChange: 'transform, opacity',
    }}>
      {content}
    </div>
  );
}

// RectSprite: simple rectangle that animates position/size/color via props.
// Useful demo primitive — takes a `render` fn for per-frame customization.
function RectSprite({
  x = 0, y = 0,
  width = 100, height = 100,
  color = '#111',
  radius = 8,
  entryDur = 0.4,
  exitDur = 0.3,
  render, // optional: (ctx) => style overrides
}) {
  const spriteCtx = useSprite();
  const { localTime, duration } = spriteCtx;
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutBack(clamp(localTime / entryDur, 0, 1));
    opacity = clamp(localTime / entryDur, 0, 1);
    scale = 0.4 + 0.6 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInQuad(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = 1 - 0.15 * t;
  }

  const overrides = render ? render(spriteCtx) : {};

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      background: color,
      borderRadius: radius,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      willChange: 'transform, opacity',
      ...overrides,
    }} />
  );
}


function Stage({
  width = 1280,
  height = 720,
  duration = 10,
  background = '#f6f4ef',
  fps = 60,
  loop = true,
  autoplay = true,
  persistKey = 'animstage',
  children,
}) {
  const [time, setTime] = React.useState(() => {
    try {
      const v = parseFloat(localStorage.getItem(persistKey + ':t') || '0');
      return isFinite(v) ? clamp(v, 0, duration) : 0;
    } catch { return 0; }
  });
  const [playing, setPlaying] = React.useState(autoplay);
  const [hoverTime, setHoverTime] = React.useState(null);
  const [scale, setScale] = React.useState(1);

  const stageRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  // Persist playhead
  React.useEffect(() => {
    try { localStorage.setItem(persistKey + ':t', String(time)); } catch {}
  }, [time, persistKey]);

  // Auto-scale to fit viewport
  React.useEffect(() => {
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const barH = 44; // playback bar height
      const s = Math.min(
        el.clientWidth / width,
        (el.clientHeight - barH) / height
      );
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener('resize', measure);
    return () => {
      ro.disconnect();
      window.removeEventListener('resize', measure);
    };
  }, [width, height]);

  // Animation loop
  React.useEffect(() => {
    if (!playing) {
      lastTsRef.current = null;
      return;
    }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      setTime((t) => {
        let next = t + dt;
        if (next >= duration) {
          if (loop) next = next % duration;
          else { next = duration; setPlaying(false); }
        }
        return next;
      });
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      lastTsRef.current = null;
    };
  }, [playing, duration, loop]);

  // Keyboard: space = play/pause, ← → = seek
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        setPlaying(p => !p);
      } else if (e.code === 'ArrowLeft') {
        setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.code === 'ArrowRight') {
        setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.key === '0' || e.code === 'Home') {
        setTime(0);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [duration]);

  const displayTime = hoverTime != null ? hoverTime : time;

  const ctxValue = React.useMemo(
    () => ({ time: displayTime, duration, playing, setTime, setPlaying }),
    [displayTime, duration, playing]
  );

  return (
    <div
      ref={stageRef}
      style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column',
        alignItems: 'center',
        background: '#0a0a0a',
        fontFamily: 'Inter, system-ui, sans-serif',
      }}
    >
      {/* Canvas area — vertically centered in remaining space */}
      <div style={{
        flex: 1,
        width: '100%',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        overflow: 'hidden',
        minHeight: 0,
      }}>
        <div
          ref={canvasRef}
          style={{
            width, height,
            background,
            position: 'relative',
            transform: `scale(${scale})`,
            transformOrigin: 'center',
            flexShrink: 0,
            boxShadow: '0 20px 60px rgba(0,0,0,0.4)',
            overflow: 'hidden',
          }}
        >
          <TimelineContext.Provider value={ctxValue}>
            {children}
          </TimelineContext.Provider>
        </div>
      </div>

      {/* Playback bar — stacked below canvas, never overlapping */}
      <PlaybackBar
        time={displayTime}
        actualTime={time}
        duration={duration}
        playing={playing}
        onPlayPause={() => setPlaying(p => !p)}
        onReset={() => { setTime(0); }}
        onSeek={(t) => setTime(t)}
        onHover={(t) => setHoverTime(t)}
      />
    </div>
  );
}

// ── Playback bar ────────────────────────────────────────────────────────────
// Play/pause, return-to-begin, scrub track, time display.
// Uses fixed-width time fields so layout doesn't thrash.

function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek, onHover }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);

  const timeFromEvent = React.useCallback((e) => {
    const rect = trackRef.current.getBoundingClientRect();
    const x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    return x * duration;
  }, [duration]);

  const onTrackMove = (e) => {
    if (!trackRef.current) return;
    const t = timeFromEvent(e);
    if (dragging) {
      onSeek(t);
    } else {
      onHover(t);
    }
  };

  const onTrackLeave = () => {
    if (!dragging) onHover(null);
  };

  const onTrackDown = (e) => {
    setDragging(true);
    const t = timeFromEvent(e);
    onSeek(t);
    onHover(null);
  };

  React.useEffect(() => {
    if (!dragging) return;
    const onUp = () => setDragging(false);
    const onMove = (e) => {
      if (!trackRef.current) return;
      const t = timeFromEvent(e);
      onSeek(t);
    };
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mousemove', onMove);
    return () => {
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('mousemove', onMove);
    };
  }, [dragging, timeFromEvent, onSeek]);

  const pct = duration > 0 ? (time / duration) * 100 : 0;
  const fmt = (t) => {
    const total = Math.max(0, t);
    const m = Math.floor(total / 60);
    const s = Math.floor(total % 60);
    const cs = Math.floor((total * 100) % 100);
    return `${String(m).padStart(1, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
  };

  const mono = 'JetBrains Mono, ui-monospace, SFMono-Regular, monospace';

  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 12,
      padding: '8px 16px',
      background: 'rgba(20,20,20,0.92)',
      borderTop: '1px solid rgba(255,255,255,0.08)',
      width: '100%',
      maxWidth: 680,
      alignSelf: 'center',

      borderRadius: 8,
      color: '#f6f4ef',
      fontFamily: 'Inter, system-ui, sans-serif',
      userSelect: 'none',
      flexShrink: 0,
    }}>
      <IconButton onClick={onReset} title="Return to start (0)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        </svg>
      </IconButton>
      <IconButton onClick={onPlayPause} title="Play/pause (space)">
        {playing ? (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="3" y="2" width="3" height="10" fill="currentColor"/>
            <rect x="8" y="2" width="3" height="10" fill="currentColor"/>
          </svg>
        ) : (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 2l9 5-9 5V2z" fill="currentColor"/>
          </svg>
        )}
      </IconButton>

      {/* Current time: fixed width so it doesn't thrash */}
      <div style={{
        fontFamily: mono,
        fontSize: 12,
        fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'right',
        color: '#f6f4ef',
      }}>
        {fmt(time)}
      </div>

      {/* Scrub track */}
      <div
        ref={trackRef}
        onMouseMove={onTrackMove}
        onMouseLeave={onTrackLeave}
        onMouseDown={onTrackDown}
        style={{
          flex: 1,
          height: 22,
          position: 'relative',
          cursor: 'pointer',
          display: 'flex', alignItems: 'center',
        }}
      >
        <div style={{
          position: 'absolute',
          left: 0, right: 0, height: 4,
          background: 'rgba(255,255,255,0.12)',
          borderRadius: 2,
        }}/>
        <div style={{
          position: 'absolute',
          left: 0, width: `${pct}%`, height: 4,
          background: 'oklch(72% 0.12 250)',
          borderRadius: 2,
        }}/>
        <div style={{
          position: 'absolute',
          left: `${pct}%`, top: '50%',
          width: 12, height: 12,
          marginLeft: -6, marginTop: -6,
          background: '#fff',
          borderRadius: 6,
          boxShadow: '0 2px 4px rgba(0,0,0,0.4)',
        }}/>
      </div>

      {/* Duration: fixed width */}
      <div style={{
        fontFamily: mono,
        fontSize: 12,
        fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'left',
        color: 'rgba(246,244,239,0.55)',
      }}>
        {fmt(duration)}
      </div>
    </div>
  );
}

function IconButton({ children, onClick, title }) {
  const [hover, setHover] = React.useState(false);
  return (
    <button
      onClick={onClick}
      title={title}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        width: 28, height: 28,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: hover ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)',
        border: '1px solid rgba(255,255,255,0.1)',
        borderRadius: 6,
        color: '#f6f4ef',
        cursor: 'pointer',
        padding: 0,
        transition: 'background 120ms',
      }}
    >
      {children}
    </button>
  );
}


Object.assign(window, {
  Easing, interpolate, animate, clamp,
  TimelineContext, useTime, useTimeline,
  Sprite, SpriteContext, useSprite,
  TextSprite, ImageSprite, RectSprite,
  Stage, PlaybackBar,
});


</script>
<script type="text/babel">
/* inlined: fm_shared.jsx */
// fm_shared.jsx — Fund Mapping Animation: shared constants + primitives

const FM = {
  BG: '#08090C',

// Particle stream between two points on an SVG canvas
function FMStream({ fromX, fromY, toX, toY, progress, active = true, color, count = 10, stageW = 1280, stageH = 720 }) {
  const col = color || FM.ACCENT;
  const dx = toX - fromX, dy = toY - fromY;
  const len = Math.sqrt(dx*dx + dy*dy);
  const angle = Math.atan2(dy, dx) * 180 / Math.PI;
  const t = useTime();

  return (
    <>
      <div style={{
        position: 'absolute', left: fromX, top: fromY,
        width: len * progress, height: 1.5,
        transformOrigin: '0 50%',
        transform: `translateY(-0.75px) rotate(${angle}deg)`,
        background: `linear-gradient(90deg, transparent, ${col} 25%, ${col} 75%, transparent)`,
        opacity: 0.35,
        pointerEvents: 'none',
      }} />
      {active && Array.from({ length: count }).map((_, i) => {
        const stagger = i / count;
        const p = ((t * 0.8 - stagger) % 1);
        if (p < 0 || p > progress) return null;
        const x = fromX + dx * p;
        const y = fromY + dy * p + Math.sin(p * Math.PI * 3 + i) * 3;
        const op = Math.sin(p * Math.PI);
        return (
          <div key={i} style={{
            position: 'absolute',
            left: x - 3, top: y - 3,
            width: 6, height: 6, borderRadius: 3,
            background: col, opacity: op * 0.85,
            boxShadow: `0 0 10px ${col}`,
            pointerEvents: 'none',
          }} />
        );
      })}
    </>
  );
}

// Bezier arc flow (SVG path)
function FMArc({ fromX, fromY, toX, toY, progress, color, curveDir = 1 }) {
  const col = color || FM.ACCENT;
  const cpX = (fromX + toX) / 2;
  const cpY = fromY + curveDir * 60;
  const d = `M ${fromX} ${fromY} Q ${cpX} ${cpY} ${toX} ${toY}`;
  const pathRef = React.useRef(null);
  const [len, setLen] = React.useState(300);
  React.useEffect(() => {
    if (pathRef.current) setLen(pathRef.current.getTotalLength());
  }, [fromX, fromY, toX, toY]);

  const t = useTime();
  const particles = [];
  if (len > 0 && progress > 0 && progress < 1) {
    for (let i = 0; i < 8; i++) {
      const stagger = i / 8;
      const p = ((t * 0.6 - stagger) % 1);
      if (p < 0 || p > progress || !pathRef.current) continue;
      try {
        const pt = pathRef.current.getPointAtLength(len * p);
        particles.push({ x: pt.x, y: pt.y, op: Math.sin(p * Math.PI), key: i });
      } catch {}
    }
  }

  return (
    <svg style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'visible' }}
      width={1280} height={720}>
      <path ref={pathRef} d={d} fill="none" stroke={col} strokeWidth={1.5}
        strokeDasharray={len} strokeDashoffset={len * (1 - progress)}
        opacity={progress > 0 ? 0.5 : 0} />
      {particles.map(pt => (
        <circle key={pt.key} cx={pt.x} cy={pt.y} r={3} fill={col} opacity={pt.op}
          style={{ filter: `drop-shadow(0 0 5px ${col})` }} />
      ))}
    </svg>
  );
}

  const fundCardW = 200, fundCardH = 100, fundGap = 10;
  const fundX = 60, fundStartY = 210;

  // Participant cards stagger in
  const pCardIn = (pi) => Easing.easeOutCubic(clamp((t - (0.3 + pi * 0.2)) / 0.6, 0, 1));
  const pCardX = 460, pCardW = 760, pCardH = 168, pCardGap = 14;

  // Per-fund per-participant flow: fi * 0.2 offset + pi * 0.3
  const flowStart = (pi, fi) => 1.0 + pi * 0.5 + fi * 0.18;
  const flowDur = 1.4;
  const flowP = (pi, fi) => Easing.easeInOutCubic(clamp((t - flowStart(pi, fi)) / flowDur, 0, 1));

  // Fund cards drain
  const fundDrain = (fi) => {
    const total = TIK_PARTICIPANTS.reduce((s, _, pi) => s + tikParticipantShares(pi, fi) * flowP(pi, fi), 0);
    return total / TIK_FUNDS[fi].shares;
  };

  return (
    <div style={{ position: 'absolute', inset: 0, opacity: sceneIn * sceneOut }}>
      <FMGlow x={200} y={200} size={500} opacity={0.08} />
      <FMGlow x={900} y={400} size={600} color={FM.ACCENT} opacity={0.09} />

      {/* Fund containers — left, draining */}
      {TIK_FUNDS.map((f, fi) => {
        const drain = fundDrain(fi);
        const remaining = Math.round(f.shares * (1 - drain));
        return (
          <div key={f.id} style={{
            position: 'absolute', left: fundX, top: fundStartY + fi * (fundCardH + fundGap),
            width: fundCardW, height: fundCardH,
            opacity: Math.max(0.2, 1 - drain * 0.7),

                <div style={{ marginTop: 8, height: 3, borderRadius: 2, background: FM.BORDER_HI, overflow: 'hidden' }}>
                  <div style={{ height: '100%', width: `${(1 - drain) * 100}%`, background: f.color }} />
                </div>
              </div>
            </FMPanel>
          </div>
        );

      {TIK_PARTICIPANTS.map((p, pi) => {
        const cardTop = 100 + pi * (pCardH + pCardGap);

          const fp = flowP(pi, fi);

          return (
            <FMArc key={`${pi}-${fi}`}
              fromX={fundX + fundCardW} fromY={fundStartY + fi * (fundCardH + fundGap) + fundCardH / 2}

              progress={fp} color={f.color}
              curveDir={pi === 0 ? -1 : (pi === 1 ? 0.5 : 1.5)}

                {TIK_FUNDS.map((f, fi) => {

                      </div>
                    </div>
                  );
                })}
              </div>
            </FMPanel>
          </div>
        );
      })}

      <SceneCaption n={6} total={7} t={t} label="Shares applied to participant accounts — no trading" />
    </div>

  const totalW = TIK_PARTICIPANTS.length * cardW + (TIK_PARTICIPANTS.length - 1) * cardGap;
  const startX = Math.max(60, (1280 - totalW) / 2);
  const totalShares = TIK_FUNDS.reduce((s, f) => s + f.shares, 0);

  return (
    <div style={{ position: 'absolute', inset: 0, opacity: sceneIn }}>
      <FMGlow x={400} y={50} size={700} color={FM.SUCCESS} opacity={0.07 + pulse * 0.04} />
      <FMGlow x={750} y={500} size={500} opacity={0.07} />

      {/* Summary — top */}
      <div style={{
        position: 'absolute', left: startX, top: 88,
        width: totalW,
        display: 'flex', alignItems: 'center', gap: 28,
        opacity: summaryIn,
      }}>
        {[
          { label: 'Total Shares Applied', val: totalShares.toLocaleString() + ' sh' },
          { label: 'Participants', val: '3' },
          { label: 'Fund Lines', val: '9' },
          { label: 'Share Variance', val: '0 sh', color: FM.SUCCESS },
        ].map((item, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 34, background: FM.BORDER_HI }} />}
            <div>
              <div style={{ fontFamily: FM.MONO, fontSize: 9, color: FM.DIMMER, letterSpacing: '0.14em', marginBottom: 5 }}>{item.label}</div>
              <div style={{ fontFamily: FM.SANS, fontSize: 24, fontWeight: 500, color: item.color || FM.TEXT, fontVariantNumeric: 'tabular-nums', letterSpacing: '-0.02em' }}>{item.val}</div>
            </div>
          </React.Fragment>
        ))}
        {/* Transfer Complete pill */}
        <div style={{ marginLeft: 'auto', opacity: confIn }}>
          <div style={{
            display: 'inline-flex', alignItems: 'center', gap: 10,
            background: FM.SUCCESS_S, border: `1px solid ${FM.SUCCESS}`,
            borderRadius: 100, padding: '9px 14px 9px 12px',
            boxShadow: `0 0 24px ${FM.SUCCESS_S}`,
          }}>
            <div style={{ width: 18, height: 18, borderRadius: 9, background: FM.SUCCESS, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                <path d="M2 5.2l2 2L8 3.2" stroke="#08090C" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </div>
            <div style={{ fontFamily: FM.SANS, fontSize: 13, fontWeight: 500, color: FM.SUCCESS }}>Transfer Complete</div>
          </div>
        </div>
      </div>

      {/* Participant cards */}
      {TIK_PARTICIPANTS.map((p, pi) => {
        const inP = cardIn(pi);
        const chk = checkIn(pi);
        const pTotal = tikParticipantValue(pi);
        const pShares = TIK_FUNDS.reduce((s, _, fi) => s + tikParticipantShares(pi, fi), 0);

        return (
          <div key={p.id} style={{
            position: 'absolute',
            left: startX + pi * (cardW + cardGap), top: 185,
            width: cardW, height: cardH,
            opacity: inP, transform: `translateY(${(1-inP)*10}px)`,
          }}>
            <FMPanel x={0} y={0} w={cardW} h={cardH} elevated>
              <div style={{
                position: 'absolute', top: 0, left: 0, right: 0, height: 1,
                background: `linear-gradient(90deg, transparent, ${FM.ACCENT}, transparent)`,
                opacity: 0.5,
              }} />
              <div style={{ padding: '16px 20px', borderBottom: `1px solid ${FM.BORDER}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div>
                  <div style={{ fontFamily: FM.MONO, fontSize: 10, color: FM.DIMMER, letterSpacing: '0.12em', marginBottom: 3 }}>{p.id}</div>
                  <div style={{ fontFamily: FM.SANS, fontSize: 14, fontWeight: 500, color: FM.TEXT }}>{p.label} · {p.pct}%</div>
                </div>
                <div style={{
                  width: 22, height: 22, borderRadius: 11,
                  background: chk > 0 ? FM.SUCCESS_S : 'transparent',
                  border: `1px solid ${chk > 0 ? FM.SUCCESS : FM.BORDER}`,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
                    <path d="M2.2 5.5l2.2 2.2L8.8 3.3" stroke={FM.SUCCESS} strokeWidth="1.8"
                      strokeLinecap="round" strokeLinejoin="round"
                      strokeDasharray="13" strokeDashoffset={13 - 13 * chk} />
                  </svg>
                </div>
              </div>

              <div style={{ padding: '14px 20px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 12 }}>
                  <div>
                    <div style={{ fontFamily: FM.MONO, fontSize: 9, color: FM.DIMMER, marginBottom: 4, letterSpacing: '0.12em' }}>TOTAL SHARES</div>
                    <div style={{ fontFamily: FM.SANS, fontSize: 22, fontWeight: 500, color: FM.TEXT, fontVariantNumeric: 'tabular-nums' }}>
                      {Math.round(pShares).toLocaleString()} sh
                    </div>
                  </div>
                  <div style={{ textAlign: 'right' }}>
                    <div style={{ fontFamily: FM.MONO, fontSize: 9, color: FM.DIMMER, marginBottom: 4, letterSpacing: '0.12em' }}>MARKET VALUE</div>
                    <div style={{ fontFamily: FM.SANS, fontSize: 22, fontWeight: 500, color: FM.TEXT, fontVariantNumeric: 'tabular-nums' }}>
                      ${Math.round(pTotal).toLocaleString()}
                    </div>
                  </div>
                </div>

                {TIK_FUNDS.map((f, fi) => {
                  const sh = tikParticipantShares(pi, fi);
                  return (
                    <div key={f.id} style={{
                      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                      padding: '5px 0', borderTop: `1px solid ${FM.BORDER}`,
                    }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                        <div style={{ width: 4, height: 4, borderRadius: 2, background: f.color }} />
                        <span style={{ fontFamily: FM.MONO, fontSize: 10, color: FM.DIM }}>{f.ticker}</span>
                      </div>
                      <span style={{ fontFamily: FM.MONO, fontSize: 10, color: FM.TEXT, fontVariantNumeric: 'tabular-nums' }}>
                        {Math.round(sh).toLocaleString()} sh
                      </span>
                    </div>
                  );
                })}

                {/* Allocation bar */}
                <div style={{ marginTop: 10, display: 'flex', gap: 2, height: 3 }}>
                  {TIK_FUNDS.map((f, fi) => (
                    <div key={fi} style={{ flex: 1, borderRadius: 2, background: f.color }} />
                  ))}
                </div>
              </div>
            </FMPanel>
          </div>
        );
      })}

      <div style={{
        position: 'absolute', left: startX, bottom: 70,
        display: 'flex', alignItems: 'center', gap: 14,
        opacity: Easing.easeOutCubic(clamp((t - 2.0) / 0.5, 0, 1)),
      }}>
        <div style={{ fontFamily: FM.MONO, fontSize: 10, color: FM.DIMMER, letterSpacing: '0.22em' }}>07 / 07</div>
        <div style={{ width: 28, height: 1, background: FM.BORDER_HI }} />
        <div style={{ fontFamily: FM.SANS, fontSize: 15, fontWeight: 500, color: FM.TEXT }}>All positions applied · no cash conversion</div>
        <div style={{ fontFamily: FM.MONO, fontSize: 10, color: FM.DIMMER, letterSpacing: '0.1em' }}>TIK-2026-04-17-00339</div>
      </div>
    </div>
  );
}

Object.assign(window, { TIKScene4, TIKScene5, TIKScene6, TIKScene7 });

</script>

<script type="text/babel" data-presets="react">
// Scene timing (total 38s)
// S1 Pre-Setup:          0.0 –  5.0  (5s)
// S2 Waiting:            5.0 –  9.0  (4s)
// S3 Shares Arrive:      9.0 – 15.0  (6s)
// S4 Confirmation:      15.0 – 19.0  (4s)
// S5 Final Files:       19.0 – 22.5  (3.5s)
// S6 Apply to Plan:     22.5 – 30.5  (8s)
// S7 Final State:       30.5 – 38.0  (7.5s)

const DURATION = 38;

const SCENES = [
  { n: 1, s: 0,    e: 5.0,  label: 'Pre-Setup' },
  { n: 2, s: 5.0,  e: 9.0,  label: 'Waiting' },
  { n: 3, s: 9.0,  e: 15.0, label: 'Shares Arrive' },
  { n: 4, s: 15.0, e: 19.0, label: 'Confirmation' },
  { n: 5, s: 19.0, e: 22.5, label: 'Final Files' },
  { n: 6, s: 22.5, e: 30.5, label: 'Apply' },
  { n: 7, s: 30.5, e: 38.0, label: 'Complete' },
];

function ProgressDots() {
  const t = useTime();
  return (
    <div style={{
      position: 'absolute', right: 100, bottom: 66,
      display: 'flex', gap: 5, alignItems: 'center',
    }}>
      {SCENES.map(s => {
        const active = t >= s.s && t < s.e;
        const done = t >= s.e;
        return (
          <div key={s.n} style={{
            height: 5, borderRadius: 3,
            width: active ? 18 : 5,
            background: active
              ? 'oklch(70% 0.14 248)'
              : done ? 'rgba(232,234,240,0.42)' : 'rgba(232,234,240,0.13)',
            boxShadow: active ? '0 0 10px oklch(70% 0.14 248 / 0.6)' : 'none',
            transition: 'width 350ms cubic-bezier(0.4,0,0.2,1), background 250ms',
          }} />
        );
      })}
    </div>
  );
}

function App() {
  return (
    <Stage
      width={1280} height={720}
      duration={DURATION}
      background="#08090C"
      persistKey="tik-workflow"
      loop={true}
    >
      {/* Grid */}
      <div style={{
        position: 'absolute', inset: 0,
        backgroundImage: `
          linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px)
        `,
        backgroundSize: '40px 40px',
        maskImage: 'radial-gradient(ellipse at center, black 10%, transparent 72%)',
        WebkitMaskImage: 'radial-gradient(ellipse at center, black 10%, transparent 72%)',
        pointerEvents: 'none',
      }} />
      {/* Vignette */}
      <div style={{
        position: 'absolute', inset: 0,
        background: 'radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.55) 100%)',
        pointerEvents: 'none',
      }} />

      <Sprite start={0}    end={5.0}>  <TIKScene1 /> </Sprite>
      <Sprite start={5.0}  end={9.0}>  <TIKScene2 /> </Sprite>
      <Sprite start={9.0}  end={15.0}> <TIKScene3 /> </Sprite>
      <Sprite start={15.0} end={19.0}> <TIKScene4 /> </Sprite>
      <Sprite start={19.0} end={22.5}> <TIKScene5 /> </Sprite>
      <Sprite start={22.5} end={30.5}> <TIKScene6 /> </Sprite>
      <Sprite start={30.5} end={38.0}> <TIKScene7 /> </Sprite>

      <ProgressDots />
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
