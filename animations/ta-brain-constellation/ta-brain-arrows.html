<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TA Brain — The Bundle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #08090C; overflow: hidden; }
  #root { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

<!-- ── Engine ── -->
<script type="text/babel">
const Easing = {
  linear: (t) => t,
  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInCubic:   (t) => t * t * t,
  easeOutCubic:  (t) => (--t) * t * t + 1,
  easeInOutCubic:(t) => (t < 0.5 ? 4*t*t*t : (t-1)*(2*t-2)*(2*t-2)+1),
  easeInQuart:   (t) => t * t * t * t,
  easeOutQuart:  (t) => 1 - (--t)*t*t*t,
  easeOutExpo:   (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeOutBack:   (t) => { const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); },
};
const clamp = (v, mn, mx) => Math.max(mn, Math.min(mx, v));

const TimelineContext = React.createContext({ time: 0, duration: 10, playing: false });
const useTime = () => React.useContext(TimelineContext).time;
const useTimeline = () => React.useContext(TimelineContext);
const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });
const useSprite = () => React.useContext(SpriteContext);

function Sprite({ start=0, end=Infinity, children }) {
  const { time } = useTimeline();
  if (time < start || time > end) return null;
  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 ? clamp(localTime / duration, 0, 1) : 0;
  const value = { localTime, progress, duration, visible: true };
  return <SpriteContext.Provider value={value}>{typeof children==='function' ? children(value) : children}</SpriteContext.Provider>;
}

function Stage({ width=1280, height=720, duration=10, background='#08090C', loop=true, autoplay=true, persistKey='stage', children }) {
  const [time, setTime] = React.useState(() => { try { const v=parseFloat(localStorage.getItem(persistKey+':t')||'0'); return isFinite(v)?clamp(v,0,duration):0; } catch{return 0;} });
  const [playing, setPlaying] = React.useState(autoplay);
  const [hoverTime, setHoverTime] = React.useState(null);
  const [scale, setScale] = React.useState(1);
  const stageRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  React.useEffect(() => { try{localStorage.setItem(persistKey+':t',String(time));}catch{} }, [time,persistKey]);
  React.useEffect(() => {
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => { const barH=44; const s=Math.min(el.clientWidth/width,(el.clientHeight-barH)/height); setScale(Math.max(0.05,s)); };
    measure(); const ro=new ResizeObserver(measure); ro.observe(el); window.addEventListener('resize',measure);
    return ()=>{ro.disconnect();window.removeEventListener('resize',measure);};
  },[width,height]);
  React.useEffect(() => {
    if (!playing){lastTsRef.current=null;return;}
    const step=(ts)=>{
      if(lastTsRef.current==null)lastTsRef.current=ts;
      const dt=(ts-lastTsRef.current)/1000; lastTsRef.current=ts;
      setTime(t=>{ let n=t+dt; if(n>=duration){if(loop)n=n%duration;else{n=duration;setPlaying(false);}} return n; });
      rafRef.current=requestAnimationFrame(step);
    };
    rafRef.current=requestAnimationFrame(step);
    return ()=>{if(rafRef.current)cancelAnimationFrame(rafRef.current);lastTsRef.current=null;};
  },[playing,duration,loop]);
  React.useEffect(() => {
    const onKey=(e)=>{
      if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
      if(e.code==='Space'){e.preventDefault();setPlaying(p=>!p);}
      else if(e.code==='ArrowLeft')setTime(t=>clamp(t-(e.shiftKey?1:0.1),0,duration));
      else if(e.code==='ArrowRight')setTime(t=>clamp(t+(e.shiftKey?1:0.1),0,duration));
      else if(e.key==='0'||e.code==='Home')setTime(0);
    };
    window.addEventListener('keydown',onKey); return()=>window.removeEventListener('keydown',onKey);
  },[duration]);

  const displayTime = hoverTime!=null ? hoverTime : time;
  const ctxValue = React.useMemo(()=>({time:displayTime,duration,playing,setTime,setPlaying}),[displayTime,duration,playing]);

  return (
    <div ref={stageRef} style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',background:'#0a0a0a'}}>
      <div style={{flex:1,width:'100%',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',minHeight:0}}>
        <div style={{width,height,background,position:'relative',transform:`scale(${scale})`,transformOrigin:'center',flexShrink:0,boxShadow:'0 20px 60px rgba(0,0,0,0.4)',overflow:'hidden'}}>
          <TimelineContext.Provider value={ctxValue}>{children}</TimelineContext.Provider>
        </div>
      </div>
      <PlaybackBar time={displayTime} duration={duration} playing={playing}
        onPlayPause={()=>setPlaying(p=>!p)} onReset={()=>setTime(0)}
        onSeek={(t)=>setTime(t)} onHover={(t)=>setHoverTime(t)} />
    </div>
  );
}

function PlaybackBar({time,duration,playing,onPlayPause,onReset,onSeek,onHover}) {
  const trackRef=React.useRef(null);
  const [dragging,setDragging]=React.useState(false);
  const tfE=React.useCallback((e)=>{const r=trackRef.current.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width,0,1)*duration;},[duration]);
  React.useEffect(()=>{
    if(!dragging)return;
    const onUp=()=>setDragging(false);
    const onMove=(e)=>{if(trackRef.current)onSeek(tfE(e));};
    window.addEventListener('mouseup',onUp);window.addEventListener('mousemove',onMove);
    return()=>{window.removeEventListener('mouseup',onUp);window.removeEventListener('mousemove',onMove);};
  },[dragging,tfE,onSeek]);
  const pct=duration>0?(time/duration)*100:0;
  const fmt=(t)=>{const total=Math.max(0,t);const m=Math.floor(total/60);const s=Math.floor(total%60);const cs=Math.floor((total*100)%100);return `${m}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;};
  const mono='JetBrains Mono,ui-monospace,monospace';
  const btn=(onClick,children)=>(
    <button onClick={onClick} style={{width:28,height:28,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:6,color:'#f6f4ef',cursor:'pointer',padding:0}}>{children}</button>
  );
  return (
    <div style={{display:'flex',alignItems:'center',gap:12,padding:'8px 16px',background:'rgba(20,20,20,0.92)',borderTop:'1px solid rgba(255,255,255,0.08)',width:'100%',maxWidth:680,alignSelf:'center',borderRadius:8,color:'#f6f4ef',userSelect:'none',flexShrink:0}}>
      {btn(onReset,<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/></svg>)}
      {btn(onPlayPause, playing
        ? <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="3" y="2" width="3" height="10" fill="currentColor"/><rect x="8" y="2" width="3" height="10" fill="currentColor"/></svg>
        : <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 2l9 5-9 5V2z" fill="currentColor"/></svg>)}
      <div style={{fontFamily:mono,fontSize:12,fontVariantNumeric:'tabular-nums',width:64,textAlign:'right',color:'#f6f4ef'}}>{fmt(time)}</div>
      <div ref={trackRef} onMouseMove={(e)=>{const t=tfE(e);if(dragging)onSeek(t);else onHover(t);}} onMouseLeave={()=>{if(!dragging)onHover(null);}} onMouseDown={(e)=>{setDragging(true);onSeek(tfE(e));onHover(null);}} style={{flex:1,height:22,position:'relative',cursor:'pointer',display:'flex',alignItems:'center'}}>
        <div style={{position:'absolute',left:0,right:0,height:4,background:'rgba(255,255,255,0.12)',borderRadius:2}}/>
        <div style={{position:'absolute',left:0,width:`${pct}%`,height:4,background:'oklch(72% 0.12 250)',borderRadius:2}}/>
        <div style={{position:'absolute',left:`${pct}%`,top:'50%',width:12,height:12,marginLeft:-6,marginTop:-6,background:'#fff',borderRadius:6,boxShadow:'0 2px 4px rgba(0,0,0,0.4)'}}/>
      </div>
      <div style={{fontFamily:mono,fontSize:12,fontVariantNumeric:'tabular-nums',width:64,textAlign:'left',color:'rgba(246,244,239,0.55)'}}>{fmt(duration)}</div>
    </div>
  );
}
Object.assign(window,{Easing,clamp,TimelineContext,useTime,useTimeline,Sprite,SpriteContext,useSprite,Stage});
</script>

<!-- ── Tokens + shared ── -->
<script type="text/babel">
const FM = {
  TEXT:'oklch(96% 0.008 250)', DIM:'oklch(72% 0.015 250)', DIMMER:'oklch(50% 0.012 250)',
  BORDER:'rgba(255,255,255,0.06)', BORDER_HI:'rgba(255,255,255,0.12)',
  ACCENT:'oklch(72% 0.14 248)', ACCENT_S:'oklch(72% 0.14 248 / 0.16)',
  SUCCESS:'oklch(76% 0.16 150)', SUCCESS_S:'oklch(76% 0.16 150 / 0.16)',
  MONO:'JetBrains Mono, ui-monospace, monospace', SANS:'Inter, system-ui, sans-serif',
};
function FMGlow({x,y,size=500,color=FM.ACCENT,opacity=0.1}) {
  return <div style={{position:'absolute',left:x-size/2,top:y-size/2,width:size,height:size,background:`radial-gradient(circle,${color} 0%,transparent 60%)`,opacity,pointerEvents:'none',filter:'blur(24px)'}}/>;
}
function FMChip({label,color=FM.ACCENT,soft=FM.ACCENT_S}) {
  return <div style={{display:'inline-flex',alignItems:'center',padding:'3px 9px',borderRadius:100,background:soft,border:`1px solid ${color}`,fontFamily:FM.MONO,fontSize:9,color,letterSpacing:'0.12em',textTransform:'uppercase',whiteSpace:'nowrap'}}>{label}</div>;
}
function SceneCaption({n,total,t,label}) {
  const inP=Easing.easeOutCubic(clamp(t/0.5,0,1));
  return (
    <div style={{position:'absolute',left:80,bottom:70,display:'flex',alignItems:'center',gap:14,opacity:inP}}>
      <div style={{fontFamily:FM.MONO,fontSize:10,color:FM.DIMMER,letterSpacing:'0.22em'}}>{String(n).padStart(2,'0')} / {String(total).padStart(2,'0')}</div>
      <div style={{width:28,height:1,background:FM.BORDER_HI}}/>
      <div style={{fontFamily:FM.SANS,fontSize:15,fontWeight:500,color:FM.TEXT}}>{label}</div>
    </div>
  );
}
Object.assign(window,{FM,FMGlow,FMChip,SceneCaption});
</script>

<!-- ── Arrow scenes ── -->
<script type="text/babel">

// Each arrow: a team, a color, and a spawn origin at screen edge
const ARROWS = [
  { id:'DC',         label:'Data Consultant',  color:'oklch(74% 0.16 248)', soft:'oklch(74% 0.16 248/0.2)', fromX:-60,  fromY:180, angle: 15 },
  { id:'COM',        label:'Conv. Ops Mgr',    color:'oklch(74% 0.16 295)', soft:'oklch(74% 0.16 295/0.2)', fromX:1340, fromY:155, angle:168 },
  { id:'PAYROLL',    label:'Payroll Support',  color:'oklch(74% 0.16 150)', soft:'oklch(74% 0.16 150/0.2)', fromX:-60,  fromY:420, angle:  5 },
  { id:'FTP',        label:'FTP Team',         color:'oklch(74% 0.16 200)', soft:'oklch(74% 0.16 200/0.2)', fromX:1340, fromY:400, angle:175 },
  { id:'CASHIERING', label:'Cashiering',       color:'oklch(78% 0.15 75)',  soft:'oklch(78% 0.15 75/0.2)',  fromX:640,  fromY:780, angle:272 },
  { id:'AQT',        label:'AQT',              color:'oklch(74% 0.16 320)', soft:'oklch(74% 0.16 320/0.2)', fromX:200,  fromY:-50, angle: 95 },
  { id:'PROD',       label:'Prod Support',     color:'oklch(74% 0.16 30)',  soft:'oklch(74% 0.16 30/0.2)',  fromX:-60,  fromY:310, angle: 22 },
  { id:'NBI',        label:'NBI',              color:'oklch(74% 0.16 180)', soft:'oklch(74% 0.16 180/0.2)', fromX:900,  fromY:-50, angle:100 },
];

// Where each arrow rests when floating alone (scattered positions)
const FLOAT_POS = [
  { x:210, y:200 }, { x:950, y:175 }, { x:175, y:455 }, { x:1050, y:440 },
  { x:640, y:560 }, { x:460, y:140 }, { x:140, y:360 }, { x:820,  y:135 },
];

// Bundle center
const CX = 640, CY = 340;
// Vertical spacing between arrows in bundle
const BUNDLE_STEP = 22;

// Arrow SVG — pointing right by default, rotated via transform
function ArrowSVG({ x, y, angleDeg=0, length=110, color, opacity=1, glowAmt=0, broken=false, brokenProgress=0 }) {
  const rad = angleDeg * Math.PI / 180;
  const cos = Math.cos(rad), sin = Math.sin(rad);
  const tipX = x + cos * length, tipY = y + sin * length;
  const tailX = x - cos * length * 0.5, tailY = y - sin * length * 0.5;

  // Arrowhead triangle at tip
  const headLen = 12, headW = 6;
  const perpX = -sin, perpY = cos;
  const h1x = tipX - cos*headLen + perpX*headW, h1y = tipY - sin*headLen + perpY*headW;
  const h2x = tipX - cos*headLen - perpX*headW, h2y = tipY - sin*headLen - perpY*headW;

  const glow = glowAmt > 0 ? `drop-shadow(0 0 ${glowAmt * 12}px ${color})` : undefined;

  if (broken && brokenProgress > 0) {
    // Snap: draw two halves that separate
    const midX = (tailX + tipX) / 2, midY = (tailY + tipY) / 2;
    const breakOffset = brokenProgress * 18;
    const breakAngle = brokenProgress * 25 * Math.PI / 180;
    // Top half rotates up-left, bottom half rotates down-right
    const cos2 = Math.cos(breakAngle), sin2 = Math.sin(breakAngle);
    // rotate around midpoint
    const dx1 = tailX - midX, dy1 = tailY - midY;
    const rx1 = dx1*cos2 - dy1*sin2 + midX, ry1 = dx1*sin2 + dy1*cos2 + midY;
    const dx2 = tipX - midX, dy2 = tipY - midY;
    const rx2 = dx2*Math.cos(-breakAngle) - dy2*Math.sin(-breakAngle) + midX;
    const ry2 = dx2*Math.sin(-breakAngle) + dy2*Math.cos(-breakAngle) + midY;
    const fallY = breakOffset;
    return (
      <g opacity={opacity} style={{filter:glow}}>
        <line x1={rx1} y1={ry1+fallY} x2={midX} y2={midY+fallY} stroke={color} strokeWidth="2.5" strokeLinecap="round"/>
        <line x1={midX} y1={midY-fallY} x2={rx2} y2={ry2-fallY} stroke={color} strokeWidth="2.5" strokeLinecap="round"/>
        <path d={`M ${h1x} ${h1y} L ${tipX} ${tipY} L ${h2x} ${h2y}`} fill={color}
          transform={`translate(0,${-fallY}) rotate(${-breakAngle*180/Math.PI},${midX},${midY})`}/>
      </g>
    );
  }

  return (
    <g opacity={opacity} style={{filter:glow}}>
      <line x1={tailX} y1={tailY} x2={tipX} y2={tipY} stroke={color} strokeWidth="2.5" strokeLinecap="round"/>
      <path d={`M ${h1x} ${h1y} L ${tipX} ${tipY} L ${h2x} ${h2y}`} fill={color}/>
    </g>
  );
}

// ── Scene 1 — Scattered (0–5s) ────────────────────────────────────────────────
function Scene1() {
  const { localTime: t, duration } = useSprite();
  const exitT = duration - 0.6;
  const sceneOut = t > exitT ? 1 - Easing.easeInCubic(clamp((t-exitT)/0.6,0,1)) : 1;
  const sceneIn  = Easing.easeOutCubic(clamp(t/0.4,0,1));

  // Each arrow flies in from its spawn point to its float position
  const arrIn = (i) => Easing.easeOutExpo(clamp((t - 0.2 - i*0.38)/0.9,0,1));

  return (
    <div style={{position:'absolute',inset:0,opacity:sceneIn*sceneOut}}>
      <FMGlow x={640} y={360} size={800} color={FM.ACCENT} opacity={0.04}/>
      <svg style={{position:'absolute',inset:0,pointerEvents:'none'}} width="1280" height="720" viewBox="0 0 1280 720">
        {ARROWS.map((a,i) => {
          const prog = arrIn(i);
          const fp = FLOAT_POS[i];
          const x = a.fromX + (fp.x - a.fromX) * prog;
          const y = a.fromY + (fp.y - a.fromY) * prog;
          // drift angle settles to 0 (horizontal)
          const ang = a.angle * (1 - Easing.easeOutCubic(clamp((t-0.2-i*0.38)/1.1,0,1)));
          // gentle float bob
          const bob = 4 * Math.sin((t + i * 0.7) * 1.4);
          return (
            <g key={a.id}>
              <ArrowSVG x={x} y={y + bob} angleDeg={ang} length={90} color={a.color} opacity={prog * 0.85}/>
              {prog > 0.6 && (
                <text x={x} y={y + bob + 22} textAnchor="middle"
                  fontFamily="JetBrains Mono,ui-monospace,monospace"
                  fontSize="9" letterSpacing="0.12em"
                  fill={a.color} opacity={prog * 0.75}>{a.id}</text>
              )}
            </g>
          );
        })}
      </svg>
      <SceneCaption n={1} total={5} t={t} label="Strong minds — working alone"/>
    </div>
  );
}

// ── Scene 2 — The Lone Arrow Breaks (5–9s) ────────────────────────────────────
function Scene2() {
  const { localTime: t, duration } = useSprite();
  const exitT = duration - 0.6;
  const sceneOut = t > exitT ? 1 - Easing.easeInCubic(clamp((t-exitT)/0.6,0,1)) : 1;
  const sceneIn  = Easing.easeOutCubic(clamp(t/0.5,0,1));

  // DC arrow is in focus center. Others dim to ghosts.
  const focusIn  = Easing.easeOutCubic(clamp((t-0.3)/0.8,0,1));
  // Impact ring expands at t=1.8
  const impactT  = clamp((t-1.8)/0.4,0,1);
  const impactR  = impactT * 120;
  const impactOp = impactT > 0 ? (1 - impactT) * 0.9 : 0;
  // Break starts at t=2.0
  const breakT   = Easing.easeInQuad(clamp((t-2.0)/0.7,0,1));
  // Force arrow (pressing from left) appears at t=1.2
  const forceIn  = Easing.easeOutCubic(clamp((t-1.2)/0.5,0,1));
  const forceTravelX = forceIn * 90;

  return (
    <div style={{position:'absolute',inset:0,opacity:sceneIn*sceneOut}}>
      <FMGlow x={640} y={350} size={600} color={FM.ACCENT} opacity={0.05}/>

      <svg style={{position:'absolute',inset:0,pointerEvents:'none'}} width="1280" height="720" viewBox="0 0 1280 720">
        {/* Ghost arrows in background */}
        {ARROWS.map((a,i) => {
          if(i===0) return null;
          const fp = FLOAT_POS[i];
          return <ArrowSVG key={a.id} x={fp.x} y={fp.y} angleDeg={0} length={90} color={a.color} opacity={0.18}/>;
        })}

        {/* DC arrow center stage */}
        <ArrowSVG x={CX} y={CY} angleDeg={0} length={110}
          color={ARROWS[0].color} opacity={focusIn}
          glowAmt={focusIn * 0.5}
          broken={breakT > 0} brokenProgress={breakT}/>

        {/* "Alone" label */}
        {focusIn > 0.5 && (
          <text x={CX} y={CY+38} textAnchor="middle"
            fontFamily="JetBrains Mono,ui-monospace,monospace"
            fontSize="10" letterSpacing="0.14em"
            fill={ARROWS[0].color} opacity={focusIn * (1-breakT)}>{ARROWS[0].id} — ALONE</text>
        )}

        {/* Force indicator — arrow pushing from left */}
        {forceIn > 0 && breakT < 0.9 && (
          <g opacity={forceIn * (1 - breakT * 1.2)}>
            <line x1={CX - 200 + forceTravelX} y1={CY} x2={CX - 80 + forceTravelX} y2={CY}
              stroke="rgba(255,255,255,0.4)" strokeWidth="2" strokeDasharray="6 4"/>
            <path d={`M ${CX-88+forceTravelX} ${CY-6} L ${CX-74+forceTravelX} ${CY} L ${CX-88+forceTravelX} ${CY+6}`}
              fill="rgba(255,255,255,0.4)"/>
          </g>
        )}

        {/* Impact ring */}
        {impactOp > 0 && (
          <circle cx={CX} cy={CY} r={impactR} stroke="rgba(255,255,255,0.6)" strokeWidth="1.5" fill="none" opacity={impactOp}/>
        )}

        {/* Break flash */}
        {breakT > 0.1 && breakT < 0.6 && (
          <circle cx={CX} cy={CY} r={20*breakT} fill="rgba(255,255,255,0.15)" opacity={1-breakT*2}/>
        )}
      </svg>

      {/* "Snapped" label after break */}
      {breakT > 0.5 && (
        <div style={{
          position:'absolute', left:'50%', top:'58%',
          transform:'translateX(-50%)',
          fontFamily:FM.MONO, fontSize:10, color:'oklch(68% 0.20 25)',
          letterSpacing:'0.18em', textTransform:'uppercase',
          opacity: Easing.easeOutCubic(clamp((t-2.6)/0.5,0,1)) * sceneOut,
        }}>One alone — easily broken</div>
      )}

      <SceneCaption n={2} total={5} t={t} label="One alone — easily broken"/>
    </div>
  );
}

// ── Scene 3 — The Gathering (9–15s) ──────────────────────────────────────────
function Scene3() {
  const { localTime: t, duration } = useSprite();
  const exitT = duration - 0.6;
  const sceneOut = t > exitT ? 1 - Easing.easeInCubic(clamp((t-exitT)/0.6,0,1)) : 1;
  const sceneIn  = Easing.easeOutCubic(clamp(t/0.4,0,1));

  // Arrows rush from float positions to bundle positions
  // Bundle: all horizontal, stacked vertically at CX,CY
  const gatherProg = (i) => Easing.easeInOutCubic(clamp((t - 0.3 - i*0.2)/1.4,0,1));

  const bundleY = (i) => CY + (i - (ARROWS.length-1)/2) * BUNDLE_STEP;

  return (
    <div style={{position:'absolute',inset:0,opacity:sceneIn*sceneOut}}>
      <FMGlow x={CX} y={CY} size={700} color={FM.ACCENT} opacity={0.06 + 0.04*Easing.easeOutCubic(clamp(t/3,0,1))}/>

      <svg style={{position:'absolute',inset:0,pointerEvents:'none'}} width="1280" height="720" viewBox="0 0 1280 720">
        {ARROWS.map((a, i) => {
          const prog = gatherProg(i);
          const fp = FLOAT_POS[i];
          const bY = bundleY(i);
          const x = fp.x + (CX - fp.x) * prog;
          const y = fp.y + (bY  - fp.y) * prog;
          const glow = prog > 0.7 ? (prog - 0.7) / 0.3 : 0;
          return (
            <g key={a.id}>
              <ArrowSVG x={x} y={y} angleDeg={0} length={110} color={a.color} opacity={0.85} glowAmt={glow*0.6}/>
            </g>
          );
        })}
      </svg>

      {/* Pull label */}
      <div style={{
        position:'absolute', left:'50%', top:'16%',
        transform:'translateX(-50%)',
        fontFamily:FM.MONO, fontSize:10, color:FM.DIMMER,
        letterSpacing:'0.18em', textTransform:'uppercase',
        opacity: Easing.easeOutCubic(clamp((t-0.5)/0.6,0,1)) * sceneOut,
        whiteSpace:'nowrap',
      }}>↓ knowledge converges ↓</div>

      <SceneCaption n={3} total={5} t={t} label="Together — the pull toward unity"/>
    </div>
  );
}

// ── Scene 4 — Unbreakable (15–20s) ───────────────────────────────────────────
function Scene4() {
  const { localTime: t, duration } = useSprite();
  const exitT = duration - 0.6;
  const sceneOut = t > exitT ? 1 - Easing.easeInCubic(clamp((t-exitT)/0.6,0,1)) : 1;
  const sceneIn  = Easing.easeOutCubic(clamp(t/0.5,0,1));

  const bundleY = (i) => CY + (i - (ARROWS.length-1)/2) * BUNDLE_STEP;

  // Collective breathe pulse
  const breathe = 1 + 0.04 * Math.sin(t * 2.2);
  const glowBreath = 0.10 + 0.06 * Math.sin(t * 1.8);

  // Force comes in at t=1.5, hits bundle at t=2.2, fails, recoils
  const forceIn    = Easing.easeOutCubic(clamp((t-1.5)/0.5,0,1));
  const rawForce   = clamp((t-1.5)/0.7,0,1);
  const forceHit   = rawForce >= 1;
  // Force travels right, hits, then snaps back left
  const forceX     = forceHit
    ? CX - 100 - Easing.easeOutExpo(clamp((t-2.2)/0.5,0,1)) * 120
    : CX - 220 + rawForce * 120;
  const forceOp = forceIn * (1 - Easing.easeInCubic(clamp((t-2.5)/0.5,0,1)));

  // Recoil flash
  const flashT = clamp((t-2.2)/0.3,0,1);
  const flashOp = flashT > 0 && flashT < 1 ? Math.sin(flashT*Math.PI)*0.8 : 0;

  // "Unbreakable" text
  const wordIn = Easing.easeOutCubic(clamp((t-2.8)/0.6,0,1));

  return (
    <div style={{position:'absolute',inset:0,opacity:sceneIn*sceneOut}}>
      <FMGlow x={CX} y={CY} size={800} color={FM.ACCENT} opacity={glowBreath}/>
      {ARROWS.map((a,i)=>(
        <FMGlow key={a.id} x={CX} y={bundleY(i)} size={200} color={a.color} opacity={0.06*breathe}/>
      ))}

      <svg style={{position:'absolute',inset:0,pointerEvents:'none'}} width="1280" height="720" viewBox="0 0 1280 720">
        {/* The bundle — tightly packed */}
        {ARROWS.map((a,i)=>(
          <ArrowSVG key={a.id} x={CX} y={bundleY(i)} angleDeg={0} length={110*breathe}
            color={a.color} opacity={0.92} glowAmt={0.5*breathe}/>
        ))}

        {/* Force brace bracket on left */}
        {forceOp > 0 && (
          <g opacity={forceOp}>
            <line x1={forceX} y1={CY-90} x2={forceX} y2={CY+90} stroke="rgba(255,255,255,0.5)" strokeWidth="2.5"/>
            <line x1={forceX} y1={CY} x2={forceX+70} y2={CY} stroke="rgba(255,255,255,0.35)" strokeWidth="1.5" strokeDasharray="5 3"/>
            <path d={`M ${forceX+58} ${CY-7} L ${forceX+72} ${CY} L ${forceX+58} ${CY+7}`} fill="rgba(255,255,255,0.5)"/>
          </g>
        )}

        {/* Recoil flash ring */}
        {flashOp > 0 && (
          <circle cx={CX} cy={CY} r={80+flashT*40} stroke={FM.ACCENT} strokeWidth="2" fill="none" opacity={flashOp}/>
        )}
      </svg>

      {/* Unbreakable text */}
      {wordIn > 0 && (
        <div style={{
          position:'absolute', left:'50%', top:'20%',
          transform:'translateX(-50%)',
          fontFamily:FM.SANS, fontSize:20, fontWeight:600,
          color:FM.TEXT, letterSpacing:'-0.01em',
          opacity: wordIn * sceneOut,
          background:'rgba(8,9,12,0.7)',
          padding:'10px 24px', borderRadius:8,
          border:`1px solid ${FM.BORDER_HI}`,
          backdropFilter:'blur(8px)',
          whiteSpace:'nowrap',
        }}>Unbreakable</div>
      )}

      <SceneCaption n={4} total={5} t={t} label="Together — unbreakable"/>
    </div>
  );
}

// ── Scene 5 — TA Brain (20–24s) ───────────────────────────────────────────────
function Scene5() {
  const { localTime: t } = useSprite();
  const sceneIn   = Easing.easeOutCubic(clamp(t/0.5,0,1));
  const logoIn    = Easing.easeOutCubic(clamp((t-0.3)/1.0,0,1));
  const taglineIn = Easing.easeOutCubic(clamp((t-1.1)/0.8,0,1));
  const chipIn    = Easing.easeOutCubic(clamp((t-1.9)/0.6,0,1));
  const glowBreath = 0.10 + 0.04*Math.sin(t*1.4);
  const bundleY = (i) => CY + (i-(ARROWS.length-1)/2)*BUNDLE_STEP;
  const breathe = 1 + 0.03*Math.sin(t*2.2);

  return (
    <div style={{position:'absolute',inset:0,opacity:sceneIn}}>
      <FMGlow x={CX} y={CY} size={900} color={FM.ACCENT} opacity={glowBreath}/>
      <FMGlow x={CX} y={CY} size={380} color={FM.SUCCESS} opacity={chipIn*0.07}/>

      <svg style={{position:'absolute',inset:0,pointerEvents:'none'}} width="1280" height="720" viewBox="0 0 1280 720">
        {ARROWS.map((a,i)=>(
          <ArrowSVG key={a.id} x={CX} y={bundleY(i)} angleDeg={0} length={110*breathe}
            color={a.color} opacity={0.65} glowAmt={0.4}/>
        ))}
      </svg>

      {/* Logo card */}
      <div style={{position:'absolute',left:'50%',top:'50%',transform:`translate(-50%,-50%) translateY(${(1-logoIn)*14}px)`,opacity:logoIn,textAlign:'center',pointerEvents:'none'}}>
        <div style={{background:'rgba(8,9,12,0.82)',border:`1px solid ${FM.BORDER_HI}`,borderRadius:14,backdropFilter:'blur(18px)',padding:'28px 52px 24px',display:'inline-flex',flexDirection:'column',alignItems:'center',gap:10,boxShadow:'0 24px 60px -16px rgba(0,0,0,0.85)'}}>
          <div style={{fontFamily:FM.SANS,fontSize:40,fontWeight:600,color:FM.TEXT,letterSpacing:'-0.03em',lineHeight:1}}>
            <span style={{color:FM.ACCENT}}>TA</span>{' '}Brain
          </div>
          <div style={{fontFamily:FM.MONO,fontSize:10,color:FM.DIMMER,letterSpacing:'0.18em',textTransform:'uppercase',opacity:taglineIn,marginTop:2}}>Collective Intelligence</div>
          <div style={{opacity:chipIn,marginTop:6,transform:`scale(${0.85+0.15*chipIn})`}}>
            <FMChip label="✓  Knowledge Connected" color={FM.SUCCESS} soft={FM.SUCCESS_S}/>
          </div>
        </div>
      </div>

      <SceneCaption n={5} total={5} t={t} label="TA Brain — Collective Intelligence"/>
    </div>
  );
}

Object.assign(window,{Scene1,Scene2,Scene3,Scene4,Scene5});
</script>

<!-- ── App ── -->
<script type="text/babel" data-presets="react">
const SCENES = [
  { n:1, s: 0.0, e: 5.0, label:'Strong minds, working alone' },
  { n:2, s: 5.0, e: 9.0, label:'One alone — easily broken' },
  { n:3, s: 9.0, e:15.0, label:'Together — the pull toward unity' },
  { n:4, s:15.0, e:20.0, label:'Together — unbreakable' },
  { n:5, s:20.0, e:24.0, label:'TA Brain — Collective Intelligence' },
];
const DURATION = 24.0;

function ProgressDots() {
  const t = useTime();
  return (
    <div style={{position:'absolute',right:100,bottom:66,display:'flex',gap:5,alignItems:'center'}}>
      {SCENES.map(s=>{
        const active=t>=s.s&&t<s.e, done=t>=s.e;
        return <div key={s.n} style={{height:5,borderRadius:3,width:active?18:5,background:active?'oklch(72% 0.14 248)':done?'rgba(232,234,240,0.42)':'rgba(232,234,240,0.13)',boxShadow:active?'0 0 10px oklch(72% 0.14 248/0.6)':'none',transition:'width 350ms cubic-bezier(0.4,0,0.2,1),background 250ms'}}/>;
      })}
    </div>
  );
}

function App() {
  return (
    <Stage width={1280} height={720} duration={DURATION} background="#08090C" persistKey="ta-brain-arrows" loop={true}>
      <div style={{position:'absolute',inset:0,backgroundImage:`linear-gradient(rgba(255,255,255,0.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.012) 1px,transparent 1px)`,backgroundSize:'40px 40px',maskImage:'radial-gradient(ellipse at center,black 10%,transparent 72%)',WebkitMaskImage:'radial-gradient(ellipse at center,black 10%,transparent 72%)',pointerEvents:'none'}}/>
      <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,0.60) 100%)',pointerEvents:'none'}}/>
      <Sprite start={ 0.0} end={ 5.0}><Scene1/></Sprite>
      <Sprite start={ 5.0} end={ 9.0}><Scene2/></Sprite>
      <Sprite start={ 9.0} end={15.0}><Scene3/></Sprite>
      <Sprite start={15.0} end={20.0}><Scene4/></Sprite>
      <Sprite start={20.0} end={24.0}><Scene5/></Sprite>
      <ProgressDots/>
    </Stage>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
