<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DC Operations Wiki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f1ed;
      --surface: #f7f7f4;
      --surface-2: #ebeae5;
      --surface-3: #e6e5e0;
      --ink: #26251e;
      --muted: rgba(38, 37, 30, 0.68);
      --faint: rgba(38, 37, 30, 0.45);
      --line: rgba(38, 37, 30, 0.2);
      --line-soft: rgba(38, 37, 30, 0.1);
      --link: #d94600;
      --link-hover: #cf2d56;
      --accent: #f54e00;
      --warning: #8a5a00;
      --danger: #cf2d56;
      --question: #6b4ba1;
      --good: #1f8a65;
      --sans: "Archivo", system-ui, "Segoe UI", Arial, sans-serif;
      --serif: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; overflow-y: scroll; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--serif); font-size: 15.5px; line-height: 1.58; -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; }
    a, .wiki-link { color: var(--link); text-decoration: none; cursor: pointer; }
    a:hover, .wiki-link:hover { color: var(--link-hover); text-decoration: underline; text-decoration-color: rgba(207, 45, 86, 0.4); }
    .app { display: grid; grid-template-columns: 292px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { position: sticky; top: 0; height: 100vh; overflow: auto; border-right: 1px solid var(--line-soft); background: var(--bg); padding: 0; }
    .sidebar-head { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 20px 16px 14px; border-bottom: 1px solid var(--line-soft); }
    .sidebar nav { display: block; padding: 12px 16px 32px; }
    .brand { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line-soft); margin-bottom: 16px; }
    .brand-icon { position: relative; width: 64px; height: 64px; border-radius: 14px; background: var(--surface-3); display: grid; place-items: center; flex: 0 0 auto; overflow: hidden; border: 1px solid var(--line-soft); }
    .brand-icon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .brand-title { font-family: var(--sans); font-size: 20px; font-weight: 600; letter-spacing: -0.4px; line-height: 1; }
    .brand-subtitle { color: var(--faint); font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; align-self: center; }
    .search-box { position: relative; margin-bottom: 0; }
    .search-box input { width: 100%; border: 1px solid var(--line-soft); background: var(--surface); color: var(--ink); font-family: var(--sans); font-size: 13.5px; padding: 8px 10px 8px 32px; border-radius: 8px; outline: none; transition: border-color 0.15s ease, background 0.15s ease; }
    .search-box input::placeholder { color: var(--faint); }
    .search-box input:hover { border-color: var(--line); }
    .search-box input:focus { background: #fff; border-color: var(--line); box-shadow: rgba(0,0,0,0.05) 0 4px 12px; }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
    .search-results { display: none; position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 6px); border: 1px solid var(--line-soft); background: var(--surface); max-height: 430px; overflow: auto; box-shadow: rgba(0,0,0,0.1) 0 14px 32px; border-radius: 8px; }
    .search-results.open { display: block; }
    .search-result { border: 0; border-bottom: 1px solid var(--line-soft); background: transparent; width: 100%; text-align: left; padding: 10px 12px; cursor: pointer; }
    .search-result:last-child { border-bottom: 0; }
    .search-result:hover { background: var(--surface-2); }
    .search-result strong { display: block; color: var(--ink); font-family: var(--sans); font-weight: 500; font-size: 13.5px; }
    .search-result span { display: block; color: var(--faint); font-family: var(--mono); font-size: 10.5px; margin-top: 3px; }
    .namespace { margin-bottom: 2px; }
    .namespace summary { cursor: pointer; list-style: none; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 32px; font-family: var(--sans); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); padding: 6px 6px; border-radius: 8px; transition: color 0.15s ease, background 0.15s ease; }
    .namespace summary::-webkit-details-marker { display: none; }
    .namespace summary::before { content: ""; width: 0; height: 0; border-left: 4px solid var(--faint); border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform 0.15s ease; transform-origin: 25% 50%; }
    .namespace[open] summary::before { transform: rotate(90deg); border-left-color: var(--accent); }
    .namespace summary:hover { color: var(--ink); background: var(--surface-2); }
    .namespace-title { min-width: 0; }
    .namespace-label { display: block; }
    .namespace-hint { display: none; }
    .count { color: var(--faint); font-family: var(--mono); font-weight: 400; font-size: 10.5px; font-variant-numeric: tabular-nums; background: var(--surface-2); padding: 1px 8px; border-radius: 999px; }
    .nav-list { list-style: none; margin: 2px 0 8px 14px; padding: 0 0 0 12px; position: relative; }
    .nav-list::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 1px; background: var(--line-soft); }
    .nav-list li + li { margin-top: 0; }
    .nav-item { position: relative; border: 0; background: transparent; color: var(--muted); width: 100%; text-align: left; padding: 5px 10px; cursor: pointer; font-family: var(--sans); font-size: 13.5px; line-height: 1.45; border-radius: 6px; transition: color 0.15s ease, background 0.15s ease; }
    .nav-item::before { content: ""; position: absolute; left: -12px; top: 5px; bottom: 5px; width: 2px; background: var(--accent); border-radius: 2px; opacity: 0; transform: translateX(-4px); transition: opacity 0.18s ease, transform 0.18s ease; }
    .nav-item:hover { background: var(--surface-2); color: var(--ink); }
    .nav-item.active { background: var(--surface-2); color: var(--ink); font-weight: 500; }
    .nav-item:hover::before, .nav-item.active::before { opacity: 1; transform: translateX(0); }
    .main { min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; min-height: 52px; border-bottom: 1px solid var(--line-soft); background: rgba(242, 241, 237, 0.92); backdrop-filter: blur(8px); padding: 8px 24px; }
    .crumbs { color: var(--faint); font-family: var(--sans); font-size: 13px; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .crumbs strong { color: var(--ink); font-weight: 500; }
    .page-tools { display: flex; gap: 4px; align-items: center; }
    .page-tools button { border: none; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-family: var(--sans); font-size: 13px; font-weight: 500; transition: color 0.15s ease, background 0.15s ease; }
    .page-tools button:hover { background: var(--surface-2); color: var(--link-hover); }
    .page-tools .meta-short { color: var(--faint); font-family: var(--mono); font-size: 10.5px; padding-left: 12px; border-left: 1px solid var(--line-soft); margin-left: 6px; width: 210px; flex: 0 0 auto; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .article-shell { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 32px; width: min(1360px, calc(100% - 56px)); margin: 0 auto; padding: 32px 0 96px; }
    .article { min-width: 0; }
    .article h1 { margin: 0 0 6px; padding: 18px 0 12px; border-bottom: 1px solid var(--line); font-family: var(--sans); font-size: clamp(30px, 3.2vw, 38px); line-height: 1.1; font-weight: 600; letter-spacing: -0.025em; position: sticky; top: 52px; z-index: 5; background: var(--bg); display: flex; align-items: baseline; gap: 14px; }
    .article h1 .h1-title { flex: 1; min-width: 0; }
    .article h1 .h1-media-link { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px solid var(--line-soft); background: var(--surface); border-radius: 999px; color: var(--muted); font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: 0; line-height: 1; text-decoration: none; cursor: pointer; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease; align-self: center; }
    .article h1 .h1-media-link:hover { color: var(--link-hover); border-color: var(--line); text-decoration: none; }
    .article h1 .h1-media-link svg { display: block; }
    .article h1 .h1-media-link .h1-media-count { font-family: var(--mono); font-size: 10.5px; opacity: 0.8; }
    .extras-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; }
    .extras-row--compact { margin: 0; gap: 4px; flex-wrap: nowrap; }
    .extras-row--compact .extra-link { padding: 4px 6px; }
    .extra-link { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 1px solid var(--line-soft); background: var(--surface); color: var(--muted); font-family: var(--sans); font-size: 12.5px; font-weight: 500; border-radius: 999px; text-decoration: none; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
    .extra-link:hover { color: var(--link-hover); border-color: var(--line); text-decoration: none; }
    .extra-icon { display: inline-flex; align-items: center; color: var(--accent); }
    .extra-icon svg { display: block; }
    .topbar-extras { display: flex; align-items: center; gap: 6px; padding-right: 8px; border-right: 1px solid var(--line-soft); margin-right: 4px; }
    .topbar-extras:empty { display: none; }
    .article h2 { margin: 40px 0 12px; padding-bottom: 0; border-bottom: none; font-family: var(--sans); font-weight: 600; font-size: 22px; line-height: 1.25; letter-spacing: -0.015em; }
    .article h3 { margin: 26px 0 8px; font-family: var(--sans); font-size: 16.5px; font-weight: 600; letter-spacing: -0.01em; }
    .article h4 { margin: 20px 0 6px; font-family: var(--sans); font-size: 14.5px; font-weight: 600; }
    .article p { margin: 0 0 15px; }
    .lede { color: var(--muted); font-size: 18.5px; font-style: italic; line-height: 1.5; margin: 0 0 20px; }
    .metadata-line { color: var(--faint); font-family: var(--mono); font-size: 11px; letter-spacing: 0.01em; margin-bottom: 20px; }
    .article ul, .article ol { margin: 0 0 16px 24px; padding: 0; }
    .article li + li { margin-top: 5px; }
    .article table { display: block; width: 100%; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 12px 0 24px; font-size: 14px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 8px; }
    .article th, .article td { border: none; border-bottom: 1px solid var(--line-soft); padding: 10px 14px; vertical-align: top; }
    .article tr:last-child td { border-bottom: none; }
    .article th { background: var(--surface-3); font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); text-align: left; }
    .home-grid, .namespace-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 22px; }
    .wiki-panel, .namespace-card { border: 1px solid var(--line-soft); background: var(--surface); border-radius: 8px; padding: 18px 20px; }
    .wiki-panel h2, .namespace-card h2 { margin-top: 0; }
    .wiki-panel h2 { margin: 0 0 14px; font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .namespace-card h2 { font-family: var(--sans); font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px; }
    .home-actions { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin: 22px 0 24px; }
    .home-action { border: 1px solid var(--line-soft); background: var(--surface-3); border-radius: 8px; padding: 13px 14px; min-height: 60px; display: flex; flex-direction: column; justify-content: center; color: var(--muted); cursor: pointer; text-decoration: none; transition: border-color 0.15s ease, box-shadow 0.2s ease; }
    .home-action:hover { border-color: var(--line); box-shadow: rgba(0,0,0,0.05) 0 8px 24px; color: var(--muted); text-decoration: none; }
    .home-action strong { color: var(--ink); font-family: var(--sans); font-size: 13.5px; font-weight: 500; line-height: 1.25; }
    .home-action span { color: var(--faint); font-family: var(--mono); font-size: 10.5px; margin-top: 4px; }
    .health-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin: 18px 0 22px; }
    .health-grid--compact { margin-top: 0; grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .health-item { border: 1px solid var(--line-soft); background: var(--surface); border-radius: 8px; padding: 12px 14px; min-width: 0; }
    .health-item.is-ok { border-left: 3px solid var(--good); }
    .health-item.is-watch { border-left: 3px solid var(--warning); }
    .health-item.is-info { border-left: 3px solid var(--accent); }
    .health-value { display: block; color: var(--ink); font-family: var(--sans); font-size: 22px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .health-label { display: block; color: var(--faint); font-family: var(--sans); font-size: 11.5px; line-height: 1.3; margin-top: 4px; }
    .entry-list { list-style: none; margin: 0; padding: 0; }
    .entry-list li { padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
    .entry-list li:last-child { border-bottom: 0; }
    .entry-list li + li { margin-top: 0; }
    .entry-link { display: inline-block; font-weight: 600; font-size: 15.5px; line-height: 1.3; color: var(--ink); }
    .entry-link:hover { color: var(--link-hover); text-decoration: none; }
    .entry-meta { display: block; color: var(--faint); font-family: var(--mono); font-size: 10.5px; margin-top: 3px; overflow-wrap: anywhere; }
    .namespace-card.issue-card { padding: 0; overflow: hidden; }
    .issue-card h2 { margin: 0; padding: 12px 16px; font-size: 15px; background: var(--surface-2); border-bottom: 1px solid var(--line-soft); }
    .issue-card ul { margin: 0; padding: 13px 16px 15px 32px; }
    .issue-card.is-clear h2 { color: var(--good); }
    .issue-card.is-watch h2 { color: var(--warning); }
    .issue-card.is-info h2 { color: var(--ink); }
    .issue-empty { color: var(--faint); list-style: none; margin-left: -16px; }
    .link-list { columns: 2; column-gap: 24px; list-style: none; padding: 0; margin: 0; }
    .link-list li { break-inside: avoid; margin: 0; padding: 7px 0; border-bottom: 1px solid var(--line-soft); font-family: var(--sans); font-size: 14px; font-weight: 500; }
    .link-list .wiki-link { color: var(--ink); }
    .link-list .wiki-link:hover { color: var(--link-hover); text-decoration: none; }
    .link-list .metadata-line { display: inline; float: right; margin: 0; }
    .right-rail { display: grid; gap: 14px; align-content: start; }
    .infobox { position: static; align-self: start; border: 1px solid var(--line-soft); background: var(--surface); border-radius: 8px; font-size: 13px; overflow: hidden; }
    .infobox-title { background: var(--surface-3); border-bottom: 1px solid var(--line-soft); padding: 12px 14px; font-family: var(--sans); font-weight: 600; text-align: left; font-size: 15px; letter-spacing: -0.01em; line-height: 1.3; box-sizing: border-box; }
    .infobox-row { display: grid; grid-template-columns: 96px minmax(0, 1fr); border-bottom: 1px solid var(--line-soft); }
    .infobox-row:last-child { border-bottom: 0; }
    .infobox-key { padding: 8px 0 8px 14px; color: var(--faint); font-family: var(--sans); font-size: 11.5px; font-weight: 500; }
    .infobox-value { padding: 8px 14px 8px 0; color: var(--ink); font-family: var(--sans); font-size: 12.5px; overflow-wrap: anywhere; }
    .rail-box { border: 1px solid var(--line-soft); background: var(--surface); border-radius: 8px; font-size: 13px; overflow: hidden; }
    .rail-box h3 { margin: 0; padding: 10px 14px 9px; background: transparent; border-bottom: 1px solid var(--line); font-family: var(--sans); font-size: 11px; font-weight: 600; text-align: left; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .toc-list, .backlink-list, .tag-list { list-style: none; margin: 0; padding: 10px 14px 12px; }
    .toc-list li + li, .backlink-list li + li { margin-top: 6px; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .toc-list li, .backlink-list li { position: relative; font-family: var(--sans); font-size: 13px; }
    .toc-list li::before, .backlink-list li::before { content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 2px; background: var(--accent); border-radius: 2px; opacity: 0; transform: translateX(-2px); transition: opacity 0.18s ease, transform 0.18s ease; pointer-events: none; }
    .toc-list li:hover::before, .backlink-list li:hover::before { opacity: 1; transform: translateX(0); }
    .toc-list a, .backlink-list .wiki-link { display: inline-block; color: var(--muted); font-weight: 500; transition: transform 0.18s ease, color 0.15s ease; }
    .toc-list li:hover a, .backlink-list li:hover .wiki-link { transform: translateX(8px); color: var(--link); text-decoration: none; }
    .toc-list a:hover, .backlink-list .wiki-link:hover { text-decoration: none; }
    .figure { margin: 20px 0; border: 1px solid var(--line-soft); background: var(--surface); border-radius: 8px; scroll-margin-top: 130px; overflow: hidden; }
    .figure-body { background: var(--surface-2); min-height: 220px; display: flex; align-items: center; justify-content: center; padding: 14px; }
    .figure img { display: block; max-width: 100%; max-height: 620px; width: auto; height: auto; cursor: zoom-in; box-shadow: rgba(0,0,0,0.08) 0 1px 3px; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; }
    @supports (image-rendering: high-quality) { .figure img { image-rendering: high-quality; } }
    .figure figcaption { padding: 9px 14px; font-family: var(--sans); font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line-soft); background: var(--surface); line-height: 1.45; }
    .figure .zoom-hint { position: absolute; opacity: 0; }
    .lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(28, 27, 24, 0.9); display: none; align-items: center; justify-content: center; padding: 32px; cursor: zoom-out; }
    .lightbox.open { display: flex; }
    .lightbox-inner { max-width: 100%; max-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; cursor: default; }
    .lightbox img { max-width: 100%; max-height: calc(100vh - 120px); width: auto; height: auto; object-fit: contain; background: #fff; box-shadow: rgba(0, 0, 0, 0.45) 0 20px 60px; border-radius: 4px; }
    .lightbox-caption { color: #f2f1ed; font-family: var(--sans); font-size: 13.5px; max-width: min(900px, 90vw); text-align: center; line-height: 1.5; }
    .lightbox-close { position: absolute; top: 18px; right: 18px; width: 36px; height: 36px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); color: #fff; cursor: pointer; font-size: 20px; line-height: 1; display: flex; align-items: center; justify-content: center; }
    .lightbox-close:hover { background: rgba(255,255,255,0.18); }
    .media-list { list-style: none; margin: 0; padding: 0; }
    .media-list li { display: flex; }
    .media-list a { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line-soft); flex: 1; min-width: 0; color: var(--ink); transition: background 0.12s ease; text-decoration: none; }
    .media-list li:last-child a { border-bottom: 0; }
    .media-list a:hover { background: var(--surface-2); text-decoration: none; }
    .media-icon { width: 14px; height: 14px; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; }
    .media-icon svg { display: block; }
    .media-icon.t-screenshot { color: var(--muted); }
    .media-icon.t-diagram { color: var(--accent); }
    .media-icon.t-animation { color: var(--warning); }
    .media-icon.t-external { color: var(--question); }
    .media-label { font-family: var(--sans); font-size: 12.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .media-tag { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); flex: 0 0 auto; }
    .tag { display: inline-flex; align-items: center; border: none; background: var(--surface-3); color: var(--muted); font-family: var(--sans); font-size: 11.5px; font-weight: 500; padding: 4px 12px; border-radius: 999px; transition: color 0.15s ease; cursor: default; }
    .tag:hover { color: var(--link-hover); }
    .callout { border: 1px solid var(--line-soft); border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; margin: 18px 0; padding: 13px 16px; }
    .callout.warning { border-left-color: var(--warning); }
    .callout.question { border-left-color: var(--question); }
    .callout.contradiction { border-left-color: var(--danger); }

  <script id="wikiPayload" type="application/json">{"generatedAt":"2026-07-09T04:42:44.778Z","pages":[{"id":"glossary/aaa","slug":"aaa","rel":"glossary/aaa.md","namespace":"glossary","title":"AAA","summary":"**Full Name:** Adoption Agreement Addendum","updated":"2026-04-16","created":"2026-04-16","sources":1,"status":"current","tags":["glossary","document","pep","adoption"],"type":"glossary","extras":[],"media":[],"meta":{"title":"AAA","type":"glossary","tags":["glossary","document","pep","adoption"],"created":"2026-04-16","updated":"2026-04-16","sources":1,"status":"current"},"markdown":"# AAA\n\n**Full Name:** Adoption Agreement Addendum\n\n## Definition\n\nThe AAA is a plan document addendum used in the PEP (Pooled Employer Plan) structure. It appears in the COM's TRS Plan Documents section for PEP plans — likely an addendum to the adoption agreement executed when an employer joins a PEP.\n\n## Used By\n\n- [[roles/com]] — COM handles AAA document routing in the PEP plan documents workflow\n- PEP plans only\n\n## See Also\n\n- [[onboarding-package]]\n- [[roles/com]]\n- [[glossary/pea]]"},{"id":"vendors/adp","slug":"adp","rel":"vendors/adp.md","namespace":"vendors","title":"ADP","summary":"Large payroll vendor where terminology and platform routing matter — keep ADP pointed at large-market/MR Report work, not Mid-Market, Paystart, or Blackbox.","updated":"2026-07-08","created":"2026-07-08","sources":1,"status":"active","tags":["vendor","payroll"],"type":"vendor","extras":[],"media":[],"meta":{"title":"ADP","type":"vendor","tags":["vendor","payroll"],"created":"2026-07-08","updated":"2026-07-08","sources":1,"status":"active"},"markdown":"# ADP\n\nLarge payroll vendor where terminology and platform routing matter — keep ADP pointed at large-market/MR Report work, not Mid-Market, Paystart, or Blackbox.\n\n## File format & naming\n\n- Outbound is CSV only. Most plans use custom ADP Generic, especially with percent and dollar elections or separate catch-up elections.\n- If ADP is using Next Gen, confirm filenames before SFTP setup.\n- Typical outbound filename: `Plan number_affiliate_ADP_MMDDYYYY.csv` (e.g. `QK63293_00001_ADP_MMDDYYYY.csv`).\n- Standard ADP reports usually lack email addresses and multiple phone numbers, so the client may need a monthly supplemental report.\n\n## Deduction & loan codes\n\n- Get deduction codes for deferral sources, catch-up if applicable, loans, and any company/parent/paygroup code ADP wants on the file.\n- ADP recycles loan numbers, so loans usually need custom handling even when ADP accepts the standard format.\n- If more than one loan is allowed, get an ADP report close to go-live with SSN, loan code, and repayment amount so loans can be seeded and loan deduct_c logic enabled.\n\n## Stop rows & quirks\n\n- ADP Generic stop rows use a tilde before or after the deduction, leave the amount/percentage blank, and do not send zeroes.\n- Next Gen differs: no company code, no tilde on stop rows, and zeroes may be needed for deferral stops or loan payoffs.\n- ADP RUN integrations are no longer being completed.\n- Transamerica no longer has ADP fileshare access due to firewall — the client may need to retrieve and forward specifications.\n\n## FTP & PGP\n\n- Inbound uses the global SFTP connection named ADP; ADP pushes files to Transamerica.\n- Outbound: Transamerica pushes to ADP through a separate SFTP connection; ADP must provide credentials.\n- Submit separate requests for incoming, outgoing, and SFTP — ADP generally needs three tickets on their side.\n- No PGP.\n\n## See Also\n\n- [[payroll-vendor-onboarding]]\n- [[ftp-connection]]\n- [[payroll-template]]"},{"id":"conversion-ops/advanced-employer","slug":"advanced-employer","rel":"conversion-ops/advanced-employer.md","namespace":"conversion-ops","title":"Advanced Employer Account","summary":"A temporary holding account in P3 used during cash conversions to park the incoming wire until participant-level balance posting can occur.","updated":"2026-07-08","created":"2026-04-14","sources":3,"status":"current","tags":["advanced-employer","cash-conversion","liquidation","balances","p3"],"type":"conversion-ops","extras":[],"media":[],"meta":{"title":"Advanced Employer Account","type":"conversion-ops","tags":["advanced-employer","cash-conversion","liquidation","balances","p3"],"created":"2026-04-14","updated":"2026-07-08","sources":3,"status":"current"},"markdown":"# Advanced Employer Account\n\nA temporary holding account in P3 used during cash conversions to park the incoming wire until participant-level balance posting can occur.\n\n## Definition\n\nOn liquidation day for a cash conversion, the prior record keeper wires all plan assets as pooled cash. That money cannot be allocated to participant accounts immediately — final files haven't arrived yet. The Advanced Employer (AE) account holds the lump sum in P3 as a temporary placeholder until the DC can run the participant balance workflow.\n\n## Why It Exists\n\nIn a cash conversion, assets arrive as undifferentiated cash with no per-fund or per-participant breakdown. The AE account is the system's way of acknowledging that the money has arrived and is parked safely while the DC waits for the authoritative final data.\n\n## Lifecycle\n\n1. **Liquidation Day:** Wire received → DC verifies total matches vendor breakdown → DC moves money to AE account in [[p3]] (via [[p2]] ref number)\n2. **Notification:** DC emails QA, COM, and PC confirming wire received and posted to Advanced Employer. Standard wording: *\"Wire has been booked and transferred to the Advanced Employer account, where it will be liquidated when final records are available.\"*\n3. **Waiting period:** DC waits for final files from the prior record keeper. AE accrues a small interest while sitting.\n4. **Final Files Arrive:** DC emails a manager-level approver requesting AE liquidation (see below)\n5. **After liquidation:** DC creates the **AE liquidation ref number** and attaches it to the CIT balance workflow parameter file → runs CIT balance workflow in [[informatica]] → posts participant balances → P3 processes with Immediate + Batch mode (trades go out)\n6. **Reverse [[dummy-participant]]** via ROC tool in P3\n7. **Next business day:** DC distributes the accrued AE interest pro-rata to participants — see [[subsequent-cash-imports]]\n\n## Requesting AE Liquidation\n\nAE liquidation requires manager-level sign-off. Two approval paths — either can handle the request:\n\n- **The DC's direct manager** (currently Nick Lister)\n- **The Large Market cross-department approver** (currently Stacey Fortune) — a manager-level contact who floats between departments and can act on approvals quickly\n\nSend a simple email to one or both:\n> \"Please liquidate the Advanced Employer account for [Plan Name] so I can proceed with balance posting.\"\n\nNo complex process — just the email. Once approved and liquidated, final balance posting can proceed.\n\n## Cash Conversion Only\n\nThe Advanced Employer account is used **only in cash conversions**. Mapping conversions use a dummy participant account instead. TIK conversions do not require either mechanism.\n\n## P2 Involvement\n\nSetting up the AE account transfer reference number is done in [[p2]] — the same back-end ref number creation process used for fund-level ref numbers in mapping conversions, applied to the AE account here.\n\n## See Also\n\n- [[conversion-types]]\n- [[liquidation-day]]\n- [[final-files-processing]]\n- [[p2]]\n- [[p3]]\n- [[informatica]]\n- [[dummy-participant]]\n- [[subsequent-cash-imports]]"},{"id":"reference/alteryx","slug":"alteryx","rel":"reference/alteryx.md","namespace":"reference","title":"Alteryx","summary":"Data blending and workflow tool associated with the Large Market data toolchain.","updated":"2026-06-25","created":"2026-06-25","sources":1,"status":"needs-review","tags":["system","data","workflow","large-market"],"type":"reference","extras":[],"media":[],"meta":{"title":"Alteryx","type":"reference","tags":["system","data","workflow","large-market"],"created":"2026-06-25","updated":"2026-06-25","status":"needs-review","sources":1},"markdown":"# Alteryx\n\nData blending and workflow tool associated with the Large Market data toolchain.\n\n## Overview\n\nAlteryx is referenced in the TA Wiki as part of the Large Market data systems stack, alongside [[informatica]]. The current source material points to Dave Shloat as the practical expert for Alteryx questions, especially when a data process needs to be understood, adjusted, or troubleshot.\n\nThis page is intentionally light until a direct Alteryx procedure source is ingested.\n\n## Known Use\n\n- Data blending and transformation work\n- Workflow support for Large Market data processes\n- Troubleshooting data-flow questions with Dave Shloat\n\n## Open Questions\n\n- Which specific production workflows are owned in Alteryx\n- How Alteryx output feeds, overlaps with, or supports [[informatica]]\n- Where approved Alteryx workflow documentation lives\n\n## See Also\n\n- Dave Shloat\n- [[informatica]]\n- [[roles/lm-dc]]\n- [[concepts/dc-onboarding-workflow]]"},{"id":"reference/aqt","slug":"aqt","rel":"reference/aqt.md","namespace":"reference","title":"AQT","summary":"Standalone SQL query application used by DCs throughout the conversion lifecycle. Read-only — cannot modify data.","updated":"2026-05-03","created":"2026-04-14","sources":2,"status":"current","tags":["system","aqt","sql","query"],"type":"reference","extras":[],"media":[{"id":"fig-1","caption":"AQT main window — query editor on top, results grid below.","src":"SS/AQT - Main.jpg","type":"screenshot"},{"id":"fig-2","caption":"AQT toolbar — run, stop, export, and connection controls.","src":"SS/AQT - Toolbar.jpg","type":"screenshot"}],"meta":{"title":"AQT","type":"reference","tags":["system","aqt","sql","query"],"created":"2026-04-14","updated":"2026-05-03","sources":2,"status":"current"},"markdown":"# AQT\n\nStandalone SQL query application used by DCs throughout the conversion lifecycle. Read-only — cannot modify data.\n\n## Overview\n\nAQT is an internal database query tool. DCs use it for SQL queries against TransAmerica's databases — every interaction is a query. It is a standalone desktop application, not integrated into P3 or EDS.\n\n![AQT main window — query editor on top, results grid below.](SS/AQT - Main.jpg)\n\n## Key Facts\n\n- **Type:** Standalone desktop application\n- **Access:** Not within P3 — separate app\n- **Permissions:** Read-only (view-only). DCs cannot make table changes through AQT.\n- **Full name:** Unknown — acronym not yet expanded\n\n## How DCs Use It\n\nAQT is the DC's SQL query surface. Common queries include:\n\n- **Source mapping** — pulling TransAmerica source IDs for each prior vendor source type during [[source-mapping]]. The specific query is complex and will be documented separately as part of the DC query library.\n- **Isolating queries for [[prod-support]] AWD tickets** — building a query that returns exactly the records that need to be modified (not the full table) and pasting it into the ticket comments.\n- **Lookups during conversion work** — confirming record state, verifying loaded data, checking source IDs and balances.\n\n> Get the actual query that holds exactly the data you need. Don't pull the entire table.\n\n![AQT toolbar — run, stop, export, and connection controls.](SS/AQT - Toolbar.jpg)\n\nThe full query library will be documented separately.\n\n## Limitations\n\nAQT is read-only. The only place DCs can make direct table modifications is the ROC tool within [[p3]]. For any write operation, a [[prod-support]] AWD ticket is required.\n\n## Open Questions\n\n- Full name / acronym expansion for \"AQT\"\n- Complete query library for all DC use cases (to be documented separately once finalized)\n\n## See Also\n\n- [[source-mapping]]\n- [[prod-support]]\n- [[p3]]\n- [[dc-onboarding-workflow]]"},{"id":"conversion-ops/audit-pack","slug":"audit-pack","rel":"conversion-ops/audit-pack.md","namespace":"conversion-ops","title":"Audit Pack","summary":"A structured summary document the DC builds after every plan conversion. Reviewed by QA and stored in client folders for the audit team.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["audit","documentation","qa","post-conversion"],"type":"conversion-ops","extras":[],"media":[],"meta":{"title":"Audit Pack","type":"conversion-ops","tags":["audit","documentation","qa","post-conversion"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# Audit Pack\r\n\r\nA structured summary document the DC builds after every plan conversion. Reviewed by QA and stored in client folders for the audit team.\r\n\r\n## Overview\r\n\r\nThe audit pack is the official record of what happened during the conversion — every ref number, every dollar amount, every piece of vendor data that informed what's now in the system. The audit team uses it to compare prior vendor data against what's actually in TransAmerica's system.\r\n\r\n## Contents\r\n\r\n### Financial / Transaction Summary\r\n- All transfer reference numbers used\r\n- Dollar amounts for each ref number\r\n- Dates money was received\r\n- Balances posted (breakdown):\r\n  - Advanced Employer amounts (cash conversion)\r\n  - Mapping fund amounts\r\n  - TIK share amounts\r\n\r\n### Prior Vendor Data\r\n- **Prior vendor balances** — what the vendor reported participants had\r\n- **Prior vendor elections** — deferral/contribution elections from the vendor\r\n- **Loan information** — any outstanding loan balances from the vendor\r\n- **Fund mapping** — the prior-to-TA fund mapping used\r\n\r\n## Purpose\r\n\r\nThe audit pack lets the audit team answer: *\"What did the prior vendor say, and does it match what's now in our system?\"*\r\n\r\n- DC builds it\r\n- QA reviews it\r\n- Stored in **client folders**\r\n- Used by the audit team post-conversion\r\n\r\n## Template\r\n\r\n**Standard template — always the same.** The DC does not build the audit pack from scratch. There is a fixed template used for every plan.\r\n\r\n- **Format:** Excel\r\n- **Location:** `root/Conversion/Contract` in the DC folder\r\n- **Same template for all conversion types** — no variation between cash, mapping, and TIK\r\n\r\n## When It's Built\r\n\r\nAfter all final files are processed and posting is complete. It is a retrospective document — built at the end of the conversion, not during.\r\n\r\n## Storage\r\n\r\nStored in the **client folder** on the internal file system — specifically `root/Conversion/Contract`.\r\n\r\n## QA Review\r\n\r\n- QA typically reviews the audit pack the **same day** it's submitted\r\n- If QA finds a discrepancy, they **email the DC directly** to request a fix or explanation\r\n- DC corrects and resubmits\r\n\r\n## See Also\r\n\r\n- [[final-files-processing]]\r\n- [[conversion-types]]\r\n- [[dc-onboarding-workflow]]"},{"id":"glossary/awd","slug":"awd","rel":"glossary/awd.md","namespace":"glossary","title":"AWD","summary":"**Full Name:** Automatic Work Distribution","updated":"2026-05-03","created":"2026-04-15","sources":2,"status":"current","tags":["system","workflow","tickets","testing","conversion"],"type":"glossary","extras":[],"media":[{"id":"fig-1","caption":"AWD main page — ticket list with type, priority, and assignment columns.","src":"SS/AWD - Main Page.jpg","type":"screenshot"},{"id":"fig-2","caption":"AWD landing screen after login — work queues and ticket counts.","src":"SS/AWD - After Login.jpg","type":"screenshot"},{"id":"fig-3","caption":"Completed AWD ticket with comments — what a fully-worked ticket looks like before close.","src":"SS/AWD_Complete with Comments.jpg","type":"screenshot"}],"meta":{"title":"AWD","type":"glossary","tags":["system","workflow","tickets","testing","conversion"],"created":"2026-04-15","updated":"2026-05-03","sources":2,"status":"current"},"markdown":"# AWD\n\n**Full Name:** Automatic Work Distribution\n\n## Definition\n\nAWD is Transamerica's internal work-ticketing and routing system. Teams submit AWD tickets to request actions from other departments — data corrections, payroll handoffs, rebooking requests — and tickets route automatically based on type and target department. AWD is also where new plan packages go for **testing** as part of conversion setup, before the base file and payroll templates can be finalized.\n\n![AWD main page — ticket list with type, priority, and assignment columns.](SS/AWD - Main Page.jpg)\n\n## Two Roles in a Conversion\n\n### 1. Pre-Base-File Testing\n\nBefore the [[base-file]] and [[payroll-template]] can be tailored to a plan, the [[prd]] or [[onboarding-package]] is sent to AWD for testing. Typical turnaround is **a couple of days**. AWD returns:\n\n- **Term reason codes** (when applicable to the plan design)\n- Verification of testing and eligibility setup\n- Resolution of open items the PRD/onboarding package didn't fully answer\n\nOnce the AWD results land, the DC tailors the standard base + payroll templates to this plan's specifics and schedules the client walkthrough meeting.\n\n### 2. Ongoing Ticket Routing\n\nThroughout the conversion, internal teams submit AWD tickets to request specific actions:\n\n| Submitter | Common Ticket Types | Target |\n|-----------|---------------------|--------|\n| [[roles/lm-dc]] | Data corrections | [[prod-support]] |\n| [[roles/lm-dc]] | Payroll handoffs (FILESPECRQ) | Payroll Support |\n| [[roles/lm-dc]] | Rebook requests for AEDA disbursements | [[booking-assets]] flow |\n| [[roles/com]] | Various lifecycle tickets | Multiple departments |\n| [[tc]] | Settings flips (e.g., contribution monitoring) | Receiving teams |\n\nMost internal teams touch AWD at some point in a conversion. It is the connective tissue for cross-team work requests.\n\n![AWD landing screen after login — work queues and ticket counts.](SS/AWD - After Login.jpg)\n\n## Procedure\n\n> *(Full step-by-step procedure for submitting and tracking AWD tickets to be documented in a follow-up pass — placeholder section.)*\n\n![Completed AWD ticket with comments — what a fully-worked ticket looks like before close.](SS/AWD_Complete with Comments.jpg)\n\n## Used By\n\n- [[roles/lm-dc]] — submits tickets to [[prod-support]] for data corrections, to initiate payroll handoffs (FILESPECRQ type), and for rebook actions\n- [[roles/com]] — submits and receives tickets throughout the conversion lifecycle\n- [[tc]] — receives and flips AWD settings (e.g., contribution monitoring)\n- Most internal teams touch AWD at some point in a conversion\n\n## See Also\n\n- [[payroll-handoff-at-go-live]] — uses FILESPECRQ ticket type\n- [[processes/reversal-submission|reversal-process]] — AWD ticket submitted after Reversal Form response\n- [[booking-assets]] — rebook AWD ticket for AEDA disbursements\n- [[prod-support]]\n- [[prd]]\n- [[onboarding-package]]\n- [[base-file]]\n- [[census-data]]"},{"id":"data-loading/balance-import","slug":"balance-import","rel":"data-loading/balance-import.md","namespace":"data-loading","title":"Balance Import","summary":"The process of loading prior-record-keeper balances into P3 after a conversion wire or share transfer. Three distinct methods exist depending on whether the prior RK sends cash, a fund-mapped wire, or transfers shares in-kind.","updated":"2026-07-08","created":"2026-04-19","sources":1,"status":"current","tags":["concept","balance","conversion","informatica","p3"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Balance Import","type":"data-loading","tags":["concept","balance","conversion","informatica","p3"],"created":"2026-04-19","updated":"2026-07-08","sources":1,"status":"current"},"markdown":"# Balance Import\n\nThe process of loading prior-record-keeper balances into P3 after a conversion wire or share transfer. Three distinct methods exist depending on whether the prior RK sends cash, a fund-mapped wire, or transfers shares in-kind.\n\n## Methods\n\n| Method | Trigger | CONV Re-Reg | Informatica Workflow | P3 Process Setting |\n|---|---|---|---|---|\n| **Cash Conversion** | Wire received | No CONV file | CITS Balances | Batch · Process Immediate |\n| **Mapping** | Wire received | Re-Reg = N | Day of Wire | Batch · Process Immediate |\n| **Transfer In-Kind (TIK)** | Shares arrive | Re-Reg = Y | Day of Wire | Online · Do NOT Process Immediate |\n\n## Six Phases\n\n1. **Day of Wire — Pre-Receipt** (Cash & Mapping only) — Email vendor, follow up, confirm wire booked; fork by method\n2. **Setup & File Prep** — Source mapping confirmed; Cash needs blank .txt fund mapping file; Mapping/TIK need fully populated fund mapping file; parameter file created in P2\n3. **CONV File Setup** (Mapping & TIK only) — Cash skips this; create CONV ref # per fund, enter totals; set Re-Reg = N (Mapping) or Re-Reg = Y (TIK); confirm dummy participant exists before import\n4. **Informatica Load** — Run CITS Balances (Cash) or Day of Wire (Mapping/TIK); run validation queries\n5. **Process on P3** — Settings differ by method (see table above); TIK uses backdated ref numbers and never uses Process Immediate\n6. **Apply & Final Validation** — Apply balances to participant accounts; run all associated queries for backup\n\n## Critical Differences\n\n- **Re-Reg field** in the CONV file: N = Mapping, Y = TIK — never confuse them; they change the transaction type\n- **Process Immediate**: Cash and Mapping use it; TIK never does (shares are backdated)\n- **Dummy participant**: Must exist before any import in Mapping or TIK path\n- **Cash Conversion**: Requires ALL participants to have investment elections; uses blank (not populated) fund mapping .txt file\n- **Day of Wire workflow**: Production only — no test mode; CITS Balances has test mode\n\n## Timing\n\n- Cash: Same day as wire confirmation\n- Mapping: Same day as wire confirmation\n- TIK: After shares arrive AND in-kind spreadsheet confirmed by Matt O'Connell's team\n\n## Shared Prep Discipline\n\nTiming rules that apply to every import type (from the balance import guide):\n\n- **Wire instructions to the prior RK go out first-thing**, then are re-sent ~1 week before liquidation as a confirmation reset.\n- **Request test files ASAP** — source mapping is built from whatever sources have balances on the test files.\n- **Send mappings to QA / TC / TM immediately on completion. Never batch.** If a new source appears on final files, add it and resend the moment it appears.\n- **−3 business days before the wire:** advance heads-up to the vendor and Cashiering.\n- **Order of processing after balances post:** balances → elections + loans (both required before payroll restart) → everything else. Loans gate the resumption of payroll processing, so they sit at the front of the post-balance queue.\n\n## Wire Receipt & Cut-Offs\n\nFrom the balance import guide:\n\n- Email Cashiering on day-of-wire ASAP with plan number + wire amount: `shtaopscashieringinc@transamerica.com`\n- Wire pulls: 7am, 9am, 1pm, 3pm CST\n- Cashiering replies when booked; they notify by 3:45pm if received that day\n- Wires received after 3pm CST are deposited the next business day\n- Cross-check by looking at P2 / P3 to see if money's been booked to the plan\n\n## Booking Assets\n\n> [!warning] Process changed August 2025\n> AEDA-withdrawal booking is no longer 4=Remit. It is now **3=Rebook + an AWD ticket**. The old Pension Acct Form / cancel-tr-ref-no / accounting-email workflow is retired.\n\n- **Wire hits State Street** and you're not using the tr-ref-no cashiering booked: book as **4=Remit** (whether mapping or booking to a holding account) and email NY Recon so they can spot variances and piece components together.\n- **Withdrawing from AEDA** to process to participant accounts: book as **3=Rebook**, submit a rebook AWD ticket, and before clicking UPDATE change the ticket status to COMPLETED — the ticket is audit trail only, no routing needed.\n\n## Post-Conversion Audit\n\nThe closing DC step once the conversion is complete (from the balance import guide):\n\n1. Open the parameter file for the workflow and set `CONTRACT_NO` = the case number with no affiliate.\n2. Run `WF_POST_CONVERSION_AUDITS`.\n3. Output lands at `POST_CONVERSION_AUDIT_REPORT.TXT` — a single pipe-delimited file with a header record per check. Review the full file before closing out.\n4. **Merger plans:** to audit only the population you're responsible for, drop that population into Excel and save as `MERG_POP.TXT` in your conversion folder. The workflow detects it automatically — no parameter file changes needed.\n\n## LTPT — Historical Hours to Request\n\nSecure Act 2.0 Long Term Part Time eligibility (from the balance import guide): if the plan tracks hours-based vesting and Transamerica outsources vesting, request **historical hours by pay period** for participants who haven't yet met regular eligibility.\n\n| Plan Type | Years Required | Rule (current) |\n|---|---|---|\n| 401(k) | 2021, 2022, 2023 | 500+ hours in 2 consecutive years (was 3 — reduced 1/1/2025), age 21+ |\n| 403(b) | 2022, 2023 | 500+ hours in 2 consecutive years, age 21+ |\n\nStatus codes for loading: **5** = not eligible, kit mailed due to LTPT eligibility; **6** = eligible, LTPT. Excluded classes (collective bargaining, non-resident aliens) are exempt — but track hours anyway in case they move to a covered class. LTPT participants can make elective deferrals once qualified but are not entitled to employer contributions unless they hit the plan's regular eligibility.\n\n## See Also\n- [[balance-import-cash]]\n- [[balance-import-mapping]]\n- [[balance-import-tik]]\n- [[informatica-balance-module]]\n- [[conv-file]]\n- [[dummy-participant]]\n- Matt O'Connell\n- [[processes/tik-transfer|transfer-in-kind]]"},{"id":"data-loading/balance-import-cash","slug":"balance-import-cash","rel":"data-loading/balance-import-cash.md","namespace":"data-loading","title":"Balance Import — Cash Conversion","summary":"The simplest balance import method. Used when the prior record keeper sends a single cash wire rather than a fund-mapped wire or in-kind share transfer.","updated":"2026-07-08","created":"2026-04-19","sources":2,"status":"current","tags":["concept","balance","cash","conversion","informatica","cits"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Balance Import — Cash Conversion","type":"data-loading","tags":["concept","balance","cash","conversion","informatica","cits"],"created":"2026-04-19","updated":"2026-07-08","sources":2,"status":"current"},"markdown":"# Balance Import — Cash Conversion\r\n\r\nThe simplest balance import method. Used when the prior record keeper sends a single cash wire rather than a fund-mapped wire or in-kind share transfer.\r\n\r\n## Key Characteristics\r\n\r\n- **Wire triggers the import** — process starts when cashiering confirms wire received and booked\r\n- **Blank fund mapping file** — unlike Mapping and TIK, the .txt fund mapping file must be blank (not populated); the workflow needs it present but empty\r\n- **CITS Balances workflow** — runs in Informatica; the only balance import workflow with a test mode (test modes: P = preliminary SSNs not on system yet, Y = test SSNs on system, N = live)\r\n- **Process Immediate** — unlike TIK, cash conversion uses Process Immediate in P3\r\n- **No CONV file** — cash conversion skips Phase III entirely\r\n\r\n## Step-by-Step\r\n\r\n**Day Before Wire:**\r\nStep 01 — Email vendor that wire is coming; request breakdown\r\n\r\n**Morning of Wire Day:**\r\nStep 02 — Follow up if no confirmation; optionally notify cashiering via their spreadsheet\r\n\r\n**Wire Confirmed:**\r\nStep 03 — Cashiering confirms wire received and booked → send to advance employer (Cash path)\r\n\r\n**File Prep:**\r\nStep 04 — Confirm source mapping complete\r\nStep 05 — Create blank fund mapping .txt file (empty is intentional)\r\nStep 07 — Set Cash Conversion = Yes in parameter file; confirm ALL participants have investment elections\r\n\r\n**Informatica:**\r\nStep 11 — Run CITS Balances workflow (test run available first)\r\nStep 13 — Run all balance import queries to confirm clean load\r\n\r\n**P3:**\r\nStep 14 — Send to advance employer → process (No Hold · Batch · Process Immediate)\r\nStep 17 — Apply balances to participant accounts\r\nStep 18 — Run all associated queries for backup\r\n\r\n## Critical Requirement\r\n\r\nAll participants must have investment elections before running Cash Conversion. The workflow cannot distribute cash to participants without elections on file.\r\n\r\nIf newly-added participants show up on the final files, check their election status. If they don't have elections, default them via [[defaulting-elections-eds]] before running the workflow.\r\n\r\n## AE Liquidation Ref Number\r\n\r\nAfter cashiering confirms the wire and AE liquidation completes, the DC must:\r\n\r\n1. **Create a ref number** for the AE liquidation amount (in [[p2]])\r\n2. **Attach that ref number to the parameter file** alongside `Cash Conversion = Y`\r\n\r\nThe CITS Balances workflow uses this ref number to tie the cash distribution back to the wire that funded it. Without it, the workflow has no anchor for the disbursement.\r\n\r\nThis is the cash-conversion equivalent of how mapping uses per-fund ref numbers in the [[fund-mapping|fund mapping file]] — same idea, different file location.\r\n\r\n## Trailing Cash — AE Accrued Interest and Friends\r\n\r\nThe Advanced Employer account earns a small accrued interest between the wire arriving and the AE liquidation. **The day after the participant distribution, distribute that interest pro-rata across participants.** This is DC-triggered — it does not run automatically, and it's easy to forget because the participant distribution looks done. (from the balance import guide)\r\n\r\nThe same DC-triggered pro-rata pattern applies to anything that lands after the main distribution:\r\n\r\n- Trailing dividends paid by the prior RK after conversion\r\n- Uncashed checks / recovered cash from the prior RK\r\n- Any other late cash\r\n\r\nNone of these require [[fund-management-calendar|FMC]] entries — they're pure cash movement. The AE **purchase** on wire day and the AE **liquidation** post-wire do require FMC entries.\r\n\r\n## Limited Access File\r\n\r\nLimited access files are mostly used on cash conversions — they let participants update allocations during an open window before blackout. Confirm with the COM whether one applies. (from the balance import guide)\r\n\r\n## See Also\r\n- [[balance-import]]\r\n- [[informatica-balance-module]]\r\n- Informatica Training Manual\r\n- [[dummy-participant]]\r\n- [[conv-file]]"},{"id":"data-loading/balance-import-mapping","slug":"balance-import-mapping","rel":"data-loading/balance-import-mapping.md","namespace":"data-loading","title":"Balance Import — Mapping","summary":"Balance import method where prior-record-keeper funds map directly to corresponding TA funds. The wire is received and balances are applied the same day using a fully populated fund mapping file and the Day of Wire Informatica workflow.","updated":"2026-07-08","created":"2026-04-19","sources":2,"status":"current","tags":["concept","balance","mapping","conversion","informatica","day-of-wire"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Balance Import — Mapping","type":"data-loading","tags":["concept","balance","mapping","conversion","informatica","day-of-wire"],"created":"2026-04-19","updated":"2026-07-08","sources":2,"status":"current"},"markdown":"# Balance Import — Mapping\n\nBalance import method where prior-record-keeper funds map directly to corresponding TA funds. The wire is received and balances are applied the same day using a fully populated fund mapping file and the Day of Wire Informatica workflow.\n\n## Key Characteristics\n\n- **Wire triggers the import** — process starts same day as wire confirmation\n- **Fully populated fund mapping file** — unlike Cash, Mapping requires a complete fund-to-fund mapping file built from the TOA; VBA macro available to auto-generate it\n- **Re-Reg field = N** — critical CONV file setting; distinguishes Mapping from TIK\n- **Day of Wire workflow** — production only, no test mode; runs immediately when wire confirmed\n- **Process Immediate** — same as Cash; applied as a batch with Process Immediate on P3\n- **Dummy participant required** — must exist in the plan before any import\n\n## Step-by-Step\n\n**Day Before Wire:**\nStep 01 — Email vendor that wire is coming; request breakdown\n\n**Morning of Wire Day:**\nStep 02 — Follow up; optionally notify cashiering\n\n**Wire Confirmed:**\nStep 03 — Cashiering confirms wire booked → apply Mapping immediately\n\n**File Prep:**\nStep 04 — Confirm source mapping complete\nStep 06 — Complete fund mapping file from TOA (macro available in VBA Repo)\nStep 07 — Create ref # in P2, set effective date → parameter file\n\n**CONV File:**\nStep 08 — Wait for final records + wire breakdown\nStep 09 — Create CONV ref # per fund, enter totals by fund; **Re-Reg = N**\nStep 10 — Confirm dummy participant exists (Critical Check)\n\n**Informatica:**\nStep 12 — Run Day of Wire workflow (production only — no test mode)\nStep 13 — Run all balance import queries to confirm clean load\n\n**P3:**\nStep 15 — Apply balances once wire confirmed (No Hold · Batch · Process Immediate)\nStep 17 — Apply balances to participant accounts\nStep 18 — Run all associated queries for backup\n\n## Fund Splits\n\nRoughly **1 in 25 mapping plans** involves a fund split: one prior fund maps to **two** TA funds at a set ratio (50/50, 75/25, etc.). The split ratio comes from the TOA, same as the rest of the mapping.\n\nTwo things to watch:\n\n- Build the split into the fund mapping file so the workflow divides the prior fund's balance at the stated ratio — it is not a manual post-load adjustment.\n- Sometimes the prior fund codes on the actual balance files don't match what the TOA shows. When that happens, document how you resolved each mismatch — show your work rather than silently reconciling.\n\n## Post-Wire: Mapping Reversal, Then Re-Apply\n\nFund mapping applies **twice**, and they're not the same run (from the balance import guide):\n\n1. **Wire day** — the Day of Wire workflow applies fund mapping to the incoming assets (CONV file fed in, booked to the dummy participant).\n2. **Post-wire** — once final files arrive and completeness is confirmed, process the **mapping reversal** (reverses the day-of-wire booking so balances are ready to be re-mapped), then run the CIT balance workflow to apply fund mapping against the final-file participant data.\n\nSkipping the reversal before applying fund mapping to final files is a known high-severity failure mode. After participant balances post and reconcile, reverse the dummy participant: **P3 → ROC → \"ROC No Reversal\"**.\n\n## Forfeiture Entries\n\nForfeiture entries in balance files use the vendor's naming convention (often year-based, e.g. \"Forfeiture Account 2024\") and the same stand-out date convention as the [[dummy-participant]] — an extra signal that the row isn't a normal participant. (from the balance import guide)\n\n## Where the Ref Number Lives\n\nThe CITS Balances workflow needs to find the per-fund ref numbers somewhere. Mapping puts them in the **fund mapping file** — one ref per fund, alongside the prior fund code and TA fund code. The workflow looks them up there and matches against the participant balances on the CIT balance file.\n\nThis is different from cash conversion: cash puts the (single) AE liquidation ref number on the **parameter file** because there's only one number to track. Mapping has many, so they live alongside the fund rows where each one logically belongs.\n\nThe parameter file for mapping has `Cash Conversion = N` and **does not** carry a ref number.\n\n## See Also\n- [[balance-import]]\n- [[balance-import-tik]]\n- [[balance-import-cash]]\n- [[informatica-balance-module]]\n- [[conv-file]]\n- [[fund-mapping]]\n- [[dummy-participant]]\n- [[day-of-wire-audit]]"},{"id":"data-loading/balance-import-tik","slug":"balance-import-tik","rel":"data-loading/balance-import-tik.md","namespace":"data-loading","title":"Balance Import — Transfer In-Kind","summary":"Balance import method used when the prior record keeper transfers shares directly rather than liquidating and sending cash. Requires re-registration of fund shares and coordination with Matt O'Connell's team starting 4 weeks before liquidat","updated":"2026-07-08","created":"2026-04-19","sources":2,"status":"current","tags":["concept","balance","tik","conversion","informatica","re-registration","day-of-wire"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Balance Import — Transfer In-Kind","type":"data-loading","tags":["concept","balance","tik","conversion","informatica","re-registration","day-of-wire"],"created":"2026-04-19","updated":"2026-07-08","sources":2,"status":"current"},"markdown":"# Balance Import — Transfer In-Kind\r\n\r\nBalance import method used when the prior record keeper transfers shares directly rather than liquidating and sending cash. Requires re-registration of fund shares and coordination with Matt O'Connell's team starting 4 weeks before liquidation.\r\n\r\n## Key Characteristics\r\n\r\n- **Shares trigger the import** — not the wire; import waits until shares arrive and are confirmed on the in-kind spreadsheet\r\n- **Re-registration required** — must be identified from TOA early; submit to Matt O'Connell's team approximately 4 weeks before liquidation\r\n- **Re-Reg field = Y** — critical CONV file setting; changes the transaction type; opposite of Mapping (N)\r\n- **Do NOT use Process Immediate** — TIK uses the Online method in P3 with backdated ref numbers; using Process Immediate would be incorrect\r\n- **Day of Wire workflow** — same Informatica workflow as Mapping but triggered by share arrival, not wire\r\n- **Dummy participant required** — must exist before any import\r\n\r\n## Re-Registration Pre-Work (Phase I — Separate from Import)\r\n\r\nMust be started weeks in advance:\r\n\r\nStep 01 — Review TOA; identify every fund marked Yes for Reregistration (include ALL flagged funds)\r\nStep 02 — Fill out re-registration template for all flagged funds (macro available — fills template fast)\r\nStep 03 — Send completed template to Matt O'Connell's team **~4 weeks before liquidation**\r\nStep 04 — Receive results from Matt O'Connell's team\r\nStep 05 — Forward results to prior record keeper for verification\r\nStep 06 — Receive all-clear from prior record keeper\r\n\r\nField best practice: Build the request early but send in the actual window (~3 weeks before liquidation), while making the send date hard to miss.\r\n\r\nAdditional working rules (from the balance import guide):\r\n\r\n- **SLA on Matt O'Connell's team: ~14 business days** (D1 + 22 days from form submission). They're the bottleneck — submit early and **confirm receipt explicitly**; don't assume the form landed.\r\n- **Don't open the Fidelity receiving accounts too early.** They begin reporting immediately, and stale open-account time is noise. But they must exist before transfer day — receiving accounts missing on transfer day is a multi-week recovery.\r\n- Once accounts are confirmed, **forward the re-registered account details to the vendor** — they need them to direct the in-kind transfer.\r\n\r\n## Balance Import Steps\r\n\r\n**File Prep:**\r\nStep 04 — Confirm source mapping complete\r\nStep 06 — Complete fund mapping file from TOA (macro available in VBA Repo)\r\nStep 07 — Create ref # in P2, set effective date → parameter file (these ref numbers are backdated)\r\n\r\n**CONV File:**\r\nStep 08 — Wait for final records (not wire — shares, not cash)\r\nStep 09 — Create CONV ref # per fund, enter totals; **Re-Reg = Y** (changes transaction type)\r\nStep 10 — Confirm dummy participant exists (Critical Check)\r\n\r\n**Informatica:**\r\nStep 12 — Wait for shares to arrive → confirm on in-kind spreadsheet → run Day of Wire workflow (no test mode)\r\nStep 13 — Run all balance import queries to confirm clean load\r\n\r\n**P3:**\r\nStep 16 — Wait for shares → confirm in-kind spreadsheet (Matt O'Connell's team) → process\r\nSettings: **No Hold · Online · Do NOT Process Immediate**\r\nRef numbers are backdated in parameter file\r\n\r\nStep 17 — Apply balances to participant accounts\r\nStep 18 — Run all associated queries for backup\r\n\r\n## Critical Traps\r\n\r\n1. **Re-Reg = Y is mandatory** — setting Re-Reg = N would run as Mapping, not TIK; wrong transaction type\r\n2. **Never use Process Immediate** — TIK is Online, backdated; Process Immediate would apply incorrectly\r\n3. **Wait for in-kind spreadsheet confirmation** — do not run Day of Wire until Matt O'Connell's team confirms shares arrived\r\n4. **4-week lead time** — if the re-registration template is submitted late, the whole TIK path may fail\r\n\r\n## Expected Share Tracker\r\n\r\nOn final file receipt, **update the expected share tracker immediately** — it's the trigger action, not a cleanup task (from the balance import guide). Final files include share counts; tie them against the tracker. Matt O'Connell's team may populate the initial numbers, but from final-file receipt onward the tracker is the DC's working record.\r\n\r\n## Share-Count Tolerance\r\n\r\nOnce the CIT balance file runs and participant balances are whole, compare the actual shares received against the expected shares from the in-kind spreadsheet:\r\n\r\n- **Off by a tiny amount** (fractional shares) — acceptable; close out and move on\r\n- **Off by more than one full share** — escalate. Run it up to the prior record keeper, and loop in the chain of command. Don't paper over it.\r\n\r\n## See Also\r\n- [[balance-import]]\r\n- [[balance-import-mapping]]\r\n- [[processes/tik-transfer|transfer-in-kind]]\r\n- Matt O'Connell\r\n- [[informatica-balance-module]]\r\n- [[conv-file]]\r\n- [[dummy-participant]]\r\n- [[processes/tik-transfer|re-registration]]"},{"id":"data-loading/base-file","slug":"base-file","rel":"data-loading/base-file.md","namespace":"data-loading","title":"Base File","summary":"The census template provided to the client that seeds the TransAmerica system with participant data. This is the foundation of all participant-level data at conversion.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["document","census","data","client","seeding"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Base File","type":"data-loading","tags":["document","census","data","client","seeding"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# Base File\n\nThe census template provided to the client that seeds the TransAmerica system with participant data. This is the foundation of all participant-level data at conversion.\n\n## Overview\n\nThe base file is a structured template that TransAmerica provides to the plan sponsor (client). The client fills it out with data about their participants and returns it. The DC uses this data to seed [[p3]] with census information before the conversion.\n\n## Who's Included\n\nPriority order for who should appear on the base file:\n\n1. **Participants with balances** — active or termed — always include\n2. **Currently eligible participants** — even if no balance yet\n3. **Soon-to-be-eligible participants** — anyone approaching eligibility in the near future\n4. **Employment records going back a few years** — good practice for rehire scenarios\n5. **Termed participants without balances** — lower priority but useful for rehire history\n\n> The goal: don't over-populate with unnecessary records (terms without balances), but don't under-populate and miss anyone who matters.\n\n## Data Fields\n\n### Participant Demographics\n- Name, SSN, date of birth, date of hire, date of termination (if applicable)\n- Address\n- Employee ID\n\n### Status & Eligibility\n- Employment status (active / termed)\n- Eligibility date\n- Entry date\n\n### Year-to-Date Data\n- YTD contributions by source\n- YTD compensation\n- Prior year compensation (if needed by plan)\n- Current year hours (if plan tracks hours)\n- Prior year hours (if applicable)\n\n### Deferral Information\n- Deferral elections per source\n- Dollar amount or percentage flag\n\n### Other\n- Plan-specific fields as needed (varies by plan)\n\n## Process\n\n1. DC builds the template based on PRD/OB plan provisions\n2. DC schedules meeting with client to walk through every field\n3. Meeting covers: required fields, date formats, number formats, what each column means\n4. Client fills out and returns\n5. DC reviews — may take several back-and-forth rounds\n6. Large plans or clients with multiple payroll sources = expect more iterations\n\n> Clients vary widely in technical expertise. Read them early and plan accordingly.\n\n## Format and Template\n\n- **Format:** Excel\n- **Template:** Standard TA template. DC does not build from scratch — trims and tailors it to the client's specific plan details (relevant fields, plan-specific sources, etc.)\n\n## A Note on \"Sources\"\n\nIn the context of the base file, **sources** means plan-specific contribution sources — things like EE Deferrals, ER Match, profit sharing. Not payroll vendors or payroll systems. The base file handles one set of sources per plan.\n\n## Data Quality: Client's Responsibility\n\nWhen a client returns a base file with data quality issues:\n- DC reviews the file and identifies the problems\n- DC sends **feedback and specific instructions** to the client explaining what needs to change\n- **The client fixes it and returns a clean file** — the DC does not modify client data themselves\n\nThis loop repeats until the file is clean.\n\n## Loading Timing\n\n- **Census data** (participant population) → loaded as soon as the population is confirmed\n- **Everything else** (YTD, deferrals, etc.) → typically loaded at the time of conversion, to ensure data is current and accurate rather than stale from months earlier\n\n## Relationship to Payroll Template\n\nThe base file and [[payroll-template]] share the same ~75% census section. The payroll template extends it with contribution and payroll-specific fields.\n\n## See Also\n\n- [[payroll-template]]\n- [[final-files-processing]]\n- [[p3]]\n- [[eds]]\n- [[dc-onboarding-workflow]]"},{"id":"payroll/bonus-election-setup","slug":"bonus-election-setup","rel":"payroll/bonus-election-setup.md","namespace":"payroll","title":"Bonus Election Setup","summary":"Plan setup pattern for allowing participants to make separate regular and bonus deferral elections.","updated":"2026-05-13","created":"2026-05-13","sources":1,"status":"current","tags":["concept","deferrals","bonus","p3","outbound-file"],"type":"payroll","extras":[],"media":[],"meta":{"title":"Bonus Election Setup","type":"payroll","tags":["concept","deferrals","bonus","p3","outbound-file"],"created":"2026-05-13","updated":"2026-05-13","sources":1,"status":"current"},"markdown":"# Bonus Election Setup\n\nPlan setup pattern for allowing participants to make separate regular and bonus deferral elections.\n\n## Definition\n\nBonus election setup separates regular deferrals from bonus deferrals so each group can have its own minimum and maximum election behavior.\n\n## Why It Matters\n\nIf regular and bonus deferrals are not grouped correctly, participants may be blocked from making a valid bonus election or may exceed expected limits in ways the plan did not intend. The source emphasizes source order, deduction type, and outbound-file display-name limits.\n\n## Evidence / Examples\n\n- Regular deferral sources should come first.\n- Bonus deferral sources should follow regular deferral sources.\n- Regular pre-tax and regular Roth deferrals are combined together.\n- Bonus pre-tax and bonus Roth deferrals are combined together.\n- Combined min/max on pre-tax sources should be N/A.\n- Separate groups allow a participant to elect normal deferrals and a separate bonus deferral up to the plan limit for each group.\n\n## Setup Notes\n\n- Use special deduction types only for bonus deferrals:\n  - Pre tax - Special Deduction\n  - Roth 401K - Special Deduction\n  - After Tax - Special Deduction\n- Regular and bonus pre-tax should map to pre-tax deferral.\n- Regular and bonus Roth should map to Roth 401(k).\n- Payroll deduction display names have a 20-character OBF limit.\n- A longer display name may require a customized outbound file and system work.\n\n## Related Concepts\n\n- [[deferrals]]\n- [[payroll-template]]\n- [[source-mapping]]\n- [[p3]]\n\n## See Also\n\n- [[tc-stuff]]\n- [[roles/lm-dc]]\n- [[tc]]"},{"id":"conversion-ops/booking-assets","slug":"booking-assets","rel":"conversion-ops/booking-assets.md","namespace":"conversion-ops","title":"Booking Assets","summary":"The process of posting wire receipts and balance disbursements to plan accounts in P3. As of August 13, 2025, two distinct booking types apply depending on the source of funds: incoming wires from State Street are booked as a Remit (4), whi","updated":"2026-04-15","created":"2026-04-15","sources":1,"status":"current","tags":["booking","wire","aeda","remit","rebook","cashiering","liquidation"],"type":"conversion-ops","extras":[],"media":[],"meta":{"title":"Booking Assets","type":"conversion-ops","tags":["booking","wire","aeda","remit","rebook","cashiering","liquidation"],"created":"2026-04-15","updated":"2026-04-15","sources":1,"status":"current"},"markdown":"# Booking Assets\n\nThe process of posting wire receipts and balance disbursements to plan accounts in P3. As of August 13, 2025, two distinct booking types apply depending on the source of funds: incoming wires from State Street are booked as a Remit (4), while disbursements from the Advanced Employer Deposit Account are booked as a Rebook (3) with an accompanying AWD ticket.\n\n## Definition\n\n\"Booking assets\" refers to creating the transaction records in P3 that reflect money received (wires in from State Street) or money being credited to participant accounts (withdrawn from the AEDA). The booking type code determines how the system treats the transaction.\n\n## Why It Matters\n\nUsing the wrong booking type causes reconciliation errors, mismatches in P3, and may trigger incorrect trade activity. The August 2025 update formalized a distinction that was previously informal or handled ad hoc.\n\n## Two Booking Scenarios\n\n### Scenario 1 — Wire Hits State Street\n\nWhen the prior record keeper's liquidation wire arrives at State Street Bank & Trust (SSBT):\n\n- **Book as: `4 = Remit`**\n- Process using the same steps as normal\n- Still email NY Recon so they can identify variances and piece together the components\n\nThis is the same logical process as before; the booking code (4=Remit) is explicitly confirmed by the August 2025 update.\n\n### Scenario 2 — Withdrawing from AEDA\n\nWhen posting participant account balances by withdrawing from the **AEDA (Advanced Employer Deposit Account)** — the holding account where cash conversion wire funds sit until participant-level processing:\n\n- **Book as: `3 = Rebook`**\n- After booking, **submit a Rebook AWD ticket**\n- Fill in the required fields on the AWD ticket\n- Change status to **\"COMPLETED\"** before hitting Update — this ticket does not need to go to any other team; it just needs to be submitted\n\n## AEDA Context\n\nThe AEDA is the P3 holding account used for cash conversions (also called the Advanced Employer account). Wire proceeds sit in this account until the DC builds and runs the participant-level balance workflow. When those balances are posted, the money moves out of the AEDA to individual accounts. That withdrawal-and-rebook action is what requires the 3=Rebook type and the AWD ticket.\n\nSee [[advanced-employer]] for the AEDA concept.\n\n## Rebook AWD Ticket — Required Fields\n\nWhen submitting the rebook AWD ticket after a 3=Rebook booking:\n- Fill in all required fields in the ticket\n- Add input in the comments field\n- **Set status to \"COMPLETED\" before hitting Update**\n- No routing to another team is needed — submit and complete in the same step\n\n## Evidence / Examples\n\nFrom the DC Training Notebook (August 13, 2025):\n\n> \"Booking assets when they hit State Street and not using the tr-ref-no that cashiering used to book, you will follow the same process. Book as a 4=Remit whether mapping/booking to holding account. You will still need to send an email to NY Recon so they can identify any variances quickly and piece the components together.\"\n\n> \"When booking assets to process to ppt accounts off a w/d from AEDA you will now book as a 3=Rebook. Once that is complete, you'll need to submit a rebook AWD ticket.\"\n\n## Related Concepts\n\n- [[advanced-employer]] — the AEDA / Advanced Employer account\n- [[liquidation-day]] — when the wire arrives from State Street\n- [[final-files-processing]] — when AEDA funds are disbursed to participant accounts\n- [[cashiering]] — confirms wire receipt; emails NY Recon\n- [[processes/reversal-submission|reversal-process]] — when a booking is made in error\n\n## See Also\n\n- [[advanced-employer]]\n- [[liquidation-day]]\n- [[final-files-processing]]\n- [[cashiering]]\n- [[processes/reversal-submission|reversal-process]]\n- [[roles/lm-dc]]"},{"id":"reference/case-notes-template","slug":"case-notes-template","rel":"reference/case-notes-template.md","namespace":"reference","title":"Case Notes Template","summary":"Structured plan-level notes used to preserve conversion and administration rules for downstream teams.","updated":"2026-05-13","created":"2026-05-13","sources":1,"status":"current","tags":["concept","case-notes","tc","contact-center","plan-setup"],"type":"reference","extras":[],"media":[],"meta":{"title":"Case Notes Template","type":"reference","tags":["concept","case-notes","tc","contact-center","plan-setup"],"created":"2026-05-13","updated":"2026-05-13","sources":1,"status":"current"},"markdown":"# Case Notes Template\n\nStructured plan-level notes used to preserve conversion and administration rules for downstream teams.\n\n## Definition\n\nThe case notes template is a standardized plan note structure. It tells Contact Center, processing, ongoing administration, and conversion teams what is unusual, what participants may do, what plan-specific rules apply, and where risk lives.\n\n> [!warning] Template language\n> The source contains draft/template language with placeholders and plan-specific choices. Do not paste it into live case notes without cleaning placeholders and validating the current plan strategy.\n\n## Why It Matters\n\nCase notes are the operating memory of the plan. They protect downstream teams from guessing about blackout dates, asset transfer restrictions, Financial Guide/CPMA availability, deferral handling, source groups, information sharing, asset gathering, web portal rules, withdrawal exceptions, and participant-facing instructions.\n\n## Evidence / Examples\n\nThe source template includes these major sections:\n\n- Special Alerts\n- Account Maintenance\n- Allocations\n- Asset Gathering\n- Asset Retention\n- Beneficiary\n- Broker / On-Site Information\n- Call Center Handling\n- Catch-Up\n- Deferrals\n- Employer Match\n- Enrollments\n- Expenses\n- Forms\n- Funds\n- Information Sharing\n- Loans\n- Mergers and Acquisitions\n- Money Sources\n- PA Referrals and Authorized Signatures\n- Participant and Client Correspondence\n- Prior Carrier Information\n- QDRO\n- RAD/RMD\n- Statements\n- Transfers\n- Vesting\n- Web Portal\n- Withdrawals\n- Archived Notes\n\n## High-Risk Note Areas\n\n- **Special Alerts:** effective dates, blackout start/end, limited access, CPMA/Financial Guide warnings, asset acceptance limitations, and managed advice routing.\n- **Allocations:** source groups, mapped allocations, service-only funds, and CPMA restrictio
