tiple accounts and make elections under the wrong affiliate.\n- Deferral changes under the wrong affiliate can cause outbound file and payroll mismatches.\n- Loan availability and repayment can be affected when a participant changes affiliates.\n- Date of termination logic does not span affiliates.\n- Rollover deposits and contract exchanges can be misrouted if affiliate numbers are missing.\n- PSD reports may need client-side aggregation.\n- Common remitter setup may be needed to track limits across related plans.\n\n## Related Concepts\n\n- [[common-remitter-plans]]\n- [[deferrals]]\n- [[loan-setup]]\n- [[payroll-template]]\n- [[wx]]\n- [[p3]]\n\n## See Also\n\n- [[tc-stuff]]\n- [[tc]]\n- [[roles/lm-dc]]"},{"id":"coordination/doc-ops","slug":"doc-ops","rel":"coordination/doc-ops.md","namespace":"coordination","title":"Document Operations (Doc Ops)","summary":"Sets up plan details in p3 and adds new special plan classes — the one setup change a DC cannot make directly.","updated":"2026-07-08","created":"2026-04-14","sources":2,"status":"needs-review","tags":["role","doc-ops","documents","p3","plan-setup","pep"],"type":"coordination","extras":[],"media":[],"meta":{"title":"Document Operations (Doc Ops)","type":"coordination","tags":["role","doc-ops","documents","p3","plan-setup","pep"],"created":"2026-04-14","updated":"2026-07-08","sources":2,"status":"needs-review"},"markdown":"# Document Operations (Doc Ops)\n\nSets up plan details in [[p3]] and adds new special plan classes — the one setup change a DC cannot make directly.\n\n## What they own\n\n- Plan setup / P3 configuration, including plan-class rules from the [[prd]] or [[onboarding-package]]\n- Adding **new** special plan classes in P3 (DC-only boundary: you can update existing class names and codes, but only Doc Ops can add new classes — see [[plan-classes]])\n- PEP plan document handling (OBP, AAA, Secure 2.0, SPD) — routed by COM, doesn't touch you\n\n## What you hand them\n\n- **Special class addition request** — when the plan design requires a class that doesn't exist in P3. Exact request channel (email vs. ticket vs. AWD) is not yet documented; ask your team lead\n- **Setup discrepancy flags** — if P3 setup doesn't match the PRD/onboarding package, flag it; COM and Doc Ops coordinate the fix\n\n## What they hand you\n\n- **P3 setup readiness** — plan structure, classes, sources, eligibility, vesting, divisions available in P3. You review and verify before finalizing specs and downstream files. Setup can land before or after your assignment; earlier is better for starting specs\n\n## When to contact them / escalation\n\n- As soon as you identify the need for a new special class — Doc Ops has its own queue and waiting on them is a timing dependency\n- P3 setup blocking your specs — chase readiness through COM if the setup lane is unclear\n\n## Common issues\n\n- DC tries to add a special class directly in P3 — this will fail; only Doc Ops can\n- Class addition sits in the Doc Ops queue while your spec work is blocked — request early\n- P3 not ready when you need to validate plan rules — you're blocked on specs until it is\n\n## See Also\n\n- [[plan-classes]]\n- [[p3]]\n- [[roles/lm-dc]]\n- [[prd]]\n- [[onboarding-package]]\n- [[plan-conversion-handoffs]]"},{"id":"vendors/docusign","slug":"docusign","rel":"vendors/docusign.md","namespace":"vendors","title":"DocuSign","summary":"An electronic signature platform used by the roles/com to send plan documents and onboarding agreements to clients for signature.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["system","tool","com","e-signature","external"],"type":"vendor","extras":[],"media":[],"meta":{"title":"DocuSign","type":"vendor","tags":["system","tool","com","e-signature","external"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# DocuSign\n\nAn electronic signature platform used by the [[roles/com]] to send plan documents and onboarding agreements to clients for signature.\n\n## Overview\n\nDocuSign is an external e-signature service. In the Transamerica conversion workflow, the COM uses it as the primary channel for getting client signatures on formal plan documents. Multiple distinct document sets are routed through DocuSign depending on plan type.\n\n## Key Facts\n\n- External vendor platform (not a TA-built system)\n- Used exclusively by COM in the documented workflow\n- Two distinct use cases in PEP conversions:\n  1. **OBP package** — On-Boarding Package, PEA, and Info Sharing Form\n  2. **Plan documents** — AAA, Secure 2.0 amendment, and SPD\n\n## Role in Plan Conversions\n\n| Document Set | Plan Type | When |\n|---|---|---|\n| OBP + PEA + Info Sharing Form | PEP only | After OBP is created and tabs updated |\n| AAA + Secure 2.0 + SPD | PEP only | After internal and client plan doc review |\n\nNon-PEP document signature workflows are not yet documented — unclear whether DocuSign is used for non-PEP agreements.\n\n## Open Questions\n\n- Whether DocuSign is used for any non-PEP document workflows\n- Whether other roles (TC, Doc Ops) also use DocuSign\n- Whether TA has a specific DocuSign account/template setup or uses it generically\n\n## See Also\n\n- [[roles/com]]\n- [[onboarding-package]]\n- [[doc-ops]]"},{"id":"conversion-ops/dummy-participant","slug":"dummy-participant","rel":"conversion-ops/dummy-participant.md","namespace":"conversion-ops","title":"Dummy Participant","summary":"A placeholder participant (SSN 999-00-0000) required in the census before running the Day of Wire Informatica workflow for mapping conversions.","updated":"2026-07-08","created":"2026-04-14","sources":3,"status":"current","tags":["dummy","mapping","day-of-wire","processing","workaround"],"type":"conversion-ops","extras":[],"media":[],"meta":{"title":"Dummy Participant","type":"conversion-ops","tags":["dummy","mapping","day-of-wire","processing","workaround"],"created":"2026-04-14","updated":"2026-07-08","sources":3,"status":"current"},"markdown":"# Dummy Participant\n\nA placeholder participant (SSN 999-00-0000) required in the census before running the Day of Wire Informatica workflow for mapping conversions.\n\n## Overview\n\nThe Informatica Day of Wire workflow, when processing a mapping conversion, routes the initial transaction through a single fake participant account. This is a system requirement — the first booking is applied to the dummy account so that trades can go out. After participant balances are posted, the dummy's details are reversed.\n\n## Key Facts\n\n- **SSN:** 999-00-0000\n- **Date of Birth:** 12/25/1955 (stand-out value)\n- **Date of Hire:** 12/25/1985 (stand-out value)\n- **Required for:** Mapping conversions\n- **Not required for:** Cash conversions (advanced employer used instead), TIK conversions\n- **Must exist in census before** Day of Wire workflow runs — check this before liquidation day\n\n## Stand-Out Date Convention\n\nThe DOB and DOH above are deliberate. Anytime one of those dates shows up in a query result or P3 screen, it's an immediate signal: **this is not a real participant — handle it differently.** [[forfeiture-loading|Forfeiture entries]] use the same convention.\n\n## Lifecycle\n\n1. **Pre-liquidation:** Verify dummy participant exists in census\n2. **Day of Wire:** Informatica processes first transaction to dummy account → trades go out\n3. **After final files / balance posting:** Reverse dummy's details via ROC tool in P3\n4. **Post-reversal:** Only participant balances remain on the books; dummy is cleared\n\n## Why It Exists\n\nThe mapping Day of Wire workflow needs to process the full trade on liquidation day — but actual participant allocations can't be posted until final files arrive (which come later). The dummy account acts as a temporary holder so that trades go out immediately on liquidation day, getting money invested at that day's NAV. Participant details fill in later without generating new trades.\n\n## Reversal Process\n\nAfter posting participant balances:\n1. Go to [[p3]] → select **ROC** from the P3 menu bar\n2. Run query: **\"ROC No Reversal\"**\n   - **Case number starts with \"T\"** → use region **TDA**\n   - **Case number starts with anything else** → use region **CORP**\n3. Enter: **case number** + **SSN 999-00-0000**\n4. Execute — the tool reverses the dummy's records\n5. Run verification query to confirm dummy records are cleared\n6. Only participant-level data should remain on the books\n\n> The ROC tool is the **only place** DCs can make direct table changes. AQT is read-only.\n\n## Key Clarifications\n\n**Who adds the dummy participant?**\nThe **DC** adds it. Not Doc Ops.\n\n**Is the dummy reused or created fresh?**\nCreated fresh — **one dummy per plan**. Not reused across plans.\n\n**Is a dummy needed for partial TIK (mixed mapping + TIK funds)?**\nNo. The dummy is only required for **mapping funds** (re-reg = N). TIK funds create placeholders differently and do not need the dummy.\n\n**What happens if you forget the dummy before Day of Wire?**\n> The data won't load correctly and will need to be cleared by Prod Support. It's a nightmare. Don't do it.\n\nThis is one of the most painful avoidable mistakes in a conversion. Check for the dummy participant before running Day of Wire — every time.\n\n## See Also\n\n- [[conversion-types]]\n- [[informatica]]\n- [[liquidation-day]]\n- [[final-files-processing]]\n- [[p3]]\n- [[processes/tik-transfer|transfer-in-kind]]\n- [[forfeiture-loading]]"},{"id":"reference/eds","slug":"eds","rel":"reference/eds.md","namespace":"reference","title":"EDS","summary":"File validation and processing system used to test and run data file uploads (payroll, balance, census, etc.) before and during conversions.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["system","file-processing","validation"],"type":"reference","extras":[],"media":[],"meta":{"title":"EDS","type":"reference","tags":["system","file-processing","validation"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# EDS\r\n\r\nFile validation and processing system used to test and run data file uploads (payroll, balance, census, etc.) before and during conversions.\r\n\r\n## Overview\r\n\r\nEDS sits between the raw files coming from clients/vendors and [[p3]]. DCs use EDS to validate file layouts, catch errors and warnings, and process files into the system. It is the primary tool for ingesting all structured data files.\r\n\r\n## Full Name\r\n\r\n**Electronic Data System**\r\n\r\n## Access\r\n\r\nOpen [[p3]] → select EDS from the **P3 menu bar**. It is not a separate application — it is accessed directly through P3.\r\n\r\n## Key Functions\r\n\r\n- **File layout configuration** — DC sets up the column/field layout for each plan's files before testing begins\r\n- **File validation** — runs uploaded files against the configured layout, produces output with warnings and errors\r\n- **File processing** — runs validated files through to post data into P3\r\n\r\n## Layout Setup\r\n\r\nBefore any file (payroll test, base file, balance file) can be tested through EDS, the DC must set up the layout in EDS via the **P3 to EDS** module. This must be done ahead of receiving test files — do not wait until files arrive.\r\n\r\n> All layouts you'll need can be set up well in advance. Do it early.\r\n\r\n## Output — Warnings and Errors\r\n\r\nEvery EDS run produces output emails and/or logs. These **must be read carefully**:\r\n- **Errors** — records that failed to process; require fix and resubmit\r\n- **Warnings** — records that processed but had issues; may or may not require action\r\n\r\n> \"Very, very, very important to check those out.\" Reading EDS output is non-negotiable.\r\n\r\n## Payroll File Testing Flow\r\n\r\n1. DC sets up payroll layout in EDS\r\n2. DC receives test file from payroll vendor\r\n3. DC validates file in EDS — reviews output\r\n4. If issues: feedback to vendor → new test file → repeat\r\n5. Once clean: DC sends file to [[payroll-support|Payroll Support Team]] for deeper validation\r\n6. Payroll Support runs in live-equivalent environment, catches different errors\r\n7. Green light from Payroll Support → payroll setup complete\r\n\r\n## Limitations\r\n\r\n- EDS provides internal validation only; Payroll Support's validation is a deeper, production-equivalent run\r\n- Not used for the Day of Wire Informatica workflow (that uses [[informatica]] directly)\r\n\r\n## Accepted File Formats\r\n\r\nEDS accepts **all formats** — CSV, Excel, fixed-width. No format restrictions.\r\n\r\n## Multiple Layouts Per Plan\r\n\r\nYes — **many layouts can be set up per plan simultaneously**. Each data type (balance, YTD, deferrals, eligibility, payroll, census) gets its own layout. Set them all up early.\r\n\r\n## See Also\r\n\r\n- [[p3]]\r\n- [[informatica]]\r\n- [[payroll-template]]\r\n- [[base-file]]\r\n- [[final-files-processing]]"},{"id":"data-loading/eds-load-beneficiary-requirements","slug":"eds-load-beneficiary-requirements","rel":"data-loading/eds-load-beneficiary-requirements.md","namespace":"data-loading","title":"EDS Load Beneficiary Requirements","summary":"Requirements and data elements for loading participant beneficiary designation data through EDS.","updated":"2026-06-25","created":"2026-04-16","sources":1,"status":"needs-review","tags":["eds","beneficiary","process","system"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"EDS Load Beneficiary Requirements","type":"data-loading","tags":["eds","beneficiary","process","system"],"created":"2026-04-16","updated":"2026-06-25","sources":1,"status":"needs-review"},"markdown":"# EDS Load Beneficiary Requirements\n\nRequirements and data elements for loading participant beneficiary designation data through EDS.\n\n## Current Documentation\n\nThe EDS hub page covers the general framework applicable to beneficiary loading:\n\n> **[[eds]] — see Key Functions, Layout Setup, and Output sections**\n\nBeneficiary loading fits within the standard EDS pattern:\n- DC sets up the beneficiary layout in EDS before files arrive\n- Each data type gets its own layout — beneficiary is set up independently\n- EDS validates the file against the layout and produces errors/warnings output\n- Output must be reviewed after every run\n\nThe source document (`raw/new mds/EDS LOAD BENEFICIARY REQUIREMENTS 06-17-2011.md.txt`, dated June 2011) exists but is currently empty. Note: the 2011 date means this document may describe legacy behavior — verify whether current procedures differ before relying on it.\n\n## Source Notes\n\nCurrent content is derived from the [[eds]] hub page general layout, validation, and output rules. Beneficiary-specific requirements still need a populated source document before this can be marked current.\n\n## Full Documentation\n\nWhen the source is populated and ingested, this page will cover: beneficiary-specific layout fields, required data elements (primary/contingent beneficiary, relationship, percentage), validation rules, and any special handling for plans with beneficiary data from a prior vendor.\n\n## See Also\n- [[eds]]\n- [[processes/eligibility-loading|loading-eligibility-eds]]\n- [[loading-ytd-contributions-eds]]\n- [[final-files-processing]]"},{"id":"data-loading/eligibility-and-deferrals","slug":"eligibility-and-deferrals","rel":"data-loading/eligibility-and-deferrals.md","namespace":"data-loading","title":"Eligibility and Deferrals","summary":"Overview of the relationship between deferral processing and eligibility processing during the final files phase. These are separate processes with a hard sequencing rule between them.","updated":"2026-04-14","created":"2026-04-14","sources":3,"status":"current","tags":["eligibility","deferrals","p3","processing","auto-enrollment","sequence"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Eligibility and Deferrals","type":"data-loading","tags":["eligibility","deferrals","p3","processing","auto-enrollment","sequence"],"created":"2026-04-14","updated":"2026-04-14","sources":3,"status":"current"},"markdown":"# Eligibility and Deferrals\n\nOverview of the relationship between deferral processing and eligibility processing during the final files phase. These are separate processes with a hard sequencing rule between them.\n\n> See [[deferrals]] and [[eligibility]] for full detail on each. This page covers the relationship and sequence.\n\n---\n\n## The Core Rule\n\n> **Deferrals first. Eligibility second. Always.**\n\nThese are separate processes. The only connection between them is sequence:\n- **[[deferrals]]** fill the system state — elections are in place\n- **[[eligibility]]** triggers system actions — auto-enrollment, eligibility logic, entry dates\n\nIf eligibility runs before deferrals are loaded, the system has nothing to check against. Auto-enrollment fires and overwrites elections that may not match the participant's actual deferral. Reversals are messy.\n\n---\n\n## The Sequence\n\n```\nFinal files arrive\n    ↓\nPost participant balances (see [[final-files-processing]])\n    ↓\nLoad DEFERRALS  ← FIRST\n    (including auto-enrollment data — see [[deferrals]])\n    ↓\nVerify all elections are correct\n    ↓\nSend internal approval email → QA / TC / COM\n    ↓\nWait for go-ahead\n    ↓\nEnable ELIGIBILITY in P3  ← SECOND\n    ↓\nLoad and process eligibility\n    ↓\nRun queries, verify\n```\n\n---\n\n## Why Order Matters\n\nMany plans have **auto-enrollment**: if a participant is eligible but has no deferral on file, the system enrolls them at a default rate (e.g., 1%). \n\n- Deferrals loaded first → system sees the election → skips auto-enrollment for that participant ✓\n- Eligibility first → no elections in place → auto-enrollment fires for everyone → overrides actual elections ✗\n\nReversing incorrect auto-enrollment entries is possible but painful. Don't allow the situation to occur.\n\n---\n\n## Key Differences\n\n| | Deferrals | Eligibility |\n|--|-----------|-------------|\n| What it does | Fills system state (elections) | Triggers system actions |\n| Complexity | High — data-driven, exception-heavy | Structured — rules-driven |\n| Main challenge | Auto-enrollment dates (esp. ADP) | Class/service rule configuration |\n| Error recoverability | Harder to unwind | Easier, but still painful |\n| SME | — | Scott Vrba |\n\n---\n\n## See Also\n\n- [[deferrals]] — full detail on deferral processing\n- [[eligibility]] — full detail on eligibility processing\n- [[final-files-processing]] — the broader final files context\n- Scott Vrba — eligibility SME\n- [[p3]]\n- [[dc-onboarding-workflow]]"},{"id":"data-loading/eligibility-loading","slug":"eligibility-loading","rel":"data-loading/eligibility-loading.md","namespace":"data-loading","title":"Eligibility Loading Through EDS","summary":"How eligibility data for plan participants is loaded into p3 using eds — replacing the legacy AQT path into `Part_Elig_src`.","updated":"2026-06-25","created":"2026-04-16","sources":1,"status":"current","tags":["process","eligibility","eds","cit","loading"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Eligibility Loading Through EDS","type":"data-loading","tags":["process","eligibility","eds","cit","loading"],"created":"2026-04-16","updated":"2026-06-25","sources":1,"status":"current"},"markdown":"# Eligibility Loading Through EDS\r\n\r\nHow eligibility data for plan participants is loaded into [[p3]] using [[eds]] — replacing the legacy AQT path into `Part_Elig_src`.\r\n\r\n## Overview\r\n\r\nThe EDS eligibility data type handles both eligible participants (direct insert) and non-eligible participants (routed through the nightly batch). It uses a fixed, pre-defined layout with automatic data elements. Sources can load independently — they do not need to arrive together.\r\n\r\nThis process is a subprocess of [[final-files-processing]] but also runs on its own whenever eligibility data needs to be refreshed.\r\n\r\n## Trigger\r\n\r\nAny of the following:\r\n- Final files include eligibility data that needs to be posted.\r\n- A client sends updated eligibility mid-plan.\r\n- A previously errored load has been corrected and needs re-posting.\r\n\r\n**Pre-requisite:** Participant enrollment data must already be loaded. Eligibility loading cannot proceed without it.\r\n\r\n## Steps\r\n\r\n### 1. Confirm Layout and File Type — DC\r\nThe eligibility layout is pre-defined and fixed — all data elements auto-included, none removable. Supported file types: flat file, comma-delimited, or Excel. Standard EDS formatting functions apply to SSNs and dates.\r\n\r\n### 2. Prepare Normalized File — DC\r\nData must be normalized. **One row per participant per source.** Never combine multiple sources per row.\r\n\r\n### 3. Validate Required Fields — DC\r\nPer participant row:\r\n\r\n| Field | Rules |\r\n|-------|-------|\r\n| SSN | With or without dashes |\r\n| Source ID | Individual Source IDs, or `0` for \"all sources\" when eligibility rules match across sources. May mix `0` and specific IDs in one file — but not for the same participant |\r\n| Eligibility Status | 0 (unknown), 1 (not eligible, kit needed), 2 (not eligible, no kit), 3 (eligible), 4 (excluded) |\r\n| Eligibility Date | Optional. Valid with status 1/2/3. If provided, Plan Entry Date must also be provided |\r\n| Plan Entry Date | Optional. Valid with status 1/2/3. If provided, Eligibility Date must also be provided |\r\n| Kit Mail Date | Optional. Only if Eligibility Date and Plan Entry Date both included |\r\n| Rehire Code | Y or N. Mixed values allowed in one file |\r\n\r\nUse `N` for non-rehires or eligible participants. Use `Y` only when rehire logic is enabled, the participant is not eligible, and rehire events exist.\r\n\r\n### 4. Choose Processing Type — DC\r\nReplaces the standard Validate Only flag:\r\n\r\n| Type | When to Use |\r\n|------|-------------|\r\n| **Validate** | Test data. Validates against plan rules without posting |\r\n| **Validate/Commit** | Default for live data. Validates and posts |\r\n| **Commit Only** | Small populations that previously errored and have been corrected. Posts with limited validation |\r\n\r\n### 5. Decide When CIT Eligibility Job Runs — DC\r\nAt load time, tick the **Run Eligibility** checkbox to trigger the CIT Eligibility job immediately after the EDS load. If left unchecked, the job can be launched later from the Work Queue.\r\n\r\n> EDS Eligibility and CIT Eligibility are functionally the same process but are separate jobs.\r\n\r\n### 6. Submit the Load — DC\r\nEDS validates that eligibility is enabled on the plan and that the specified Source IDs exist. Standard formatting edits (dates, SSNs) run first.\r\n\r\n### 7. Wait for the Job Completion Email — DC\r\nWhen the CIT Eligibility job completes, an automated email arrives with load details and links to the error/warning reports.\r\n\r\n### 8. Review and Handle Warnings — DC\r\nCIT Eligibility edits vary by processing type. Example: in Validate/Commit, if a provided date doesn't match plan-rule calculation, a warning is issued. In Commit Only mode, that same mismatch produces no warning.\r\n\r\nFull edit list lives in the Functional Requirements document. Review every warning; re-submit corrections using Commit Only if appropriate.\r\n\r\n## Handoff Points\r\n\r\n| # | From → To | What Moves | Risk |\r\n|---|-----------|------------|------|\r\n| 1 | DC → EDS | Normalized eligibility file | Mixed `0` and specific Source IDs for same participant → EDS error |\r\n| 2 | EDS → CIT Eligibility job | Validated load | If \"Run Eligibility\" not checked, job waits indefinitely until manually triggered |\r\n| 3 | CIT Eligibility → DC inbox | Job completion email with error report links | Email ignored → silent data problems persist into go-live |\r\n\r\n## Timing / Deadlines\r\n\r\n- **Deferrals must load first.** See [[eligibility-and-deferrals]] — posting eligibility before deferrals breaks the enrollment logic.\r\n- **Enrollment data loaded first.** Hard pre-requisite.\r\n- **Balance posting loaded first.** Part of the final-files sequence — see [[final-files-processing]].\r\n\r\n## Failure Modes\r\n\r\n- **Missing enrollment data.** Load aborts; eligibility cannot attach to non-existent participants.\r\n- **Eligibility Date without Plan Entry Date (or vice versa).** EDS rejects the row.\r\n- **Mixed Source IDs per participant.** Using `0` and a specific Source ID on the same SSN causes an EDS error.\r\n- **Wrong Rehire Code.** `Y` only applies when rehire logic is enabled, participant is not eligible, and rehire events exist. Otherwise use `N`.\r\n- **Processing type mismatch.** Commit Only skips the rule-match check — use only for pre-validated corrections.\r\n- **\"Run Eligibility\" not checked and never launched.** Data sits in the Work Queue; nobody notices until downstream breakage.\r\n\r\n## See Also\r\n\r\n- [[eds]]\r\n- [[eligibility]]\r\n- [[eligibility-and-deferrals]]\r\n- [[final-files-processing]]\r\n- [[loading-basis-eds]]\r\n- [[loading-ytd-contributions-eds]]\r\n- [[roles/lm-dc]]"},{"id":"data-loading/eligibility","slug":"eligibility","rel":"data-loading/eligibility.md","namespace":"data-loading","title":"Eligibility Processing","summary":"The process of enabling plan eligibility rules in P3 so the system begins applying them to participants. Always runs after deferrals — eligibility triggers system actions; deferrals must already be in place first.","updated":"2026-07-08","created":"2026-04-14","sources":4,"status":"current","tags":["eligibility","p3","processing","auto-enrollment","final-files","ltpt"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Eligibility Processing","type":"data-loading","tags":["eligibility","p3","processing","auto-enrollment","final-files","ltpt"],"created":"2026-04-14","updated":"2026-07-08","sources":4,"status":"current"},"markdown":"# Eligibility Processing\n\nThe process of enabling plan eligibility rules in P3 so the system begins applying them to participants. Always runs after [[deferrals]] — eligibility triggers system actions; deferrals must already be in place first.\n\n## Core Rule\n\n> **Eligibility triggers system actions. Deferrals must fill the system state first.**\n\nOnce eligibility is enabled, P3 begins running auto-enrollment logic, entry date calculations, and other automated processes. If deferrals aren't already posted, those actions will override or conflict with participant elections. Enable eligibility only when the system state is ready.\n\n## What Eligibility Does\n\nEnables the plan's eligibility rules in P3 per source. Once enabled:\n- The system applies eligibility logic to participants (who qualifies, when they enter)\n- Auto-enrollment triggers for participants without a deferral on file\n- Eligibility dates and entry dates are calculated based on P3 rule configuration\n\n## Data Sources (Preferred Order)\n\n1. **Full client population data** — best case; most accurate and comprehensive\n2. **Vendor data** — acceptable; may require validation\n3. **Manual calculation** — least ideal; use only when client and vendor data are unavailable\n\nThe client decides which source to use. This decision must be confirmed before final files arrive.\n\n## P3 Rule Engine\n\nEligibility in P3 is rules-driven and structured. Key rule types:\n\n- **Class-based eligibility** — different classes (union, part-time, special groups) can have different eligibility rules. See [[plan-classes]].\n- **Service requirements** — hours worked, months of service, or both; configured per source\n- **Eligibility date vs. Entry date** — when a participant *becomes* eligible vs. when they *enter* the plan (may differ by plan design)\n- **\"ALL\" class** — if the plan uses a single \"ALL\" class, eligibility is the simplest possible: minimal restrictions, everyone eligible on the same terms\n\n## Which Sources to Process\n\n**Only enable eligibility for sources that will receive contributions.** Never enable non-contributing sources — it creates unnecessary batch jobs and orphaned eligibility records.\n\nThe list of contributing sources comes from the [[source-mapping]] and the [[prd]] or [[onboarding-package]].\n\n## Workflow\n\n1. **Prepare the eligibility file** (from final files via [[eds]] layout)\n2. **Send internal approval email** to QA, TC, and COM — use the standard template\n   > Essence: \"I'm about to start working. Go do your thing first.\"\n   - Standard email template exists — do not write from scratch\n   - Turnaround: same day, within the hour\n3. **Wait for go-ahead** from QA/TC/COM before proceeding\n4. **Enable in P3** — navigation: Plan → top left dropdown → Outsourcing Summary → Eligibility → Enable screen\n   - Enable only contributing sources\n5. **Load and process** eligibility\n6. **Verify** — run queries, confirm results\n\n## P3 Navigation\n\n> Plan → top left dropdown → Outsourcing Summary → click Eligibility → Enable screen\n\n## Auto-Enrollment Interaction\n\nIf a plan has auto-enrollment and a participant has **no deferral on file** when eligibility runs:\n- The system auto-enrolls them at the default rate (e.g., 1%)\n- This overrides what may be the participant's actual election\n\n**Prevention:** [[deferrals]] must be loaded before eligibility. The auto-enrollment logic checks for an existing deferral — if one is present, the participant is skipped.\n\nIf auto-enrollment fires before deferrals are posted: technically reversible, but it's a pain. Don't let it happen.\n\n## Eligibility Dates\n\nDetermined by one of three sources — client decides in advance:\n- Straight from the client's records\n- Straight from the prior vendor\n- Calculated by the eligibility rules configured in P3\n\nEligibility cannot be pre-active in P3 before the DC enables it. It runs plan by plan.\n\n## LTPT — Long-Term Part-Time Eligibility (Secure Act 2.0)\n\nAs of **January 1, 2025**, a new federal eligibility category applies to all 401(k) and 403(b) plans: **LTPT (Long-Term Part-Time) eligibility**.\n\n**Rule:** Employees who work at least **500 hours in two consecutive 12-month eligibility computation periods** (age 21 minimum) become eligible to make elective deferrals — regardless of the plan's standard eligibility requirements.\n\n**Key points for the DC:**\n- LTPT employees can only make **elective deferrals** — not eligible for employer contributions unless they also meet standard eligibility\n- New EDS status codes: **5** = Not eligible, kit mailed due to LTPT; **6** = Eligible, LTPT\n- **Even excluded-class employees** (collectively bargained, non-resident aliens) should have hours tracked — in case they move to a covered class\n- Hours data must be requested going back through the relevant computation periods; request **by pay period**\n- The previous threshold was three consecutive years for 401(k); reduced to two as of January 1, 2025\n\nSee [[ltpt-eligibility]] for the full concept reference.\n\n## Escalating Complex Eligibility Questions\n\nFirst check the [[prd]] and [[onboarding-package]] — most eligibility setup questions are answered there. When they aren't, escalate to the eligibility SME (currently Scott Vrba), the primary internal resource for eligibility rules and P3 eligibility configuration.\n\nEscalate when:\n- Complex class-based eligibility rules don't fit standard patterns\n- Service requirement configurations are unusual\n- Eligibility date / entry date logic isn't straightforward\n- An eligibility setup question isn't answered by the [[prd]] or [[onboarding-package]]\n- Processing produces unusual eligibility outcomes that need verification\n\n## Characteristics\n\n- **Rules-driven and structured** — consistent, predictable, driven by P3 configuration\n- **Errors are recoverable** but reversals are painful — do it right the first time\n- Much simpler than [[deferrals]] in terms of data complexity; the complexity lives in the P3 rule setup\n\n## See Also\n\n- [[deferrals]] — must be processed before eligibility\n- [[eligibility-and-deferrals]] — overview of the relationship and sequence\n- [[ltpt-eligibility]] — Long-Term Part-Time eligibility (Secure Act 2.0)\n- [[final-files-processing]] — broader final files context\n- [[plan-classes]] — class-based eligibility rules\n- [[p3]] — system where eligibility is enabled\n- [[dc-onboarding-workflow]]"},{"id":"vendors/exponenthr","slug":"exponenthr","rel":"vendors/exponenthr.md","namespace":"vendors","title":"ExponentHR","summary":"ExponentHR currently does not support a full 360 inbound/outbound setup with Transamerica — treat it as inbound SFTP only.","updated":"2026-07-08","created":"2026-07-08","sources":1,"status":"active","tags":["vendor","payroll"],"type":"vendor","extras":[],"media":[],"meta":{"title":"ExponentHR","type":"vendor","tags":["vendor","payroll"],"created":"2026-07-08","updated":"2026-07-08","sources":1,"status":"active"},"markdown":"# ExponentHR\n\nExponentHR currently does not support a full 360 inbound/outbound setup with Transamerica — treat it as inbound SFTP only.\n\n## Handling\n\n- ExponentHR sends the payroll file to Transamerica by SFTP; gather their SFTP details for inbound setup.\n- Outbound files are the standard files posted to WX; the client downloads them and makes the updates manually.\n- In some cases, ExponentHR contacts can help the client use an import file to load deferrals and loans instead of entering each item by hand.\n\n## See Also\n\n- [[payroll-vendor-onboarding]]\n- [[ftp-connection]]\n- [[payroll-template]]"},{"id":"sources/extra-questions-001","slug":"extra-questions-001","rel":"sources/extra-questions-001.md","namespace":"sources","title":"Extra Questions — Round 4 Answers","summary":"Answers to all outstanding open questions across the wiki. Provided by DC (Marcus) via written Q&A. Covers 20+ pages.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["q-and-a","clarifications","open-questions"],"type":"source","extras":[],"media":[],"meta":{"title":"Extra Questions — Round 4 Answers","type":"source","tags":["q-and-a","clarifications","open-questions"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# Extra Questions — Round 4 Answers\n\nAnswers to all outstanding open questions across the wiki. Provided by DC (Marcus) via written Q&A. Covers 20+ pages.\n\n## Summary\n\nThis source resolves nearly every open question flagged during the initial brain dump and follow-up rounds. Key areas covered: file formats and template locations, P3 navigation paths, system access details, team ownership clarifications, process nuances, and a handful of \"how do you actually handle X\" answers that weren't in the original brain dump.\n\n## Key Claims\n\n- Audit pack: Excel, stored at `root/Conversion/Contract`, same template for all conversion types, QA reviews same day\n- Base file: Excel, standard TA template trimmed per client; census loaded when population confirmed; rest at conversion time\n- Dummy participant: DC adds it, one per plan, only for mapping funds (not TIK), nightmare if forgotten\n- Eligibility P3 path: Plan → top left dropdown → Outsourcing Summary → Eligibility → Enable screen; go-ahead within the hour\n- CIT balance file structure: Case Number, Region, SSN, Source, Fund, Total\n- One EDS layout per data type (not combined)\n- Client decides whether to use vendor or own data for eligibility/deferrals\n- FTP setup via email to FTP team; each plan has its own destination folder\n- FMC owned by cashiering/trading; email backup process exists for missed cutoffs; TIK funds don't require FMC entries\n- Fund mapping TA-internal fields: Filter, Vendor Fund Code, Ref #, Split Ratio, Split Code, Total\n- Neither fund mapping nor source mapping is loaded to the system — both are reference docs used in workflows\n- P2 navigation for trans ref numbers: CORP07/tdatest → 2001 → contract/affiliate # → option 4 → trans code 1006 → proc code 3\n- Trans ref number format: YYYYMMDD + 7-8 random alphanumeric characters\n- PRD created by COM using standard TA template; signed early in the process\n- Prior RK contact known from day of assignment; questionnaire sent in hello email; relationship shared across team\n- Re-reg form: Excel, in front folder of DC folder\n- TIK tracker spreadsheet: DC fills in expected shares from final files; Matt's team updates it when shares arrive\n- Wire instructions: standard template; Assurance Code on P3 (Plan → General Plan → Assurance Codes) determines account\n- NBI full name: New Business Intelligence; web-based; all plans visible including history; standard checklist\n- Informatica: standalone app; CONV file fields fully specified\n- Stacey Fortune: Large Market dept; general knowledge resource; title unknown (humorous response)\n- Prod Support: 1-2 day standard turnaround; same-day for urgent liquidation-day corrections\n\n## Key Quotes\n\n> \"The data won't load correctly and will need to be cleared by Prod Support. It's a nightmare. Don't do it.\" — on forgetting the dummy participant\n\n> \"You gotta deal with it. Keep on banging on them. Happens a lot.\" — on unresponsive prior record keepers\n\n> \"It can delay trades that day... if we can't get into the actual file in our first try, we send an email with the details so they have it on file.\" — on missing the FMC cutoff\n\n> \"Not our job. Account Managers do that.\" — on adding new sources to payroll templates post-conversion\n\n> \"Awesome ass bad ass. I don't know for sure ;)\" — on Stacey Fortune's title\n\n## Entities Mentioned\n\nEllen Miller, Matt O'Connell, Stacey Fortune, Nick Lister, [[prod-support]], [[eds]], [[informatica]], [[nbi]], [[p2]], [[p3]]\n\n## Concepts Mentioned\n\n[[audit-pack]], [[base-file]], [[dummy-participant]], [[eligibility-and-deferrals]], [[final-files-processing]], [[ftp-connection]], [[fund-management-calendar]], [[fund-mapping]], [[liquidation-day]], [[onboarding-package]], [[payroll-template]], [[plan-classes]], [[prd]], [[prior-record-keeper]], [[source-mapping]], [[subpack]], [[toa]], [[processes/tik-transfer|transfer-in-kind]], [[wire-instructions]]\n\n## Contradictions / Open Questions\n\n**Still open after this source:**\n1. FMC shared drive path (exact location)\n2. Common prior RK workflows (Fidelity, Vanguard, Empower) — built by DC, not yet documented\n3. DC query library — many verification queries referenced, to be documented separately\n4. Informatica Day of Wire test mode — DC to confirm whether full execution test is possible\n5. DC folder workflows (WFs) — still being tuned, documentation pending\n\n## See Also\n\n- [[sources/dc-brain-dump-001]]\n- [[overview]]\n- [[dc-onboarding-workflow]]"},{"id":"glossary/faa","slug":"faa","rel":"glossary/faa.md","namespace":"glossary","title":"FAA","summary":"**Full Name:** Fund Asset Allocation","updated":"2026-04-16","created":"2026-04-16","sources":1,"status":"current","tags":["glossary","fund","allocation","data"],"type":"glossary","extras":[],"media":[],"meta":{"title":"FAA","type":"glossary","tags":["glossary","fund","allocation","data"],"created":"2026-04-16","updated":"2026-04-16","sources":1,"status":"current"},"markdown":"# FAA\n\n**Full Name:** Fund Asset Allocation\n\n## Definition\n\nFAA refers to the fund asset allocation data requirements that the DC must satisfy during a conversion — the specific data fields and formats the prior record keeper must provide for fund-level allocation processing.\n\n## Used By\n\n- [[roles/lm-dc]] — DC is responsible for gathering and processing FAA data from the prior RK\n- [[entities/eds]] — FAA data is loaded through EDS layouts\n- [[entities/informatica]] — allocation module processes FAA data\n\n## See Also\n\n- [[fund-mapping]]\n- [[source-mapping]]\n- [[informatica-allocation-module]]"},{"id":"reference/file-naming","slug":"file-naming","rel":"reference/file-naming.md","namespace":"reference","title":"File Naming Conventions","summary":"The naming and identifier conventions used across DC file exchanges — payroll files, Financial Guide uploads, and the stand-out conventions inside data files.","updated":"2026-07-08","created":"2026-07-08","sources":4,"status":"active","tags":["reference","file-naming","payroll","eds","conventions"],"type":"reference","extras":[],"media":[],"meta":{"title":"File Naming Conventions","type":"reference","tags":["reference","file-naming","payroll","eds","conventions"],"created":"2026-07-08","updated":"2026-07-08","sources":4,"status":"active"},"markdown":"# File Naming Conventions\n\nThe naming and identifier conventions used across DC file exchanges — payroll files, Financial Guide uploads, and the stand-out conventions inside data files.\n\n## Payroll Vendor Files\n\nFormat: `\u003ccase#>_\u003ccontract>_\u003caffiliate>.xls` (brain dump 002).\n\nA received timestamp is appended when the file actually arrives, so there is never a duplicate. In the DC's words: \"All the files have the case number underscore contract underscore affiliate. And then dot XLS or whatever. Time stamp comes in once the files actually do arrive, so there's never a duplicate.\" (brain dump 002)\n\n## Financial Guide Mass Subscription\n\nMass subscription uses a `mass_sub_` prefixed file uploaded to Platform File Service (training notebook). The Consistency/Sweep Batch job runs hourly on business days to pick up participants with successful subscriptions but pending TPA allocations.\n\n## EDS Files\n\n- One EDS layout exists per data type — layouts are not combined (extra questions).\n- **Specific EDS file naming rules (how the files themselves must be named) are not documented in the sources.** If a naming rule exists, it needs to be captured.\n\n## Transfer Reference Numbers\n\nNot a file name, but a related identifier convention: trans ref numbers are **YYYYMMDD + 7-8 random alphanumeric characters** (extra questions).\n\n## Stand-Out Conventions Inside Files\n\n- **Forfeiture entries** in balance files use the vendor's name convention — often year-based — plus the stand-out date convention: DOB **12/25/1955**, DOH **12/25/1985** (balances/census/loans dump).\n- **Dummy participant** uses SSN **999-00-0000**; one per plan, mapping conversions only (balances/census/loans dump; extra questions).\n- The point of the stand-out dates: \"Anytime you ever see one of those, it's just an extra way of making sure that these people stand out and are not treated as normal.\" (balances/census/loans dump)\n\n## See Also\n\n- [[payroll-template]]\n- [[eds]]\n- [[balance-import]]\n- [[source-mapping]]\n- [[loan-setup]]"},{"id":"glossary/filespecrq","slug":"filespecrq","rel":"glossary/filespecrq.md","namespace":"glossary","title":"FILESPECRQ","summary":"**Full Name:** File Specification Request","updated":"2026-04-15","created":"2026-04-15","sources":1,"status":"current","tags":["glossary","awd","payroll","ticket-type"],"type":"glossary","extras":[],"media":[],"meta":{"title":"FILESPECRQ","type":"glossary","tags":["glossary","awd","payroll","ticket-type"],"created":"2026-04-15","updated":"2026-04-15","sources":1,"status":"current"},"markdown":"# FILESPECRQ\n\n**Full Name:** File Specification Request\n\n## Definition\n\nFILESPECRQ is an [[awd]] ticket type used by the [[roles/lm-dc]] to hand off incomplete payroll testing to Fiduciary Services at go-live. When payroll testing is not finished by the plan's go-live date, the DC submits a FILESPECRQ ticket containing the payroll vendor contact, client contact, file layout, and a summary of the current testing status. Fiduciary Services then takes over the payroll testing project using their Inforce Payroll Projects process.\n\nThis procedure became effective February 26, 2026.\n\n## Used By\n\n- [[roles/lm-dc]] — submits the ticket at go-live when payroll is not yet complete\n\n## See Also\n\n- [[payroll-handoff-at-go-live]] — full procedure\n- [[awd]]\n- [[roles/lm-dc]]"},{"id":"data-loading/final-files-processing","slug":"final-files-processing","rel":"data-loading/final-files-processing.md","namespace":"data-loading","title":"Final Files Processing","summary":"How the DC processes authoritative as-of-liquidation files from the prior record keeper to populate p3 with real participant data.","updated":"2026-05-03","created":"2026-04-14","sources":3,"status":"current","tags":["process","final-files","balances","posting","cit","eds","conversion"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Final Files Processing","type":"data-loading","tags":["process","final-files","balances","posting","cit","eds","conversion"],"created":"2026-04-14","updated":"2026-05-03","sources":3,"status":"current"},"markdown":"# Final Files Processing\n\nHow the DC processes authoritative as-of-liquidation files from the prior record keeper to populate [[p3]] with real participant data.\n\n## Overview\n\nFinal files arrive after liquidation. They carry the definitive participant data: balances by source and fund, YTD contributions, compensation, hours, deferral elections, and eligibility. The DC loads them through [[eds]] and [[informatica]] in a strict sequence — balance first, then deferrals, then eligibility, then YTD.\n\nThe specific balance-posting steps differ by [[conversion-types|conversion type]] (cash, mapping, or TIK). Everything else runs the same.\n\n## Trigger\n\nThe prior record keeper delivers the final files, typically within 5–10 business days after [[liquidation-day|Liquidation Day]]. The DC has already built all EDS layouts in advance so they can run immediately.\n\n## What's in Final Files\n\n- **Participant balances** by source and fund (as of liquidation date)\n- **YTD contributions** by source\n- **YTD compensation** (and prior year comp if applicable)\n- **Hours** (current year and prior year if applicable)\n- **Deferral elections** (by source, dollar or percentage)\n- **Eligibility data** (status, dates)\n\n## Processing Sequence\n\n**Critical order — do not reverse:**\n1. Post participant balances\n2. Post deferral elections\n3. Enable eligibility (after deferrals, always)\n4. Post YTD data (comp, contributions, hours)\n\nSee [[eligibility-and-deferrals]] for the eligibility/deferral rules.\n\n### Why Elections + Loans Get Top Priority Right After Balances\n\nOnce balances are posted, the next two things on the priority list are **elections** (deferrals) and **loans** (final reconciliation / Phase III takeover — see [[loan-setup]]). Everything else is secondary.\n\nThe reason: once balances + elections + loans are settled, **payrolls can begin processing even before the plan is technically live**. Elections tell the system where the contributions go; loans tell it where loan repayments split. With both in place, payroll can run cleanly on the first available pay period — no missed beats.\n\nIf elections or loans are still pending when payrolls start coming in, contributions either default (and have to be unwound later) or the loan repayments fail to allocate correctly. Both are clean-up nightmares. So once balances are down, elections and loans jump the queue.\n\n## Steps\n\n### 1. Confirm Client Source Policy — DC\nBefore loading, confirm what is being used from final files vs. the [[base-file]]. The client decides in advance — all vendor data, all base data, or a hybrid (e.g., \"use our data for eligibility only\"). This governs which files load into which layouts.\n\n### 2. Build CIT Balance File — DC\nConstruct the balance file from the final files.\n- Structure: `Case Number | Region | SSN | Source | Fund | Total`\n- One row per participant per source per fund.\n- Distinct from the [[conv-file]], which is fund-level — this is participant-level.\n\n### 3. Test CIT Balance Workflow — DC via Informatica\nRun the balance workflow in test mode. Catch layout and mapping errors before production. Always test; don't skip.\n\n### 4. Post Balances — DC via Informatica → P3\n**Processing mode depends on conversion type.** Trades fire only once per fund, so choose carefully.\n\n#### Cash conversion\n1. Request [[advanced-employer]] liquidation — email Stacey Fortune or Nick Lister.\n2. Run participant balance workflow (production).\n3. In P3: **Process Immediate + Batch**. Trades go out to invest participant cash.\n4. Reverse [[dummy-participant]] via ROC tool.\n5. Verify balances in P3.\n\n#### Mapping conversion\n1. Run participant balance workflow (production).\n2. Reverse [[dummy-participant]] via ROC tool.\n3. In P3: **Online + No Hold** (NOT Process Immediate). Trades already fired on Day of Wire via the dummy account — posting only books the detail.\n4. Verify balances in P3.\n\n#### Transfer in Kind\n1. Update Matt O'Connell's share estimates with final-file totals immediately.\n2. Run participant balance workflow — fills the placeholder from Day of Wire.\n3. In P3: **Online + No Hold**. Shares are at Fidelity; no trades needed.\n4. Verify. See [[tik-transfer]] for the full TIK track.\n\n### 5. Post Deferral Elections — DC\nLoad via EDS deferral layout. Must happen before eligibility — see [[eligibility-and-deferrals]].\n\n### 6. Enable Eligibility — DC\nLoad via EDS eligibility layout. Triggers the CIT Eligibility job. See [[processes/eligibility-loading|loading-eligibility-eds]] for the detailed subprocess.\n\n### 7. Post YTD Data — DC\nThree separate EDS loads: YTD contributions, YTD compensation, hours. See [[loading-ytd-contributions-eds]] and [[hours-procedure]].\n\n### 8. Post-Processing Verification — DC\n- Run standard query set — counts, totals, source breakdown.\n- Review EDS output emails for warnings and errors.\n- Build the [[audit-pack]].\n- Update [[nbi]].\n\n## CIT Balance File\n\nThe input file for the Informatica participant balance workflow. Built by the DC from final files. Contains participant-level balance data by source. The Informatica workflow processes this file and posts balances to Bill Remit detail in P3.\n\n**Structure:** `Case Number | Region | SSN | Source | Fund | Total`\n\nNote the key difference from the [[conv-file]]: the CIT balance file is **participant-specific** (one row per participant per source per fund). The CONV file is **fund-specific** (one row per fund).\n\n## EDS Layouts for Final Files\n\nAll EDS layouts for final file types should be set up well before final files arrive. Don't wait — build them early. When files come in, you want to be able to run immediately.\n\n**One layout per data type** — balance, YTD contributions, YTD comp, hours, deferrals, and eligibility each get their own separate EDS layout. There is no combined layout.\n\n## Client Data vs. Vendor Data\n\nFor eligibility and deferral data specifically: **the client decides** whether to use vendor data or their own data. This decision must be known before final files arrive so the DC knows which files to use.\n\n## Handoff Points\n\n| # | From → To | What Moves | Risk |\n|---|-----------|------------|------|\n| 1 | Prior RK → DC | Final files | Late delivery stalls every downstream step |\n| 2 | DC → Informatica → P3 | CIT balance file | Wrong processing mode → duplicate or missing trades |\n| 3 | DC → ROC tool in P3 | Dummy participant reversal (cash + mapping only) | Skipped reversal leaves phantom balance in plan |\n| 4 | DC → Matt O'Connell's team | Updated share estimates (TIK) | Stale estimates → shares sit unclaimed |\n| 5 | DC → QA / TC | Completed posting + audit pack | Missing verification queries → errors discovered after go-live |\n\n## P3 Processing Mode Reference\n\n| Conversion | Step | Mode | Trades Fire? |\n|------------|------|------|-------------|\n| Cash | Balance posting | Immediate + Batch | Yes |\n| Mapping | Balance posting | Online + No Hold | No (fired on Day of Wire) |\n| TIK | Balance posting | Online + No Hold | No (shares already at Fidelity) |\n\n> **Rule:** Trades fire only ONCE per fund. Confirm which earlier step already sent them before choosing the mode.\n\n## Timing / Deadlines\n\n- **Before final files arrive:** all EDS layouts built and tested.\n- **Final files received:** begin balance processing immediately.\n- **Balance → Deferrals → Eligibility → YTD:** strict order, no reordering.\n- **Audit pack due:** before go-live sign-off.\n\n## Failure Modes\n\n- **Reversing the sequence.** Posting eligibility before deferrals corrupts the enrollment logic.\n- **Wrong P3 mode.** Process Immediate on a mapping or TIK conversion fires duplicate trades — requires reversal via [[reversal-submission]].\n- **Forgetting the dummy participant reversal.** Leaves a phantom balance that shows up in every subsequent audit query.\n- **Stale TIK share estimates.** Matt's team can't match incoming shares → delayed posting.\n- **EDS layout not built in advance.** Final files arrive but there's nowhere to load them → days of avoidable delay.\n- **Using wrong data source.** Loading vendor eligibility when client chose base-file eligibility (or vice versa) requires full rework.\n\n## Open Questions\n\n- What queries are run to verify balances after posting? *(Many — will be documented separately)*\n\n## See Also\n\n- [[liquidation-day]]\n- [[tik-transfer]]\n- [[processes/eligibility-loading|loading-eligibility-eds]]\n- [[loading-ytd-contributions-eds]]\n- [[dummy-participant]]\n- [[conversion-types]]\n- [[eligibility-and-deferrals]]\n- [[audit-pack]]\n- [[plan-conversion-handoffs]]\n- [[roles/lm-dc]]\n- [[informatica]]\n- [[eds]]\n- [[p3]]\n- [[base-file]]\n- [[conv-file]]\n- [[loan-setup]]"},{"id":"data-loading/forfeiture-loading","slug":"forfeiture-loading","rel":"data-loading/forfeiture-loading.md","namespace":"data-loading","title":"Forfeiture Loading","summary":"When a balance file from the prior record keeper includes forfeiture entries, the DC loads them as participant-shaped records using a **stand-out date convention** so they're never mistaken for real participants.","updated":"2026-05-03","created":"2026-05-03","sources":1,"status":"current","tags":["forfeitures","balance-import","census","dummy-participant","conversion"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Forfeiture Loading","type":"data-loading","tags":["forfeitures","balance-import","census","dummy-participant","conversion"],"created":"2026-05-03","updated":"2026-05-03","sources":1,"status":"current"},"markdown":"# Forfeiture Loading\n\nWhen a balance file from the prior record keeper includes forfeiture entries, the DC loads them as participant-shaped records using a **stand-out date convention** so they're never mistaken for real participants.\n\n## Why Forfeitures Show Up\n\nForfeitures are amounts that left a participant's account when they terminated without being fully vested — they sit in a plan-level pool until the plan sponsor uses them (to offset employer contributions, pay plan expenses, etc.). When a plan converts, the prior record keeper often delivers these balances as separate line items in the balance file, named for the year they belong to or the source they came from.\n\n## Naming Convention\n\nMatch the vendor's naming. Common patterns:\n\n- `2023 FORFEITURE` (year-based — most common)\n- `MATCH FORFEITURE` (source-based)\n- Whatever string the vendor used\n\nKeeping the vendor's name makes the audit trail easy to reconcile back to the original file.\n\n## Stand-Out Dates\n\nUse the same date convention as the [[dummy-participant]] so forfeiture entries are visually obvious in any participant list:\n\n| Field | Value |\n|-------|-------|\n| Date of Birth | **12/25/1955** |\n| Date of Hire | **12/25/1985** |\n\nAnytime one of these shows up in a query result or a P3 screen, it's an immediate signal: **this is not a real participant — handle it differently.**\n\n## Loading\n\nLoad through the standard [[census-data]] flow alongside (or just before) the balance import. The forfeiture record needs to exist in the system before the [[balance-import]] runs so the balance has somewhere to land.\n\n## See Also\n\n- [[dummy-participant]] — same date convention; same \"this is not a real person\" pattern\n- [[balance-import]]\n- [[census-data]]\n- [[source-mapping]]"},{"id":"payroll/ftp-connection","slug":"ftp-connection","rel":"payroll/ftp-connection.md","namespace":"payroll","title":"FTP Connection","summary":"The automated file transfer channel used by payroll vendors to upload payroll files to TransAmerica's systems.","updated":"2026-07-08","created":"2026-04-14","sources":3,"status":"current","tags":["ftp","payroll","automation","vendor","file-transfer"],"type":"payroll","extras":[],"media":[{"id":"fig-1","caption":"Vendor-side FTP upload page — what the payroll contact sees when sending a file.","src":"SS/FTP.jpg","type":"screenshot"}],"meta":{"title":"FTP Connection","type":"payroll","tags":["ftp","payroll","automation","vendor","file-transfer"],"created":"2026-04-14","updated":"2026-07-08","sources":3,"status":"current"},"markdown":"# FTP Connection\r\n\r\nThe automated file transfer channel used by payroll vendors to upload payroll files to TransAmerica's systems.\r\n\r\n## Overview\r\n\r\nRather than manually delivering payroll files each pay period, payroll vendors are set up with an FTP account to upload files directly to TransAmerica. The DC initiates the account setup process by identifying the payroll upload contact and submitting the request to the FTP team.\r\n\r\n## Why FTP Matters\r\n\r\nOnce set up, the FTP connection enables automated payroll processing — the vendor uploads a file, the system picks it up and processes it without manual intervention. Without FTP, the client must manually send payroll files each period (interim state).\r\n\r\n## Transmission Rules\r\n\r\nWorking rules from training (from the payroll/OBF knowledge-transfer guide):\r\n\r\n- **SFTP is the supported transmission method.** If a client asks about API or another method, do not assume it is available.\r\n- **PGP encryption is optional extra setup.** Some clients or vendors require it; most do not want the added complexity. Flag it early — PGP needs vendor public-key handling, filename/extension details for the setup team, an archive folder, and a special review path before automation.\r\n- **File extension is usually not the routing driver.** Routing generally keys on plan number, affiliate, and wildcard logic.\r\n- **Test labels go after the plan number** in the file name. If \"test\" text comes before the plan number, the file may not route correctly.\r\n- **True Excel files are the exception** — they need special setup on the routing side. Without it, the received file can come through as unreadable numbers and symbols.\r\n\r\n## Ownership — Inbound vs. Outbound\r\n\r\nThe contact you get may own inbound only, outbound only, or both — or may just be the person building the file. Confirm explicitly before assuming setup is covered. If the contact only owns inbound, the client may need to open a separate ticket with the vendor for outbound files. This is the most common early failure point. (from the payroll/OBF knowledge-transfer guide)\r\n\r\n## Existing and Global Vendor Connections\r\n\r\nSome vendors use existing or global SFTP connections, and some client-named vendors actually route through third-party integrators (e.g., Paycor and Rippling route through PayKonnect). The named payroll vendor is not always the connection name that gets set up. Known route names include `ADP`, `PAYKONNECT`, `PAYLCTY` (Paylocity), `ULTIMATE` (UKG inbound), `PAYCOM`, `PAYROLLINTEGRATIONS`, `CREATIVEPLANNING-LM`, and `DETAMOOV-LM` (Datamoov).\r\n\r\nTwo practical consequences:\r\n\r\n- Identify the vendor/source clearly in the request so setup is aimed at the right connection. Jen Curtin coordinates with Eric Lade on setup and routing.\r\n- Vendors with global connections can send files **before** the request is complete. If a vendor says they already sent a test file and nothing arrived, ask the FTP team to look upstream and build the forwarding rule — the file may be sitting upstream rather than truly missing.\r\n\r\n## Request Forms — Standard vs. Mercer\r\n\r\nTwo FTP setup request forms exist. Use the standard form for all non-Mercer plans; Mercer plans have a separate form and workflow with structural differences (e.g., a 6-character case-number prefix vs. 7 in standard). The wrong form means rework. (from the payroll/OBF knowledge-transfer guide)\r\n\r\n## HSA / WEX — Separate SFTP Path\r\n\r\nHSA file connectivity for WEX clients on the CDEX file format goes through a **different setup process** than payroll FTP:\r\n\r\n- **CDEX** (complex normalized file, multiple records per participant) — client or payroll provider transmits via secure FTP to Transamerica, but file format and testing are handled entirely by WEX.\r\n- **Client Portal** — client builds the file and uploads via the WEX website directly; no DC role.\r\n- Ticket submission goes through **GTS (formerly AGT)**, not the regular payroll FTP team. The DC gathers contacts from WEX, Transition Services, and CE before submitting.\r\n\r\n## Setup Process\r\n\r\n1. DC identifies who at the payroll vendor (or client) will be uploading payroll files\r\n2. DC **emails the FTP team** to request account setup\r\n3. FTP team sets up the account and generates login + password credentials\r\n4. DC provides credentials to the payroll upload contact\r\n5. **Connection test — send a random file first.** Before waiting on a real test payroll file, ask the uploader to send any file just to confirm the channel works end-to-end. The thing the system catches on is the [[payroll-template#file-naming-convention|naming convention]] — `\u003ccase#>_\u003ccontract>_\u003caffiliate>.xls`. A throwaway file with the right name proves the channel works before you stake real test data on it.\r\n6. Payroll vendor tests the connection — they see a simple upload page on their end\r\n7. FTP is live — **each plan gets its own destination folder**; vendor uploads files there; system processes them\r\n\r\n![Vendor-side FTP upload page — what the payroll contact sees when sending a file.](SS/FTP.jpg)\r\n\r\n## Auto-Sweep / Batch Mode\r\n\r\nAuto-sweep — where the FTP folder is polled and files are processed automatically without anyone clicking upload — isn't enabled day one. The vendor needs **2 or 3 good runs** through the manual upload page before the channel is moved to batch processing. This typically happens months after go-live, well outside the DC's window.\r\n\r\n## Timing\r\n\r\n**Request FTP setup as early as possible.** The FTP team has a large caseload and setup takes time. Delays in FTP setup mean longer periods of manual payroll file handling.\r\n\r\n> Identify the payroll contact → immediately request FTP setup. Don't wait.\r\n\r\n## Interim: Manual Payroll Filing\r\n\r\nWhen FTP isn't ready, the client sends payroll files directly (via secure email or other secure transfer). This is:\r\n- A valid interim state\r\n- Can last weeks or months depending on FTP team backlog and vendor readiness\r\n- Requires active monitoring by the DC each pay period\r\n- Plans stuck on manual payroll for a long time are a known pain point\r\n\r\n## Monitoring and Escalation\r\n\r\n- **Who monitors failed uploads:** The Account Manager and Payroll Support team\r\n- **Escalation for significant FTP delays:** Client is notified\r\n\r\n## See Also\r\n\r\n- [[payroll-vendor-onboarding]]\r\n- [[payroll-template]]\r\n- [[eds]]\r\n- [[dc-onboarding-workflow]]"},{"id":"coordination/ftp-team","slug":"ftp-team","rel":"coordination/ftp-team.md","namespace":"coordination","title":"FTP Team","summary":"Sets up and manages the FTP connections that let payroll vendors upload files to Transamerica's systems. Setup takes **1–2 weeks** — engage as early as possible.","updated":"2026-07-08","created":"2026-04-14","sources":2,"status":"current","tags":["team","ftp","payroll","file-transfer"],"type":"coordination","extras":[],"media":[],"meta":{"title":"FTP Team","type":"coordination","tags":["team","ftp","payroll","file-transfer"],"created":"2026-04-14","updated":"2026-07-08","sources":2,"status":"current"},"markdown":"# FTP Team\n\nSets up and manages the FTP connections that let payroll vendors upload files to Transamerica's systems. Setup takes **1–2 weeks** — engage as early as possible.\n\n## What they own\n\n- FTP user credentials and plan-specific destination folders (each plan gets its own account and folder)\n- Confirmation to the DC once a connection is live\n- The outbound file process (not DC-owned, but critical to the overall payroll flow)\n- Payroll meeting support as needed\n\nTwo roles matter to you: the **team lead** (currently Jen Curtin) is the authoritative escalation point for anything about internal payroll integration — file formats, vendor connections, troubleshooting; the **setup contact** (currently Eric Leytem) handles final FTP account setup, sends the completion confirmation, and is the day-to-day contact for requests and status.\n\n## What you hand them\n\n- **FTP setup request by email** — as soon as you identify who at the payroll vendor (or client) will upload payroll files. Do not wait; the team has a large caseload and delays here mean an extended manual payroll period\n\n## What they hand you\n\n- **Setup confirmation** — from the setup contact once credentials and the destination folder are live, typically within 1–2 weeks. You then pass the login credentials to the payroll upload contact, who tests the connection (they see a simple upload page on their end)\n\n## When to contact them / escalation\n\n- Routine setup and status: the setup contact\n- Complex, strategic, or unclear payroll-integration questions: the team lead\n- Confirmation delayed past ~2 weeks: follow up with the setup contact\n\n## Common issues\n\n- Late setup request → payroll stays manual longer than it needs to. Identify the upload contact, then immediately request setup\n- Confirmation received but credentials never forwarded to the vendor — the connection sits unused\n\n## See Also\n\n- [[ftp-connection]]\n- [[payroll-template]]\n- [[payroll-support]]\n- [[eds]]"},{"id":"conversion-ops/fund-management-calendar","slug":"fund-management-calendar","rel":"conversion-ops/fund-management-calendar.md","namespace":"conversion-ops","title":"Fund Management Calendar","summary":"A daily trade log that must be updated — and a distribution email sent — before the 4:00 PM EST SSBT (State Street Bank & Trust) cut-off on any day trades go out. One of the most time-critical steps in a conversion. Failure to update it ris","updated":"2026-07-08","created":"2026-04-14","sources":4,"status":"current","tags":["fund-management-calendar","trades","cutoff","liquidation","critical","fmc"],"type":"conversion-ops","extras":[],"media":[],"meta":{"title":"Fund Management Calendar","type":"conversion-ops","tags":["fund-management-calendar","trades","cutoff","liquidation","critical","fmc"],"created":"2026-04-14","updated":"2026-07-08","sources":4,"status":"current"},"markdown":"# Fund Management Calendar\n\nA daily trade log that must be updated — and a distribution email sent — before the 4:00 PM EST SSBT (State Street Bank & Trust) cut-off on any day trades go out. One of the most time-critical steps in a conversion. Failure to update it risks fund companies declining trades, requiring reversal and reprocessing.\n\n## Overview\n\nThe Fund Management Calendar (FMC) tracks every trade being sent out across all plans on a given day. When a conversion involves trades — whether from a mapping Day of Wire or a cash conversion balance posting — the DC must enter the plan's expected trade information into the FMC and send a notification email to four distribution addresses.\n\n> \"The FMC calendar is a critical step for the DC Team to ensure that our internal partners can effectively communicate nightly trade expectations with the fund companies that Transamerica is partnering with. If Transamerica does not communicate these trades to our external partners, we risk the fund companies declining our trades and may have to reverse and reprocess our files.\"\n\nThe procedure below supersedes the old FMC process. The original FMC page in the DC Training Notebook is explicitly marked **\"DO NOT USE.\"**\n\n## Why It Matters\n\nWithout an FMC entry, a large unexpected transaction ($10–20 million or more) has no advance notice and will trigger questions. An entry — even an estimate — communicates intent. Absent entries are the problem; estimates are always acceptable.\n\n> \"If you don't put it in, all of a sudden there's a $10, $20 million transaction. People are gonna question it. It's on the fund management calendar, even if it's not exact, it'll be fine.\"\n\n## Cut-Off Time\n\n| Trigger | Time |\n|---------|------|\n| **SSBT Cut-off** | 4:00 PM EST |\n| **Wire confirmation expected** | 4:45 PM EST (Cashiering confirms by this time if wire received that day) |\n\nIf the wire is not received by the 4:00 PM SSBT cut-off, the FMC must be updated to the **next business day** and a follow-up email sent.\n\n## Email Distribution List\n\nWhenever the FMC is updated with fund balances or an expected wire amount, **also send an email** to all four addresses below. This is mandatory — not optional — per the February 2026 procedure update.\n\n| Address |\n|---------|\n| TRSCFUNDCALENDAR@transamerica.com |\n| TRSCIM.Operations@transamerica.com |\n| TRSCIM.Operations.Members@transamerica.com |\n| TRSCIM.PARISIIIRemittanceBatchNotificationList@transamerica.com |\n\n**Email Subject:** `[Case Number and Affiliate] / FMC Update`\n\n**Email body must include:**\n- Plan Number / Affiliate\n- Plan Name\n- Fund Name / Fund Code / Amount per Fund\n- Expected processing date\n\nIf the wire does not arrive by cut-off and the FMC is moved to the next business day, send a follow-up email to the same list with subject: `FMC Date Change Notification`.\n\n> The email is also critical when unable to access the FMC file — it provides the information to internal teams even if the file cannot be updated.\n\n## When It Applies\n\n| Scenario | Calendar Entry + Email Required? |\n|----------|----------------------------------|\n| AC1 Mapping — Day of Wire | Yes |\n| AC1 Cash — balance posting | Yes |\n| Participant Balance Processing | No (see note below) |\n| Transfer In Kind — Day of Wire | No (shares only, no trades) |\n| Transfer In Kind — balance posting | No |\n| AE interest distribution, dividends, uncashed checks, other small late cash | No — small-money exclusion (see below) |\n\n## Cash Conversion: Three Trading Events\n\nFor a cash conversion, the FMC has to capture **three separate trading events** across different days — not just one. Forgetting any of them is the same problem as not entering anything at all.\n\n| Event | Trades? | Day | FMC Entry Required |\n|-------|---------|-----|--------------------|\n| Wire booked → Advanced Employer purchase | Yes (AE buy) | Liquidation Day | Yes |\n| AE liquidation (final files arrive) | Yes (AE sell) | Final Files Day | Yes |\n| Subsequent fund purchases (participant balances post) | Yes (fund buys) | Same as AE liquidation, or shortly after | Yes |\n\nEach event is a real trade hitting fund companies. Each one needs its own FMC entry on the right day.\n\n## Small-Money Exclusion\n\nNot every cash movement requires an FMC entry. The rule is **big money only**. The following do **not** need FMC entries:\n\n- AE interest distributions (see [[subsequent-cash-imports]])\n- Trailing dividends from prior-RK funds\n- Uncashed check reissues\n- Any other small late-arriving cash applied to participants\n\nThe threshold is judgment-based, not a hard dollar number. If it would make a fund company raise an eyebrow when the trade hit, it goes on the FMC.\n\n**Participant Balance Processing (special case):** No FMC action for the Day of Wire / initial wire step. However, when participant balance posting is run via the Informatica Balance Workflow, the FMC **must be updated with the FMC Estimate from the Informatica Balance Workflow output by 4:00 PM** on the day of processing. If Vanguard (VG) funds are involved, this must be done by **2:00 PM EST** — or approval must be obtained from the fund trade approver (see below).\n\n## Procedure by Conversion Type\n\n### AC1 Mapping Conversions\n\n**Preparing estimates (before liquidation day):**\n- Update FMC with test file balances using the expected TOA date\n- If a date range is provided by the prior RK, use the first date in the range; update if wires are not received on that date\n- If no test files received: request fund/source balances from prior RK or client for estimates\n- If none available: use TOA balances\n- **Deadline for entering estimates: no later than TOA minus five business days**\n\n**Day before / Day of Wire:**\n- Update FMC if actual fund balances are provided before wire receipt\n- When updating with actual fund balances, send the FMC notification email to all four addresses\n\n### AC1 Cash Conversions\n\n**Preparing estimates (before liquidation day):**\n- Same process as mapping: use test file balances with expected TOA date\n- If test files not received: request fund/source balances from prior RK or client\n- If none available: use TOA balances\n- **Deadline: no later than TOA minus five business days**\n\n**Day before / Day of Wire:**\n- Update FMC if actual wire amount is provided before wire receipt\n- When updating with actual expected wire amount, send the FMC notification email\n\n### Participant Balance Processing (Cash Conversions)\n\n- Update FMC with the **FMC Estimate from the Informatica Balance Workflow output** by 4:00 PM on the day of balance processing\n- If Vanguard funds involved: update by **2:00 PM EST** or get approval from the fund trade approver\n- Send the FMC notification email when updating\n\n## Estimate Ladder\n\nUse the best available number, then keep updating it as better data arrives. Early and directionally useful beats late and perfect.\n\n1. **TOA estimate** — fallback if nothing better exists yet. May be stale by the time assets move, but better than leaving the calendar blank.\n2. **Test file balances** — use as soon as available; usually stronger than the TOA.\n3. **Refresh files / PRK updates** — if refreshed balances or PRK/client fund details arrive, update the FMC rather than leaving the old number in place.\n4. **Informatica test output** — when test output gives better fund-level detail, use it to tighten the entry.\n5. **Final files / actuals** — should replace estimates when available before wire/trade timing. Do not leave stale estimates when better data is in hand.\n\n## Trade Approval Beyond the Cutoff\n\nWhen a trade needs approval or coordination beyond the normal processing window, escalate to the fund trade approver (currently Rich Lippoth) — the go-to contact for incoming share activity and regular fund trades.\n\nMost common trigger: participant balance posting where **Vanguard funds are involved and the 2:00 PM EST FMC update deadline was missed**. In that case, trades cannot proceed until the approver signs off.\n\nEscalation flow:\n1. Email the fund trade approver describing the plan, funds, and amounts\n2. Follow up by IM or phone — email alone is not enough for same-day approval\n3. Proceed with trades only after approval\n\nThe same escalation path applies to any trade-related issue requiring approval beyond the standard cutoff window, not just Vanguard.\n\n## If the FMC File Is Locked\n\nThe FMC is a shared file and gets locked when multiple people access it simultaneously. This is a known pain point.\n\n**Mitigation:** Enter estimates as early as possible. Do not wait until you have exact numbers — early estimates are better than late exact figures.\n\n**If locked at cut-off time:**\n1. Send the FMC notification email to all four distribution list addresses (this documents your trade intent even without file access)\n2. Keep trying to access the file throughout the day\n3. Update the file as soon as access is restored\n\n> The email provides the information to internal teams even when the file cannot be updated.\n\n## Trade-Slip Notification Groups\n\nSeparate from the four FMC update addresses above, there are **three internal email groups** used to notify when trades are not going as planned — for example, when the FMC couldn't be updated in time, when a wire didn't arrive that was expected, or when something has to push to the next day.\n\n> **Placeholder — fill in actual addresses:**\n> - `\u003cTRADE-SLIP-LIST-1@transamerica.com>`\n> - `\u003cTRADE-SLIP-LIST-2@transamerica.com>`\n> - `\u003cTRADE-SLIP-LIST-3@transamerica.com>`\n\nStandard wording is short:\n\n> \"Heads up — I had trades for [Plan Name] expected today but [the wire didn't arrive / I couldn't access the FMC / etc.]. I'll handle it tomorrow when [condition] is resolved. Will update FMC then.\"\n\nThis is distinct from the FMC update emails — those announce trades; the trade-slip emails announce *non-trades* or *delayed* trades.\n\n## Core Rule on Timing\n\n> It is **okay** to have an entry on the FMC and have trades **NOT** go out.\n> It is **not okay** to have trades go out **without** an entry on the FMC.\n\nWhen in doubt: put it on early.\n\n## TIK and the FMC\n\nTransfer In Kind conversions are full share transfers — no trading occurs. Therefore, TIK funds do **not** require FMC entries. Only funds that actually trade (cash and mapping conversions) need entries.\n\n## Open Questions\n\n- ~~Exact shared drive path for the FMC~~ — *Confirmed: shared drive path exists (see `\\\\yydafs-data1\\department\\` prefix — exact FMC path still not documented; may be migrating)*\n\n## See Also\n\n- [[liquidation-day]]\n- [[conversion-types]]\n- [[final-files-processing]]\n- [[informatica]]\n- [[cashiering]]\n- [[booking-assets]]\n- [[dc-onboarding-workflow]]"},{"id":"conversion-ops/fund-mapping","slug":"fund-mapping","rel":"conversion-ops/fund-mapping.md","namespace":"conversion-ops","title":"Fund Mapping","summary":"The process of establishing which prior record keeper fund maps to which TransAmerica fund. Required for mapping and TIK conversions.","updated":"2026-05-03","created":"2026-04-14","sources":3,"status":"current","tags":["mapping","funds","toa","conversion"],"type":"conversion-ops","extras":[],"media":[{"id":"fig-1","caption":"Fund mapping template — TOA columns on the left, TA-internal fields on the right.","src":"SS/Fund Mapping.jpg","type":"diagram"}],"meta":{"title":"Fund Mapping","type":"conversion-ops","tags":["mapping","funds","toa","conversion"],"created":"2026-04-14","updated":"2026-05-03","sources":3,"status":"current"},"markdown":"# Fund Mapping\r\n\r\nThe process of establishing which prior record keeper fund maps to which TransAmerica fund. Required for mapping and TIK conversions.\r\n\r\n## Overview\r\n\r\nFund mapping tells the system where participant assets should go when they arrive at TransAmerica. It is extracted from the [[toa]] and loaded into a fund mapping template, which is then reviewed and approved by COM, TC, and QA.\r\n\r\n## When to Do It\r\n\r\n**As soon as the TOA is signed.** No test files needed. The TOA already contains all the fund information required.\r\n\r\n> Do not wait for test files to start fund mapping. TOA is sufficient. Get this done immediately after TOA is signed.\r\n\r\n## Process\r\n\r\n1. TOA is signed by client\r\n2. DC extracts fund information from TOA into the fund mapping template\r\n3. Nearly one-to-one extraction — TOA columns map directly into template columns\r\n4. DC adds ~6 additional TransAmerica-internal fields (part of the template)\r\n5. DC sends completed fund mapping to: COM, TC, QA\r\n6. Approvals received → fund mapping complete\r\n7. File away — no further action needed unless fund lineup changes\r\n\r\n## Template Structure\r\n\r\nBased on TOA data plus inte
