ns.\n- **Deferrals:** mapped deferrals, Master Administrator/Common Remitter handling, and participant-facing election rules.\n- **Information Sharing:** loan and hardship certification process.\n- **Funds:** service-exclusive funds and service stoppage/replacement fund behavior.\n- **Web Portal:** Financial Guide SSO, participant issue triage, and web access notes.\n- **Withdrawals:** special approval boxes, QDRO approvers, guaranteed pooled fund back-end load notes, and plan-specific exceptions.\n\n## Related Concepts\n\n- [[creative-planning-managed-accounts]]\n- [[go-live-checklist]]\n- [[common-remitter-plans]]\n- [[source-mapping]]\n- [[plan-conversion-handoffs]]\n\n## See Also\n\n- [[tc]]\n- [[tc-stuff]]"},{"id":"coordination/cashiering","slug":"cashiering","rel":"coordination/cashiering.md","namespace":"coordination","title":"Cashiering","summary":"Receives, books, and confirms incoming wires from prior record keepers on liquidation day — their confirmation is your green light for Day of Wire processing.","updated":"2026-07-08","created":"2026-04-14","sources":2,"status":"current","tags":["team","cashiering","wire","liquidation"],"type":"coordination","extras":[],"media":[],"meta":{"title":"Cashiering","type":"coordination","tags":["team","cashiering","wire","liquidation"],"created":"2026-04-14","updated":"2026-07-08","sources":2,"status":"current"},"markdown":"# Cashiering\n\nReceives, books, and confirms incoming wires from prior record keepers on liquidation day — their confirmation is your green light for Day of Wire processing.\n\n**Contact:** TA Ops Cashiering — Incoming: `SHTAOPSCASHIERINGINC@transamerica.com`\n\n## What they own\n\n- Receiving incoming wires via State Street Bank & Trust (SSBT)\n- Booking wires to the plan as **4 = Remit** (distinct from AEDA disbursement bookings, 3 = Rebook — see [[booking-assets]])\n- Verifying wire amounts against expected totals\n- Issuing the transfer reference number to the DC\n- Wire pulls at **7:00 AM, 9:00 AM, 1:00 PM, 3:00 PM CST**. Wires received after 3:00 PM CST are deposited the next business day — hard cutoff\n\n## What you hand them\n\n- **Day-before heads-up** — expected wire amount and plan number, sent the day before liquidation. Send it even if Cashiering already has a daily wire list; redundancy beats being missed\n- **Wire-sent notification** — morning of liquidation day, when the vendor confirms the wire went out, with expected total\n- **NY Recon email** — when booking wires, also email NY Recon so they can identify variances\n\n## What they hand you\n\n- **Wire confirmation + transfer reference number** — by **3:45 PM CST** if the wire arrived that day. This email is the green light to run the Day of Wire workflow in [[informatica]]. Do not proceed without it\n- **Delay acknowledgments** — if State Street processing runs long, Cashiering replies to the wire notification thread and confirms when daily notifications are complete\n\n## When to contact them / escalation\n\n- Follow up if confirmation hasn't arrived by 3:45 PM\n- If the wire misses the 4:00 PM SSBT cutoff: update the [[fund-management-calendar]] to the next business day and send the FMC follow-up notification email\n\n## Common issues\n\n- DC forgets the day-before heads-up and Cashiering isn't watching for the wire\n- Starting Day of Wire processing without the reference number\n- Wire lands after 3:00 PM CST — plan on next-business-day deposit, not a same-day exception\n\n## See Also\n\n- [[liquidation-day]]\n- [[wire-instructions]]\n- [[booking-assets]]\n- [[fund-management-calendar]]\n- [[informatica]]"},{"id":"lifecycle/cccs-submission-package","slug":"cccs-submission-package","rel":"lifecycle/cccs-submission-package.md","namespace":"lifecycle","title":"CCCS Submission Package","summary":"The CCCS (Client Conversion Configuration Sheet) is Part 1 of the New Plan Submission Package — a standardized form completed once per plan at the start of a new conversion to capture all plan-level configuration decisions.","updated":"2026-07-08","created":"2026-04-16","sources":1,"status":"current","tags":["subpack","cccs","plan-setup","conversion","document"],"type":"lifecycle","extras":[],"media":[],"meta":{"title":"CCCS Submission Package","type":"lifecycle","tags":["subpack","cccs","plan-setup","conversion","document"],"created":"2026-04-16","updated":"2026-07-08","sources":1,"status":"current"},"markdown":"# CCCS Submission Package\n\nThe CCCS (Client Conversion Configuration Sheet) is Part 1 of the New Plan Submission Package — a standardized form completed once per plan at the start of a new conversion to capture all plan-level configuration decisions.\n\n## Definition\n\nThe CCCS is the master configuration intake document for a new plan. It records the plan type, trustee structure, payroll setup, services included, conversion strategy, auto-enrollment settings, and all key contacts (executive, administrator, TPA, advisor). One CCCS is completed per plan before setup work begins. It is the primary reference for how the plan is configured.\n\n## Why It Matters\n\nThe CCCS establishes the plan's parameters before any system setup occurs. Decisions captured here — such as payroll submission method (PSD vs. FTP), asset transfer strategy (plan level vs. participant directed vs. hybrid), and whether auto-increase is enabled — flow downstream into every subsequent step of the DC workflow. Errors or gaps in the CCCS can cause rework across multiple teams.\n\n## Key Configuration Decisions Captured\n\n| Section | Key Decision |\n|---------|-------------|\n| Plan Type | 401(k), 401(a), 403(b), 457(b), 457(f), NQDC, MEP/PEP, Taft-Hartley |\n| Document Type | Volume Submitter vs. IDP (all 457(f) = IDP; TA does not draft) |\n| Trustee | SSBT, Self-Trust, or Other (trust agreement required) |\n| Payroll | In-house vs. vendor; PSD or FTP; ACH or Wire; frequency |\n| Services | Enrollments, deferrals, allocations, beneficiary data |\n| Conversion Strategy | Plan Level, Participant Directed, or Hybrid |\n| Auto-Enrollment | Being added vs. existing; auto-increase (not for NQDC/457) |\n| QDIA | Default fund; PX re-enrollment options |\n| Loans | Online withdrawal types; takeover loan method |\n\n## Notes on Specific Fields\n\n- **System Effective Date**: Should generally be one month before the plan effective date.\n- **Auto-Increase**: Must not be offered for NQDC or 457 plans.\n- **457(f) Plans**: Always use IDP document type; Transamerica does not draft these documents.\n- **Limited Access Period**: A start/end window configured in plan setup — not yet separately documented in this wiki.\n\n## Reading the CCCS as a DC\n\nWhen the CCCS lands, these are the fields to actually check — each one changes downstream data work:\n\n- **Plan type** — 401(k), 401(a), 403(b), 457(b), 457(f), or Corporate NQDC. Plan type drives which rules below apply.\n- **457(f) = IDP** — all 457(f) plans use the IDP document type, and Transamerica does not draft these documents.\n- **System effective date** — should generally be one month before the plan effective date. If it isn't, question it.\n- **Auto-increase** — must not be offered for NQDC or 457 plans. If the CCCS shows auto-increase on one of these, flag it.\n- **Payroll setup** — submission method (PSD vs. FTP) and funding method (ACH vs. Wire). FTP means an [[ftp-connection]] request needs to go in early; the funding method tells you how the money moves.\n- **Asset transfer strategy** — Plan Level Conversion, Participant Directed, or Hybrid. This determines which balance-import path the conversion will follow.\n- **Takeover loan repayment method** — Payroll, Coupon, or EFT. Sets how converted loans get repaid and what the payroll file needs to carry.\n\n## Evidence / Examples\n\nRaw CCCS template is in `raw/new mds/Sub_Pack_Raw_CCCS.txt`. Full section breakdown is in [[sources/subpack-cccs]].\n\n## Related Concepts\n\n- [[subpack]] — the full submission package of which the CCCS is Part 1\n- [[conversion-types]] — asset transfer strategy selected in the CCCS\n- [[ftp-connection]] — payroll FTP setup decided at CCCS stage\n- [[eligibility]] — services enabled in the CCCS drive eligibility rules\n- [[deferrals]] — auto-enrollment settings in the CCCS affect deferral processing\n\n## See Also\n- [[subpack]]\n- [[sources/subpack-cccs]]\n- [[conversion-types]]\n- [[ftp-connection]]\n- [[eligibility]]\n- [[eds]]"},{"id":"data-loading/census-data","slug":"census-data","rel":"data-loading/census-data.md","namespace":"data-loading","title":"Census Data","summary":"Information gathering and loading of all active and terminated participants (within the last two years) into the system at the start of a plan conversion.","updated":"2026-05-03","created":"2026-04-20","sources":2,"status":"current","tags":["eds","census","process","data","conversion"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Census Data","type":"data-loading","tags":["eds","census","process","data","conversion"],"created":"2026-04-20","updated":"2026-05-03","sources":2,"status":"current"},"markdown":"# Census Data\r\n\r\nInformation gathering and loading of all active and terminated participants (within the last two years) into the system at the start of a plan conversion.\r\n\r\n## Definition\r\n\r\nCensus data is the participant-level data set that seeds a new plan in P3. It includes all active employees and terminated employees with activity within the last two years. The DC receives this data from the client (or the prior record keeper in certain cases), validates it through EDS, and loads it using the **Address Standard** and **Enrollments** data types.\r\n\r\n## Why It Matters\r\n\r\nWithout census data loaded, the system has no participants. Every subsequent step — eligibility, deferrals, payroll testing, go-live — depends on accurate participant records in P3. Errors in census data (wrong DOB, duplicate SSNs, mismatched hire/rehire dates) propagate through every downstream process.\r\n\r\n## Three Input Paths\r\n\r\nCensus data reaches the DC through one of three paths:\r\n\r\n| Path | Frequency | Notes |\r\n|------|-----------|-------|\r\n| **Base file** (from client) | Vast majority | Standard TA template; client fills it out and returns. See [[base-file]]. |\r\n| **Limited access file** (from client) | Cash conversions with an open period before blackout | Lets participants update allocations themselves before liquidation. See [[limited-access-file]]. |\r\n| **Vendor census** (from prior RK) | Rare | Used when the client requests it, or when a termed participant has an incoming balance. Notify client, COM, TC before loading. |\r\n\r\n## Pre-Base-File Chain\r\n\r\nBefore the base file can be finalized, a chain of upstream work has to complete:\r\n\r\n1. **PRD or onboarding package complete** — plan provisions locked. See [[prd]] / [[onboarding-package]].\r\n2. **AWD testing** — the package goes to [[awd]] for testing; results come back in a couple of days. AWD returns term reason codes (if applicable) and verification of testing/eligibility.\r\n3. **Tailor templates** — DC takes the standard base + payroll templates and tailors them to this plan's specific provisions and sources.\r\n4. **Client walkthrough meeting** — once the client contact is identified, schedule a meeting to walk through how to fill out the file. This step matters more than it looks; some clients are not text/data-savvy and need significant hand-holding. Give them ~10 days from the meeting.\r\n5. **Validation and load** — file returns, validate through EDS, load.\r\n\r\n## Data Fields\r\n\r\n| Field | Notes |\r\n|-------|-------|\r\n| SSN | Primary key — duplicate SSNs must be reported to TC |\r\n| First name | |\r\n| Last name | |\r\n| Date of birth | EDS warning if DOB differs from another plan; forward warning report to TC |\r\n| Date of hire | Must not match Date of Rehire |\r\n| Date of term | Only request if DOH and DOR do not both already exist without it |\r\n| Date of rehire | Must differ from Date of Hire |\r\n| Gender | |\r\n| Marital status | |\r\n| Payroll frequency | |\r\n| Address information | Foreign addresses: forward to TC for handling and system updates |\r\n\r\n## Process\r\n\r\n1. Client provides **test files** and **live files**\r\n2. Run all files through EDS using **Validate Only** — never skip this step\r\n3. Review all errors and warnings in EDS output\r\n4. Communicate issues to the client, COM, and TC depending on error type\r\n5. Reconcile test files against live files when live is received — review participant count and class codes (new hires may appear in live that weren't in test)\r\n6. Load using data types: **Address Standard** and **Enrollments**\r\n\r\n## Audit and Edit Checks\r\n\r\n- **One row per employee** — hard requirement\r\n- Verify participant count in file matches count loaded into the system\r\n- If loading class codes, ensure all participants have a class code in the system\r\n- If loading divisions, ensure all participants have a division in the system\r\n- Participants on another plan with a different DOB appear on EDS warning report — provide to TC\r\n- **Date of Hire must not match Date of Rehire** — if they match, request original DOH from client\r\n- Foreign addresses → TC\r\n- Duplicate SSNs → report to TC\r\n\r\n## Vendor Census Data\r\n\r\nIn some cases, vendor (prior RK) census data is used instead of client-provided data:\r\n\r\n- Client explicitly requests vendor data\r\n- A terminated participant has a balance coming over from the prior record keeper\r\n\r\nWhen using vendor data:\r\n1. Enroll participant using prior RK data\r\n2. **Notify client, COM, and TC prior to loading**\r\n\r\n## Adding Participants from Balance Files\r\n\r\nSometimes the balance file contains participants the client never put on the census. When that happens:\r\n\r\n- Reach out to the **client** to get the demographic details, even if the vendor file already has them\r\n- Vendor records can be stale — never assume they're current\r\n- Don't load until the client confirms; missing or wrong census data on a participant who has a balance is a clean-up nightmare later\r\n\r\nThis is also the moment to handle [[forfeiture-loading|forfeiture entries]] that show up in balance files — those get loaded as census-shaped records using the dummy date convention.\r\n\r\n## Queries\r\n\r\n- `TO Census.sql` — referenced query for census verification (exact path in source documentation)\r\n\r\n## Rules and Notes\r\n\r\n- Client test files may be used to load employees into the system\r\n- If DOH and DOR both exist with no Date of Term, do not request Date of Term\r\n- Always reconcile test files against live files when live is received\r\n- Specific error codes and resolutions not yet documented\r\n\r\n## Related Concepts\r\n\r\n- [[base-file]] — the census template DC sends to the client to collect this data\r\n- [[processes/eligibility-loading|loading-eligibility-eds]] — eligibility is loaded after census is in the system\r\n- [[loading-basis-eds]] — basis loaded during final files processing\r\n- [[prior-record-keeper]] — source of vendor census data when applicable\r\n- [[eds]] — the system used to validate and load census data\r\n\r\n## See Also\r\n\r\n- [[base-file]]\r\n- [[limited-access-file]]\r\n- [[defaulting-elections-eds]]\r\n- [[forfeiture-loading]]\r\n- [[eds]]\r\n- [[awd]]\r\n- [[prior-record-keeper]]\r\n- [[final-files-processing]]\r\n- [[processes/eligibility-loading|loading-eligibility-eds]]\r\n- [[loading-basis-eds]]"},{"id":"troubleshooting/common-remitter-plans","slug":"common-remitter-plans","rel":"troubleshooting/common-remitter-plans.md","namespace":"troubleshooting","title":"Common Remitter Plans","summary":"Plans coded as \"common remitter\" in P3 use a different Day of Wire processing flow than standard plans — the standard Pre-Process option is not available in the Remit Action dropdown, and a Verify Batch process must be used instead.","updated":"2026-04-15","created":"2026-04-15","sources":1,"status":"current","tags":["remitter","day-of-wire","p3","processing","conversion"],"type":"troubleshooting","extras":[],"media":[],"meta":{"title":"Common Remitter Plans","type":"troubleshooting","tags":["remitter","day-of-wire","p3","processing","conversion"],"created":"2026-04-15","updated":"2026-04-15","sources":1,"status":"current"},"markdown":"# Common Remitter Plans\n\nPlans coded as \"common remitter\" in P3 use a different Day of Wire processing flow than standard plans — the standard Pre-Process option is not available in the Remit Action dropdown, and a Verify Batch process must be used instead.\n\n## Definition\n\nA \"common remitter\" plan is a plan configuration in P3 that affects how remittances are processed. The standard **Pre-Process** option in the Remit Action column of the Remittance screen is absent for these plans. If a DC does not know a plan is a common remitter, they will encounter this missing option on Day of Wire and may not know what to do.\n\n## Why It Matters\n\nOn liquidation day, every trans ref number must be taken off hold and processed before trading can proceed. For common remitter plans, the standard workflow does not apply. Using the wrong flow will cause processing to stall or fail.\n\n## Day of Wire Process for Common Remitter Plans\n\n### Step 1 — Identify that standard Pre-Process is absent\nWhen opening the Remittance screen in P3 and reviewing the **Remit Action** column dropdown, if the **Pre-Process** option does not appear, the plan is likely coded as common remitter.\n\n### Step 2 — Use \"Verify Batch After Funding\"\nFor each Day of Wire trans ref:\n1. Select **\"Verify Batch After Funding\"** from the Remit Action dropdown\n2. Click **Submit** at the bottom of the screen\n\n### Step 3 — Wait for results\nAfter submitting:\n1. Wait a short period\n2. Click the **\"Verify Batch Results\"** link at the bottom of the page (next to Submit)\n3. If the full list of trans refs does not appear yet, wait a few more minutes and click again\n\n### Step 4 — Set NO HOLD + Process Immediate\nOnce the full list of Day of Wire trans refs appears:\n1. For each trans ref: select **NO HOLD** under the \"Processing Status\" column\n2. Check the box under the **\"Process Immediate\"** column\n3. Do this for all Day of Wire trans refs, then click **Submit**\n\n### Step 5 — Proceed normally\nAfter submission, continue with the normal det_rem SQL verification process as with any standard Day of Wire.\n\n## Evidence / Examples\n\nFrom the DC Training Notebook (November 19, 2025):\n\n> \"When processing Day of Wire assets on plans coded as 'common remitter' the Remittance screen in P3 will not have the standard Pre-Process option from the 'Remit Action' column drop down.\"\n\n## Related Concepts\n\n- [[liquidation-day]] — full Day of Wire workflow\n- [[p3]] — the system where this processing occurs\n- [[conversion-types]] — cash, mapping, and TIK distinctions\n\n## See Also\n\n- [[liquidation-day]]\n- [[p3]]\n- [[conversion-types]]\n- [[roles/lm-dc]]\n- [[dc-onboarding-workflow]]"},{"id":"coordination/com","slug":"com","rel":"coordination/com.md","namespace":"coordination","title":"Communications Coordinator (COM)","summary":"The project manager for every plan conversion and the DC's route to the client — anything that needs to reach the client, or come from the client, goes through COM.","updated":"2026-07-08","created":"2026-04-14","sources":2,"status":"current","tags":["role","com","project-management","conversion","onboarding"],"type":"coordination","extras":[],"media":[],"meta":{"title":"Communications Coordinator (COM)","type":"coordination","tags":["role","com","project-management","conversion","onboarding"],"created":"2026-04-14","updated":"2026-07-08","sources":2,"status":"current"},"markdown":"# Communications Coordinator (COM)\n\nThe project manager for every plan conversion and the DC's route to the client — anything that needs to reach the client, or come from the client, goes through COM.\n\n## What they own\n\n- The conversion project plan, meeting cadence, and overall timeline (uploaded to [[nbi]])\n- All client-facing communication: notices, letters, approvals, go-live email\n- Routing approvals and documents between the client and internal teams\n- The client review/approval loop for anything the DC needs signed off externally\n\n## What you hand them\n\n- **Fund mapping and source mapping documents** — COM routes them to [[qa]] and [[tc]] for approval and returns the approval to you\n- **Early access file template** — when COM requests it; COM routes it to the client and returns the completed file for you to load. Confirm to COM once loaded (COM then tells TC to activate)\n- **Asset receipt confirmation** — on liquidation day, confirm to COM that assets were received and deposited, with the amount. COM emails the client the same day, so don't sit on it\n- **Payroll test status** — pass/fail on vendor test files as COM coordinates the payroll calls\n\n## What they hand you\n\n- **Project plan** — at kickoff, alongside your NBI assignment\n- **PRD or onboarding package** — plan provisions (eligibility, vesting, sources, classes) you need before specs\n- **Completed payroll questionnaire** — COM sends it to the client and forwards the completed copy to you; you can't start payroll setup without it\n- **Mapping approvals** — returned from QA/TC via COM\n- **Completed early access file** — from the client, for you to load\n\n## When to contact them / escalation\n\n- Anything that needs client action or a client answer — never go to the client directly\n- Timeline slippage: COM owns the schedule and is the first escalation for a conversion running behind\n- On liquidation day, stay in active contact so the asset-received email goes out promptly\n\n## Common issues\n\n- Client is slow returning the payroll questionnaire or early access file — flag to COM early; they chase the client\n- Mapping approval stalls because COM hasn't routed it — follow up; a delay here compresses source mapping and CONV file prep\n- COM has many parallel workstreams (notices, plan documents, vendor forms) that don't touch you — if a request isn't about data, mapping, payroll, early access, or assets, it's probably not yours\n\n## See Also\n\n- [[plan-conversion-handoffs]]\n- [[roles/lm-dc]]\n- [[tc]]\n- [[qa]]\n- Early Access\n- [[fund-mapping]]\n- [[source-mapping]]"},{"id":"conversion-ops/conv-file","slug":"conv-file","rel":"conversion-ops/conv-file.md","namespace":"conversion-ops","title":"CONV File","summary":"The input file for the Informatica Day of Wire workflow. Built in advance as a skeleton; fund totals and transfer reference numbers are filled in on liquidation day.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["conv-file","informatica","liquidation","day-of-wire","mapping","tik"],"type":"conversion-ops","extras":[],"media":[{"id":"fig-1","caption":"CONV file in spreadsheet form — one row per fund, ReReg column drives Informatica behavior.","src":"SS/CONV File.jpg","type":"screenshot"}],"meta":{"title":"CONV File","type":"conversion-ops","tags":["conv-file","informatica","liquidation","day-of-wire","mapping","tik"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# CONV File\n\nThe input file for the Informatica Day of Wire workflow. Built in advance as a skeleton; fund totals and transfer reference numbers are filled in on liquidation day.\n\n## Overview\n\nThe CONV file is the structured data file that drives the [[informatica]] Day of Wire workflow on liquidation day. It contains one row per fund being transferred, with all information Informatica needs to create the correct transaction records in [[p3]]. The skeleton (fund list, codes, re-reg indicators) is prepared well in advance; only the amounts and ref numbers are added on the day.\n\n## Structure\n\n| Field | Description |\n|-------|-------------|\n| Case Number | Plan case number |\n| Prior Fund Code | Prior vendor's fund identifier |\n| TA Fund Code | TransAmerica fund identifier |\n| Ref Number | Transfer reference number — created in [[p2]] on liquidation day |\n| Amount | Total dollar amount for this fund — filled in from vendor breakdown on liquidation day |\n| ReReg | Y = Transfer In Kind; N = Mapping |\n\n![CONV file in spreadsheet form — one row per fund, ReReg column drives Informatica behavior.](SS/CONV File.jpg)\n\n## ReReg Field Logic\n\n| Value | Meaning | Informatica Behavior |\n|-------|---------|---------------------|\n| N | Fund is being liquidated and mapped | Books to [[dummy-participant]] account; trades go out |\n| Y | Fund is being transferred in kind | Creates placeholder in Bill Remit; no trades |\n\nA single CONV file can contain both Y and N rows — mixed plans (some funds TIK, some mapping) are handled per-fund within the same file.\n\n## Relationship to CIT Balance File\n\n| | CONV File | CIT Balance File |\n|--|-----------|-----------------|\n| Used in | Day of Wire workflow | Participant Balance workflow |\n| Granularity | One row per **fund** | One row per **participant per source per fund** |\n| Built | In advance (skeleton); totals added day-of | From final files after liquidation |\n| Testable | **No** — runs live only | Yes — test run available |\n\n## Preparation Timeline\n\n1. **After fund and source mapping are approved:** Build the CONV file skeleton — fund list, prior and TA codes, re-reg indicators. Leave Amount and Ref Number blank.\n2. **On liquidation day:** Create ref numbers in [[p2]] → fill them in. Receive vendor fund breakdown → fill in Amounts per fund.\n3. **Before running:** Verify all fields are complete and the sum of Amounts matches the wire total confirmed by [[cashiering]].\n\n## Critical Warning\n\n> The Day of Wire workflow **cannot be tested**. Once you import the CONV file and run the workflow, it is live and real. Triple-check every field before importing.\n\nThe only mode available before production is a debug/preview — it is not a full test run.\n\n## Cash Conversion Exception\n\nCash conversions do not use a CONV file. Money goes to the [[advanced-employer]] account directly. The CONV file is only used for mapping and TIK conversions.\n\n## See Also\n\n- [[informatica]]\n- [[liquidation-day]]\n- [[p2]]\n- [[fund-mapping]]\n- [[source-mapping]]\n- [[dummy-participant]]\n- [[processes/tik-transfer|transfer-in-kind]]\n- [[conversion-types]]\n- [[advanced-employer]]"},{"id":"conversion-ops/conversion-types","slug":"conversion-types","rel":"conversion-ops/conversion-types.md","namespace":"conversion-ops","title":"Conversion Types","summary":"The three ways a plan's assets can be moved from a prior record keeper to TransAmerica. Conversion type is determined early in discovery and drives nearly every subsequent decision.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["conversion","cash","mapping","transfer-in-kind","core"],"type":"conversion-ops","extras":[],"media":[],"meta":{"title":"Conversion Types","type":"conversion-ops","tags":["conversion","cash","mapping","transfer-in-kind","core"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# Conversion Types\n\nThe three ways a plan's assets can be moved from a prior record keeper to TransAmerica. Conversion type is determined early in discovery and drives nearly every subsequent decision.\n\n## The Three Types\n\n### 1. Cash Conversion\n\n**What it is:** All assets at the prior record keeper are liquidated (sold) and the resulting cash is wired to TransAmerica. Money is pooled and then distributed to participants based on their current investment elections.\n\n**Key characteristics:**\n- No fund mapping — assets arrive as cash, not as specific funds\n- Participants' money is re-invested based on their current elections\n- TOA will show no \"from → to\" fund mapping\n- Simplest conversion type from a mapping standpoint\n\n**Processing flow:**\n1. Wire arrives → Cashiering confirms + provides ref number\n2. DC verifies wire total matches breakdown\n3. DC moves money to **Advanced Employer account** (temp holding)\n4. Final files arrive → DC liquidates advanced employer → runs CIT balance workflow → posts participant balances\n5. Process mode: **Immediate + Batch** (trades go out to invest the cash)\n6. Reverse dummy participant via ROC tool\n\n---\n\n### 2. Mapping Conversion\n\n**What it is:** Each fund at the prior record keeper is mapped to a specific fund at TransAmerica. Assets are liquidated and re-invested into the mapped destination funds.\n\n**Key characteristics:**\n- Fund mapping is required — defined in [[toa]]\n- All funds liquidated and invested into mapped equivalents\n- More complex than cash; simpler than TIK\n- [[dummy-participant]] (SSN 999-00-00) required in census\n\n**Processing flow:**\n1. Wire arrives → totals match → create trans ref numbers\n2. Fill CONV file (re-reg = N) → run Day of Wire workflow in [[informatica]]\n3. Dummy account receives initial booking; trades go out\n4. Final files arrive → post participant balances\n5. Reverse dummy → process P3: **Online + No Hold** (no new trades — trades already went out)\n\n**Important:** Trades go out during the Day of Wire step. When posting participant balances later, do NOT send trades again. Use Online + No Hold.\n\n---\n\n### 3. Transfer In Kind (TIK / Re-registration)\n\n**What it is:** Specific funds are transferred directly as shares — no liquidation, no re-purchase. Shares are moved from one custodian (prior RK's custodian) to TransAmerica's custodian (Fidelity pooled accounts).\n\n**Key characteristics:**\n- Only applies to specific funds (identified in [[toa]], column T = \"Y\")\n- A plan may have SOME funds TIK and SOME funds mapping/cash\n- No trades occur — shares are physically moved\n- Matt O'Connell's team must set up Fidelity accounts in advance (~10 business days)\n- Shares are identified by expected amounts (not account numbers)\n\n**Processing flow:**\n1. TOA identifies TIK funds (column T = Y) → DC fills re-registration form → sends to Matt O'Connell\n2. Matt's team sets up Fidelity pooled accounts\n3. Day of Wire: CONV file (re-reg = Y) → creates placeholder in P3 (no details, no trades)\n4. Shares arrive at Fidelity → Matt's team identifies them by expected amounts → pulls into plan\n5. Final files arrive → DC updates share estimates → posts participant balances\n6. Process mode: **Online + No Hold** (no trades — shares already transferred)\n\n---\n\n## Side-by-Side Comparison\n\n| Attribute                 | Cash                  | Mapping         | Transfer In Kind    |\n| ------------------------- | --------------------- | --------------- | ------------------- |\n| Assets liquidated         | Yes                   | Yes             | No                  |\n| Fund mapping required     | No                    | Yes             | Yes (for TIK funds) |\n| TOA fund map              | No                    | Yes             | Yes (column T = Y)  |\n| Trades on Day of Wire     | No (to adv. employer) | Yes (via dummy) | No                  |\n| Trades on balance posting | Yes                   | No              | No                  |\n| Dummy participant needed  | Yes                   | Yes             | No                  |\n| Matt O'Connell involved   | No                    | No              | Yes                 |\n| CONV file re-reg field    | N/A                   | N               | Y                   |\n| Advanced Employer used    | Yes                   | No              | No                  |\n| Fidelity pooled accounts  | No                    | No              | Yes                 |\n\n> A single plan can have a combination: some funds TIK, others mapping, others cash. The CONV file handles this per-fund.\n\n## Determining Conversion Type\n\n- Identified during discovery (PRD/onboarding package review)\n- Confirmed in the [[toa]] (TOA structure reveals the conversion strategy)\n- [[subpack]] should also specify it\n\n## See Also\n\n- [[toa]]\n- [[fund-mapping]]\n- [[liquidation-day]]\n- [[final-files-processing]]\n- [[dummy-participant]]\n- [[processes/tik-transfer|transfer-in-kind]]\n- Matt O'Connell\n- [[informatica]]"},{"id":"vendors/creative-planning","slug":"creative-planning","rel":"vendors/creative-planning.md","namespace":"vendors","title":"Creative Planning","summary":"Creative Planning is a TPA relationship — first determine whether payroll actually runs through Creative Planning or through the underlying payroll vendor (most often UKG).","updated":"2026-07-08","created":"2026-07-08","sources":1,"status":"active","tags":["vendor","payroll"],"type":"vendor","extras":[],"media":[],"meta":{"title":"Creative Planning","type":"vendor","tags":["vendor","payroll"],"created":"2026-07-08","updated":"2026-07-08","sources":1,"status":"active"},"markdown":"# Creative Planning\n\nCreative Planning is a TPA relationship — first determine whether payroll actually runs through Creative Planning or through the underlying payroll vendor (most often UKG).\n\n## Routing & file format\n\n- When payroll goes through Creative Planning, outbound files generally use the 1116 layout.\n- Global SFTP for incoming and outgoing files is named CREATIVEPLANNING-LM.\n- The global connection is generally used when Kelly Alves is assigned on the Creative Planning side for payroll.\n- Some plans still work directly with the payroll vendor — use transition emails and early calls to confirm whether this is global Creative Planning or a separate vendor setup.\n\n## See Also\n\n- [[payroll-vendor-onboarding]]\n- [[ftp-connection]]\n- [[payroll-template]]"},{"id":"reference/creative-planning-managed-accounts","slug":"creative-planning-managed-accounts","rel":"reference/creative-planning-managed-accounts.md","namespace":"reference","title":"Creative Planning Managed Accounts","summary":"Plan setup and participant-service pattern for Financial Guide / Creative Planning Managed Accounts.","updated":"2026-05-13","created":"2026-05-13","sources":1,"status":"needs-review","tags":["concept","cpma","financial-guide","managed-advice","p3","plan-setup"],"type":"reference","extras":[],"media":[],"meta":{"title":"Creative Planning Managed Accounts","type":"reference","tags":["concept","cpma","financial-guide","managed-advice","p3","plan-setup"],"created":"2026-05-13","updated":"2026-05-13","sources":1,"status":"needs-review"},"markdown":"# Creative Planning Managed Accounts\n\nPlan setup and participant-service pattern for Financial Guide / Creative Planning Managed Accounts.\n\n## Definition\n\nCreative Planning Managed Accounts (CPMA) is a fee-based managed account service connected to Financial Guide. In setup materials, enabling Financial Guide controls the participant SSO link and related participant communications.\n\n> [!warning] Source status\n> This page is built from legacy setup and case note material. Confirm current CPMA service rules, fee setup, and participant communication requirements before live use.\n\n## Why It Matters\n\nCPMA touches plan setup, fees, funds, participant communications, default allocations, DDOL/VRU access, case notes, and call center routing. It can also conflict with other services, especially OnTrack.\n\n## Evidence / Examples\n\n### Pre-Setup Requirement\n\n- Before P3 setup, the account and contract must exist in Salesforce.\n- The contract should show the CPMA connection.\n- The `services assigned` field should include `3PMA`.\n- Advisor Firm should be Creative Planning, LLC.\n- TRSC IM Asset Allocation Services should confirm the setup.\n\n### Funds Tab\n\n- CPMA uses service-exclusive funds.\n- To add a service-exclusive fund, the SEF indicator is checked when searching by fund descriptor.\n\n### Plan Service Expense Tab\n\n- CPMA requires two fee portions:\n  - Total fee for CPMA.\n  - Portion paid to Creative Planning, LLC.\n- Fees are applied to all funds used for the service.\n- Source fields include `VAC - Creative Planning Managed Accounts`, third-party BPS, total basis points, start date, and blank end date.\n\n### Default Allocation\n\n- For plans using CPMA as default, default allocation type is Financial Guide.\n- Source type uses all employee-directed source groups.\n- Effective date uses the service effective date.\n- QDIA is set to Yes if CPMA is used as QDIA.\n\n### DDOL/VRU\n\n- Financial Guide is enabled or temporarily enabled on the DDOL/VRU tab.\n- Enabling Financial Guide controls the SSO link to the Financial Guide site.\n- OnTrack cannot be turned on with Financial Guide/CPMA; OnTrack access codes should be Not Enabled.\n- IRA handling codes should be Not Enabled.\n- Third Party Referral should be Enabled.\n\n## Related Concepts\n\n- [[case-notes-template]]\n- [[go-live-checklist]]\n- Managed Advice\n- [[p3]]\n- [[wx]]\n\n## See Also\n\n- [[tc-stuff]]\n- [[tc]]\n- [[qa]]"},{"id":"glossary/csr","slug":"csr","rel":"glossary/csr.md","namespace":"glossary","title":"CSR","summary":"**Full Name:** Conversion Summary Report","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["glossary","acronym","com","qa","go-live"],"type":"glossary","extras":[],"media":[],"meta":{"title":"CSR","type":"glossary","tags":["glossary","acronym","com","qa","go-live"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# CSR\n\n**Full Name:** Conversion Summary Report\n\n**Definition:** A post-conversion report produced by the Quality Consultant at go-live. The [[roles/com]] receives it and forwards it to the client as a formal summary of the completed conversion.\n\n**Used By:** Quality Consultant (produces it); COM (routes it to client).\n\n## See Also\n\n- [[concepts/csr]] — concept page with workflow detail\n- [[roles/com]]\n- [[qa]]"},{"id":"vendors/datamoov","slug":"datamoov","rel":"vendors/datamoov.md","namespace":"vendors","title":"Datamoov","summary":"Datamoov large-market work is different from Paystart mid-market — be specific about market, template, naming, and SFTP route.","updated":"2026-07-08","created":"2026-07-08","sources":1,"status":"active","tags":["vendor","payroll"],"type":"vendor","extras":[],"media":[],"meta":{"title":"Datamoov","type":"vendor","tags":["vendor","payroll"],"created":"2026-07-08","updated":"2026-07-08","sources":1,"status":"active"},"markdown":"# Datamoov\n\nDatamoov large-market work is different from Paystart mid-market — be specific about market, template, naming, and SFTP route.\n\n## File format & naming\n\n- Large-market incoming uses the standard large-market specifications, not the Paystart mid-market format. Incoming files require testing.\n- Test filename: `Plan number_affiliate_TEST.csv` or `.txt` (e.g. `QK63283_00061_TEST.csv`).\n- Production filename: `Plan number_affiliate.csv` or `.txt` (e.g. `QK63283_00061.csv`).\n- Outbound uses the 1116 format; no test files needed for outbound.\n- Outbound filename begins with `payrollvendorfeed` (e.g. `payrollvendorfeed_QK63283_061_MMDDYYYY.csv`).\n\n## Deduction & loan codes\n\n- Typical codes: 401K for pretax, 4ROTH for Roth, 401L for loans.\n- Catch-up or bonus deferrals may require additional codes.\n- Uses Transamerica loan numbers.\n\n## FTP & quirks\n\n- Incoming SFTP comes through the large-market global connection DETAMOOV-LM; submit the forwarding-rule request.\n- Outbound: the client opens a ticket with Datamoov to create SFTP on their platform and provide credentials; Transamerica pushes the outbound file to Datamoov.\n- The DETAMOOV-LM outbound folder should only be used for Munson plan TA080504/paygroup MUN — it was built before the move to 1116.\n- No PGP.\n\n## See Also\n\n- [[payroll-vendor-onboarding]]\n- [[ftp-connection]]\n- [[payroll-template]]"},{"id":"checklists/day-of-wire-audit","slug":"day-of-wire-audit","rel":"checklists/day-of-wire-audit.md","namespace":"checklists","title":"Day of Wire Audit","summary":"Validation pass for the high-risk checks the DC performs around day-of-wire processing.","updated":"2026-06-25","created":"2026-06-25","sources":2,"status":"needs-review","tags":["process","day-of-wire","audit","validation","balances"],"type":"checklist","extras":[],"media":[],"meta":{"title":"Day of Wire Audit","type":"checklist","tags":["process","day-of-wire","audit","validation","balances"],"created":"2026-06-25","updated":"2026-06-25","status":"needs-review","sources":2},"markdown":"# Day of Wire Audit\n\nValidation pass for the high-risk checks the DC performs around day-of-wire processing.\n\n## Overview\n\nThe day-of-wire audit is the control layer around [[liquidation-day]] and balance-import processing. It verifies that the money or shares are ready, the correct reference numbers exist, the right [[informatica]] workflow was run, and the resulting P3 detail is backed up before the process moves forward.\n\nThis page is a working reference built from existing wiki material. It should be tightened against the live DC checklist and query library when those sources are ingested.\n\n## Trigger\n\nUse this audit when a conversion reaches day-of-wire activity for:\n\n- [[balance-import-mapping]]\n- [[balance-import-tik]]\n- [[balance-import-cash]]\n- Any workflow that creates or applies transfer reference numbers on liquidation day\n\n## Audit Checks\n\n### 1. Confirm the Trigger\n\n- Cash or Mapping: confirm [[cashiering]] has booked the wire and provided the transfer reference number.\n- TIK: confirm shares have arrived or are ready to process through the TIK tracker.\n- Do not run the day-of-wire workflow from assumption alone.\n\n### 2. Confirm File Readiness\n\n- Verify the [[conv-file]] has the correct fund rows, amounts, and re-registration indicators.\n- Mapping rows should have `Re-Reg = N`.\n- TIK rows should have `Re-Reg = Y`.\n- Confirm the required [[dummy-participant]] exists for mapping conversions.\n\n### 3. Capture Informatica Evidence\n\n- Run the correct [[informatica]] workflow.\n- Remember that the Day of Wire workflow is production-only and cannot be test-run.\n- Save run output, counts, totals, errors, and any screenshots or logs required for backup.\n\n### 4. Validate P3 Posting Controls\n\n- Confirm the correct P3 processing mode for the conversion type.\n- Mapping: trades already fire on day-of-wire through the dummy participant.\n- TIK: use Online + No Hold later; do not use Process Immediate.\n- Cash: participant balance processing differs from Mapping/TIK and should follow the cash balance-import path.\n\n### 5. Run Balance Backup\n\n- Run the standard balance queries and compare counts, totals, sources, and fund detail.\n- Confirm the transfer reference numbers appear where expected.\n- Save query output with the conversion backup material.\n\n### 6. Hand Off Evidence\n\n- Add the audit evidence to the conversion backup package.\n- Use the output to support the [[audit-pack]] and downstream QA review.\n- Call out any mismatch before final-files processing continues.\n\n## Failure Modes\n\n| Risk | Why It Matters |\n|---|---|\n| Workflow run before wire/share confirmation | Creates live production activity before the trigger is real |\n| Wrong Re-Reg value | Mapping and TIK can process under the wrong transaction behavior |\n| Missing dummy participant | Mapping workflow cannot route the initial trade correctly |\n| Missing ref number evidence | Downstream backup cannot prove what was booked |\n| Incorrect P3 mode | Can create duplicate trades or wrong posting behavior |\n\n## See Also\n\n- [[liquidation-day]]\n- [[balance-import]]\n- [[balance-import-mapping]]\n- [[balance-import-tik]]\n- [[balance-import-cash]]\n- [[conv-file]]\n- [[informatica]]\n- [[p3]]\n- [[cashiering]]\n- [[audit-pack]]\n- [[final-files-processing]]"},{"id":"vendors/dayforce","slug":"dayforce","rel":"vendors/dayforce.md","namespace":"vendors","title":"Dayforce / Ceridian","summary":"Dayforce/Ceridian has enough helper-table and mapping nuance that it should be treated as a custom-path vendor until proven otherwise.","updated":"2026-07-08","created":"2026-07-08","sources":1,"status":"active","tags":["vendor","payroll"],"type":"vendor","extras":[],"media":[],"meta":{"title":"Dayforce / Ceridian","type":"vendor","tags":["vendor","payroll"],"created":"2026-07-08","updated":"2026-07-08","sources":1,"status":"active"},"markdown":"# Dayforce / Ceridian\n\nDayforce/Ceridian has enough helper-table and mapping nuance that it should be treated as a custom-path vendor until proven otherwise.\n\n## File format & naming\n\n- Outbound usually uses a custom Dayforce/Ceridian layout, though some cases can use the Transamerica standard format — confirm on the call.\n- The file is CSV, not XML.\n\n## Deduction & loan codes\n\n- Dayforce must provide deduction codes and loan codes (vendor loan codes).\n- If more than one loan is allowed, seed loan deduct_c with Dayforce codes.\n- Default effective dates: election effective date for deferrals, first loan repayment date for loans. Current date can also be sent if needed.\n\n## IDs & quirks\n\n- The Dayforce layout sends EE ID rather than SSN — make sure the inbound file to Transamerica includes that ID. Dayforce calls it EmployeeXrefCode.\n- Ask whether they use ExpressionCodeName and ExpressionValue; if yes, get the required Expression Code Name and mapping details up front.\n- When submitting the tech ticket in Jira, include \"Dayforce/Ceridian\" or \"Ceridian\" in the description because helper tables are labeled Ceridian.\n\n## FTP & PGP\n\n- Transamerica pushes files to Dayforce, so Dayforce must provide SFTP credentials.\n- Dayforce usually provides SFTP Test or Configure credentials during testing, then production credentials for go-live — ask for production credentials early.\n- PGP applies sometimes.\n\n## See Also\n\n- [[payroll-vendor-onboarding]]\n- [[ftp-connection]]\n- [[payroll-template]]"},{"id":"sources/dc-brain-dump-002","slug":"dc-brain-dump-002","rel":"sources/dc-brain-dump-002.md","namespace":"sources","title":"DC Brain Dump #002 — Payroll, Order of Processing, Loan Quirks, Auto-Enroll","summary":"Voice transcript follow-up to dc-brain-dump-001. Filling gaps and adding context. Original audio recorded by Joel; transcript saved at `new TA Brain/brain dump 2.txt`.","updated":"2026-05-03","created":"2026-05-03","sources":1,"status":"current","tags":["source","brain-dump","payroll","auto-enrollment","loans","sequencing"],"type":"source","extras":[],"media":[],"meta":{"title":"DC Brain Dump #002 — Payroll, Order of Processing, Loan Quirks, Auto-Enroll","type":"source","tags":["source","brain-dump","payroll","auto-enrollment","loans","sequencing"],"created":"2026-05-03","updated":"2026-05-03","status":"current","sources":1},"markdown":"# DC Brain Dump #002\n\nVoice transcript follow-up to [[dc-brain-dump-001]]. Filling gaps and adding context. Original audio recorded by Joel; transcript saved at `new TA Brain/brain dump 2.txt`.\n\n## What's Covered\n\n- The full payroll vendor onboarding flow (intro email through OnePayroll handoff and client demo)\n- The new operating model for the go-live payroll handoff (DC owns the bridge work; still passes off at live date regardless)\n- Order-of-processing rationale post-balance (balances → elections + loans → everything else, because payrolls can resume once those are settled)\n- Loan failure scenarios that come up in practice (frozen plans, refinances close to conversion, detail-vs-source off-by-one-payment)\n- Auto-enrollment depth (kit mail date, escalation stops at TA, default SSN list to client, the \"min or max-minus-one\" default-detection heuristic)\n- Wiki feature request — Tips & Tricks / community Resources section *(held out of ingest; tracked separately)*\n\n## Key Claims\n\n- Payroll vendor file naming convention: `\u003ccase#>_\u003ccontract>_\u003caffiliate>.xls` — timestamp gets appended on receipt for de-dup.\n- After FTP setup, immediately ask the vendor to send a random test file just to verify the connection works before real test files start flowing.\n- OnePayroll's import surfaces end-user-flavored warnings/errors that the internal DC import doesn't show — that's why their second pass is meaningful.\n- Auto-sweep / batch FTP processing isn't enabled until 2–3 good runs are observed.\n- The new model: DC does ALL the validation/bridge work themselves now (mid-market team isn't carrying it). DC still passes off at live date regardless of status.\n- Once balances + elections + loans are settled, payrolls can begin processing even before the plan is technically live. That's why those three are post-balance priorities.\n- Loan failure scenarios from the field: frozen plan with no re-amortization, recent incomplete refinance, detail report missing the last payment (off by ~one principal payment).\n- Auto-escalation does NOT continue at TA. Participants whose deferral was escalating at the prior RK will not auto-escalate post-conversion — they have to opt back in.\n- DC pulls a list of participants who *look* like they're in auto-enroll default (marked default + at min rate or max-minus-one) and sends to client so client can warn them.\n- ADP can't reliably report auto-enrollment dates *(reaffirmed; already documented)*.\n- Kit mail date drives the auto-escalation clock — must be requested as part of historical data.\n\n## Notable Quotes\n\n> \"Payroll really needs a big blowout here.\"\n\n> \"All the files have the case number underscore contract underscore affiliate. And then dot XLS or whatever. Time stamp comes in once the files actually do arrive, so there's never a duplicate.\"\n\n> \"We don't have to hold on to this until the very end, because some of these can go months after the live day. And we don't need to be handcuffed to these plans for that long.\"\n\n> \"The warnings and errors you get are different. The ones that are kind of built for the end user as opposed to an internal one.\"\n\n> \"Once those are done, even when the plan isn't live yet, the payrolls can begin to be getting processed.\"\n\n> \"The detail report was different than the source breakdown, and that's because one of those reports was inaccurate and did not include the last payment. So we're off by what really looked like one.\"\n\n> \"They may think that they're gonna be having their deferral rates escalate up to, say, 10%. But once they start with Transamerica, they will not. The escalation will cease.\"\n\n## Entities Mentioned\n\n- Jen Curtin — head of FTP team; vendor connection setup goes through her team\n- [[ftp-team]]\n- [[payroll-support]] — OnePayroll team; production-level deeper validation\n- ADP — re-mention of auto-enrollment date reporting limitation\n\n## Concepts Mentioned\n\n- [[payroll-template]]\n- [[ftp-connection]]\n- [[payroll-handoff-at-go-live]]\n- [[deferrals]]\n- [[eligibility]]\n- [[final-files-processing]]\n- [[loan-setup]]\n- [[advanced-employer]]\n- [[limited-access-file]]\n\n## See Also\n\n- [[dc-brain-dump-001]]\n- [[payroll-vendor-onboarding]]\n- [[kit-mail-date]]"},{"id":"sources/dc-brain-dump-001","slug":"dc-brain-dump-001","rel":"sources/dc-brain-dump-001.md","namespace":"sources","title":"DC Brain Dump 001 — Full Job Workflow","summary":"Voice transcript brain dump covering the complete end-to-end workflow of a Data Consultant (DC) at TransAmerica, from new plan assignment through final files posting.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["dc","workflow","retirement-plans","onboarding","conversion"],"type":"source","extras":[],"media":[],"meta":{"title":"DC Brain Dump 001 — Full Job Workflow","type":"source","tags":["dc","workflow","retirement-plans","onboarding","conversion"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# DC Brain Dump 001 — Full Job Workflow\r\n\r\nVoice transcript brain dump covering the complete end-to-end workflow of a Data Consultant (DC) at TransAmerica, from new plan assignment through final files posting.\r\n\r\n## Summary\r\n\r\nA DC handles all data-related work for onboarding new retirement plans. The workflow spans from initial assignment through liquidation day and final files posting. Three conversion types — cash, mapping, and transfer in kind — each have distinct processing paths. The DC coordinates with multiple internal teams and external vendors throughout.\r\n\r\n## Key Claims\r\n\r\n- DCs receive plan assignments via NBI, doled out by managers based on caseload and conversion type.\r\n- P3 system setup can happen before or after assignment; earlier is better for specs and details.\r\n- COMs (communications coordinators) manage project timelines and meetings; DCs attend external calls only when data topics are explicitly on the agenda.\r\n- PRDs or Onboarding Packages detail all plan provisions; DCs focus on eligibility, vesting, sources, and special strategies.\r\n- Sub-packs (submission packages) define exactly what TransAmerica will do; supposed to be completed by COMs but are inconsistently done.\r\n- Base files seed the system with participant census data; only include people with balances plus imminent eligibles.\r\n- Payroll templates mirror the base file census section (~75%) plus contribution/payroll details.\r\n- FTP connections for payroll vendors must be requested early due to FTP team's large caseload.\r\n- Prior record keeper contact is established early; questionnaire covers liquidity, TIK, and test file timelines.\r\n- TOA (Transfer of Assets) is the client-signed fund map; column T (re-registering Y/N) determines if TIK applies.\r\n- Fund mapping can be done as soon as TOA is available — no test files needed.\r\n- Source mapping requires test files to identify which sources actually have money.\r\n- Matt O'Connell's team sets up Fidelity accounts for TIK; takes ~10 business days; do NOT start too early (they begin reporting immediately).\r\n- Day-of-wire Informatica workflow cannot be tested; participant balance workflow can be tested.\r\n- Dummy participant (SSN 999-00-00) must exist in census before running day-of-wire for mapping plans.\r\n- Deferrals must be posted before eligibility to prevent auto-enrollment conflicts.\r\n- Eligibility requires internal notification to QA/TC/COM before enabling in P3.\r\n- EDS outputs (warnings/errors) must be carefully reviewed after every file upload.\r\n\r\n## Key Quotes\r\n\r\n> \"A single ingest may touch 10–20 wiki pages. That is expected and correct.\" *(from schema)*\r\n\r\n> \"We don't want to blow out the system with too many unnecessary people.\"\r\n\r\n> \"Too early is bad. As crazy as it sounds in this case here.\" *(re: Matt O'Connell's team timing)*\r\n\r\n> \"We can't test [day of wire], unfortunately. Not yet at least.\"\r\n\r\n> \"Deferrals first, then eligibility.\"\r\n\r\n## Entities Mentioned\r\n\r\n- Ellen Miller — manages plan assignment from NBI side\r\n- Matt O'Connell — leads TIK/re-registration Fidelity account setup\r\n- [[p3]] — main plan administration system\r\n- [[eds]] — file validation and processing system\r\n- [[informatica]] — ETL workflow tool\r\n- [[nbi]] — plan assignment tracking system\r\n-  — DC, COM, Doc Ops, QA, TC, Cashiering, FTP Team, Payroll Support\r\n\r\n## Concepts Mentioned\r\n\r\n- [[dc-onboarding-workflow]] — full end-to-end process\r\n- [[conversion-types]] — cash, mapping, transfer in kind\r\n- [[prd]] — Plan Review Document\r\n- [[onboarding-package]] — alternative to PRD (PEP plans etc.)\r\n- [[subpack]] — Submission Package\r\n- [[toa]] — Transfer of Assets\r\n- [[base-file]] — census seeding template\r\n- [[payroll-template]] — payroll file format\r\n- [[fund-mapping]] — mapping prior funds to TA funds\r\n- [[source-mapping]] — mapping prior sources to TA source IDs\r\n- [[processes/tik-transfer|transfer-in-kind]] — re-registration process\r\n- [[liquidation-day]] — the main event\r\n- [[final-files-processing]] — post-liquidation balance/data posting\r\n- [[eligibility-and-deferrals]] — enabling plan eligibility in P3\r\n- [[wire-instructions]] — sent to prior record keeper\r\n- [[ftp-connection]] — payroll vendor upload setup\r\n- [[prior-record-keeper]] — prior vendor coordination\r\n- [[dummy-participant]] — SSN 999-00-00, required for mapping conversions\r\n- [[plan-classes]] — class types and DC's limited role in managing them\r\n\r\n## Contradictions / Open Questions\r\n\r\n- Sub-pack completion is inconsistent — supposed to be COMs' responsibility but frequently not done. Unclear what current process is.\r\n- Wire instructions: using default P3 account vs. plan-specific account — money arrives either way but routes differently. Low severity but worth clarifying.\r\n- Whether DC/TIK dummy participant reversal logic applies the same way as mapping — needs clarification.\r\n- EDS layout setup timing — needs to be done before test files arrive but exact trigger is unclear.\r\n\r\n## See Also\r\n- [[dc-onboarding-workflow]]\r\n- [[conversion-types]]\r\n- [[liquidation-day]]"},{"id":"lifecycle/dc-onboarding-workflow","slug":"dc-onboarding-workflow","rel":"lifecycle/dc-onboarding-workflow.md","namespace":"lifecycle","title":"DC Onboarding Workflow","summary":"The complete end-to-end process a Data Consultant follows to onboard a new retirement plan, from assignment through final posting. This is the master reference page — every step links to a detailed concept page.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["workflow","process","master","conversion","onboarding"],"type":"lifecycle","extras":[],"media":[],"meta":{"title":"DC Onboarding Workflow","type":"lifecycle","tags":["workflow","process","master","conversion","onboarding"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# DC Onboarding Workflow\r\n\r\nThe complete end-to-end process a Data Consultant follows to onboard a new retirement plan, from assignment through final posting. This is the master reference page — every step links to a detailed concept page.\r\n\r\n## Phase Overview\r\n\r\n| Phase | Name | Key Deliverables |\r\n|-------|------|-----------------|\r\n| 1 | Assignment & Discovery | Plan on DC radar, P3 check, PRD/OB review |\r\n| 2 | Data Setup | Base file, payroll template, EDS layouts |\r\n| 3 | Vendor Coordination | Prior RK contact, payroll vendor, FTP setup |\r\n| 4 | Mapping & Documentation | TOA processing, fund mapping, source mapping |\r\n| 5 | Pre-Liquidation | CONV file prep, Matt O'Connell (TIK), final checks |\r\n| 6 | Liquidation Day | Day-of-wire workflow, money receipt |\r\n| 7 | Final Files & Posting | Balance posting, YTD data, deferrals, eligibility |\r\n\r\n---\r\n\r\n## Phase 1 — Assignment & Discovery\r\n\r\n**Trigger:** Ellen Miller notifies manager → manager assigns to DC → plan tagged in [[nbi]]\r\n\r\n### Steps\r\n- [ ] Confirm plan is assigned in NBI\r\n- [ ] Check if [[p3]] is already set up (may be done early for mergers/some new plans)\r\n- [ ] Note plan type: **new plan**, **merger**, or **startup** (startup = no prior record keeper)\r\n- [ ] Note [[conversion-types|conversion type]]: cash, mapping, or transfer in kind\r\n- [ ] Attend internal kickoff meetings set up by COM\r\n- [ ] Review [[prd]] (Plan Review Document) or [[onboarding-package]] — focus on: eligibility, vesting, sources, classes\r\n- [ ] Review [[subpack]] (Submission Package) if available — details what TA will do\r\n- [ ] Note any frozen sources, new sources, special strategies\r\n\r\n**External meetings:** Optional for DCs unless data topics (base file, payroll) are explicitly on agenda.\r\n\r\n---\r\n\r\n## Phase 2 — Data Setup\r\n\r\n**Prerequisite:** PRD/OB reviewed; plan size and conversion type understood\r\n\r\n### Steps\r\n- [ ] Build the **[[base-file]]** template — tailor to plan's specific fields (YTD comp, hours, eligibility dates, deferrals, sources)\r\n- [ ] Schedule meeting with client to walk through base file template\r\n- [ ] Collect base file from client (iterate until clean)\r\n- [ ] Build the **[[payroll-template]]** — similar to base file + contribution details\r\n- [ ] Share payroll template with client and payroll vendor\r\n- [ ] Set up all **[[eds|EDS]] layouts** early — before files arrive\r\n\r\n---\r\n\r\n## Phase 3 — Vendor Coordination\r\n\r\n**Two parallel tracks:** Prior record keeper + Payroll vendor\r\n\r\n### Prior Record Keeper Track\r\n- [ ] Identify prior RK contact\r\n- [ ] Send questionnaire (liquidity, TIK availability, test file timing)\r\n- [ ] Send [[wire-instructions]] as early as possible (use default account if P3 not set up yet)\r\n- [ ] Request test files\r\n- [ ] Resend updated wire instructions ~1 week before liquidation (once P3 is fully set up)\r\n\r\nSee [[prior-record-keeper]]\r\n\r\n### Payroll Vendor Track\r\n- [ ] Identify payroll upload contact\r\n- [ ] Set up **[[ftp-connection]]** — request from FTP team ASAP (large caseload)\r\n- [ ] Provide FTP credentials to payroll contact\r\n- [ ] Request test payroll file\r\n- [ ] Test file through [[eds|EDS]] — review output\r\n- [ ] Send clean file to [[payroll-support|Payroll Support Team]] for deeper validation\r\n- [ ] Iterate until green light\r\n\r\n> If automation isn't ready, client sends manual payroll files directly in the interim.\r\n\r\n---\r\n\r\n## Phase 4 — Mapping & Documentation\r\n\r\n**Trigger:** TOA (Transfer of Assets) signed by client\r\n\r\n### Steps\r\n- [ ] Review [[toa]] — note column T (re-registering Y/N) for each fund\r\n- [ ] If any fund has re-reg = Y → fill out re-registration form → send to Matt O'Connell (time accordingly — ~10 business days before liquidation)\r\n- [ ] Build **[[fund-mapping]]** template from TOA data — no test files needed\r\n- [ ] Send fund mapping to COM, TC, QA for approval\r\n- [ ] Once test files arrive: run source summaries → identify sources with money\r\n- [ ] Build **[[source-mapping]]** from AQT source ID query + test file source codes\r\n- [ ] Send source mapping to COM, TC, QA for approval\r\n- [ ] Get approvals on both mappings ASAP — do not delay\r\n\r\n---\r\n\r\n## Phase 5 — Pre-Liquidation Prep\r\n\r\n**Timing:** Days to weeks before liquidation date\r\n\r\n### Steps\r\n- [ ] Confirm [[dummy-participant]] (SSN 999-00-0000) exists in census (required for mapping conversions)\r\n- [ ] Build **CONV file** skeleton — structure and fund list ready; totals filled in on liquidation day\r\n- [ ] Update Matt O'Connell's share estimates using test files (for TIK)\r\n- [ ] Day before liquidation: email [[cashiering|Cashiering]] as wire heads-up\r\n- [ ] Day before liquidation: email prior RK to confirm everything on track\r\n\r\nSee [[liquidation-day]] for Day-of detail\r\n\r\n---\r\n\r\n## Phase 6 — Liquidation Day\r\n\r\n**The main event.** Sequence depends on [[conversion-types|conversion type]].\r\n\r\n### All Types\r\n- [ ] Email vendor in the morning for fund breakdown + total\r\n- [ ] Notify Cashiering when vendor confirms wire sent (with expected total)\r\n- [ ] Wait for Cashiering to confirm wire receipt + transfer reference number\r\n\r\n### Cash Conversion\r\n- [ ] Verify wire total matches breakdown total\r\n- [ ] Move money to **Advanced Employer account** (P2/P3)\r\n- [ ] Email all parties confirming wire received + posted to advanced employer\r\n\r\n### Mapping Conversion\r\n- [ ] Verify wire total matches breakdown total\r\n- [ ] Create trans ref numbers in P2/P3 (one per fund)\r\n- [ ] Fill totals into CONV file\r\n- [ ] Verify dummy participant exists in census\r\n- [ ] Run **Day of Wire** workflow in [[informatica]] (cannot test)\r\n- [ ] Verify in P3 — dummy account should have balances; trades out\r\n\r\n### Transfer In Kind\r\n- [ ] Same as mapping but CONV file has re-reg = Y\r\n- [ ] Day of Wire creates placeholders in P3 (no trades, no details yet)\r\n- [ ] Shares will arrive at Fidelity accounts (Matt O'Connell's team processes)\r\n\r\nSee [[liquidation-day]] for full detail\r\n\r\n---\r\n\r\n## Phase 7 — Final Files & Posting\r\n\r\n**Trigger:** Final files received from prior record keeper\r\n\r\n### Steps\r\n- [ ] Update Matt O'Connell's share estimates with final file totals (TIK — time-sensitive, do immediately)\r\n- [ ] Build CIT balance file from final files\r\n- [ ] Test CIT balance workflow in [[informatica]] (can test)\r\n- [ ] Run participant balance workflow\r\n\r\n### Cash Conversion\r\n- [ ] Request Advanced Employer liquidation\r\n- [ ] Run CIT balance workflow\r\n- [ ] Post participant balances (Process Immediate + Batch → trades go out)\r\n- [ ] Reverse dummy participant via ROC tool in P3\r\n\r\n### Mapping Conversion\r\n- [ ] Post participant balances (Online + No Hold → NO trades, books only)\r\n- [ ] Reverse dummy participant via ROC tool in P3\r\n\r\n### Transfer In Kind\r\n- [ ] Post participant balances (Online + No Hold → NO trades)\r\n- [ ] Shares already in place; books fill in Bill Remit detail\r\n\r\n### All Types — Final Data\r\n- [ ] Post **YTD contributions** by source\r\n- [ ] Post **YTD comp** and **prior year comp** if needed\r\n- [ ] Post **hours** (current and prior year) if applicable\r\n- [ ] Post **deferral elections** (post BEFORE eligibility)\r\n- [ ] Notify QA, TC, COM → wait for go-ahead\r\n- [ ] Enable **eligibility** in P3 (per contributing source only)\r\n- [ ] Run all queries and review results\r\n- [ ] Build audit pack\r\n- [ ] Update [[nbi]]\r\n\r\nSee [[final-files-processing]] and [[eligibility-and-deferrals]]\r\n\r\n---\r\n\r\n## Key Rules to Remember\r\n\r\n1. **FTP and prior RK contact → as early as possible.**\r\n2. **Fund mapping → as soon as TOA is signed.**\r\n3. **Source mapping → as soon as test files arrive.**\r\n4. **Matt O'Connell → not too early, not too late. Target: 12 business days before liquidation.**\r\n5. **Deferrals before eligibility — always.**\r\n6. **Day of Wire cannot be tested — triple-check CONV file.**\r\n7. **EDS output must be read after every upload.**\r\n8. **Dummy participant must exist in census before Day of Wire (mapping).**\r\n9. **Process mode: Immediate+Batch for trades; Online+No Hold when no trades.**\r\n\r\n## See Also\r\n\r\n- [[conversion-types]]\r\n- [[liquidation-day]]\r\n- [[final-files-processing]]\r\n- [[base-file]]\r\n- [[toa]]\r\n- [[fund-mapping]]\r\n- [[source-mapping]]\r\n- [[eligibility-and-deferrals]]\r\n- [[p3]]\r\n- [[informatica]]"},{"id":"data-loading/defaulting-elections-eds","slug":"defaulting-elections-eds","rel":"data-loading/defaulting-elections-eds.md","namespace":"data-loading","title":"Defaulting Elections via EDS","summary":"The technique for setting a participant's investment elections to the plan default, loaded through EDS as part of (or just after) the census load. Useful for limited-access plans, startup plans, and any plan where every participant comes in","updated":"2026-05-03","created":"2026-05-03","sources":1,"status":"current","tags":["eds","elections","defaults","census","conversion","auto-enrollment"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Defaulting Elections via EDS","type":"data-loading","tags":["eds","elections","defaults","census","conversion","auto-enrollment"],"created":"2026-05-03","updated":"2026-05-03","sources":1,"status":"current"},"markdown":"# Defaulting Elections via EDS\n\nThe technique for setting a participant's investment elections to the plan default, loaded through EDS as part of (or just after) the census load. Useful for limited-access plans, startup plans, and any plan where every participant comes in defaulted.\n\n## When to Use It\n\n- **Limited-access plans** where most or all participants haven't actively made elections\n- **Startup plans** where every participant comes in fresh with default elections\n- Plans where a known subset of participants needs to be defaulted at conversion (alongside others who have real elections)\n- Cleanup pass when the main map-elections load left a population without elections that need defaults\n\n> **Best practice:** do census load + defaulted elections in a **single pass**, not two. Splitting them into two parts is not recommended.\n\n## Row Layout\n\nSame EDS layout as map-elections, with three differences:\n\n| Field | Map-Elections Value | Default Value |\n|-------|---------------------|---------------|\n| Fund Descriptor | populated | **blank** |\n| Percentage | populated | **blank** |\n| Default flag | **N** | **D** |\n\nOne row per participant being defaulted. That's enough — the system applies the plan's default election rules from there.\n\n## Verifying the Result\n\nOutput is queryable via [[aqt]]. After the load, run a query against the elections table to confirm the defaulted population matches the expected count.\n\n## Reconciliation Discipline\n\nWhen mixing real elections and defaulted elections in the same plan, account for the full population explicitly:\n\n> \"150 participants in the plan. 140 have elections. 10 were defaulted. That's 150. Be explicit. Don't infer.\"\n\nDon't let the defaulted population be implied — call it out in the load summary so QA, COM, and TC can sign off without guessing.\n\n## Relationship to Auto-Enrollment\n\nDefaulting elections via EDS is a **manual, DC-driven** action — distinct from P3's automatic [[eligibility|auto-enrollment]] logic, which fires when [[eligibility]] is enabled and a participant has no election on file. Both can result in defaulted elections, but the EDS path is explicit and happens at conversion time; the auto-enrollment path is rule-driven and fires later.\n\nIf you default participants via EDS, the auto-enrollment logic sees their elections and skips them — which is usually what you want.\n\n## See Also\n\n- [[eds]]\n- [[census-data]]\n- [[deferrals]]\n- [[eligibility]]\n- [[eligibility-and-deferrals]]\n- [[limited-access-file]]\n- [[aqt]]"},{"id":"data-loading/deferrals","slug":"deferrals","rel":"data-loading/deferrals.md","namespace":"data-loading","title":"Deferral Processing","summary":"The process of loading participant contribution elections into P3 during the final files phase. More complex and exception-heavy than eligibility. Must be loaded and verified before eligibility is enabled.","updated":"2026-05-03","created":"2026-04-14","sources":4,"status":"current","tags":["deferrals","auto-enrollment","p3","processing","final-files","adp"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Deferral Processing","type":"data-loading","tags":["deferrals","auto-enrollment","p3","processing","final-files","adp"],"created":"2026-04-14","updated":"2026-05-03","sources":4,"status":"current"},"markdown":"# Deferral Processing\n\nThe process of loading participant contribution elections into P3 during the final files phase. More complex and exception-heavy than [[eligibility]]. Must be loaded and verified before eligibility is enabled.\n\n## Core Rule\n\n> **Deferrals fill the system state. Eligibility triggers system actions.**\n\nDeferrals define what elections are already in place. When eligibility runs, the system reads those elections before deciding whether to auto-enroll. If the state is wrong, the triggered actions will be wrong — and they're harder to unwind than eligibility errors.\n\n## What Deferrals Are\n\nPer-participant, per-source contribution elections:\n- **Deferral rate** — dollar amount or percentage\n- **Auto-enrollment start date (trigger date)** — when auto-enrollment began for each participant enrolled under default settings\n- One election per source the participant contributes to\n\n## Data Sources (Preferred Order)\n\n1. **Client data** — preferred; most accurate for auto-enrollment details\n2. **Vendor data** — acceptable for most elections; unreliable for auto-enroll dates (see ADP note below)\n3. **Payroll data** — sometimes required; especially useful when client payroll systems have current contribution rates\n\nThe client decides which source to use. Confirm this before final files arrive.\n\n## The Auto-Enrollment Problem\n\nThis is the most critical and error-prone part of deferral processing.\n\n### What You Need to Capture\n\nFor every participant who is enrolled under auto-enrollment defaults:\n- Their **current deferral rate**\n- Their **auto-enrollment start date** (the date they were initially defaulted in)\n\n### Why the Start Date Matters\n\nMany plans have **escalation logic** (also called auto-escalation or step-up):\n> Example: \"Automatically increase the deferral rate by 1% each year, up to a cap of 10%.\"\n\nTo apply escalation correctly, P3 needs to know when auto-enrollment began. Without the start date, the system can't calculate how many escalation steps have already occurred, and participants may end up at the wrong rate.\n\nThe specific date the system uses is the **[[kit-mail-date]]** — the date the auto-enrollment welcome kit was mailed to the participant. That's what drives the escalation clock. Request it as part of the historical data pull.\n\n### Auto-Escalation Stops at TA\n\nThis is a participant-experience gotcha worth knowing up front:\n\n> **TransAmerica does NOT auto-escalate.** Plans escalating at the prior record keeper will *not* continue escalating after conversion. If a participant wants their rate to keep going up, they have to opt back in themselves.\n\nA participant who was on a 1%-per-year step-up at the prior RK, expecting to land at 10% over time, will sit at their current rate forever post-conversion unless they manually change it.\n\n### Default-Participant SSN List to Client\n\nTo get ahead of complaints, the DC pulls the list of participants who *look* like they're in auto-enroll default and sends it to the client so the client can warn those participants directly.\n\nThe heuristic for \"looks like they're in default\":\n- Marked default in the deferral data, AND\n- Currently sitting at the **min rate** (likely never escalated) OR at **max minus one** (likely about to escalate one more time)\n\nThat's the population most likely to expect an escalation that won't come. Send the list to the client — they communicate to participants who actually care. Most won't even realize the difference, but the few who do have a legitimate gripe if they aren't told.\n\n> *\"There's a very, very low chance that any of them even will know what the hell you're talking about. And even lower chance that people who do know would even care... but if there's that one person who's expecting it and don't get it, well, then he's got a very good gripe. So we do it the right way. We always do it the right way.\"*\n\n### The ADP Problem\n\n> **ADP does NOT reliably provide auto-enrollment dates.**\n\nIf the prior record keeper is ADP, you cannot trust their data to include accurate auto-enrollment start dates. The only reliable source is the **client**.\n\n**What to do when ADP is the prior RK:**\n1. Identify all participants who are in the auto-enrollment default\n2. Request the auto-enrollment start dates from the **client** directly\n3. If the client cannot provide them: assume those participants are **NOT in auto-enrollment default** (conservative assumption — avoids incorrect escalation)\n4. Identify the impacted participants\n5. **Notify the client** so they can communicate the correct election to their participants manually\n\nThis is a known limitation. Don't wait on ADP to provide it — go to the client first.\n\n## Workflow\n\n1. **Load deferrals FIRST** — before any eligibility action\n2. **Identify auto-enrollment participants** — flag them separately\n3. **Capture deferral rate and auto-enroll start date** for each auto-enrolled participant\n4. **Handle ADP or missing start dates** per the process above\n5. **Load through [[eds]]** — check output for warnings/errors\n6. **Post to [[p3]]** and verify\n7. **Ensure all elections and auto-enroll data is correct** before proceeding\n8. **THEN proceed to [[eligibility]]** — only after deferrals are verified clean\n\n## What Can Go Wrong\n\n| Issue | Consequence | Recoverability |\n|-------|-------------|----------------|\n| Load eligibility before deferrals | Auto-enrollment fires and overwrites elections | Painful reversal — possible but messy |\n| Missing auto-enroll start dates | Escalation logic runs incorrectly; wrong rates over time | Requires correction and client communication |\n| Wrong deferral rates from vendor | Participants have incorrect elections in the new system | Discovered at next payroll; requires correction |\n| ADP auto-enroll date trusted | Incorrect or missing start dates propagate | Go to client, not ADP |\n\n> **Deferral errors are harder to unwind than eligibility errors. Prioritize accuracy upfront.**\n\n## Characteristics\n\n- **Data-driven and exception-heavy** — each plan has its own auto-enrollment rules, escalation logic, and vendor limitations\n- More complex than [[eligibility]] in practice\n- The difficulty is not the mechanics (loading through EDS is standard) — it's getting the right data, especially auto-enrollment dates\n\n## See Also\n\n- [[eligibility]] — must run after deferrals\n- [[eligibility-and-deferrals]] — overview of the relationship and sequence\n- [[kit-mail-date]] — the date that drives auto-escalation\n- [[final-files-processing]] — broader final files context\n- [[p3]] — where deferrals are posted\n- [[eds]] — how the deferral file is validated and loaded\n- [[prior-record-keeper]] — source of vendor data (including ADP limitations)\n- [[dc-onboarding-workflow]]"},{"id":"reference/divisions-and-affiliates","slug":"divisions-and-affiliates","rel":"reference/divisions-and-affiliates.md","namespace":"reference","title":"Divisions and Affiliates","summary":"Plan setup pattern for division tracking, divisional reporting, and multi-affiliate plan administration.","updated":"2026-05-13","created":"2026-05-13","sources":1,"status":"needs-review","tags":["concept","divisions","affiliates","p3","psd","participant-experience"],"type":"reference","extras":[],"media":[],"meta":{"title":"Divisions and Affiliates","type":"reference","tags":["concept","divisions","affiliates","p3","psd","participant-experience"],"created":"2026-05-13","updated":"2026-05-13","sources":1,"status":"needs-review"},"markdown":"# Divisions and Affiliates\n\nPlan setup pattern for division tracking, divisional reporting, and multi-affiliate plan administration.\n\n## Definition\n\nDivisions identify participant groups inside a plan. Affiliates can create separate accounts or related plan structures that affect participant experience, payroll, loans, distributions, reporting, and web access.\n\n## Why It Matters\n\nDivisions and affiliates look like setup details, but they change how participants experience the plan and how payroll, loans, distributions, statements, and reports behave. The source warns that multiple affiliates can create confusion and processing errors when participants move between affiliates or have balances in more than one affiliate.\n\n> [!warning] Source status\n> The procedure is legacy and references screenshots that are not included. Validate current P3/PSD screens before using the steps live.\n\n## Evidence / Examples\n\n### Adding Divisions\n\n- On the Divisions tab, indicators are set to Yes for statement divisions, enrollment divisions, non-plan-defined divisions, and EDS division validation.\n- Division number, name, and optional divisional contact are added.\n- Division numbers over four characters require customization through CTS Quality and may require a JIRA ticket.\n\n### Divisional Reporting in PSD\n\n- Enable division security in Plan Sponsor Website setup.\n- Confirm user-level division access through User Maintenance.\n- For outbound files, activate division/group reporting on the Outsourcing tab and assign divisions to group names.\n\n### Multiple Affiliate Risks\n\n- Participants may see mul
