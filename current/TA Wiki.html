n\n## Common issues\n\n- OnePayroll flags things EDS didn't — expected, not a sign your EDS run was wrong. Fix and rerun the full chain (vendor → EDS → OnePayroll)\n- Each failed pass costs a full vendor round-trip for a new test file — front-load your EDS iteration\n\n## See Also\n\n- [[payroll-vendor-onboarding]]\n- [[payroll-template]]\n- [[ftp-connection]]\n- [[ftp-team]]\n- [[eds]]"},{"id":"payroll/payroll-template","slug":"payroll-template","rel":"payroll/payroll-template.md","namespace":"payroll","title":"Payroll Template","summary":"The file format specification provided to clients and payroll vendors for ongoing payroll contribution uploads after conversion.","updated":"2026-07-08","created":"2026-04-14","sources":3,"status":"current","tags":["document","payroll","template","vendor","contributions"],"type":"payroll","extras":[],"media":[],"meta":{"title":"Payroll Template","type":"payroll","tags":["document","payroll","template","vendor","contributions"],"created":"2026-04-14","updated":"2026-07-08","sources":3,"status":"current"},"markdown":"# Payroll Template\r\n\r\nThe file format specification provided to clients and payroll vendors for ongoing payroll contribution uploads after conversion.\r\n\r\n## Overview\r\n\r\nThe payroll template defines exactly how payroll files must be structured to be accepted by TransAmerica's systems. It is shared with both the client (plan sponsor) and the payroll vendor simultaneously. Payroll vendors adjust their workflows to output files in this format.\r\n\r\n## Structure\r\n\r\n**First ~75%:** Identical to the [[base-file]] census section\r\n- Participant demographics\r\n- Status and eligibility info\r\n- Employee identifiers\r\n\r\n**Remaining ~25%:** Contribution and payroll-specific data\r\n- Contribution amounts by source (one column per source)\r\n- Loan payment amounts (if applicable)\r\n- Hours worked (if the plan tracks hours)\r\n- Compensation for the period\r\n- Payroll period start date\r\n- Payroll period end date\r\n- Check date\r\n\r\n## Setup Process\r\n\r\n1. DC builds payroll template in parallel with the base file (same meeting/timing)\r\n2. Shared with client and payroll vendor simultaneously\r\n3. Meeting with payroll vendor: vendor reviews template, asks questions, adjusts their output workflow\r\n4. DC requests a **test payroll file** from the vendor as soon as they're ready\r\n5. DC tests file through [[eds]] — reviews warnings and errors\r\n6. If issues: send feedback to vendor → new test file → repeat\r\n7. Clean file sent to [[payroll-support|Payroll Support Team]] for deeper validation\r\n8. Green light from Payroll Support → payroll setup complete\r\n\r\n> Full vendor-side narrative — intro email, kickoff meeting flow, OnePayroll handoff, client demo, auto-sweep timing — lives in [[payroll-vendor-onboarding]].\r\n\r\n## File Naming Convention\r\n\r\nEvery payroll file uploaded through FTP (or sent manually) must follow:\r\n\r\n```\r\n\u003ccase#>_\u003ccontract>_\u003caffiliate>.xls\r\n```\r\n\r\nThe system catches on the prefix — wrong name and the file isn't picked up. A timestamp gets appended automatically on receipt to prevent duplicates, so the sender only controls the prefix.\r\n\r\n## EDS Layout Dependency\r\n\r\nBefore testing any payroll file in EDS, the DC must set up the payroll file layout in EDS (\"P3 to EDS\" module). This should be done early — before test files arrive.\r\n\r\n## FTP Dependency\r\n\r\nOnce the payroll file format is approved, the payroll vendor needs a way to deliver files automatically. This is handled via the [[ftp-connection]]. The payroll vendor uploads to the FTP account; the system picks up the file and processes it.\r\n\r\n## Manual Payroll Filing (Interim)\r\n\r\nIf FTP automation isn't ready by conversion date, the client sends payroll files manually (secure transfer directly to TransAmerica). This interim state can sometimes last weeks or months.\r\n\r\n> Keep track of which plans are on manual payroll vs. automated FTP. Manual files require more active monitoring.\r\n\r\n## Field Validation Rules\r\n\r\nField-by-field checks used during test file review, current as of the 7/29/2025 LM DC process update (from the payroll/OBF knowledge-transfer guide). Walk each field on the incoming test file against these.\r\n\r\n### Identifiers and demographics\r\n\r\n- **SSN** — no missing SSNs, no duplicates; watch for dummy patterns like 111-11-1111.\r\n- **Division / Location Code** — must be 4-digit (numbers or alpha). Ask the client what group each division represents. Codes must be set up on the system before any data load — pass to TC for setup.\r\n- **Class Code** — no missing codes; question any that don't match plan provisions.\r\n- **First / Last Name** — 30-character limit each, present for everyone. Over-limit names get cut off on mailings — flag to client.\r\n- **Middle Initial** — only the first letter loads; tell the client if they send full middle names.\r\n- **Birth Date** — no missing dates; question anyone under 18.\r\n- **Gender** — M or F only; blanks fine if unknown.\r\n- **Marital Status** — S, M, D, or W only. Confirm it's true marital status, not tax filing status.\r\n\r\n### Dates\r\n\r\n- **Hire Date** — present for everyone; use original hire date in most cases (legacy mergers sometimes loaded adjusted service date here).\r\n- **Termination Date** — must be a true termination, not a transfer date. Once reported on a file, the client must keep reporting it on every subsequent file or the system loses it.\r\n- **Payroll Period Start/End and Paycheck Date** — required, in an accepted date format.\r\n\r\n### Address and contact\r\n\r\n- **Address** — home address, not work. Missing is loadable but flag it in review. State is 2-letter; zip required except international.\r\n- **Phone numbers** — uniform format across all rows. No 1+ prefix, no extensions, no separated area code. Acceptable: `(319)123-0000` or `3191230000`.\r\n- **Email** — personal preferred, company works; EDS flags unacceptable extensions.\r\n\r\n### Codes and indicators\r\n\r\n- **Payroll Frequency** — TA format only: `12` = monthly, `24` = semi-monthly, `26` = semi-weekly, `52` = weekly.\r\n- **HCE code** — Y or N only. **Insider Investor Code** — 1, 2, or 3 only. **Language Code** — 00 or 01 only. **Termination Reason Code** — 0–3 only (whether required is set by the Outsourcing Checklist).\r\n- **Single Sign On ID** — required if the plan isn't using SSN or employee number.\r\n\r\n### Compensation and contributions\r\n\r\n> The most common error: **YTD instead of per-period reporting.** For every contribution and compensation field, confirm the value is per-period. If the client reports YTD by accident, every number is wrong.\r\n\r\n- **Current Plan Compensation** must be ≤ Gross Compensation. If the client reports the same value in both, confirm.\r\n- If compensation is required and hours are missing while comp is reported, EDS kicks out an error.\r\n- Date-field questions go to the **client**, not the payroll vendor — only the client can say \"date 6 is hire date.\"\r\n\r\n## Format and Template\r\n\r\n- **Standard TA template** — DC does not build from scratch. Trimmed and tailored per client details.\r\n- **Accepted formats:** All (CSV, Excel, fixed-width). Excel is preferred.\r\n- **Sources per template:** One to many. Practical limit is around 10 sources on one template.\r\n\r\n## Post-Conversion Source Changes\r\n\r\nAdding new sources to a payroll template after conversion is **not the DC's job**. Account Managers handle that.\r\n\r\n## Multiple Payroll Vendors\r\n\r\nIf a plan has multiple payroll vendors: DC handles it \"as best as we can\" — no single standard process.\r\n\r\n## See Also\r\n\r\n- [[payroll-vendor-onboarding]]\r\n- [[base-file]]\r\n- [[ftp-connection]]\r\n- [[eds]]\r\n- [[source-mapping]]\r\n- [[dc-onboarding-workflow]]"},{"id":"payroll/payroll-vendor-onboarding","slug":"payroll-vendor-onboarding","rel":"payroll/payroll-vendor-onboarding.md","namespace":"payroll","title":"Payroll Vendor Onboarding","summary":"The full vendor-side payroll work that happens before FTP automation is live and before the go-live handoff. Covers the moment the prior payroll vendor enters the picture all the way through the client's first successful manual upload.","updated":"2026-07-08","created":"2026-05-03","sources":1,"status":"current","tags":["payroll","vendor","onboarding","ftp","eds","onepayroll","demo","conversion"],"type":"payroll","extras":[],"media":[],"meta":{"title":"Payroll Vendor Onboarding","type":"payroll","tags":["payroll","vendor","onboarding","ftp","eds","onepayroll","demo","conversion"],"created":"2026-05-03","updated":"2026-07-08","sources":1,"status":"current"},"markdown":"# Payroll Vendor Onboarding\n\nThe full vendor-side payroll work that happens before FTP automation is live and before the go-live handoff. Covers the moment the prior payroll vendor enters the picture all the way through the client's first successful manual upload.\n\nThis page is the narrative spine. The supporting pages — [[payroll-template]] (the file spec), [[ftp-connection]] (the upload channel), [[payroll-support]] (OnePayroll validation), [[payroll-handoff-at-go-live]] (the live-date handoff) — each cover one piece in depth.\n\n## Overview\n\nOnce the conversion kicks off and the payroll vendor is identified, the DC has a parallel workstream to run alongside everything else: get the vendor producing files in TA's format, get those files validated, get the upload channel set up, and demo the upload flow to whoever on the client side will be running it. The goal is to be in good enough shape by go-live that the project can be passed off to Fiduciary Services regardless of how far testing got.\n\n## Phase 0 — Is payroll even yours?\n\nBefore assuming DC ownership, check NBI for the **payroll integration consultant (PIC)** field (from the payroll/OBF knowledge-transfer guide). The PIC team is being built to take payroll work off the DC plate. If a PIC is assigned, they may own inbound FTP, outbound FTP, the payroll questionnaire, WX setup, and One Payroll setup. Project plans are often copied from older plans and may not use the correct with-PIC or without-PIC version — confirm ownership directly when it matters.\n\nAlso confirm the **upload path** with the client before submitting anything:\n\n- **Path A — Manual upload.** Client uploads directly. Nothing to set up for transmission; the template is the deliverable.\n- **Path B — Automated FTP.** An SFTP connection or existing/global vendor route must be used. Confirm the source, contact ownership, and special handling before submitting — see [[ftp-connection]].\n\n## Phase 1 — Identify and contact\n\nAs soon as the conversion starts, find out two things:\n\n1. **Who at the payroll vendor will be the contact** for this plan\n2. **Who on the client side** will be uploading files — that person needs FTP credentials\n\nBoth pieces are upstream of everything else. Don't wait on either.\n\nConfirm three things about the contact before any setup request goes out (from the payroll/OBF knowledge-transfer guide):\n\n- **Who owns inbound** — the exact person and company responsible for sending payroll files to Transamerica (client, payroll vendor, or third-party integrator).\n- **Who owns outbound** — ask whether the same contact also owns files from Transamerica back to the vendor. If not, the client may need a separate vendor ticket.\n- **Special handling** — flag PGP encryption or true Excel files early; both need extra setup. Also check whether the named vendor routes through an existing/global connection or third-party integrator (see [[ftp-connection]]).\n\n### Vendor intro email\n\nSend the vendor contact an introductory email immediately. Standard wording (adjust to taste):\n\n```\n\u003cDC-INTRO-EMAIL-TEMPLATE>\n\nHi [Name],\n\nMy name is [DC Name] and I'm the Data Consultant for [Plan Name / Case #].\nI'll be your main point of contact for the payroll work during the\nconversion. I'd like to set up a meeting to walk through our payroll\nfile format and discuss how you'll be sending us files going forward.\n\nAre you available [proposed times]?\n\nThanks,\n[DC Name]\n```\n\n### FTP setup request — fire it off early\n\nOnce the upload contact is identified on the client side, fill out the FTP form and send it to Jen Curtin's [[ftp-team]]. **Don't sit on this.** That team has a backlog and setup takes real time. The earlier the request lands, the more breathing room you have.\n\nSee [[ftp-connection]] for the full setup process.\n\n## Phase 2 — Kickoff meeting with the vendor\n\nOnce the vendor responds, set up the kickoff meeting. Standard agenda:\n\n1. **Vendor shows what they're currently producing** — what their existing payroll file looks like, how they generate it, what their internal naming and delivery is\n2. **DC presents the TA payroll template** — share the [[payroll-template]] file\n3. **Field-by-field walkthrough** — explain each column, what it means, what's required, what's optional\n4. **Vendor takes it back** — they go re-tool their output workflow to match the template\n5. **Vendor returns with a test file** — sooner is better\n\nThis first meeting is the most important touchpoint. Make sure they understand the template, not just have a copy of it.\n\n## Phase 3 — Test the FTP connection (independent of test files)\n\nOnce the FTP team confirms the account is set up, **do not wait for the vendor's first real test file to validate the connection**. Ask the vendor (or whoever has the credentials) to send a random file — anything — just to confirm the upload works end-to-end.\n\nThe thing the system catches on is the **naming convention**:\n\n```\n\u003ccase#>_\u003ccontract>_\u003caffiliate>.xls\n```\n\nA timestamp gets appended automatically on receipt to prevent duplicates, but the prefix has to be correct or the file isn't picked up. A throwaway file with the right name proves the channel is working before you stake a real test file on it.\n\n## Phase 4 — Validation chain\n\nOnce real test files start coming in:\n\n```\nVendor test file\n   ↓\nDC validates through EDS  ← internal-flavored warnings/errors\n   ↓\nSend to OnePayroll (Payroll Support)\n   ↓\nOnePayroll runs production-level import  ← end-user-flavored warnings/errors\n   ↓\nIssues? → back to vendor, get a new test file, restart\nClean? → green light\n```\n\nThe reason OnePayroll is its own gate (and not just \"EDS again\"): the warnings and errors their import surfaces are the ones the client will see when they upload from the production environment. The internal DC import strips a lot of that. So even if EDS comes back clean, OnePayroll can still find things.\n\nSee [[payroll-support]] for what OnePayroll catches and how the back-and-forth works.\n\n### The LM DC ↔ MM review handoff\n\nInternal layout validation is a two-role handoff, current as of the 7/29/2025 LM DC process update (from the payroll/OBF knowledge-transfer guide). Neither role loads data during this step.\n\n**LM DC sends to MM:** case number and plan name, conversion date, One Payroll yes/no, the test payroll file plus Architect layouts file saved to the test folder, all contacts to include on feedback to the client, and any reviewer notes (who to address, who's just cc).\n\n**MM reviews and returns:**\n- Creates a `Review Payroll File_JT` folder and copies the test file + specs into it\n- Manual file review — if any field is marked TBD, it goes back to the LM DC\n- Notes pass/fail and comments on the Architect layouts\n- Creates EDS layouts in P3 — naming convention **Remit Layout** for every plan tested\n- Runs the file through the EDS validator (no data loaded); saves warning and error reports to the test folder\n- Returns feedback with layout + control totals (file sums vs. EDS sums), and saves review emails to the folder\n\nMM also forwards to One Payroll if applicable, and once One Payroll signs off, emails the client confirming all set — provided their totals match. Update NBI screens after review. Field-by-field validation rules live on [[payroll-template]].\n\n### Control totals\n\nRequest **control totals** up front — summary figures (hours, deferrals, match, loans) validated against every file. No totals = can't confirm the file is right. During the first live files, control totals are still required until Payroll Support confirms successful loads and turns on the automatic sweep into One Payroll. If a client says they sent a file and heard nothing, check whether the COM/account manager confirmed control totals.\n\n> [!warning] Request One Payroll testing before the first live file\n> Once the test file is signed off, send Payroll Support the file and layout name right away. If One Payroll testing isn't complete before the first live file arrives, Payroll Support may push back on loading it because they still need a test file. (from the payroll/OBF knowledge-transfer guide)\n\n### Manual email validation as the interim\n\nIf the FTP isn't live yet but the vendor wants validation, they can send the file as an email attachment directly to the DC. Validate it the same way (EDS → OnePayroll) and feed results back. Once FTP comes online, validate the next FTP-delivered file too — confirm both channels work.\n\n## Phase 5 — Client demo\n\nOnce a clean test file is through OnePayroll, demo the upload flow to whoever on the client side will be running uploads. Eventually the FTP will move to auto-sweep and the client doesn't have to log in at all, but **that's not the day-one state**. Day one, someone on the client team is uploading files manually through the upload page.\n\n`\u003cCLIENT-DEMO-WALKTHROUGH-LINK>`\n\nTalking points for the walkthrough meeting (from the payroll/OBF knowledge-transfer guide):\n\n1. Confirm upload method — manual portal or FTP — and that they know how to do it\n2. Walk through the file format briefly; don't deep-dive unless they have questions\n3. Explain control totals — what they are, which fields, how and when to send them (often new to clients)\n4. Set processing expectations — what happens after a file + totals are submitted, and turnaround\n5. Confirm their contact — who sends files and totals, and what happens if that person changes\n6. Leave room for Q&A\n\nCommon client misunderstandings to preempt: they think files process automatically without control totals; they send totals in the wrong format or forget them; they don't realize changing their payroll file format breaks the layout; they assume FTP users can be swapped without telling us.\n\n## Phase 6 — Auto-sweep / batch eligibility\n\nAuto-sweep (where the FTP folder is polled and files are processed automatically without anyone clicking upload) doesn't get enabled right away. The client/vendor needs to put together **2 or 3 good runs** before the channel is moved to batch processing. This typically happens well after go-live, often months out — and the DC isn't on the hook for it.\n\n## Phase 7 — Hand off at go-live (no matter where you are)\n\nThe current operating model is: at the live date, the project gets passed to Fiduciary Services regardless of how far testing got. See [[payroll-handoff-at-go-live]] for the formal procedure (FILESPECRQ AWD ticket + COM notifies AM).\n\nThe shift from prior practice: DC now does ALL the bridge validation work themselves (mid-market is no longer carrying the testing). DC still hands off cleanly at go-live. We don't stay handcuffed to the plan for months after live just to finish payroll.\n\n## Auto-enrollment carryover — two traps\n\nPlans converting with auto-enrollment in place carry two issues the DC needs to surface during onboarding, not after go-live.\n\n### Auto-escalation does not continue at TA\n\nParticipants whose deferral rate was auto-escalating at the prior record keeper will **not** keep escalating after conversion. The escalation ceases at TA — a participant expecting to climb to, say, 10% will stall at whatever rate they converted with unless they **opt back in**. This is a client-communication item: the client needs to know so participants can be told.\n\n### Finding the auto-enroll defaulters — the \"min or max-minus-one\" heuristic\n\nPrior-RK data often doesn't say cleanly who is sitting in the auto-enrollment default. The working heuristic: a participant flagged as default who is **at the plan's minimum rate, or at the maximum minus one**, probably got there via auto-enrollment rather than an active election. The DC pulls a list of participants (SSNs) who look like defaulters by this test and **sends it to the client** so the client can warn them about the escalation stopping.\n\nRelated: the **kit mail date** drives the auto-escalation clock, so it must be requested as part of the historical data. (ADP in particular can't reliably report auto-enrollment dates.)\n\n## Multiple payroll vendors\n\nIf a plan has more than one payroll vendor, run the above flow for each — there's no single standardized procedure for the multi-vendor case. Best-effort coordination per vendor.\n\n## See Also\n\n- [[payroll-template]]\n- [[ftp-connection]]\n- [[payroll-support]]\n- [[payroll-handoff-at-go-live]]\n- Jen Curtin\n- [[ftp-team]]\n- [[eds]]\n- [[dc-onboarding-workflow]]"},{"id":"glossary/pea","slug":"pea","rel":"glossary/pea.md","namespace":"glossary","title":"PEA","summary":"**Full Name:** Plan Enrollment Agreement","updated":"2026-04-16","created":"2026-04-16","sources":1,"status":"current","tags":["glossary","enrollment","pep","document"],"type":"glossary","extras":[],"media":[],"meta":{"title":"PEA","type":"glossary","tags":["glossary","enrollment","pep","document"],"created":"2026-04-16","updated":"2026-04-16","sources":1,"status":"current"},"markdown":"# PEA\n\n**Full Name:** Plan Enrollment Agreement\n\n## Definition\n\nThe PEA is the enrollment agreement document used in the PEP (Pooled Employer Plan) onboarding workflow. It appears in the COM's OBP (Onboarding Package) process for PEP plans specifically.\n\n## Used By\n\n- [[roles/com]] — COM routes the PEA as part of the PEP onboarding package workflow\n- PEP plans only — does not appear in standard non-PEP conversions\n\n## See Also\n\n- [[onboarding-package]]\n- [[roles/com]]\n- [[glossary/aaa]]"},{"id":"reference/plan-classes","slug":"plan-classes","rel":"reference/plan-classes.md","namespace":"reference","title":"Plan Classes","summary":"Groupings within a plan (e.g., employee categories) that determine contribution rules, eligibility, and other plan parameters. Defined in P3.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["classes","p3","plan-setup","doc-ops"],"type":"reference","extras":[],"media":[],"meta":{"title":"Plan Classes","type":"reference","tags":["classes","p3","plan-setup","doc-ops"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# Plan Classes\r\n\r\nGroupings within a plan (e.g., employee categories) that determine contribution rules, eligibility, and other plan parameters. Defined in P3.\r\n\r\n## Overview\r\n\r\nPlan classes divide participants into groups within the plan — for example, hourly vs. salaried employees, or different divisions. Each class can have different eligibility rules, vesting schedules, or contribution sources. Classes are set up in [[p3]] and are informed by the [[prd]] or [[onboarding-package]].\r\n\r\n## Two Types of Classes in P3\r\n\r\n### Traditional / Regular Classes\r\nExamples: union, non-alien resident, part-time\r\n- Standard class types used across many plans\r\n- **DC can update** existing names and codes\r\n- **DC cannot add new** traditional classes — only update existing ones\r\n\r\n### Special Classes\r\nExamples: teachers, doctors, electricians — company/plan-specific groupings\r\n- Non-standard classes defined by the plan sponsor\r\n- **DC cannot add new special classes** — Doc Ops only\r\n- DC can update existing special class names and codes\r\n- If a new special class is needed: **email Doc Ops** with the request\r\n\r\n## DC's Role\r\n\r\n| Action | DC Can Do? |\r\n|--------|-----------|\r\n| Update existing class names | Yes |\r\n| Update existing class codes | Yes |\r\n| Add new traditional classes | No — update only |\r\n| Add new special classes | No — Doc Ops only |\r\n\r\n## P3 Navigation\r\n\r\n> Plan → dropdown → Define Classes\r\n\r\n## Interaction with Eligibility\r\n\r\n- Some classes are **excluded from eligibility** entirely\r\n- Other classes have **different entry rules** (different entry dates, service requirements, etc.)\r\n- These rules come from the PRD/OB and are set up in P3 by Doc Ops — DC verifies them\r\n\r\n## When Classes Come Up\r\n\r\nClasses are identified during the [[prd]] / [[onboarding-package]] review. By the time P3 is set up, the classes should be defined. The DC verifies P3 has the correct classes and updates names/codes if needed.\r\n\r\n\r\n## See Also\r\n\r\n- [[p3]]\r\n- [[prd]]\r\n- [[onboarding-package]]\r\n- [[dc-onboarding-workflow]]"},{"id":"coordination/plan-conversion-handoffs","slug":"plan-conversion-handoffs","rel":"coordination/plan-conversion-handoffs.md","namespace":"coordination","title":"Plan Conversion Handoffs","summary":"The handoffs where the DC is on one end during a plan conversion — what moves, between whom, and when.","updated":"2026-07-08","created":"2026-04-14","sources":5,"status":"current","tags":["process","conversion","handoffs","cross-team","onboarding"],"type":"coordination","extras":[],"media":[],"meta":{"title":"Plan Conversion Handoffs","type":"coordination","tags":["process","conversion","handoffs","cross-team","onboarding"],"created":"2026-04-14","updated":"2026-07-08","sources":5,"status":"current"},"markdown":"# Plan Conversion Handoffs\n\nThe handoffs where the DC is on one end during a plan conversion — what moves, between whom, and when.\n\n## Trigger\n\nTwo parallel triggers start a conversion: new business intake issues an Nsa to COM, and separately notifies a manager that a plan slot is open in NBI → the manager assigns a DC. COM and DC land on the same plan around the same time — connect early.\n\n## Your handoffs\n\n### 1. Assignment → DC\n- **From:** new business intake → manager → you\n- **What moves:** Plan ID, NBI assignment\n- **You:** Confirm assignment in [[nbi]]; review PRD or onboarding package\n\n### 2. PRD / Onboarding Package → DC\n- **From:** COM → you\n- **What moves:** Plan Review Document or Onboarding Package (eligibility, vesting, sources, classes)\n- **You:** Review sections relevant to data setup; note conversion type\n\n### 3. Fund Mapping Approval\n- **From:** you → COM → [[qa]] + [[tc]]\n- **Trigger:** TOA signed by client\n- **What moves:** Fund mapping document; approval returns to you via COM\n- **Risk:** Delay pushes back source mapping and CONV file prep\n\n### 4. Source Mapping Approval\n- **From:** you → COM → [[qa]] + [[tc]]\n- **Trigger:** Test files received from prior record keeper\n- **What moves:** Source mapping document\n- **Risk:** Late test files compress everything downstream\n\n### 5. Source Mapping Attribute Completion\n- **From:** you → [[tc]] → COM/TM\n- **Trigger:** You've identified all prior-vendor sources with balances and saved the working spreadsheet\n- **What moves:** Source list, balances, prior-plan review attributes, contribution type codes, contribution frequency, withdrawal provisions, vesting, unresolved frozen-source questions\n- **TC:** Completes administrative attributes; may ask you to obtain missing prior-vendor details\n- **Risk:** Frozen/legacy sources mapped without verified attributes → wrong downstream setup and participant rules\n- **See:** Source Mapping TC\n\n### 6. Payroll Questionnaire → DC\n- **From:** COM → client → COM → you\n- **Trigger:** Payroll setup phase\n- **What moves:** Completed Payroll Questionnaire\n- **Risk:** Client delays returning it; you can't begin payroll setup without it\n\n### 7. Re-Registration Form (TIK only)\n- **From:** you → re-registration team (currently Matt O'Connell)\n- **Trigger:** TOA reviewed; any fund with column T = Y\n- **What moves:** Re-registration form (you fill it out)\n- **Timing:** Target ~10–12 business days before liquidation\n- **Risk:** Too early = premature action; too late = liquidation can't proceed\n\n### 8. Liquidation Day — Cashiering Loop\n- **From:** you → [[cashiering]] (heads-up, day before); prior record keeper → wire → Cashiering; Cashiering → you (wire receipt + ref number)\n- **What moves:** Wire confirmation, transfer reference number\n- **You:** Cannot start the Day of Wire workflow until the ref number arrives (by 3:45 PM CST if received that day)\n\n### 9. Assets Received Notification\n- **From:** you → COM → client\n- **Trigger:** Liquidation day — you confirm assets received and deposited\n- **What moves:** Asset receipt confirmation and amount\n- **Risk:** COM needs it same-day to email the client — stay in contact on liquidation day\n\n### 10. Eligibility Gate\n- **From:** you → [[qa]] + [[tc]] + COM (notification)\n- **Trigger:** Deferrals posted, all data in good order\n- **What moves:** Eligibility notification email; go-ahead email back\n- **You:** Enable eligibility in [[p3]] only after the go-ahead\n- **Rule:** Deferrals must be posted BEFORE the notification goes out\n\n### 11. Early Access Loop\n- **From:** COM requests the template from you → client completes → you load the file → TC activates (via COM, day before early access starts)\n- **What moves:** Early access file; TC system activation\n- **Risk:** Client returns the file late → TC can't be notified in time → early access misses its window\n\n### 12. Special Plan Classes\n- **From:** you → [[doc-ops]]\n- **Trigger:** Plan requires a new special class not already in P3\n- **What moves:** Class addition request (channel not yet documented)\n- **Risk:** You cannot add these yourself; timing dependency on the Doc Ops queue\n\n### 13. Prod Support Corrections\n- **From:** you → [[prod-support]]\n- **Trigger:** Data error not correctable via P3, ROC tool, or standard DC methods\n- **What moves:** AWD ticket (isolating query + thorough description)\n- **You:** Verify the correction, close the ticket\n\n### 14. Payroll Handoff at Go-Live (if payroll not complete)\n- **From:** you → Fiduciary Services; COM → Account Manager\n- **Trigger:** Go-live reached with payroll testing still incomplete (effective February 26, 2026)\n- **What moves:** FILESPECRQ AWD ticket (payroll contact, client contact, file layout, testing status summary); you update NBI\n- **Risk:** Missing ticket or omitted fields → Fiduciary Services can't pick up the project; payroll testing stalls\n- **See:** [[payroll-handoff-at-go-live]]\n\n## Failure modes\n\n| Handoff | Common failure |\n|---------|---------------|\n| Fund/source mapping approval | Approvers not looped in promptly; approval delayed past liquidation prep window |\n| Re-registration timing | Form sent too early or too late |\n| Cashiering heads-up | Day-before notification forgotten; Cashiering unprepared for the wire |\n| Eligibility gate | Eligibility enabled before go-ahead; or notification sent before deferrals posted |\n| Doc Ops class addition | DC attempts to add a special class directly in P3 (will fail) |\n| Early access file timing | Client returns file late; TC can't be notified in time |\n| Payroll handoff at go-live | FILESPECRQ ticket not submitted or missing required fields |\n\n## Around you (not your handoffs)\n\nHandoffs running in parallel that don't touch the DC — useful for knowing why COM/TC are busy:\n\n- **NSA → COM kickoff:** sales issues the Nsa; COM builds the project plan and schedules kickoffs\n- **Prior plan documents routing:** Plan Services → COM → docs team for review\n- **Prior carrier letter:** COM notifies the prior record keeper and plan sponsor of the transition\n- **Participant notices mailing:** COM drafts blackout/QDIA/fee/privacy notices, gets sponsor approval, routes for mailing — legal timing windows apply\n- **Contribution Monitoring Form + AWD flip (TFS plans):** COM ↔ client ↔ TC\n- **RDD form loop:** TC → COM → client → COM → TC\n- **CSR delivery:** Quality Consultant → COM → client at go-live\n- **Go-live close-out:** COM's go-live email, NBI audit checklist, and internal notifications\n- **TC administrative readiness gate:** TC + QA confirm case notes, access settings, and admin documentation before activation and handoff to the ongoing team — see TC Conversion Timeline, [[go-live-checklist]]\n\n## See Also\n\n- [[dc-onboarding-workflow]] — the DC's view of the full process\n- [[roles/lm-dc]]\n- [[liquidation-day]] — Day of Wire sequence detail\n- [[eligibility-and-deferrals]] — eligibility gate detail\n- Early Access\n- [[payroll-handoff-at-go-live]]"},{"id":"lifecycle/prd","slug":"prd","rel":"lifecycle/prd.md","namespace":"lifecycle","title":"PRD — Plan Review Document","summary":"A detailed document comparing the prior provider's plan design to the TransAmerica plan design. Reviewed internally first, then with the client, then signed.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["document","prd","plan-provisions","discovery","client-signed"],"type":"lifecycle","extras":[],"media":[],"meta":{"title":"PRD — Plan Review Document","type":"lifecycle","tags":["document","prd","plan-provisions","discovery","client-signed"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# PRD — Plan Review Document\n\nA detailed document comparing the prior provider's plan design to the TransAmerica plan design. Reviewed internally first, then with the client, then signed.\n\n## Overview\n\nThe PRD is one of two main plan specification documents used during onboarding (the other being the [[onboarding-package]]). It details plan provisions — eligibility rules, vesting schedules, contribution sources, and anything special about how the plan is structured.\n\n## DC-Relevant Sections\n\nThe PRD covers a lot of territory. Most sections are for other departments. DC focuses on:\n\n- **Eligibility** — service requirements, hours thresholds, entry dates\n- **Vesting** — vesting schedules by source\n- **Sources** — which sources exist, any frozen sources, any new sources being added\n- **Special strategies** — unusual conversion approaches, frozen fund handling\n\nOther sections (distributions, deferral elections, etc.) belong to other departments and are generally not the DC's concern.\n\n## Authorship\n\nThe **COM creates the PRD** using a standard TA template. It is not provided by the prior record keeper.\n\n## Process\n\n1. COM prepares the PRD from the standard TA template\n2. **Internal review:** DC and relevant teams go over it in an internal meeting\n3. **External review:** COM presents to client in an external meeting\n4. **Client feedback:** Any corrections or requested changes are made\n5. **Client signs** the PRD — this is one of the first things done when the plan begins\n\n> The PRD is signed early — well in advance of liquidation. Do not expect to be waiting on it near conversion time.\n\n## If PRD and P3 Setup Are Inconsistent\n\nIf the DC notices a discrepancy between what the PRD says and what's set up in P3:\n- Alert the **COM** and **Doc Ops**\n- They coordinate the fix\n- DC does not resolve PRD/P3 conflicts unilaterally\n\n## Amendments\n\nThe PRD can be amended after signing, but only in **very special circumstances**. Not a standard occurrence.\n\n## Relationship to Onboarding Package\n\nSome plans use a [[onboarding-package]] instead of a PRD. PEP plans (Pooled Employer Plans) always use onboarding packages. All other plan types use the PRD. The two are mutually exclusive — a plan uses one or the other, not both.\n\n## What Happens After Signing\n\nOnce signed, the PRD serves as the authoritative reference for plan provisions during the entire conversion. It informs:\n- [[base-file]] field selection\n- [[p3]] setup verification (classes, eligibility rules, sources)\n- [[source-mapping]] (which sources to map)\n- [[fund-mapping]] (which funds are active vs. frozen)\n\n\n## See Also\n\n- [[onboarding-package]]\n- [[subpack]]\n- [[dc-onboarding-workflow]]\n- [[plan-classes]]\n- [[source-mapping]]"},{"id":"vendors/prior-record-keeper","slug":"prior-record-keeper","rel":"vendors/prior-record-keeper.md","namespace":"vendors","title":"Prior Record Keeper","summary":"The outgoing retirement plan administrator from whom TransAmerica is taking over the plan. A critical external relationship that must be established early.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["prior-record-keeper","vendor","liquidation","test-files","coordination"],"type":"vendor","extras":[],"media":[],"meta":{"title":"Prior Record Keeper","type":"vendor","tags":["prior-record-keeper","vendor","liquidation","test-files","coordination"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# Prior Record Keeper\r\n\r\nThe outgoing retirement plan administrator from whom TransAmerica is taking over the plan. A critical external relationship that must be established early.\r\n\r\n## Overview\r\n\r\nThe prior record keeper (prior RK) holds all current participant data, balances, and investment positions. They will:\r\n- Provide test files to the DC for validation\r\n- Provide final files after liquidation\r\n- Execute the liquidation or transfer of assets on liquidation day\r\n- Receive and act on wire instructions\r\n\r\nThis relationship must be initiated early in the workflow. Delays in establishing contact = delays in everything downstream.\r\n\r\n## Not Applicable For\r\n\r\n- **Startup plans** — no prior record keeper; no conversion of existing assets\r\n- Verify plan type before looking for a prior RK contact\r\n\r\n## Identifying the Prior RK\r\n\r\nThe prior RK contact is known **from the moment the plan is received**. DC doesn't need to research or discover it — it comes with the assignment.\r\n\r\n## Relationship Ownership\r\n\r\nThe prior RK relationship is **shared across the whole team** — DC, COM, TC, and others all interact with them as needed. It's not DC-exclusive.\r\n\r\n## Initial Outreach\r\n\r\nAs soon as the plan is in the DC's queue:\r\n1. Make initial contact — introduce the DC and the project\r\n2. Send the **questionnaire** via the \"hello email\" — there is a **standard questionnaire template** included\r\n3. Begin coordinating on test file and data delivery timelines\r\n\r\n## Questionnaire Topics\r\n\r\nStandard questions sent to the prior RK:\r\n- **Liquidity issues:** Are any funds frozen, restricted, or otherwise illiquid?\r\n- **Transfer in kind availability:** Which funds can be transferred in kind vs. must be liquidated?\r\n- **Test file delivery:** When can test files be provided? In what format?\r\n- **Final file delivery:** What format will final files be in? When will they be available?\r\n- **Wire coordination:** Who handles wire transfers on their end?\r\n- Any other plan-specific concerns\r\n\r\n## Test Files\r\n\r\nTest files are the prior RK's data files delivered before liquidation for DC to validate. The DC uses them to:\r\n- Verify data format compatibility with EDS layouts\r\n- Run source summaries → identify which sources have money → build [[source-mapping]]\r\n- Check population counts and balance totals\r\n- Set up [[informatica]] CONV file structure in advance\r\n\r\n> Test files are a major milestone. Everything downstream (source mapping, CONV prep) depends on them.\r\n\r\n## Final Files\r\n\r\nFinal files are delivered after liquidation and contain authoritative as-of-liquidation data. See [[final-files-processing]].\r\n\r\n## Wire Instructions\r\n\r\nDC sends wire instructions to prior RK as early as possible. See [[wire-instructions]].\r\n\r\n## Day-Of Communication\r\n\r\nOn liquidation day:\r\n- DC emails prior RK to confirm everything on track (day before)\r\n- DC emails prior RK in the morning to request wire confirmation + fund breakdown\r\n- DC stays in contact until wire is confirmed received by [[cashiering|Cashiering]]\r\n\r\n## Unresponsive Prior RKs\r\n\r\nThis happens a lot. The approach: **keep pushing**. There's no special escalation — persistence is the tool.\r\n\r\n## Common Prior RK Workflows\r\n\r\nDC has built custom workflows for the most common prior record keepers (e.g., Fidelity, Vanguard, Empower). These workflows exist in the main DC folder and are being tuned — will be documented here once finalized.\r\n\r\n## See Also\r\n\r\n- [[wire-instructions]]\r\n- [[source-mapping]]\r\n- [[toa]]\r\n- [[liquidation-day]]\r\n- [[final-files-processing]]\r\n- [[dc-onboarding-workflow]]"},{"id":"coordination/prod-support","slug":"prod-support","rel":"coordination/prod-support.md","namespace":"coordination","title":"Prod Support","summary":"Makes direct database table corrections that DCs cannot perform themselves. Engaged via AWD ticket.","updated":"2026-07-08","created":"2026-04-14","sources":2,"status":"current","tags":["team","prod-support","awd","tables","corrections"],"type":"coordination","extras":[],"media":[],"meta":{"title":"Prod Support","type":"coordination","tags":["team","prod-support","awd","tables","corrections"],"created":"2026-04-14","updated":"2026-07-08","sources":2,"status":"current"},"markdown":"# Prod Support\n\nMakes direct database table corrections that DCs cannot perform themselves. Engaged via AWD ticket.\n\n## What they own\n\n- Modifying table entries, deleting incorrect records, changing field values\n- Any data correction that can't be done through [[p3]], the ROC tool, or standard DC tools\n\n## When to engage\n\n- Incorrect file import (wrong data loaded into the system)\n- Data needs to be deleted or adjusted after posting\n- Any table-level change beyond your tools\n\n## How to submit an AWD ticket\n\nLog into the AWD site (web portal):\n\n1. **Create Work** — select \"Create Work\" to open a new ticket\n2. **Enter case number** and **ticket type**\n3. **Enter Comments** — this is where the isolating query and description go\n4. **Send** — ticket goes to Prod Support's queue\n\nProd Support responds back to your queue with comments or a completion confirmation. Review it, verify the fix, then close.\n\n### Writing the Comments field\n\nThe quality of the ticket determines how fast and accurately it resolves.\n\n**Step 1 — Isolate the data first.** Run a query in AQT that returns exactly the records to change. Don't reference the whole table.\n\n**Step 2 — Write a thorough description.** Include:\n- What happened and what needs to be done\n- The isolating query (paste it in)\n- The action needed: delete / modify / update a specific value\n- All relevant identifiers (case number, SSN, plan name, ref number, etc.)\n\nThorough tickets mean fewer back-and-forth exchanges and faster resolution.\n\n**Step 3 — Verify when done.** Run the isolating query again and confirm results look right.\n\n**Step 4 — Close it.** Set to **Complete**, clear from your queue.\n\n## Turnaround\n\n- **Standard tickets:** 1–2 business days\n- **Urgent tickets (e.g., liquidation day):** same day — flag as urgent when submitting\n\n## Common issues\n\n- Vague comments or no isolating query → back-and-forth and slow resolution\n- Ticket marked done but never verified in the system — always re-run the query before closing\n- Urgent work not flagged as urgent, so it sits in the standard queue\n\n## See Also\n\n- [[p3]]\n- [[eds]]\n- [[final-files-processing]]\n- [[plan-conversion-handoffs]]"},{"id":"coordination/qa","slug":"qa","rel":"coordination/qa.md","namespace":"coordination","title":"Quality Assurance (QA)","summary":"Audits conversion data, setup, defaults, and participant records so the plan can go live without silent setup errors.","updated":"2026-07-08","created":"2026-04-14","sources":2,"status":"current","tags":["role","qa","qc","validation","conversion","audit"],"type":"coordination","extras":[],"media":[],"meta":{"title":"Quality Assurance (QA)","type":"coordination","tags":["role","qa","qc","validation","conversion","audit"],"created":"2026-04-14","updated":"2026-07-08","sources":2,"status":"current"},"markdown":"# Quality Assurance (QA)\n\nAudits conversion data, setup, defaults, and participant records so the plan can go live without silent setup errors.\n\n## What they own\n\n- Validation of imported conversion records and participant assets in [[p3]]\n- Approval of your fund and source mapping (jointly with [[tc]], routed via COM)\n- The go-ahead on the eligibility gate (jointly with TC)\n- Default allocation / default deferral / QDIA checks, loan analysis, duplicate-SSN checks\n- The CSR / go-live quality summary that COM sends to the client\n\n## What you hand them\n\n- **Fund/source mapping documents for approval** — routed through COM\n- **Eligibility notification email** — to QA + TC + COM, only after deferrals are posted and data is in good order\n- **Conversion records, assets, and audit evidence** — imported data, census details, [[audit-pack]] materials for their review\n\n## What they hand you\n\n- **Mapping and default validation** — approval back via COM\n- **Eligibility go-ahead** — jointly with TC; required before you enable eligibility in P3\n- **Audit findings and corrections** — issues in imported data, mapping, duplicates, or source/fund setup that you fix before go-live\n\n## When to contact them / escalation\n\n- Loop QA in early on conversion strategy — QDIA, defaults, loans, divisions, duplicate SSNs. The later they see it, the less room they have to catch problems before access turns on\n- QA validates; TC sets up. Send setup questions to TC, validation questions and audit evidence to QA\n- Corrections QA can't make through standard tools go to [[prod-support]]\n\n## Common issues\n\n- Mapping approval delayed because QA wasn't looped in promptly — pushes liquidation prep\n- Eligibility enabled before QA's go-ahead\n- Audit evidence delivered late, compressing the review window before access is turned on\n\n## See Also\n\n- [[tc]]\n- [[go-live-checklist]]\n- [[audit-pack]]\n- [[source-mapping]]\n- [[fund-mapping]]\n- [[eligibility-and-deferrals]]\n- [[plan-conversion-handoffs]]"},{"id":"troubleshooting/reversal-submission","slug":"reversal-submission","rel":"troubleshooting/reversal-submission.md","namespace":"troubleshooting","title":"Reversal Process","summary":"How to reverse an erroneous transaction in p3. Both a Reversal Form submission and a Reversal AWD ticket are required — in that order.","updated":"2026-06-25","created":"2026-04-16","sources":1,"status":"current","tags":["process","reversal","awd","correction","prod-support"],"type":"troubleshooting","extras":[],"media":[],"meta":{"title":"Reversal Process","type":"troubleshooting","tags":["process","reversal","awd","correction","prod-support"],"created":"2026-04-16","updated":"2026-06-25","sources":1,"status":"current"},"markdown":"# Reversal Process\r\n\r\nHow to reverse an erroneous transaction in [[p3]]. Both a Reversal Form submission and a Reversal AWD ticket are required — in that order.\r\n\r\n## Overview\r\n\r\nA reversal corrects a transaction that was processed in error. The current process (effective **March 6, 2026**) replaces the legacy Plan Correction Checklist with a **Reversal Form**. The form generates an automated email whose contents must be pasted into the AWD ticket. Both steps are mandatory and sequential.\r\n\r\n## Trigger\r\n\r\nAny of the following, once confirmed as an error:\r\n- Booking error (see [[booking-assets]]).\r\n- Day of Wire processing error (see [[liquidation-day]]).\r\n- Loan processing error (e.g., loans re-amortized when they should have been reloaded, or vice versa).\r\n- Any transaction posted in error that cannot be backed out by ordinary correction tools.\r\n\r\n**Before submitting:**\r\n- Closed funds must be addressed.\r\n- Funds needing to be returned, stopped, or voided must be handled.\r\n\r\n## Steps\r\n\r\n### 1. Submit the Reversal Form — DC\r\nNavigate to the Reversal Form (link maintained in DC team resources). Complete all fields:\r\n\r\n| Field | Notes |\r\n|-------|-------|\r\n| CSD screen info | Loan case number / affiliate, plan name, participant name or \"Multiple\" |\r\n| Total reversal amount | Drives approval level |\r\n| Final approval level | See Approval Levels below |\r\n| Transaction type | Loan, remit, etc. |\r\n| Trans ref number(s) | Of the transactions being reversed |\r\n| SSN(s) | Of the affected transactions |\r\n| Responsible party | Transamerica or external |\r\n| Confirmation checkboxes | Funds returned/stopped/voided, AWD ticket to follow |\r\n\r\nClick **Submit**.\n\nThe form captures the core transaction and control data the reversal team needs:\n- what is being reversed, including transaction type, transaction reference number, and loan number if applicable\n- who is responsible: Transamerica or an external party\n- what happened and what correction is needed\n- whether reprocessing is recordkeeping-only with no payment issued\n- whether payments were applied and whether a loan was re-amortized, deemed, or offset\n- whether voice / DDOL, closed funds, current-year correction, prior-year correction, or Reverse IC applies\r\n\r\n### 2. Copy the Automated Email — DC\r\nAn email arrives from `slasrever@transamerica.com`. Near the bottom, locate the block labeled **\"Information for reversal team\"**.\r\n\r\n**Copy the entire block.** It must be pasted verbatim into the AWD ticket comments.\r\n\r\n### 3. Open the Reversal AWD Ticket — DC\r\nThe AWD ticket is still required — the form alone does not initiate the reversal. Open the ticket using the transaction type (e.g., \"Loan\" for loan reversals).\r\n\r\n### 4. Paste the Email Block into AWD Comments — DC\r\nPaste the copied \"Information for reversal team\" block into the ticket comments. This is what the reversal team works from.\r\n\r\n### 5. Attach Supporting Documents — DC\r\nAny documentation needed to evidence the error (screenshots, earlier tickets, email threads). Submit the ticket.\r\n\r\n### 6. Reversal Team Works the Ticket — Prod Support\r\n[[prod-support]] executes the database corrections via AWD. The DC's part is done after submission; downstream processing is unchanged from the old workflow.\r\n\r\n## Approval Levels\r\n\r\n| Total Reversal Amount | Approval Required |\r\n|----------------------|-------------------|\r\n| Up to $50,000 | Standard |\r\n| $50,000 – $150,000 | Manager |\r\n| Over $150,000 | Higher — confirm with manager |\r\n\r\n## Handoff Points\r\n\r\n| # | From → To | What Moves | Risk |\r\n|---|-----------|------------|------|\r\n| 1 | DC → Reversal Form system | Structured form data | Missing fields → form cannot generate email block |\r\n| 2 | Reversal Form → DC inbox | Automated email with paste block | Email missed → AWD ticket lacks the block, reversal team rejects |\r\n| 3 | DC → AWD | Reversal ticket with pasted block + attachments | Form submitted but no AWD ticket → reversal never executed |\r\n| 4 | AWD → [[prod-support]] | Ticket + context | Standard AWD flow from here |\r\n\r\n## Timing / Deadlines\r\n\r\n- **Form before ticket.** The automated email is required input for the ticket.\r\n- **Same-day submission recommended** once the error is confirmed — every day the error sits in the books complicates downstream processing.\r\n- **Prior closed-fund and returned-fund steps must be complete** before submission.\r\n\r\n## Failure Modes\r\n\r\n- **Filling out the old Plan Correction Checklist.** Retired as of 03/06/26. Reversal team will not accept it.\r\n- **Submitting AWD ticket without the form.** No structured paste block → ticket rejected.\r\n- **Submitting the form without the AWD ticket.** Form alone does not execute the reversal.\r\n- **Copying only part of the email block.** Reversal team needs the full block — partial text breaks their downstream parsing.\r\n- **Missing approval tier.** Amount crossing a tier boundary without higher-tier sign-off stalls the ticket.\r\n- **Voice / DDOL, closed funds, or re-amortized loans not flagged.** The form has explicit checkboxes for these — skipping them creates hidden correction debt.\r\n\r\n## What Has Not Changed\r\n\r\n- AWD ticket is still required.\r\n- Closed funds must be addressed before proceeding.\r\n- Returned / stopped / voided fund handling still precedes submission.\r\n- The reversal team's downstream process is unchanged.\r\n\r\n## Evidence / Examples\r\n\r\nMarch 9, 2026 example — loan reload error:\r\n- Responsible party: Transamerica.\r\n- Issue: ticket requested loans be re-amortized; DC reloaded them instead.\r\n- Resolution: reverse loans and payments. Loans were not re-amortized and had no payments applied.\r\n- Approval: Manager level (total ≈ $49,822).\r\n\r\n## See Also\r\n\r\n- [[prod-support]]\r\n- [[liquidation-day]]\r\n- [[booking-assets]]\n- [[final-files-processing]]\n- [[dc-onboarding-workflow]]\n- [[roles/lm-dc]]\n- [[plan-conversion-handoffs]]"},{"id":"conversion-ops/source-mapping","slug":"source-mapping","rel":"conversion-ops/source-mapping.md","namespace":"conversion-ops","title":"Source Mapping","summary":"The process of mapping prior record keeper contribution source codes to TransAmerica source IDs. Required for all conversions that carry over source-level data.","updated":"2026-05-03","created":"2026-04-14","sources":3,"status":"current","tags":["mapping","sources","aqt","test-files","conversion"],"type":"conversion-ops","extras":[],"media":[{"id":"fig-1","caption":"Source mapping table — prior vendor source codes mapped to TA Source IDs with test-file totals.","src":"SS/Source Mapping.jpg","type":"diagram"}],"meta":{"title":"Source Mapping","type":"conversion-ops","tags":["mapping","sources","aqt","test-files","conversion"],"created":"2026-04-14","updated":"2026-05-03","sources":3,"status":"current"},"markdown":"# Source Mapping\r\n\r\nThe process of mapping prior record keeper contribution source codes to TransAmerica source IDs. Required for all conversions that carry over source-level data.\r\n\r\n## Overview\r\n\r\nEvery retirement plan has contribution sources (e.g., employee deferrals, employer match, profit sharing, etc.). The prior record keeper uses their own source codes; TransAmerica has its own source IDs. Source mapping creates the translation table between them.\r\n\r\nOnly map sources that actually have money — sourced from test file summaries. Mapping empty sources wastes everyone's time.\r\n\r\n## When to Do It\r\n\r\n**As soon as test files arrive from the prior record keeper.** Unlike [[fund-mapping]], source mapping requires test files because you need to know which sources actually have balances.\r\n\r\n> Get source mapping done ASAP after test files arrive. This is a blocking dependency for QA and TC to do their part. Don't sit on it.\r\n\r\n## Test Files vs. Final Files\r\n\r\nSource mapping is finalized in two passes:\r\n\r\n1. **Test files** — first pass. Map every source that has a balance on the test file. Don't bother with empty sources.\r\n2. **Final files** — confirm every test-file source is still present and add any **new** sources that appear. Late-arriving sources need to be added immediately so the balance import doesn't fail on an unmapped source.\r\n\r\nSources that show up only on final files are common — get them in fast, re-route through QA/TC/COM for sign-off, and move on.\r\n\r\n## Process\r\n\r\n1. Test files received from prior record keeper\r\n2. DC runs **source summaries** on the test files — produces totals by source code\r\n3. DC filters: only sources with money (non-zero totals)\r\n4. DC queries **AQT** (internal database tool) to pull TransAmerica **Source IDs** for each source type\r\n5. DC builds source mapping table: prior vendor source code + description + TA source ID + totals\r\n6. DC sends mapping to COM, TC, QA for approval\r\n7. Approvals received → source mapping complete\r\n\r\n## Mapping Table Structure\r\n\r\n| Field | Source |\r\n|-------|--------|\r\n| Prior vendor source code | Test file |\r\n| Prior vendor source description/name | Test file |\r\n| TA Source ID | AQT query |\r\n| Total balance | Test file summary |\r\n\r\n![Source mapping table — prior vendor source codes mapped to TA Source IDs with test-file totals.](SS/Source Mapping.jpg)\r\n\r\n## AQT\r\n\r\n[[aqt]] is the internal database query tool used to pull source IDs. It is a **standalone app** — not integrated into P3 or EDS. The DC runs a query to retrieve TA source IDs for each prior vendor source type.\r\n\r\nThe specific AQT query for source IDs is too complex to document here — it will be documented separately with all DC queries.\r\n\r\n## Relationship to Fund Mapping\r\n\r\n| | Fund Mapping | Source Mapping |\r\n|--|-------------|----------------|\r\n| Maps | Investment funds | Contribution sources |\r\n| Requires test files | No | Yes |\r\n| Source of data | TOA | Test file summaries + AQT |\r\n| Timing | As soon as TOA signed | As soon as test files arrive |\r\n\r\n## Key Clarifications\r\n\r\n**Typical number of sources:** About 10. Varies widely by plan.\r\n\r\n**No clear TA equivalent for a source?** Map as best as you can. No official process — use judgment.\r\n\r\n**Does approved source mapping get loaded to the system?** No. Same as fund mapping — it's a reference document. Once approved, it's added to the Informatica workflows. Not a system import.\r\n\r\n**Does source mapping apply to both balance and contribution sources?** Yes — both.\r\n\r\n## See Also\r\n\r\n- [[fund-mapping]]\r\n- [[aqt]]\r\n- [[toa]]\r\n- [[prior-record-keeper]]\r\n- [[conversion-types]]\r\n- [[dc-onboarding-workflow]]"},{"id":"sources/balances-census-loans-brain-dump","slug":"balances-census-loans-brain-dump","rel":"sources/balances-census-loans-brain-dump.md","namespace":"sources","title":"Source: Balances, Census, Loans Brain Dump","summary":"LM-DC voice-memo brain dump captured as a single text file in `new TA Brain/Balances, Census, Loans.txt`. Intended by the author as the \"all, end-all\" reference for census, elections, balance import, fund/source mapping, and loan setup proc","updated":"2026-05-03","created":"2026-05-03","sources":1,"status":"current","tags":["census","elections","balances","cash-conversion","mapping","tik","fund-mapping","source-mapping","loans","dummy-participant","forfeitures","fmc","advanced-employer"],"type":"source","extras":[],"media":[],"meta":{"title":"Source: Balances, Census, Loans Brain Dump","type":"source","tags":["census","elections","balances","cash-conversion","mapping","tik","fund-mapping","source-mapping","loans","dummy-participant","forfeitures","fmc","advanced-employer"],"created":"2026-05-03","updated":"2026-05-03","sources":1,"status":"current"},"markdown":"# Source: Balances, Census, Loans Brain Dump\n\nLM-DC voice-memo brain dump captured as a single text file in `new TA Brain/Balances, Census, Loans.txt`. Intended by the author as the \"all, end-all\" reference for census, elections, balance import, fund/source mapping, and loan setup procedures.\n\n## Summary\n\nLong-form narrative covering the full census-to-balances-to-loans pipeline from the LM-DC perspective. Walks through how the census enters the system (client direct, vendor, or base file), how elections get loaded (mapped or defaulted via EDS), how balances flow on liquidation day for cash / mapping / TIK conversions, the role of the CONV file and the dummy participant, the FMC discipline around any trading event, advanced-employer interest distribution, and the full P3 + Informatica loan setup sequence including HOLB handling.\n\n## Key Claims\n\n- Census arrives via three paths: client direct (limited access file), vendor (rare), or base file (vast majority). Base file becomes possible after PRD/onboarding completion → AWD testing → tailored template → client walkthrough → return.\n- Limited access files exist so participants can update allocations during an open period before blackout; mostly used on cash conversions.\n- Defaulting elections is a single-step EDS load — same layout as map-elections, but Fund Descriptor and Percentage are blank and the default flag is **D** instead of **N**, one row per participant. Best done at the same time as census, not as a separate pass.\n- Forfeiture entries in balance files use the vendor's name convention (often year-based) and the same stand-out date convention as the dummy participant: DOB **12/25/1955**, DOH **12/25/1985**.\n- Election population reconciliation should be explicit: \"150 participants, 140 elections, 10 defaulted = 150\" — never inferred.\n- Wire instructions are sent first thing and re-sent ~1 week before liquidation as a confirmation reset.\n- Wire confirmation has two paths: cashiering's email, OR the DC searches ref numbers in P2 themselves and matches the amount.\n- For cash conversions, wire goes to the **Advanced Employer (AE)** account; AE accrues a small interest while waiting for final files. After AE is liquidated and balances post, **the next day** the accrued interest is taken and applied **pro-rata to participants** as a small bonus. This is DC-triggered, as are dividends, uncashed checks, and any other extra cash that lands after conversion.\n- Source mapping starts with whatever sources have balances on test files; finalized against final files; any new source on final files needs to be added immediately.\n- Fund mapping is built from the TOA. ~1 in 25 mapping plans involves a **fund split** (one prior fund maps to two TA funds with a ratio like 50/50 or 75/25). Sometimes prior fund codes on the actual files don't match the TOA — show your work.\n- CONV file is the Informatica Day-of-Wire input. **Re-Reg = Y** for TIK funds, **N** for mapping. Cash conversions don't use a CONV file.\n- For cash-conversion CIT balance workflow: parameter file has cash-conv = **Y**, and the **AE liquidation ref number** must be created and attached to the parameter file.\n- For mapping CIT balance workflow: parameter file cash-conv = **N**; the ref number lives in the **fund mapping file** (workflow finds it there) and is matched against participant balances.\n- Dummy participant (SSN 999-00-0000) is required for mapping conversions. After participant balances post, reverse via P3 → ROC → \"ROC No Reversal\".\n- TIK share-count tolerance: tiny variance is OK; **anything more than one share** must be escalated.\n- FMC must capture any trading event for the conversion — for cash conversions that's the AE purchase, the AE liquidation, AND the subsequent fund purchases. Interest distributions and trailing dividends do **not** require FMC entries.\n- Loans are set up in P3 first: Conversions dropdown → Add Record Keeper (Name only) → Conversions tab → New Conversion → enter case number, No Affiliate → set Conversion Date and Assign Date to effective date − 3 months → save → capture Conversion Number.\n- Loan import file has two parts: Loan Header (one row per loan) and Loan Source (one row per source per loan). **Outstanding balance in Loan Header must equal Loan Source totals exactly.**\n- Loan Informatica workflow has a test mode: run with test = Y first; if clean, flip to test = N for production.\n- Loan upload in P3: Conversions dropdown → Existing Plan → search by case number or conversion number → Takeover Loans → Submit. If **HOLB** (Highest Outstanding Loan Balance) file exists, upload it; if not, click **Upload and Create**.\n- Loan Header file feeds into the audit pack for QA.\n\n## Key Quotes\n\n- \"We don't process unless it's in good order.\"\n- \"It's okay to have an entry on the FMC and have trades NOT go out. It is not okay to have trades go out without an entry on the FMC.\"\n- \"Anytime you ever see one of those [stand-out dates], it's just an extra way of making sure that these people stand out and are not treated as normal.\"\n- \"Be explicit and acknowledge it that way. It's not inferred or assumed or anything.\"\n- \"If the data won't load correctly [without dummy] it'll need to be cleared by Prod Support. It's a nightmare. Don't do it.\"\n\n## Entities Mentioned\n\n- [[eds]] — census, elections, and final-file validation/loading\n- [[p2]] — ref number creation back-end\n- [[p3]] — plan administration; conversions dropdown; ROC; Takeover Loans\n- [[informatica]] — Day-of-Wire and CIT balance workflows; loan workflow\n- [[awd]] — testing leg between PRD/onboarding and base file finalization\n- [[cashiering]] — wire pulls and confirmation\n- Matt O'Connell — TIK / Fidelity pooled accounts\n- [[ssbt]] — 4 PM EST cutoff context\n\n## Concepts Mentioned\n\n- [[census-data]], [[base-file]], [[payroll-template]], [[limited-access-file]] (new)\n- [[defaulting-elections-eds]] (new), [[forfeiture-loading]] (new)\n- [[balance-import]], [[balance-import-cash]], [[balance-import-mapping]], [[balance-import-tik]]\n- [[advanced-employer]], [[subsequent-cash-imports]] (new)\n- [[fund-mapping]], [[source-mapping]], [[conv-file]], [[processes/tik-transfer|transfer-in-kind]]\n- [[dummy-participant]], [[fund-management-calendar]], [[wire-instructions]]\n- [[liquidation-day]], [[final-files-processing]]\n- [[loan-setup]], [[informatica-loan-module]]\n- [[holb]] (new glossary)\n\n## Notes\n\nThis source contains the first explicit mention in the wiki corpus of: limited access files, defaulted-election EDS rows, forfeiture date conventions, AE interest pro-rat, the one-share TIK escalation threshold, fund-split ratio handling, the loan workflow test toggle, and HOLB. Several existing pages are expanded against this source; see the per-page `sources` count for traceability."},{"id":"sources/census-data-doc","slug":"census-data-doc","rel":"sources/census-data-doc.md","namespace":"sources","title":"Source: Census Data Documentation","summary":"Structured documentation file covering census data loading procedures, audit checks, and error handling for plan conversions.","updated":"2026-04-20","created":"2026-04-20","sources":1,"status":"current","tags":["eds","census","process","data"],"type":"source","extras":[],"media":[],"meta":{"title":"Source: Census Data Documentation","type":"source","tags":["eds","census","process","data"],"created":"2026-04-20","updated":"2026-04-20","sources":1,"status":"current"},"markdown":"# Source: Census Data Documentation\r\n\r\nStructured documentation file covering census data loading procedures, audit checks, and error handling for plan conversions.\r\n\r\n## Summary\r\n\r\nInternal documentation describing the census data loading process. Covers participant data fields, EDS loading procedure (Address Standard and Enrollments data types), audit/edit checks, vendor data rules, and date-handling edge cases.\r\n\r\n## Key Claims\r\n\r\n- Census data includes both active and terminated participants within the last two years\r\n- Data loaded via EDS in P3 using the **Address Standard** and **Enrollments** data types\r\n- Always run Validate Only first; communicate errors to client, COM (TM), and TC\r\n- One row per employee is a hard requirement\r\n- Client provides both test files and live files; reconcile test against live when live is received\r\n- Vendor (prior RK) census data is allowed in specific circumstances: client request, or terminated participant with incoming balance\r\n- If DOH and DOR both exist with no Date of Term, do not request Date of Term\r\n- Date of Hire must not match Date of Rehire — if they match, request original DOH from client\r\n\r\n## Key Quotes\r\n\r\n- \"Vendor census data may be used when: Client requests vendor data, or a terminated participant has a balance coming over from the PRK\"\r\n- \"Enroll participant using PRK data. Notify client, TM, and TC prior to loading.\"\r\n\r\n## Entities Mentioned\r\n\r\n- [[eds]] — file validation and loading system\r\n- [[p3]] — main plan administration platform\r\n\r\n## Concepts Mentioned\r\n\r\n- [[census-data]] — this source's primary concept\r\n- [[base-file]] — the census template DC gives to the client to collect this data\r\n- [[prior-record-keeper]] — source of vendor census data in applicable cases\r\n\r\n## Contradictions / Open Questions\r\n\r\n- \"Errors / Resolutions\" section marked as unclear in source — specific error codes and resolutions not documented\r\n- `TO Census.sql` query referenced but path not specified\r\n\r\n## See Also\r\n\r\n- [[census-data]]\r\n- [[processes/eligibility-loading|loading-eligibility-eds]]\r\n- [[base-file]]\r\n- [[eds]]"},{"id":"sources/com-main-checklist","slug":"com-main-checklist","rel":"sources/com-main-checklist.md","namespace":"sources","title":"Source: COM Main Checklist","summary":"A structured web-based checklist application used by Communications Coordinators (COMs) to track every task across a plan conversion lifecycle — from NSA receipt through go-live.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["source","com","checklist","conversion","project-management"],"type":"source","extras":[],"media":[],"meta":{"title":"Source: COM Main Checklist","type":"source","tags":["source","com","checklist","conversion","project-management"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# Source: COM Main Checklist\n\nA structured web-based checklist application used by Communications Coordinators (COMs) to track every task across a plan conversion lifecycle — from NSA receipt through go-live.\n\n## Summary\n\nThis is the authoritative task list that defines the COM role in operational terms. It is organized into 18 phases covering kickoff, prior recordkeeper coordination, letters and notices, payroll setup, document execution, early access, and go-live. Two plan-type branches exist throughout: PEP (Pooled Employee Plan) and Non-PEP, with certain sections exclusive to each.\n\nThe checklist reveals that the COM role is far more than a meeting scheduler — COMs are the document factory, the routing hub, and the go-live coordinator for every plan conversion.\n\n## Key Claims\n\n1. **NSA (New Sale Announcement) is the trigger** — the COM workflow begins when the NSA is received.\n2. **COM creates and owns the project plan** — uploaded to NBI and sent to the conversion team.\n3. **COM is the letters-and-notices factory** — responsible for cover letters, blackout notices, mapping notices, QDIA initial notices (sourced from TC), fee disclosures, privacy notices, and conversion newsletters.\n4. **COM manages the prior RK document chain** — requests prior plan docs, routes them through Ellen Miller to the docs team, and coordinates prior carrier letters and successor trustee letters.\n5. **COM co-owns payroll coordination** — sends specs, runs payroll calls, manages questionnaires with clients and DCs, handles Contribution Monitoring Forms (which require TC to flip an AWD setting), and manages the RDD Form loop with TC.\n6. **Subpack ownership is COM → TC** — COM creates the subpack; TC reviews it during the internal call and takes over maintenance after that.\n7. **Early access is COM-coordinated** — COM requests the template from DC, routes it to the client, submits back to DC, and notifies TC to activate it.\n8. **Go-live is COM-orchestrated** — COM sends the go-live email, completes the NBI audit checklist, completes the Auto Delivery Form (non-PEP), adds the plan to the Survey Spreadsheet, and notifies Ellen Miller.\n9. **CSR (Conversion Summary Report) comes from the Quality Consultant** — COM receives it and forwards to the client.\n10. **PEP plans have additional document requirements** — OBP, PEA, Info Sharing Form (via DocuSign), plus AAA, Secure 2.0, and SPD from the docs team.\n\n## Key Quotes\n\n*Source is a structured checklist application — no direct quotes. Task labels preserved verbatim in concept and role pages.*\n\n## Entities Mentioned\n\n**People:**\n- Ellen Miller — receives prior docs and notice requests; plan setup in SF; notified at go-live; receives SPD for PEP participants\n- Jen Curtin — notified by COM for 360° payroll plans\n- Samantha C. — receives Transition Communications Checklist (non-PEP); team unknown\n- Quality Consultant — sends CSR to COM at go-live; handles loan analysis\n\n**Systems:**\n- [[nbi]] — project plan uploaded here; audit checklist completed here at go-live\n- [[docusign]] — used to send OBP, PEA, plan documents for signature\n- WX / [[wx]] — Plan Sponsor Site; confirmed by COM, set up by TC\n- FILESERVE — contribution monitoring form stored here\n- SF (Salesforce?) — plan setup confirmed by Ellen; VEF L&C tickets submitted here\n\n**Teams:**\n- [[tc]] — provides QDIA notice, fee disclosure, enrollment guide, RDD form; reviews subpack; sets up WX; flips AWD for contribution monitoring; activates early access; sets up go-live review\n- [[doc-ops]] — creates OBP (PEP); provides AAA, Secure 2.0, SPD (PEP)\n- [[roles/lm-dc]] — receives payroll questionnaire; provides early access file template; confirms asset receipt\n- [[cashiering]] — referenced indirectly (assets received confirmation comes through DC)\n\n## Concepts Mentioned\n\n- [[concepts/nsa]] — New Sale Announcement; triggers COM workflow\n- Project Plan COM — COM's master conversion tracker; two formats (PEP vs non-PEP); uploaded to NBI\n- Prior Carrier Letter — letter notifying prior record keeper of transition\n- Blackout Notice — notice of investment blackout period sent to participants\n- [[concepts/vef]] — Vendor Expense Form; routes through advisor → client → L&C setup\n- Contribution Monitoring Form — payroll monitoring setup; requires TC AWD flip\n- Rdd Form — form provided by TC, completed by client, submitted back to TC\n- Early Access — pre-go-live participant access; COM-coordinated\n- [[concepts/csr]] — Conversion Summary Report; from Quality Consultant; sent to client at go-live\n- [[subpack]] — COM creates; TC reviews and takes over maintenance\n- [[onboarding-package]] — PEP plans only; COM updates tabs and prepares PEA\n- [[toa]] — included in OBP for PEP plans\n- [[prd]] — authored by COM; forms the basis of the plan review call\n\n## Contradictions / Open Questions\n\n- **PEA** — Plan Enrollment Agreement; PEP plans only. ✓ Confirmed.\n- **AAA** — Adoption Agreement Addendum; PEP plans only. ✓ Confirmed.\n- **Samantha C.** — receives Transition Communications Checklist for non-PEP plans. Last name and team still unknown.\n- **Communication Consultant** — confirmed as an internal Doc Ops role. ✓ Resolved.\n- **SF** — Salesforce; used for plan setup confirmation and VEF L&C tickets. ✓ Confirmed.\n- **FILESERVE** — contribution monitoring form stored here. System details unknown.\n- **CIT & DCGLIB** — document storage locations for signed OBP copies. Not yet documented.\n\n## See Also\n\n- [[roles/com]] — full COM role reference built from this source\n- [[plan-conversion-handoffs]] — updated with COM-perspective handoffs\n- [[subpack]] — ownership now documented from COM's side\n- Nsa\n- Csr"},{"id":"sources/loading-basis-doc","slug":"loading-basis-doc","rel":"sources/loading-basis-doc.md","namespace":"sources","title":"Source: Loading Basis through EDS Documentation","summary":"Structured documentation file covering basis data loading procedures, field definitions, tables, and special rules for plan conversions.","updated":"2026-04-20","created":"2026-04-20","sources":1,"status":"current","tags":["eds","basis","process","data"],"type":"source","extras":[],"media":[],"meta":{"title":"Source: Loading Basis through EDS Documentation","type":"source","tags":["eds","basis","process","data"],"created":"2026-04-20","updated":"2026-04-20","sources":1,"status":"current"},"markdown":"# Source: Loading Basis through EDS Documentation\r\n\r\nStructured documentation file covering basis data loading procedures, field definitions, tables, and special rules for plan conversions.\r\n\r\n## Summary\r\n\r\nInternal documentation describing the basis loading process through EDS. Covers EE basis purpose (hardship withdrawals, Roth tracking), required file fields, all basis field names, affected database tables, transaction types that do and do not adjust basis, and special rules (457 plans, cost basis, Roth timing, mid-year conversions).\r\n\r\n## Key Claims\r\n\r\n- EE Basis determines the amount available for hardship withdrawals\r\n- Tracks after-tax and Roth contributions for special tax considerations upon withdrawal\r\n- Loaded via EDS in P3 using the **Basis** data type\r\n- Basis should be loaded as of the last plan year (12/31 of prior calendar year)\r\n- For mid-year conversions: load basis to both current year and prior year basis sets\r\n- Do not load basis for 457 plans\r\n- Only load Cost Basis for stock funds and NQ plan re-registrations\r\n- Roth did not start until 2006 — load Roth basis for all participants with Roth balances\r\n- Only one takeover (T row) can exist per plan\r\n- Hardship suspension dates: load only end or re-entry dates via SQL\r\n\r\n## Key Quotes\r\n\r\n- \"EE Basis determines the amount available for hardship withdrawals.\"\r\n- \"Basis should be loaded as of the last plan year (typically 12/31 of prior calendar year).\"\r\n- \"Do not load basis for 457 plans.\"\r\n- \"Even if hardship withdrawals are not allowed, load basis if provided.\"\r\n\r\n## Entities Mentioned\r\n\r\n- [[eds]] — file validation and loading system\r\n- [[p3]] — main plan administration platform\r\n\r\n## Concepts Mentioned\r\n\r\n- [[loading-basis-eds]] — this source's primary concept\r\n- [[final-files-processing]] — basis is loaded during the final files phase\r\n\r\n## Contradictions / Open Questions\r\n\r\n- `TO_BASIS.sql` query referenced but exact path not specified\r\n- Hardship suspension date loading via SQL referenced but SQL not documented\r\n\r\n## See Also\r\n\r\n- [[loading-basis-eds]]\r\n- [[processes/eligibility-loading|loading-eligibility-eds]]\r\n- [[final-files-processing]]\r\n- [[eds]]"},{"id":"sources/subpack-cccs","slug":"subpack-cccs","rel":"sources/subpack-cccs.md","namespace":"sources","title":"Source: New Plan Submission Package — CCCS Document","summary":"Raw template for the CCCS (Client Conversion Configuration Sheet) submission package — the internal TA document completed once per plan at the start of a new conversion.","updated":"2026-04-16","created":"2026-04-16","sources":1,"status":"current","tags":["subpack","cccs","plan-setup","conversion","source"],"type":"source","extras":[],"media":[],"meta":{"title":"Source: New Plan Submission Package — CCCS Document","type":"source","tags":["subpack","cccs","plan-setup","conversion","source"],"created":"2026-04-16","updated":"2026-04-16","sources":1,"status":"current"},"markdown":"# Source: New Plan Submission Package — CCCS Document\n\nRaw template for the CCCS (Client Conversion Configuration Sheet) submission package — the internal TA document completed once per plan at the start of a new conversion.\n\n## Summary\n\nThis is the raw template for the CCCS portion of the New Plan Submission Package. It captures all plan-level configuration decisions made at onboarding: plan type, trustee structure, payroll setup, conversion strategy, services included, loan/withdrawal options, and contact information. One package is completed per plan.\n\n## Key Claims\n\n- A single submission package must be completed per plan.\n- Plan types supported span 401(k), 401(a), 403(b), 457(b), 457(f), and Corporate NQDC.\n- All 457(f) plans use the IDP document type; Transamerica does not draft these.\n- System effective date should generally be one month prior to the plan effective date.\n- Auto-increase should not be offered for NQDC or 457 plans.\n- Market segmentation is categorized as Large or Mega.\n- T
