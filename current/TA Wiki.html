ersions**: load basis to both current year and prior year basis sets\r\n\r\n## Basis Fields\r\n\r\n| Field | Description |\r\n|-------|-------------|\r\n| PRE-87 TAX BASIS AMT | Pre-1987 after-tax basis |\r\n| POST86_TAX_BAS_AMT | Post-1986 after-tax basis |\r\n| CORP_TYP6_CTRB_AMT | Corporate Type 6 contribution amount |\r\n| POST88TYP3_BAS_AMT | Post-1988 Type 3 basis |\r\n| PRE89_TYP3_BAS_AMT | Pre-1989 Type 3 basis |\r\n| EE_BEG_BAL_DAT | Employee beginning balance date |\r\n| RTH_HRDSHP_CTRB_A | Roth hardship contribution amount |\r\n| RTH_TAXFREE_CTRB_A | Roth tax-free contribution amount |\r\n| RTH_TAXFREE_ROLL_A | Roth tax-free rollover amount |\r\n| EMPLOYER_BAS_AMT | Employer basis amount |\r\n| RTH_CTRB_FST_YR | First Roth Contribution Year |\r\n\r\n## Tables Affected\r\n\r\n- `Region.EE_BASIS`\r\n- `Region.WITHDRAWAL_DETAIL`\r\n- `Region.TRANSACT_DETAIL`\r\n- `Region.EE_COST_BASIS` (plans with ER stock basis only)\r\n\r\n## Transactions That Adjust Basis\r\n\r\n- Contributions\r\n- Negative contributions\r\n- Withdrawals\r\n- Loan defaults\r\n\r\n## Transactions That Do NOT Adjust Basis\r\n\r\n- Loan payments\r\n- Rollovers\r\n- Takeovers\r\n- Loans\r\n\r\n## Rules and Notes\r\n\r\n- **Do not load basis for 457 plans**\r\n- Only load Cost Basis for stock funds and NQ plan re-registrations\r\n- Roth did not start until 2006 — load Roth basis for all participants with Roth balances\r\n- Roth hardship amount is assumed equal to Roth basis unless otherwise specified\r\n- Even if hardship withdrawals are not allowed, load basis if it is provided\r\n- Only one takeover (T row) can exist per plan\r\n- Hardship suspension dates: load only end or re-entry dates via SQL\r\n- Distinguish stale dated checks from true after-tax basis when applicable\r\n\r\n## Basis Verification\r\n\r\nAfter loading, verify by summing contributions by source and plan year, then subtracting withdrawals, negative contributions, and loan defaults. Reference tables:\r\n- `transact_detail` (current and archived)\r\n- `withdrawal_detail`\r\n\r\n## Queries\r\n\r\n- `TO_BASIS.sql` — referenced query for basis verification (exact path in source documentation)\r\n\r\n## See Also\r\n\r\n- [[eds]]\n- [[processes/eligibility-loading|loading-eligibility-eds]]\n- [[loading-ytd-contributions-eds]]\n- [[final-files-processing]]\n- [[census-data]]"},{"id":"data-loading/loading-ytd-contributions-eds","slug":"loading-ytd-contributions-eds","rel":"data-loading/loading-ytd-contributions-eds.md","namespace":"data-loading","title":"Loading YTD Contributions through EDS","summary":"Procedure for loading year-to-date contribution data through EDS during plan conversion.","updated":"2026-06-25","created":"2026-04-16","sources":1,"status":"needs-review","tags":["eds","ytd","contributions","process","system"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Loading YTD Contributions through EDS","type":"data-loading","tags":["eds","ytd","contributions","process","system"],"created":"2026-04-16","updated":"2026-06-25","sources":1,"status":"needs-review"},"markdown":"# Loading YTD Contributions through EDS\n\nProcedure for loading year-to-date contribution data through EDS during plan conversion.\n\n## Current Documentation\n\nThe EDS hub page covers the general framework applicable to YTD loading:\n\n> **[[eds]] — see Key Functions, Layout Setup, and Output sections**\n\nYTD contribution loading context from other wiki pages:\n- YTD data is part of the final files processing phase — loaded after liquidation day\n- DC builds YTD data from final files provided by the prior vendor\n- Source mapping is required before YTD data can be loaded (each contribution source must be mapped to a TA Source ID)\n- One layout per data type applies — the YTD layout is set up independently of other EDS layouts\n\n> **[[final-files-processing]] — see YTD data loading context**\n\nThe source document (`raw/new mds/Loading YTD Contributions through EDS.md.txt`) exists but is currently empty. Full step-by-step documentation pending.\n\n## Source Notes\n\nCurrent content is derived from [[eds]] and [[final-files-processing]]. The dedicated YTD loading source still needs to be populated and ingested.\n\n## Full Documentation\n\nWhen the source is populated and ingested, this page will cover: layout configuration for YTD data, required fields and formatting, source ID mapping requirements, processing order relative to other final files, and error handling.\n\n## See Also\n- [[eds]]\n- [[processes/eligibility-loading|loading-eligibility-eds]]\n- [[loading-basis-eds]]\n- [[final-files-processing]]\n- [[source-mapping]]"},{"id":"troubleshooting/loan-failures","slug":"loan-failures","rel":"troubleshooting/loan-failures.md","namespace":"troubleshooting","title":"Loan Load Failures","summary":"Three loan-load failures that come up in practice where the loan file looks structurally fine but the numbers don't reconcile. These are business-state problems, not file-format problems — the fix usually runs through the prior record keepe","updated":"2026-07-08","created":"2026-07-08","sources":1,"status":"active","tags":["troubleshooting","loans"],"type":"troubleshooting","extras":[],"media":[],"meta":{"title":"Loan Load Failures","type":"troubleshooting","tags":["troubleshooting","loans"],"created":"2026-07-08","updated":"2026-07-08","sources":1,"status":"active"},"markdown":"# Loan Load Failures\n\nThree loan-load failures that come up in practice where the loan file looks structurally fine but the numbers don't reconcile. These are business-state problems, not file-format problems — the fix usually runs through the prior record keeper, not through the file. Process-level traps (Header ≠ Source, deemed-field rules, vendor name mismatches) are covered in [[loan-setup]] and [[informatica-loan-module]].\n\n## 1. Frozen plan — loans never re-amortized\n\n**What you see:** NPER (remaining periods) and outstanding balance on the loan file don't match what the participant has actually been paying down. The file loads or validates fine at first glance.\n\n**Why:** When a plan is frozen at the prior record keeper, the vendor often stops re-amortizing the loans. Repayment schedules drift while the plan sits frozen, so the file's schedule no longer reflects reality.\n\n**What to do:** Treat the file as suspect for every loan on a frozen plan. Reconcile against actual repayment history and go back to the prior record keeper for corrected loan data — don't hand-adjust the file to force it through.\n\n## 2. Recent refinance that didn't fully complete\n\n**What you see:** Partial or contradictory state on a single participant's loan — the old loan isn't fully settled and/or the new one isn't fully active.\n\n**Why:** The participant refinanced shortly before the conversion cutoff, and the prior record keeper's records never fully settled the old loan or activated the new one before the file was cut.\n\n**What to do:** Goes back to the vendor for a re-pull. There is no clean way to load a half-completed refinance from a stale file.\n\n## 3. Detail report vs. source breakdown — off by one payment\n\n**What you see:** The loan detail report disagrees with the source breakdown, and the variance suspiciously matches one principal payment.\n\n**Why:** One of the two reports is inaccurate — it was cut before the last payment posted, so it's missing exactly one payment. The variance is too clean a number to be anything else.\n\n**What to do:** Identify which report is stale and re-request that one from the prior record keeper. Once you know to look for the one-payment signature, this is easy to spot.\n\n## General Rule\n\nWhen loan numbers don't add up for business-state reasons like these, don't reach for the file — reach for the prior record keeper. Manual fixes paper over a record-keeping problem that will resurface in repayment processing.\n\n## See Also\n\n- [[loan-setup]]\n- [[informatica-loan-module]]"},{"id":"data-loading/loan-setup","slug":"loan-setup","rel":"data-loading/loan-setup.md","namespace":"data-loading","title":"Loan Setup & Processing","summary":"How a plan's outstanding participant loans move from a prior record keeper into P3 — a 14-step workflow across two systems (P3 + Informatica) and three phases (setup, validation, takeover).","updated":"2026-07-08","created":"2026-04-18","sources":4,"status":"current","tags":["loans","p3","informatica","conversion","takeover-loans","holb"],"type":"data-loading","extras":[],"media":[{"id":"fig-1","caption":"Loan loading diagram — P3 setup, loan header/source validation, Informatica test and production runs, Takeover Loans, HOLB handling, confirmation email, AQT verification, and audit evidence.","src":"diagrams/loan-loading-detail.png","type":"diagram"},{"id":"fig-2","caption":"Adding the prior record keeper — Name field only, all other fields left blank.","src":"SS/Loans_Prior Vendor Entry.jpg","type":"screenshot"},{"id":"fig-3","caption":"Conversions list after the prior record keeper is saved — confirms the entry before moving to the Conversion tab.","src":"SS/Loans_After Prior Vendor.jpg","type":"screenshot"},{"id":"fig-4","caption":"Generated Conversion Number on the saved record — copy this; it's referenced in every later step.","src":"SS/Loans_Conversion Number.png","type":"screenshot"},{"id":"fig-5","caption":"P3 → Conversions → Existing Plan — the entry point for Takeover Loans.","src":"SS/Loans_Existing Conversion.jpg","type":"screenshot"}],"meta":{"title":"Loan Setup & Processing","type":"data-loading","tags":["loans","p3","informatica","conversion","takeover-loans","holb"],"created":"2026-04-18","updated":"2026-07-08","sources":4,"status":"current"},"markdown":"# Loan Setup & Processing\r\n\r\nHow a plan's outstanding participant loans move from a prior record keeper into P3 — a 14-step workflow across two systems (P3 + Informatica) and three phases (setup, validation, takeover).\r\n\r\n## Overview\r\n\r\nWhen a plan converts to Transamerica with active loans, the loans must be re-created on P3 with their full repayment state intact: outstanding balance, source allocations, NPER (remaining periods), and any deemed status. The process is **strictly ordered**. P3 setup must complete before validation; validation must pass before Informatica runs; Informatica must succeed before Takeover Loans is submitted; Takeover Loans must finish before confirmation queries run.\r\n\r\nThe most common failure point is **Step 8 — Header = Source validation**. If the loan file's outstanding balance does not match the source totals exactly, every downstream system will compound the variance and the load will have to be reversed.\r\n\r\n![Loan loading diagram — P3 setup, loan header/source validation, Informatica test and production runs, Takeover Loans, HOLB handling, confirmation email, AQT verification, and audit evidence.](diagrams/loan-loading-detail.png)\r\n\r\n## Why It Matters\r\n\r\nA converting plan often arrives with hundreds of active loans, each with its own outstanding balance, source allocations, and remaining repayment schedule. Because every later step assumes loan setup is correct, a small mistake at setup compounds:\r\n\r\n- **Source balances** include outstanding loan principal — if loan principal is wrong, source balances are wrong.\r\n- **Loan repayment processing** depends on correct NPER (remaining periods) — incorrect setup causes participants to over- or under-pay.\r\n- **Deemed loan tax reporting** depends on the Deemed Date / Deemed Amount fields being correctly populated at setup.\r\n- **Takeover Loans is a one-shot system action** — reversing it requires manual intervention from the Loan team.\r\n\r\nThis is why discipline at Steps 3, 8, and 9 matters more than the rest combined.\r\n\r\n## Trigger\r\n\r\nA plan in conversion has loans on its [[toa]] (or signed loan section), the loan import file has been received from the prior record keeper, and the [[roles/lm-dc]] is ready to set up the conversion in P3.\r\n\r\n## Steps\r\n\r\n### Phase I · Setup in P3 (blue)\r\n\r\n#### 1. Open P3 and navigate to the plan — DC\r\nPull up the plan record by name or case number. Confirm with the client that the **effective date** is locked. The loan import file should be saved and accessible. Note up front whether the file contains **deemed loans** — that decides which Step 9 path applies.\r\n\r\n#### 2. Top-right dropdown → Conversions — DC\r\nFrom the plan record, open the top-right dropdown and choose **Conversions**. This opens the conversions management area for this plan.\r\n\r\n#### 3. Add Record Keeper — Name only — DC\r\nClick **Add Record Keeper**. Enter the **Name field only** — leave address, contact, and other fields blank. Click **Apply**, then **Save**. Filling extra fields here causes downstream lookup mismatches in the Informatica Loan Module (the prior vendor name must match `censuslookupfile.xls` exactly — see [[informatica-loan-module]]).\r\n\r\n![Adding the prior record keeper — Name field only, all other fields left blank.](SS/Loans_Prior Vendor Entry.jpg)\r\n\r\n![Conversions list after the prior record keeper is saved — confirms the entry before moving to the Conversion tab.](SS/Loans_After Prior Vendor.jpg)\r\n\r\n#### 4. Conversion tab → New Conversion — DC\r\nFrom the Conversions area, open the **Conversion** tab and click **New Conversion**. This creates the conversion record that every later step writes to.\r\n\r\n#### 5. Enter case number — No Affiliate — Press Enter — DC\r\nType the case number, choose **No Affiliate** from the affiliate dropdown, and press **Enter**. A new record screen loads with the date fields ready to complete.\r\n\r\n#### 6. Enter conversion / assign / effective dates — DC\r\nThree date fields. Two are derived from the effective date:\r\n- **Conversion Date** = effective date − 3 months\r\n- **Assign Date** = effective date − 3 months (same as Conversion Date)\r\n- **Effective Date** = the actual plan effective date\r\n\r\n#### 7. Conversion number generated — note it — DC\r\nSave the record. P3 generates a **Conversion Number** (CV-yyyy-####). Record it — every subsequent step (Informatica parameter file, Takeover Loans submit, confirmation queries) needs it.\r\n\r\n![Generated Conversion Number on the saved record — copy this; it's referenced in every later step.](SS/Loans_Conversion Number.png)\r\n\r\n### Phase II · File Validation & Informatica Load (yellow)\r\n\r\n#### 8. Confirm Loan Header balance = Loan Source totals — DC ⚠ critical\r\n**This is the most important step in the process.** The outstanding balance in the **Loan Header** record must match the total on the **Loan Source** record **exactly** — to the cent. Any variance, however small, must be reconciled before proceeding.\r\n\r\nValidation checklist:\r\n- Outstanding balance in Loan Header = total on Loan Source exactly\r\n- All loan records reviewed for completeness\r\n- Participant IDs in the loan file match participant records in P3\r\n\r\nIf totals do not match, contact the prior record keeper for a corrected file before going further.\r\n\r\n#### 9. Check Deemed Date & Deemed Amount fields — DC\r\nTwo fields with non-obvious blank-vs-zero rules:\r\n- **Deemed Date** — leave **blank** if there is no deemed date.\r\n- **Deemed Amount** — enter `0` if there is none. **Never leave blank.** A blank Deemed Amount throws an Informatica import error.\r\n\r\nIf the file contains deemed loans, every deemed record must have both fields populated with the actual deemed date and a non-zero deemed amount.\r\n\r\n#### 10. Run Informatica Load — DC\r\nProcess the loan file through the [[informatica-loan-module]] using the recorded Conversion Number and the prior record keeper Name from Step 3. Pre-flight checklist:\r\n- Header balance = Source total confirmed\r\n- Deemed Date / Amount fields verified\r\n- Conversion number from P3 recorded\r\n- Import file saved and path accessible\r\n\r\n**Test → Production toggle.** The Informatica loan workflow has a test mode controlled by a `test = Y/N` flag on the parameter file:\r\n\r\n1. **First run:** set `test = Y`. If it completes with no errors and the load looks clean, proceed.\r\n2. **Second run:** flip to `test = N` and re-run for production.\r\n3. If the test run errors, fix the underlying issue before flipping — don't run production over a known problem.\r\n\r\nThe module loads `PENSION.CONV_LOAN` (header) and `PENSION.CONV_LOAN_PRIN` (source balance). After it runs, check the **Loan Compare file** (all differences must equal `0`) and the **Loan BEE detail** for errors before continuing.\r\n\r\n### Phase III · Takeover Loans & Confirmation (green)\r\n\r\n#### 11. P3 → Conversions → Existing Plan → Takeover Loans → Submit — DC\r\nNavigate back to P3:\r\n- **P3** → **Conversions dropdown** → **Existing Plan** → **Takeover Loans** → **Submit**\r\n- Enter the plan in the search field\r\n- Select **Takeover Loans** from the dropdown\r\n- Press **Submit** to proceed to the upload screen\r\n\r\n![P3 → Conversions → Existing Plan — the entry point for Takeover Loans.](SS/Loans_Existing Conversion.jpg)\r\n\r\n#### 12. Click Upload — bottom-left corner — DC\r\nThe Upload button is in the **bottom-left corner** of the upload screen. Click it. Wait for processing — **do not navigate away or refresh** while the upload runs. The system queues a confirmation email when it finishes.\r\n\r\n**HOLB branch.** Before clicking Upload, check whether a [[holb|HOLB]] (Highest Outstanding Loan Balance) file exists for this plan:\r\n\r\n- **HOLB file exists** → upload it directly using the upload button\r\n- **No HOLB file** → click **Upload and Create** instead — P3 derives HOLB values from the loan data being loaded\r\n\r\nHOLB drives the loan hierarchy when a participant has multiple loans active and determines how repayments split across those loans. Both branches result in valid loan records; the difference is whether HOLB comes from a separate file or gets computed during this upload.\r\n\r\n#### 13. Wait for system confirmation email — DC\r\nThe system emails confirmation: number of loans loaded and any errors encountered. Do **not** run confirmation queries until this email arrives. If the email reports errors, review the Informatica log before proceeding — do not paper over errors with manual fixes.\r\n\r\n#### 14. Run confirmation queries — DC\r\nAfter a clean confirmation email, run the standard verification queries against the conversion to confirm loan count, total balance, and active status. Log the case number, conversion number, and effective date. Loan setup and processing is complete.\r\n\r\nThe confirmation query output (essentially the loaded loan header file) feeds into the [[audit-pack]] for QA review.\r\n\r\n## Handoff Points\r\n\r\n| # | From → To | What Moves | Risk |\r\n|---|-----------|------------|------|\r\n| 1 | Prior RK → DC | Loan import file (header + source) | Stale or partial file → Step 8 fails |\r\n| 2 | DC → P3 (Step 3) | Record Keeper name only | Extra fields filled → vendor lookup mismatch in Informatica |\r\n| 3 | DC → P3 (Step 7) | Conversion record saved | Effective date wrong → all derived dates wrong |\r\n| 4 | DC → Informatica (Step 10) | Conversion # + RK name + file | Vendor name ≠ `censuslookupfile.xls` → \"Nper is null\" |\r\n| 5 | Informatica → P3 | Loaded `CONV_LOAN` + `CONV_LOAN_PRIN` rows | Loan Compare ≠ 0 → reconcile before Takeover |\r\n| 6 | DC → P3 Takeover Loans (Step 11) | Submit + Upload | Navigate away during upload → must restart |\r\n| 7 | P3 → DC mailbox | Confirmation email | DC runs queries before email arrives → false positive |\r\n\r\n## Timing / Deadlines\r\n\r\n- **Phase I (P3 setup):** ~30 minutes once dates and case number are confirmed.\r\n- **Phase II (Validation + Informatica):** highly variable. If Header = Source on first check, ~20 minutes. If reconciliation is needed, can stretch into days while waiting on the prior RK.\r\n- **Phase III (Takeover + email):** upload itself is a few minutes; the confirmation email typically arrives within 15–30 minutes but can take longer under load.\r\n- **Sequencing:** loan setup must complete **before** participant balances post in [[final-files-processing]] — loan principal flows into source balances and the math will not reconcile if loans land later.\r\n\r\n## Failure Modes\r\n\r\n- **Header ≠ Source.** Any variance (Step 8) means the wrong totals will load. Reverse and re-pull the file from the prior RK before continuing.\r\n- **Deemed Amount left blank.** Step 9 trap — the field rejects null even when there's no deemed loan. Always enter `0`.\r\n- **Record Keeper name mismatch.** Extra fields entered in Step 3, or a name that does not exactly match `censuslookupfile.xls`, surfaces as \"Nper is null or zero\" in Informatica.\r\n- **Loans loaded after balances.** Sequence reversed — loan principal lands in source balances out of order; reconciliation breaks. Run loan setup first.\r\n- **Confirmation queries before email.** Returns partial state mid-load and looks like missing data. Wait for the email.\r\n- **Reload during Step 12.** Aborts the upload silently in some cases. Leave the tab alone.\r\n\r\n## Real-World Loan Trouble (Beyond Process Traps)\r\n\r\nThe traps above are mostly procedural. Loans also break for **business-state reasons** that the file looks fine for at first glance:\r\n\r\n- **Plan was frozen at the prior RK.** When a plan is frozen, the prior vendor often stops re-amortizing the loans. Repayment schedules drift. The loan file lands looking valid but the NPER and outstanding balance no longer match what the participant has actually been paying down.\r\n- **Recent refinance that didn't fully complete.** A participant refinanced shortly before the conversion cutoff and the prior RK's records didn't fully settle the old loan / activate the new one. The file shows partial state. Goes back to the vendor for a re-pull.\r\n- **Detail report ≠ source breakdown by ~one principal payment.** When the loan detail report disagrees with the source breakdown by an amount that suspiciously matches one principal payment, it usually means **one of the two reports dropped the last payment**. Easy to spot once you know to look — the variance is too clean a number to be anything else. Identify which report is stale and re-request it.\r\n\r\nThese are the ones that take judgment, not just a checklist. When something doesn't add up, don't reach for the file — reach for the prior RK. Full symptom/resolution detail for each scenario: [[loan-failures]].\r\n\r\n## See Also\r\n\r\n- [[informatica-loan-module]]\r\n- [[loan-failures]]\r\n- [[loan-setup]]\r\n- [[informatica]]\r\n- [[final-files-processing]]\r\n- [[plan-conversion-handoffs]]\r\n- [[roles/lm-dc]]\r\n- [[toa]]\r\n- [[holb]]\r\n- [[audit-pack]]"},{"id":"glossary/ltpt","slug":"ltpt","rel":"glossary/ltpt.md","namespace":"glossary","title":"LTPT","summary":"**Full Name:** Long-Term Part-Time (Eligibility)","updated":"2026-04-15","created":"2026-04-15","sources":1,"status":"current","tags":["glossary","eligibility","secure-act","ltpt"],"type":"glossary","extras":[],"media":[],"meta":{"title":"LTPT","type":"glossary","tags":["glossary","eligibility","secure-act","ltpt"],"created":"2026-04-15","updated":"2026-04-15","sources":1,"status":"current"},"markdown":"# LTPT\n\n**Full Name:** Long-Term Part-Time (Eligibility)\n\n## Definition\n\nLTPT refers to the Long-Term Part-Time eligibility category established by the SECURE Act 2.0. Effective January 1, 2025, employees who work at least 500 hours in two consecutive 12-month eligibility computation periods (minimum age 21) become eligible to make elective deferrals to a 401(k) or 403(b) plan — regardless of the plan's standard eligibility requirements.\n\nLTPT employees may only make **elective deferrals**; they are not eligible for employer contributions unless they also meet standard plan eligibility.\n\n## Used By\n\n- [[roles/lm-dc]] — must track hours for LTPT eligibility even for excluded-class employees; uses EDS status codes 5 and 6\n- [[eds]] — two new status codes added for LTPT: **5** = Not eligible, kit mailed due to LTPT; **6** = Eligible, LTPT\n\n## See Also\n\n- [[ltpt-eligibility]] — full concept page\n- [[eligibility]] — general eligibility processing\n- [[eds]]"},{"id":"data-loading/ltpt-eligibility","slug":"ltpt-eligibility","rel":"data-loading/ltpt-eligibility.md","namespace":"data-loading","title":"LTPT Eligibility (Long-Term Part-Time)","summary":"A Secure Act 2.0 eligibility requirement that entitles long-term part-time employees to make elective deferrals, even if they have not met the plan's standard eligibility rules. Effective January 1, 2025, the threshold is two consecutive 12","updated":"2026-04-15","created":"2026-04-15","sources":1,"status":"current","tags":["eligibility","ltpt","secure-act-2","part-time","deferrals","concept"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"LTPT Eligibility (Long-Term Part-Time)","type":"data-loading","tags":["eligibility","ltpt","secure-act-2","part-time","deferrals","concept"],"created":"2026-04-15","updated":"2026-04-15","sources":1,"status":"current"},"markdown":"# LTPT Eligibility (Long-Term Part-Time)\n\nA Secure Act 2.0 eligibility requirement that entitles long-term part-time employees to make elective deferrals, even if they have not met the plan's standard eligibility rules. Effective January 1, 2025, the threshold is two consecutive 12-month periods with 500+ hours worked.\n\n## Definition\n\nLTPT (Long-Term Part-Time) eligibility is a federal mandate under the **Secure Act 2.0** that requires plan sponsors to allow certain part-time employees to participate in elective deferrals. It applies regardless of the plan's standard eligibility rules.\n\nThe key threshold: **500 hours in two consecutive 12-month eligibility computation periods** (age 21 minimum also applies).\n\n## Why It Matters\n\nPrior to this rule, many part-time employees were excluded from 401(k) and 403(b) plans by standard eligibility requirements (e.g., 1,000 hours/year). LTPT eligibility closes that gap. For the DC, this means:\n- New data to track and load\n- New participant status codes in EDS\n- Hours data must be requested and loaded going back to the start of the computation periods\n- Even excluded-class employees (e.g., union workers) may need hours tracked in case they switch to a covered class\n\n## Current Rule (As of January 1, 2025)\n\n| Item | Rule |\n|------|------|\n| Hours threshold | 500 hours per computation period |\n| Consecutive periods required | **2** (reduced from 3 for 401(k) as of Jan 1, 2025) |\n| Applies to | 401(k) and 403(b) plans |\n| Minimum age | 21 |\n| What they can do | Make elective deferrals only |\n| What they cannot do | Receive employer contributions (unless they meet standard eligibility) |\n\n## What Changed January 1, 2025\n\nThe Secure Act 2.0 reduced the required consecutive computation periods from **three to two** for both 401(k) and 403(b). This change means more part-time employees qualify sooner.\n\nFor plans converting to Transamerica after January 1, 2025: request **two years** of historic hours data (2023 and 2024 minimum). For plans converting earlier, the three-year requirement may still apply to some participants.\n\n## Historic Hours Data to Request\n\nFor participants who have not met the plan's regular eligibility requirements:\n\n| Plan Type | Computation Periods to Request |\n|-----------|-------------------------------|\n| 401(k) | 2023 and 2024 (two consecutive periods) |\n| 403(b) | 2023 and 2024 (two consecutive periods) |\n\nHours should be requested **by pay period** from the client or prior record keeper.\n\n## Who Is Exempt\n\nLTPT eligibility rules **do not apply** to:\n- Employees whose eligibility is based on **elapsed time** (not hours)\n- Employees in an **excluded class** — such as collectively bargained employees or non-resident aliens — *while they remain in that class*\n\n**Important:** Even exempt employees (excluded classes) should have hours tracked. If they move from an excluded class to a covered class, the LTPT clock should already have been running.\n\n## EDS Status Codes\n\nTwo new eligibility status codes were introduced for LTPT:\n\n| Code | Meaning |\n|------|---------|\n| **5** | Not eligible; kit mailed due to LTPT eligibility |\n| **6** | Eligible, LTPT |\n\nThese codes are passed in from the payroll/census file. The client must be able to provide these codes or the data to derive them.\n\n## Loading LTPT Data\n\nWhen loading participants under LTPT eligibility:\n\n**For Status 5 (not yet eligible, LTPT-tracked):**\n- Client does not provide a consecutive-year counter\n- Create pending records to true participants up due to LTPT (long-term part-time)\n- Create pending records for when the participant will become fully eligible\n\n**For Status 6 (LTPT eligible):**\n- Load the LTPT entry date if provided\n- If no date provided, the load job calculates it as the start of the third computation period (under old rules) or appropriate period under new rules\n- Create rows on PES to indicate LTPT eligibility has been met\n- Create pending records for when the participant next becomes eligible to become fully eligible (i.e., meets standard eligibility)\n\n## Interaction with Standard Eligibility\n\nLTPT is a **floor**, not a replacement for standard eligibility:\n- A participant who qualifies via LTPT can only defer — no employer contributions\n- Once the participant meets standard eligibility, they become fully eligible including employer contributions\n- The system must track both LTPT status and standard eligibility status simultaneously\n\n## Evidence / Examples\n\nFrom the DC Training Notebook (June 10, 2024 / January 1, 2025 effective):\n- Plans are updated in NBI with conversion steps for LTPT handling\n- Training presentations available: `LTPT - Training Presentation 3.24.24.pptx` and `LTPT Regulatory Project_01.25.2024.pptx`\n\n## Related Concepts\n\n- [[eligibility]] — Standard eligibility processing\n- [[deferrals]] — Deferral loading (LTPT participants can only defer)\n- [[eds]] — EDS layout must support status codes 5 and 6\n- [[plan-classes]] — Class-based eligibility; excluded classes and the LTPT tracking exception\n\n## See Also\n\n- [[eligibility]]\n- [[deferrals]]\n- [[eligibility-and-deferrals]]\n- [[eds]]\n- [[plan-classes]]\n- [[roles/lm-dc]]"},{"id":"lifecycle/nbi","slug":"nbi","rel":"lifecycle/nbi.md","namespace":"lifecycle","title":"NBI","summary":"Internal system where new plan assignments are loaded and tracked. The starting point for every DC's involvement in a new plan.","updated":"2026-07-08","created":"2026-04-14","sources":2,"status":"current","tags":["system","assignment","plan-tracking"],"type":"lifecycle","extras":[],"media":[],"meta":{"title":"NBI","type":"lifecycle","tags":["system","assignment","plan-tracking"],"created":"2026-04-14","updated":"2026-07-08","sources":2,"status":"current"},"markdown":"# NBI\r\n\r\nInternal system where new plan assignments are loaded and tracked. The starting point for every DC's involvement in a new plan.\r\n\r\n## Overview\r\n\r\nWhen a new sale is finalized, the plan assignment is entered into NBI. NBI tracks which DCs, COMs, and other roles are assigned to each plan. Empty spots in NBI trigger the NBI assignment coordinator to reach out to managers for assignment.\r\n\r\n## Key Functions\r\n\r\n- Tracks plan assignments by role (DC, COM, etc.)\r\n- Flags unassigned (\"empty\") slots\r\n- Acts as the official record of who owns what\r\n\r\n## Assignment Flow\r\n\r\n1. New sale → loaded into NBI\r\n2. Empty DC slots detected → the NBI assignment coordinator (currently Ellen Miller) notifies the DC's manager\r\n3. Manager reviews caseload, conversion type, and capacity, then distributes the plan to a DC\r\n4. Plan is now tagged to the DC in NBI — officially on the DC's radar\r\n\r\nNotes on the coordinator role:\r\n- The coordinator contacts DC **managers**, not DCs directly — the manager makes the assignment decision.\r\n- The coordinator handles **all plans**, regardless of type or market segment.\r\n\r\n## DC Interaction\r\n\r\nNBI is a **universal checklist** for every plan. Every time anything happens — a document received, a change made, a milestone hit — it gets logged in NBI.\r\n\r\nStructure:\r\n- **Sections per role:** DCs, TCs, and other team members each have their own checklist sections within the plan's NBI record\r\n- **Notes field:** Space for free-form notes on each entry\r\n- **Date stamps:** When things were done\r\n- **Universal visibility:** Anyone can jump into NBI to check the current status of any plan\r\n\r\nThe DC updates NBI continuously throughout the conversion — not just at the end. Every milestone, receipt, and action is logged.\r\n\r\n## Key Facts\r\n\r\n- **Full name:** New Business Intelligence\r\n- **Access:** Web-based tool\r\n- **Visibility:** DCs can see **all plans** — not just their own. History is also visible.\r\n- **Checklist structure:** All standard items — not free-form. Every DC works from the same checklist structure.\r\n\r\n## See Also\r\n\r\n- [[p3]]\r\n- [[dc-onboarding-workflow]]"},{"id":"glossary/nsa","slug":"nsa","rel":"glossary/nsa.md","namespace":"glossary","title":"NSA","summary":"**Full Name:** New Sale Announcement","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["glossary","acronym","com","sales","trigger"],"type":"glossary","extras":[],"media":[],"meta":{"title":"NSA","type":"glossary","tags":["glossary","acronym","com","sales","trigger"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# NSA\n\n**Full Name:** New Sale Announcement\n\n**Definition:** The internal notification issued when a new retirement plan has been sold and is entering the implementation pipeline. Receipt of the NSA is the trigger that starts the [[roles/com]] workflow.\n\n**Used By:** COM (primary recipient); likely originates from a sales or business development team.\n\n## See Also\n\n- [[concepts/nsa]] — concept page with workflow detail\n- [[roles/com]]"},{"id":"onboarding/lm-dc","slug":"lm-dc","rel":"onboarding/lm-dc.md","namespace":"onboarding","title":"Onboarding Guide: Large Market Data Consultant","summary":"A reading list for anyone new to the LM DC role at Transamerica. Read these pages in order. Each one builds on the last.","updated":"2026-07-08","created":"2026-04-14","sources":1,"status":"current","tags":["onboarding","lm-dc","data-consultant","large-market"],"type":"onboarding","extras":[],"media":[],"meta":{"title":"Onboarding Guide: Large Market Data Consultant","type":"onboarding","tags":["onboarding","lm-dc","data-consultant","large-market"],"created":"2026-04-14","updated":"2026-07-08","sources":1,"status":"current"},"markdown":"# Onboarding Guide: Large Market Data Consultant\n\nA reading list for anyone new to the LM DC role at Transamerica. Read these pages in order. Each one builds on the last.\n\n## Who This Is For\n\nNew hires or transfers into the Large Market Data Consultant role. Also useful for anyone on a partner team (COM, QA, TC) who wants to understand what a DC actually does.\n\n## Reading Order\n\n1. **[[lifecycle/lm-dc|lm-dc]]** — Start here. Understand the full scope of the role, every system you'll use, and every team you'll touch.\n\n2. **[[dc-onboarding-workflow]]** — The master 7-phase checklist. This is the job, start to finish. Bookmark it. You'll come back constantly.\n\n3. **[[conversion-types]]** — Everything downstream depends on whether a plan is cash, mapping, or transfer in kind. Learn these cold.\n\n4. **[[plan-conversion-handoffs]]** — How work moves between teams. Read this alongside the workflow so you understand not just your steps, but where things come from and where they go.\n\n5. **[[nbi]]** — The universal plan checklist. You will live in this system. Understand what it tracks and when to update it.\n\n6. **[[p3]]** — Your main platform. Where plans live, where you process files, where you fix things.\n\n7. **[[p2]]** — The back-end region you'll use on liquidation day to create transfer reference numbers. Separate from P3 — know the difference before you're in the moment.\n\n8. **[[eds]]** — How files get validated and processed. Always read the output after every run.\n\n9. **[[navigation-paths]]** — Exact click-paths for the P2/P3 tasks above. Keep it open while you learn the systems.\n\n10. **[[census-data]]** — Participant data loading: what's required, how to validate it in EDS, audit checks, and when to use vendor data instead of client data. This is one of the first things you'll work on.\n\n11. **[[prd]]** — The Plan Review Document. Understand what sections DC focuses on: eligibility, vesting, sources, classes.\n\n12. **[[subpack]]** — The internal TA execution plan. Supposed to be complete by COM at the start. Know how to work without it when it's missing.\n\n13. **[[cccs-submission-package]]** — How to read the CCCS as a DC: plan types, funding method, asset-transfer strategy, takeover loans.\n\n14. **[[toa]]** — Transfer of Assets. Triggers the mapping phase. Know what column T means.\n\n15. **[[fund-mapping]]** — First mapping you build after TOA is signed. No test files needed.\n\n16. **[[source-mapping]]** — Second mapping. Requires test files. Needs AQT and EDS.\n\n17. **[[prior-record-keeper]]** — How to work with the outgoing administrator: questionnaire, test files, wire coordination.\n\n18. **[[wire-instructions]]** — Send early. Resend before liquidation. Know the default account.\n\n19. **[[wire-routing]]** — The State Street account table, Cashiering pull times, and the 3 PM CST cutoff.\n\n20. **[[ftp-connection]]** — Payroll vendor file upload channel. Request this early — FTP team has a big queue.\n\n21. **[[fund-management-calendar]]** — Must be updated before the trade cutoff on any day trades go out. Missing this is a serious process failure. Know it before your first liquidation day.\n\n22. **[[liquidation-day]]** — The main event. Read this multiple times. Understand the sequence for each conversion type.\n\n23. **[[dummy-participant]]** — Required for mapping conversions. Must exist before Day of Wire. SSN 999-00-0000.\n\n24. **[[informatica]]** — Day of Wire and Participant Balance workflows. Day of Wire cannot be tested — understand why.\n\n25. **[[conv-file]]** — The input file for the Day of Wire workflow. Know its structure and how to build it before you're under liquidation-day pressure.\n\n26. **[[final-files-processing]]** — After liquidation: balances, YTD data, deferrals, eligibility. Order matters.\n\n27. **[[loading-basis-eds]]** — Basis loading procedure: EE basis fields, transaction rules, Roth considerations, and 457 plan restrictions. Loaded as part of final files.\n\n28. **[[eligibility-and-deferrals]]** — Deferrals before eligibility. Always. No exceptions.\n\n29. **[[tik-transfer]]** — If you have a TIK plan, read this before you contact the re-registration team.\n\n30. **[[audit-pack]]** — What you build at the end. Understand what goes in it and where it lives.\n\n31. **[[prod-support]]** — When standard tools can't fix the data, Prod Support can. Know how AWD tickets work.\n\n32. **[[query-library]]** — The SQL you'll eventually need: source mapping, basis, census audits. Skim now, return when you need it.\n\n## Key People to Meet\n\n- **Your direct manager** — Intro meeting in first week.\n- **The NBI assignment coordinator** — Manages plan assignments. In your workflow from day one.\n- **Your COM counterpart** — The COM assigned to your first plan. Get their contact info early.\n- **The Fidelity TIK / re-registration lead** — You don't need them until you have a TIK plan, but know who they are.\n- **The eligibility SME** — Go to them when eligibility questions go beyond standard patterns (see [[eligibility]]).\n- **The FTP Team setup contact** — Confirms when FTP setup is complete (see [[ftp-team]]).\n\nCurrent names for each role live on the linked pages, so this guide stays accurate when people move.\n\n## First Week Priorities\n\n- [ ] Get NBI access — you can't track your plans without it\n- [ ] Get P3 access — request through your manager\n- [ ] Get EDS access — linked from P3 menu bar\n- [ ] Find out what plans are currently in your queue\n- [ ] Read your first PRD or onboarding package\n- [ ] Shadow a DC who is currently in a live conversion\n\n## See Also\n\n- [[lifecycle/lm-dc|lm-dc]] — full role reference page\n- [[dc-onboarding-workflow]] — the master process checklist\n- [[conversion-types]] — the single most important concept to internalize early"},{"id":"lifecycle/onboarding-package","slug":"onboarding-package","rel":"lifecycle/onboarding-package.md","namespace":"lifecycle","title":"Onboarding Package","summary":"An all-in-one Excel document used for certain plan types (especially PEP plans) in place of or alongside the PRD. Contains plan provisions, TOA, source details, and other conversion specs in a single file.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["document","onboarding-package","pep","plan-provisions","discovery"],"type":"lifecycle","extras":[],"media":[],"meta":{"title":"Onboarding Package","type":"lifecycle","tags":["document","onboarding-package","pep","plan-provisions","discovery"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# Onboarding Package\n\nAn all-in-one Excel document used for certain plan types (especially PEP plans) in place of or alongside the PRD. Contains plan provisions, TOA, source details, and other conversion specs in a single file.\n\n## Overview\n\nThe onboarding package consolidates into one Excel file what might otherwise be spread across multiple documents. For PEP (Pooled Employer Plans) and some other plan types, the onboarding package is the primary plan specification document.\n\n## Contents\n\nAn onboarding package typically contains:\n- **TOA (Transfer of Assets)** — the fund mapping table\n- **Plan provisions** — eligibility, vesting, sources, investment options\n- **Source details** — source names, codes, and parameters\n- Other plan-specific fields\n\n> Everything the [[prd]] covers, plus the [[toa]], in one Excel file.\n\n## Plan Types That Use It\n\n- **PEP — Pooled Employer Plans** — always use onboarding packages\n- **All other plan types** — use the [[prd]] instead\n\nPEP plans use the onboarding package. All other plan types use the PRD. The two are mutually exclusive — a plan uses one or the other, not both.\n\n## PRD vs. Onboarding Package\n\n| | PRD | Onboarding Package |\n|--|-----|--------------------|\n| Format | Typically a Word/PDF document | Excel workbook |\n| TOA included | No (separate) | Yes (included) |\n| Used for | Most plan types | PEP plans + others |\n| Signed by client | Yes | Yes |\n| Purpose | Same — detail plan provisions |\n\n## DC Use\n\nSame as with the PRD: DC focuses on eligibility, vesting, sources, and special strategies. The rest is for other departments.\n\nThe TOA being embedded means the DC can begin [[fund-mapping]] as soon as the onboarding package is signed (same rule as standalone TOA).\n\n## Authorship and Template\n\n- **This is a TA document** — not provided by the prior record keeper\n- **COMs** put it together\n- **Standard TA template** exists — COMs work from it\n- **No additional DC-specific considerations for PEP plans** — DC processes them the same way as PRD-based plans\n\n## See Also\n\n- [[prd]]\n- [[toa]]\n- [[subpack]]\n- [[fund-mapping]]\n- [[dc-onboarding-workflow]]"},{"id":"overview","slug":"overview","rel":"overview.md","namespace":"reference","title":"Overview","summary":"This wiki is the operational reference for Large Market Data Consultants: what to do, in what order, with which systems, and who to hand things to — from case assignment through project closeout.","updated":"2026-07-08","created":"2026-04-14","sources":11,"status":"current","tags":["overview","synthesis"],"type":"reference","extras":[],"media":[],"meta":{"title":"Overview","type":"reference","tags":["overview","synthesis"],"created":"2026-04-14","updated":"2026-07-08","sources":11,"status":"current"},"markdown":"# Overview\n\nThis wiki is the operational reference for Large Market Data Consultants: what to do, in what order, with which systems, and who to hand things to — from case assignment through project closeout.\n\n## What this wiki is\n\nEvery page answers one question: **what does a DC need to know to perform this task correctly?** It is not a retirement-plan encyclopedia and not a department handbook. Other teams (COM, TC, QA, Cashiering) appear only as interfaces — what they hand you, what you hand them, and when to escalate. See [[plan-conversion-handoffs]] for the full handoff map.\n\n## How it's organized\n\n- **[[dc-onboarding-workflow|Case Lifecycle]]** — the conversion project spine, kickoff to closeout.\n- **Data Loading** — one page per load: [[census-data|census]], [[eligibility]], [[deferrals]], [[balance-import|balances]], [[loan-setup|loans]], [[loading-basis-eds|basis]], [[loading-ytd-contributions-eds|YTD]]. [[final-files-processing]] is the master sequence.\n- **Payroll** — [[payroll-vendor-onboarding|vendor onboarding]], [[ftp-connection|FTP]], [[payroll-template|file specs]], and the [[payroll-handoff-at-go-live|go-live handoff]].\n- **Conversion Ops** — [[conversion-types]], [[fund-mapping]], [[source-mapping]], [[wire-instructions|wires]], [[liquidation-day]], [[tik-transfer|TIK]].\n- **Departments** — DC-facing interfaces for [[tc|TC]], [[com|COM]], [[qa|QA]], [[cashiering|Cashiering]], [[ftp-team|FTP Team]], [[prod-support|Prod Support]].\n- **Troubleshooting** — symptom-first: [[reversal-submission|reversals]], [[loan-failures]], [[informatica-troubleshooting-guide|Informatica errors]], [[common-remitter-plans|common remitter]].\n- **Checklists** — [[day-of-wire-audit]] and other control gates.\n- **Reference** — [[query-library|SQL queries]], [[navigation-paths|system click-paths]], [[wire-routing|wire routing and cutoffs]], [[file-naming|naming conventions]], and system pages ([[p3|P3]], [[eds|EDS]], [[informatica|Informatica]], [[aqt|AQT]], [[p2|P2]]).\n\n## Operating principles\n\n1. **Do things early.** Trades, forms, FTP setup, and access requests all have lead times; the calendar drives the work and compresses at the end.\n2. **Conversion type drives everything.** Cash, mapping, or TIK ([[conversion-types]]) determines the balance import path, wire handling, and Day of Wire mechanics.\n3. **Order matters.** Deferrals load before eligibility; balances follow liquidation; [[final-files-processing]] encodes the sequence.\n4. **P3 process mode controls trades.** The wrong mode on Day of Wire moves real money the wrong way.\n5. **Always read EDS output.** A load that \"ran\" is not a load that worked.\n6. **Escalate by role, not by name.** Pages name the current person where useful, but the escalation path is the role.\n\n## See Also\n- [[index]]\n- [[dc-onboarding-workflow]]\n- [[lm-dc]]"},{"id":"reference/p2","slug":"p2","rel":"reference/p2.md","namespace":"reference","title":"P2","summary":"A back-end system region used primarily for creating and modifying transfer reference numbers. Separate from p3 but connected — changes in P2 reflect in P3.","updated":"2026-05-03","created":"2026-04-14","sources":3,"status":"current","tags":["system","ref-numbers","back-end"],"type":"reference","extras":[],"media":[{"id":"fig-1","caption":"P2 login screen — TDATEST for TD plans, CORP07 for everything else.","src":"SS/P2 login.jpg","type":"screenshot"},{"id":"fig-2","caption":"P2 home after login — top-level menu where you pick a job/option/trans path.","src":"SS/P2 second page.jpg","type":"screenshot"},{"id":"fig-3","caption":"Existing trans ref numbers for the case — the list view P2 returns after a lookup.","src":"SS/P2 ref list.jpg","type":"screenshot"},{"id":"fig-4","caption":"Add ref number screen — job 2001 / option 4 / trans 1006 entry form.","src":"SS/P2 add ref.jpg","type":"screenshot"},{"id":"fig-5","caption":"Ref number after creation — the generated YYYYMMDD + alphanumeric identifier.","src":"SS/P2 ref 2.jpg","type":"screenshot"}],"meta":{"title":"P2","type":"reference","tags":["system","ref-numbers","back-end"],"created":"2026-04-14","updated":"2026-05-03","sources":3,"status":"current"},"markdown":"# P2\n\nA back-end system region used primarily for creating and modifying transfer reference numbers. Separate from [[p3]] but connected — changes in P2 reflect in P3.\n\n## Overview\n\nP2 and P3 are two distinct system regions. P2 operates on the back end. DCs interact with P2 mainly during liquidation-related processing when ref numbers need to be created or modified.\n\n![P2 login screen — TDATEST for TD plans, CORP07 for everything else.](SS/P2 login.jpg)\n\n![P2 home after login — top-level menu where you pick a job/option/trans path.](SS/P2 second page.jpg)\n\n## Key Functions\n\n- **Creating transfer reference numbers** — one per fund on liquidation day (mapping/TIK)\n- **Modifying ref numbers** — adjustments as needed\n\n## Relationship to P3\n\nP2 and P3 are connected:\n- A change made in P2 **reflects in P3**\n- P3 is the main working environment (plan details, participant data, processing)\n- P2 is the back-end environment for ref number operations\n\nThink of P2 as the engine room and P3 as the dashboard.\n\n> **Where ref numbers actually get created.** P2 is the system of record — the actual ref number is created via the P2 back-end (job 2001 / option 4 / trans 1006). P3 is where you view, recreate, or attach those ref numbers in workflow files. When the source material says \"create ref numbers in P3\" it means using the P3 UI to surface or reference what P2 holds, not that P3 is generating new identifiers independently.\n\n## When DC Uses P2\n\n- **Liquidation day:** Create trans ref numbers (one per fund) before running the Day of Wire Informatica workflow\n- **Advanced Employer:** Setting up the advanced employer account ref number (cash conversion)\n- Any time a ref number needs to be created or adjusted\n\n![Existing trans ref numbers for the case — the list view P2 returns after a lookup.](SS/P2 ref list.jpg)\n\n![Add ref number screen — job 2001 / option 4 / trans 1006 entry form.](SS/P2 add ref.jpg)\n\n![Ref number after creation — the generated YYYYMMDD + alphanumeric identifier.](SS/P2 ref 2.jpg)\n\n## Access and Permissions\n\n- **Access method:** Separate URL interface (not within P3)\n- **Who can access:** All DCs — no special restrictions\n- **Login by plan type:**\n  - **TD plans** — log in as `TDATEST`\n  - **All other plans** — log in as `CORP07`\n\n## Trans Ref Number Format\n\n`YYYYMMDD` + ~7–8 random alphanumeric characters\n\nExample structure: `20260414A3X7KL2`\n\n## Other DC Operations in P2\n\nPrimarily ref number creation and modification. Possibly other operations — not fully documented yet.\n\n## See Also\n\n- [[p3]]\n- [[liquidation-day]]\n- [[informatica]]\n- [[conversion-types]]"},{"id":"reference/p3","slug":"p3","rel":"reference/p3.md","namespace":"reference","title":"P3","summary":"The main plan administration system. Central hub for plan configuration, participant data, processing, and queries.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["system","plan-administration","core"],"type":"reference","extras":[],"media":[],"meta":{"title":"P3","type":"reference","tags":["system","plan-administration","core"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# P3\r\n\r\nThe main plan administration system. Central hub for plan configuration, participant data, processing, and queries.\r\n\r\n## Overview\r\n\r\nP3 is TransAmerica's primary recordkeeping platform. Almost every action in a plan conversion runs through P3 — from initial plan setup through balance posting, eligibility enabling, and final processing. DCs use P3 constantly throughout the onboarding lifecycle.\r\n\r\n## Key Functions\r\n\r\n### Plan Configuration\r\n- Eligibility rules\r\n- Vesting rules and schedules\r\n- Source names and codes\r\n- Plan classes (traditional and special)\r\n- Divisions\r\n- Investment options / fund lineup\r\n\r\n### Classes in P3\r\nTwo types of classes exist:\r\n- **Traditional/regular classes** — DC can update names and codes\r\n- **Special classes** — DC cannot add; only [[doc-ops|Doc Ops]] can add new ones. DC can update existing ones.\r\n\r\nSee [[plan-classes]] for more detail.\r\n\r\n### Processing\r\n- Creating transfer reference (trans ref) numbers — done on P2 then reflected in P3, or directly on P3 (clarify)\r\n- Processing participant balances (immediate / batch / online)\r\n- Processing eligibility (enable by source)\r\n- Reversing dummy participant details via the ROC tool\r\n\r\n### EDS Integration\r\n- P3 and EDS are connected: \"P3 to EDS\" setup is where you configure file layouts for the plan\r\n- Must set up EDS layouts in P3 before testing files through EDS\r\n- See [[eds]]\r\n\r\n### Processing Modes (Critical)\r\n| Mode | When Used | What It Does |\r\n|------|-----------|-------------|\r\n| Process Immediate + Batch | Cash conversion balance posting; mapping day-of-wire | Sends trades out |\r\n| Online + No Hold | Mapping/TIK participant balance posting (after day-of-wire) | Books to ledger only, no trades |\r\n\r\n> **Rule:** If trades have already gone out (day-of-wire workflow), use **Online, No Hold** when posting participant balances. Do NOT click Process Immediate.\r\n\r\n### Eligibility\r\n- Enable per source — only sources that will have contributions\r\n- Must notify QA, TC, and COM before enabling\r\n- See [[eligibility-and-deferrals]]\r\n\r\n### ROC Tool\r\n- Used to reverse dummy participant details after balance posting\r\n- Part of P3\r\n\r\n## Setup Timing\r\n\r\nP3 setup (by Doc Ops) can happen before or after DC assignment. Earlier is better — DC needs P3 for eligibility rules, vesting, sources, classes, divisions. If P3 is set up, DC can start filling out specs immediately.\r\n\r\n> P3 setup timing varies by team caseload. Don't assume it's ready.\r\n\r\n## ROC Tool — Detail\r\n\r\nThe ROC tool is accessed from the **P3 menu bar**. It is the only place DCs are permitted to make direct changes to database tables (AQT is read-only — view only).\r\n\r\nFor dummy participant reversal after a mapping conversion:\r\n- Query to run: **\"ROC No Reversal\"**\r\n- Region: **case number starts with \"T\" → TDA; otherwise → CORP**\r\n- Enter: **case number** + **SSN** (999-00-0000 for the dummy participant)\r\n- The tool executes the reversal\r\n- Afterwards: run the verification query to confirm the dummy's records are cleared\r\n\r\n## Eligibility Navigation Path\r\n\r\n> Plan → top left dropdown → Outsourcing Summary → click Eligibility → Enable screen\r\n\r\n## See Also\r\n\r\n- [[eds]]\r\n- [[informatica]]\r\n- [[nbi]]\r\n- [[plan-classes]]\r\n- [[dummy-participant]]\r\n- [[eligibility-and-deferrals]]\r\n- [[final-files-processing]]\r\n- [[liquidation-day]]"},{"id":"vendors/paycom","slug":"paycom","rel":"vendors/paycom.md","namespace":"vendors","title":"Paycom","summary":"Paycom is a high-specificity vendor: no test-file rhythm, PGP outbound, and careful loan-number handling.","updated":"2026-07-08","created":"2026-07-08","sources":1,"status":"active","tags":["vendor","payroll"],"type":"vendor","extras":[],"media":[],"meta":{"title":"Paycom","type":"vendor","tags":["vendor","payroll"],"created":"2026-07-08","updated":"2026-07-08","sources":1,"status":"active"},"markdown":"# Paycom\n\nPaycom is a high-specificity vendor: no test-file rhythm, PGP outbound, and careful loan-number handling.\n\n## File format & naming\n\n- Paycom decides whether they will accept the OBF for a specific client.\n- Outbound uses a custom Paycom layout that follows the 1116 layout.\n- Filename is specific: `payrollvendorfeed_plan_affiliate_mmddyyyy.csv`.\n- Paycom generally does not do test files; they need to know when the live file will start.\n\n## Deduction & loan codes\n\n- Typical codes: 401K, 4ROTH, 401KC, 4ROTC, and 401L. Bonus codes may also exist.\n- Prior to January 2026, Paycom did not accept loans on the file. Beginning January 2026, Paycom can accept loans.\n- Before go-live, the client needs a report of outstanding loans so they can load Transamerica loan numbers to Paycom.\n- The client updates the loan number in Paycom Form 2. Paycom drops the date portion at the beginning of the loan number when loading it.\n\n## Stop rows & quirks\n\n- For stop rows, Paycom typically leaves the field blank.\n- Deferral effective date is current date.\n\n## FTP & PGP\n\n- All inbound files come through the global connection named PAYCOM; Paycom always pushes files to Transamerica.\n- All outbound files to Paycom are PGP encrypted once live.\n\n## See Also\n\n- [[payroll-vendor-onboarding]]\n- [[ftp-connection]]\n- [[payroll-template]]"},{"id":"vendors/paycor","slug":"paycor","rel":"vendors/paycor.md","namespace":"vendors","title":"Paycor","summary":"Paycor is often really a PayKonnect route under the covers — name both pieces clearly.","updated":"2026-07-08","created":"2026-07-08","sources":1,"status":"active","tags":["vendor","payroll"],"type":"vendor","extras":[],"media":[],"meta":{"title":"Paycor","type":"vendor","tags":["vendor","payroll"],"created":"2026-07-08","updated":"2026-07-08","sources":1,"status":"active"},"markdown":"# Paycor\n\nPaycor is often really a PayKonnect route under the covers — name both pieces clearly.\n\n## Inbound\n\n- Paycor uses [[paykonnect|PayKonnect]]. There is a global inbound and outbound connection under PAYKONNECT, but SFTP forwarding-rule work is still needed.\n- Paycor has the file specifications built and selects the large-market template for Transamerica, then maps plan-specific information.\n- Ask whether they can provide a test file before the live date — sometimes the first live file is the test file.\n- Unique plan features may require discussion and configuration.\n\n## Outbound\n\n- Paycor accepts the standard outbound file; custom outbound is usually not needed.\n- Uses Transamerica loan numbers. No PGP.\n- If the client does not know Paycor runs through PayKonnect, it is okay to explain that Paycor uses PayKonnect as a third-party integrator.\n\n## See Also\n\n- [[payroll-vendor-onboarding]]\n- [[ftp-connection]]\n- [[payroll-template]]"},{"id":"vendors/paykonnect","slug":"paykonnect","rel":"vendors/paykonnect.md","namespace":"vendors","title":"PayKonnect","summary":"PayKonnect is the third-party payroll route behind some named payroll vendors.","updated":"2026-07-08","created":"2026-07-08","sources":1,"status":"active","tags":["vendor","payroll"],"type":"vendor","extras":[],"media":[],"meta":{"title":"PayKonnect","type":"vendor","tags":["vendor","payroll"],"created":"2026-07-08","updated":"2026-07-08","sources":1,"status":"active"},"markdown":"# PayKonnect\n\nPayKonnect is the third-party payroll route behind some named payroll vendors.\n\n## Route behavior\n\n- PayKonnect is a third-party payroll provider that vendors use to send files to and receive files from Transamerica.\n- The global SFTP connection is named PAYKONNECT.\n- Paycor and Rippling both route through PAYKONNECT and both use the standard file format.\n- Capture the client-named payroll vendor, but let Jen/Eric confirm whether the actual route is PAYKONNECT.\n- Uses Transamerica loan numbers. No PGP.\n\n## See Also\n\n- [[payroll-vendor-onboarding]]\n- [[ftp-connection]]\n- [[payroll-template]]"},{"id":"vendors/paylocity","slug":"paylocity","rel":"vendors/paylocity.md","namespace":"vendors","title":"Paylocity","summary":"Paylocity has a relatively clear large-market path, but loan seeding and inbound readiness still matter.","updated":"2026-07-08","created":"2026-07-08","sources":1,"status":"active","tags":["vendor","payroll"],"type":"vendor","extras":[],"media":[],"meta":{"title":"Paylocity","type":"vendor","tags":["vendor","payroll"],"created":"2026-07-08","updated":"2026-07-08","sources":1,"status":"active"},"markdown":"# Paylocity\n\nPaylocity has a relatively clear large-market path, but loan seeding and inbound readiness still matter.\n\n## File format & naming\n\n- Outbound uses the Paylocity standard specification/1116 layout.\n- Normal naming is `Case_Affiliate_Paylocity_MMDDYYYY.csv`, but divisions or special requests can change it.\n- Paylocity typically does not do test files unless the client specifically requests them.\n- On the call, confirm they are using the Paylocity layout, the live timing, and whether loans need to be seeded.\n\n## Loans\n\n- Loans need to be seeded at Paylocity with the Transamerica loan number.\n- Paylocity needs first repayment date as the effective date on the file.\n\n## Quirks\n\n- Paylocity will not approve the outbound file to begin until the inbound file is all set.\n- Verify the plan ID has the dash in Paylocity setup (e.g. `TA069932-00033`).\n\n## FTP & PGP\n\n- Global SFTP connection is PAYLCTY. No PGP.\n\n## See Also\n\n- [[payroll-vendor-onboarding]]\n- [[ftp-connection]]\n- [[payroll-template]]"},{"id":"payroll/payroll-file-automation","slug":"payroll-file-automation","rel":"payroll/payroll-file-automation.md","namespace":"payroll","title":"Payroll File Automation","summary":"Setup rules for automated payroll file submission through PSD or FTP.","updated":"2026-07-08","created":"2026-05-13","sources":1,"status":"needs-review","tags":["concept","payroll","automation","eds","psd","ftp","p3"],"type":"payroll","extras":[],"media":[],"meta":{"title":"Payroll File Automation","type":"payroll","tags":["concept","payroll","automation","eds","psd","ftp","p3"],"created":"2026-05-13","updated":"2026-07-08","sources":1,"status":"needs-review"},"markdown":"# Payroll File Automation\n\nSetup rules for automated payroll file submission through PSD or FTP.\n\n## Definition\n\nPayroll file automation allows automated PSD or automated FTP clients to submit payroll files that map to EDS layouts. It depends on P3 remittance settings, EDS layout availability, user permissions, and FTP file-to-layout mapping.\n\n> [!warning] Source status\n> Built from legacy setup notes. Validate field names, permission groups, and ticket process before live use.\n\n## Why It Matters\n\nAutomation only works if the remittance settings, EDS layouts, PSD permissions, FTP mappings, and file movement are aligned. A missing PSD Availability flag or duplicate file name can prevent the file from being routed to the right layout.\n\n## Evidence / Examples\n\n### P3 Remittance Settings\n\n- `IM Payroll Automation?` on the **Remittance Home page** in P3 must be set to Yes for automated PSD and automated FTP clients.\n- The field displays only for IM clients.\n- The field can be updated by these P3 user types: Account Consultant/Account Admin, Call Center Associate, Cash PC Specialist, Contract Plan Services, and Product Support.\n- When enabled, `IM PSD Error Correction?` becomes enabled and must be selected. Default value: `Client Handles Errors on PSD`.\n- `TA Handles Errors` means the account manager works with the client to resolve file data errors; the AWD error report goes to the account manager.\n- `Client Handles Errors on PSD` means the client resolves errors in PSD themselves; the AWD error report goes to the end queue with status `EDSCOMPL`.\n- Field interplay quirk: with `IM PSD Error Correction?` set to `Client Handles Errors on PSD`, the `IM Payroll Automation?` field is disabled; switching to `TA Handles Errors` re-enables it.\n\n### EDS Layout Requirement\n\n- Automated PSD and FTP clients must have at least one EDS layout where `PSD Availability?` is Yes.\n- Only layouts with PSD Availability set to Yes appear for automated client use.\n- To set it: in EDS, click the layout name to open the layout, then set `PSD Availability?` to Yes.\n\n### PSD Automated Plans\n\n- One plan sponsor user needs all Automated Payroll File Access permissions so they can delegate permissions to other users.\n- To grant them: P3 User Maintenance tab → User Roles and Options for the user → select all options under the Automated Payroll File Access heading.\n- Once permissions are granted, setup for automated PSD clients is complete — the FTP mapping steps below apply only to automated FTP clients.\n\n### FTP Automated Plans\n\n- Each type of file the client submits must be mapped to a layout name.\n- Already-mapped files display in the **FTP Automation Summary** section of the Remittance Home page. Viewing or updating this section is restricted to the Cash PC Specialist P3 user.\n- To add a mapping: select the **Add FT Automation** button above the FTP Automation Summary, then complete the Add/Edit FTP Automation screen: file name (exclude any dates appended when the file is dropped to the client folder), the FTP folder the client drops the file into, and the layout name used to load the file to EDS. All fields are required.\n- File layout options come from EDS layouts with PSD Availability set to Yes. If the dropdown shows only `Select:`, no layouts have PSD Availability turned on yet.\n- File names must be unique — a duplicate produces the error \"Unable to apply requested changes, File name must be unique\" and the row is not added.\n- **Apply** on the popup stages the row; the data is only written to the `FTP_LAYOUT_MAP` table when **Save** is selected on the Remittance Home page. The same Save step is required when deleting rows (check the Delete box, then Save).\n- Editing an existing row (via the File Name link) allows changing the FTP folder and layout name; the file name itself is locked.\n\n### INFRA Ticket\n\n- An INFRA ticket is needed to automatically move client files from the client's folder to the target processing folder.\n- The ticket must specify the from-folder location, the to-folder location, and who should receive notifications if the process fails.\n- Source timing estimate: the INFRA ticket can take 3-4 business days to be processed.\n\n## Outbound Files (OBF)\n\nFiles from Transamerica back to the payroll vendor — deferral changes, new loans, payoffs. Whether this is standard or custom work depends almost entirely on what the vendor can accept. (from the payroll/OBF knowledge-transfer guide)\n\n### Standard vs. custom\n\n- The large-market **standard** outbound setup posts both Excel and text files — **separate** deferral and loan files — to [[wx]] at the frequency confirmed during installation.\n- Don't just ask whether the vendor accepts the \"standard\" file. Ask whether they can accept the large-market Excel/text **separate** deferral and loan files. If the vendor expects a **combined** deferral-and-loan CSV, that is usually custom outbound file work (the \"1116\" custom layout).\n- For standard outbound turn-on, give the payroll team **3–4 business days of lead time** before the first live file date.\n- Outbound setup may also require credentials from the vendor if Transamerica pushes the files; the FTP team may submit inbound first while waiting on those.\n\n### Working rules\n\n- **Effective dates** — deferrals can use election effective date or current run date; new loans can use first repayment date or issue date; loan payoffs can use current date or loan issue date. Confirm expectations with the vendor before layout work starts.\n- **Stop rows** — custom files (including 1116) send stop rows when loans pay off, deferrals go to zero, or deferrals change between percent and dollar. Whether the stop row carries a zero or leaves the field blank depends on client/vendor preference — confirm.\n- **Loan numbers** — two models. Some vendors (e.g., UKG, Paycom, Paylocity) can use Transamerica's unique loan number: send an outstanding loan report before go-live so they can seed their system. Others (e.g., ADP, Dayforce, sometimes Workday) require vendor deduction codes and recycled loan numbers: seed loans on Transamerica's side and enable loan deduct_c logic. This decision drives whether loan seeding is needed.\n- **Holiday roll** — the P3 outbound-file holiday roll uses previous, next, or holiday against the initial/next date. If setting up an initial OBF right before a holiday, involve production support and monitor after the roll.\n- **Late OBF jobs** — if an OBF job runs late into the evening, FTP processing can stop around 7pm. Files may generate to folders but not send by SFTP until the next morning. Usually a year-end issue.\n\n### 15-character division — custom layout\n\nSome plans need a 15-character division field on outbound files. This requires a customized layout, not a standard config:\n\n- CIT revises the standard layout — expand division to 15 positions and push all following fields down 11 spaces.\n- Before the first OBF, submit a ticket to set the plan up with the 15-char customized layout.\n- Update the OBF file format to \"6 — new format separate files for deferral and loan (15 char div)\".\n\n## Related Concepts\n\n- [[payroll-template]]\n- [[ftp-connection]]\n- [[eds]]\n- [[p3]]\n- [[wx]]\n\n## See Also\n\n- [[tc-stuff]]\n- [[roles/lm-dc]]\n- [[tc]]"},{"id":"payroll/payroll-handoff-at-go-live","slug":"payroll-handoff-at-go-live","rel":"payroll/payroll-handoff-at-go-live.md","namespace":"payroll","title":"Payroll Handoff at Go-Live","summary":"The formal procedure for transferring an incomplete payroll testing project to the Fiduciary Services team at go-live. Effective February 26, 2026. When payroll testing is not finished by the conversion go-live date, the DC submits a FILESP","updated":"2026-07-08","created":"2026-04-15","sources":2,"status":"current","tags":["payroll","go-live","handoff","fiduciary-services","filespecrq","process"],"type":"payroll","extras":[],"media":[],"meta":{"title":"Payroll Handoff at Go-Live","type":"payroll","tags":["payroll","go-live","handoff","fiduciary-services","filespecrq","process"],"created":"2026-04-15","updated":"2026-07-08","sources":2,"status":"current"},"markdown":"# Payroll Handoff at Go-Live\n\nThe formal procedure for transferring an incomplete payroll testing project to the Fiduciary Services team at go-live. Effective February 26, 2026. When payroll testing is not finished by the conversion go-live date, the DC submits a FILESPECRQ AWD ticket and the COM notifies the Account Manager.\n\n## Definition\n\nIf a plan reaches go-live before payroll testing is complete, the project does not stop — it is formally handed off to an internal team (Fiduciary Services) that handles inforce payroll projects. The DC and COM have specific responsibilities to document and transfer the project cleanly.\n\n## Why It Matters\n\nPlans go live regardless of whether payroll is ready. Payroll testing delays are common (vendor responsiveness, client data issues, format problems). Without a formal handoff process, the payroll project would be orphaned at go-live with no team assigned. This procedure ensures continuity and documents who is responsible.\n\n## When This Applies\n\nThis procedure activates **only when payroll testing is still underway at go-live**. If testing is complete before go-live, no action is needed.\n\n**The LM DC initiates the handoff — not the COM, not the AM** (from the payroll/OBF knowledge-transfer guide). Payroll testing status comes up as a discussion topic during the go-live meetings; if it's still underway, the LM DC kicks off the steps below.\n\n## Operating Model — DC Owns Bridge Work, Still Hands Off At Live\n\nThe shift from prior practice: previously, the mid-market team carried a chunk of the payroll testing/validation work and the DC took over from \"wherever they were\" at handoff. Now the DC owns ALL of the bridge work — vendor onboarding, template walkthrough, EDS validation, OnePayroll handoff, client demo (see [[payroll-vendor-onboarding]] for the full flow).\n\n**The handoff at go-live still happens regardless of where testing landed.** Some plans are not done at live — sometimes by months — and that's fine. The point of the handoff procedure below is exactly so DCs aren't handcuffed to a plan after live just to finish payroll. Pass it off as is, as best as it can be passed off, and move on.\n\n> *\"We don't have to hold on to this until the very end, because some of these can go months after the live day. And we don't need to be handcuffed to these plans for that long.\"* — [[dc-brain-dump-002|brain dump #002]]\n\n## Process\n\n### COM's Role (Before and During Go-Live)\n- COM communicates during the conversion process that if payroll is not completed by go-live, testing will continue with a different internal Transamerica team\n- Payroll status is a standard **discussion topic at go-live meetings**\n\n### If Testing Is Not Complete at Go-Live\n\n**DC Actions:**\n1. **Submit an AWD ticket** — Ticket type: **FILESPECRQ**\n   - Include in ticket: payroll contact info, client contact info, payroll file layout, summary of current testing status, details of prior test file results (link to shared drive documents)\n2. **Coordinate with any internal DC team members** who have been assisting with payroll testing — notify them the project is being passed to Fiduciary Services\n3. **Update NBI** to reflect:\n   - Testing is not complete\n   - The FILESPECRQ AWD ticket was submitted\n\n**COM Actions:**\n1. **Notify the Account Manager (AM)** that payroll testing was not completed during transition and the AWD ticket was submitted for completion by Fiduciary Services\n\n**Client/Vendor Notification:**\n1. The client and payroll vendor are notified that the payroll project is being moved to a new team\n2. **If testing is underway:** COM and DC coordinate to introduce the AM who will be picking up the project\n3. **If testing has not yet started:** The AM will initiate contact directly\n\n### After Handoff\n- Fiduciary Services receives the FILESPECRQ AWD ticket and follows the **Inforce Payroll Projects** process to complete payroll for the installation\n- The DC's active involvement in payroll ends once the ticket is submitted and NBI is updated\n\n## Ticket Content Checklist\n\nWhen submitting the FILESPECRQ ticket, include:\n\n- [ ] Payroll vendor contact name and email\n- [ ] Client contact name and email\n- [ ] Payroll file layout (attach or link)\n- [ ] Summary of testing status (where in the process, what's been done)\n- [ ] Details of prior test file results (pass/fail, outstanding issues)\n- [ ] Link to shared drive folder with test files and layouts\n\n## Evidence / Examples\n\nFrom the DC Training Notebook (February 26, 2026):\n\n> \"Going forward, the COMs will communicate during the conversion process that if payroll is not completed prior to go live, payroll testing will continue with a different internal Transamerica Team.\"\n\n> \"LM DC will submit Ticket type = FILESPECRQ. Ticket to include payroll contact info, client contact info, payroll file layout and summary of current testing status including details of prior test file results.\"\n\n## Related Concepts\n\n- [[payroll-template]] — the file format being tested\n- [[ftp-connection]] — the upload channel being set up alongside testing\n- [[payroll-support]] — the One Payroll team involved in pre-go-live testing\n- [[nbi]] — must be updated with testing status and ticket number\n- [[plan-conversion-handoffs]] — the broader go-live handoff context\n\n## See Also\n\n- [[payroll-vendor-onboarding]]\n- [[plan-conversion-handoffs]]\n- [[payroll-template]]\n- [[ftp-connection]]\n- [[payroll-support]]\n- [[nbi]]\n- [[roles/lm-dc]]\n- [[roles/com]]"},{"id":"vendors/payroll-integrations","slug":"payroll-integrations","rel":"vendors/payroll-integrations.md","namespace":"vendors","title":"Payroll Integrations","summary":"Payroll Integrations (PI) is a third-party payroll provider with a special relationship with Transamerica — do not work it the same way as ADP, UKG, Paylocity, or Paycor.","updated":"2026-07-08","created":"2026-07-08","sources":1,"status":"active","tags":["vendor","payroll"],"type":"vendor","extras":[],"media":[],"meta":{"title":"Payroll Integrations","type":"vendor","tags":["vendor","payroll"],"created":"2026-07-08","updated":"2026-07-08","sources":1,"status":"active"},"markdown":"# Payroll Integrations\n\nPayroll Integrations (PI) is a third-party payroll provider with a special relationship with Transamerica — do not work it the same way as ADP, UKG, Paylocity, or Paycor.\n\n## Special path\n\n- For new requests, inbound specs go to the inbound/outbound file team to reach out to PI. A call is not needed; specs route through Jen.\n- PI works with the client on data that needs to be updated in the payroll vendor.\n- Dedicated process documentation is still pending after Jen aligns with Earl and Stacy.\n\n## File format & naming\n\n- PI takes the 1116 layout and is always custom for OBF.\n- PI maps the codes Transamerica sends to the appropriate vendor codes for each client.\n- Filename must differentiate large market from mid-market: `Plan number_affiliate_lmpayroll_mmddyyyy.csv`.\n- No test files needed; PI needs the date the files go live.\n\n## Loans & data quirks\n\n- Send PI a report with loan numbers before go-live. Uses Transamerica loan numbers.\n- PI sends employee ID on the file; for ADP clients this pulls from Associate ID.\n- When someone is rehired, the PI API sends the rehire date but drops the term date — during base data review, confirm prior term dates for rehires are already available.\n\n## FTP & PGP\n\n- The global connection is PAYROLLINTEGRATIONS. No PGP.\n\n## See Also\n\n- [[payroll-vendor-onboarding]]\n- [[ftp-connection]]\n- [[payroll-template]]"},{"id":"coordination/payroll-support","slug":"payroll-support","rel":"coordination/payroll-support.md","namespace":"coordination","title":"Payroll Support (OnePayroll Team)","summary":"Runs production-level payroll file simulations — the final validation gate before a payroll setup goes live.","updated":"2026-07-08","created":"2026-04-14","sources":2,"status":"current","tags":["team","payroll-support","testing","validation","onepayroll"],"type":"coordination","extras":[],"media":[],"meta":{"title":"Payroll Support (OnePayroll Team)","type":"coordination","tags":["team","payroll-support","testing","validation","onepayroll"],"created":"2026-04-14","updated":"2026-07-08","sources":2,"status":"current"},"markdown":"# Payroll Support (OnePayroll Team)\n\nRuns production-level payroll file simulations — the final validation gate before a payroll setup goes live.\n\n**Contact:** `PAYROLLSUPPORT@transamerica.com`\n\n## What they own\n\n- Production-environment simulation of payroll test files, after your [[eds]] validation\n- Final approval that a payroll setup is production-ready (then FTP can go live)\n- Post-go-live monitoring of FTP uploads for failed deliveries (with Account Managers)\n\nTheir import is the same one the client hits when uploading through the production page; the internal DC import strips out many warnings and errors. That's why a file that comes back clean from EDS can still get flagged here — this pass is its own gate, not \"EDS again.\"\n\n## What you hand them\n\n- **A clean payroll test file** — only after you've run it through EDS, reviewed all output, and iterated with the vendor until clean\n\n## What they hand you\n\n- **Feedback if issues are found** — you obtain a new test file from the vendor and restart from EDS\n- **Approval if clean** — payroll setup is complete; FTP goes live\n\n## When to contact them / escalation\n\n- Send files only after EDS is clean — sending dirty files wastes a cycle\n- Escalation contact for significant FTP delays affecting clients after go-live\
