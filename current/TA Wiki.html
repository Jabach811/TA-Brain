rustee options include SSBT (State Street Bank & Trust), Self-Trust, or Other (trust agreement required).\n- Payroll submission methods are PSD (Plan Sponsor Direct) or FTP; funding methods are ACH or Wire.\n- Asset transfer strategies: Plan Level Conversion, Participant Directed, or Hybrid.\n\n## Key Sections\n\n### Part 1 — Employer / Plan Information\nPlan type, MEP/PEP role, account number, market segmentation, public company status, SSO, plan status, document type (Volume Submitter or IDP).\n\n### Plan Set-Up Information\nPlan effective date, limited access period (start/end), system effective date, services included (enrollments, deferrals, allocations, beneficiary data), other TRS plans, loan aggregation settings.\n\n### Contacts\nTrustee information, executive contact, administrator contact, TPA contact, advisor/consultant details (3(38) investment manager, PSD user ID).\n\n### Automatic Enrollment & Deferrals\nAuto-enrollment type (being added vs. existing), auto-increase settings, increase date.\n\n### Portfolio & Advice Services\nPortfolioXpress (Lifetime/Retirement, Risk Preference Overlay), Custom PortfolioXpress/Custom Model Portfolios (5 bps fee, quarterly rebalance), Managed Advice, Advisor Managed Advice.\n\n### Loans & Withdrawals\nOnline withdrawal types, loan PoG options, takeover loan method (Payroll/Coupon/EFT).\n\n### QDIA Strategy\nDefault fund, PX re-enrollment options, internal QDIA meeting requirement.\n\n### Payroll Setup\nPayroll type (in-house vs. vendor), frequency, submission method (PSD/FTP), funding method (ACH/Wire), file format (Excel/CSV).\n\n### Conversion Strategy Overview\nPrior vendor information (contacts, assets, blackout dates), asset transfer strategy (Plan Level / Participant Directed / Hybrid), case transition worksheet (loans, auto-enrollment, outsourcing, fund pricing).\n\n### 457(b)/457(f) and Corporate NQDC Services\nEligibility, deferrals, vesting, distributions, tax reporting, enrollment/deferral tracking.\n\n## Entities Mentioned\n- [[ssbt]] (State Street Bank & Trust — trustee option)\n- [[subpack]] (the submission package this document is part of)\n- [[eds]]\n- [[wx]] (PSD = Plan Sponsor Direct / WX)\n\n## Concepts Mentioned\n- [[conversion-types]] (Plan Level, Participant Directed, Hybrid)\n- [[ftp-connection]] (FTP payroll submission)\n- [[eligibility]] (eligibility services)\n- [[deferrals]] (deferral setup)\n- [[cccs-submission-package]] (concept page for this document type)\n\n## Contradictions / Open Questions\n- CCCS acronym not spelled out in the source. Likely \"Client Conversion Configuration Sheet\" or similar — confirm with team.\n- Several fields in the raw template show \"(Unclear in source)\" — these are blank form fields by design, not missing data.\n- \"Limited Access Period\" is referenced in plan setup but not documented elsewhere in the wiki — may need a glossary entry.\n\n## See Also\n- [[subpack]]\n- [[conversion-types]]\n- [[cccs-submission-package]]\n- [[ftp-connection]]\n- [[eligibility]]"},{"id":"reference/query-library","slug":"query-library","rel":"reference/query-library.md","namespace":"reference","title":"SQL Query Library","summary":"Every SQL query and named .sql file the DC sources mention, with verbatim SQL where a source actually contains it.","updated":"2026-07-08","created":"2026-07-08","sources":6,"status":"active","tags":["reference","sql","queries","verification","informatica"],"type":"reference","extras":[],"media":[],"meta":{"title":"SQL Query Library","type":"reference","tags":["reference","sql","queries","verification","informatica"],"created":"2026-07-08","updated":"2026-07-08","sources":6,"status":"active"},"markdown":"# SQL Query Library\n\nEvery SQL query and named .sql file the DC sources mention, with verbatim SQL where a source actually contains it.\n\nA full DC query library was flagged as \"to be documented separately\" — many verification queries are referenced across sources but not yet captured (extra questions). This page collects what exists so far.\n\n## Source Mapping Query\n\nPulls source setup for a plan. From the training notebook, verbatim:\n\n```sql\nselect a.SRC_I, a.SRC_S, a.REPORT_1_NM, a.REPORT_2_NM, a.SP_REPORT_1_NM, a.SP_REPORT_2_NM, doc_nm\nfrom corp.plan_src_detail a, pension.plan_provision b, pension.plan_prov_grp c\nwhere A.SRC_I = B.RELATED_I\n  AND B.PROV_TYP_C = 1019\n  and b.enrl_prov_grp_i = c.enrl_prov_grp_i\n  and account_no = '[ACCOUNT_NO]'\n```\n\n## TO_BASIS.sql\n\nVerifies that everyone you are loading basis for exists in the system, then checks the loaded basis and Roth first dates (loading-basis doc; official file path unconfirmed). Verbatim SQL preserved in the archived main dump (`_archive/main dump/TO_BASIS.md.txt`) — case number and date are per-plan placeholders:\n\n```sql\n--RUN AND EXPORT TO TO_BASIS REPORT.  USE TO VERIFY EVERYONE THAT YOU ARE LOADING BASIS FOR IS IN THE SYSTEM.\nSELECT CASE_NO , SOC_SEC_NO\nFROM CORP.EMPLOYEE\nWHERE CASE_NO = 'QK63283   00053'\n;\n\n--**** AFTER LOADING PULLS IN BASIS AND ROTH 1ST DATE\nSELECT A.CASE_NO , A.SOC_SEC_NO , RTH_CTRB_FST_YR, RTH_HRDSHP_CTRB_A, RTH_TAXFREE_CTRB_A,\n       RTH_TAXFREE_ROLL_A, PRE87_TAX_BAS_AMT , POST86_TAX_BAS_AMT , TYP6_TOT_WD_AMT ,\n       TYP234_TOT_WD_AMT , CORP_TYP6_CTRB_AMT, PRE89_TYP3_BAS_AMT, POST88TYP3_BAS_AMT,\n       DEEMED_LOAN_AMT, EE_BEG_BAL_DT\nFROM CORP.EE_BASIS A, CORP.EMPLOYEE B\nWHERE A.CASE_NO = 'QK63283   00053'\n  AND A.SOC_SEC_NO NOT LIKE '%T%'\n  AND A.CASE_NO = B.CASE_NO\n  AND A.SOC_SEC_NO = B.SOC_SEC_NO\n  AND A.EE_BEG_BAL_DT = '20251231'\n;\n\n--IF Roth Basis is loaded, Verfiy the Roth 1st Date Loaded.\n--If there is output that means ppts with basis is missing a first roth date.\nSELECT CASE_NO , SOC_SEC_NO , RTH_CTRB_FST_YR\nFROM CORP.EMPLOYEE\nWHERE CASE_NO = 'QK63283   00053'\n  AND RTH_CTRB_FST_YR = '0'\n  AND SOC_SEC_NO IN (SELECT SOC_SEC_NO\n                     FROM CORP.EE_BASIS\n                     WHERE CASE_NO = 'QK63283   00053')\n;\n\n--PULLS THE FULL TABLE DATA\nSELECT *\nFROM CORP.EE_BASIS\nWHERE CASE_NO LIKE 'QK63283_  00053%'\n  AND SOC_SEC_NO NOT LIKE '%T%'\n;\n```\n\n## TO Census.sql\n\nVerifies whether census data already exists before loading, and supports individual participant research (census-data doc; official file path unconfirmed). The primary query, verbatim from the archived main dump (`_archive/main dump/TO CENSUS.md.txt`):\n\n```sql\n-- VERIFY IF DATA EXISTS IN TABLE BEFORE LOADING; USE TO DO INDIVIDUAL PPT RESEARCH TOO.\nSELECT *\nFROM CORP.EMPLOYEE\nWHERE CASE_NO LIKE 'QK63283_  00073%'\n```\n\nThe same dump file contains the full census demographic pull (CORP.EMPLOYEE joined to CORP.EE_BEN_ADDRESS on PAYEE_TYP_CD = '1', with date fields reformatted from YYYYMMDD) plus missing-data checks for: class codes (CLASS_I = 0), divisions (EE_DIV_NO = ''), employee numbers (EE_NO = ''), term dates missing a term reason code (via PENSION.PE_DIV_EMPL_DATA / PENSION.GET_PART_ENRL), gender codes (EE_SEX_CD = ''), and payroll frequency (EE_PAYROLL_FREQ_CD = ''). See the dump file for the full verbatim text.\n\n## Hardship Suspension Query\n\nHardship suspension dates are loaded via SQL — load only end or re-entry dates (loading-basis doc). **The actual SQL is referenced but not documented in any source; location unconfirmed.**\n\n## Day-of-Wire SQL Insert Sequence\n\nThe Informatica Day of Wire workflow (updated April 8, 2020) has a documented 11-step SQL verification process. It inserts into, in sequence: **CASE_REMIT, FIN_ACT_PEND, FIN_ACT_ELEC, BILL_REMIT_DETAIL** (training notebook). The full 11-step SQL text is in the training notebook, not reproduced in the wiki sources.\n\n## MM-Enhanced Plans (ROC Won't Work)\n\nPlans coded as \"MM Enhanced\" (Extended Model) cannot use the standard ROC process for dummy account reversal. They require specific SQL updates to `CORP.transact_detail` plus a separate INSERT statement, submitted via a Production Support ticket (training notebook). The specific UPDATE/INSERT statements are not reproduced in the sources.\n\n## Informatica Audit SQL\n\nInformatica audits cover balance audits (plan and participant level), allocation audits, and vesting comparisons (main dump: Informatica Audits summary). **No audit SQL text is present in the sources; location unconfirmed.**\n\n## See Also\n\n- [[source-mapping]]\n- [[informatica]]\n- [[liquidation-day]]\n- [[balance-import]]\n- [[p2]]\n- [[p3]]"},{"id":"glossary/ssbt","slug":"ssbt","rel":"glossary/ssbt.md","namespace":"glossary","title":"SSBT","summary":"**Full Name:** State Street Bank & Trust","updated":"2026-04-15","created":"2026-04-15","sources":1,"status":"current","tags":["glossary","wire","banking","external"],"type":"glossary","extras":[],"media":[],"meta":{"title":"SSBT","type":"glossary","tags":["glossary","wire","banking","external"],"created":"2026-04-15","updated":"2026-04-15","sources":1,"status":"current"},"markdown":"# SSBT\n\n**Full Name:** State Street Bank & Trust\n\n## Definition\n\nSSBT is the external custodial bank through which incoming wires from prior record keepers are received during plan conversions. The [[fund-management-calendar]] SSBT cut-off is **4:00 PM EST** — trades submitted after this time are not processed same-day. [[cashiering]] pulls wires from SSBT at 7 AM, 9 AM, 1 PM, and 3 PM CST; wires received after the 3 PM pull are deposited the next business day.\n\n## Used By\n\n- [[cashiering]] — receives and books wires from SSBT\n- [[roles/lm-dc]] — monitors for wire confirmation; must update [[fund-management-calendar]] before the 4 PM EST cut-off on liquidation day\n\n## See Also\n\n- [[cashiering]]\n- [[liquidation-day]]\n- [[fund-management-calendar]]\n- [[wire-instructions]]"},{"id":"lifecycle/subpack","slug":"subpack","rel":"lifecycle/subpack.md","namespace":"lifecycle","title":"Subpack — Submission Package","summary":"TransAmerica's internal document specifying exactly what will be done during the conversion — the \"how we're doing it\" complement to the PRD's \"what the plan looks like.\"","updated":"2026-04-14","created":"2026-04-14","sources":3,"status":"current","tags":["document","subpack","submission","transamerica-details"],"type":"lifecycle","extras":[],"media":[],"meta":{"title":"Subpack — Submission Package","type":"lifecycle","tags":["document","subpack","submission","transamerica-details"],"created":"2026-04-14","updated":"2026-04-14","sources":3,"status":"current"},"markdown":"# Subpack — Submission Package\r\n\r\nTransAmerica's internal document specifying exactly what will be done during the conversion — the \"how we're doing it\" complement to the PRD's \"what the plan looks like.\"\r\n\r\n## Overview\r\n\r\nWhile the [[prd]] and [[onboarding-package]] describe the plan's design from the client's perspective, the subpack describes TransAmerica's execution plan: which mapping strategy, what auto-enrollment rate, how funds will be handled, etc. It is an internal TA document, not client-facing.\r\n\r\n## Contents (Examples)\r\n\r\n- Deferral election mapping strategy (\"we will map elections 1:1\")\r\n- Auto-enrollment percentage (e.g., \"auto enroll at 1%\")\r\n- Fund transfer strategy (\"transfer in kind: 3 funds; cash convert: remaining\")\r\n- Any special processing instructions\r\n\r\n## Ownership\r\n\r\n**COM creates the subpack. TC takes over after reviewing it during the internal call.**\r\n\r\nThe COM checklist explicitly includes:\r\n1. Submission Package Created (COM)\r\n2. Distribute to entire internal project team (COM)\r\n3. Subpack review — TC reviews during the internal call\r\n4. Subpack hand-off — TC maintains the subpack after review\r\n\r\nIn practice, completion has been inconsistent from the DC's perspective.\r\n\r\n> \"Sub-packs have been kind of touch and go, hit or miss.\" — DC Brain Dump\r\n\r\nWhen the subpack is missing or incomplete, the most likely explanation is that COM created it but the distribution or review step broke down — not necessarily that it was never made. DCs should ask COM directly.\r\n\r\n## Importance\r\n\r\nThe subpack is valuable because it gives the DC a single document stating definitively what will happen. Without it, the DC must synthesize conversion strategy from multiple sources, increasing the risk of misunderstanding.\r\n\r\n## When the Subpack Is Missing\r\n\r\nNot a blocker. The information exists somewhere — in the [[prd]], [[onboarding-package]], from the COM verbally, or from the client. Ask the COM for the specific details you need.\r\n\r\n> \"Get the info from other places. Not a big deal. It's available somewhere or from someone.\"\r\n\r\n## Additional Clarifications\r\n\r\n- **Standard template:** Yes, exists.\r\n- **Ideal timing:** Should be complete at the very beginning of the conversion — before substantive DC work begins.\r\n- **Client visibility:** The client knows about it, but it is primarily an internal TA document.\r\n\r\n## See Also\r\n\r\n- [[prd]]\r\n- [[onboarding-package]]\r\n- [[conversion-types]]\r\n- [[dc-onboarding-workflow]]"},{"id":"conversion-ops/subsequent-cash-imports","slug":"subsequent-cash-imports","rel":"conversion-ops/subsequent-cash-imports.md","namespace":"conversion-ops","title":"Subsequent Cash Imports","summary":"The family of small DC-triggered cash applications that land in participant accounts **after** the main conversion balances post. All of these follow the same pattern: extra cash arrives at the plan, and the DC pushes it out to participants","updated":"2026-05-03","created":"2026-05-03","sources":1,"status":"current","tags":["advanced-employer","interest","dividends","uncashed-checks","post-conversion","dc-triggered"],"type":"conversion-ops","extras":[],"media":[],"meta":{"title":"Subsequent Cash Imports","type":"conversion-ops","tags":["advanced-employer","interest","dividends","uncashed-checks","post-conversion","dc-triggered"],"created":"2026-05-03","updated":"2026-05-03","sources":1,"status":"current"},"markdown":"# Subsequent Cash Imports\n\nThe family of small DC-triggered cash applications that land in participant accounts **after** the main conversion balances post. All of these follow the same pattern: extra cash arrives at the plan, and the DC pushes it out to participants pro-rata or per the source rules.\n\n## What Falls Into This Family\n\n| Type | Origin | Typical Timing |\n|------|--------|----------------|\n| **Advanced Employer interest** | Interest accrued by the [[advanced-employer]] account while it held the wire | Day after AE liquidation |\n| **Dividends** | Late dividend payments from prior-RK funds | Days to weeks after conversion |\n| **Uncashed checks** | Stale uncashed distribution checks reissued back to the plan | Anytime post-conversion |\n| **Other extra cash** | Any other late-arriving amounts the plan receives | Anytime post-conversion |\n\nAll of these are **DC-triggered** — none of them are automated. The DC sees the cash arrive (typically via Cashiering or a vendor email), runs the appropriate workflow, and pushes the amount to participants.\n\n## Advanced Employer Interest — The Common Case\n\nThe clearest example. Walks through the full sequence:\n\n1. **Liquidation Day:** Wire hits → moved to [[advanced-employer]] account → accrues a small interest while sitting there\n2. **Final files arrive:** DC requests AE liquidation → balances post to participant accounts\n3. **Next business day:** DC takes the accrued interest amount and applies it **pro-rata to participants** as a small bonus — proportional to each participant's share of the total balance that just posted\n\nThe interest is small but real. Participants see a tiny additional credit the day after their main balance lands.\n\n## Why It Matters\n\nThese small late amounts are easy to miss. If they don't get pushed out:\n\n- Participants are short by the amount owed\n- The cash sits in a plan-level holding spot indefinitely, becoming a reconciliation problem later\n- Audit trails get murky because the prior-RK records show the amount left their books but TA records don't show it landing in any participant account\n\n## Out of Scope for FMC\n\nThese small distributions do **not** require [[fund-management-calendar|FMC]] entries. The big-money rule from FMC applies in reverse: interest, dividends, and small late amounts are below the threshold that needs advance notice to fund companies.\n\n## See Also\n\n- [[advanced-employer]]\n- [[balance-import]]\n- [[final-files-processing]]\n- [[fund-management-calendar]]\n- [[cashiering]]"},{"id":"reference/navigation-paths","slug":"navigation-paths","rel":"reference/navigation-paths.md","namespace":"reference","title":"System Navigation Paths","summary":"Verbatim click-paths for the P2 and P3 tasks DCs do most often, plus known shared-drive locations.","updated":"2026-07-08","created":"2026-07-08","sources":3,"status":"active","tags":["reference","navigation","p2","p3","shared-drives"],"type":"reference","extras":[],"media":[],"meta":{"title":"System Navigation Paths","type":"reference","tags":["reference","navigation","p2","p3","shared-drives"],"created":"2026-07-08","updated":"2026-07-08","sources":3,"status":"active"},"markdown":"# System Navigation Paths\n\nVerbatim click-paths for the P2 and P3 tasks DCs do most often, plus known shared-drive locations.\n\n## P2\n\n**Find transfer reference numbers:**\nCORP07/tdatest → 2001 → contract/affiliate # → option 4 → trans code 1006 → proc code 3 (extra questions)\n\n**Trans ref number format:** YYYYMMDD + 7-8 random alphanumeric characters (extra questions)\n\nDCs can also search ref numbers in P2 to confirm a wire arrived, matching against the expected amount (balances/census/loans dump).\n\n## P3\n\n**Enable eligibility:**\nPlan → top left dropdown → Outsourcing Summary → Eligibility → Enable screen. The go-ahead to enable comes within the hour (extra questions).\n\n**Assurance Codes (determines wire account):**\nPlan → General Plan → Assurance Codes (extra questions)\n\n**Loan conversion setup:**\nConversions dropdown → Add Record Keeper (Name only) → Conversions tab → New Conversion → enter case number, No Affiliate → set Conversion Date and Assign Date to effective date minus 3 months → save → capture the Conversion Number (balances/census/loans dump)\n\n**Loan upload:**\nConversions dropdown → Existing Plan → search by case number or conversion number → Takeover Loans → Submit. If a HOLB (Highest Outstanding Loan Balance) file exists, upload it; if not, click **Upload and Create** (balances/census/loans dump).\n\n**Reverse the dummy participant (mapping conversions):**\nP3 → ROC → \"ROC No Reversal\", after participant balances post (balances/census/loans dump)\n\n**Common remitter plans, Day of Wire:**\nThe standard Pre-Process option is missing from P3's Remit Action dropdown. Use **\"Verify Batch After Funding\"** instead; wait for results, then set NO HOLD + Process Immediate for each trans ref (training notebook).\n\n**Check whether Financial Guide is enabled:**\n(1) Plans Tab → Allocation/Plan Default, if FG is the plan-level default; (2) DDOL/VRU → Services Enabled section otherwise (training notebook).\n\n## Shared Drives / File Locations\n\n- **Audit pack:** Excel file stored at `root/Conversion/Contract`; same template for all conversion types; QA reviews same day (extra questions).\n- **Payroll file review Data Element Guide:** `S:\\CIT\\Data Consultants\\PAYROLL FILE REVIEW LINE FOR REVIEW OF DATA` (training notebook).\n- **Re-reg form:** Excel, kept in the front folder of the DC folder (extra questions).\n- Caution: older shared-drive paths (`S:\\CIT\\Data Consultants\\`, `\\\\yydafs-data1\\`) appear throughout older training notebook sections and may be stale — confirm before relying on them (training notebook).\n\n## See Also\n\n- [[p2]]\n- [[p3]]\n- [[eligibility]]\n- [[loan-setup]]\n- [[wire-instructions]]\n- [[liquidation-day]]"},{"id":"sources/tc-details-from-dan","slug":"tc-details-from-dan","rel":"sources/tc-details-from-dan.md","namespace":"sources","title":"TC Details from Dan","summary":"Role summary for the Transition Consultant, focused on administrative support, operational continuity, recordkeeping setup audits, notice controls, participant website audit, and DDOL/VRU/PSD readiness.","updated":"2026-07-01","created":"2026-07-01","sources":1,"status":"current","tags":["source","tc","conversion","administration","controls"],"type":"source","extras":[],"media":[],"meta":{"title":"TC Details from Dan","type":"source","tags":["source","tc","conversion","administration","controls"],"created":"2026-07-01","updated":"2026-07-01","sources":1,"status":"current"},"markdown":"# TC Details from Dan\n\nRole summary for the Transition Consultant, focused on administrative support, operational continuity, recordkeeping setup audits, notice controls, participant website audit, and DDOL/VRU/PSD readiness.\n\n## Summary\n\nThis source describes the TC as the role that establishes and communicates administrative processes during installation. The TC makes sure day-to-day administrative functions work properly and that the Plan Administrator understands the processes needed to operate the plan with Transamerica.\n\nThe source is especially useful because it gives a clean role-level description of TC ownership, rather than only a checklist view. It confirms that TC work is both administrative support and control work: supporting COM on admin questions, maintaining setup documentation, auditing P3 and participant website readiness, coordinating DDOL/VRU/PSD setup, and closing the project with internal parties.\n\n## Key Claims\n\n- TC acts as internal backup to COM on day-to-day administration issues and helps COM respond to administration questions.\n- TC participates in weekly internal and external calls when requested.\n- TC creates Outsourcing Addendum documents and makes sure they are reviewed for accuracy.\n- TC maintains the Submission Package after the preliminary draft, circulates revisions after the new business conference call, and keeps updates moving through project completion.\n- TC submits setup requests for special services such as PX, CMP, and MA.\n- TC gives Remit Loaders, Processors, Contact Center, AM, and other internal parties the information needed to administer the plan correctly.\n- TC provides plan sponsors with WX access and user manuals.\n- TC establishes and documents any special administrative procedures required for the plan.\n- TC works with COM/CE on special administrative forms when needed.\n- TC supports conversion-related questions from Processing and Customer Contact Center.\n- TC maintains documentation for client inquiries, administrative issues, special processes, and procedures.\n- TC partners with ongoing support teams so they stay informed on relationship status and milestone action items.\n- TC creates and maintains case notes during implementation.\n- TC schedules and facilitates conversion closure calls with internal parties.\n- TC creates and maintains the TC Conversion Action Plan.\n- TC conducts and documents a thorough P3 recordkeeping system audit.\n- TC creates the entity group needed to generate PoD materials after recordkeeping setup is confirmed.\n- TC reviews the Fee Disclosure Notice using the appropriate checklist.\n- TC makes sure required P3 tabs are set up, including Report Output, Outsourcing, and Remittance.\n- TC reviews the initial notice and notifies CE after the full system audit is complete so CE can review enrollment materials with the client.\n- TC audits conversion records/assets under the TC Action Plan.\n- TC audits the Participant Website using a test participant account and checklist.\n- TC collaborates with Quality Team and Data Consultant on eligibility services and enrollment kit mailings.\n- TC coordinates DDOL/VRU/PSD setup, testing, and activation.\n\n## Entities Mentioned\n\n- [[roles/tc]]\n- [[roles/com]]\n- [[roles/lm-dc]]\n- [[qa]]\n- [[p3]]\n- [[wx]]\n\n## Concepts Mentioned\n\n- TC Conversion Timeline\n- [[plan-conversion-handoffs]]\n- [[case-notes-template]]\n- Plan Sponsor Website User Setup\n- Source Mapping TC\n- [[go-live-checklist]]\n\n## Contradictions / Open Questions\n\n- The source uses CE and AM labels without defining them. Confirm whether CE maps to the current COM/client-facing communications role, and whether AM refers to Account Manager in the current operating model.\n- The source names PX, CMP, and MA as special services but does not define each one or identify the current request channel.\n- The source references PoD materials; the current wiki needs the full term and current generation process confirmed.\n\n## See Also\n\n- [[roles/tc]]\n- TC Conversion Timeline\n- [[plan-conversion-handoffs]]\n- [[tc-stuff]]"},{"id":"sources/tc-stuff","slug":"tc-stuff","rel":"sources/tc-stuff.md","namespace":"sources","title":"TC Stuff","summary":"Mixed legacy source bundle containing team charters, TC/QC role definitions, go-live controls, case note template language, plan setup procedures, division/affiliate guidance, payroll automation setup, CPMA setup, and Plan Sponsor Website u","updated":"2026-05-13","created":"2026-05-13","sources":1,"status":"needs-review","tags":["source","tc","qa","conversion","legacy","procedures"],"type":"source","extras":[],"media":[],"meta":{"title":"TC Stuff","type":"source","tags":["source","tc","qa","conversion","legacy","procedures"],"created":"2026-05-13","updated":"2026-05-13","sources":1,"status":"needs-review"},"markdown":"# TC Stuff\n\nMixed legacy source bundle containing team charters, TC/QC role definitions, go-live controls, case note template language, plan setup procedures, division/affiliate guidance, payroll automation setup, CPMA setup, and Plan Sponsor Website user setup notes.\n\n> [!warning] Source status\n> The file itself says multiple charter sections are outdated and need full QC. Treat this source as institutional memory and role/process evidence, not as current official procedure unless confirmed against current standards.\n\n## Summary\n\n`TC Stuff.txt` is not one procedure. It is a stitched collection of older conversion materials. The most useful wiki value is the way it fills gaps around the Transition Consultant role, Quality Control role, DDOL/VRU/PSD activation, go-live controls, case note structure, and plan administration setup.\n\nThe source is especially valuable because the existing wiki had TC and QA/QC mostly documented from the DC perspective. This file gives a broader implementation-team view of what TC and QC actually own.\n\n## Key Claims\n\n- The TC owns administrative setup and continuity during conversion: case notes, special procedures, remittance/admin manuals, PSD training, DDOL/VRU/PSD activation, audit controls, source mapping support, and closeout handoff.\n- QC owns a structured audit/control role: participant-level conversion records and assets, mapping review, default allocations/deferrals, census details, duplicate SSNs, loan analysis, statements, participant website test IDs, and financial-risk checks.\n- The team charter material describes four project modes: DC plan conversions, start-up projects, external mergers, and internal mergers.\n- Several procedures are actionable but need current validation: adding divisions, divisional PSD reporting, multiple affiliates, go-live checklist, bonus election setup, source mapping procedure, payroll file automation, CPMA setup, case notes, and Plan Sponsor Website user setup.\n- The go-live checklist treats limited access and full access as separate gates, each requiring system checks, case note updates, communications, access-code/service validation, and audit signoff.\n- Case notes are a structured operating record, not casual notes. The template includes special alerts, conversion dates, limited access windows, CPMA/Financial Guide language, asset gathering, deferrals, loans, money sources, web portal notes, withdrawals, and archived notes.\n\n## Entities Mentioned\n\n- [[tc]]\n- [[qa]]\n- [[roles/lm-dc]]\n- [[roles/com]]\n- [[p3]]\n- [[eds]]\n- [[wx]]\n- [[nbi]]\n- [[prod-support]]\n- [[ftp-team]]\n- Jen Curtin\n\n## Concepts Mentioned\n\n- Team Charters\n- TC Conversion Timeline\n- [[go-live-checklist]]\n- [[case-notes-template]]\n- [[divisions-and-affiliates]]\n- [[payroll-file-automation]]\n- [[bonus-election-setup]]\n- [[creative-planning-managed-accounts]]\n- Source Mapping TC\n- Plan Sponsor Website User Setup\n- [[source-mapping]]\n- [[subpack]]\n- [[payroll-template]]\n- [[common-remitter-plans]]\n\n## Contradictions / Open Questions\n\n- The source uses older role labels in places, especially TM/CE/CC/AM language. The wiki has already normalized some current references, so any role mapping should be checked before treating the old labels as active.\n- The document marks charter sections as outdated and needing QC.\n- Some sections depend on screenshots that were never included.\n- Some named teams or fields may have changed since the material was created.\n- The typo \"Jen Curtain\" appears in the source and likely refers to Jen Curtin.\n\n## See Also\n\n- [[tc]]\n- [[qa]]\n- [[plan-conversion-handoffs]]\n- TC Conversion Timeline\n- [[go-live-checklist]]"},{"id":"glossary/tm","slug":"tm","rel":"glossary/tm.md","namespace":"glossary","title":"TM (Transition Manager)","summary":"**Full Name:** Transition Manager *(deprecated — now COM)*","updated":"2026-04-15","created":"2026-04-15","sources":1,"status":"current","tags":["glossary","deprecated","com","role"],"type":"glossary","extras":[],"media":[],"meta":{"title":"TM (Transition Manager)","type":"glossary","tags":["glossary","deprecated","com","role"],"created":"2026-04-15","updated":"2026-04-15","sources":1,"status":"current"},"markdown":"# TM\n\n**Full Name:** Transition Manager *(deprecated — now COM)*\n\n## Definition\n\nTM (Transition Manager) was the former name for the role now called [[roles/com]] (Communications Coordinator / Conversion Operations Manager). Older training materials, emails, and documentation may reference \"TM\" or \"the TM\" when referring to the person who schedules meetings, manages the PRD/subpack, routes approvals, and coordinates external communications during a plan conversion.\n\nAll current references use **COM**. TM is retained here only to aid interpretation of legacy documents.\n\n## Used By\n\n- Historical: DC training materials pre-dating the rename\n- Current equivalent: COM\n\n## See Also\n\n- COM — current role page (replaces all TM references)"},{"id":"conversion-ops/toa","slug":"toa","rel":"conversion-ops/toa.md","namespace":"conversion-ops","title":"TOA — Transfer of Assets","summary":"Client-signed legal document that authorizes the asset transfer and serves as the fund mapping source. No action on the transfer begins until the TOA is signed.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["document","toa","fund-mapping","transfer-in-kind","client-signed"],"type":"conversion-ops","extras":[],"media":[{"id":"fig-1","caption":"TOA spreadsheet — one row per fund, Column T flags re-registration (TIK).","src":"SS/TOA.jpg","type":"screenshot"}],"meta":{"title":"TOA — Transfer of Assets","type":"conversion-ops","tags":["document","toa","fund-mapping","transfer-in-kind","client-signed"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# TOA — Transfer of Assets\n\nClient-signed legal document that authorizes the asset transfer and serves as the fund mapping source. No action on the transfer begins until the TOA is signed.\n\n## Overview\n\nThe TOA is both a legal authorization and a data document. The DC uses it to:\n1. Determine if any funds will be transferred in kind (re-registration)\n2. Build the fund mapping template\n\n## Structure\n\nThe TOA is a spreadsheet/form containing one row per fund being transferred. Key columns:\n\n| Column | Content |\n|--------|---------|\n| Prior vendor fund code | Source fund identifier |\n| Prior vendor fund description | Human-readable fund name |\n| TransAmerica fund code | Destination fund identifier |\n| TransAmerica fund description | TA fund name |\n| **Column T** | **Re-registering: Y or N** |\n| Current value (estimate) | Dollar value of fund (may be stale) |\n\n> Column T is the critical field. If any row = Y, [[processes/tik-transfer|transfer-in-kind]] process applies.\n\n![TOA spreadsheet — one row per fund, Column T flags re-registration (TIK).](SS/TOA.jpg)\n\n## What the DC Does with the TOA\n\n### Step 1: Check Column T (Re-registering)\n\n- **All N:** Everything will be liquidated and mapped. No TIK action needed.\n- **Any Y:** Fill out the re-registration form and send to Matt O'Connell's team. Do this with proper timing (~12 business days before liquidation).\n\n### Step 2: Build Fund Mapping\n\nAs soon as TOA is signed and available:\n- Extract fund data into the [[fund-mapping]] template\n- No test files needed for this step — all fund codes are already on the TOA\n- The mapping template is nearly one-to-one with the TOA, plus 6 additional TA internal fields: **Filter, Vendor Fund Code, Ref #, Split Ratio, Split Code, Total**\n\n### Step 3: Use Current Values as Share Estimates\n\n- TOA current values = initial estimate for Matt O'Connell's expected share amounts\n- These may be months old — update with test files and again with final files\n\n## Important Notes\n\n- **No action until signed.** TOA signature is a hard prerequisite for the TIK and fund mapping work.\n- TOA values can be stale — treat dollar figures as estimates only.\n- The TOA is filed away once fund mapping is complete; DC doesn't need to reference it again.\n- The TOA may be part of the [[onboarding-package]] (especially PEP plans) or a standalone document.\n\n## Cash Conversion Exception\n\nFor a pure cash conversion: the TOA will show no fund-level mapping — all assets go to a pool. There is no \"from → to\" mapping and no column T entries to worry about.\n\n## Authorship and Timing\n\n- **The TOA is a TA document** — the COM fills it out using a standard template\n- **Client signing timeline:** One of the first things done when the plan begins — not something that happens near conversion time\n- **Re-registration form format:** Simple Excel document. DC fills it out based on the TOA column T data.\n\n## See Also\n\n- [[fund-mapping]]\n- [[processes/tik-transfer|transfer-in-kind]]\n- Matt O'Connell\n- [[conversion-types]]\n- [[onboarding-package]]\n- [[dc-onboarding-workflow]]"},{"id":"conversion-ops/tik-transfer","slug":"tik-transfer","rel":"conversion-ops/tik-transfer.md","namespace":"conversion-ops","title":"Transfer In Kind (TIK) Process","summary":"How specific investment funds move as shares — not cash — from the prior record keeper to Transamerica's Fidelity pooled accounts during a plan conversion.","updated":"2026-07-08","created":"2026-04-16","sources":2,"status":"current","tags":["process","tik","reregistration","conversion","fidelity","shares"],"type":"conversion-ops","extras":[],"media":[],"meta":{"title":"Transfer In Kind (TIK) Process","type":"conversion-ops","tags":["process","tik","reregistration","conversion","fidelity","shares"],"created":"2026-04-16","updated":"2026-07-08","sources":2,"status":"current"},"markdown":"# Transfer In Kind (TIK) Process\r\n\r\nHow specific investment funds move as shares — not cash — from the prior record keeper to Transamerica's Fidelity pooled accounts during a plan conversion.\r\n\r\n## Overview\r\n\r\nTIK (also called re-registration) is a per-fund conversion method. Instead of selling shares and wiring cash, the actual shares are transferred directly from the prior custodian to Transamerica's Fidelity pooled accounts. Because shares never leave the market, there are no trades and no market-timing risk during the transfer.\r\n\r\nA single conversion can mix TIK, mapping, and cash funds — each fund's row in the [[toa]] specifies which method applies via the **Re-registering** column.\r\n\r\n## Fidelity Pooled Account Setup\r\n\r\nThe receiving accounts at Fidelity are set up by the Fidelity TIK coordination team (currently led by Matt O'Connell). Key facts about how they work:\r\n\r\n- Accounts are **pooled** — shared per fund, not per-participant.\r\n- Incoming shares are identified by **expected share amounts per fund**, not by account numbers. This is why the DC's share estimates must be accurate and current.\r\n- Setup takes approximately **10 business days**.\r\n- The team begins monitoring and reporting on expected vs. received shares **immediately** upon setup — this is why timing the handoff matters (see Step 3).\r\n- Once shares are matched to expected amounts, the team pulls them into the plan accounts.\r\n\r\nGoal: accounts should be complete approximately 1–1.5 weeks before liquidation.\r\n\r\n## Trigger\r\n\r\nThe [[toa]] is signed and Column T (Re-registering) contains at least one `Y`. The DC identifies the TIK funds and begins the re-registration workflow in parallel with the rest of the conversion.\r\n\r\n## Steps\r\n\r\n### 1. Identify TIK Funds — DC\r\nReview the signed [[toa]]. Any fund row with Column T = `Y` is TIK. The remainder are N (liquidated — mapping or cash).\r\n\r\n### 2. Fill Out Re-registration Form — DC\r\n- Template lives in the front folder of the DC folder.\r\n- One row per TIK fund. Required fields: prior vendor name, contact info, effective dates, QSIP, fund name, prior vendor ticker, Transamerica ticker, estimated dollar amount.\r\n- Initial estimate: use TOA current values (may be stale by months).\r\n\r\n### 3. Time the Handoff to the Fidelity TIK Team — DC\r\n**Do not send early.** Once the Fidelity TIK team sets up the pooled accounts, they begin monitoring immediately. Starting too early produces weeks of false negatives.\r\n\r\nTiming formula:\r\n```\r\nFidelity setup complete = Liquidation Date − 10 business days\r\nSend re-registration form = setup complete − 2 days (buffer)\r\n                         ≈ 12 business days before liquidation\r\n```\r\n\r\n### 4. Deliver Form to Prior Vendor — DC\r\nThe DC provides the completed form — **including Transamerica account information** — to the prior vendor. Without this, the vendor does not know where to route the shares.\r\n\r\n### 5. Update Share Estimates — DC\r\n- First update: after test files arrive.\r\n- Final update: **immediately** when final files arrive. Time-sensitive — the Fidelity TIK team uses the expected amount to claim shares as they land in the pooled account.\r\n- Estimates flow in three stages: TOA current values (initial, may be stale), test files (first update), final files (final update).\r\n\r\n### 6. Day of Wire — DC via Informatica\r\nThe Day of Wire workflow creates a **placeholder** in P3 for each TIK fund. No trades fire. Bill Remit detail has a ref number but no participant data yet. See [[liquidation-day]].\r\n\r\n### 7. Post Participant Balances (TIK mode) — DC\r\nAfter final files, the CIT balance workflow fills the placeholder.\r\n- P3 processing mode: **Online + No Hold** (never Process Immediate).\r\n- No trades — shares already sit at Fidelity. Posting only updates the books.\r\nSee [[final-files-processing]] for the full balance-posting flow.\r\n\r\n### 8. Monitor the TIK Tracker Spreadsheet — DC + Fidelity TIK team\r\nSeparate from the re-registration form: the re-reg form is the setup document; the tracker is the monitoring tool during the transfer period. The DC fills in expected share amounts per fund when final files arrive; the Fidelity TIK team updates the sheet as shares are received at Fidelity. When every row is populated, all shares have landed and the DC can process.\r\n\r\n**Share amount mismatch:** if received shares don't match expected amounts, the DC investigates and contacts the prior vendor directly.\r\n\r\n## Handoff Points\r\n\r\n| # | From → To | What Moves | Risk |\r\n|---|-----------|------------|------|\r\n| 1 | DC → Fidelity TIK team | Re-registration form | Sent too early → weeks of false monitoring |\r\n| 2 | DC → Prior vendor | Re-registration form with TA account info | Vendor cannot route shares without it |\r\n| 3 | Prior vendor → Fidelity pooled accounts | Actual shares | Amount mismatch → DC investigates, contacts vendor |\r\n| 4 | Fidelity TIK team → DC | \"Shares received\" signal via shared spreadsheet | Late signal → delayed participant posting |\r\n| 5 | DC → P3 | Online + No Hold posting | Wrong mode (Process Immediate) → duplicate trades |\r\n\r\n## Timing / Deadlines\r\n\r\n- **~12 business days before liquidation:** DC sends re-registration form to the Fidelity TIK team.\r\n- **~10 business days before liquidation:** Fidelity accounts are set up and monitoring starts.\r\n- **Final files arrive:** DC updates share estimates immediately.\r\n- **Liquidation Day:** Placeholder created in P3 by Day of Wire workflow.\r\n- **After final files processed:** Balances posted in Online + No Hold mode; reconcile against TIK tracker.\r\n\r\n## Failure Modes\r\n\r\n- **Sent too early.** The Fidelity TIK team spins up monitoring weeks before shares arrive → wasted effort, false negatives.\r\n- **Missing account info.** Prior vendor has no routing target; shares don't arrive or arrive at the wrong account.\r\n- **Stale share estimates.** The Fidelity TIK team cannot match incoming shares to the expected amount; shares sit unclaimed.\r\n- **Wrong P3 processing mode.** Process Immediate fires trades even though shares are already at Fidelity → duplicate trades and reversal work.\r\n- **TIK fund mistakenly processed as dummy participant.** TIK does not use a [[dummy-participant]] — the Day of Wire placeholder fills directly.\r\n\r\n## See Also\r\n\r\n- [[toa]]\r\n- [[informatica]]\r\n- [[liquidation-day]]\r\n- [[final-files-processing]]\r\n- [[conversion-types]]\r\n- [[plan-conversion-handoffs]]\r\n- [[dummy-participant]]\r\n- [[roles/lm-dc]]"},{"id":"coordination/tc","slug":"tc","rel":"coordination/tc.md","namespace":"coordination","title":"Transition Consultant (TC)","summary":"Owns the administrative setup of the plan during conversion — the person who makes sure the plan can actually operate before participants and downstream teams start using it.","updated":"2026-07-08","created":"2026-04-14","sources":3,"status":"current","tags":["role","tc","transition","conversion","administration","audit"],"type":"coordination","extras":[],"media":[],"meta":{"title":"Transition Consultant (TC)","type":"coordination","tags":["role","tc","transition","conversion","administration","audit"],"created":"2026-04-14","updated":"2026-07-08","sources":3,"status":"current"},"markdown":"# Transition Consultant (TC)\n\nOwns the administrative setup of the plan during conversion — the person who makes sure the plan can actually operate before participants and downstream teams start using it.\n\n## What they own\n\n- Administrative setup and audit in [[p3]]: DDOL/VRU settings, service indicators, plan defaults, go-live controls\n- [[wx]]/PSD sponsor access, user setup, and training\n- The [[subpack]] after COM's initial draft, plus case notes and admin procedures for ongoing teams\n- Early access activation in the system (you load the file; TC flips it on)\n- Approval of your fund and source mapping (jointly with [[qa]], routed via COM)\n- The go-ahead on the eligibility gate (jointly with QA)\n\n## What you hand them\n\n- **Source mapping working spreadsheet** — once you've identified all prior-vendor sources with balances: source list, balances, contribution type codes, contribution frequency, withdrawal provisions, vesting, and any unresolved frozen-source questions. TC completes the administrative attributes and may ask you to chase missing prior-vendor details. See Source Mapping TC\n- **Fund/source mapping documents for approval** — routed through COM\n- **Eligibility notification email** — sent to TC + QA + COM only after deferrals are posted and all data is in good order. Do not enable eligibility in P3 until their go-ahead comes back\n- **Data answers during their audit** — source-balance and data questions while TC audits the recordkeeping setup\n\n## What they hand you\n\n- **Mapping approvals** — via COM\n- **Eligibility go-ahead email** — your green light to enable eligibility in P3\n- **Completed source mapping attributes** — the plan-provision detail that makes your source mapping usable\n- **Early access activation confirmation** — after you've loaded the file and COM has notified them\n\n## When to contact them / escalation\n\n- Plan-provision or administration questions during setup — TC is the internal admin expert and COM's backup for administration questions\n- Loop TC in early; a late TC means admin setup, participant access, and closeout all get squeezed\n- TC is not QA: TC sets up and administers, QA validates. Audit findings go to QA; setup questions go to TC\n\n## Common issues\n\n- Frozen or legacy sources mapped without verified attributes — TC catches this, but only if you flag the open questions in the spreadsheet\n- Eligibility enabled before the go-ahead, or eligibility notification sent before deferrals are posted — both break the gate\n- Early access timing: TC must be notified (via COM) the day before early access starts, so your file load has to be done before that\n\n## See Also\n\n- Source Mapping TC\n- TC Conversion Timeline\n- [[go-live-checklist]]\n- [[eligibility-and-deferrals]]\n- [[qa]]\n- [[roles/lm-dc]]\n- [[plan-conversion-handoffs]]"},{"id":"vendors/ukg","slug":"ukg","rel":"vendors/ukg.md","namespace":"vendors","title":"UKG","summary":"UKG splits sharply between inbound ULTIMATE routing and outbound Turnkey/non-Turnkey handling.","updated":"2026-07-08","created":"2026-07-08","sources":1,"status":"active","tags":["vendor","payroll"],"type":"vendor","extras":[],"media":[],"meta":{"title":"UKG","type":"vendor","tags":["vendor","payroll"],"created":"2026-07-08","updated":"2026-07-08","sources":1,"status":"active"},"markdown":"# UKG\n\nUKG splits sharply between inbound ULTIMATE routing and outbound Turnkey/non-Turnkey handling.\n\n## FTP\n\n- All incoming UKG files come through the global connection named ULTIMATE. ULTIMATE is inbound only and does not contain an Inbox folder.\n- For Turnkey, Transamerica always pushes to UKG, so UKG must provide credentials.\n- If not Turnkey, UKG can pull from Transamerica's Inbox folder; push can also be supported.\n- No PGP.\n\n## File format & naming\n\n- UKG Turnkey can use standard or custom formats, but cannot handle bonus deferrals or after-tax deferrals.\n- If Turnkey, the filename needs `payrollvendorfeed` at the beginning.\n- If not Turnkey and custom: `plan number_affiliate_UKG_MMDDYYYY.csv`. If not Turnkey and standard, no rename is needed unless UKG requires it.\n\n## Loans\n\n- UKG uses the Transamerica loan number.\n- Before the live date, send UKG a file of created loans so they can seed their system.\n- UKG stores the seeded loan number in the Memo field.\n\n## See Also\n\n- [[payroll-vendor-onboarding]]\n- [[ftp-connection]]\n- [[payroll-template]]"},{"id":"glossary/vef","slug":"vef","rel":"glossary/vef.md","namespace":"glossary","title":"VEF","summary":"**Full Name:** Vendor Expense Form","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["glossary","acronym","com","advisor","compliance"],"type":"glossary","extras":[],"media":[],"meta":{"title":"VEF","type":"glossary","tags":["glossary","acronym","com","advisor","compliance"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# VEF\n\n**Full Name:** Vendor Expense Form\n\n**Definition:** A document used when a vendor expense arrangement needs to be established for a plan. Routed by the [[roles/com]] through an advisor firm and the plan sponsor, then submitted for internal L&C system setup.\n\n**Used By:** COM (routes the workflow); advisor firm (completes the form); client/plan sponsor (signs it); L&C team (sets up the arrangement in the system).\n\n## See Also\n\n- [[concepts/vef]] — concept page with full workflow\n- [[roles/com]]"},{"id":"vendors/vendor-quick-reference","slug":"vendor-quick-reference","rel":"vendors/vendor-quick-reference.md","namespace":"vendors","title":"Vendor Quick Reference","summary":"Cross-vendor \"Quick Hits\" comparison for payroll outbound decisions: who takes the standard file, who needs custom 1116, loan-number handling, and PGP per vendor.","updated":"2026-07-08","created":"2026-07-08","sources":1,"status":"active","tags":["vendor","payroll"],"type":"vendor","extras":[],"media":[],"meta":{"title":"Vendor Quick Reference","type":"vendor","tags":["vendor","payroll"],"created":"2026-07-08","updated":"2026-07-08","sources":1,"status":"active"},"markdown":"# Vendor Quick Reference\n\nCross-vendor \"Quick Hits\" comparison for payroll outbound decisions: who takes the standard file, who needs custom 1116, loan-number handling, and PGP per vendor.\n\n| Vendor | Takes Standard | Requires Custom | Loans | PGP | Key Note |\n|---|---|---|---|---|---|\n[[]] | Not often | Yes, usually | Vendor loan codes | No | MR Report and ADP Generic/Next Gen language matters |\n[[]] | Yes | Yes when UKG path applies | TA loan numbers | No | May use CREATIVEPLANNING-LM global route |\n[[]] | No | Yes, 1116 | TA loan numbers | No | payrollvendorfeed naming; DETAMOOV-LM has Munson caveat |\n[[]] | Not often | Yes, usually | Vendor loan codes | Sometimes | CSV only; EmployeeXrefCode is key |\n[[]] | N/A | N/A | N/A | N/A | Inbound SFTP only; outbound pulled from WX by client |\n[[]] | Yes | Yes, 1116 | TA loan numbers | Yes | Confirm platform; Payroll platform is Paystart |\n[[]] | No | Yes, 1116 | TA loan numbers | Yes | Loans accepted beginning January 2026 with seeding |\n[[]] | Yes | No | TA loan numbers | No | Routes through PAYKONNECT |\n[[]] | Yes | No | TA loan numbers | No | Third-party route for Paycor and Rippling |\n[[]] | No | Yes, 1116 | TA loan numbers | No | Special PI relationship; lmpayroll filename |\n[[]] | No | Yes, 1116 | TA loan numbers | No | PAYLCTY global; inbound must be ready first |\n[[]] | Not often | Yes, usually | TA loan numbers | No | ULTIMATE inbound; Turnkey has constraints |\n[[]] | Yes | Sometimes for loans | TA or vendor loan numbers | Sometimes | Often client software with implementation partner |\n\n## Before any vendor call\n\n- Ask whether the vendor can accept Transamerica's large-market standard outbound files: Excel/text, separate deferral and loan files, and large-market timing.\n- Confirm effective-date expectations for deferrals, new loans, and loan payoffs before layout work starts.\n- Confirm loan-number model: Transamerica unique loan number vs vendor loan deduction codes — this decides whether loan seeding and loan deduct_c logic are needed.\n- Confirm whether stop rows need a zero in the deferral field or should leave the field blank.\n- Confirm SFTP direction: vendor pushes to Transamerica, vendor pulls from Transamerica Inbox, or Transamerica pushes to vendor using their credentials.\n- Flag PGP early — it requires vendor public key handling, filename/extension details, an archive folder, and a special review path before automation.\n\n## See Also\n\n[[]]\n[[]]\n[[]]"},{"id":"index","slug":"index","rel":"index.md","namespace":"admin","title":"Wiki Index","summary":"*Last updated: 2026-07-08 — 124 pages, 11 sources*","updated":"","created":"","sources":0,"status":"","tags":[],"type":"","extras":[],"media":[],"meta":{},"markdown":"# Wiki Index\n*Last updated: 2026-07-08 — 124 pages, 11 sources*\n\nThe operational catalog of the DC Operations Wiki. Also see [[overview]] and [[log]].\n\n---\n\n## Case Lifecycle\n| Page | Summary | Updated |\n|------|---------|---------|\n| [[lifecycle/cccs-submission-package|CCCS Submission Package]] | The CCCS (Client Conversion Configuration Sheet) is Part 1 of the New Plan Su  `checklists/`, `reference/`, `vendors/`. Frontmatter `type:` retyped to match; renderer namespaces, dashboard, and branding updated (`DC Operations Wiki`).\n- Archived 28 non-DC pages (people pages, COM/TC-owned processes, superseded stubs) to `_archive/wiki-cut-2026-07-08/`. Salvaged embedded procedures first: TIK timing (Matt O'Connell page → tik-transfer), NBI assignment pipeline (ellen-miller → nbi), trade-approval escalation (rich-lippoth → fund-management-calendar), AE liquidation approval (nick-lister/stacey-fortune → advanced-employer), eligibility escalation (scott-vrba → eligibility), FTP contacts (eric-leytem/jen-curtin → ftp-team).\n- Rewrote 9 `coordination/` pages from role charters into DC-interface pages (what they own / what you hand them / what they hand you / escalation).\n- Pages created: `reference/wire-routing`, `reference/navigation-paths`, `reference/query-library`, `reference/file-naming` (mined from lmdc-training-notebook, extra-questions-001, brain dumps); `troubleshooting/loan-failures`; 14 `vendors/` pages (ADP, Paylocity, UKG, Workday, Paycom, Paycor, Dayforce, PayKonnect, Payroll Integrations, Datamoov, ExponentHR, Kelly Benefits, Creative Planning, vendor-quick-reference) mined from the FTP Stuf payroll guide.\n- Pages enriched from FTP Stuf guides and source dumps: all balance-import pages, loan-setup, loading-basis-eds, census-data, all Informatica module pages, all payroll pages, cccs-submission-package (\"Reading the CCCS as a DC\"), fund-management-calendar, dummy-participant, common-remitter-plans.\n- Links to archived pages converted to plain-text role references throughout. `overview.md`, `index.md`, `onboarding/lm-dc.md` rewritten for the DC-only structure. `garage/CLAUDE.md` + root `CLAUDE.md` schema updated.\n- Result: 124 pages, 0 broken links, 0 unindexed, 0 unexpected duplicates. Rendered output verified in browser at `current/TA Wiki.working.html` (canonical untouched pending promotion)."},{"id":"conversion-ops/wire-instructions","slug":"wire-instructions","rel":"conversion-ops/wire-instructions.md","namespace":"conversion-ops","title":"Wire Instructions","summary":"Banking instructions sent to the prior record keeper telling them where to send the liquidated assets on liquidation day.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["wire","liquidation","prior-record-keeper","cashiering"],"type":"conversion-ops","extras":[],"media":[],"meta":{"title":"Wire Instructions","type":"conversion-ops","tags":["wire","liquidation","prior-record-keeper","cashiering"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# Wire Instructions\r\n\r\nBanking instructions sent to the prior record keeper telling them where to send the liquidated assets on liquidation day.\r\n\r\n## Overview\r\n\r\nWire instructions tell the prior record keeper exactly where to wire the plan's money when they liquidate. The DC sends these as early as possible, then resends an updated version approximately one week before liquidation.\r\n\r\n## Two Sets of Instructions\r\n\r\n### Initial Wire Instructions (Early Send)\r\n- Sent as soon as the prior record keeper contact is established\r\n- May use the **default account** if P3 is not yet fully set up\r\n- Default account: money still arrives at TransAmerica, just in a general account rather than the plan-specific account\r\n  - Someone internally routes it to the correct place (extra manual step, but manageable)\r\n  - Not the end of the world — money is accessible internally\r\n- Better to send early with a default account than to delay\r\n\r\n### Updated Wire Instructions (~1 Week Before Liquidation)\r\n- Resent approximately 1 week before liquidation date\r\n- By this point, P3 should be fully set up → plan-specific account number available\r\n- Updated instructions route directly to the plan-specific account (eliminates the extra routing step)\r\n- Also resent because instructions may have changed since the initial send\r\n\r\n## P3 Account Numbers — Assurance Code\r\n\r\nThe **Assurance Code** in P3 determines which account number to use for the plan.\r\n\r\n**Navigation:**\r\n> Plan → dropdown → General Plan → Assurance Codes\r\n\r\nThe wire instructions template has a field for this — DC pulls the assurance code from P3 and fills it into the template to get the correct account number.\r\n\r\n**How to know if P3 is ready:** Just try to log in and see. If the plan is set up, the assurance code will be accessible.\r\n\r\n## Process\r\n\r\n1. Identify prior record keeper contact (from [[prior-record-keeper]] coordination)\r\n2. Use the **standard wire instructions template** (DC does not generate these from scratch)\r\n3. Pull the assurance code from P3 → template fills in the correct account number\r\n4. If P3 is not set up yet: use the **default account** (money arrives at TA, internally routed)\r\n5. Send to prior RK as early as possible\r\n6. Resend updated (plan-specific) instructions ~1 week before liquidation\r\n\r\n## Wrong Account — What Happens\r\n\r\nIf the prior RK sends money to the default account instead of the plan-specific account:\r\n> Ask internally for a **transfer** to route the funds to the correct account.\r\n\r\nSame applies if the prior RK sends to the wrong account entirely. Process is the same — request the transfer. It's not catastrophic, just an extra step.\r\n\r\n## See Also\r\n\r\n- [[prior-record-keeper]]\r\n- [[liquidation-day]]\r\n- [[p3]]\r\n- [[dc-onboarding-workflow]]"},{"id":"reference/wire-routing","slug":"wire-routing","rel":"reference/wire-routing.md","namespace":"reference","title":"Wire Routing & Cutoff Times","summary":"Where incoming conversion wires land at State Street, when Cashiering pulls them, and the daily cutoffs that decide whether money books today or tomorrow.","updated":"2026-07-08","created":"2026-07-08","sources":3,"status":"active","tags":["reference","wires","cashiering","liquidation","state-street"],"type":"reference","extras":[],"media":[],"meta":{"title":"Wire Routing & Cutoff Times","type":"reference","tags":["reference","wires","cashiering","liquidation","state-street"],"created":"2026-07-08","updated":"2026-07-08","sources":3,"status":"active"},"markdown":"# Wire Routing & Cutoff Times\n\nWhere incoming conversion wires land at State Street, when Cashiering pulls them, and the daily cutoffs that decide whether money books today or tomorrow.\n\n## State Street Routing by Reinsurance Code\n\nIncoming wires go to one of five State Street Bank & Trust accounts. Which account depends on the plan's Reinsurance Code (training notebook). The Assurance Code on P3 — found at Plan → General Plan → Assurance Codes — determines which account goes on the wire instructions (extra questions).\n\n| Reinsurance Code(s) | State Street Account |\n|---|---|\n| 2, 3, A, B | 00457358 |\n| 5, 6, 9 | 00457366 |\n| 4, 7, 8, C | 00457374 |\n| I | 00457424 |\n| J | 00457440 |\n\n- **ABA:** 011000028\n- **Bank:** State Street Bank & Trust Company, 200 Clarendon Street, Boston, MA 02116 (training notebook)\n\nWire instructions use a standard template. They are sent to the prior record keeper first thing, then re-sent about one week before liquidation as a confirmation reset (balances/census/loans dump).\n\n## Cashiering Wire Pulls\n\nCashiering pulls wires four times a day: **7am, 9am, 1pm, and 3pm CST** (training notebook).\n\n## Cutoffs\n\n- **3:00 PM CST** — wires received after this time are deposited the **next business day** (training notebook).\n- **3:45 PM** — Cashiering notifies the DC by this time if the wire was received that day. If they are delayed, they reply to acknowledge and confirm when complete (training notebook).\n\nRelated banking cutoff: the SSBT (State Street) cut-off for the Fund Management Calendar is **4:00 PM EST**, with wire confirmation received by 4:45 PM EST. If the wire is not received by cut-off, update the FMC to the next business day and send a follow-up email (training notebook).\n\n## Notifying Cashiering\n\n- Cashiering email: `shtaopscashieringinc@transamerica.com` (training notebook).\n- Wire confirmation has two paths: wait for Cashiering's email, or the DC searches the ref numbers in P2 directly and matches the amount (balances/census/loans dump).\n\n## Booking Assets (August 2025 update)\n\n- Wire hits State Street: book as **4=Remit**; still email NY Recon (training notebook).\n- Withdrawing from AEDA (Advanced Employer Deposit Account): book as **3=Rebook** AND submit a rebook AWD ticket (training notebook).\n\n## See Also\n\n- [[wire-instructions]]\n- [[liquidation-day]]\n- [[cashiering]]\n- [[fund-management-calendar]]\n- [[p2]]\n- [[p3]]"},{"id":"vendors/workday","slug":"workday","rel":"vendors/workday.md","namespace":"vendors","title":"Workday","summary":"Workday may be the system of record while another implementation partner (such as KPMG) owns the actual integration work — confirm ownership first.","updated":"2026-07-08","created":"2026-07-08","sources":1,"status":"active","tags":["vendor","payroll"],"type":"vendor","extras":[],"media":[],"meta":{"title":"Workday","type":"vendor","tags":["vendor","payroll"],"created":"2026-07-08","updated":"2026-07-08","sources":1,"status":"active"},"markdown":"# Workday\n\nWorkday may be the system of record while another implementation partner (such as KPMG) owns the actual integration work — confirm ownership first.\n\n## Handling\n\n- Workday can be used as a vendor, but it is often the client's software with another company involved in the integration.\n- Workday can take standard outbound files with or without separate catch-up contributions.\n- Some cases require custom files for loans.\n- Loan handling usually uses Transamerica loan numbers, except custom loan files may use vendor loan numbers.\n- PGP may apply in some Workday situations — confirm security requirements early.\n\n## See Also\n\n- [[payroll-vendor-onboarding]]\n- [[ftp-connection]]\n- [[payroll-template]]"},{"id":"payroll/wx","slug":"wx","rel":"payroll/wx.md","namespace":"payroll","title":"WX — Plan Sponsor Site","summary":"Transamerica's web-based portal for plan sponsors. WX (also called \"WX V2\" when referencing payroll integration) is set up by tc and verified by roles/com.","updated":"2026-07-08","created":"2026-04-14","sources":1,"status":"current","tags":["system","tool","com","tc","plan-sponsor","participant"],"type":"payroll","extras":[],"media":[],"meta":{"title":"WX — Plan Sponsor Site","type":"payroll","tags":["system","tool","com","tc","plan-sponsor","participant"],"created":"2026-04-14","updated":"2026-07-08","sources":1,"status":"current"},"markdown":"# WX — Plan Sponsor Site\n\nTransamerica's web-based portal for plan sponsors. WX (also called \"WX V2\" when referencing payroll integration) is set up by [[tc]] and verified by [[roles/com]].\n\n## Overview\n\nWX is the plan sponsor-facing web platform that allows plan administrators to manage their retirement plan online. It includes payroll file upload functionality in its V2 iteration. Setup is owned by TC; the COM verifies that it is configured correctly and follows up if it is not.\n\n## Key Facts\n\n- \"WX\" likely stands for a Workplace Experience portal or similar — full name not confirmed\n- \"WX V2\" refers to a version with payroll functionality; COM must confirm early whether a plan needs this\n- TC is responsible for setting up WX access for the plan sponsor\n- COM confirms setup and requests it from TC if not yet done\n\n## Role in Plan Conversions\n\n1. COM confirms early whether the plan needs payroll functionality (WX V2)\n2. COM checks whether the plan is set up on WX\n3. If not set up, COM emails TC to request WX access setup\n4. TC sets up WX; plan sponsor can then access the portal\n\n## Outbound Files Posted to WX\n\nThe large-market **standard outbound setup posts both Excel and text files to WX** — separate deferral and loan files — at the frequency confirmed during installation (from the payroll/OBF knowledge-transfer guide). When a vendor has no outbound SFTP with Transamerica (e.g., ExponentHR is inbound-only today), the client downloads the outbound files from WX and makes the updates in the payroll system themselves. See [[payroll-file-automation]] for the full outbound-file rules.\n\n## Open Questions\n\n- Full name/meaning of \"WX\"\n- What plan sponsors can do in WX (view contributions? manage enrollments? run reports?)\n- Whether participants also have a separate access portal\n- Whether WX is the same as or different from the payroll vendor's upload interface\n\n## See Also\n\n- [[roles/com]]\n- [[tc]]\n- [[ftp-connection]]\n- [[payroll-support]]"}],"rawFiles":[],"duplicateSlugs":[],"health":{"brokenLinks":[],"ambiguousLinks":[{"source":"reference/alteryx","target":"roles/lm-dc","resolvedTo":"lifecycle/lm-dc","candidates":["lifecycle/lm-dc","onboarding/lm-dc"]},{"source":"glossary/awd","target":"roles/lm-dc","resolvedTo":"lifecycle/lm-dc","candidates":["lifecycle/lm-dc","onboarding/lm-dc"]},{"source":"payroll/bonus-election-setup","target":"roles/lm-dc","resolvedTo":"lifecycle/lm-dc","candidates":["lifecycle/lm-dc","onboarding/lm-dc"]},{"source":"conversion-ops/booking-assets","target":"roles/lm-dc","resolvedTo":"lifecycle/lm-dc","candidates":["lifecycle/lm-dc","onboarding/lm-dc"]},{"source":"troubleshooting/common-remitter-plans","target":"roles/lm-dc","resolvedTo":"lifecycle/lm-dc","candidates":["lifecycle/lm-dc","onboarding/lm-dc"]},{"source":"coordination/com","target":"roles/lm-dc","resolvedTo":"lifecycle/lm-dc","candidates":["lifecycle/lm-dc","onboarding/lm-dc"]},{"source":"reference/divisions-and-affiliates","target":"roles/lm-dc","resolvedTo":"lifecycle/lm-dc","candidates":["lifecycle/lm-dc","onboarding/lm-dc"]},{"source":"coordination/doc-ops","target":"roles/lm-dc","resolvedTo":"lifecycle/lm-dc","candidates":["lifecycle/lm-dc","onboarding/lm-dc"]},{"source":"data-loading/eligibility-loading   <script>
    const payload = JSON.parse(document.getElementById("wikiPayload").textContent);
    const pages = payload.pages;
    const rawFiles = payload.rawFiles;
    const namespaceInfo = {
      home: { label: "Home", description: "Main wiki entry point." },
      lifecycle: { label: "Case Lifecycle", description: "Kickoff through closeout — the conversion project spine." },
      "data-loading": { label: "Data Loading", description: "One page per load: census, eligibility, deferrals, balances, loans, basis, YTD." },
      payroll: { label: "Payroll", description: "Vendor onboarding, FTP, file specs, testing, and the go-live handoff." },
      "conversion-ops": { label: "Conversion Ops", description: "Mapping, wires, liquidation day, TIK, and asset movement." },
      coordination: { label: "Departments", description: "How each team interfaces with DC work: handoffs, deliverables, escalation." },
      troubleshooting: { label: "Troubleshooting", description: "Symptom-indexed fixes, reversals, and recovery procedures." },
      checklists: { label: "Checklists", description: "Step-by-step control checklists for high-stakes moments." },
      reference: { label: "Reference", description: "Systems, SQL queries, navigation paths, wire routing, naming rules." },
      vendors: { label: "Vendors", description: "Prior recordkeepers and external platforms — quirks, timing, strategy." },
      glossary: { label: "Glossary", description: "Short acronym and term definitions." },
      onboarding: { label: "Onboarding", description: "Ordered reading guides for new DCs." },
      sources: { label: "Sources", description: "Locked source summaries and archive material." },
      analyses: { label: "Analyses", description: "Filed synthesis pages." },
      admin: { label: "Wiki Admin", description: "Index, log, and build artifacts." }
    };
    const namespaceOrder = ["lifecycle", "data-loading", "payroll", "conversion-ops", "coordination", "troubleshooting", "checklists", "reference", "vendors", "glossary", "onboarding", "sources", "analyses", "admin"];
    const namespacePriority = namespaceOrder;
    function namespaceRank(namespace) {
      const rank = namespacePriority.indexOf(namespace);
      return rank === -1 ? namespacePriority.length : rank;
    }
    const pageMap = new Map(pages.map(page => [page.id, page]));
    const slugMap = pages.reduce((acc, page) => {
      (acc[page.slug] ||= []).push(page);
      return acc;
    }, {});
    const qs = selector => document.querySelector(selector);
    const qsa = selector => Array.from(document.querySelectorAll(selector));
    const escapeHtml = text => String(text ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    function resolveLink(raw) {
      const clean = raw.split("|")[0].split("#")[0].trim().replace(/^wiki\//, "").replace(/\.md$/, "");
      if (pageMap.has(clean)) return clean;
      const slug = clean.split("/").pop();
      const matches = slugMap[slug] || [];
      if (!matches.length) return "";
      const preferred = [...matches].sort((a,b) => namespaceRank(a.namespace) - namespaceRank(b.namespace) || a.title.localeCompare(b.title))[0];
      return preferred.id;
    }
    function linkifyInline(text) {
      return escapeHtml(text)
        .replace(/\[\[([^\]]+)\]\]/g, (_, raw) => {
          const parts = raw.split("|");
          const target = resolveLink(parts[0]);
          const label = parts[1] || parts[0].split("/").pop();
          return target ? '<span class="wiki-link" data-open="' + escapeHtml(target) + '">' + escapeHtml(label) + '</span>' : escapeHtml(label);
        })
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/`([^`]+)`/g, "<code>$1</code>");
    }
    function renderMarkdown(md) {
      const lines = md.replace(/\r\n/g, "\n").split("\n");
      const html = [];
      let list = null;
      let table = null;
      let inCode = false;
      let codeLines = [];
      let figureCount = 0;
      function closeList() {
        if (list) {
          html.push("</" + list + ">");
          list = null;
        }
      }
      function closeTable() {
        if (table) {
          html.push("</tbody></table>");
          table = null;
        }
      }
      lines.forEach((line, idx) => {
        if (line.startsWith("```")) {
          if (inCode) {
            html.push("<pre><code>" + escapeHtml(codeLines.join("\n")) + "</code></pre>");
            codeLines = [];
            inCode = false;
          } else {
            closeList(); closeTable(); inCode = true;
          }
          return;
        }
        if (inCode) {
          codeLines.push(line);
          return;
        }
        const trimmed = line.trim();
        if (!trimmed) {
          closeList(); closeTable();
          return;
        }
        const callout = trimmed.match(/^>\s*\[!(\w+)\]\s*(.*)$/);
        if (callout) {
          closeList(); closeTable();
          const type = callout[1].toLowerCase();
          html.push('<div class="callout ' + escapeHtml(type) + '"><div class="callout-title">' + escapeHtml(type.charAt(0).toUpperCase() + type.slice(1)) + '</div><div>' + linkifyInline(callout[2]) + '</div></div>');
          return;
        }
        if (trimmed.startsWith(">")) {
          closeList(); closeTable();
          html.push("<blockquote>" + linkifyInline(trimmed.replace(/^>\s?/, "")) + "</blockquote>");
          return;
        }
        const heading = trimmed.match(/^(#{1,4})\s+(.+)$/);
        if (heading) {
          closeList(); closeTable();
          const level = heading[1].length;
          const text = heading[2].replace(/#+$/, "").trim();
          const id = "h-" + idx + "-" + text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
          html.push("<h" + level + ' id="' + id + '">' + linkifyInline(text) + "</h" + level + ">");
          return;
        }
        if (/^\|.+\|$/.test(trimmed)) {
          closeList();
          const cells = trimmed.split("|").slice(1, -1).map(cell => cell.trim());
          if (cells.every(cell => /^:?-{2,}:?$/.test(cell))) return;
          if (!table) {
            table = true;
            html.push("<table><tbody>");
          }
          html.push("<tr>" + cells.map(cell => "<td>" + linkifyInline(cell) + "</td>").join("") + "</tr>");
          return;
        }
        const bullet = trimmed.match(/^[-*]\s+(.+)$/);
        const ordered = trimmed.match(/^\d+[.)]\s+(.+)$/);
        if (bullet || ordered) {
          closeTable();
          const kind = bullet ? "ul" : "ol";
          if (list !== kind) {
            closeList();
            list = kind;
            html.push("<" + kind + ">");
          }
          html.push("<li>" + linkifyInline((bullet || ordered)[1]) + "</li>");
          return;
        }
        const imgMatch = trimmed.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
        if (imgMatch) {
          closeList(); closeTable();
          figureCount += 1;
          const cap = imgMatch[1].trim();
          const src = imgMatch[2].trim();
          html.push('<figure class="figure" id="fig-' + figureCount + '"><div class="figure-body"><img src="' + escapeHtml(src) + '" alt="' + escapeHtml(cap) + '" loading="lazy"></div>' + (cap ? '<figcaption>' + escapeHtml(cap) + '</figcaption>' : '') + '</figure>');
          return;
        }
        closeList(); closeTable();
