rnal TA fields:\r\n\r\n| Field | Source |\r\n|-------|--------|\r\n| Prior vendor fund code | TOA |\r\n| Prior vendor fund description | TOA |\r\n| TransAmerica fund code | TOA |\r\n| TransAmerica fund description | TOA |\r\n| Re-registering (Y/N) | TOA column T |\r\n| **Filter** | DC fills in (TA internal) |\r\n| **Vendor Fund Code** | DC fills in (TA internal) |\r\n| **Ref #** | DC fills in (TA internal) |\r\n| **Split Ratio** | DC fills in (TA internal) |\r\n| **Split Code** | DC fills in (TA internal) |\r\n| **Total** | DC fills in (TA internal) |\r\n\r\n![Fund mapping template — TOA columns on the left, TA-internal fields on the right.](SS/Fund Mapping.jpg)\r\n\r\n## Scope\r\n\r\nFund mapping is **plan-wide** — not per source. One mapping covers all sources in the plan.\r\n\r\n## Fund Splits (Rare)\r\n\r\nAbout **1 in 25 mapping plans** has a fund split: a single prior-RK fund that maps to **two** TA funds rather than one. When this happens, the template's split fields come into play:\r\n\r\n- **Split Code** — flags the row as a split\r\n- **Split Ratio** — how the prior fund's balance divides between the two destination funds (e.g., 50/50, 75/25)\r\n\r\nA second row in the template captures the second destination fund and its share of the ratio. Both rows reference the same prior fund.\r\n\r\nSplits are rare but real — verify the ratios against whatever the TOA or client documentation specifies, and don't guess.\r\n\r\n## Codes Don't Always Match the TOA\r\n\r\nSometimes the prior-fund codes that show up on the actual test or final files don't match what the TOA listed. When this happens you may have to **map two ways** — the file-side code in one column, the TOA code in another, both pointing to the same TA fund. **Show your work** in the template so QA can follow it.\r\n\r\n## Cash Conversion Exception\r\n\r\nCash conversions do not require fund mapping. Assets arrive as cash and are invested based on participant elections. Skip this step entirely for pure cash conversions.\r\n\r\n## Relationship to Source Mapping\r\n\r\nFund mapping and [[source-mapping]] are different things:\r\n- **Fund mapping** = which investment funds map to which (asset movement)\r\n- **Source mapping** = which contribution source types map to which (money categorization)\r\n\r\nBoth are needed for mapping/TIK plans. Source mapping requires test files; fund mapping does not.\r\n\r\n## Important Clarifications\r\n\r\n**Deadline:** Earlier the better — no official deadline.\r\n\r\n**Does the approved mapping get loaded to the system?** No. It is not a system import. The DC sends it out for QC, gets it approved, and uses it in the Informatica workflows. It is a reference document, not a system input.\r\n\r\n**Can fund mapping change after approval?** Unlikely — it would be a massive change. Rare. If it does happen, the amendment process would need to be coordinated through COM/QA/TC.\r\n\r\n## See Also\r\n\r\n- [[toa]]\r\n- [[source-mapping]]\r\n- [[conversion-types]]\r\n- [[dc-onboarding-workflow]]"},{"id":"checklists/go-live-checklist","slug":"go-live-checklist","rel":"checklists/go-live-checklist.md","namespace":"checklists","title":"Go Live Checklist","summary":"TC/QC control checklist for turning on limited access or full access during conversion.","updated":"2026-05-13","created":"2026-05-13","sources":1,"status":"needs-review","tags":["concept","go-live","limited-access","full-access","tc","audit"],"type":"checklist","extras":[],"media":[],"meta":{"title":"Go Live Checklist","type":"checklist","tags":["concept","go-live","limited-access","full-access","tc","audit"],"created":"2026-05-13","updated":"2026-05-13","sources":1,"status":"needs-review"},"markdown":"# Go Live Checklist\n\nTC/QC control checklist for turning on limited access or full access during conversion.\n\n## Definition\n\nThe go-live checklist is a structured control gate before enabling participant access in DDOL/VRU and related plan services. It separates limited access, limited access close, full access, and post-go-live cleanup.\n\n> [!warning] Source status\n> Built from legacy TC material. Use as a checklist model and risk map until confirmed against current procedure.\n\n## Why It Matters\n\nAccess activation changes what participants and plan sponsors can do. If DDOL/VRU, outbound files, enrollment confirms, managed advice, PX/CMP/MA settings, or case notes are wrong at activation, the plan can go live with participant-facing errors.\n\n## Evidence / Examples\n\n### Limited Access\n\n- Verify PX glidepath, CMP, MA, or AMA setup in P3.\n- Confirm first system audit signoff.\n- Confirm WX/DDOL form audit.\n- Update case notes to show limited access.\n- Notify COM that limited access is activated.\n- Complete DDOL/VRU test participant and live participant audits.\n- Activate outbound file if limited access includes deferrals.\n- Enable or disable VRU, phone transfer, DDOL services, deferrals, allocations, beneficiaries, fund prospectus, personal info, catch-up calculator, SaveXpress, enrollments, PX, CMP, MA, unit values, OnTrack, and fund performance as strategy requires.\n- Notify TRSC IM Asset Allocation Services Team when managed advice is enabled during limited access.\n\n### Limited Access Close\n\n- Disable DDOL/VRU access.\n- Update case notes that limited access ended and plan is in blackout.\n- Deactivate enrollment confirms.\n\n### Full Access\n\n- Reconfirm PX/CMP/MA setup and system audit signoff.\n- Update case notes to show the plan is live.\n- Notify TM/COM and the conversion team once the plan is live.\n- Complete DDOL/VRU audits.\n- Activate outbound file if deferrals are outsourced.\n- Notify Jen Curtin when custom or automated OBF is activated.\n- Confirm VRU, phone transfer, DDOL, eligibility/enrollment kit, Loan PoG, Info Share tab, and Managed Advice notifications.\n\n### Post-Go-Live Cleanup\n\n- Activate welcome kits after samples are reviewed.\n- Complete term kit cleanup only when appropriate.\n- Take term kits off hold and update auto-cash-out provisions after welcome kits are released.\n- Complete final system audit.\n- Enable loan default logic after loan analysis.\n\n## Related Concepts\n\n- TC Conversion Timeline\n- [[case-notes-template]]\n- [[creative-planning-managed-accounts]]\n- [[wx]]\n- [[p3]]\n\n## See Also\n\n- [[tc]]\n- [[qa]]\n- [[plan-conversion-handoffs]]\n- [[tc-stuff]]"},{"id":"glossary/holb","slug":"holb","rel":"glossary/holb.md","namespace":"glossary","title":"HOLB","summary":"**Full Name:** Highest Outstanding Loan Balance","updated":"2026-05-03","created":"2026-05-03","sources":1,"status":"current","tags":["glossary","loans","p3","takeover-loans"],"type":"glossary","extras":[],"media":[],"meta":{"title":"HOLB","type":"glossary","tags":["glossary","loans","p3","takeover-loans"],"created":"2026-05-03","updated":"2026-05-03","sources":1,"status":"current"},"markdown":"# HOLB\n\n**Full Name:** Highest Outstanding Loan Balance\n\n## Definition\n\nHOLB is the highest outstanding balance a participant's loan has reached over its life. It's used to drive the **hierarchy of loans** when a participant has multiple loans active at once and to determine how repayments are split across those loans.\n\nWhen uploading [[loan-setup|takeover loans]] in P3, the loan upload screen asks whether a HOLB file exists:\n\n- **HOLB file exists** → upload it directly\n- **No HOLB file** → click **Upload and Create**, and P3 derives the HOLB values from the loaded loan data\n\n## Used By\n\n- [[roles/lm-dc]] — handles the HOLB branch on the Takeover Loans upload screen\n- [[loan-setup]] — Step 12 (Upload) decision\n\n## See Also\n\n- [[loan-setup]]\n- [[informatica-loan-module]]"},{"id":"data-loading/hours-procedure","slug":"hours-procedure","rel":"data-loading/hours-procedure.md","namespace":"data-loading","title":"Hours Procedure","summary":"The procedure for loading or tracking participant hours data — used in eligibility processing to determine whether participants meet service-hour thresholds.","updated":"2026-06-25","created":"2026-04-16","sources":1,"status":"needs-review","tags":["hours","eligibility","ltpt","process","eds"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Hours Procedure","type":"data-loading","tags":["hours","eligibility","ltpt","process","eds"],"created":"2026-04-16","updated":"2026-06-25","sources":1,"status":"needs-review"},"markdown":"# Hours Procedure\n\nThe procedure for loading or tracking participant hours data — used in eligibility processing to determine whether participants meet service-hour thresholds.\n\n## Definition\n\nHours data drives two eligibility thresholds at TA:\n1. **Standard eligibility:** 1,000 hours per year (traditional plan eligibility)\n2. **LTPT eligibility:** 500 hours × 2 consecutive years (Long-Term Part-Time; Secure Act 2.0; effective Jan 1, 2025)\n\nThe Hours Procedure covers how hours data is sourced, formatted, and loaded so that eligibility rules can be correctly applied in P3.\n\n## Why It Matters\n\nIf hours data is wrong or missing, the eligibility engine in P3 calculates incorrectly — resulting in participants being marked eligible when they shouldn't be, or vice versa. LTPT specifically requires tracking hours across two years, which adds complexity for plans with part-time employees.\n\n## LTPT Hours Tracking (Secure Act 2.0)\n\nPer [[ltpt-eligibility]]:\n- EDS codes **5** and **6** are used for LTPT eligibility data\n- Hours must be tracked for employees excluded from the plan's main class who are still accruing LTPT service hours\n- Two years of consecutive 500-hour service → triggers LTPT eligibility effective January 1, 2025\n\n## Loading Hours Through EDS\n\nHours data is loaded via EDS following the same general process as other data types:\n- DC sets up the hours layout in EDS (P3 menu bar → EDS) before files arrive\n- Each plan may have a unique hours data format from the prior vendor — confirm via data discovery\n- EDS output must be reviewed for errors and warnings after every run\n\n## Source Notes\n\nCurrent content is derived from [[sources/lmdc-training-notebook]] and [[ltpt-eligibility]]. Procedure-level EDS steps still need direct source confirmation.\n\n## Related Concepts\n\n- [[eligibility]] — hours data feeds directly into eligibility rule processing\n- [[ltpt-eligibility]] — LTPT-specific hours tracking requirements\n- [[processes/eligibility-loading|loading-eligibility-eds]] — eligibility EDS loading; hours often loaded alongside or before eligibility\n- [[eds]] — the system through which hours data is loaded\n\n## See Also\n- [[eligibility]]\n- [[ltpt-eligibility]]\n- [[processes/eligibility-loading|loading-eligibility-eds]]\n- [[eds]]"},{"id":"reference/informatica","slug":"informatica","rel":"reference/informatica.md","namespace":"reference","title":"Informatica","summary":"ETL/workflow processing tool used to run the four main conversion workflows: Day of Wire, Participant Balance (CIT Balance), Loan Module, and Allocation Module. A standalone desktop application that runs against the DIVRDIVP database connec","updated":"2026-07-08","created":"2026-04-14","sources":3,"status":"current","tags":["system","etl","workflows","processing"],"type":"reference","extras":[],"media":[],"meta":{"title":"Informatica","type":"reference","tags":["system","etl","workflows","processing"],"created":"2026-04-14","updated":"2026-07-08","sources":3,"status":"current"},"markdown":"# Informatica\n\nETL/workflow processing tool used to run the four main conversion workflows: Day of Wire, Participant Balance (CIT Balance), Loan Module, and Allocation Module. A standalone desktop application that runs against the DIVRDIVP database connection.\n\n## Overview\n\nInformatica handles the heavy-lifting data processing workflows during a conversion. DCs import a CONV file or census-derived file into Informatica and trigger the appropriate workflow. It is distinct from [[eds]] (which handles layout validation) — Informatica runs the actual conversion processing logic.\n\n## Finding and Running Your Workflow\n\nFrom the Informatica quick-start guide:\n\n1. **Log in early.** The login/connection can be flaky for no reason. Make logging in part of the morning routine so any connection fight happens with no pressure — any day you might need Informatica, it should already be open.\n2. **Navigate:** Production area → **DC Implementation** folder → **Workflows** folder → find the workflow with **your name** → drag it into the workflow designer.\n3. **Run:** right-click inside the body of the workflow designer → **Start Workflow**. Then jump to the Monitor window (launch it *before* starting) — scroll all the way down, the DC folder is at the very bottom of the list — and find your name and activity. If it fails, double-click into the error.\n\n**Why everyone has their own workflow:** the workflows are identical except one parameter pointing at a personal parameter file in the parameter files folder. Selecting your name selects your parameter file. This keeps people from crossing wires — a shared central parameter file would mean one person forgetting to update it breaks everyone.\n\n## Parameter File Discipline\n\nParameter file mistakes fail silently — the workflow runs, looks fine, and produces wrong results with no error output. Five safeguards, every run (from the balance import guide):\n\n1. **Build parameter files in advance** — one prepared file per workflow type (Mapping · Balances · TIK · Loans). Activate the right one when the run starts; no scrambling on the day.\n2. **Prepare folders and paths in advance.** Use case/affiliate-specific input file names — if the wrong folder is selected, a unique file name makes the workflow fail to find the file instead of finding the wrong plan's file.\n3. **Keep the active parameter file open during the run.** Visually confirm the file name, source folder, input file names, test flag, and workflow type before starting. Don't rely on memory.\n4. **Check the test flag every single time.** Running live with test = Y, or test with test = N, produces results that look correct but aren't.\n5. **Archive after the run** — move the used file into the plan folder; keep the working folder clean.\n\nPractical tips (from the Informatica quick-start guide):\n\n- Case number and affiliate need **proper spacing** — wrong spacing can produce no error at all, just nothing happening.\n- The **order of lines in the parameter file doesn't matter** — put the parts you check most (file and folder names) at the very top so you see them the moment you open it.\n- Before any run, eyeball the input file itself: know what it's supposed to look like and confirm it matches.\n\n## Key Workflows\n\n### 1. Day of Wire Workflow (`WF_DAY_OF_WIRE_IM`)\n\n**Purpose:** Processes the initial wire/fund receipt on liquidation day. Creates trans ref number records and either books funds to a dummy account (mapping) or creates a placeholder (TIK).\n\n**Input:** CONV file — one row per fund, saved as text tab-delimited, containing:\n- Trans ref numbers (created in P2/P3)\n- Fund totals (from prior vendor breakdown)\n- Prior vendor fund descriptor\n- TransAmerica fund descriptor\n- Re-registering field (Y/N)\n- Other required fields\n\n**Parameter file — key Day of Wire settings:**\n```\n$$PLAN_YR_DT = [year]          -- Only needs changing for first January plan\n$$DATE_STRING = [YYYYMMDD]     -- Eff/Cyc date for 1006's (Takeovers)\n$$DATE_STRING_REREG = [YYYYMMDD] -- Eff/Cyc date for 1119's (Re-regs) — must be liquidation date, NOT effective date\n$$WIRE_D = [YYYY-MM-DD]        -- Eff/Cyc date for 1006's in Fin_Act_Pend\n$$REREG_D = [YYYY-MM-DD]       -- Eff/Cyc date for 1119's in Fin_Act_Pend\n$InputFileDayofWire = CONV_FILE_[CASENO].txt\n```\n\n**Run as:** `$$TEST_FILE=N` for live. Do NOT run as Y — it still writes to case_remit and bill_remit_detail, just not the FIN_ACT tables.\n\n**Inserts into:** CASE_REMIT, FIN_ACT_PEND, FIN_ACT_ELEC, BILL_REMIT_DETAIL\n\n**11-step verification SQL audit** must be run after completion. Steps include:\n1. CONV file structure check\n2. Rollover source query (Step 2 SQL)\n3. Dummy SSN verification in EMPLOYEE and PART_ENRL_XREF tables\n4. Parameter file update\n5. Run workflow\n6. CASE_REMIT audit\n7. FIN_ACT_PEND audit\n8. FIN_ACT_ELEC audit\n9. BILL_REMIT_DETAIL audit\n10. Verify SS# and CTRB type exist on plan\n11. Verify CASE_REMIT and BILL_REMIT_DETAIL match\n12. Verify wire fund totals match wire amount\n13. (After batch processing) Check TRANSACT_DET_REM fund amounts\n\n**Triggered when:** Wire total matches breakdown total on liquidation day.\n\n**Critical limitation: CANNOT be tested end-to-end.** Debug/preview mode exists but a full test run is not available.\n\n**Behavior by conversion type:**\n\n| Conversion Type | Re-reg field | Outcome |\n|-----------------|-------------|---------|\n| Mapping | N | Books to dummy participant account; trades go out |\n| Transfer In Kind | Y | Creates placeholder in Bill Remit (no details, no trades) |\n| Cash | N/A | Advanced employer process used instead |\n\n**Pre-requisites before running:**\n- [[dummy-participant]] (SSN 999-00-0000) must exist in census (for mapping)\n- Plan must be fully set up in P3\n- Trans ref numbers must already be created\n\n### 2. Participant Balance Workflow (CIT Balance / `mp_part_balance`)\n\n**Purpose:** Posts individual participant balances from the final files to the plan in P3.\n\n**Input:** CIT balance file — built by DC from final files.\n\n**Can be tested** — run a test pass before production.\n\n**Parameter file — key settings:**\n```\n$$Test_File = P   (preliminary — no SSNs loaded to system yet)\n$$Test_File = Y   (test — SSNs on system; run as test)\n$$Test_File = N   (no — SSNs on system; ready to load live)\n```\n\n**Fund and source maps:** Saved as text tab-delimited. Keep leading zeros in fund map. Case sensitive when saving.\n\n**Behavior:**\n- Posts balance details to Bill Remit detail table in P3\n- For mapping/TIK: fills in the \"holes\" left by the Day of Wire workflow\n- After running: DC must review P3, then reverse dummy participant if applicable (mapping)\n\n**Loan fund filtering:** If the prior vendor balances include a loan fund (representing loan money), filter it out. The loan fund is a parameter in the parameter file. Track loans by loading the loan data via the Loan Module instead.\n\n### 3. Loan Module\n\n**Purpose:** Loads participant loan data (header and source balances) from prior vendor.\n\n**Targets:** `PENSION.CONV_LOAN` (header data) and `PENSION.CONV_LOAN_PRIN` (source balance data)\n\n**Prerequisites:**\n1. Set up loans on P3 first: Plan tab → Conversions → add recordkeeper → enter vendor name → Save\n2. Go to Conversions tab → New Conversion → enter plan number → enter conversion date, effective date, assigned date → Save\n3. Ensure parameter file has: Prior vendor name (must match censuslookupfile.xls exactly), Plan name, User ID, Effective date\n\n**NPER on Quarterly Loans — rounding logic (effective April 2015):**\n- Decimal ≤ 0.10 → round down\n- Decimal 0.11–0.89 → if result × repayment amt > $10, round up; if ≤ $10, round down\n- Decimal > 0.89 → round up\n\n**After loan module runs:**\n- Check **Loan Compare file** — all differences must = 0\n- Check **Loan BEE detail** for errors\n- Then run the **Loan Load Job** in P3: Conversions tab → Existing Conversion → select plan → Takeover Loans → choose session → Upload (or \"Upload and create 12 month balances\" if HOLB not provided)\n\n**Common error causes:**\n- \"Conversion number not found\" = loans not set up on P3\n- \"Nper is null or zero\" = loan frequency not in censuslookupfile, or vendor name spelled differently than lookup file\n- \"SSN not found on system for plan\" = census not yet loaded (acceptable if preliminary run)\n- \"Source I does not exist on plan\" = source mapping incomplete or bad data\n\n### 4. Allocation Module (`wf_mp_CIT_Elections_Module`)\n\n**Purpose:** Maps prior fund allocations to TA funds for participant investment elections.\n\n**Key checks before running:**\n- Withdrawal sequence in the fund map must be a number (not blank or text) — rows with non-number sequences are thrown out\n- Check for spaces on prior fund names (causes errors with fund splits)\n\n## CONV File Structure\n\nThe CONV file is the input for the Day of Wire workflow. One row per fund. Save as text tab-delimited.\n\n| Field | Description |\n|-------|-------------|\n| Case Number | Plan case number |\n| Prior Fund Code | Prior vendor's fund identifier |\n| TA Fund Code | TransAmerica fund identifier |\n| Ref Number | Transfer reference number (created in P2) |\n| Amount | Total dollar amount for this fund |\n| ReReg | Y or N (Y = transfer in kind; N = mapping/cash) |\n\n> [!contradiction] CONV field count\n> This page lists 6 CONV fields (Case Number, Prior Fund Code, TA Fund Code, Ref Number, Amount, ReReg). The balance import guide lists **7**, adding **\"Source I — unique internal source ID used by the workflow to route the line correctly\"** between Ref Number and ReReg. Verify against a current CONV template before building.\n\nThe guide also adds two CONV rules: one ref number per fund — do not reuse one ref across multiple funds unless the approved setup explicitly says to; and keep the file **tab-delimited text** — do not save as CSV and expect the workflow to read it the same way. By type: Mapping (Re-Reg = N) creates 1006 activity + trades, loading mapped assets to the dummy participant; TIK (Re-Reg = Y) creates 1119 activity with no trades, setting up the book record/placeholder for the securities. (from the balance import guide)\n\n**CONV vs. CIT Balance File:**\n- CONV file = **fund-specific** (one row per fund) — used for Day of Wire\n- CIT balance file = **participant-specific** (one row per participant per source per fund) — used for Balance Module\n\n## Source Mapping Query (Standard)\n\nRun in AQT to get TA source IDs for source mapping:\n```sql\nSELECT a.SRC_I, a.SRC_S, a.REPORT_1_NM, a.REPORT_2_NM,\n       a.SP_REPORT_1_NM, a.SP_REPORT_2_NM, doc_nm\nFROM corp.plan_src_detail a, pension.plan_provision b, pension.plan_prov_grp c\nWHERE A.SRC_I = B.RELATED_I\n  AND B.PROV_TYP_C = 1019\n  AND b.enrl_prov_grp_i = c.enrl_prov_grp_i\n  AND account_no = '[ACCOUNT_NO]'\n```\n\n## Connection Setup\n\nIf encountering \"failed to get the connections\" error: the DIVRDIVP connection is not set up. Go to Edit Session → Mapping → Connections → change from ODSP to DIVRDIVP; set all SQLs to relational and DIVRDIVP.\n\nAlternatively, copy a working TRS module session from an existing workflow (which carries its connections and parameters), then link your vendor-specific session to it.\n\n## Access\n\n**Standalone desktop application** — not a URL, not within P3. Accessed separately from P3.\n\n## See Also\n\n- [[p3]]\n- [[eds]]\n- [[liquidation-day]]\n- [[final-files-processing]]\n- [[dummy-participant]]\n- [[conversion-types]]\n- [[processes/tik-transfer|transfer-in-kind]]\n- [[conv-file]]\n- [[aqt]]"},{"id":"data-loading/informatica-allocation-module","slug":"informatica-allocation-module","rel":"data-loading/informatica-allocation-module.md","namespace":"data-loading","title":"Informatica Allocation Module","summary":"Maps prior fund allocations to TA funds for participant investment elections during conversion.","updated":"2026-07-08","created":"2026-04-16","sources":1,"status":"needs-review","tags":["informatica","allocation","system"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Informatica Allocation Module","type":"data-loading","tags":["informatica","allocation","system"],"created":"2026-04-16","updated":"2026-07-08","sources":1,"status":"needs-review"},"markdown":"# Informatica Allocation Module\n\nMaps prior fund allocations to TA funds for participant investment elections during conversion.\n\n## Current Documentation\n\nContent for this module is currently documented in the **Informatica hub page** under the Allocation Module section:\n\n> **[[informatica]] → Section 4: Allocation Module (`wf_mp_CIT_Elections_Module`)**\n\nKey points documented there:\n- Maps prior fund allocations to TA funds for participant investment elections\n- Pre-run check: withdrawal sequence in fund map must be a number (not blank or text) — rows with non-number sequences are thrown out\n- Pre-run check: spaces on prior fund names cause errors with fund splits\n\n## Elections File — Fields and Save Rules\n\nFrom the balance import guide:\n\nThe elections input file has 5 fields and stays **comma-delimited (CSV)** — unlike the CONV (tab), CIT balance (fixed-width), and loan (pipe) files:\n\n| Field | Rule |\n|---|---|\n| SSN | Participant identifier |\n| Prior fund ID | Prior RK fund identifier for the election line |\n| Prior source ID | Prior RK source identifier for the election line |\n| Percent | **Whole number** — do not enter as a decimal unless the workflow layout specifically changes |\n| Default | `N` for all entries |\n\nSource handling can vary: the election can be copied across all sources or tied to a representative source depending on the workflow setup — confirm the current layout before loading.\n\n## Reconcile the Election Population Explicitly\n\nNever infer or assume the election population ties out. State it explicitly: \"150 participants, 140 elections, 10 defaulted = 150.\" (from the balance import guide)\n\n## Source Notes\n\nCurrent content is derived from [[informatica]] and [[sources/lmdc-training-notebook]]. A dedicated module procedure is still needed before this can be marked current.\n\n## Full Documentation\n\nWhen a dedicated functional documentation source is ingested, this page will be expanded with complete parameter file settings, step-by-step workflow, error handling, and validation steps.\n\n## See Also\n- [[informatica]]\n- Informatica Training Manual\n- [[informatica-balance-module]]\n- [[informatica-loan-module]]\n- [[fund-mapping]]\n- [[final-files-processing]]"},{"id":"data-loading/informatica-balance-module","slug":"informatica-balance-module","rel":"data-loading/informatica-balance-module.md","namespace":"data-loading","title":"Informatica Balance Module","summary":"Posts individual participant balances from final files into the plan in P3.","updated":"2026-07-08","created":"2026-04-16","sources":1,"status":"needs-review","tags":["informatica","balance","system"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Informatica Balance Module","type":"data-loading","tags":["informatica","balance","system"],"created":"2026-04-16","updated":"2026-07-08","sources":1,"status":"needs-review"},"markdown":"# Informatica Balance Module\n\nPosts individual participant balances from final files into the plan in P3.\n\n## Current Documentation\n\nContent for this module is currently documented in the **Informatica hub page** under the Participant Balance Workflow section:\n\n> **[[informatica]] → Section 2: Participant Balance Workflow (CIT Balance / `mp_part_balance`)**\n\nKey points documented there:\n- Input: CIT balance file built by DC from final files (participant-specific; one row per participant per source per fund)\n- **Can be tested** — run a test pass before production\n- Parameter file test modes: `P` (preliminary — SSNs not yet on system), `Y` (test — SSNs on system), `N` (live)\n- Fund and source maps saved as text tab-delimited; keep leading zeros; case sensitive\n- After running: DC reviews P3, then reverses dummy participant if applicable (mapping conversions)\n- Loan funds in prior vendor balances must be filtered out; load loan data via the Loan Module instead\n- FMC must be updated with FMC Estimate output by 4:00 PM (or 2:00 PM for Vanguard funds — see Rich Lippoth)\n\n## CIT Balance File — Fields and Save Rules\n\nFrom the balance import guide:\n\nThe CIT balance file has 5 fields per line:\n\n| Field | Notes |\n|---|---|\n| Case number | Must use the proper spacing the workflow expects |\n| Region | Corp or TDA |\n| Prior source ID | Must align to the approved source mapping |\n| Prior fund ID | Prior RK fund identifier used to match participant dollars to the mapped fund |\n| Total | Total dollar amount for that source/fund line |\n\n**Save rule:** the file is fixed-width. Save as **PRN first, then change the extension to `.txt`** — this preserves column width. Working template widths: `15, 4, 11, 30, 30, 14`.\n\n## Testing Discipline\n\nThe participant balance workflow is testable, so test it every time (from the balance import guide):\n\n- Run CIT in test first and **review the output**, not just the success/fail status. Confirm totals, participant counts, and penny-level rounding.\n- If totals are off by a penny or two from rounding, decide whether to adjust the file or document the expected variance **before** the production run.\n- CIT testing is not a substitute for day-of-wire validation — the day-of-wire workflow still cannot be tested end-to-end.\n\n## Parameter File — cash-conv Flag\n\n- **Cash conversion:** `cash-conv = Y`; the AE liquidation ref number is created in P2 and attached to the parameter file.\n- **Mapping conversion:** `cash-conv = N`; the ref numbers live in the fund mapping file — the workflow finds them there.\n- **TIK:** its own parameter file, activated only after Matt O'Connell's team confirms account setup — never before.\n\n## Source Notes\n\nCurrent content is derived from [[informatica]] and [[sources/lmdc-training-notebook]]. A dedicated module procedure is still needed before this can be marked current.\n\n## Full Documentation\n\nWhen the functional documentation source is ingested, this page will be expanded with complete parameter file settings, error handling, and post-run validation steps.\n\n## See Also\n- [[informatica]]\n- Informatica Training Manual\n- [[informatica-allocation-module]]\n- [[informatica-loan-module]]\n- [[final-files-processing]]\n- [[fund-management-calendar]]\n- Rich Lippoth"},{"id":"data-loading/informatica-loan-module","slug":"informatica-loan-module","rel":"data-loading/informatica-loan-module.md","namespace":"data-loading","title":"Informatica Loan Module","summary":"The Informatica module that loads participant loan header records and source-balance allocations from a prior record keeper into P3.","updated":"2026-07-08","created":"2026-04-16","sources":1,"status":"current","tags":["informatica","loans","system","conversion"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Informatica Loan Module","type":"data-loading","tags":["informatica","loans","system","conversion"],"created":"2026-04-16","updated":"2026-07-08","sources":1,"status":"current"},"markdown":"# Informatica Loan Module\r\n\r\nThe Informatica module that loads participant loan header records and source-balance allocations from a prior record keeper into P3.\r\n\r\n## Definition\r\n\r\nOne of the core Informatica modules used during a plan conversion, alongside the [[informatica-balance-module|Balance]] and [[informatica-allocation-module|Allocation]] modules. The Loan Module reads a normalized loan import file plus a parameter file, applies frequency lookups and NPER rounding rules, and writes:\r\n\r\n- **`PENSION.CONV_LOAN`** — one row per loan (header: outstanding balance, frequency, NPER, deemed status).\r\n- **`PENSION.CONV_LOAN_PRIN`** — one row per source per loan (allocation of outstanding principal across money sources).\r\n\r\nIt is invoked at **Step 10** of [[loan-setup]], after the [[roles/lm-dc]] has confirmed Header = Source totals and verified the Deemed fields.\r\n\r\n## Why It Matters\r\n\r\nThe Loan Module is the only path by which prior-vendor loans become repayable loans inside P3. Everything downstream — repayment schedules, source-balance reconciliation, deemed-loan tax reporting — depends on what this module writes. It is also the most error-prone module because it depends on three separate correctness conditions:\r\n\r\n1. The loan file is internally consistent (Header = Source).\r\n2. The Deemed Date / Amount fields follow the blank-vs-zero rules.\r\n3. The vendor name in the parameter file matches `censuslookupfile.xls` exactly.\r\n\r\nAny one of these wrong throws an error. Wrong vendor name is the most common culprit and the least obvious from the error message.\r\n\r\n## Pre-Run Requirements\r\n\r\nBefore invoking the module, the [[roles/lm-dc]] must have:\r\n\r\n- **P3 conversion record created** (Plan tab → Conversions → Add Record Keeper → New Conversion). Without this, the module raises \"Conversion number not found.\" See [[loan-setup]] Steps 1–7.\r\n- **Conversion Number** captured from P3.\r\n- **Loan import file** validated: Header outstanding = Source totals, exactly to the cent.\r\n- **Deemed fields** verified: Deemed Date blank or populated; Deemed Amount **never blank** (use `0` if no deemed amount).\r\n- **Record Keeper Name** matches `censuslookupfile.xls` character-for-character.\r\n\r\n### If Header ≠ Source totals\r\n\r\nWork through these in order (from the balance import guide): the detail report often misses the latest payment — reconcile against the source breakdown first; if a refinance was in flight at conversion, get the prior RK to confirm current terms; if the plan is frozen with no re-amortization, terms shouldn't move — confirm the snapshot is from the right date; loop in the prior RK if numbers still don't tie.\r\n\r\n### P3 conversion record — the date trick\r\n\r\nWhen creating the conversion record, set **Conversion Date and Assign Date to effective date − 3 months** — not the effective date itself (from the balance import guide). The offset gives P3 the runway to process loan records against an \"already-existing\" conversion; without it, the workflow either rejects the record or applies wrong timing downstream. It's a P3 quirk — follow it. Also capture the Conversion Number P3 generates at save time; you'll need it for the upload step.\r\n\r\n## File Formats\r\n\r\nFrom the balance import guide:\r\n\r\n- **Loan Header** and **Loan Source** are both **pipe-delimited** text files. Practical method: save as CSV, then replace the commas with `|`.\r\n- Loan Header is one row per loan (11 fields, including SSN, loan index, original amount, start date, payment frequency, payment amount, current balance, default date, default amount, interest rate, payoff date). Loan Source is one row per source per loan (SSN, loan index, source code, amount); the loan index is the join point between the two files.\r\n- **Default date** may arrive in a separate vendor report — don't assume it's missing just because it's not in the main loan file. **Default amount** is very likely the same as current balance, but verify against the vendor report.\r\n- **HOLB** (Highest Outstanding Loan Balance — the historical maximum a participant has had outstanding, used for IRS new-loan limits) is one row per participant. If the prior RK provides it, upload it alongside the loan files; if not, click **Upload and Create** in P3 and it's generated from the loan files.\r\n\r\n## Test Toggle and Outputs\r\n\r\nThe loan workflow has its own test mode (from the balance import guide):\r\n\r\n1. Run with **test = Y** first — validates end-to-end without committing loan records. Check the output carefully.\r\n2. If clean, flip to **test = N** for the production run.\r\n3. **One of the test outputs becomes the next input** when you flip from test to production — do not overwrite, rename, or archive it too early. Keep Header, Source, test output, and the production-ready input together in the plan folder until the upload completes.\r\n4. Archive the parameter file to the plan folder after the run.\r\n\r\nThe **Loan Header file feeds the audit pack that goes to QA** — whatever's in the Header is what QA reviews, so clean the data before the test-mode run, not after.\r\n\r\n## Parameter File\r\n\r\nThe parameter file requires:\r\n\r\n- **Prior vendor name** (must match `censuslookupfile.xls` exactly — casing, spacing, punctuation)\r\n- **Plan name**\r\n- **User ID**\r\n- **Effective date** (matches the P3 conversion record's Effective Date)\r\n\r\nA mismatch in vendor name surfaces as `Nper is null or zero` because the module cannot resolve the loan frequency for an unknown vendor.\r\n\r\n## NPER Rounding (effective April 2015)\r\n\r\n`NPER` (number of remaining periods) often arrives as a decimal. The module applies these rules:\r\n\r\n- decimal ≤ 0.10 → **round down**\r\n- 0.11 – 0.89 → **round up if** result × repayment > $10, **else round down**\r\n- decimal > 0.89 → **round up**\r\n\r\nThe \"× repayment > $10\" carve-out exists to avoid rounding up into a partial period that would generate a sub-$10 last payment.\r\n\r\n## Targets\r\n\r\n| Table | Purpose | One row per |\r\n|-------|---------|-------------|\r\n| `PENSION.CONV_LOAN` | Loan header (outstanding, frequency, NPER, deemed status) | Loan |\r\n| `PENSION.CONV_LOAN_PRIN` | Source allocation of principal | Source × loan |\r\n\r\n## Post-Run Validation\r\n\r\nAfter the module finishes, the DC checks:\r\n\r\n1. **Loan Compare file** — generated diff between source totals and loaded totals. **All differences must equal `0`.** Any non-zero is reconciled before continuing.\r\n2. **Loan BEE detail** — error log. Investigate every error before moving on.\r\n3. **Loan Load Job in P3** — only run after Loan Compare is clean. This is what surfaces the loaded loans inside P3 ready for Takeover Loans submit.\r\n\r\n## Common Errors and Causes\r\n\r\n| Error | Likely Cause |\r\n|-------|--------------|\r\n| `Conversion number not found` | Loans not set up on P3 — Steps 1–7 of [[loan-setup]] not completed. |\r\n| `Nper is null or zero` | Loan frequency missing from `censuslookupfile.xls`, **or** vendor name in parameter file does not match the lookup file exactly. |\r\n| `SSN not found on system for plan` | Census not yet loaded for the plan. OK if running preliminary; fix before final files. |\r\n| `Source I does not exist on plan` | [[source-mapping]] incomplete or vendor sent loan principal allocated to a source that does not exist on the destination plan. |\r\n| Blank `Deemed Amount` rejection | Step 9 of [[loan-setup]] not followed — Deemed Amount must be `0` (never blank) for non-deemed loans. |\r\n\r\n## Sequencing in the Conversion\r\n\r\nThe Loan Module runs **once per plan, mid-conversion** — after P3 setup is complete and before participant balances post. It is the gate between \"loans are file data\" and \"loans live in P3.\" See [[loan-setup]] for the full 14-step process and [[plan-conversion-handoffs]] for where this fits in the wider conversion timeline.\r\n\r\n## Counterarguments and Edge Cases\r\n\r\n- **Multi-vendor conversions.** A plan with loans from two prior vendors (rare but happens during M&A) requires running the module once per vendor, with each parameter file pointing at its own vendor name. Both runs feed the same Conversion Number.\r\n- **Loans-only conversion.** Some takeovers move only loans (balances stay at the prior RK temporarily). The module runs the same way; only the downstream balance steps are skipped.\r\n- **Re-running after error.** Safe to re-run after fixing the source error — the module is idempotent against `CONV_LOAN` / `CONV_LOAN_PRIN` for the same Conversion Number.\r\n\r\n## See Also\r\n\r\n- [[loan-setup|Loan Setup & Processing (process page)]]\r\n- [[loan-setup|Loan Setup (concept)]]\r\n- [[informatica]]\r\n- Informatica Training Manual\r\n- [[informatica-balance-module]]\r\n- [[informatica-troubleshooting-guide]]\r\n- [[final-files-processing]]\r\n- [[plan-conversion-handoffs]]"},{"id":"troubleshooting/informatica-troubleshooting-guide","slug":"informatica-troubleshooting-guide","rel":"troubleshooting/informatica-troubleshooting-guide.md","namespace":"troubleshooting","title":"Informatica Troubleshooting Guide","summary":"Common Informatica errors, their causes, and how to resolve them.","updated":"2026-07-08","created":"2026-04-16","sources":1,"status":"needs-review","tags":["informatica","troubleshooting","system"],"type":"troubleshooting","extras":[],"media":[],"meta":{"title":"Informatica Troubleshooting Guide","type":"troubleshooting","tags":["informatica","troubleshooting","system"],"created":"2026-04-16","updated":"2026-07-08","sources":1,"status":"needs-review"},"markdown":"# Informatica Troubleshooting Guide\n\nCommon Informatica errors, their causes, and how to resolve them.\n\n## Current Documentation\n\nKnown errors and fixes are currently documented in the **Informatica hub page**:\n\n> **[[informatica]] → Connection Setup section and Loan Module error causes**\n\nKey errors documented there:\n\n**Connection error:**\n- \"Failed to get the connections\" → DIVRDIVP connection not set up\n- Fix: Edit Session → Mapping → Connections → change from ODSP to DIVRDIVP; set all SQLs to relational and DIVRDIVP\n- Alternative fix: copy a working TRS module session from an existing workflow (carries its connections and parameters), then link your vendor-specific session to it\n\n**Loan Module errors:**\n- \"Conversion number not found\" → loans not set up on P3 first\n- \"Nper is null or zero\" → loan frequency not in censuslookupfile, or vendor name spelled differently than lookup file\n- \"SSN not found on system for plan\" → census not yet loaded (acceptable if preliminary run)\n- \"Source I does not exist on plan\" → source mapping incomplete or bad data\n\n## Parameter File Errors\n\nBy far the most common failures trace back to the parameter file — incorrectly named files and incorrect folders (from the Informatica quick-start guide):\n\n| What you see | Why | Fix |\n|---|---|---|\n| \"No such file exists\" | The parameter file's file name doesn't match the actual file — an extra space or wrong upper/lowercase. It's **case-sensitive** and must be perfect. | Match the file name exactly, character for character. |\n| File not found, but the name looks right | The folder in the parameter file is wrong — the file isn't in the folder it's pointed at. | Confirm the folder path points where the file actually lives. |\n| Column-count error | The file has the wrong number of columns. | Compare the file against the expected layout. |\n\n### The silent one — wrong spacing\n\nIf the case number has the wrong spacing (say three spaces where it needs two), you may get **no error at all — but nothing happens**. It's still a failure, just a quiet one that's hard to nail down. Check the parameter file's spacing before every run.\n\n## Silent Failure Modes\n\nThese produce runs that look clean but aren't (from the balance import guide):\n\n- **Wrong active parameter file** — you edited a working/raw file but didn't save it as the active named parameter file the workflow calls. Before running, confirm the file name open on screen is the exact file the workflow will use.\n- **Wrong test flag** — running live with test = Y (or test with test = N) produces results that look correct but aren't. Verify the flag every run.\n- **Wrong source folder** — use case/affiliate-specific input file names so a wrong-folder run fails by not finding the file rather than finding another plan's file.\n- **Workflow fails on a file that looks clean in Excel** — almost always hidden metadata or structural issues. Run it in **developer mode** to see what Informatica actually sees, not the Excel view.\n\n## Source Notes\n\nCurrent content is derived from the [[informatica]] hub page. A dedicated troubleshooting source is still needed before this can be marked current.\n\n## Full Documentation\n\nWhen the troubleshooting guide source is ingested, this page will be expanded with errors across all modules (Day of Wire, Balance, Allocation, Basis), parameter file issues, and post-run audit failures.\n\n## See Also\n- [[informatica]]\n- Informatica Training Manual\n- [[informatica-loan-module]]\n- [[informatica-balance-module]]\n- [[informatica-allocation-module]]"},{"id":"vendors/kelly-benefits","slug":"kelly-benefits","rel":"vendors/kelly-benefits.md","namespace":"vendors","title":"Kelly Benefits","summary":"Kelly Benefits has multiple platforms — identify the platform first before assuming this is large-market payroll work.","updated":"2026-07-08","created":"2026-07-08","sources":1,"status":"active","tags":["vendor","payroll"],"type":"vendor","extras":[],"media":[],"meta":{"title":"Kelly Benefits","type":"vendor","tags":["vendor","payroll"],"created":"2026-07-08","updated":"2026-07-08","sources":1,"status":"active"},"markdown":"# Kelly Benefits\n\nKelly Benefits has multiple platforms — identify the platform first before assuming this is large-market payroll work.\n\n## Platform & layout\n\n- Kelly Benefits has three platforms. The Payroll platform is Paystart, not large market.\n- Advisory and the Remaining platform are large-market paths.\n- Large-market outbound requires a 1116 custom layout.\n- Uses Transamerica loan numbers.\n\n## File naming\n\n- Filename begins with `Payrollvendorfeed` and may include division if needed (e.g. `Payrollvendorfeed_QK63296_014_TWC_11262025.csv`).\n\n## FTP & PGP\n\n- Files are PGP encrypted and sent to the Kelly Benefits PGP folder.\n- Make sure the archive folder exists before go-live.\n- The PGP process pulls from the vendor folder, encrypts, sends, and archives the encrypted file.\n\n## See Also\n\n- [[payroll-vendor-onboarding]]\n- [[ftp-connection]]\n- [[payroll-template]]"},{"id":"glossary/kit-mail-date","slug":"kit-mail-date","rel":"glossary/kit-mail-date.md","namespace":"glossary","title":"Kit Mail Date","summary":"**Also called:** mail kit date","updated":"2026-05-03","created":"2026-05-03","sources":1,"status":"current","tags":["glossary","auto-enrollment","deferrals","escalation","historical-data"],"type":"glossary","extras":[],"media":[],"meta":{"title":"Kit Mail Date","type":"glossary","tags":["glossary","auto-enrollment","deferrals","escalation","historical-data"],"created":"2026-05-03","updated":"2026-05-03","sources":1,"status":"current"},"markdown":"# Kit Mail Date\n\n**Also called:** mail kit date\n\nThe date the auto-enrollment welcome kit was mailed to a participant. On plans that auto-escalate deferral rates over time, this date is what the system uses to count escalation steps — so it has to be accurate, and it has to come over from the prior record keeper.\n\n## Why It Matters\n\nMost auto-enrollment plans escalate the deferral rate by some increment (commonly 1% per year) up to a cap. To apply escalation correctly, the system needs to know *when* the participant was enrolled. Without the kit mail date, the system either skips escalation entirely or runs it from the wrong start point — both of which leave participants at the wrong rate.\n\n## Required Historical Data\n\nWhen pulling census/deferral data from the prior record keeper or client, request the kit mail date for every auto-enrolled participant. If the participant has ever been in auto-enroll default — even if they later opted out — the date is still relevant because it determines whether escalation milestones have been hit.\n\nThe reliability rules from [[deferrals]] apply: ADP is not a trusted source for these dates. Go to the client first.\n\n## See Also\n\n- [[deferrals]]\n- [[eligibility]]\n- [[eligibility-and-deferrals]]\n- [[prior-record-keeper]]"},{"id":"lifecycle/lm-dc","slug":"lm-dc","rel":"lifecycle/lm-dc.md","namespace":"lifecycle","title":"Large Market Data Consultant (LM DC)","summary":"The person responsible for all data-related work when onboarding a new retirement plan onto Transamerica's platform.","updated":"2026-04-15","created":"2026-04-14","sources":2,"status":"current","tags":["role","data","large-market","conversion","onboarding"],"type":"lifecycle","extras":[],"media":[],"meta":{"title":"Large Market Data Consultant (LM DC)","type":"lifecycle","tags":["role","data","large-market","conversion","onboarding"],"created":"2026-04-14","updated":"2026-04-15","sources":2,"status":"current"},"markdown":"# Large Market Data Consultant (LM DC)\r\n\r\nThe person responsible for all data-related work when onboarding a new retirement plan onto Transamerica's platform.\r\n\r\n## What This Role Does\r\n\r\nThe DC owns everything that touches data in a plan conversion — from the initial census file to the final balance posting. The job has two modes that alternate throughout a conversion:\r\n\r\n- **Preparation mode** (weeks to months before liquidation): building templates, establishing vendor relationships, getting mappings approved, setting up file layouts in EDS\r\n- **Execution mode** (liquidation day through final files): time-sensitive, sequential processing that must go right the first time\r\n\r\nThe DC is not client-facing by default. They attend external meetings only when data topics (base file, payroll) are explicitly on the agenda. Most DC work happens internally or directly with external vendors (prior record keeper, payroll vendor).\r\n\r\n## Systems They Use\r\n\r\n| System | Purpose |\r\n|--------|---------|\r\n| [[p3]] | Main plan administration platform — setup, processing, queries |\r\n| [[p2]] | Back-end region for creating transfer reference numbers |\r\n| [[eds]] | File layout, validation, and processing |\r\n| [[informatica]] | Day of Wire and Participant Balance workflows |\r\n| [[nbi]] | Plan assignment tracking — universal checklist per plan |\r\n| [[aqt]] | SQL query tool (read-only) — used to look up source IDs and build isolating queries |\r\n\r\n## Who They Work With\r\n\r\n| Team / Person | Nature of Relationship |\r\n|---------------|----------------------|\r\n| COM | COM sets meetings, manages PRD/subpack, routes approvals; DC sends mappings through COM |\r\n| [[qa]] | DC sends source and fund mappings to QA for approval; QA clears eligibility |\r\n| [[tc]] | Transition Consultant; CC'd on key communications alongside QA |\r\n| [[doc-ops]] | DC requests special plan class additions; Doc Ops sets up P3 |\r\n| [[cashiering]] | DC notifies Cashiering before and on liquidation day; Cashiering provides wire ref numbers |\r\n| [[ftp-team]] | DC requests FTP account setup for payroll vendors |\r\n| [[payroll-support]] | DC sends validated payroll test files for final green-light |\r\n| [[prod-support]] | DC submits AWD tickets for data corrections that can't be made through standard tools |\r\n| Ellen Miller | Manages assignment pipeline; notifies managers of open DC slots in NBI |\r\n| Matt O'Connell | Leads TIK re-registration; DC fills out re-reg form and coordinates timing |\r\n| Stacey Fortune | Cross-department manager; contact for AE liquidation requests and major approvals |\r\n| Nick Lister | DC's direct manager; escalation contact |\r\n\r\n## Key Handoffs\r\n\r\n**Comes in:**\r\n- Plan assignment notification via Ellen Miller → manager → DC tagged in [[nbi]]\r\n- PRD / onboarding package from COM\r\n- TOA (client-signed fund map) — triggers fund mapping phase\r\n- Test files from prior record keeper\r\n- Payroll test files from payroll vendor\r\n- Wire receipt confirmation + ref number from [[cashiering]]\r\n- Final files from prior record keeper\r\n\r\n**Goes out:**\r\n- Base file template → client\r\n- Payroll template → client + payroll vendor\r\n- Fund mapping → COM, [[qa]], [[tc]] for approval\r\n- Source mapping → COM, [[qa]], [[tc]] for approval\r\n- Wire instructions → prior record keeper\r\n- Re-registration form → Matt O'Connell\r\n- Test payroll files → [[payroll-support]] for final validation\r\n- Liquidation day heads-up → [[cashiering]]\r\n- Eligibility notification → [[qa]], [[tc]], [[roles/com]] (waits for go-ahead before enabling)\r\n- Audit pack → stored in client folder; reviewed by QA\r\n- NBI updates → continuous throughout conversion\r\n\r\n## What Other Teams Should Know\r\n\r\n- DC does not control meeting scheduling — that's COM's job. Looping DC into an external call without flagging data topics wastes DC time.\r\n- DC owns the re-registration form for TIK conversions — not Matt O'Connell's team. DC fills it out and sends it to Matt.\r\n- DC cannot add new special plan classes in P3 — that requires Doc Ops. DC can update existing class names and codes.\r\n- Timing matters. Matt O'Connell's team needs lead time (~10–12 business days before liquidation). FTP team has a large caseload — engage early. Do not wait.\r\n- \"Day of Wire\" in Informatica cannot be tested in a sandbox. Triple-check the CONV file before running.\r\n- When a reversal is needed: submit the Reversal Form to `slasrever@transamerica.com` first (as of 03/06/2026), then submit the AWD ticket with the response text pasted into comments. The old Plan Correction Checklist is retired. See [[processes/reversal-submission|reversal-process]].\r\n\r\n## Updated Procedures (2025–2026)\r\n\r\n### Payroll Handoff at Go-Live\r\nIf payroll testing is not complete at go-live, the DC submits a **FILESPECRQ** AWD ticket transferring the project to Fiduciary Services. The ticket must include payroll contact info, client contact info, file layout, and a summary of testing status. DC also updates NBI. COM notifies the Account Manager. See [[payroll-handoff-at-go-live]].\r\n\r\n### Booking Assets\r\nTwo distinct booking types as of August 2025:\r\n- Wire arrives at State Street → book as **4=Remit**, email NY Recon\r\n- Disbursing from AEDA to participant accounts → book as **3=Rebook** + submit rebook AWD ticket\r\nSee [[booking-assets]].\r\n\r\n### Fund Management Calendar\r\nThe FMC now requires an email to four distribution addresses whenever it is updated with fund balances, in addition to updating the file itself. The SSBT cut-off is 4:00 PM EST. Estimates must be entered at least five business days before TOA. See [[fund-management-calendar]].\r\n\r\n### Reversals (as of March 6, 2026)\r\nThe Plan Correction Checklist is retired. New process uses the Reversal Form at `slasrever@transamerica.com`. See [[processes/reversal-submission|reversal-process]].\r\n\r\n### LTPT Eligibility (effective January 1, 2025)\r\nEmployees with 500+ hours in two consecutive 12-month periods are eligible for elective deferrals. Two new EDS status codes (5 and 6). Hours must be tracked even for excluded-class employees. See [[ltpt-eligibility]].\r\n\r\n### Common Remitter Plans\r\nPlans coded \"common remitter\" require \"Verify Batch After Funding\" instead of standard Pre-Process in P3 on Day of Wire. See [[common-remitter-plans]].\r\n\r\n## Open Questions\r\n\r\n- Prior RK-specific workflows (Fidelity, Vanguard, Empower) — being built, not yet documented\r\n\r\n## See Also\r\n\r\n- [[dc-onboarding-workflow]] — the full 7-phase process reference\r\n- [[conversion-types]] — cash vs. mapping vs. transfer in kind\r\n- [[liquidation-day]] — execution day detail\r\n- [[final-files-processing]] — post-liquidation data posting\r\n- [[plan-conversion-handoffs]] — cross-team handoff map for plan conversions\r\n- [[census-data]] — participant data loading: fields, EDS process, audit checks\r\n- [[loading-basis-eds]] — basis loading: EE basis fields, Roth rules, tables\r\n- [[onboarding/lm-dc]] — reading list for new DCs"},{"id":"data-loading/limited-access-file","slug":"limited-access-file","rel":"data-loading/limited-access-file.md","namespace":"data-loading","title":"Limited Access File","summary":"A census variant the client provides during an **open period** right before the plan goes into blackout. Lets participants update their allocations (and occasionally other elections) immediately before liquidation. Used on **cash conversion","updated":"2026-05-03","created":"2026-05-03","sources":1,"status":"current","tags":["census","elections","blackout","cash-conversion","client-input"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Limited Access File","type":"data-loading","tags":["census","elections","blackout","cash-conversion","client-input"],"created":"2026-05-03","updated":"2026-05-03","sources":1,"status":"current"},"markdown":"# Limited Access File\n\nA census variant the client provides during an **open period** right before the plan goes into blackout. Lets participants update their allocations (and occasionally other elections) immediately before liquidation. Used on **cash conversions**.\n\n## Why It Exists\n\nOn a cash conversion, the prior record keeper liquidates everything to cash, wires it, and the money is reinvested at TransAmerica based on whatever each participant's current elections say on liquidation day. If a participant's elections are stale, the money lands in the wrong place and the participant has to file transfers afterward to fix it.\n\nThe limited access file gives participants one last chance to set elections cleanly **before** the wire arrives, so balances land where they want them on day one. No follow-up transfers needed.\n\n## When It Applies\n\n- **Cash conversions only.** Mapping conversions don't need it — money flows fund-to-fund per the [[fund-mapping]] regardless of participant elections.\n- The client must have an open period built into their conversion timeline, before blackout starts.\n\n## What It Contains\n\nPrimarily updated **allocations** (where future contributions go). Sometimes additional election changes — varies by client and plan design.\n\n## Process\n\n1. Client opens the limited access window for participants\n2. Participants log in (at the prior record keeper or via a TA-provided portal, depending on plan setup) and update their allocations\n3. At the end of the window, the client compiles the file and sends it to the DC\n4. DC loads the elections — typically alongside or just after the [[census-data]] load, before liquidation day\n5. On liquidation day, the wire arrives; the [[advanced-employer]] holds it; final files post and balances invest at the just-updated elections\n\n## Relationship to the Base File\n\nThe [[base-file]] is the broad census/eligibility/YTD seed for every conversion. The limited access file is a narrower election-update file layered on top, only on cash conversions where the client opened the window. Most conversions never use one.\n\n## See Also\n\n- [[census-data]]\n- [[base-file]]\n- [[balance-import-cash]]\n- Blackout Notice\n- [[defaulting-elections-eds]]"},{"id":"conversion-ops/liquidation-day","slug":"liquidation-day","rel":"conversion-ops/liquidation-day.md","namespace":"conversion-ops","title":"Liquidation Day","summary":"The day the prior record keeper liquidates (or transfers) plan assets and sends them to TransAmerica. The highest-stakes day in the conversion.","updated":"2026-05-03","created":"2026-04-14","sources":4,"status":"current","tags":["liquidation","day-of-wire","wire","cashiering","critical"],"type":"conversion-ops","extras":[{"type":"animation","href":"liquidation-day-featured.html","label":"Liquidation Day Walkthrough"}],"media":[],"meta":{"title":"Liquidation Day","type":"conversion-ops","tags":["liquidation","day-of-wire","wire","cashiering","critical"],"created":"2026-04-14","updated":"2026-05-03","sources":4,"status":"current","extras":["animation|liquidation-day-featured.html|Liquidation Day Walkthrough"]},"markdown":"# Liquidation Day\r\n\r\nThe day the prior record keeper liquidates (or transfers) plan assets and sends them to TransAmerica. The highest-stakes day in the conversion.\r\n\r\n## Overview\r\n\r\nLiquidation Day is when money (or shares) moves. Every action this day is time-sensitive and sequential. The DC orchestrates communications between the prior record keeper, Cashiering, and internal systems. Processing cannot begin until the wire is confirmed received.\r\n\r\n## Day Before\r\n\r\n**Email Cashiering:**\r\n> \"Hey, I have a wire coming in for [Plan Name]. Expecting approximately $[amount]. Just a heads up.\"\r\n\r\nSend to: `shtaopscashieringinc@transamerica.com`\r\n\r\nCashiering may already have a daily wire list with DC assignments, but send the email anyway. Better to be redundant than missed.\r\n\r\n**Email Prior Record Keeper:**\r\n> \"Just confirming we're good for tomorrow. Let me know if anything has changed.\"\r\n\r\nKeep everyone on notice. This is a big day.\r\n\r\n## Morning of Liquidation Day\r\n\r\n**Email Prior Record Keeper:**\r\n> \"Good morning — today's the day. Please send the wire and provide a fund breakdown and total as soon as possible. I can't move forward until I have the breakdown.\"\r\n\r\nOnce vendor confirms wire sent:\r\n- Notify Cashiering: \"Vendor says wire is sent. Expected total: $[X]. Let me know when you see it.\"\r\n\r\n## Wire Confirmation\r\n\r\nCashiering's wire pull schedule: **7 AM, 9 AM, 1 PM, and 3 PM CST**.\r\n\r\nCashiering will notify the DC by **3:45 PM** if the wire was received that day. If there is a delay, they reply to the DC's wire notification email acknowledging it and confirming when the daily notifications are complete.\r\n\r\n> **Wires received after 3:00 PM CST are deposited the next business day.**\r\n\r\nWhen confirmed, Cashiering emails:\r\n> \"Wire received for [Plan Name]. Amount: $X. Transfer Reference Number: [XXXX].\"\r\n\r\nThe **Transfer Reference Number** (trans ref number) is the unique ID for this wire transaction in the system.\r\n\r\n### Self-Service Confirmation in P2\r\n\r\nThe DC doesn't have to wait for the cashiering email. Two confirmation paths exist:\r\n\r\n1. **Email** — Cashiering's wire-received notification (described above)\r\n2. **Self-service** — Log into [[p2]], search the plan's ref numbers, find the row matching the expected wire amount, and pull the ref number from there. Once the ref number is visible in P2, that's confirmation the wire booked — proceed.\r\n\r\nUse whichever shows up first. Many DCs check P2 around the cashiering pull times (7 AM, 9 AM, 1 PM, 3 PM CST) rather than waiting for the email to land.\r\n\r\n## Processing by Conversion Type\r\n\r\n### Cash Conversion\r\n\r\nAfter wire confirmed and total matches breakdown:\r\n1. **Book as `4 = Remit`** — wire hits State Street, book using same process as normal\r\n2. Email NY Recon (so they can identify variances and piece together components)\r\n3. Move money to the **Advanced Employer (AEDA) account** in P3\r\n4. Email all parties: \"Wire received for [Plan Name], $[X]. Posted to Advanced Employer.\"\r\n5. Parties do their checks; they'll confirm or flag issues\r\n\r\n> Do NOT process participant balances on liquidation day for cash conversions. Wait for final files.\r\n\r\nSee [[booking-assets]] for the distinction between booking wires vs. AEDA disbursements.\r\n\r\n### Mapping Conversion\r\n\r\nAfter wire confirmed and total matches breakdown:\r\n1. Create trans ref numbers in P2/P3 — **one per fund** in the CONV file\r\n2. Fill totals into pre-prepared CONV file (fund amounts from vendor breakdown)\r\n3. Verify [[dummy-participant]] (SSN 999-00-00) is in the census — **do this now if not already confirmed**\r\n4. Import CONV file → run **Day of Wire workflow** in [[informatica]]\r\n5. Check P3: dummy participant should have balances; trades should be out\r\n6. Run queries to verify\r\n\r\n### Transfer In Kind\r\n\r\nSame as mapping for CONV file setup, except:\r\n- CONV file has **re-reg = Y** for TIK funds\r\n- Day of Wire creates placeholder (no details, no trades)\r\n- Notify Matt O'Connell's team that assets are moving\r\n- Shares will arrive at Fidelity — Matt's team will identify and apply\r\n\r\n## Wire Total Mismatch\r\n\r\nIf the wire total doesn't match the vendor's fund breakdown total:\r\n1. **Do not process.** Hold everything.\r\n2. Contact the prior record keeper vendor and ask for an explanation of the discrepancy.\r\n3. Do not proceed until the totals are reconciled and everything is in good order.\r\n\r\n> \"We don't process unless it's in good order.\"\r\n\r\n## Pre-Checks Before Running Day of Wire\r\n\r\nBefore importing CONV file to Informatica, verify:\r\n- [ ] Plan is fully set up in P3\r\n- [ ] Trans ref numbers created (one per fund)\r\n- [ ] CONV file totals match vendor breakdown\r\n- [ ] Dummy participant exists in census (mapping only)\r\n- [ ] Fund mapping is approved and loaded\r\n- [ ] Source mapping is approved and loaded\r\n\r\n## Key Rule: Day of Wire Cannot Be Tested\r\n\r\n> \"We can't test this, unfortunately.\"\r\n\r\nYou can preview/debug in Informatica but cannot do a full test run. Double-check everything before executing.\r\n\r\n## Totals Must Match\r\n\r\nBefore any Day of Wire action: wire total must match the vendor's fund breakdown total. If they don't match, hold. Investigate discrepancy before proceeding.\r\n\r\n## Trans Ref Number\r\n\r\nThe transfer reference number is the unique identifier for the wire transaction. It is:\r\n- Provided by Cashiering when they confirm the wire\r\n- Used to create corresponding ref numbers in [[p2]] for each fund (reflected in P3)\r\n- Referenced in the CONV file for each fund\r\n- Used to track the transaction throughout processing\r\n\r\n**Format:** Date in `YYYYMMDD` format followed by ~7–8 random alphanumeric characters.\r\n\r\n## P2 Navigation — Creating Trans Ref Numbers\r\n\r\nExact steps:\r\n1. Login screen → enter **CORP07** (for CORP plans) or **tdatest** (for TDA plans)\r\n2. Job # → **2001**\r\n3. Enter **contract number** and **affiliate number**\r\n4. Select **Option 4** to add a ref number\r\n5. Trans code: **1006**\r\n6. Proc code: **3**\r\n\r\nOne ref number per fund in the CONV file.\r\n\r\n## Cutoff Time — Critical\r\n\r\n**The SSBT (State Street Bank & Trust) cut-off is 4:00 PM EST. The [[fund-management-calendar]] must be updated AND the notification email sent to four distribution addresses before this time on any day trades go out.**\r\n\r\nWire confirmation from Cashiering is expected by 4:45 PM EST. If the wire is not confirmed by 4:00 PM, update the FMC to the next business day and send a follow-up notification email.\r\n\r\nSee [[fund-management-calendar]] for the full new procedure, email distribution list, and per-conversion-type details.\r\n\r\n> Entering estimates is fine. Not entering anything is a problem.\r\n\r\n### Common Remitter Plans\r\n\r\nIf the plan is coded as a \"common remitter,\" the standard **Pre-Process** option in P3's Remit Action dropdown will be absent. Use **\"Verify Batch After Funding\"** instead. See [[common-remitter-plans]] for the full alternative flow.\r\n\r\n## Open Questions\r\n\r\n- What queries should be run in P3 after Day of Wire to verify? *(Many — will be documented separately)*\r\n\r\n## See Also\r\n\r\n- [[conversion-types]]\r\n- [[informatica]]\r\n- [[dummy-participant]]\r\n- [[wire-instructions]]\r\n- [[final-files-processing]]\r\n- [[p3]]\r\n- [[booking-assets]]\r\n- [[common-remitter-plans]]\r\n- [[fund-management-calendar]]"},{"id":"sources/lmdc-training-notebook","slug":"lmdc-training-notebook","rel":"sources/lmdc-training-notebook.md","namespace":"sources","title":"LMDC Training Notebook","summary":"The official DC Team training OneNote notebook, exported as a web archive (.mht). A living document spanning 2015–2026 with the full DC workflow, data loading procedures, system guides, and updated procedures through April 2026.","updated":"2026-04-15","created":"2026-04-15","sources":1,"status":"current","tags":["source","dc","large-market","training","procedures","conversion"],"type":"source","extras":[],"media":[],"meta":{"title":"LMDC Training Notebook","type":"source","tags":["source","dc","large-market","training","procedures","conversion"],"created":"2026-04-15","updated":"2026-04-15","sources":1,"status":"current"},"markdown":"# LMDC Training Notebook\n\nThe official DC Team training OneNote notebook, exported as a web archive (.mht). A living document spanning 2015–2026 with the full DC workflow, data loading procedures, system guides, and updated procedures through April 2026.\n\n## Summary\n\nThis is the authoritative DC training reference maintained by the CIT Data Consultant team. It is a cumulative notebook — older sections remain for reference, newer sections supersede them where explicitly marked. The notebook covers every phase of a plan conversion from the DC perspective: onboarding, data loading, Informatica workflows, wire processing, payroll testing, and post-conversion data management.\n\n**Date range:** February 2015 (oldest entries) through April 6, 2026 (most recent entry)\n\n**Key principle for use:** When a section has a newer version, use the newest. Several sections are explicitly marked \"DO NOT USE\" (e.g., the old Fund Management Calendar section). When a topic has entries from multiple years, the most recent entry governs.\n\n## Key Claims\n\n### Roles and Naming\n- The DC role is called **LM DC** (Large Market Data Consultant) throughout. The coordinating project management role was called **TM (Transition Manager)** in older sections; the current name is **COM (Communications Coordinator / Communications Manager)**. All references to TM should be read as COM.\n- A role called **MM (reviewer)** appeared in a July 2025 payroll test review section. Per business context, the MM department has since been removed; those review responsibilities are not tracked here.\n\n### Fund Management Calendar — New Procedure (February 27, 2026)\n- The old FMC page in the notebook is explicitly marked **\"DO NOT USE.\"**\n- New procedure requires emailing four distribution lists when updating the FMC with fund balances (not just updating the file).\n- **SSBT cut-off:** 4:00 PM EST. Wire confirmation received by 4:45 PM EST. If wire is not received by cut-off, update FMC to next business day and send a follow-up email.\n- Estimates must be entered no later than **TOA minus five business days**.\n- Different procedures for AC1 Mapping Conversions vs. AC1 Cash Conversions vs. Participant Balance Processing.\n\n### Reversals — New Process (March 6/9, 2026)\n- **Plan Correction Checklist is no longer used.**\n- New process: submit a Reversal Form to `slasrever@transamerica.com` first. The automated response email contains a text block that must be pasted into AWD ticket comments.\n- Reversal AWD ticket must still be submitted — the form does not replace it.\n- Approval levels: $50K–$150K = Manager level; amounts govern which approval level to select.\n\n### Payroll Handoff at Go-Live (February 26, 2026)\n- New formal procedure when payroll testing is not complete at go-live.\n- DC submits a **FILESPECRQ** AWD ticket (payroll contact info, layouts, testing status summary).\n- DC updates NBI to note testing incomplete and ticket submitted.\n- COM notifies AM. Client and payroll vendor are notified of the team change.\n- Fiduciary Services Team takes over the payroll project using the Inforce Payroll Projects process.\n\n### Booking Assets — Updated Process (August 13, 2025)\n- **Wire hits State Street:** book as **4=Remit**; still email NY Recon.\n- **Withdrawing from AEDA (Advanced Employer Deposit Account):** book as **3=Rebook** AND submit a rebook AWD ticket.\n- This distinction replaces the older single-method booking process.\n\n### Wire Receipt / Cut-Off Process (December 29, 2025)\n- Cashiering email: `shtaopscashieringinc@transamerica.com`\n- Wire pulls at 7am, 9am, 1pm, 3pm CST.\n- Cashiering notifies DC by **3:45 PM** if wire received that day. If delayed, they reply to acknowledge and confirm when complete.\n- Wires received after **3:00 PM CST** are deposited the next business day.\n\n### Common Remitter Plans (November 19, 2025)\n- Plans coded as \"common remitter\" do not have the standard Pre-Process option in P3's Remit Action dropdown on Day of Wire.\n- Use **\"Verify Batch After Funding\"** instead. Wait for results, then set NO HOLD + Process Immediate for each trans ref.\n\n### LTPT / Secure Act 2.0 (June 10, 2024)\n- As of **January 1, 2025**, LTPT eligibility = **two consecutive 12-month periods with 500+ hours** for both 401(k) and 403(b). (Previously three years for 401(k).)\n- New EDS status codes: **5** = Not eligible, kit mailed due to LTPT; **6** = Eligible, LTPT.\n- Hours must be tracked for excluded-class employees (e.g., collectively bargained) in case they move to a covered class.\n- LTPT employees can make elective deferrals but are not eligible for employer contributions unless they meet regular eligibility.\n\n### Extended Model / MM Enhanced Plans (September 19, 2024)\n- Plans coded as \"MM Enhanced\" cannot use the standard ROC process for dummy account reversal.\n- Requires specific SQL updates to `CORP.transact_detail` and a separate INSERT statement — submitted via Production Support ticket.\n\n### Financial Guide (FG) Integration (February 12, 2025; August 13, 2025)\n- Financial Guide (FG) is a managed accounts service currently offered on Large Market plans only.\n- Two places to check if FG is enabled: (1) Plans Tab → Allocation/Plan Default if FG is plan-level default; (2) DDOL/VRU → Services Enabled section otherwise.\n- Mass subscription uses a `mass_sub_` prefixed file uploaded to Platform File Service.\n- The Consistency/Sweep Batch job runs hourly on business days to pick up participants with successful subscriptions but pending TPA allocations.\n\n### Payroll Test Review (July 29, 2025)\n- Updated procedure document references a detailed **Data Element Guide** at `S:\\CIT\\Data Consultants\\PAYROLL FILE REVIEW LINE FOR REVIEW OF DATA`.\n- Detailed field-by-field review guide covering all payroll file elements (SSN, dates, addresses, contributions, compensation, etc.).\n- After good-order test file: send to One Payroll for additional validation before final client sign-off.\n\n### New Folder Structure (April 6, 2026)\n- Not applicable to current workflows per direction.\n\n### Informatica Workflows (Technical Detail)\n- **Balance Module:** Uses `mp_part_balance` map. Fund and source maps saved as text tab-delimited. Parameter `$$Test_File = P` (preliminary), `Y` (test SSNs loaded), `N` (live).\n- **Loan Module:** Requires loans set up on P3 first (Conversions tab). NPER calculations have specific rounding logic for quarterly loans.\n- **Allocation Module:** Check fund map withdrawal sequence is a number; check for spaces on prior fund names.\n- **Day of Wire (updated April 8, 2020):** Full 11-step SQL verification process documented. Inserts into CASE_REMIT, FIN_ACT_PEND, FIN_ACT_ELEC, BILL_REMIT_DETAIL.\n- **Source Mapping query:** `select a.SRC_I, a.SRC_S, a.REPORT_1_NM, a.REPORT_2_NM, a.SP_REPORT_1_NM, a.SP_REPORT_2_NM, doc_nm from corp.plan_src_detail a, pension.plan_provision b, pension.plan_prov_grp c where A.SRC_I = B.RELATED_I AND B.PROV_TYP_C = 1019 and b.enrl_prov_grp_i=c.enrl_prov_grp_i and account_no='[ACCOUNT_NO]'`\n\n### Wire Instructions — Reinsurance Codes and State Street Accounts\n- Four State Street Bank & Trust accounts by Reinsurance Code:\n  - Codes 2, 3, A, B → Account 00457358\n  - Codes 5, 6, 9 → Account 00457366\n  - Codes 4, 7, 8, C → Account 00457374\n  - Code I → Account 00457424\n  - Code J → Account 00457440\n- ABA: 011000028 (State Street Bank & Trust Company, 200 Clarendon Street, Boston, MA 02116)\n\n### Acronym Dictionary\nFull CTS-relevant acronym definitions per notebook's March 13, 2017 entry. Key CTS-specific terms are documented in individual glossary pages.\n\n## Key Quotes\n\n> \"The FMC calendar is a critical step for the DC Team to ensure that our internal partners can effectively communicate nightly trade expectations with the fund companies that Transamerica is partnering with.\"\n\n> \"When submitting a reversal we no longer need to fill out the Plan Correction Checklist. As of 03.06.26 You'll need to use the form below.\"\n\n> \"Going forward, the COMs will communicate during the conversion process that if payroll is not completed prior to go live, payroll testing will continue with a different internal Transamerica Team.\"\n\n> \"Booking assets when they hit State Street and not using the tr-ref-no that cashiering used to book, you will follow the same process. Book as a 4=Remit... When booking assets to process to ppt accounts off a w/d from AEDA you will now book as a 3=Rebook.\"\n\n## Entities Mentioned\n\n- [[roles/lm-dc]] — primary subject\n- [[cashiering]] — wire receipt, booking\n- [[informatica]] — Day of Wire, Balance, Loan, Allocation modules\n- [[p2]], [[p3]], [[eds]], [[aqt]], [[nbi]] — all primary DC systems\n- Ellen Miller — assignment routing\n- Matt O'Connell — TIK re-registration\n- Stacey Fortune, Earl Sanford, Dave Shloat, Scott Vrba — named SMEs throughout\n- [[prod-support]] — AWD tickets, database corrections\n- [[ftp-team]] — payroll vendor FTP setup\n- [[payroll-support]] — One Payroll team\n\n## Concepts Mentioned\n\n- [[fund-management-calendar]] — major update (new procedure Feb 2026)\n- [[liquidation-day]] — wire receipt, booking assets updates\n- [[processes/reversal-submission|reversal-process]] — new page (Mar 2026)\n- [[ltpt-eligibility]] — new page (Jun 2024 / Jan 2025 effective)\n- [[common-remitter-plans]] — new page (Nov 2025)\n- [[payroll-handoff-at-go-live]] — new page (Feb 2026)\n- [[booking-assets]] — new page (Aug 2025)\n- [[wire-instructions]] — reinsurance codes and SSBT accounts\n- [[conversion-types]], [[dummy-participant]], [[processes/tik-transfer|transfer-in-kind]], [[source-mapping]], [[fund-mapping]]\n- [[deferrals]], [[eligibility]], [[base-file]], [[payroll-template]]\n\n## Contradictions / Open Questions\n\n- **FMC cutoff vs. SSBT cutoff:** The old wiki stated \"1 PM Pacific / 4 PM Eastern\" as the FMC deadline. The new FMC procedure (Feb 2026) references \"4PM EST SSBT Cut-off\" — these are the same Eastern time (4 PM ET), but the new procedure is more precise about the State Street banking cut-off as the driver, and adds email notification requirements not in the old page. **Resolution:** Update FMC page with new procedure; preserve the 4 PM ET time.\n- **Old shared drive paths** (e.g., `S:\\CIT\\Data Consultants\\`, `\\\\yydafs-data1\\`) appear throughout older sections. These paths may no longer be current. Until confirmed, treat as potentially stale.\n\n## See Also\n\n- [[roles/lm-dc]]\n- [[dc-onboarding-workflow]]\n- [[fund-management-calendar]]\n- [[processes/reversal-submission|reversal-process]]\n- [[ltpt-eligibility]]\n- [[liquidation-day]]\n- [[plan-conversion-handoffs]]"},{"id":"data-loading/loading-basis-eds","slug":"loading-basis-eds","rel":"data-loading/loading-basis-eds.md","namespace":"data-loading","title":"Loading Basis through EDS","summary":"Procedure for loading cost basis data for plan participants through EDS during a plan conversion.","updated":"2026-04-20","created":"2026-04-16","sources":1,"status":"current","tags":["eds","basis","process","system"],"type":"data-loading","extras":[],"media":[],"meta":{"title":"Loading Basis through EDS","type":"data-loading","tags":["eds","basis","process","system"],"created":"2026-04-16","updated":"2026-04-20","sources":1,"status":"current"},"markdown":"# Loading Basis through EDS\r\n\r\nProcedure for loading cost basis data for plan participants through EDS during a plan conversion.\r\n\r\n## Definition\r\n\r\nEE Basis determines the amount available for hardship withdrawals and tracks after-tax and Roth contributions for special tax considerations upon withdrawal. It is loaded via EDS in P3 using the **Basis** data type.\r\n\r\n## Process\r\n\r\n1. Vendor provides **test files** and **live files**\r\n2. For all files (test, refresh, live): run **Validate Only** in EDS first\r\n3. Review EDS output — communicate all errors and warnings to client, COM, and TC\r\n4. Verify whether basis rows already exist in tables before and after loading\r\n\r\n## File Preparation\r\n\r\n- Required fields: SSN, hardship amount\r\n- For Roth loads: also include First Roth Contribution Year\r\n- Basis should be loaded **as of the last plan year** — typically 12/31 of the prior calendar year\r\n- For **mid-year conv
