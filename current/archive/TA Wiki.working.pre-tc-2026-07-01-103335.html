. It is not okay to have trades go out without an entry on the FMC.\"\n- \"Anytime you ever see one of those [stand-out dates], it's just an extra way of making sure that these people stand out and are not treated as normal.\"\n- \"Be explicit and acknowledge it that way. It's not inferred or assumed or anything.\"\n- \"If the data won't load correctly [without dummy] it'll need to be cleared by Prod Support. It's a nightmare. Don't do it.\"\n\n## Entities Mentioned\n\n- [[eds]] — census, elections, and final-file validation/loading\n- [[p2]] — ref number creation back-end\n- [[p3]] — plan administration; conversions dropdown; ROC; Takeover Loans\n- [[informatica]] — Day-of-Wire and CIT balance workflows; loan workflow\n- [[awd]] — testing leg between PRD/onboarding and base file finalization\n- [[cashiering]] — wire pulls and confirmation\n- [[matt-oconnell]] — TIK / Fidelity pooled accounts\n- [[ssbt]] — 4 PM EST cutoff context\n\n## Concepts Mentioned\n\n- [[census-data]], [[base-file]], [[payroll-template]], [[limited-access-file]] (new)\n- [[defaulting-elections-eds]] (new), [[forfeiture-loading]] (new)\n- [[balance-import]], [[balance-import-cash]], [[balance-import-mapping]], [[balance-import-tik]]\n- [[advanced-employer]], [[subsequent-cash-imports]] (new)\n- [[fund-mapping]], [[source-mapping]], [[conv-file]], [[processes/tik-transfer|transfer-in-kind]]\n- [[dummy-participant]], [[fund-management-calendar]], [[wire-instructions]]\n- [[liquidation-day]], [[final-files-processing]]\n- [[loan-setup]], [[informatica-loan-module]]\n- [[holb]] (new glossary)\n\n## Notes\n\nThis source contains the first explicit mention in the wiki corpus of: limited access files, defaulted-election EDS rows, forfeiture date conventions, AE interest pro-rat, the one-share TIK escalation threshold, fund-split ratio handling, the loan workflow test toggle, and HOLB. Several existing pages are expanded against this source; see the per-page `sources` count for traceability."},{"id":"sources/census-data-doc","slug":"census-data-doc","rel":"sources/census-data-doc.md","namespace":"sources","title":"Source: Census Data Documentation","summary":"Structured documentation file covering census data loading procedures, audit checks, and error handling for plan conversions.","updated":"2026-04-20","created":"2026-04-20","sources":1,"status":"current","tags":["eds","census","process","data"],"type":"source","extras":[],"media":[],"meta":{"title":"Source: Census Data Documentation","type":"source","tags":["eds","census","process","data"],"created":"2026-04-20","updated":"2026-04-20","sources":1,"status":"current"},"markdown":"# Source: Census Data Documentation\r\n\r\nStructured documentation file covering census data loading procedures, audit checks, and error handling for plan conversions.\r\n\r\n## Summary\r\n\r\nInternal documentation describing the census data loading process. Covers participant data fields, EDS loading procedure (Address Standard and Enrollments data types), audit/edit checks, vendor data rules, and date-handling edge cases.\r\n\r\n## Key Claims\r\n\r\n- Census data includes both active and terminated participants within the last two years\r\n- Data loaded via EDS in P3 using the **Address Standard** and **Enrollments** data types\r\n- Always run Validate Only first; communicate errors to client, COM (TM), and TC\r\n- One row per employee is a hard requirement\r\n- Client provides both test files and live files; reconcile test against live when live is received\r\n- Vendor (prior RK) census data is allowed in specific circumstances: client request, or terminated participant with incoming balance\r\n- If DOH and DOR both exist with no Date of Term, do not request Date of Term\r\n- Date of Hire must not match Date of Rehire — if they match, request original DOH from client\r\n\r\n## Key Quotes\r\n\r\n- \"Vendor census data may be used when: Client requests vendor data, or a terminated participant has a balance coming over from the PRK\"\r\n- \"Enroll participant using PRK data. Notify client, TM, and TC prior to loading.\"\r\n\r\n## Entities Mentioned\r\n\r\n- [[eds]] — file validation and loading system\r\n- [[p3]] — main plan administration platform\r\n\r\n## Concepts Mentioned\r\n\r\n- [[census-data]] — this source's primary concept\r\n- [[base-file]] — the census template DC gives to the client to collect this data\r\n- [[prior-record-keeper]] — source of vendor census data in applicable cases\r\n\r\n## Contradictions / Open Questions\r\n\r\n- \"Errors / Resolutions\" section marked as unclear in source — specific error codes and resolutions not documented\r\n- `TO Census.sql` query referenced but path not specified\r\n\r\n## See Also\r\n\r\n- [[census-data]]\r\n- [[processes/eligibility-loading|loading-eligibility-eds]]\r\n- [[base-file]]\r\n- [[eds]]"},{"id":"sources/com-main-checklist","slug":"com-main-checklist","rel":"sources/com-main-checklist.md","namespace":"sources","title":"Source: COM Main Checklist","summary":"A structured web-based checklist application used by Communications Coordinators (COMs) to track every task across a plan conversion lifecycle — from NSA receipt through go-live.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["source","com","checklist","conversion","project-management"],"type":"source","extras":[],"media":[],"meta":{"title":"Source: COM Main Checklist","type":"source","tags":["source","com","checklist","conversion","project-management"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# Source: COM Main Checklist\n\nA structured web-based checklist application used by Communications Coordinators (COMs) to track every task across a plan conversion lifecycle — from NSA receipt through go-live.\n\n## Summary\n\nThis is the authoritative task list that defines the COM role in operational terms. It is organized into 18 phases covering kickoff, prior recordkeeper coordination, letters and notices, payroll setup, document execution, early access, and go-live. Two plan-type branches exist throughout: PEP (Pooled Employee Plan) and Non-PEP, with certain sections exclusive to each.\n\nThe checklist reveals that the COM role is far more than a meeting scheduler — COMs are the document factory, the routing hub, and the go-live coordinator for every plan conversion.\n\n## Key Claims\n\n1. **NSA (New Sale Announcement) is the trigger** — the COM workflow begins when the NSA is received.\n2. **COM creates and owns the project plan** — uploaded to NBI and sent to the conversion team.\n3. **COM is the letters-and-notices factory** — responsible for cover letters, blackout notices, mapping notices, QDIA initial notices (sourced from TC), fee disclosures, privacy notices, and conversion newsletters.\n4. **COM manages the prior RK document chain** — requests prior plan docs, routes them through Ellen Miller to the docs team, and coordinates prior carrier letters and successor trustee letters.\n5. **COM co-owns payroll coordination** — sends specs, runs payroll calls, manages questionnaires with clients and DCs, handles Contribution Monitoring Forms (which require TC to flip an AWD setting), and manages the RDD Form loop with TC.\n6. **Subpack ownership is COM → TC** — COM creates the subpack; TC reviews it during the internal call and takes over maintenance after that.\n7. **Early access is COM-coordinated** — COM requests the template from DC, routes it to the client, submits back to DC, and notifies TC to activate it.\n8. **Go-live is COM-orchestrated** — COM sends the go-live email, completes the NBI audit checklist, completes the Auto Delivery Form (non-PEP), adds the plan to the Survey Spreadsheet, and notifies Ellen Miller.\n9. **CSR (Conversion Summary Report) comes from the Quality Consultant** — COM receives it and forwards to the client.\n10. **PEP plans have additional document requirements** — OBP, PEA, Info Sharing Form (via DocuSign), plus AAA, Secure 2.0, and SPD from the docs team.\n\n## Key Quotes\n\n*Source is a structured checklist application — no direct quotes. Task labels preserved verbatim in concept and role pages.*\n\n## Entities Mentioned\n\n**People:**\n- [[ellen-miller]] — receives prior docs and notice requests; plan setup in SF; notified at go-live; receives SPD for PEP participants\n- [[jen-curtin]] — notified by COM for 360° payroll plans\n- Samantha C. — receives Transition Communications Checklist (non-PEP); team unknown\n- Quality Consultant — sends CSR to COM at go-live; handles loan analysis\n\n**Systems:**\n- [[nbi]] — project plan uploaded here; audit checklist completed here at go-live\n- [[docusign]] — used to send OBP, PEA, plan documents for signature\n- WX / [[wx]] — Plan Sponsor Site; confirmed by COM, set up by TC\n- FILESERVE — contribution monitoring form stored here\n- SF (Salesforce?) — plan setup confirmed by Ellen; VEF L&C tickets submitted here\n\n**Teams:**\n- [[tc]] — provides QDIA notice, fee disclosure, enrollment guide, RDD form; reviews subpack; sets up WX; flips AWD for contribution monitoring; activates early access; sets up go-live review\n- [[doc-ops]] — creates OBP (PEP); provides AAA, Secure 2.0, SPD (PEP)\n- [[roles/lm-dc]] — receives payroll questionnaire; provides early access file template; confirms asset receipt\n- [[cashiering]] — referenced indirectly (assets received confirmation comes through DC)\n\n## Concepts Mentioned\n\n- [[concepts/nsa]] — New Sale Announcement; triggers COM workflow\n- [[project-plan-com]] — COM's master conversion tracker; two formats (PEP vs non-PEP); uploaded to NBI\n- [[prior-carrier-letter]] — letter notifying prior record keeper of transition\n- [[blackout-notice]] — notice of investment blackout period sent to participants\n- [[concepts/vef]] — Vendor Expense Form; routes through advisor → client → L&C setup\n- [[contribution-monitoring-form]] — payroll monitoring setup; requires TC AWD flip\n- [[rdd-form]] — form provided by TC, completed by client, submitted back to TC\n- [[early-access]] — pre-go-live participant access; COM-coordinated\n- [[concepts/csr]] — Conversion Summary Report; from Quality Consultant; sent to client at go-live\n- [[subpack]] — COM creates; TC reviews and takes over maintenance\n- [[onboarding-package]] — PEP plans only; COM updates tabs and prepares PEA\n- [[toa]] — included in OBP for PEP plans\n- [[prd]] — authored by COM; forms the basis of the plan review call\n\n## Contradictions / Open Questions\n\n- **PEA** — Plan Enrollment Agreement; PEP plans only. ✓ Confirmed.\n- **AAA** — Adoption Agreement Addendum; PEP plans only. ✓ Confirmed.\n- **Samantha C.** — receives Transition Communications Checklist for non-PEP plans. Last name and team still unknown.\n- **Communication Consultant** — confirmed as an internal Doc Ops role. ✓ Resolved.\n- **SF** — Salesforce; used for plan setup confirmation and VEF L&C tickets. ✓ Confirmed.\n- **FILESERVE** — contribution monitoring form stored here. System details unknown.\n- **CIT & DCGLIB** — document storage locations for signed OBP copies. Not yet documented.\n\n## See Also\n\n- [[roles/com]] — full COM role reference built from this source\n- [[plan-conversion-handoffs]] — updated with COM-perspective handoffs\n- [[subpack]] — ownership now documented from COM's side\n- [[concepts/nsa]]\n- [[concepts/csr]]"},{"id":"sources/loading-basis-doc","slug":"loading-basis-doc","rel":"sources/loading-basis-doc.md","namespace":"sources","title":"Source: Loading Basis through EDS Documentation","summary":"Structured documentation file covering basis data loading procedures, field definitions, tables, and special rules for plan conversions.","updated":"2026-04-20","created":"2026-04-20","sources":1,"status":"current","tags":["eds","basis","process","data"],"type":"source","extras":[],"media":[],"meta":{"title":"Source: Loading Basis through EDS Documentation","type":"source","tags":["eds","basis","process","data"],"created":"2026-04-20","updated":"2026-04-20","sources":1,"status":"current"},"markdown":"# Source: Loading Basis through EDS Documentation\r\n\r\nStructured documentation file covering basis data loading procedures, field definitions, tables, and special rules for plan conversions.\r\n\r\n## Summary\r\n\r\nInternal documentation describing the basis loading process through EDS. Covers EE basis purpose (hardship withdrawals, Roth tracking), required file fields, all basis field names, affected database tables, transaction types that do and do not adjust basis, and special rules (457 plans, cost basis, Roth timing, mid-year conversions).\r\n\r\n## Key Claims\r\n\r\n- EE Basis determines the amount available for hardship withdrawals\r\n- Tracks after-tax and Roth contributions for special tax considerations upon withdrawal\r\n- Loaded via EDS in P3 using the **Basis** data type\r\n- Basis should be loaded as of the last plan year (12/31 of prior calendar year)\r\n- For mid-year conversions: load basis to both current year and prior year basis sets\r\n- Do not load basis for 457 plans\r\n- Only load Cost Basis for stock funds and NQ plan re-registrations\r\n- Roth did not start until 2006 — load Roth basis for all participants with Roth balances\r\n- Only one takeover (T row) can exist per plan\r\n- Hardship suspension dates: load only end or re-entry dates via SQL\r\n\r\n## Key Quotes\r\n\r\n- \"EE Basis determines the amount available for hardship withdrawals.\"\r\n- \"Basis should be loaded as of the last plan year (typically 12/31 of prior calendar year).\"\r\n- \"Do not load basis for 457 plans.\"\r\n- \"Even if hardship withdrawals are not allowed, load basis if provided.\"\r\n\r\n## Entities Mentioned\r\n\r\n- [[eds]] — file validation and loading system\r\n- [[p3]] — main plan administration platform\r\n\r\n## Concepts Mentioned\r\n\r\n- [[loading-basis-eds]] — this source's primary concept\r\n- [[final-files-processing]] — basis is loaded during the final files phase\r\n\r\n## Contradictions / Open Questions\r\n\r\n- `TO_BASIS.sql` query referenced but exact path not specified\r\n- Hardship suspension date loading via SQL referenced but SQL not documented\r\n\r\n## See Also\r\n\r\n- [[loading-basis-eds]]\r\n- [[processes/eligibility-loading|loading-eligibility-eds]]\r\n- [[final-files-processing]]\r\n- [[eds]]"},{"id":"sources/subpack-cccs","slug":"subpack-cccs","rel":"sources/subpack-cccs.md","namespace":"sources","title":"Source: New Plan Submission Package — CCCS Document","summary":"Raw template for the CCCS (Client Conversion Configuration Sheet) submission package — the internal TA document completed once per plan at the start of a new conversion.","updated":"2026-04-16","created":"2026-04-16","sources":1,"status":"current","tags":["subpack","cccs","plan-setup","conversion","source"],"type":"source","extras":[],"media":[],"meta":{"title":"Source: New Plan Submission Package — CCCS Document","type":"source","tags":["subpack","cccs","plan-setup","conversion","source"],"created":"2026-04-16","updated":"2026-04-16","sources":1,"status":"current"},"markdown":"# Source: New Plan Submission Package — CCCS Document\n\nRaw template for the CCCS (Client Conversion Configuration Sheet) submission package — the internal TA document completed once per plan at the start of a new conversion.\n\n## Summary\n\nThis is the raw template for the CCCS portion of the New Plan Submission Package. It captures all plan-level configuration decisions made at onboarding: plan type, trustee structure, payroll setup, conversion strategy, services included, loan/withdrawal options, and contact information. One package is completed per plan.\n\n## Key Claims\n\n- A single submission package must be completed per plan.\n- Plan types supported span 401(k), 401(a), 403(b), 457(b), 457(f), and Corporate NQDC.\n- All 457(f) plans use the IDP document type; Transamerica does not draft these.\n- System effective date should generally be one month prior to the plan effective date.\n- Auto-increase should not be offered for NQDC or 457 plans.\n- Market segmentation is categorized as Large or Mega.\n- Trustee options include SSBT (State Street Bank & Trust), Self-Trust, or Other (trust agreement required).\n- Payroll submission methods are PSD (Plan Sponsor Direct) or FTP; funding methods are ACH or Wire.\n- Asset transfer strategies: Plan Level Conversion, Participant Directed, or Hybrid.\n\n## Key Sections\n\n### Part 1 — Employer / Plan Information\nPlan type, MEP/PEP role, account number, market segmentation, public company status, SSO, plan status, document type (Volume Submitter or IDP).\n\n### Plan Set-Up Information\nPlan effective date, limited access period (start/end), system effective date, services included (enrollments, deferrals, allocations, beneficiary data), other TRS plans, loan aggregation settings.\n\n### Contacts\nTrustee information, executive contact, administrator contact, TPA contact, advisor/consultant details (3(38) investment manager, PSD user ID).\n\n### Automatic Enrollment & Deferrals\nAuto-enrollment type (being added vs. existing), auto-increase settings, increase date.\n\n### Portfolio & Advice Services\nPortfolioXpress (Lifetime/Retirement, Risk Preference Overlay), Custom PortfolioXpress/Custom Model Portfolios (5 bps fee, quarterly rebalance), Managed Advice, Advisor Managed Advice.\n\n### Loans & Withdrawals\nOnline withdrawal types, loan PoG options, takeover loan method (Payroll/Coupon/EFT).\n\n### QDIA Strategy\nDefault fund, PX re-enrollment options, internal QDIA meeting requirement.\n\n### Payroll Setup\nPayroll type (in-house vs. vendor), frequency, submission method (PSD/FTP), funding method (ACH/Wire), file format (Excel/CSV).\n\n### Conversion Strategy Overview\nPrior vendor information (contacts, assets, blackout dates), asset transfer strategy (Plan Level / Participant Directed / Hybrid), case transition worksheet (loans, auto-enrollment, outsourcing, fund pricing).\n\n### 457(b)/457(f) and Corporate NQDC Services\nEligibility, deferrals, vesting, distributions, tax reporting, enrollment/deferral tracking.\n\n## Entities Mentioned\n- [[ssbt]] (State Street Bank & Trust — trustee option)\n- [[subpack]] (the submission package this document is part of)\n- [[eds]]\n- [[wx]] (PSD = Plan Sponsor Direct / WX)\n\n## Concepts Mentioned\n- [[conversion-types]] (Plan Level, Participant Directed, Hybrid)\n- [[ftp-connection]] (FTP payroll submission)\n- [[eligibility]] (eligibility services)\n- [[deferrals]] (deferral setup)\n- [[cccs-submission-package]] (concept page for this document type)\n\n## Contradictions / Open Questions\n- CCCS acronym not spelled out in the source. Likely \"Client Conversion Configuration Sheet\" or similar — confirm with team.\n- Several fields in the raw template show \"(Unclear in source)\" — these are blank form fields by design, not missing data.\n- \"Limited Access Period\" is referenced in plan setup but not documented elsewhere in the wiki — may need a glossary entry.\n\n## See Also\n- [[subpack]]\n- [[conversion-types]]\n- [[cccs-submission-package]]\n- [[ftp-connection]]\n- [[eligibility]]"},{"id":"glossary/ssbt","slug":"ssbt","rel":"glossary/ssbt.md","namespace":"glossary","title":"SSBT","summary":"**Full Name:** State Street Bank & Trust","updated":"2026-04-15","created":"2026-04-15","sources":1,"status":"current","tags":["glossary","wire","banking","external"],"type":"glossary","extras":[],"media":[],"meta":{"title":"SSBT","type":"glossary","tags":["glossary","wire","banking","external"],"created":"2026-04-15","updated":"2026-04-15","sources":1,"status":"current"},"markdown":"# SSBT\n\n**Full Name:** State Street Bank & Trust\n\n## Definition\n\nSSBT is the external custodial bank through which incoming wires from prior record keepers are received during plan conversions. The [[fund-management-calendar]] SSBT cut-off is **4:00 PM EST** — trades submitted after this time are not processed same-day. [[cashiering]] pulls wires from SSBT at 7 AM, 9 AM, 1 PM, and 3 PM CST; wires received after the 3 PM pull are deposited the next business day.\n\n## Used By\n\n- [[cashiering]] — receives and books wires from SSBT\n- [[roles/lm-dc]] — monitors for wire confirmation; must update [[fund-management-calendar]] before the 4 PM EST cut-off on liquidation day\n\n## See Also\n\n- [[cashiering]]\n- [[liquidation-day]]\n- [[fund-management-calendar]]\n- [[wire-instructions]]"},{"id":"entities/stacey-fortune","slug":"stacey-fortune","rel":"entities/stacey-fortune.md","namespace":"people","title":"Stacey Fortune","summary":"Lower-level manager type who moves between departments. Go-to contact for major things that need approval, including Advanced Employer (AE) liquidation requests.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":[],"type":"person","extras":[],"media":[],"meta":{"title":"Stacey Fortune","type":"person","tags":"","created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# Stacey Fortune\r\n\r\nLower-level manager type who moves between departments. Go-to contact for major things that need approval, including Advanced Employer (AE) liquidation requests.\r\n\r\n## Overview\r\n\r\nStacey Fortune operates in a manager-adjacent capacity, floating across departments. She is a reliable escalation point for significant approvals — not the top of the chain, but a trusted intermediate authority who can act on things quickly.\r\n\r\n## Key Facts\r\n\r\n- **Role:** Lower-level manager / cross-department floater\r\n- **Primary use case for DC:** AE liquidation approval email\r\n- **Contact type:** Email\r\n\r\n## When the DC Goes to Stacey\r\n\r\n- **Advanced Employer liquidation:** Email Stacey (and/or [[nick-lister]]) to request the AE be liquidated so final balance posting can proceed (cash conversions)\r\n- Any other major item requiring manager-level sign-off\r\n\r\n## Relationship to Nick Lister\r\n\r\nStacey and [[nick-lister]] are both contacts for AE liquidation. Stacey floats between departments; Nick is the DC's direct manager. Either can handle the request.\r\n\r\n## Additional Details\r\n\r\n- **Department:** Large Market\r\n- **Beyond AE liquidation:** Also a general knowledge resource — good person to go to when you need institutional clarity on something\r\n- **Official title:** Unknown. She referred to herself as \"awesome ass bad ass.\" Will update when confirmed.\r\n\r\n## See Also\r\n\r\n- [[nick-lister]]\r\n- [[final-files-processing]]\r\n- [[conversion-types]]"},{"id":"concepts/subpack","slug":"subpack","rel":"concepts/subpack.md","namespace":"documents","title":"Subpack — Submission Package","summary":"TransAmerica's internal document specifying exactly what will be done during the conversion — the \"how we're doing it\" complement to the PRD's \"what the plan looks like.\"","updated":"2026-04-14","created":"2026-04-14","sources":3,"status":"current","tags":["document","subpack","submission","transamerica-details"],"type":"document","extras":[],"media":[],"meta":{"title":"Subpack — Submission Package","type":"document","tags":["document","subpack","submission","transamerica-details"],"created":"2026-04-14","updated":"2026-04-14","sources":3,"status":"current"},"markdown":"# Subpack — Submission Package\r\n\r\nTransAmerica's internal document specifying exactly what will be done during the conversion — the \"how we're doing it\" complement to the PRD's \"what the plan looks like.\"\r\n\r\n## Overview\r\n\r\nWhile the [[prd]] and [[onboarding-package]] describe the plan's design from the client's perspective, the subpack describes TransAmerica's execution plan: which mapping strategy, what auto-enrollment rate, how funds will be handled, etc. It is an internal TA document, not client-facing.\r\n\r\n## Contents (Examples)\r\n\r\n- Deferral election mapping strategy (\"we will map elections 1:1\")\r\n- Auto-enrollment percentage (e.g., \"auto enroll at 1%\")\r\n- Fund transfer strategy (\"transfer in kind: 3 funds; cash convert: remaining\")\r\n- Any special processing instructions\r\n\r\n## Ownership\r\n\r\n**COM creates the subpack. TC takes over after reviewing it during the internal call.**\r\n\r\nThe COM checklist explicitly includes:\r\n1. Submission Package Created (COM)\r\n2. Distribute to entire internal project team (COM)\r\n3. Subpack review — TC reviews during the internal call\r\n4. Subpack hand-off — TC maintains the subpack after review\r\n\r\nIn practice, completion has been inconsistent from the DC's perspective.\r\n\r\n> \"Sub-packs have been kind of touch and go, hit or miss.\" — DC Brain Dump\r\n\r\nWhen the subpack is missing or incomplete, the most likely explanation is that COM created it but the distribution or review step broke down — not necessarily that it was never made. DCs should ask COM directly.\r\n\r\n## Importance\r\n\r\nThe subpack is valuable because it gives the DC a single document stating definitively what will happen. Without it, the DC must synthesize conversion strategy from multiple sources, increasing the risk of misunderstanding.\r\n\r\n## When the Subpack Is Missing\r\n\r\nNot a blocker. The information exists somewhere — in the [[prd]], [[onboarding-package]], from the COM verbally, or from the client. Ask the COM for the specific details you need.\r\n\r\n> \"Get the info from other places. Not a big deal. It's available somewhere or from someone.\"\r\n\r\n## Additional Clarifications\r\n\r\n- **Standard template:** Yes, exists.\r\n- **Ideal timing:** Should be complete at the very beginning of the conversion — before substantive DC work begins.\r\n- **Client visibility:** The client knows about it, but it is primarily an internal TA document.\r\n\r\n## See Also\r\n\r\n- [[prd]]\r\n- [[onboarding-package]]\r\n- [[conversion-types]]\r\n- [[dc-onboarding-workflow]]"},{"id":"concepts/subsequent-cash-imports","slug":"subsequent-cash-imports","rel":"concepts/subsequent-cash-imports.md","namespace":"processes","title":"Subsequent Cash Imports","summary":"The family of small DC-triggered cash applications that land in participant accounts **after** the main conversion balances post. All of these follow the same pattern: extra cash arrives at the plan, and the DC pushes it out to participants","updated":"2026-05-03","created":"2026-05-03","sources":1,"status":"current","tags":["advanced-employer","interest","dividends","uncashed-checks","post-conversion","dc-triggered"],"type":"process","extras":[],"media":[],"meta":{"title":"Subsequent Cash Imports","type":"process","tags":["advanced-employer","interest","dividends","uncashed-checks","post-conversion","dc-triggered"],"created":"2026-05-03","updated":"2026-05-03","sources":1,"status":"current"},"markdown":"# Subsequent Cash Imports\n\nThe family of small DC-triggered cash applications that land in participant accounts **after** the main conversion balances post. All of these follow the same pattern: extra cash arrives at the plan, and the DC pushes it out to participants pro-rata or per the source rules.\n\n## What Falls Into This Family\n\n| Type | Origin | Typical Timing |\n|------|--------|----------------|\n| **Advanced Employer interest** | Interest accrued by the [[advanced-employer]] account while it held the wire | Day after AE liquidation |\n| **Dividends** | Late dividend payments from prior-RK funds | Days to weeks after conversion |\n| **Uncashed checks** | Stale uncashed distribution checks reissued back to the plan | Anytime post-conversion |\n| **Other extra cash** | Any other late-arriving amounts the plan receives | Anytime post-conversion |\n\nAll of these are **DC-triggered** — none of them are automated. The DC sees the cash arrive (typically via Cashiering or a vendor email), runs the appropriate workflow, and pushes the amount to participants.\n\n## Advanced Employer Interest — The Common Case\n\nThe clearest example. Walks through the full sequence:\n\n1. **Liquidation Day:** Wire hits → moved to [[advanced-employer]] account → accrues a small interest while sitting there\n2. **Final files arrive:** DC requests AE liquidation → balances post to participant accounts\n3. **Next business day:** DC takes the accrued interest amount and applies it **pro-rata to participants** as a small bonus — proportional to each participant's share of the total balance that just posted\n\nThe interest is small but real. Participants see a tiny additional credit the day after their main balance lands.\n\n## Why It Matters\n\nThese small late amounts are easy to miss. If they don't get pushed out:\n\n- Participants are short by the amount owed\n- The cash sits in a plan-level holding spot indefinitely, becoming a reconciliation problem later\n- Audit trails get murky because the prior-RK records show the amount left their books but TA records don't show it landing in any participant account\n\n## Out of Scope for FMC\n\nThese small distributions do **not** require [[fund-management-calendar|FMC]] entries. The big-money rule from FMC applies in reverse: interest, dividends, and small late amounts are below the threshold that needs advance notice to fund companies.\n\n## See Also\n\n- [[advanced-employer]]\n- [[balance-import]]\n- [[final-files-processing]]\n- [[fund-management-calendar]]\n- [[cashiering]]"},{"id":"processes/tc-conversion-timeline","slug":"tc-conversion-timeline","rel":"processes/tc-conversion-timeline.md","namespace":"processes","title":"TC Conversion Timeline","summary":"Working timeline for TC-owned and TC-supported activities during a plan conversion.","updated":"2026-05-13","created":"2026-05-13","sources":1,"status":"needs-review","tags":["process","tc","conversion","checklist","closeout"],"type":"process","extras":[],"media":[],"meta":{"title":"TC Conversion Timeline","type":"process","tags":["process","tc","conversion","checklist","closeout"],"created":"2026-05-13","updated":"2026-05-13","sources":1,"status":"needs-review"},"markdown":"# TC Conversion Timeline\n\nWorking timeline for TC-owned and TC-supported activities during a plan conversion.\n\n## Overview\n\nThe TC conversion timeline is a personal operating checklist for keeping administrative setup, audits, participant access, notices, payroll support, and closeout from drifting during a conversion. It is not just a task list; it is the bridge between plan setup, participant-facing readiness, and handoff to the ongoing team.\n\n> [!warning] Source status\n> This page is built from legacy TC material. Validate timing, owners, and required artifacts against current team procedure before using it as a live checklist.\n\n## Trigger\n\nThe timeline starts when a new conversion is assigned and the TC is brought into internal/new-sale planning.\n\n## Steps\n\n1. **Join project initiation calls.** Owner: TC. Attend internal new sale, introduction, pricing, PRD, and submission package calls where applicable.\n2. **Review and maintain the subpack.** Owner: TC. Take over the submission package after the preliminary draft, circulate revisions, and keep it current through completion.\n3. **Identify special services.** Owner: TC with QC/Prod Support. Request tickets for PX, CMP, MA, CPMA, statements, logos, non-dynamic forms, or other special administrative services.\n4. **Support SDA/PCRA work if applicable.** Owner: TC with prior carrier/PCRA contacts. Track asset breakdowns, letters of authorization, trading menus, conference calls, and acceptable asset reviews.\n5. **Complete first system audit and notices setup.** Owner: TC with QC. Create entity groups, run/review notices, check fee disclosures/QDIA notices, and send completion email to the conversion team.\n6. **Prepare participant and contact-center readiness.** Owner: TC. Complete transactions allowed spreadsheet, new business page, case notes, and internal materials needed by Contact Center or processing teams.\n7. **Coordinate plan sponsor administration materials.** Owner: TC. Create remittance guides, administration manuals, call recaps, RDD forms, PSD training, and administrative procedure documentation.\n8. **Coordinate eligibility/enrollment readiness.** Owner: TC with QC and DC. Request setup or review of enrollment and eligibility tabs, run/review enrollment kits, and confirm final material readiness.\n9. **Activate and audit PSD/DDOL/VRU.** Owner: TC with QC. Activate plan sponsor access, add client contacts, audit test participants, audit live participants, and verify DDOL/VRU settings.\n10. **Support mapping and data readiness.** Owner: TC with DC. Complete fund mapping and source mapping work where TC owns the administrative/provision attributes.\n11. **Complete day-of-wire and live-participant audits.** Owner: TC with QC/DC. Confirm conversion data and participant website readiness before access changes.\n12. **Run go-live controls.** Owner: TC. Complete the [[go-live-checklist]], schedule go-live meeting, and notify required parties once the plan is live.\n13. **Finish post-go-live cleanup.** Owner: TC. Term kit cleanup, statement audit, final system audit, conversion statement request, and final statement hold release where applicable.\n14. **Close out conversion.** Owner: TC. Complete transition call checklist, hold transition call with ongoing team, add final subpack to AWD item, and update [[nbi]] with transition date.\n\n## Handoff Points\n\n- TC receives plan setup and project context from COM/TM.\n- TC receives data and mapping inputs from [[roles/lm-dc]].\n- TC coordinates audit/control checkpoints with [[qa]].\n- TC provides admin readiness details to Contact Center, Remit Loaders, Processors, and ongoing account teams.\n- TC hands the final administrative package to the ongoing team at transition closeout.\n\n## Timing / Deadlines\n\n- Special service tickets and notice setup should be started early because they can block participant communications and access.\n- PSD/DDOL/VRU testing must happen before limited or full access activation.\n- Closeout should not happen until final system/audit tasks, statement items, and NBI transition updates are complete.\n\n## Failure Modes\n\n- Subpack revisions are not maintained after the first draft.\n- Special services are requested late and block notices, enrollment material, or go-live.\n- PSD/DDOL/VRU is activated before test participant audit is complete.\n- Case notes are incomplete, leaving the Contact Center or ongoing team without the plan-specific rules they need.\n- Final subpack or transition date is not added to NBI/AWD, leaving the conversion administratively open.\n\n## See Also\n\n- [[tc]]\n- [[go-live-checklist]]\n- [[case-notes-template]]\n- [[plan-conversion-handoffs]]\n- [[tc-stuff]]"},{"id":"sources/tc-stuff","slug":"tc-stuff","rel":"sources/tc-stuff.md","namespace":"sources","title":"TC Stuff","summary":"Mixed legacy source bundle containing team charters, TC/QC role definitions, go-live controls, case note template language, plan setup procedures, division/affiliate guidance, payroll automation setup, CPMA setup, and Plan Sponsor Website u","updated":"2026-05-13","created":"2026-05-13","sources":1,"status":"needs-review","tags":["source","tc","qa","conversion","legacy","procedures"],"type":"source","extras":[],"media":[],"meta":{"title":"TC Stuff","type":"source","tags":["source","tc","qa","conversion","legacy","procedures"],"created":"2026-05-13","updated":"2026-05-13","sources":1,"status":"needs-review"},"markdown":"# TC Stuff\n\nMixed legacy source bundle containing team charters, TC/QC role definitions, go-live controls, case note template language, plan setup procedures, division/affiliate guidance, payroll automation setup, CPMA setup, and Plan Sponsor Website user setup notes.\n\n> [!warning] Source status\n> The file itself says multiple charter sections are outdated and need full QC. Treat this source as institutional memory and role/process evidence, not as current official procedure unless confirmed against current standards.\n\n## Summary\n\n`TC Stuff.txt` is not one procedure. It is a stitched collection of older conversion materials. The most useful wiki value is the way it fills gaps around the Transition Consultant role, Quality Control role, DDOL/VRU/PSD activation, go-live controls, case note structure, and plan administration setup.\n\nThe source is especially valuable because the existing wiki had TC and QA/QC mostly documented from the DC perspective. This file gives a broader implementation-team view of what TC and QC actually own.\n\n## Key Claims\n\n- The TC owns administrative setup and continuity during conversion: case notes, special procedures, remittance/admin manuals, PSD training, DDOL/VRU/PSD activation, audit controls, source mapping support, and closeout handoff.\n- QC owns a structured audit/control role: participant-level conversion records and assets, mapping review, default allocations/deferrals, census details, duplicate SSNs, loan analysis, statements, participant website test IDs, and financial-risk checks.\n- The team charter material describes four project modes: DC plan conversions, start-up projects, external mergers, and internal mergers.\n- Several procedures are actionable but need current validation: adding divisions, divisional PSD reporting, multiple affiliates, go-live checklist, bonus election setup, source mapping procedure, payroll file automation, CPMA setup, case notes, and Plan Sponsor Website user setup.\n- The go-live checklist treats limited access and full access as separate gates, each requiring system checks, case note updates, communications, access-code/service validation, and audit signoff.\n- Case notes are a structured operating record, not casual notes. The template includes special alerts, conversion dates, limited access windows, CPMA/Financial Guide language, asset gathering, deferrals, loans, money sources, web portal notes, withdrawals, and archived notes.\n\n## Entities Mentioned\n\n- [[tc]]\n- [[qa]]\n- [[roles/lm-dc]]\n- [[roles/com]]\n- [[p3]]\n- [[eds]]\n- [[wx]]\n- [[nbi]]\n- [[prod-support]]\n- [[ftp-team]]\n- [[jen-curtin]]\n\n## Concepts Mentioned\n\n- [[team-charters]]\n- [[tc-conversion-timeline]]\n- [[go-live-checklist]]\n- [[case-notes-template]]\n- [[divisions-and-affiliates]]\n- [[payroll-file-automation]]\n- [[bonus-election-setup]]\n- [[creative-planning-managed-accounts]]\n- [[source-mapping-tc]]\n- [[plan-sponsor-website-user-setup]]\n- [[source-mapping]]\n- [[subpack]]\n- [[payroll-template]]\n- [[common-remitter-plans]]\n\n## Contradictions / Open Questions\n\n- The source uses older role labels in places, especially TM/CE/CC/AM language. The wiki has already normalized some current references, so any role mapping should be checked before treating the old labels as active.\n- The document marks charter sections as outdated and needing QC.\n- Some sections depend on screenshots that were never included.\n- Some named teams or fields may have changed since the material was created.\n- The typo \"Jen Curtain\" appears in the source and likely refers to [[jen-curtin]].\n\n## See Also\n\n- [[tc]]\n- [[qa]]\n- [[plan-conversion-handoffs]]\n- [[tc-conversion-timeline]]\n- [[go-live-checklist]]"},{"id":"concepts/team-charters","slug":"team-charters","rel":"concepts/team-charters.md","namespace":"reference","title":"Team Charters","summary":"Legacy role-boundary documents describing who owns what across conversion project types.","updated":"2026-05-13","created":"2026-05-13","sources":1,"status":"needs-review","tags":["concept","charter","roles","conversion","legacy"],"type":"concept","extras":[],"media":[],"meta":{"title":"Team Charters","type":"concept","tags":["concept","charter","roles","conversion","legacy"],"created":"2026-05-13","updated":"2026-05-13","sources":1,"status":"needs-review"},"markdown":"# Team Charters\n\nLegacy role-boundary documents describing who owns what across conversion project types.\n\n> [!warning] Legacy source\n> The source charter text says it is outdated and needs review. Use this page to understand historical role boundaries and handoffs, not as a current authority without QC.\n\n## Definition\n\nThe team charters define responsibilities and expectations for functional teams involved in plan installation work. The source includes separate charters for DC plan conversions, start-up projects, external mergers, and internal mergers.\n\n## Why It Matters\n\nThe charters are useful because they show how the conversion work is meant to be divided: sales/pricing feed the project, COM/TM coordinates the timeline and client communication, DC owns data movement and payroll files, TC owns administrative setup and controls, QC audits conversion data and system setup, and the plan sponsor/client provides information and approvals.\n\nEven if the details are stale, the charters help explain why conversion work fails at handoff points rather than inside one isolated role.\n\n## Evidence / Examples\n\n| Project Type | Useful Signal |\n|---|---|\n| DC Plans | Full new-plan conversion with asset movement, data conversion, plan setup, TC audits, QC controls, and client-facing communication. |\n| Start-up | Similar administrative setup without the same asset-conversion intensity; TC may be assigned only in some cases. |\n| External Merger | More emphasis on mapping, participant transfer, communication, merger documents, and external prior-provider coordination. |\n| Internal Merger | Adds internal data movement, outsourcing coordination, active population/new-hire handling, and internal data project management. |\n\n## Role Boundary Pattern\n\n- [[roles/com]] / TM: project coordination, client communication, document routing, project plan, and escalation.\n- [[roles/lm-dc]]: data layouts, test/live files, payroll source coordination, conversion records, assets, wire summaries, source mapping collaboration, and data issue resolution.\n- [[tc]]: administrative procedure setup, case notes, remittance/admin materials, PSD training, DDOL/VRU/PSD activation, audit controls, and conversion closeout.\n- [[qa]] / QC: conversion audit, default allocation/deferral checks, census detail review, loan analysis, statement support, website test account support, and financial-risk checks.\n- Plan Sponsor / Client: provides data, approvals, documents, meeting participation, payroll coordination, and implementation decisions.\n\n## Related Concepts\n\n- [[tc-conversion-timeline]]\n- [[plan-conversion-handoffs]]\n- [[source-mapping-tc]]\n- [[go-live-checklist]]\n\n## See Also\n\n- [[tc-stuff]]\n- [[tc]]\n- [[qa]]\n- [[roles/lm-dc]]\n- [[roles/com]]"},{"id":"glossary/tm","slug":"tm","rel":"glossary/tm.md","namespace":"glossary","title":"TM (Transition Manager)","summary":"**Full Name:** Transition Manager *(deprecated — now COM)*","updated":"2026-04-15","created":"2026-04-15","sources":1,"status":"current","tags":["glossary","deprecated","com","role"],"type":"glossary","extras":[],"media":[],"meta":{"title":"TM (Transition Manager)","type":"glossary","tags":["glossary","deprecated","com","role"],"created":"2026-04-15","updated":"2026-04-15","sources":1,"status":"current"},"markdown":"# TM\n\n**Full Name:** Transition Manager *(deprecated — now COM)*\n\n## Definition\n\nTM (Transition Manager) was the former name for the role now called [[roles/com]] (Communications Coordinator / Conversion Operations Manager). Older training materials, emails, and documentation may reference \"TM\" or \"the TM\" when referring to the person who schedules meetings, manages the PRD/subpack, routes approvals, and coordinates external communications during a plan conversion.\n\nAll current references use **COM**. TM is retained here only to aid interpretation of legacy documents.\n\n## Used By\n\n- Historical: DC training materials pre-dating the rename\n- Current equivalent: [[roles/com]]\n\n## See Also\n\n- [[roles/com]] — current role page (replaces all TM references)"},{"id":"concepts/toa","slug":"toa","rel":"concepts/toa.md","namespace":"documents","title":"TOA — Transfer of Assets","summary":"Client-signed legal document that authorizes the asset transfer and serves as the fund mapping source. No action on the transfer begins until the TOA is signed.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["document","toa","fund-mapping","transfer-in-kind","client-signed"],"type":"document","extras":[],"media":[{"id":"fig-1","caption":"TOA spreadsheet — one row per fund, Column T flags re-registration (TIK).","src":"SS/TOA.jpg","type":"screenshot"}],"meta":{"title":"TOA — Transfer of Assets","type":"document","tags":["document","toa","fund-mapping","transfer-in-kind","client-signed"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# TOA — Transfer of Assets\n\nClient-signed legal document that authorizes the asset transfer and serves as the fund mapping source. No action on the transfer begins until the TOA is signed.\n\n## Overview\n\nThe TOA is both a legal authorization and a data document. The DC uses it to:\n1. Determine if any funds will be transferred in kind (re-registration)\n2. Build the fund mapping template\n\n## Structure\n\nThe TOA is a spreadsheet/form containing one row per fund being transferred. Key columns:\n\n| Column | Content |\n|--------|---------|\n| Prior vendor fund code | Source fund identifier |\n| Prior vendor fund description | Human-readable fund name |\n| TransAmerica fund code | Destination fund identifier |\n| TransAmerica fund description | TA fund name |\n| **Column T** | **Re-registering: Y or N** |\n| Current value (estimate) | Dollar value of fund (may be stale) |\n\n> Column T is the critical field. If any row = Y, [[processes/tik-transfer|transfer-in-kind]] process applies.\n\n![TOA spreadsheet — one row per fund, Column T flags re-registration (TIK).](SS/TOA.jpg)\n\n## What the DC Does with the TOA\n\n### Step 1: Check Column T (Re-registering)\n\n- **All N:** Everything will be liquidated and mapped. No TIK action needed.\n- **Any Y:** Fill out the re-registration form and send to [[matt-oconnell]]'s team. Do this with proper timing (~12 business days before liquidation).\n\n### Step 2: Build Fund Mapping\n\nAs soon as TOA is signed and available:\n- Extract fund data into the [[fund-mapping]] template\n- No test files needed for this step — all fund codes are already on the TOA\n- The mapping template is nearly one-to-one with the TOA, plus 6 additional TA internal fields: **Filter, Vendor Fund Code, Ref #, Split Ratio, Split Code, Total**\n\n### Step 3: Use Current Values as Share Estimates\n\n- TOA current values = initial estimate for Matt O'Connell's expected share amounts\n- These may be months old — update with test files and again with final files\n\n## Important Notes\n\n- **No action until signed.** TOA signature is a hard prerequisite for the TIK and fund mapping work.\n- TOA values can be stale — treat dollar figures as estimates only.\n- The TOA is filed away once fund mapping is complete; DC doesn't need to reference it again.\n- The TOA may be part of the [[onboarding-package]] (especially PEP plans) or a standalone document.\n\n## Cash Conversion Exception\n\nFor a pure cash conversion: the TOA will show no fund-level mapping — all assets go to a pool. There is no \"from → to\" mapping and no column T entries to worry about.\n\n## Authorship and Timing\n\n- **The TOA is a TA document** — the COM fills it out using a standard template\n- **Client signing timeline:** One of the first things done when the plan begins — not something that happens near conversion time\n- **Re-registration form format:** Simple Excel document. DC fills it out based on the TOA column T data.\n\n## See Also\n\n- [[fund-mapping]]\n- [[processes/tik-transfer|transfer-in-kind]]\n- [[matt-oconnell]]\n- [[conversion-types]]\n- [[onboarding-package]]\n- [[dc-onboarding-workflow]]"},{"id":"concepts/transfer-in-kind","slug":"transfer-in-kind","rel":"concepts/transfer-in-kind.md","namespace":"processes","title":"Transfer In Kind (TIK / Re-registration)","summary":"This page has been folded into the current Transfer In Kind process page.","updated":"2026-06-25","created":"2026-04-14","sources":2,"status":"superseded","tags":["tik","reregistration","fidelity","shares","conversion"],"type":"process","extras":[],"media":[],"meta":{"title":"Transfer In Kind (TIK / Re-registration)","type":"process","tags":["tik","reregistration","fidelity","shares","conversion"],"created":"2026-04-14","updated":"2026-06-25","sources":2,"status":"superseded"},"markdown":"# Transfer In Kind (TIK / Re-registration)\n\nThis page has been folded into the current Transfer In Kind process page.\n\nCanonical page: [[processes/tik-transfer|Transfer In Kind (TIK) Process]]\n\nUse the process page as the current operating reference for:\n- identifying TIK funds from the [[toa]]\n- re-registration form timing\n- Matt O'Connell team handoff\n- Fidelity pooled account monitoring\n- Day of Wire placeholder behavior\n- Online + No Hold posting\n\n## Canonical Page\n\n[[processes/tik-transfer|Transfer In Kind (TIK) Process]]"},{"id":"processes/tik-transfer","slug":"tik-transfer","rel":"processes/tik-transfer.md","namespace":"processes","title":"Transfer In Kind (TIK) Process","summary":"How specific investment funds move as shares — not cash — from the prior record keeper to Transamerica's Fidelity pooled accounts during a plan conversion.","updated":"2026-06-25","created":"2026-04-16","sources":2,"status":"current","tags":["process","tik","reregistration","conversion","fidelity","shares"],"type":"process","extras":[],"media":[],"meta":{"title":"Transfer In Kind (TIK) Process","type":"process","tags":["process","tik","reregistration","conversion","fidelity","shares"],"created":"2026-04-16","updated":"2026-06-25","sources":2,"status":"current"},"markdown":"# Transfer In Kind (TIK) Process\r\n\r\nHow specific investment funds move as shares — not cash — from the prior record keeper to Transamerica's Fidelity pooled accounts during a plan conversion.\r\n\r\n## Overview\r\n\r\nTIK (also called re-registration) is a per-fund conversion method. Instead of selling shares and wiring cash, the actual shares are transferred directly from the prior custodian to Transamerica's Fidelity pooled accounts. Because shares never leave the market, there are no trades and no market-timing risk during the transfer.\r\n\r\nA single conversion can mix TIK, mapping, and cash funds — each fund's row in the [[toa]] specifies which method applies via the **Re-registering** column.\r\n\r\n## Trigger\r\n\r\nThe [[toa]] is signed and Column T (Re-registering) contains at least one `Y`. The DC identifies the TIK funds and begins the re-registration workflow in parallel with the rest of the conversion.\r\n\r\n## Steps\r\n\r\n### 1. Identify TIK Funds — DC\r\nReview the signed [[toa]]. Any fund row with Column T = `Y` is TIK. The remainder are N (liquidated — mapping or cash).\r\n\r\n### 2. Fill Out Re-registration Form — DC\r\n- Template lives in the front folder of the DC folder.\r\n- One row per TIK fund. Required fields: prior vendor name, contact info, effective dates, QSIP, fund name, prior vendor ticker, Transamerica ticker, estimated dollar amount.\r\n- Initial estimate: use TOA current values (may be stale by months).\r\n\r\n### 3. Time the Handoff to Matt O'Connell's Team — DC\r\n**Do not send early.** Once [[matt-oconnell]]'s team sets up Fidelity accounts, they begin monitoring immediately. Starting too early produces weeks of false negatives.\r\n\r\nTiming formula:\r\n```\r\nFidelity setup complete = Liquidation Date − 10 business days\r\nSend re-registration form = setup complete − 2 days (buffer)\r\n                         ≈ 12 business days before liquidation\r\n```\r\n\r\n### 4. Deliver Form to Prior Vendor — DC\r\nThe DC provides the completed form — **including Transamerica account information** — to the prior vendor. Without this, the vendor does not know where to route the shares.\r\n\r\n### 5. Update Share Estimates — DC\r\n- First update: after test files arrive.\r\n- Final update: **immediately** when final files arrive. Time-sensitive — Matt's team uses the expected amount to claim shares as they land in the pooled account.\r\n\r\n### 6. Day of Wire — DC via Informatica\r\nThe Day of Wire workflow creates a **placeholder** in P3 for each TIK fund. No trades fire. Bill Remit detail has a ref number but no participant data yet. See [[liquidation-day]].\r\n\r\n### 7. Post Participant Balances (TIK mode) — DC\r\nAfter final files, the CIT balance workflow fills the placeholder.\r\n- P3 processing mode: **Online + No Hold** (never Process Immediate).\r\n- No trades — shares already sit at Fidelity. Posting only updates the books.\r\nSee [[final-files-processing]] for the full balance-posting flow.\r\n\r\n### 8. Monitor the TIK Tracker Spreadsheet — DC + Matt O'Connell's team\r\nSeparate from the re-registration form. The DC maintains expected share amounts per fund; Matt's team updates the sheet as shares arrive. When every row is populated, all shares have landed and the DC can process.\r\n\r\n## Handoff Points\r\n\r\n| # | From → To | What Moves | Risk |\r\n|---|-----------|------------|------|\r\n| 1 | DC → Matt O'Connell's team | Re-registration form | Sent too early → weeks of false monitoring |\r\n| 2 | DC → Prior vendor | Re-registration form with TA account info | Vendor cannot route shares without it |\r\n| 3 | Prior vendor → Fidelity pooled accounts | Actual shares | Amount mismatch → DC investigates, contacts vendor |\r\n| 4 | Matt O'Connell's team → DC | \"Shares received\" signal via shared spreadsheet | Late signal → delayed participant posting |\r\n| 5 | DC → P3 | Online + No Hold posting | Wrong mode (Process Immediate) → duplicate trades |\r\n\r\n## Timing / Deadlines\r\n\r\n- **~12 business days before liquidation:** DC sends re-registration form to Matt's team.\r\n- **~10 business days before liquidation:** Fidelity accounts are set up and monitoring starts.\r\n- **Final files arrive:** DC updates share estimates immediately.\r\n- **Liquidation Day:** Placeholder created in P3 by Day of Wire workflow.\r\n- **After final files processed:** Balances posted in Online + No Hold mode; reconcile against TIK tracker.\r\n\r\n## Failure Modes\r\n\r\n- **Sent too early.** Matt's team spins up Fidelity monitoring weeks before shares arrive → wasted effort, false negatives.\r\n- **Missing account info.** Prior vendor has no routing target; shares don't arrive or arrive at the wrong account.\r\n- **Stale share estimates.** Matt's team cannot match incoming shares to the expected amount; shares sit unclaimed.\r\n- **Wrong P3 processing mode.** Process Immediate fires trades even though shares are already at Fidelity → duplicate trades and reversal work.\r\n- **TIK fund mistakenly processed as dummy participant.** TIK does not use a [[dummy-participant]] — the Day of Wire placeholder fills directly.\r\n\r\n## See Also\r\n\r\n- [[toa]]\n- [[matt-oconnell]]\n- [[informatica]]\n- [[liquidation-day]]\n- [[final-files-processing]]\n- [[conversion-types]]\n- [[plan-conversion-handoffs]]\n- [[dummy-participant]]\n- [[roles/lm-dc]]"},{"id":"roles/tc","slug":"tc","rel":"roles/tc.md","namespace":"roles","title":"Transition Consultant (TC)","summary":"Owns the administrative setup, control checklist, plan-specific procedures, case notes, participant access readiness, and closeout handoff for a conversion.","updated":"2026-05-13","created":"2026-04-14","sources":2,"status":"current","tags":["role","tc","transition","conversion","administration","audit"],"type":"role","extras":[],"media":[],"meta":{"title":"Transition Consultant (TC)","type":"role","tags":["role","tc","transition","conversion","administration","audit"],"created":"2026-04-14","updated":"2026-05-13","sources":2,"status":"current"},"markdown":"# Transition Consultant (TC)\n\nOwns the administrative setup, control checklist, plan-specific procedures, case notes, participant access readiness, and closeout handoff for a conversion.\n\n## What This Role Does\n\nThe TC is the administrative systems and procedures owner during conversion. Where COM/TM keeps the project and client communication moving, and DC owns data movement, the TC makes sure the plan can actually operate: plan sponsor access, participant website readiness, special service setup, case notes, remittance/admin guides, DDOL/VRU/PSD activation, audit controls, and ongoing-team handoff.\n\nThe older wiki described TC as \"higher-level back-end systematic work.\" [[tc-stuff]] sharpens that: TC is the person making sure the administrative reality matches the plan design before participants and downstream teams start using the plan.\n\n## Systems They Use\n\n| System / Artifact | How TC Uses It |\n|---|---|\n| [[p3]] | Reviews setup, DDOL/VRU settings, outsourcing tabs, service indicators, plan defaults, and go-live controls. |\n| [[wx]] / PSD | Supports plan sponsor website training, user setup, divisional access, and sponsor-facing payroll/file submission setup. |\n| [[nbi]] | Tracks checklist progress and closes out conversion milestones where required. |\n| AWD | Routes tickets, special service requests, final subpack, and administrative documentation. |\n| Case Notes | Documents plan-specific rules, special alerts, participant handling, and ongoing administration guidance. |\n| Submission Package / Subpack | Maintains administrative details after initial draft and circulates updates through conversion. |\n\n## Who They Work With\n\n| Team | Nature of Relationship |\n|---|---|\n| [[roles/lm-dc]] | Collaborates on source mapping, payroll/data questions, eligibility/enrollment setup, live-data audit support, and conversion handoffs. |\n| [[qa]] | Partners on system audits, financial-risk checks, participant website audits, conversion records/assets, statements, and go-live controls. |\n| [[roles/com]] | Receives project context, routes client-facing questions, coordinates notices, and joins conversion closeout communication. |\n| Plan Sponsor | Receives PSD training, user setup support, remittance/file transmission education, and administrative procedure guidance. |\n| Contact Center / Processing | Receives plan-specific administrative information so downstream teams can handle calls and work correctly. |\n| Ongoing Account Team | Receives case notes, special processes, manuals, final subpack, and transition call context. |\n| [[prod-support]] | Supports special service/system tickets when setup requires back-end support. |\n\n## Key Handoffs\n\n**Comes in:**\n- New sale, PRD, submission package, and project strategy from COM/TM.\n- Source-balance information and data questions from DC.\n- Audit findings and participant test support from QC/QA.\n- Client administrative choices, payroll approach, and special service requirements.\n\n**Goes out:**\n- Completed or updated subpack.\n- Case notes and administrative procedures.\n- Remittance guides and administration manuals.\n- PSD training and access setup support.\n- DDOL/VRU/PSD activation confirmation.\n- Go-live checklist signoff package.\n- Transition call and final handoff to ongoing teams.\n\n## What Other Teams Should Know\n\n- TC work is a control layer. If TC is looped in late, admin setup, notices, participant access, and closeout can all get squeezed.\n- TC and QA are different. TC owns the administrative setup and procedural continuity; QA/QC owns audit and validation.\n- TC depends on DC for accurate source and data information, but TC adds the plan-provision and administrative attributes that make the source mapping usable.\n- Case notes are a downstream operating artifact, not just documentation. Bad case notes create call-center and processing confusion later.\n- Limited access and full access should be treated as separate activation gates, each with its own audit and service checks.\n\n## Open Questions\n\n- Which TC responsibilities in the legacy charter have changed under the current operating model?\n- Which current team owns each special service ticket type: PX, CMP, MA, CPMA, statements, logos, and non-dynamic forms?\n- What is the current source of truth for TC go-live signoff?\n- Are case notes still maintained in the same structure shown in the legacy template?\n\n## See Also\n\n- [[tc-stuff]]\n- [[tc-conversion-timeline]]\n- [[go-live-checklist]]\n- [[case-notes-template]]\n- [[source-mapping-tc]]\n- [[plan-sponsor-website-user-setup]]\n- [[qa]]\n- [[roles/lm-dc]]\n- [[plan-conversion-handoffs]]"},{"id":"glossary/vef","slug":"vef","rel":"glossary/vef.md","namespace":"glossary","title":"VEF","summary":"**Full Name:** Vendor Expense Form","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["glossary","acronym","com","advisor","compliance"],"type":"glossary","extras":[],"media":[],"meta":{"title":"VEF","type":"glossary","tags":["glossary","acronym","com","advisor","compliance"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# VEF\n\n**Full Name:** Vendor Expense Form\n\n**Definition:** A document used when a vendor expense arrangement needs to be established for a plan. Routed by the [[roles/com]] through an advisor firm and the plan sponsor, then submitted for internal L&C system setup.\n\n**Used By:** COM (routes the workflow); advisor firm (completes the form); client/plan sponsor (signs it); L&C team (sets up the arrangement in the system).\n\n## See Also\n\n- [[concepts/vef]] — concept page with full workflow\n- [[roles/com]]"},{"id":"concepts/vef","slug":"vef","rel":"concepts/vef.md","namespace":"documents","title":"VEF — Vendor Expense Form","summary":"A document used when a vendor expense arrangement needs to be established for a plan. Routed by the roles/com through an advisor firm, the plan sponsor, and then submitted for internal L&C (Licensing and Compliance?) setup via Salesforce.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["concept","document","com","advisor","compliance"],"type":"document","extras":[],"media":[],"meta":{"title":"VEF — Vendor Expense Form","type":"document","tags":["concept","document","com","advisor","compliance"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# VEF — Vendor Expense Form\n\nA document used when a vendor expense arrangement needs to be established for a plan. Routed by the [[roles/com]] through an advisor firm, the plan sponsor, and then submitted for internal L&C (Licensing and Compliance?) setup via Salesforce.\n\n## Definition\n\nSome plans involve expense or fee arrangements with vendors that require formal documentation and system setup. The VEF is the form that captures and authorizes these arrangements. It is marked \"if applicable\" in the COM checklist — not every conversion requires one.\n\n## Workflow\n\n1. COM sends VEF to advisor firm for completion and approval\n2. Advisor approves the form\n3. COM sends approved form to client for signature\n4. COM receives signed copy\n5. COM submits a ticket to L&C via SF (Salesforce?) to set up the arrangement in the system\n6. COM receives confirmation that setup is complete\n\n## Open Questions\n\n- What \"L&C\" stands for — likely Licensing and Compliance, but not confirmed\n- What specific vendor expense scenarios trigger a VEF\n- Whether VEF is an internal TA form or an industry-standard document\n\n## Related Concepts\n\n- [[prd]] — plan design document; pricing context\n- [[nbi]] — where the plan's setup is tracked\n\n## See Also\n\n- [[roles/com]]\n- [[glossary/vef]]"},{"id":"index","slug":"index","rel":"index.md","namespace":"admin","title":"Wiki Index","summary":"*Last updated: 2026-06-25 - 135 pages, 10 sources*","updated":"","created":"","sources":0,"status":"","tags":[],"type":"","extras":[],"media":[],"meta" ical process page.\n- Folded `concepts/reversal-process` into `processes/reversal-submission`; retained reversal form field detail on the canonical page.\n- Folded `concepts/loading-eligibility-eds` into `processes/eligibility-loading`; retained rehire-code detail on the canonical page.\n- Updated incoming wiki links to point directly at the canonical process pages while preserving aliases for the old slugs.\r\n\n## 2026-06-25 - Zero-source cleanup batch\n\nType: edit\n\n- Reclassified seven sourced-but-light EDS/Informatica pages from `sources: 0` to `sources: 1` while keeping `status: needs-review`.\n- Added Source Notes to pages derived from existing hub/source pages but still awaiting dedicated procedure documentation.\n- Kept three true source gaps at `sources: 0`: `data-discovery-document`, `faa-dc-data-requirements`, and `informatica-basis-module`.\n- Added Source Gap notes to the remaining zero-source pages so the Needs Work view points to actionable missing evidence.\r\n\n## 2026-06-25 - Doc Ops role cleanup\n\nType: edit\n\n- Expanded `roles/doc-ops` from a stub into a working role page using COM, LM DC, P3, plan class, and handoff references.\n- Changed Doc Ops status from `stub` to `needs-review` because the role is now navigable but still lacks a direct Doc Ops source.\n- Updated the wiki index row for Doc Ops and corrected stale source-count summaries for EDS/Informatica source-gap pages.\r\n\n## 2026-06-25 - Duplicate slug allowlist\n\nType: tooling\n\n- Added shared duplicate-slug validation rules in `scripts/wiki-validation-rules.js`.\n- Updated the builder and validator to separate unexpected duplicate bare slugs from intentional namespace pairs.\n- Documented the allowed pairs: `csr`, `nsa`, `vef`, `com`, and `lm-dc`.\n- Updated the Needs Work view so unexpected duplicates remain actionable while allowed duplicates stay visible with reasons.\r\n\n## 2026-06-25 - Removed unneeded source-gap pages\n\nType: delete\n\n- Deleted `concepts/data-discovery-document`, `concepts/faa-dc-data-requirements`, and `concepts/informatica-basis-module` per maintainer direction.\n- Removed index rows for those pages.\n- Cleaned inbound links from FAA glossary, Informatica Loan Module, Informatica Training Manual, and Loading Basis through EDS.\n- Reframed the Loan Module page so it no longer treats the deleted Basis placeholder as a documented module page.\n\n## 2026-06-25 - Homepage and maintenance view polish\n\nType: tooling\n\n- Added compact homepage entry points for the highest-use namespaces.\n- Added generated health counts for broken links, unindexed pages, missing status, zero-source pages, and unexpected duplicate slugs.\n- Added filtered namespace pages so namespace links open focused page lists instead of the full all-pages view.\n- Renamed the duplicate allowlist display to `Allowed namespace pairs` so intentional role/onboarding and concept/glossary pairs are not presented as active issues.\n- Browser-smoked the working HTML for homepage health, namespace browsing, Needs Work counts, search, mobile overflow, and console errors."},{"id":"concepts/wire-instructions","slug":"wire-instructions","rel":"concepts/wire-instructions.md","namespace":"documents","title":"Wire Instructions","summary":"Banking instructions sent to the prior record keeper telling them where to send the liquidated assets on liquidation day.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["wire","liquidation","prior-record-keeper","cashiering"],"type":"document","extras":[],"media":[],"meta":{"title":"Wire Instructions","type":"document","tags":["wire","liquidation","prior-record-keeper","cashiering"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# Wire Instructions\r\n\r\nBanking instructions sent to the prior record keeper telling them where to send the liquidated assets on liquidation day.\r\n\r\n## Overview\r\n\r\nWire instructions tell the prior record keeper exactly where to wire the plan's money when they liquidate. The DC sends these as early as possible, then resends an updated version approximately one week before liquidation.\r\n\r\n## Two Sets of Instructions\r\n\r\n### Initial Wire Instructions (Early Send)\r\n- Sent as soon as the prior record keeper contact is established\r\n- May use the **default account** if P3 is not yet fully set up\r\n- Default account: money still arrives at TransAmerica, just in a general account rather than the plan-specific account\r\n  - Someone internally routes it to the correct place (extra manual step, but manageable)\r\n  - Not the end of the world — money is accessible internally\r\n- Better to send early with a default account than to delay\r\n\r\n### Updated Wire Instructions (~1 Week Before Liquidation)\r\n- Resent approximately 1 week before liquidation date\r\n- By this point, P3 should be fully set up → plan-specific account number available\r\n- Updated instructions route directly to the plan-specific account (eliminates the extra routing step)\r\n- Also resent because instructions may have changed since the initial send\r\n\r\n## P3 Account Numbers — Assurance Code\r\n\r\nThe **Assurance Code** in P3 determines which account number to use for the plan.\r\n\r\n**Navigation:**\r\n> Plan → dropdown → General Plan → Assurance Codes\r\n\r\nThe wire instructions template has a field for this — DC pulls the assurance code from P3 and fills it into the template to get the correct account number.\r\n\r\n**How to know if P3 is ready:** Just try to log in and see. If the plan is set up, the assurance code will be accessible.\r\n\r\n## Process\r\n\r\n1. Identify prior record keeper contact (from [[prior-record-keeper]] coordination)\r\n2. Use the **standard wire instructions template** (DC does not generate these from scratch)\r\n3. Pull the assurance code from P3 → template fills in the correct account number\r\n4. If P3 is not set up yet: use the **default account** (money arrives at TA, internally routed)\r\n5. Send to prior RK as early as possible\r\n6. Resend updated (plan-specific) instructions ~1 week before liquidation\r\n\r\n## Wrong Account — What Happens\r\n\r\nIf the prior RK sends money to the default account instead of the plan-specific account:\r\n> Ask internally for a **transfer** to route the funds to the correct account.\r\n\r\nSame applies if the prior RK sends to the wrong account entirely. Process is the same — request the transfer. It's not catastrophic, just an extra step.\r\n\r\n## See Also\r\n\r\n- [[prior-record-keeper]]\r\n- [[liquidation-day]]\r\n- [[p3]]\r\n- [[dc-onboarding-workflow]]"},{"id":"entities/wx","slug":"wx","rel":"entities/wx.md","namespace":"systems","title":"WX — Plan Sponsor Site","summary":"Transamerica's web-based portal for plan sponsors. WX (also called \"WX V2\" when referencing payroll integration) is set up by tc and verified by roles/com.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["system","tool","com","tc","plan-sponsor","participant"],"type":"system","extras":[],"media":[],"meta":{"title":"WX — Plan Sponsor Site","type":"system","tags":["system","tool","com","tc","plan-sponsor","participant"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# WX — Plan Sponsor Site\n\nTransamerica's web-based portal for plan sponsors. WX (also called \"WX V2\" when referencing payroll integration) is set up by [[tc]] and verified by [[roles/com]].\n\n## Overview\n\nWX is the plan sponsor-facing web platform that allows plan administrators to manage their retirement plan online. It includes payroll file upload functionality in its V2 iteration. Setup is owned by TC; the COM verifies that it is configured correctly and follows up if it is not.\n\n## Key Facts\n\n- \"WX\" likely stands for a Workplace Experience portal or similar — full name not confirmed\n- \"WX V2\" refers to a version with payroll functionality; COM must confirm early whether a plan needs this\n- TC is responsible for setting up WX access for the plan sponsor\n- COM confirms setup and requests it from TC if not yet done\n\n## Role in Plan Conversions\n\n1. COM confirms early whether the plan needs payroll functionality (WX V2)\n2. COM checks whether the plan is set up on WX\n3. If not set up, COM emails TC to request WX access setup\n4. TC sets up WX; plan sponsor can then access the portal\n\n## Open Questions\n\n- Full name/meaning of \"WX\"\n- What plan sponsors can do in WX (view contributions? manage enrollments? run reports?)\n- Whether participants also have a separate access portal\n- Whether WX is the same as or different from the payroll vendor's upload interface\n\n## See Also\n\n- [[roles/com]]\n- [[tc]]\n- [[ftp-connection]]\n- [[payroll-support]]"}],"rawFiles":[],"duplicateSlugs":[],"health":{"brokenLinks":[],"ambiguousLinks":[],"duplicateBareSlugs":[],"allowedDuplicateBareSlugs":[{"slug":"com","ids":["roles/com","onboarding/com"],"reason":"Role reference and onboarding guide intentionally share the role slug."},{"slug":"csr","ids":["glossary/csr","concepts/csr"],"reason":"Concept/document page plus glossary acronym entry."},{"slug":"lm-dc","ids":["roles/lm-dc","onboarding/lm-dc"],"reason":"Role reference and onboarding guide intentionally share the role slug."},{"slug":"nsa","ids":["glossary/nsa","concepts/nsa"],"reason":"Concept page plus glossary acronym entry."},{"slug":"vef","ids":["glossary/vef","concepts/vef"],"reason":"Document page plus glossary acronym entry."}],"staleAllowedDuplicateBareSlugs":[],"unindexedPages":[],"missingStatus":[],"zeroSourcePages":[],"stubLikePages":[]},"backlinks":{"roles/com":[{"id":"glossary/aaa","title":"AAA","namespace":"glossary"},{"id":"glossary/awd","title":"AWD","namespace":"systems"},{"id":"concepts/blackout-notice","title":"Blackout Notice","namespace":"documents"},{"id":"concepts/contribution-monitoring-form","title":"Contribution Monitoring Form","namespace
