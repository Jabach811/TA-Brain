te\r\n\r\nThe file format specification provided to clients and payroll vendors for ongoing payroll contribution uploads after conversion.\r\n\r\n## Overview\r\n\r\nThe payroll template defines exactly how payroll files must be structured to be accepted by TransAmerica's systems. It is shared with both the client (plan sponsor) and the payroll vendor simultaneously. Payroll vendors adjust their workflows to output files in this format.\r\n\r\n## Structure\r\n\r\n**First ~75%:** Identical to the [[base-file]] census section\r\n- Participant demographics\r\n- Status and eligibility info\r\n- Employee identifiers\r\n\r\n**Remaining ~25%:** Contribution and payroll-specific data\r\n- Contribution amounts by source (one column per source)\r\n- Loan payment amounts (if applicable)\r\n- Hours worked (if the plan tracks hours)\r\n- Compensation for the period\r\n- Payroll period start date\r\n- Payroll period end date\r\n- Check date\r\n\r\n## Setup Process\r\n\r\n1. DC builds payroll template in parallel with the base file (same meeting/timing)\r\n2. Shared with client and payroll vendor simultaneously\r\n3. Meeting with payroll vendor: vendor reviews template, asks questions, adjusts their output workflow\r\n4. DC requests a **test payroll file** from the vendor as soon as they're ready\r\n5. DC tests file through [[eds]] — reviews warnings and errors\r\n6. If issues: send feedback to vendor → new test file → repeat\r\n7. Clean file sent to [[payroll-support|Payroll Support Team]] for deeper validation\r\n8. Green light from Payroll Support → payroll setup complete\r\n\r\n> Full vendor-side narrative — intro email, kickoff meeting flow, OnePayroll handoff, client demo, auto-sweep timing — lives in [[payroll-vendor-onboarding]].\r\n\r\n## File Naming Convention\r\n\r\nEvery payroll file uploaded through FTP (or sent manually) must follow:\r\n\r\n```\r\n\u003ccase#>_\u003ccontract>_\u003caffiliate>.xls\r\n```\r\n\r\nThe system catches on the prefix — wrong name and the file isn't picked up. A timestamp gets appended automatically on receipt to prevent duplicates, so the sender only controls the prefix.\r\n\r\n## EDS Layout Dependency\r\n\r\nBefore testing any payroll file in EDS, the DC must set up the payroll file layout in EDS (\"P3 to EDS\" module). This should be done early — before test files arrive.\r\n\r\n## FTP Dependency\r\n\r\nOnce the payroll file format is approved, the payroll vendor needs a way to deliver files automatically. This is handled via the [[ftp-connection]]. The payroll vendor uploads to the FTP account; the system picks up the file and processes it.\r\n\r\n## Manual Payroll Filing (Interim)\r\n\r\nIf FTP automation isn't ready by conversion date, the client sends payroll files manually (secure transfer directly to TransAmerica). This interim state can sometimes last weeks or months.\r\n\r\n> Keep track of which plans are on manual payroll vs. automated FTP. Manual files require more active monitoring.\r\n\r\n## Format and Template\r\n\r\n- **Standard TA template** — DC does not build from scratch. Trimmed and tailored per client details.\r\n- **Accepted formats:** All (CSV, Excel, fixed-width). Excel is preferred.\r\n- **Sources per template:** One to many. Practical limit is around 10 sources on one template.\r\n\r\n## Post-Conversion Source Changes\r\n\r\nAdding new sources to a payroll template after conversion is **not the DC's job**. Account Managers handle that.\r\n\r\n## Multiple Payroll Vendors\r\n\r\nIf a plan has multiple payroll vendors: DC handles it \"as best as we can\" — no single standard process.\r\n\r\n## See Also\r\n\r\n- [[payroll-vendor-onboarding]]\r\n- [[base-file]]\r\n- [[ftp-connection]]\r\n- [[eds]]\r\n- [[source-mapping]]\r\n- [[dc-onboarding-workflow]]"},{"id":"concepts/payroll-vendor-onboarding","slug":"payroll-vendor-onboarding","rel":"concepts/payroll-vendor-onboarding.md","namespace":"processes","title":"Payroll Vendor Onboarding","summary":"The full vendor-side payroll work that happens before FTP automation is live and before the go-live handoff. Covers the moment the prior payroll vendor enters the picture all the way through the client's first successful manual upload.","updated":"2026-05-03","created":"2026-05-03","sources":1,"status":"current","tags":["payroll","vendor","onboarding","ftp","eds","onepayroll","demo","conversion"],"type":"process","extras":[],"media":[],"meta":{"title":"Payroll Vendor Onboarding","type":"process","tags":["payroll","vendor","onboarding","ftp","eds","onepayroll","demo","conversion"],"created":"2026-05-03","updated":"2026-05-03","sources":1,"status":"current"},"markdown":"# Payroll Vendor Onboarding\n\nThe full vendor-side payroll work that happens before FTP automation is live and before the go-live handoff. Covers the moment the prior payroll vendor enters the picture all the way through the client's first successful manual upload.\n\nThis page is the narrative spine. The supporting pages — [[payroll-template]] (the file spec), [[ftp-connection]] (the upload channel), [[payroll-support]] (OnePayroll validation), [[payroll-handoff-at-go-live]] (the live-date handoff) — each cover one piece in depth.\n\n## Overview\n\nOnce the conversion kicks off and the payroll vendor is identified, the DC has a parallel workstream to run alongside everything else: get the vendor producing files in TA's format, get those files validated, get the upload channel set up, and demo the upload flow to whoever on the client side will be running it. The goal is to be in good enough shape by go-live that the project can be passed off to Fiduciary Services regardless of how far testing got.\n\n## Phase 1 — Identify and contact\n\nAs soon as the conversion starts, find out two things:\n\n1. **Who at the payroll vendor will be the contact** for this plan\n2. **Who on the client side** will be uploading files — that person needs FTP credentials\n\nBoth pieces are upstream of everything else. Don't wait on either.\n\n### Vendor intro email\n\nSend the vendor contact an introductory email immediately. Standard wording (adjust to taste):\n\n```\n\u003cDC-INTRO-EMAIL-TEMPLATE>\n\nHi [Name],\n\nMy name is [DC Name] and I'm the Data Consultant for [Plan Name / Case #].\nI'll be your main point of contact for the payroll work during the\nconversion. I'd like to set up a meeting to walk through our payroll\nfile format and discuss how you'll be sending us files going forward.\n\nAre you available [proposed times]?\n\nThanks,\n[DC Name]\n```\n\n### FTP setup request — fire it off early\n\nOnce the upload contact is identified on the client side, fill out the FTP form and send it to [[jen-curtin]]'s [[ftp-team]]. **Don't sit on this.** That team has a backlog and setup takes real time. The earlier the request lands, the more breathing room you have.\n\nSee [[ftp-connection]] for the full setup process.\n\n## Phase 2 — Kickoff meeting with the vendor\n\nOnce the vendor responds, set up the kickoff meeting. Standard agenda:\n\n1. **Vendor shows what they're currently producing** — what their existing payroll file looks like, how they generate it, what their internal naming and delivery is\n2. **DC presents the TA payroll template** — share the [[payroll-template]] file\n3. **Field-by-field walkthrough** — explain each column, what it means, what's required, what's optional\n4. **Vendor takes it back** — they go re-tool their output workflow to match the template\n5. **Vendor returns with a test file** — sooner is better\n\nThis first meeting is the most important touchpoint. Make sure they understand the template, not just have a copy of it.\n\n## Phase 3 — Test the FTP connection (independent of test files)\n\nOnce the FTP team confirms the account is set up, **do not wait for the vendor's first real test file to validate the connection**. Ask the vendor (or whoever has the credentials) to send a random file — anything — just to confirm the upload works end-to-end.\n\nThe thing the system catches on is the **naming convention**:\n\n```\n\u003ccase#>_\u003ccontract>_\u003caffiliate>.xls\n```\n\nA timestamp gets appended automatically on receipt to prevent duplicates, but the prefix has to be correct or the file isn't picked up. A throwaway file with the right name proves the channel is working before you stake a real test file on it.\n\n## Phase 4 — Validation chain\n\nOnce real test files start coming in:\n\n```\nVendor test file\n   ↓\nDC validates through EDS  ← internal-flavored warnings/errors\n   ↓\nSend to OnePayroll (Payroll Support)\n   ↓\nOnePayroll runs production-level import  ← end-user-flavored warnings/errors\n   ↓\nIssues? → back to vendor, get a new test file, restart\nClean? → green light\n```\n\nThe reason OnePayroll is its own gate (and not just \"EDS again\"): the warnings and errors their import surfaces are the ones the client will see when they upload from the production environment. The internal DC import strips a lot of that. So even if EDS comes back clean, OnePayroll can still find things.\n\nSee [[payroll-support]] for what OnePayroll catches and how the back-and-forth works.\n\n### Manual email validation as the interim\n\nIf the FTP isn't live yet but the vendor wants validation, they can send the file as an email attachment directly to the DC. Validate it the same way (EDS → OnePayroll) and feed results back. Once FTP comes online, validate the next FTP-delivered file too — confirm both channels work.\n\n## Phase 5 — Client demo\n\nOnce a clean test file is through OnePayroll, demo the upload flow to whoever on the client side will be running uploads. Eventually the FTP will move to auto-sweep and the client doesn't have to log in at all, but **that's not the day-one state**. Day one, someone on the client team is uploading files manually through the upload page.\n\n`\u003cCLIENT-DEMO-WALKTHROUGH-LINK>`\n\n## Phase 6 — Auto-sweep / batch eligibility\n\nAuto-sweep (where the FTP folder is polled and files are processed automatically without anyone clicking upload) doesn't get enabled right away. The client/vendor needs to put together **2 or 3 good runs** before the channel is moved to batch processing. This typically happens well after go-live, often months out — and the DC isn't on the hook for it.\n\n## Phase 7 — Hand off at go-live (no matter where you are)\n\nThe current operating model is: at the live date, the project gets passed to Fiduciary Services regardless of how far testing got. See [[payroll-handoff-at-go-live]] for the formal procedure (FILESPECRQ AWD ticket + COM notifies AM).\n\nThe shift from prior practice: DC now does ALL the bridge validation work themselves (mid-market is no longer carrying the testing). DC still hands off cleanly at go-live. We don't stay handcuffed to the plan for months after live just to finish payroll.\n\n## Multiple payroll vendors\n\nIf a plan has more than one payroll vendor, run the above flow for each — there's no single standardized procedure for the multi-vendor case. Best-effort coordination per vendor.\n\n## See Also\n\n- [[payroll-template]]\n- [[ftp-connection]]\n- [[payroll-support]]\n- [[payroll-handoff-at-go-live]]\n- [[jen-curtin]]\n- [[ftp-team]]\n- [[eds]]\n- [[dc-onboarding-workflow]]"},{"id":"glossary/pea","slug":"pea","rel":"glossary/pea.md","namespace":"glossary","title":"PEA","summary":"**Full Name:** Plan Enrollment Agreement","updated":"2026-04-16","created":"2026-04-16","sources":1,"status":"current","tags":["glossary","enrollment","pep","document"],"type":"glossary","extras":[],"media":[],"meta":{"title":"PEA","type":"glossary","tags":["glossary","enrollment","pep","document"],"created":"2026-04-16","updated":"2026-04-16","sources":1,"status":"current"},"markdown":"# PEA\n\n**Full Name:** Plan Enrollment Agreement\n\n## Definition\n\nThe PEA is the enrollment agreement document used in the PEP (Pooled Employer Plan) onboarding workflow. It appears in the COM's OBP (Onboarding Package) process for PEP plans specifically.\n\n## Used By\n\n- [[roles/com]] — COM routes the PEA as part of the PEP onboarding package workflow\n- PEP plans only — does not appear in standard non-PEP conversions\n\n## See Also\n\n- [[onboarding-package]]\n- [[roles/com]]\n- [[glossary/aaa]]"},{"id":"concepts/plan-classes","slug":"plan-classes","rel":"concepts/plan-classes.md","namespace":"reference","title":"Plan Classes","summary":"Groupings within a plan (e.g., employee categories) that determine contribution rules, eligibility, and other plan parameters. Defined in P3.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["classes","p3","plan-setup","doc-ops"],"type":"reference","extras":[],"media":[],"meta":{"title":"Plan Classes","type":"reference","tags":["classes","p3","plan-setup","doc-ops"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# Plan Classes\r\n\r\nGroupings within a plan (e.g., employee categories) that determine contribution rules, eligibility, and other plan parameters. Defined in P3.\r\n\r\n## Overview\r\n\r\nPlan classes divide participants into groups within the plan — for example, hourly vs. salaried employees, or different divisions. Each class can have different eligibility rules, vesting schedules, or contribution sources. Classes are set up in [[p3]] and are informed by the [[prd]] or [[onboarding-package]].\r\n\r\n## Two Types of Classes in P3\r\n\r\n### Traditional / Regular Classes\r\nExamples: union, non-alien resident, part-time\r\n- Standard class types used across many plans\r\n- **DC can update** existing names and codes\r\n- **DC cannot add new** traditional classes — only update existing ones\r\n\r\n### Special Classes\r\nExamples: teachers, doctors, electricians — company/plan-specific groupings\r\n- Non-standard classes defined by the plan sponsor\r\n- **DC cannot add new special classes** — Doc Ops only\r\n- DC can update existing special class names and codes\r\n- If a new special class is needed: **email Doc Ops** with the request\r\n\r\n## DC's Role\r\n\r\n| Action | DC Can Do? |\r\n|--------|-----------|\r\n| Update existing class names | Yes |\r\n| Update existing class codes | Yes |\r\n| Add new traditional classes | No — update only |\r\n| Add new special classes | No — Doc Ops only |\r\n\r\n## P3 Navigation\r\n\r\n> Plan → dropdown → Define Classes\r\n\r\n## Interaction with Eligibility\r\n\r\n- Some classes are **excluded from eligibility** entirely\r\n- Other classes have **different entry rules** (different entry dates, service requirements, etc.)\r\n- These rules come from the PRD/OB and are set up in P3 by Doc Ops — DC verifies them\r\n\r\n## When Classes Come Up\r\n\r\nClasses are identified during the [[prd]] / [[onboarding-package]] review. By the time P3 is set up, the classes should be defined. The DC verifies P3 has the correct classes and updates names/codes if needed.\r\n\r\n\r\n## See Also\r\n\r\n- [[p3]]\r\n- [[prd]]\r\n- [[onboarding-package]]\r\n- [[dc-onboarding-workflow]]"},{"id":"processes/plan-conversion-handoffs","slug":"plan-conversion-handoffs","rel":"processes/plan-conversion-handoffs.md","namespace":"processes","title":"Plan Conversion Handoffs","summary":"How work moves between teams during a retirement plan conversion at Transamerica, from assignment through go-live.","updated":"2026-05-13","created":"2026-04-14","sources":4,"status":"current","tags":["process","conversion","handoffs","cross-team","onboarding"],"type":"process","extras":[],"media":[],"meta":{"title":"Plan Conversion Handoffs","type":"process","tags":["process","conversion","handoffs","cross-team","onboarding"],"created":"2026-04-14","updated":"2026-05-13","sources":4,"status":"current"},"markdown":"# Plan Conversion Handoffs\n\nHow work moves between teams during a retirement plan conversion at Transamerica, from assignment through go-live.\n\n## Overview\n\nA plan conversion involves at minimum six internal teams (DC, COM, QA, TC, Doc Ops, Cashiering) plus external parties (prior record keeper, payroll vendor). Each team has a distinct ownership zone; the risks live at the handoff points between them.\n\nThis page documents the handoffs — what moves, between whom, and when.\n\n## Trigger\n\nTwo parallel triggers start a conversion:\n- **COM trigger:** [[ellen-miller]] (or sales) issues an [[concepts/nsa]] (New Sale Announcement) → COM receives it → COM creates project plan and schedules kickoffs\n- **DC trigger:** [[ellen-miller]] notifies a manager that a plan slot is open in NBI → manager assigns a DC → DC enters active pipeline\n\nBoth triggers happen around the same time; COM and DC are assigned to the same plan and should connect early.\n\n## Handoff Map\n\n### 1. Assignment → DC\n- **From:** [[ellen-miller]] → manager → [[roles/lm-dc]]\n- **What moves:** Plan ID, NBI assignment\n- **DC action:** Confirms assignment in NBI; reviews PRD or onboarding package\n\n### 2. PRD / Onboarding Package → DC\n- **From:** [[roles/com]] → [[roles/lm-dc]]\n- **What moves:** Plan Review Document or Onboarding Package (eligibility, vesting, sources, classes)\n- **DC action:** Reviews sections relevant to data setup; notes conversion type\n\n### 3. Fund Mapping Approval\n- **From:** [[roles/lm-dc]] → [[roles/com]] → [[qa]] + [[tc]]\n- **Trigger:** TOA signed by client\n- **What moves:** Fund mapping document\n- **Approvers action:** Review and approve; return approval to DC via COM\n- **Risk:** Delay here pushes back source mapping and CONV file prep\n\n### 4. Source Mapping Approval\n- **From:** [[roles/lm-dc]] → [[roles/com]] → [[qa]] + [[tc]]\n- **Trigger:** Test files received from prior record keeper\n- **What moves:** Source mapping document\n- **Approvers action:** Review and approve\n- **Risk:** If test files arrive late, this phase compresses everything downstream\n\n### 5. Re-Registration Form (TIK only)\n- **From:** [[roles/lm-dc]] → [[matt-oconnell]]\n- **Trigger:** TOA reviewed; any fund with column T = Y\n- **What moves:** Re-registration form (DC fills out)\n- **Timing:** Target ~10–12 business days before liquidation\n- **Risk:** Too early = premature action; too late = liquidation can't proceed\n\n### 6. Liquidation Day — Cashiering Loop\n- **From:** [[roles/lm-dc]] → [[cashiering]] (heads-up, day before)\n- **From:** Prior record keeper → wire → [[cashiering]]\n- **From:** [[cashiering]] → [[roles/lm-dc]] (wire receipt + ref number)\n- **What moves:** Wire confirmation, transfer reference number\n- **DC action:** Cannot proceed with Day of Wire workflow until ref number received\n\n### 7. Eligibility Gate\n- **From:** [[roles/lm-dc]] → [[qa]] + [[tc]] + [[roles/com]] (notification)\n- **Trigger:** Deferrals posted, all data in good order\n- **What moves:** Eligibility notification email\n- **Approvers action:** Review setup; send go-ahead email\n- **DC action:** Enables eligibility in P3 only after go-ahead received\n- **Rule:** Deferrals must be posted BEFORE this notification is sent\n\n### 8. Special Plan Classes\n- **From:** [[roles/lm-dc]] → [[doc-ops]]\n- **Trigger:** Plan requires a new special class not already in P3\n- **What moves:** Request (presumably via ticket or email — method not yet documented)\n- **Doc Ops action:** Adds class to P3\n- **Risk:** DC cannot add these themselves; timing dependency on Doc Ops queue\n\n### 9. Prod Support Corrections\n- **From:** [[roles/lm-dc]] → [[prod-support]]\n- **Trigger:** Data error that can't be corrected through P3, ROC tool, or standard DC methods\n- **What moves:** AWD ticket (isolating query + thorough description)\n- **Prod Support action:** Direct database table correction\n- **DC action:** Verifies correction, closes ticket\n\n---\n\n## COM-Perspective Handoffs\n\n*The following handoffs are primarily owned or coordinated by COM. Added from [[com-main-checklist]].*\n\n### 10. NSA → COM Kickoff\n- **From:** Sales / business development → [[roles/com]]\n- **What moves:** [[concepts/nsa]] (New Sale Announcement)\n- **COM action:** Creates [[project-plan-com]], schedules internal and external kickoffs, uploads project plan to NBI, sends to conversion team\n- **Risk:** Delayed NSA receipt pushes back the entire COM timeline; conversion team may start without COM's project plan in hand\n\n### 11. Prior Plan Documents Routing\n- **From:** Plan Services → [[roles/com]] → [[ellen-miller]] → docs team\n- **Trigger:** COM initiates prior plan documents request early in the conversion\n- **What moves:** Prior plan documents package\n- **Risk:** Slow turnaround from prior carrier or Plan Services delays the review; COM must track and follow up actively\n\n### 12. Prior Carrier Letter\n- **From:** [[roles/com]] → plan sponsor + prior carrier\n- **Trigger:** Shortly after conversion kickoff\n- **What moves:** [[prior-carrier-letter]] formally notifying prior RK of transition\n- **Risk:** If delayed, prior carrier is unaware and will not initiate document or blackout coordination\n\n### 13. Participant Notices Mailing\n- **From:** [[roles/com]] → plan sponsor (approval) → [[ellen-miller]] (mailing)\n- **Trigger:** All notices drafted and compiled (blackout, cover letter, mapping notice, QDIA, fee disclosure, privacy notice)\n- **What moves:** [[blackout-notice]] and accompanying notice package; notice mailing file\n- **Timing:** Legally required; blackout notices must reach participants well before blackout starts\n- **Risk:** Missing plan sponsor approval, or late routing to Ellen, causes regulatory exposure\n\n### 14. Payroll Questionnaire Loop\n- **From:** [[roles/com]] → client → [[roles/com]] → [[roles/lm-dc]]\n- **Trigger:** Payroll setup phase\n- **What moves:** Payroll Questionnaire\n- **Risk:** Client delays returning the questionnaire; DC cannot begin payroll setup without it\n\n### 15. Contribution Monitoring Form + AWD Flip\n- **From:** [[roles/com]] → client → [[roles/com]] → [[tc]]\n- **Trigger:** TFS plans requiring contribution monitoring\n- **What moves:** [[contribution-monitoring-form]]; TC AWD setting change\n- **Risk:** If COM doesn't follow up on the TC confirmation, the AWD setting may not be flipped — monitoring doesn't activate at go-live\n\n### 16. RDD Form Loop\n- **From:** [[tc]] → [[roles/com]] → client → [[roles/com]] → [[tc]]\n- **Trigger:** Payroll setup phase\n- **What moves:** [[rdd-form]]\n- **Risk:** Client slow to return; COM must track and follow up; TC cannot proceed without it\n\n### 17. Early Access Activation\n- **From:** [[roles/com]] → [[roles/lm-dc]] (template request) → client (file completion) → [[roles/lm-dc]] (file load) → [[tc]] (activation)\n- **Trigger:** Plan offers early access; day before early access start\n- **What moves:** Early access file; TC system activation\n- **Timing:** TC must be notified the day before; file must be loaded before that\n- **Risk:** Client returns file late → TC cannot be notified in time → early access cannot open as scheduled\n\n### 18. Assets Received Notification\n- **From:** [[roles/lm-dc]] → [[roles/com]] → client\n- **Trigger:** Liquidation day — DC confirms assets received and deposited\n- **What moves:** Asset receipt confirmation and amount\n- **Risk:** COM must stay in contact with DC on liquidation day to send this email promptly\n\n### 19. CSR Delivery\n- **From:** Quality Consultant → [[roles/com]] → client\n- **Trigger:** Go-live\n- **What moves:** [[concepts/csr]] (Conversion Summary Report)\n- **Risk:** COM cannot complete go-live close-out until CSR is received; if QC delays, COM must follow up\n\n### 20. Go-Live Close-Out\n- **From:** [[roles/com]] → internal team + client + [[ellen-miller]] + [[nbi]]\n- **Trigger:** Plan is confirmed live\n- **What moves:** Go-live email to client; Auto Delivery Form (non-PEP); survey spreadsheet entry; NBI audit checklist; NBI transition date; Ellen Miller notification\n- **Risk:** Items missed here (especially NBI audit checklist and Ellen notification) leave the plan in an incomplete state in the system\n\n### 21. Payroll Handoff at Go-Live (if payroll not complete)\n- **From:** [[roles/lm-dc]] → Fiduciary Services; [[roles/com]] → Account Manager\n- **Trigger:** Go-live date reached with payroll testing still incomplete\n- **Effective:** February 26, 2026\n- **What moves:** FILESPECRQ AWD ticket (payroll contact, client contact, file layout, testing status summary); DC updates NBI; COM notifies AM\n- **Fiduciary Services action:** Takes over payroll testing using Inforce Payroll Projects process\n- **Risk:** If DC fails to submit the FILESPECRQ ticket or omits required fields, Fiduciary Services cannot pick up the project cleanly; payroll testing stalls\n- **See:** [[payroll-handoff-at-go-live]]\n\n### 22. Source Mapping Attribute Completion\n- **From:** [[roles/lm-dc]] -> [[tc]] -> COM/TM\n- **Trigger:** DC identifies all prior-vendor sources with balances and saves the working spreadsheet\n- **What moves:** Source list, balances, prior-plan review attributes, contribution type codes, contribution frequency, withdrawal provisions, vesting, and unresolved frozen-source questions\n- **TC action:** Reviews the prior plan material, completes administrative attributes, asks DC to obtain missing prior-vendor details, and routes completed mapping information back to the project owner\n- **Risk:** Frozen or legacy sources get mapped without verified attributes; downstream setup and participant rules become wrong\n- **See:** [[source-mapping-tc]]\n\n### 23. TC Administrative Readiness Gate\n- **From:** [[tc]] + [[qa]] -> conversion team -> ongoing team\n- **Trigger:** Limited access, full access, or conversion closeout is approaching\n- **What moves:** Case notes, system audit evidence, DDOL/VRU/PSD access status, remittance/admin guidance, special-service setup, participant website audit results, and final subpack\n- **TC action:** Confirms administrative procedures are documented and that participant/sponsor access is ready before activation\n- **QA action:** Validates setup and documents audit/control findings\n- **Risk:** The plan goes live with incomplete case notes, wrong access settings, missing special-service setup, or weak handoff to the ongoing team\n- **See:** [[tc-conversion-timeline]], [[go-live-checklist]], [[case-notes-template]]\r\n## Failure Modes\n\n| Handoff | Common Failure |\n|---------|---------------|\n| Fund/source mapping approval | Approvers not looped in promptly; approval delayed past liquidation prep window |\n| Re-registration timing | DC sends re-reg form too early or too late for Matt O'Connell's team |\n| Cashiering heads-up | DC forgets day-before notification; Cashiering unprepared for wire arrival |\n| Eligibility gate | DC enables eligibility before receiving go-ahead; or posts eligibility before deferrals |\n| Doc Ops class addition | DC attempts to add special class directly in P3 (will fail) |\n| Subpack | COM creates it but TC must take over after review — if handoff never happens, subpack is orphaned |\n| Participant notices | COM misses legal timing window for blackout notice; regulatory exposure |\n| Contribution monitoring AWD flip | COM sends form to TC but never confirms the AWD flip happened; monitoring doesn't activate |\n| Early access file timing | Client returns file late; TC can't be notified in time; early access window missed |\n| NSA to project plan | COM receives NSA but delays project plan upload; conversion team starts without shared timeline |\n| Go-live close-out | COM misses NBI audit checklist or Ellen notification; plan sits in incomplete state in system |\n| Payroll handoff at go-live | DC doesn't submit FILESPECRQ ticket, or submits without required fields; Fiduciary Services can't pick up project |\n\n## See Also\n\n- [[dc-onboarding-workflow]] — DC's view of the full 7-phase process\n- [[roles/lm-dc]] — DC role reference\n- [[roles/com]] — COM role reference (full 18-phase checklist breakdown)\n- [[liquidation-day]] — detail on the Day of Wire sequence\n- [[eligibility-and-deferrals]] — the eligibility gate detail\n- [[concepts/nsa]] — the trigger that starts COM's workflow\n- [[blackout-notice]] — legally required participant communication\n- [[early-access]] — pre-go-live participant window\n- [[concepts/csr]] — Quality Consultant's go-live deliverable\n- [[payroll-handoff-at-go-live]] — new procedure (Feb 26, 2026) when payroll testing is incomplete at go-live"},{"id":"processes/plan-sponsor-website-user-setup","slug":"plan-sponsor-website-user-setup","rel":"processes/plan-sponsor-website-user-setup.md","namespace":"processes","title":"Plan Sponsor Website User Setup","summary":"Process for plan sponsor access and user setup on the Plan Sponsor Website.","updated":"2026-05-13","created":"2026-05-13","sources":1,"status":"current","tags":["process","psd","wx","plan-sponsor","user-access","tc"],"type":"process","extras":[],"media":[],"meta":{"title":"Plan Sponsor Website User Setup","type":"process","tags":["process","psd","wx","plan-sponsor","user-access","tc"],"created":"2026-05-13","updated":"2026-05-13","sources":1,"status":"current"},"markdown":"# Plan Sponsor Website User Setup\n\nProcess for plan sponsor access and user setup on the Plan Sponsor Website.\n\n## Overview\n\nThe Plan Sponsor Website gives plan sponsor users access to reports, participant information, payroll/remittance submission, and user administration. TC materials treat PSD training and user setup as part of administrative readiness.\n\n> [!warning] Source status\n> The source references screenshots that are not included. Validate current Plan Sponsor Website navigation and permission labels before using as live instructions.\n\n## Trigger\n\nThe process is needed when a plan sponsor contact needs website access, especially during conversion setup, payroll automation, or divisional access configuration.\n\n## Steps\n\n1. **Confirm sponsor access need.** Owner: TC/COM. Determine which plan sponsor users need access and what privileges they should receive.\n2. **Access Plan Sponsor Website.** Owner: Plan Sponsor / TC support. Navigate to the Plan Sponsor Website.\n3. **Open user maintenance.** Owner: Plan Sponsor admin / TC support. Use User Maintenance to add or update users.\n4. **Assign privileges.** Owner: Plan Sponsor admin / TC support. Grant the administrative privileges appropriate for the user, including payroll/remittance or automated payroll permissions where needed.\n5. **Configure division access if applicable.** Owner: TC / Plan Sponsor admin. For divisional plans, limit users to the correct division/security access.\n6. **Verify access.** Owner: TC / Plan Sponsor. Confirm the user can see the intended plan, division, reports, and payroll functions.\n7. **Document setup.** Owner: TC. Note access decisions in plan documentation or case notes where relevant.\n\n## Handoff Points\n\n- TC supports sponsor training and setup.\n- Plan Sponsor owns delegated user administration once the correct primary user exists.\n- Payroll automation may require one sponsor user to receive all Automated Payroll File Access permissions.\n\n## Failure Modes\n\n- Sponsor user has access to the wrong division or too much plan-level reporting.\n- Automated payroll permissions are missing, preventing file submission or delegation.\n- User setup is completed but not documented for ongoing support.\n- PSD access is assumed complete before actual sponsor login is verified.\n\n## See Also\n\n- [[payroll-file-automation]]\n- [[divisions-and-affiliates]]\n- [[case-notes-template]]\n- [[wx]]\n- [[tc-stuff]]"},{"id":"concepts/prd","slug":"prd","rel":"concepts/prd.md","namespace":"documents","title":"PRD — Plan Review Document","summary":"A detailed document comparing the prior provider's plan design to the TransAmerica plan design. Reviewed internally first, then with the client, then signed.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["document","prd","plan-provisions","discovery","client-signed"],"type":"document","extras":[],"media":[],"meta":{"title":"PRD — Plan Review Document","type":"document","tags":["document","prd","plan-provisions","discovery","client-signed"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# PRD — Plan Review Document\n\nA detailed document comparing the prior provider's plan design to the TransAmerica plan design. Reviewed internally first, then with the client, then signed.\n\n## Overview\n\nThe PRD is one of two main plan specification documents used during onboarding (the other being the [[onboarding-package]]). It details plan provisions — eligibility rules, vesting schedules, contribution sources, and anything special about how the plan is structured.\n\n## DC-Relevant Sections\n\nThe PRD covers a lot of territory. Most sections are for other departments. DC focuses on:\n\n- **Eligibility** — service requirements, hours thresholds, entry dates\n- **Vesting** — vesting schedules by source\n- **Sources** — which sources exist, any frozen sources, any new sources being added\n- **Special strategies** — unusual conversion approaches, frozen fund handling\n\nOther sections (distributions, deferral elections, etc.) belong to other departments and are generally not the DC's concern.\n\n## Authorship\n\nThe **COM creates the PRD** using a standard TA template. It is not provided by the prior record keeper.\n\n## Process\n\n1. COM prepares the PRD from the standard TA template\n2. **Internal review:** DC and relevant teams go over it in an internal meeting\n3. **External review:** COM presents to client in an external meeting\n4. **Client feedback:** Any corrections or requested changes are made\n5. **Client signs** the PRD — this is one of the first things done when the plan begins\n\n> The PRD is signed early — well in advance of liquidation. Do not expect to be waiting on it near conversion time.\n\n## If PRD and P3 Setup Are Inconsistent\n\nIf the DC notices a discrepancy between what the PRD says and what's set up in P3:\n- Alert the **COM** and **Doc Ops**\n- They coordinate the fix\n- DC does not resolve PRD/P3 conflicts unilaterally\n\n## Amendments\n\nThe PRD can be amended after signing, but only in **very special circumstances**. Not a standard occurrence.\n\n## Relationship to Onboarding Package\n\nSome plans use a [[onboarding-package]] instead of a PRD. PEP plans (Pooled Employer Plans) always use onboarding packages. All other plan types use the PRD. The two are mutually exclusive — a plan uses one or the other, not both.\n\n## What Happens After Signing\n\nOnce signed, the PRD serves as the authoritative reference for plan provisions during the entire conversion. It informs:\n- [[base-file]] field selection\n- [[p3]] setup verification (classes, eligibility rules, sources)\n- [[source-mapping]] (which sources to map)\n- [[fund-mapping]] (which funds are active vs. frozen)\n\n\n## See Also\n\n- [[onboarding-package]]\n- [[subpack]]\n- [[dc-onboarding-workflow]]\n- [[plan-classes]]\n- [[source-mapping]]"},{"id":"concepts/prior-carrier-letter","slug":"prior-carrier-letter","rel":"concepts/prior-carrier-letter.md","namespace":"documents","title":"Prior Carrier Letter","summary":"A formal letter authored by the roles/com notifying the prior record keeper that their plan is transitioning to Transamerica. Sent to the plan sponsor and used to notify the prior carrier directly.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["concept","document","com","prior-record-keeper","conversion"],"type":"document","extras":[],"media":[],"meta":{"title":"Prior Carrier Letter","type":"document","tags":["concept","document","com","prior-record-keeper","conversion"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# Prior Carrier Letter\n\nA formal letter authored by the [[roles/com]] notifying the prior record keeper that their plan is transitioning to Transamerica. Sent to the plan sponsor and used to notify the prior carrier directly.\n\n## Definition\n\nOnce the conversion is underway, the COM creates a letter addressed to the prior record keeper formally announcing the plan transition. The letter is first sent to the plan sponsor (client) and the prior carrier is notified as part of this process.\n\nA **Successor Trustee Letter** may also be created if specifically requested — this is a separate, related document covering trustee transition.\n\n## Why It Matters\n\nFormal notification to the prior carrier is a required step in the transition. Without it, the prior carrier may not initiate document transfers, blackout setup, or liquidation coordination. This letter is one of the earliest touchpoints with the prior RK.\n\n## Workflow\n\n1. COM creates the prior carrier letter\n2. COM sends to plan sponsor (client) for awareness\n3. Prior carrier is notified (directly)\n4. Successor Trustee Letter created separately if requested (via letter request to Plan Services cc)\n\n## Related Concepts\n\n- [[prior-record-keeper]] — the outgoing administrator who receives this letter\n- [[blackout-notice]] — related document; blackout dates coordinated with prior carrier\n\n## See Also\n\n- [[roles/com]]\n- [[prior-record-keeper]]\n- [[blackout-notice]]\n- [[plan-conversion-handoffs]]"},{"id":"concepts/prior-record-keeper","slug":"prior-record-keeper","rel":"concepts/prior-record-keeper.md","namespace":"processes","title":"Prior Record Keeper","summary":"The outgoing retirement plan administrator from whom TransAmerica is taking over the plan. A critical external relationship that must be established early.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["prior-record-keeper","vendor","liquidation","test-files","coordination"],"type":"process","extras":[],"media":[],"meta":{"title":"Prior Record Keeper","type":"process","tags":["prior-record-keeper","vendor","liquidation","test-files","coordination"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# Prior Record Keeper\r\n\r\nThe outgoing retirement plan administrator from whom TransAmerica is taking over the plan. A critical external relationship that must be established early.\r\n\r\n## Overview\r\n\r\nThe prior record keeper (prior RK) holds all current participant data, balances, and investment positions. They will:\r\n- Provide test files to the DC for validation\r\n- Provide final files after liquidation\r\n- Execute the liquidation or transfer of assets on liquidation day\r\n- Receive and act on wire instructions\r\n\r\nThis relationship must be initiated early in the workflow. Delays in establishing contact = delays in everything downstream.\r\n\r\n## Not Applicable For\r\n\r\n- **Startup plans** — no prior record keeper; no conversion of existing assets\r\n- Verify plan type before looking for a prior RK contact\r\n\r\n## Identifying the Prior RK\r\n\r\nThe prior RK contact is known **from the moment the plan is received**. DC doesn't need to research or discover it — it comes with the assignment.\r\n\r\n## Relationship Ownership\r\n\r\nThe prior RK relationship is **shared across the whole team** — DC, COM, TC, and others all interact with them as needed. It's not DC-exclusive.\r\n\r\n## Initial Outreach\r\n\r\nAs soon as the plan is in the DC's queue:\r\n1. Make initial contact — introduce the DC and the project\r\n2. Send the **questionnaire** via the \"hello email\" — there is a **standard questionnaire template** included\r\n3. Begin coordinating on test file and data delivery timelines\r\n\r\n## Questionnaire Topics\r\n\r\nStandard questions sent to the prior RK:\r\n- **Liquidity issues:** Are any funds frozen, restricted, or otherwise illiquid?\r\n- **Transfer in kind availability:** Which funds can be transferred in kind vs. must be liquidated?\r\n- **Test file delivery:** When can test files be provided? In what format?\r\n- **Final file delivery:** What format will final files be in? When will they be available?\r\n- **Wire coordination:** Who handles wire transfers on their end?\r\n- Any other plan-specific concerns\r\n\r\n## Test Files\r\n\r\nTest files are the prior RK's data files delivered before liquidation for DC to validate. The DC uses them to:\r\n- Verify data format compatibility with EDS layouts\r\n- Run source summaries → identify which sources have money → build [[source-mapping]]\r\n- Check population counts and balance totals\r\n- Set up [[informatica]] CONV file structure in advance\r\n\r\n> Test files are a major milestone. Everything downstream (source mapping, CONV prep) depends on them.\r\n\r\n## Final Files\r\n\r\nFinal files are delivered after liquidation and contain authoritative as-of-liquidation data. See [[final-files-processing]].\r\n\r\n## Wire Instructions\r\n\r\nDC sends wire instructions to prior RK as early as possible. See [[wire-instructions]].\r\n\r\n## Day-Of Communication\r\n\r\nOn liquidation day:\r\n- DC emails prior RK to confirm everything on track (day before)\r\n- DC emails prior RK in the morning to request wire confirmation + fund breakdown\r\n- DC stays in contact until wire is confirmed received by [[cashiering|Cashiering]]\r\n\r\n## Unresponsive Prior RKs\r\n\r\nThis happens a lot. The approach: **keep pushing**. There's no special escalation — persistence is the tool.\r\n\r\n## Common Prior RK Workflows\r\n\r\nDC has built custom workflows for the most common prior record keepers (e.g., Fidelity, Vanguard, Empower). These workflows exist in the main DC folder and are being tuned — will be documented here once finalized.\r\n\r\n## See Also\r\n\r\n- [[wire-instructions]]\r\n- [[source-mapping]]\r\n- [[toa]]\r\n- [[liquidation-day]]\r\n- [[final-files-processing]]\r\n- [[dc-onboarding-workflow]]"},{"id":"entities/prod-support","slug":"prod-support","rel":"entities/prod-support.md","namespace":"departments","title":"Prod Support","summary":"The team that makes direct database table modifications when something goes wrong or needs correction. Engaged via AWD (All Working Data) ticket.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["team","prod-support","awd","tables","corrections"],"type":"department","extras":[],"media":[],"meta":{"title":"Prod Support","type":"department","tags":["team","prod-support","awd","tables","corrections"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# Prod Support\r\n\r\nThe team that makes direct database table modifications when something goes wrong or needs correction. Engaged via AWD (All Working Data) ticket.\r\n\r\n## Overview\r\n\r\nProd Support handles back-end database corrections that DCs cannot perform themselves. When a file is imported incorrectly, data needs to be deleted or changed, or a table value needs to be adjusted, the DC submits an AWD ticket and Prod Support makes the change.\r\n\r\n## What They Do\r\n\r\n- Modify table entries\r\n- Delete incorrect records\r\n- Change field values in the database\r\n- Handle any kind of data correction that can't be done through standard DC tools\r\n\r\n## When to Engage\r\n\r\n- Incorrect file import (wrong data loaded into the system)\r\n- Data needs to be deleted or adjusted after posting\r\n- Any table-level change that cannot be made via P3 or the ROC tool\r\n\r\n## How to Submit an AWD Ticket\r\n\r\nLog into the **AWD site** (web portal). The submission flow:\r\n\r\n1. **Create Work** — select \"Create Work\" to open a new ticket\r\n2. **Enter case number** and **ticket type**\r\n3. **Enter Comments** — this is where the isolating query and description go\r\n4. **Send** — ticket goes to Prod Support's queue\r\n\r\nProd Support responds back to your queue with comments or a completion confirmation. Review it, verify the fix, then close.\r\n\r\n### Best Practices for the Comments Field\r\n\r\nThe quality of the ticket determines how fast and accurately Prod Support resolves it.\r\n\r\n**Step 1 — Isolate the data first.** Run a query in AQT that returns **exactly** the records that need to be changed. Do not reference the whole table.\r\n\r\n> \"Get the actual query that holds exactly the data that you want to be modified. Don't do the entire table, the whole gigantic thing.\"\r\n\r\n**Step 2 — Write a thorough description.** Include:\r\n- What happened and what needs to be done\r\n- The isolating query (paste it in)\r\n- The action needed: delete / modify / update a specific value\r\n- All relevant identifiers (case number, SSN, plan name, ref number, etc.)\r\n\r\n> \"Get a thorough description in your comment and make sure that it's all out there so they don't have to go back and forth.\"\r\n\r\nThorough tickets = fewer back-and-forth exchanges = faster resolution.\r\n\r\n**Step 3 — Verify when done.** Once Prod Support marks the ticket done, go verify in the system. Run the isolating query again and confirm results look right.\r\n\r\n**Step 4 — Close it.** Set to **Complete**, clear from your queue.\r\n\r\n## Turnaround Times\r\n\r\n- **Standard tickets:** 1–2 business days\r\n- **Urgent tickets (e.g., liquidation day):** Same day — flag as urgent when submitting\r\n\r\n## See Also\r\n\r\n- [[p3]]\r\n- [[eds]]\r\n- [[final-files-processing]]\r\n- [[dc-onboarding-workflow]]"},{"id":"concepts/project-plan-com","slug":"project-plan-com","rel":"concepts/project-plan-com.md","namespace":"documents","title":"Project Plan (COM)","summary":"The master conversion tracker created by the roles/com at the start of every plan onboarding. It is uploaded to nbi and sent to the full conversion team.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["concept","document","com","project-management","conversion"],"type":"document","extras":[],"media":[],"meta":{"title":"Project Plan (COM)","type":"document","tags":["concept","document","com","project-management","conversion"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# Project Plan (COM)\n\nThe master conversion tracker created by the [[roles/com]] at the start of every plan onboarding. It is uploaded to [[nbi]] and sent to the full conversion team.\n\n## Definition\n\nAfter receiving the [[concepts/nsa]], one of the COM's first deliverables is the Project Plan — a structured file tracking milestones, owners, and timing for the entire conversion. Two format variants exist depending on plan type:\n\n- **Non-PEP:** \"New Active Project Plan\" — standard format\n- **PEP:** \"Excelwise PEP\" — PEP-specific format\n\nBoth variants are uploaded to NBI and distributed to the conversion team (DC, TC, QA, Doc Ops, and any other assigned roles).\n\n## Why It Matters\n\nThe project plan is the COM's primary coordination tool. It gives all teams a shared view of where the conversion stands and what is coming next. The DC's equivalent overview is the [[dc-onboarding-workflow]] checklist in NBI; the project plan is the COM's version of that shared timeline.\n\n## Evidence / Examples\n\n- The COM main checklist includes: \"Project Plan uploaded to NBI\" and \"Project Plan sent to conversion team\" as mandatory steps in the Initial Setup phase.\n- Two separate checklist items confirm the PEP vs. non-PEP format split.\n\n## Open Questions\n\n- Exact format/template of the non-PEP project plan (Excel? SharePoint? Shared drive?)\n- Whether the project plan is updated throughout the conversion or created once at kickoff\n\n## Related Concepts\n\n- [[concepts/nsa]] — receipt of NSA triggers project plan creation\n- [[dc-onboarding-workflow]] — DC's equivalent phase checklist\n- [[nbi]] — repository where project plan is uploaded\n\n## See Also\n\n- [[roles/com]]\n- [[nbi]]\n- [[concepts/nsa]]"},{"id":"roles/qa","slug":"qa","rel":"roles/qa.md","namespace":"roles","title":"Quality Assurance (QA)","summary":"Audits conversion data, setup, defaults, participant records, and financial-risk items so the plan can go live without silent setup errors.","updated":"2026-05-13","created":"2026-04-14","sources":2,"status":"current","tags":["role","qa","qc","validation","conversion","audit"],"type":"role","extras":[],"media":[],"meta":{"title":"Quality Assurance (QA)","type":"role","tags":["role","qa","qc","validation","conversion","audit"],"created":"2026-04-14","updated":"2026-05-13","sources":2,"status":"current"},"markdown":"# Quality Assurance (QA)\n\nAudits conversion data, setup, defaults, participant records, and financial-risk items so the plan can go live without silent setup errors.\n\n## What This Role Does\n\nQA/QC is the conversion control partner. The role validates the accuracy of conversion records and participant assets, reviews mapping and setup decisions, checks default allocations and default deferrals, supports participant website testing, reviews statement-related work, and helps catch financial-risk issues in recordkeeping setup.\n\nThe earlier wiki page captured QA mostly from the DC perspective: mapping approval, eligibility clearance, and audit pack review. [[tc-stuff]] adds the setup-control view: QC also checks TC's recordkeeping audit, works with TC on statements and website testing, loads or supports target-date/default setup, and documents findings for TC/DC.\n\n## Systems They Use\n\n| System / Artifact | How QA/QC Uses It |\n|---|---|\n| [[p3]] | Reviews recordkeeping setup, defaults, participant data, loans, divisions, and participant access behavior. |\n| [[aqt]] | Supports ad hoc reporting and validation when query-based evidence is needed. |\n| [[wx]] / DDOL | Supports test participant website audits and participant-facing access validation. |\n| Audit Control Checklists | Documents signoff and evidence for system and conversion controls. |\n| Conversion Summary / CSR | Provides or supports go-live summary information. |\n\n## Key People\n\n| Name | Notes |\n|---|---|\n| **Paul** | QA/QC team member; last name unknown. |\n| **Danny** | QA/QC team member; last name unknown. |\n\n## Who They Work With\n\n| Team | Nature of Relationship |\n|---|---|\n| [[tc]] | Quality-checks TC system audit items, supports DDOL/PSD testing, statements, enrollment kits, and go-live controls. |\n| [[roles/lm-dc]] | Reviews imported data, mapping, census details, duplicate SSNs, conversion records/assets, and source/fund setup impacts. |\n| [[roles/com]] | Provides audit/CSR information that COM may route to the client at go-live. |\n| [[prod-support]] | May support system corrections, loan PoG setup, participant notes, or special service setup. |\n\n## Key Handoffs\n\n**Comes in:**\n- Conversion records/assets and audit evidence from DC.\n- TC system setup package, DDOL/VRU/PSD readiness, statements, and participant website test needs.\n- Conversion strategy, QDIA/default setup, and plan-specific provisions.\n\n**Goes out:**\n- Audit findings and corrections.\n- Mapping and default validation.\n- Loan analysis and participant-note setup support.\n- Website/statement audit feedback.\n- CSR or go-live quality summary support.\n\n## What Other Teams Should Know\n\n- QA/QC is not only a final reviewer. They participate in control design during setup, especially where financial risk or participant-facing errors can appear.\n- QC review is strongest when they know the conversion strategy early: QDIA, default allocation, default deferral, loans, divisions, duplicate SSNs, and statement handling.\n- TC and QA/QC are paired but not interchangeable. TC prepares/administers; QA/QC validates and documents risk.\n- If participant test IDs, enrollment kits, statement audits, or default setup are late, QA/QC has less room to catch problems before access is turned on.\n\n## Open Questions\n\n- Should the wiki standardize the page title as QA or QC for this role?\n- What are Paul and Danny's last names and current responsibilities?\n- Which QC checklist is current for system audit, participant website audit, and go-live?\n- Which tasks listed in the legacy source have moved to other teams?\n\n## See Also\n\n- [[tc-stuff]]\n- [[tc]]\n- [[go-live-checklist]]\n- [[audit-pack]]\n- [[source-mapping]]\n- [[fund-mapping]]\n- [[eligibility-and-deferrals]]\n- [[plan-conversion-handoffs]]"},{"id":"concepts/rdd-form","slug":"rdd-form","rel":"concepts/rdd-form.md","namespace":"documents","title":"RDD Form","summary":"A payroll-related form that originates with tc, is routed through the client by the roles/com, and submitted back to TC upon completion.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["concept","document","com","tc","payroll"],"type":"document","extras":[],"media":[],"meta":{"title":"RDD Form","type":"document","tags":["concept","document","com","tc","payroll"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# RDD Form\n\nA payroll-related form that originates with [[tc]], is routed through the client by the [[roles/com]], and submitted back to TC upon completion.\n\n## Definition\n\nThe RDD Form is a TC-authored document that must be completed by the client as part of payroll setup. The COM acts as the routing intermediary — receiving the form from TC, sending it to the client, following up for completion, and submitting the completed form back to TC.\n\n\"RDD\" acronym meaning is not yet confirmed.\n\n## Workflow\n\n1. TC creates and provides RDD Form to COM\n2. COM sends RDD Form to client for completion\n3. Client completes form and returns it to COM\n4. COM submits completed form to TC\n\n## Why It Matters\n\nThe RDD Form is part of the payroll setup process and depends on a functioning COM ↔ TC ↔ client loop. If the client is slow to return it, payroll setup can be delayed. COM must track this handoff actively.\n\n## Open Questions\n\n- What \"RDD\" stands for\n- What the form actually captures (a payroll configuration, direct deposit setup, or something else)\n- Whether RDD is required for all plans or only specific payroll configurations\n\n## Related Concepts\n\n- [[contribution-monitoring-form]] — related payroll form also routed by COM through TC\n- [[tc]] — originates the RDD form and receives the completed version\n\n## See Also\n\n- [[roles/com]]\n- [[tc]]\n- [[contribution-monitoring-form]]"},{"id":"concepts/reversal-process","slug":"reversal-process","rel":"concepts/reversal-process.md","namespace":"processes","title":"Reversal Process","summary":"This page has been folded into the current Reversal Process page.","updated":"2026-06-25","created":"2026-04-15","sources":1,"status":"superseded","tags":["reversal","awd","process","correction","transactions"],"type":"process","extras":[],"media":[],"meta":{"title":"Reversal Process","type":"process","tags":["reversal","awd","process","correction","transactions"],"created":"2026-04-15","updated":"2026-06-25","sources":1,"status":"superseded"},"markdown":"# Reversal Process\n\nThis page has been folded into the current Reversal Process page.\n\nCanonical page: [[processes/reversal-submission|Reversal Process]]\n\nUse the process page as the current operating reference for:\n- submitting the Reversal Form\n- copying the automated email block\n- creating the AWD reversal ticket\n- approval levels\n- field-level reversal details\n- failure modes\n\n## Canonical Page\n\n[[processes/reversal-submission|Reversal Process]]"},{"id":"processes/reversal-submission","slug":"reversal-submission","rel":"processes/reversal-submission.md","namespace":"processes","title":"Reversal Process","summary":"How to reverse an erroneous transaction in p3. Both a Reversal Form submission and a Reversal AWD ticket are required — in that order.","updated":"2026-06-25","created":"2026-04-16","sources":1,"status":"current","tags":["process","reversal","awd","correction","prod-support"],"type":"process","extras":[],"media":[],"meta":{"title":"Reversal Process","type":"process","tags":["process","reversal","awd","correction","prod-support"],"created":"2026-04-16","updated":"2026-06-25","sources":1,"status":"current"},"markdown":"# Reversal Process\r\n\r\nHow to reverse an erroneous transaction in [[p3]]. Both a Reversal Form submission and a Reversal AWD ticket are required — in that order.\r\n\r\n## Overview\r\n\r\nA reversal corrects a transaction that was processed in error. The current process (effective **March 6, 2026**) replaces the legacy Plan Correction Checklist with a **Reversal Form**. The form generates an automated email whose contents must be pasted into the AWD ticket. Both steps are mandatory and sequential.\r\n\r\n## Trigger\r\n\r\nAny of the following, once confirmed as an error:\r\n- Booking error (see [[booking-assets]]).\r\n- Day of Wire processing error (see [[liquidation-day]]).\r\n- Loan processing error (e.g., loans re-amortized when they should have been reloaded, or vice versa).\r\n- Any transaction posted in error that cannot be backed out by ordinary correction tools.\r\n\r\n**Before submitting:**\r\n- Closed funds must be addressed.\r\n- Funds needing to be returned, stopped, or voided must be handled.\r\n\r\n## Steps\r\n\r\n### 1. Submit the Reversal Form — DC\r\nNavigate to the Reversal Form (link maintained in DC team resources). Complete all fields:\r\n\r\n| Field | Notes |\r\n|-------|-------|\r\n| CSD screen info | Loan case number / affiliate, plan name, participant name or \"Multiple\" |\r\n| Total reversal amount | Drives approval level |\r\n| Final approval level | See Approval Levels below |\r\n| Transaction type | Loan, remit, etc. |\r\n| Trans ref number(s) | Of the transactions being reversed |\r\n| SSN(s) | Of the affected transactions |\r\n| Responsible party | Transamerica or external |\r\n| Confirmation checkboxes | Funds returned/stopped/voided, AWD ticket to follow |\r\n\r\nClick **Submit**.\n\nThe form captures the core transaction and control data the reversal team needs:\n- what is being reversed, including transaction type, transaction reference number, and loan number if applicable\n- who is responsible: Transamerica or an external party\n- what happened and what correction is needed\n- whether reprocessing is recordkeeping-only with no payment issued\n- whether payments were applied and whether a loan was re-amortized, deemed, or offset\n- whether voice / DDOL, closed funds, current-year correction, prior-year correction, or Reverse IC applies\r\n\r\n### 2. Copy the Automated Email — DC\r\nAn email arrives from `slasrever@transamerica.com`. Near the bottom, locate the block labeled **\"Information for reversal team\"**.\r\n\r\n**Copy the entire block.** It must be pasted verbatim into the AWD ticket comments.\r\n\r\n### 3. Open the Reversal AWD Ticket — DC\r\nThe AWD ticket is still required — the form alone does not initiate the reversal. Open the ticket using the transaction type (e.g., \"Loan\" for loan reversals).\r\n\r\n### 4. Paste the Email Block into AWD Comments — DC\r\nPaste the copied \"Information for reversal team\" block into the ticket comments. This is what the reversal team works from.\r\n\r\n### 5. Attach Supporting Documents — DC\r\nAny documentation needed to evidence the error (screenshots, earlier tickets, email threads). Submit the ticket.\r\n\r\n### 6. Reversal Team Works the Ticket — Prod Support\r\n[[prod-support]] executes the database corrections via AWD. The DC's part is done after submission; downstream processing is unchanged from the old workflow.\r\n\r\n## Approval Levels\r\n\r\n| Total Reversal Amount | Approval Required |\r\n|----------------------|-------------------|\r\n| Up to $50,000 | Standard |\r\n| $50,000 – $150,000 | Manager |\r\n| Over $150,000 | Higher — confirm with manager |\r\n\r\n## Handoff Points\r\n\r\n| # | From → To | What Moves | Risk |\r\n|---|-----------|------------|------|\r\n| 1 | DC → Reversal Form system | Structured form data | Missing fields → form cannot generate email block |\r\n| 2 | Reversal Form → DC inbox | Automated email with paste block | Email missed → AWD ticket lacks the block, reversal team rejects |\r\n| 3 | DC → AWD | Reversal ticket with pasted block + attachments | Form submitted but no AWD ticket → reversal never executed |\r\n| 4 | AWD → [[prod-support]] | Ticket + context | Standard AWD flow from here |\r\n\r\n## Timing / Deadlines\r\n\r\n- **Form before ticket.** The automated email is required input for the ticket.\r\n- **Same-day submission recommended** once the error is confirmed — every day the error sits in the books complicates downstream processing.\r\n- **Prior closed-fund and returned-fund steps must be complete** before submission.\r\n\r\n## Failure Modes\r\n\r\n- **Filling out the old Plan Correction Checklist.** Retired as of 03/06/26. Reversal team will not accept it.\r\n- **Submitting AWD ticket without the form.** No structured paste block → ticket rejected.\r\n- **Submitting the form without the AWD ticket.** Form alone does not execute the reversal.\r\n- **Copying only part of the email block.** Reversal team needs the full block — partial text breaks their downstream parsing.\r\n- **Missing approval tier.** Amount crossing a tier boundary without higher-tier sign-off stalls the ticket.\r\n- **Voice / DDOL, closed funds, or re-amortized loans not flagged.** The form has explicit checkboxes for these — skipping them creates hidden correction debt.\r\n\r\n## What Has Not Changed\r\n\r\n- AWD ticket is still required.\r\n- Closed funds must be addressed before proceeding.\r\n- Returned / stopped / voided fund handling still precedes submission.\r\n- The reversal team's downstream process is unchanged.\r\n\r\n## Evidence / Examples\r\n\r\nMarch 9, 2026 example — loan reload error:\r\n- Responsible party: Transamerica.\r\n- Issue: ticket requested loans be re-amortized; DC reloaded them instead.\r\n- Resolution: reverse loans and payments. Loans were not re-amortized and had no payments applied.\r\n- Approval: Manager level (total ≈ $49,822).\r\n\r\n## See Also\r\n\r\n- [[prod-support]]\r\n- [[liquidation-day]]\r\n- [[booking-assets]]\n- [[final-files-processing]]\n- [[dc-onboarding-workflow]]\n- [[roles/lm-dc]]\n- [[plan-conversion-handoffs]]"},{"id":"entities/rich-lippoth","slug":"rich-lippoth","rel":"entities/rich-lippoth.md","namespace":"people","title":"Rich Lippoth","summary":"Go-to contact for incoming share activity and regular fund trades — particularly time-sensitive Vanguard trade approvals.","updated":"2026-04-16","created":"2026-04-16","sources":1,"status":"current","tags":["person","trading","vanguard","fund-management"],"type":"person","extras":[],"media":[],"meta":{"title":"Rich Lippoth","type":"person","tags":["person","trading","vanguard","fund-management"],"created":"2026-04-16","updated":"2026-04-16","sources":1,"status":"current"},"markdown":"# Rich Lippoth\n\nGo-to contact for incoming share activity and regular fund trades — particularly time-sensitive Vanguard trade approvals.\n\n## Overview\n\nRich Lippoth is the primary contact when trades need to be approved or coordinated beyond normal processing windows. His involvement is most commonly triggered during participant balance posting when Vanguard funds are involved and the FMC deadline has already passed.\n\n## Key Facts\n\n- **Primary function:** Approves fund trades — especially incoming shares and regular trade activity\n- **Vanguard deadline:** If Vanguard funds are on the Fund Management Calendar and the 2:00 PM EST update deadline is missed, Rich must approve via email (followed up by IM or phone) before trades can proceed\n- **Scope:** Not limited to Vanguard — go-to for incoming shares and regular trade situations broadly\n\n## Role in Conversions\n\nRich is engaged during the participant balance posting phase when:\n1. Vanguard funds are involved and the FMC wasn't updated by 2:00 PM EST\n2. Any trade-related issue requires approval beyond the standard cutoff window\n\nStandard flow: Email Rich → follow up by IM or phone.\n\n## Connections\n\n- [[fund-management-calendar]] — the FMC is where his involvement is most commonly triggered\n- [[informatica]] — Balance Module output generates the FMC estimate that may require his approval\n- [[liquidation-day]] — trade timing context\n\n## Open Questions\n\n- Rich's full title and team are not yet documented.\n\n## See Also\n\n- [[fund-management-calendar]]\n- [[liquidation-day]]\n- [[informatica]]"},{"id":"entities/scott-vrba","slug":"scott-vrba","rel":"entities/scott-vrba.md","namespace":"people","title":"Scott Vrba","summary":"Subject matter expert (SME) for plan eligibility processing at Transamerica.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["person","eligibility","sme"],"type":"person","extras":[],"media":[],"meta":{"title":"Scott Vrba","type":"person","tags":["person","eligibility","sme"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# Scott Vrba\n\nSubject matter expert (SME) for plan eligibility processing at Transamerica.\n\n## Overview\n\nScott Vrba is the primary go-to resource for complex eligibility questions. When standard class/service eligibility patterns don't cover the situation — unusual rule configurations, edge cases in P3 eligibility setup, or anything outside normal patterns — Scott is the person to contact.\n\n## Key Facts\n\n- **Role:** Eligibility SME\n- **Domain:** Plan eligibility rules, P3 eligibility configuration, edge cases\n- **Contact type:** Internal resource — engage when eligibility questions go beyond standard patterns\n\n## When to Go to Scott\n\n- Complex class-based eligibility rules that don't fit standard patterns\n- Unusual service requirement configurations\n- Eligibility date / entry date logic that isn't straightforward\n- Any eligibility setup question that isn't answered by the [[prd]] or [[onboarding-package]]\n- Verification of unusual eligibility outcomes after processing\n\n## Open Questions\n\n- What team/department is Scott in?\n- What is his full title?\n\n## See Also\n\n- [[eligibility]]\n- [[eligibility-and-deferrals]]\n- [[plan-classes]]\n- [[prd]]"},{"id":"concepts/source-mapping","slug":"source-mapping","rel":"concepts/source-mapping.md","namespace":"documents","title":"Source Mapping","summary":"The process of mapping prior record keeper contribution source codes to TransAmerica source IDs. Required for all conversions that carry over source-level data.","updated":"2026-05-03","created":"2026-04-14","sources":3,"status":"current","tags":["mapping","sources","aqt","test-files","conversion"],"type":"document","extras":[],"media":[{"id":"fig-1","caption":"Source mapping table — prior vendor source codes mapped to TA Source IDs with test-file totals.","src":"SS/Source Mapping.jpg","type":"diagram"}],"meta":{"title":"Source Mapping","type":"document","tags":["mapping","sources","aqt","test-files","conversion"],"created":"2026-04-14","updated":"2026-05-03","sources":3,"status":"current"},"markdown":"# Source Mapping\r\n\r\nThe process of mapping prior record keeper contribution source codes to TransAmerica source IDs. Required for all conversions that carry over source-level data.\r\n\r\n## Overview\r\n\r\nEvery retirement plan has contribution sources (e.g., employee deferrals, employer match, profit sharing, etc.). The prior record keeper uses their own source codes; TransAmerica has its own source IDs. Source mapping creates the translation table between them.\r\n\r\nOnly map sources that actually have money — sourced from test file summaries. Mapping empty sources wastes everyone's time.\r\n\r\n## When to Do It\r\n\r\n**As soon as test files arrive from the prior record keeper.** Unlike [[fund-mapping]], source mapping requires test files because you need to know which sources actually have balances.\r\n\r\n> Get source mapping done ASAP after test files arrive. This is a blocking dependency for QA and TC to do their part. Don't sit on it.\r\n\r\n## Test Files vs. Final Files\r\n\r\nSource mapping is finalized in two passes:\r\n\r\n1. **Test files** — first pass. Map every source that has a balance on the test file. Don't bother with empty sources.\r\n2. **Final files** — confirm every test-file source is still present and add any **new** sources that appear. Late-arriving sources need to be added immediately so the balance import doesn't fail on an unmapped source.\r\n\r\nSources that show up only on final files are common — get them in fast, re-route through QA/TC/COM for sign-off, and move on.\r\n\r\n## Process\r\n\r\n1. Test files received from prior record keeper\r\n2. DC runs **source summaries** on the test files — produces totals by source code\r\n3. DC filters: only sources with money (non-zero totals)\r\n4. DC queries **AQT** (internal database tool) to pull TransAmerica **Source IDs** for each source type\r\n5. DC builds source mapping table: prior vendor source code + description + TA source ID + totals\r\n6. DC sends mapping to COM, TC, QA for approval\r\n7. Approvals received → source mapping complete\r\n\r\n## Mapping Table Structure\r\n\r\n| Field | Source |\r\n|-------|--------|\r\n| Prior vendor source code | Test file |\r\n| Prior vendor source description/name | Test file |\r\n| TA Source ID | AQT query |\r\n| Total balance | Test file summary |\r\n\r\n![Source mapping table — prior vendor source codes mapped to TA Source IDs with test-file totals.](SS/Source Mapping.jpg)\r\n\r\n## AQT\r\n\r\n[[aqt]] is the internal database query tool used to pull source IDs. It is a **standalone app** — not integrated into P3 or EDS. The DC runs a query to retrieve TA source IDs for each prior vendor source type.\r\n\r\nThe specific AQT query for source IDs is too complex to document here — it will be documented separately with all DC queries.\r\n\r\n## Relationship to Fund Mapping\r\n\r\n| | Fund Mapping | Source Mapping |\r\n|--|-------------|----------------|\r\n| Maps | Investment funds | Contribution sources |\r\n| Requires test files | No | Yes |\r\n| Source of data | TOA | Test file summaries + AQT |\r\n| Timing | As soon as TOA signed | As soon as test files arrive |\r\n\r\n## Key Clarifications\r\n\r\n**Typical number of sources:** About 10. Varies widely by plan.\r\n\r\n**No clear TA equivalent for a source?** Map as best as you can. No official process — use judgment.\r\n\r\n**Does approved source mapping get loaded to the system?** No. Same as fund mapping — it's a reference document. Once approved, it's added to the Informatica workflows. Not a system import.\r\n\r\n**Does source mapping apply to both balance and contribution sources?** Yes — both.\r\n\r\n## See Also\r\n\r\n- [[fund-mapping]]\r\n- [[aqt]]\r\n- [[toa]]\r\n- [[prior-record-keeper]]\r\n- [[conversion-types]]\r\n- [[dc-onboarding-workflow]]"},{"id":"processes/source-mapping-tc","slug":"source-mapping-tc","rel":"processes/source-mapping-tc.md","namespace":"processes","title":"Source Mapping TC Procedure","summary":"TC-supported procedure for turning prior-vendor source information into an administratively usable source mapping.","updated":"2026-05-13","created":"2026-05-13","sources":1,"status":"needs-review","tags":["process","source-mapping","tc","dc","conversion"],"type":"process","extras":[],"media":[],"meta":{"title":"Source Mapping TC Procedure","type":"process","tags":["process","source-mapping","tc","dc","conversion"],"created":"2026-05-13","updated":"2026-05-13","sources":1,"status":"needs-review"},"markdown":"# Source Mapping TC Procedure\n\nTC-supported procedure for turning prior-vendor source information into an administratively usable source mapping.\n\n## Overview\n\nThis process shows the division of labor between DC and TC during source mapping. DC identifies source balances and gathers prior-vendor information; TC reviews the source attributes against the prior plan review and fills in administrative details.\n\n> [!warning] Source status\n> Built from legacy TC notes. Use alongside the current [[source-mapping]] page and validate against active workflow.\n\n## Trigger\n\nThe process starts when DC has identified all sources with balances at the current vendor and saved the working spreadsheet in the account folder.\n\n## Steps\n\n1. **Identify sources with balances.** Owner: [[roles/lm-dc]]. DC identifies all sources with balances at the current vendor and saves the information in a spreadsheet.\n2. **Notify TC.** Owner: [[roles/lm-dc]]. DC tells TC the spreadsheet is ready for review.\n3. **Review prior plan source attributes.** Owner: [[tc]]. TC reviews sources against the prior plan review.\n4. **Populate source attributes.** Owner: [[tc]]. TC notes source name to map to, contribution type code, contribution frequency, withdrawal provisions, and vesting.\n5. **Resolve unidentified sources.** Owner: [[tc]] and [[roles/lm-dc]]. If frozen or prior-plan sources are not identified in the prior plan review, TC asks DC to obtain attributes from the prior vendor.\n6. **Complete the spreadsheet.** Owner: [[tc]]. TC updates the spreadsheet with findings.\n7. **Share the completed source mapping.** Owner: [[tc]]. TC shares the completed information with TM/COM.\n\n## Handoff Points\n\n- DC hands source-balance identification to TC.\n- TC hands administrative attributes and completed mapping back into the project channel.\n- Prior vendor may be needed when prior-plan review materials do not identify frozen or legacy sources.\n\n## Timing / Deadlines\n\nSource mapping depends on test/prior-vendor information. Delays here can compress final data loading, participant setup, and audit time.\n\n## Failure Modes\n\n- Frozen sources are not identified and get mapped without verified attributes.\n- Withdrawal provisions or vesting attributes are missing.\n- DC and TC both assume the other owns prior-vendor follow-up.\n- Spreadsheet is completed but not routed back through the project owner.\n\n## See Also\n\n- [[source-mapping]]\n- [[roles/lm-dc]]\n- [[tc]]\n- [[plan-conversion-handoffs]]\n- [[tc-stuff]]"},{"id":"sources/balances-census-loans-brain-dump","slug":"balances-census-loans-brain-dump","rel":"sources/balances-census-loans-brain-dump.md","namespace":"sources","title":"Source: Balances, Census, Loans Brain Dump","summary":"LM-DC voice-memo brain dump captured as a single text file in `new TA Brain/Balances, Census, Loans.txt`. Intended by the author as the \"all, end-all\" reference for census, elections, balance import, fund/source mapping, and loan setup proc","updated":"2026-05-03","created":"2026-05-03","sources":1,"status":"current","tags":["census","elections","balances","cash-conversion","mapping","tik","fund-mapping","source-mapping","loans","dummy-participant","forfeitures","fmc","advanced-employer"],"type":"source","extras":[],"media":[],"meta":{"title":"Source: Balances, Census, Loans Brain Dump","type":"source","tags":["census","elections","balances","cash-conversion","mapping","tik","fund-mapping","source-mapping","loans","dummy-participant","forfeitures","fmc","advanced-employer"],"created":"2026-05-03","updated":"2026-05-03","sources":1,"status":"current"},"markdown":"# Source: Balances, Census, Loans Brain Dump\n\nLM-DC voice-memo brain dump captured as a single text file in `new TA Brain/Balances, Census, Loans.txt`. Intended by the author as the \"all, end-all\" reference for census, elections, balance import, fund/source mapping, and loan setup procedures.\n\n## Summary\n\nLong-form narrative covering the full census-to-balances-to-loans pipeline from the LM-DC perspective. Walks through how the census enters the system (client direct, vendor, or base file), how elections get loaded (mapped or defaulted via EDS), how balances flow on liquidation day for cash / mapping / TIK conversions, the role of the CONV file and the dummy participant, the FMC discipline around any trading event, advanced-employer interest distribution, and the full P3 + Informatica loan setup sequence including HOLB handling.\n\n## Key Claims\n\n- Census arrives via three paths: client direct (limited access file), vendor (rare), or base file (vast majority). Base file becomes possible after PRD/onboarding completion → AWD testing → tailored template → client walkthrough → return.\n- Limited access files exist so participants can update allocations during an open period before blackout; mostly used on cash conversions.\n- Defaulting elections is a single-step EDS load — same layout as map-elections, but Fund Descriptor and Percentage are blank and the default flag is **D** instead of **N**, one row per participant. Best done at the same time as census, not as a separate pass.\n- Forfeiture entries in balance files use the vendor's name convention (often year-based) and the same stand-out date convention as the dummy participant: DOB **12/25/1955**, DOH **12/25/1985**.\n- Election population reconciliation should be explicit: \"150 participants, 140 elections, 10 defaulted = 150\" — never inferred.\n- Wire instructions are sent first thing and re-sent ~1 week before liquidation as a confirmation reset.\n- Wire confirmation has two paths: cashiering's email, OR the DC searches ref numbers in P2 themselves and matches the amount.\n- For cash conversions, wire goes to the **Advanced Employer (AE)** account; AE accrues a small interest while waiting for final files. After AE is liquidated and balances post, **the next day** the accrued interest is taken and applied **pro-rata to participants** as a small bonus. This is DC-triggered, as are dividends, uncashed checks, and any other extra cash that lands after conversion.\n- Source mapping starts with whatever sources have balances on test files; finalized against final files; any new source on final files needs to be added immediately.\n- Fund mapping is built from the TOA. ~1 in 25 mapping plans involves a **fund split** (one prior fund maps to two TA funds with a ratio like 50/50 or 75/25). Sometimes prior fund codes on the actual files don't match the TOA — show your work.\n- CONV file is the Informatica Day-of-Wire input. **Re-Reg = Y** for TIK funds, **N** for mapping. Cash conversions don't use a CONV file.\n- For cash-conversion CIT balance workflow: parameter file has cash-conv = **Y**, and the **AE liquidation ref number** must be created and attached to the parameter file.\n- For mapping CIT balance workflow: parameter file cash-conv = **N**; the ref number lives in the **fund mapping file** (workflow finds it there) and is matched against participant balances.\n- Dummy participant (SSN 999-00-0000) is required for mapping conversions. After participant balances post, reverse via P3 → ROC → \"ROC No Reversal\".\n- TIK share-count tolerance: tiny variance is OK; **anything more than one share** must be escalated.\n- FMC must capture any trading event for the conversion — for cash conversions that's the AE purchase, the AE liquidation, AND the subsequent fund purchases. Interest distributions and trailing dividends do **not** require FMC entries.\n- Loans are set up in P3 first: Conversions dropdown → Add Record Keeper (Name only) → Conversions tab → New Conversion → enter case number, No Affiliate → set Conversion Date and Assign Date to effective date − 3 months → save → capture Conversion Number.\n- Loan import file has two parts: Loan Header (one row per loan) and Loan Source (one row per source per loan). **Outstanding balance in Loan Header must equal Loan Source totals exactly.**\n- Loan Informatica workflow has a test mode: run with test = Y first; if clean, flip to test = N for production.\n- Loan upload in P3: Conversions dropdown → Existing Plan → search by case number or conversion number → Takeover Loans → Submit. If **HOLB** (Highest Outstanding Loan Balance) file exists, upload it; if not, click **Upload and Create**.\n- Loan Header file feeds into the audit pack for QA.\n\n## Key Quotes\n\n- \"We don't process unless it's in good order.\"\n- \"It's okay to have an entry on the FMC and have trades NOT go out
