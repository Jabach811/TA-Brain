ub_Pack_Raw_CCCS.txt`. Full section breakdown is in [[sources/subpack-cccs]].\n\n## Related Concepts\n\n- [[subpack]] — the full submission package of which the CCCS is Part 1\n- [[conversion-types]] — asset transfer strategy selected in the CCCS\n- [[ftp-connection]] — payroll FTP setup decided at CCCS stage\n- [[eligibility]] — services enabled in the CCCS drive eligibility rules\n- [[deferrals]] — auto-enrollment settings in the CCCS affect deferral processing\n\n## See Also\n- [[subpack]]\n- [[sources/subpack-cccs]]\n- [[conversion-types]]\n- [[ftp-connection]]\n- [[eligibility]]\n- [[eds]]"},{"id":"concepts/census-data","slug":"census-data","rel":"concepts/census-data.md","namespace":"reference","title":"Census Data","summary":"Information gathering and loading of all active and terminated participants (within the last two years) into the system at the start of a plan conversion.","updated":"2026-05-03","created":"2026-04-20","sources":2,"status":"current","tags":["eds","census","process","data","conversion"],"type":"reference","extras":[],"media":[],"meta":{"title":"Census Data","type":"reference","tags":["eds","census","process","data","conversion"],"created":"2026-04-20","updated":"2026-05-03","sources":2,"status":"current"},"markdown":"# Census Data\r\n\r\nInformation gathering and loading of all active and terminated participants (within the last two years) into the system at the start of a plan conversion.\r\n\r\n## Definition\r\n\r\nCensus data is the participant-level data set that seeds a new plan in P3. It includes all active employees and terminated employees with activity within the last two years. The DC receives this data from the client (or the prior record keeper in certain cases), validates it through EDS, and loads it using the **Address Standard** and **Enrollments** data types.\r\n\r\n## Why It Matters\r\n\r\nWithout census data loaded, the system has no participants. Every subsequent step — eligibility, deferrals, payroll testing, go-live — depends on accurate participant records in P3. Errors in census data (wrong DOB, duplicate SSNs, mismatched hire/rehire dates) propagate through every downstream process.\r\n\r\n## Three Input Paths\r\n\r\nCensus data reaches the DC through one of three paths:\r\n\r\n| Path | Frequency | Notes |\r\n|------|-----------|-------|\r\n| **Base file** (from client) | Vast majority | Standard TA template; client fills it out and returns. See [[base-file]]. |\r\n| **Limited access file** (from client) | Cash conversions with an open period before blackout | Lets participants update allocations themselves before liquidation. See [[limited-access-file]]. |\r\n| **Vendor census** (from prior RK) | Rare | Used when the client requests it, or when a termed participant has an incoming balance. Notify client, COM, TC before loading. |\r\n\r\n## Pre-Base-File Chain\r\n\r\nBefore the base file can be finalized, a chain of upstream work has to complete:\r\n\r\n1. **PRD or onboarding package complete** — plan provisions locked. See [[prd]] / [[onboarding-package]].\r\n2. **AWD testing** — the package goes to [[awd]] for testing; results come back in a couple of days. AWD returns term reason codes (if applicable) and verification of testing/eligibility.\r\n3. **Tailor templates** — DC takes the standard base + payroll templates and tailors them to this plan's specific provisions and sources.\r\n4. **Client walkthrough meeting** — once the client contact is identified, schedule a meeting to walk through how to fill out the file. This step matters more than it looks; some clients are not text/data-savvy and need significant hand-holding. Give them ~10 days from the meeting.\r\n5. **Validation and load** — file returns, validate through EDS, load.\r\n\r\n## Data Fields\r\n\r\n| Field | Notes |\r\n|-------|-------|\r\n| SSN | Primary key — duplicate SSNs must be reported to TC |\r\n| First name | |\r\n| Last name | |\r\n| Date of birth | EDS warning if DOB differs from another plan; forward warning report to TC |\r\n| Date of hire | Must not match Date of Rehire |\r\n| Date of term | Only request if DOH and DOR do not both already exist without it |\r\n| Date of rehire | Must differ from Date of Hire |\r\n| Gender | |\r\n| Marital status | |\r\n| Payroll frequency | |\r\n| Address information | Foreign addresses: forward to TC for handling and system updates |\r\n\r\n## Process\r\n\r\n1. Client provides **test files** and **live files**\r\n2. Run all files through EDS using **Validate Only** — never skip this step\r\n3. Review all errors and warnings in EDS output\r\n4. Communicate issues to the client, COM, and TC depending on error type\r\n5. Reconcile test files against live files when live is received — review participant count and class codes (new hires may appear in live that weren't in test)\r\n6. Load using data types: **Address Standard** and **Enrollments**\r\n\r\n## Audit and Edit Checks\r\n\r\n- **One row per employee** — hard requirement\r\n- Verify participant count in file matches count loaded into the system\r\n- If loading class codes, ensure all participants have a class code in the system\r\n- If loading divisions, ensure all participants have a division in the system\r\n- Participants on another plan with a different DOB appear on EDS warning report — provide to TC\r\n- **Date of Hire must not match Date of Rehire** — if they match, request original DOH from client\r\n- Foreign addresses → TC\r\n- Duplicate SSNs → report to TC\r\n\r\n## Vendor Census Data\r\n\r\nIn some cases, vendor (prior RK) census data is used instead of client-provided data:\r\n\r\n- Client explicitly requests vendor data\r\n- A terminated participant has a balance coming over from the prior record keeper\r\n\r\nWhen using vendor data:\r\n1. Enroll participant using prior RK data\r\n2. **Notify client, COM, and TC prior to loading**\r\n\r\n## Adding Participants from Balance Files\r\n\r\nSometimes the balance file contains participants the client never put on the census. When that happens:\r\n\r\n- Reach out to the **client** to get the demographic details, even if the vendor file already has them\r\n- Vendor records can be stale — never assume they're current\r\n- Don't load until the client confirms; missing or wrong census data on a participant who has a balance is a clean-up nightmare later\r\n\r\nThis is also the moment to handle [[forfeiture-loading|forfeiture entries]] that show up in balance files — those get loaded as census-shaped records using the dummy date convention.\r\n\r\n## Queries\r\n\r\n- `TO Census.sql` — referenced query for census verification (exact path in source documentation)\r\n\r\n## Rules and Notes\r\n\r\n- Client test files may be used to load employees into the system\r\n- If DOH and DOR both exist with no Date of Term, do not request Date of Term\r\n- Always reconcile test files against live files when live is received\r\n- Specific error codes and resolutions not yet documented\r\n\r\n## Related Concepts\r\n\r\n- [[base-file]] — the census template DC sends to the client to collect this data\r\n- [[processes/eligibility-loading|loading-eligibility-eds]] — eligibility is loaded after census is in the system\r\n- [[loading-basis-eds]] — basis loaded during final files processing\r\n- [[prior-record-keeper]] — source of vendor census data when applicable\r\n- [[eds]] — the system used to validate and load census data\r\n\r\n## See Also\r\n\r\n- [[base-file]]\r\n- [[limited-access-file]]\r\n- [[defaulting-elections-eds]]\r\n- [[forfeiture-loading]]\r\n- [[eds]]\r\n- [[awd]]\r\n- [[prior-record-keeper]]\r\n- [[final-files-processing]]\r\n- [[processes/eligibility-loading|loading-eligibility-eds]]\r\n- [[loading-basis-eds]]"},{"id":"concepts/common-remitter-plans","slug":"common-remitter-plans","rel":"concepts/common-remitter-plans.md","namespace":"reference","title":"Common Remitter Plans","summary":"Plans coded as \"common remitter\" in P3 use a different Day of Wire processing flow than standard plans — the standard Pre-Process option is not available in the Remit Action dropdown, and a Verify Batch process must be used instead.","updated":"2026-04-15","created":"2026-04-15","sources":1,"status":"current","tags":["remitter","day-of-wire","p3","processing","conversion"],"type":"reference","extras":[],"media":[],"meta":{"title":"Common Remitter Plans","type":"reference","tags":["remitter","day-of-wire","p3","processing","conversion"],"created":"2026-04-15","updated":"2026-04-15","sources":1,"status":"current"},"markdown":"# Common Remitter Plans\n\nPlans coded as \"common remitter\" in P3 use a different Day of Wire processing flow than standard plans — the standard Pre-Process option is not available in the Remit Action dropdown, and a Verify Batch process must be used instead.\n\n## Definition\n\nA \"common remitter\" plan is a plan configuration in P3 that affects how remittances are processed. The standard **Pre-Process** option in the Remit Action column of the Remittance screen is absent for these plans. If a DC does not know a plan is a common remitter, they will encounter this missing option on Day of Wire and may not know what to do.\n\n## Why It Matters\n\nOn liquidation day, every trans ref number must be taken off hold and processed before trading can proceed. For common remitter plans, the standard workflow does not apply. Using the wrong flow will cause processing to stall or fail.\n\n## Day of Wire Process for Common Remitter Plans\n\n### Step 1 — Identify that standard Pre-Process is absent\nWhen opening the Remittance screen in P3 and reviewing the **Remit Action** column dropdown, if the **Pre-Process** option does not appear, the plan is likely coded as common remitter.\n\n### Step 2 — Use \"Verify Batch After Funding\"\nFor each Day of Wire trans ref:\n1. Select **\"Verify Batch After Funding\"** from the Remit Action dropdown\n2. Click **Submit** at the bottom of the screen\n\n### Step 3 — Wait for results\nAfter submitting:\n1. Wait a short period\n2. Click the **\"Verify Batch Results\"** link at the bottom of the page (next to Submit)\n3. If the full list of trans refs does not appear yet, wait a few more minutes and click again\n\n### Step 4 — Set NO HOLD + Process Immediate\nOnce the full list of Day of Wire trans refs appears:\n1. For each trans ref: select **NO HOLD** under the \"Processing Status\" column\n2. Check the box under the **\"Process Immediate\"** column\n3. Do this for all Day of Wire trans refs, then click **Submit**\n\n### Step 5 — Proceed normally\nAfter submission, continue with the normal det_rem SQL verification process as with any standard Day of Wire.\n\n## Evidence / Examples\n\nFrom the DC Training Notebook (November 19, 2025):\n\n> \"When processing Day of Wire assets on plans coded as 'common remitter' the Remittance screen in P3 will not have the standard Pre-Process option from the 'Remit Action' column drop down.\"\n\n## Related Concepts\n\n- [[liquidation-day]] — full Day of Wire workflow\n- [[p3]] — the system where this processing occurs\n- [[conversion-types]] — cash, mapping, and TIK distinctions\n\n## See Also\n\n- [[liquidation-day]]\n- [[p3]]\n- [[conversion-types]]\n- [[roles/lm-dc]]\n- [[dc-onboarding-workflow]]"},{"id":"roles/com","slug":"com","rel":"roles/com.md","namespace":"roles","title":"Communications Coordinator (COM)","summary":"The project manager for every retirement plan conversion at Transamerica. The COM owns the full lifecycle from NSA receipt through go-live — running meetings, managing documents, coordinating all internal teams, and serving as the primary c","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["role","com","project-management","conversion","onboarding"],"type":"role","extras":[],"media":[],"meta":{"title":"Communications Coordinator (COM)","type":"role","tags":["role","com","project-management","conversion","onboarding"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# Communications Coordinator (COM)\n\nThe project manager for every retirement plan conversion at Transamerica. The COM owns the full lifecycle from NSA receipt through go-live — running meetings, managing documents, coordinating all internal teams, and serving as the primary client-facing contact.\n\n## What This Role Does\n\nThe COM is not just a meeting scheduler — they are the **document factory, routing hub, and go-live coordinator** for each plan conversion. Every task that crosses team lines runs through COM.\n\n**Phase by phase:**\n\n### 1. Kickoff\n- Receives the [[concepts/nsa]] (New Sale Announcement), which triggers the entire COM workflow\n- Schedules and runs the internal kickoff call with the full project team\n- Schedules and runs the external kickoff call with the client and all parties\n- Creates the [[project-plan-com]] (format depends on plan type: Active Project Plan for non-PEP, Excelwise for PEP)\n- Uploads project plan to [[nbi]]; sends copy to conversion team\n- Sets up weekly internal and external update calls for the duration of the conversion\n- Sends recap emails after every call (internal and external)\n\n### 2. Prior Recordkeeper Coordination\n- Requests prior plan documents from Plan Services; routes them through [[ellen-miller]] to the docs team for review\n- Tracks the document review pipeline through to completion\n- Creates and sends the [[prior-carrier-letter]] to the plan sponsor and notifies the prior carrier directly\n- Creates Successor Trustee Letter if requested\n\n### 3. Letters and Notices\n- Creates all participant-facing communications: [[blackout-notice]], cover letter, mapping notice\n- Receives QDIA Initial Notice and Fee Disclosure from [[tc]]\n- Creates Privacy Notice\n- Manages the plan sponsor review and approval loop for all notices\n- Creates the notice mailing file and routes the notice request through [[ellen-miller]]\n- Coordinates Conversion Newsletter review with [[doc-ops]] (communication consultant function); collects address and email files\n- For non-PEP: creates Transition Communications Checklist and routes to Samantha C.\n\n### 4. Vendor Expense Form (if applicable)\n- Sends [[concepts/vef]] to advisor firm → collects approval → sends to client for signature\n- Submits L&C ticket via SF for setup; collects confirmation\n\n### 5. Pricing Review\n- Completes pricing review during the internal call\n- Emails pricing review template to team\n\n### 6. Payroll\n- Confirms whether payroll functionality (WX V2) is needed\n- Sends payroll specs; runs payroll call with all parties\n- Coordinates test file receipt and pass/fail with DC\n- Notifies [[jen-curtin]] for 360° payroll plans\n- Sends Payroll Questionnaire to client; forwards completed questionnaire to [[roles/lm-dc]]\n- Manages [[contribution-monitoring-form]] (TFS plans): sends to client, receives back, routes to TC for AWD flip, saves to FILESERVE\n- Manages [[rdd-form]]: receives from TC → sends to client → receives back → submits to TC\n\n### 7. Loan Analysis (if applicable)\n- Requests loan information during the client kickoff call\n- Routes loan analysis request to the Quality Consultant (QC)\n\n### 8. Early Access (if applicable)\n- Requests early access file template from [[roles/lm-dc]]\n- Routes template to client for completion; receives and submits back to DC\n- Verifies with DC that early access file has been loaded\n- Notifies [[tc]] to activate early access the day before it starts\n- Sends email to plan when early access is open\n\n### 9. On-Boarding Package — PEP Plans Only\n- Receives OBP from docs team; adds signed [[toa]]; updates package tabs\n- Fills out PEA (plan enrollment document — see Open Questions) and Info Sharing Form\n- Sends OBP, PEA, and Info Sharing Form via [[docusign]] for client signature\n- Receives signed package; saves copies to Documents folder, CIT, and DCGLIB\n- Routes copy to TRSC IM Plan Signed Documents\n\n### 10. TRS Plan Documents — PEP Plans Only\n- Coordinates internal plan doc review, then client review (PRD call)\n- Receives AAA, Secure 2.0 amendment, and SPD from docs team\n- Sends all three to client via [[docusign]] for signature\n- Saves executed documents; emails to TRSC IM Signed Plan Docs\n\n### 11. Sub Pack — Non-PEP Plans\n- Creates [[subpack]] from standard template\n- Distributes to the full internal project team\n- TC reviews during the internal call; TC maintains the subpack after review\n\n### 12. Enrollment Guide\n- Requests enrollment guide from [[tc]]\n- Sends enrollment guide to client\n\n### 13. WX / Plan Sponsor Site\n- Confirms whether plan is set up on [[wx]]\n- If not, emails TC to set up WX access\n\n### 14. Auto Enrollment Review (if applicable)\n- Reviews auto enrollment during the internal call\n- Sends auto enrollment recap email to relevant parties\n\n### 15. Trust Agreement (if applicable)\n- Completes Trust Agreement Request\n- Submits to Plan Services Workflow Team\n\n### 16. Assets Received\n- Receives confirmation from [[roles/lm-dc]] that assets were received and deposited\n- Sends email to plan confirming asset receipt and amount\n\n### 17. Go-Live\n- Participates in internal go-live review (TC typically sets up)\n- Sends go-live email to client\n- Completes Auto Delivery Form (non-PEP)\n- Sends post-go-live email to internal team for final steps\n- Adds plan to Survey Spreadsheet\n- Completes Audit Checklist in [[nbi]]\n- Sends SPD to [[ellen-miller]] for participants (PEP only)\n- Receives [[concepts/csr]] from Quality Consultant; forwards to client\n- Adds NBI Transition out of CIT Date\n- Notifies [[ellen-miller]] that the plan is LIVE\n\n### 18. Final Call Reminders\n- Reminds client that a survey will be sent\n- Introduces Account Manager to client\n- Reviews any open items and payroll reminders\n\n---\n\n## Systems They Use\n\n| System | Purpose |\n|--------|---------|\n| [[nbi]] | Uploads project plan; tracks milestones; completes audit checklist at go-live |\n| [[docusign]] | Sends OBP, PEA, plan documents, and other agreements for e-signature |\n| [[wx]] | Confirms plan sponsor site setup (TC sets up; COM verifies) |\n| SF (Salesforce?) | Confirms plan setup with Ellen; submits VEF L&C tickets |\n| FILESERVE | Stores completed Contribution Monitoring Forms |\n\n## Who They Work With\n\n| Team / Person | Nature of Relationship |\n|---------------|----------------------|\n| [[roles/lm-dc]] | Receives project plan and payroll questionnaire; coordinates early access; receives asset confirmation |\n| [[tc]] | Receives QDIA, fee disclosure, enrollment guide, RDD form; TC reviews subpack; TC flips AWD; TC activates early access; TC sets up WX |\n| [[doc-ops]] | Receives OBP, AAA, Secure 2.0, SPD (PEP plans) |\n| [[ellen-miller]] | Routes prior docs; sends notice mailing requests; confirms SF setup; notifies at go-live; sends SPD |\n| [[jen-curtin]] | Notifies for 360° payroll plans |\n| [[qa]] (Paul / Danny) | Routes loan analysis; receives CSR at go-live |\n| Samantha C. | Sends Transition Communications Checklist (non-PEP); team unknown |\n| [[doc-ops]] (Communication Consultant) | Coordinates newsletter; provides address/email files; internal Doc Ops role |\n| Client | Primary external contact throughout conversion |\n| Prior record keeper | Coordinates plan document requests, blackout dates, carrier letter |\n| Payroll vendor | Sends specs; coordinates test files and questionnaires |\n\n## Key Handoffs\n\n**Comes in:**\n- NSA from sales pipeline → triggers COM workflow\n- Prior plan documents from Plan Services → COM routes to Ellen → docs team\n- QDIA notice, fee disclosure from TC\n- RDD form from TC\n- OBP from docs team (PEP)\n- AAA, Secure 2.0, SPD from docs team (PEP)\n- Enrollment guide from TC\n- Early access file template from DC\n- Asset receipt confirmation from DC\n- CSR from Quality Consultant at go-live\n\n**Goes out:**\n- Project plan → NBI + conversion team\n- Prior carrier letter → plan sponsor + prior carrier\n- Participant notices → plan sponsor (approval) → Ellen Miller (mailing)\n- Payroll questionnaire → client → DC\n- Contribution Monitoring Form → client → TC\n- RDD form → client → TC\n- Early access file → DC\n- OBP, PEA, Info Sharing Form → client via DocuSign (PEP)\n- Plan documents → client via DocuSign → TRSC IM (PEP)\n- Subpack → internal team → TC for maintenance (non-PEP)\n- Go-live email → client\n- CSR → client\n- SPD → Ellen for participants (PEP)\n\n## What Other Teams Should Know\n\n- **COM is the hub.** If something needs to get to the client, it goes through COM. If something needs to get from the client to an internal team, it goes through COM.\n- **COM owns timing.** The project plan and meeting cadence are COM's. If the conversion is running behind, COM is the first to know and the one to escalate.\n- **COM creates the subpack (non-PEP) but doesn't maintain it.** TC takes over after the internal call review. A missing or incomplete subpack means COM created it but never shared it — or never created it at all.\n- **COM's go-live checklist is thorough.** By go-live, COM has touched every team and every document. The NBI audit checklist at go-live is COM's final sign-off.\n- **Two plan-type tracks run in parallel.** PEP plans have OBP/PEA/plan documents workflows that non-PEP plans do not. Non-PEP plans have subpack and Auto Delivery Form workflows that PEP plans do not.\n\n## Open Questions\n\n- **Samantha C.** — receives Transition Communications Checklist for non-PEP plans. Last name and team unknown.\n- **SF** — Salesforce; used for plan setup confirmation and VEF L&C tickets.\n- **FILESERVE** — internal document storage; details unknown.\n- **CIT & DCGLIB** — storage locations for signed OBP copies. Not yet documented.\n- **COM's day-to-day outside of conversions** — checklist covers conversion tasks only. Whether COMs have non-conversion responsibilities (ongoing plan service, etc.) is unknown.\n\n## See Also\n\n- [[roles/lm-dc]]\n- [[tc]]\n- [[doc-ops]]\n- [[plan-conversion-handoffs]]\n- [[subpack]]\n- [[prd]]\n- [[onboarding-package]]\n- [[toa]]\n- [[concepts/nsa]]\n- [[concepts/csr]]\n- [[concepts/vef]]\n- [[contribution-monitoring-form]]\n- [[rdd-form]]\n- [[early-access]]\n- [[project-plan-com]]\n- [[com-main-checklist]]"},{"id":"concepts/contribution-monitoring-form","slug":"contribution-monitoring-form","rel":"concepts/contribution-monitoring-form.md","namespace":"documents","title":"Contribution Monitoring Form","summary":"A payroll setup document used for TFS (Total File Solution?) plans that establishes contribution monitoring. The roles/com manages the full routing workflow; completion requires tc to flip a specific AWD system setting.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["concept","document","com","tc","payroll","tfs"],"type":"document","extras":[],"media":[],"meta":{"title":"Contribution Monitoring Form","type":"document","tags":["concept","document","com","tc","payroll","tfs"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# Contribution Monitoring Form\n\nA payroll setup document used for TFS (Total File Solution?) plans that establishes contribution monitoring. The [[roles/com]] manages the full routing workflow; completion requires [[tc]] to flip a specific AWD system setting.\n\n## Definition\n\nFor plans that require contribution monitoring (tagged \"TFS\" in the COM checklist), the Contribution Monitoring Form is the document that establishes the monitoring configuration. Once completed and returned by the client, the form is stored in FILESERVE and TC is notified to activate the monitoring in the AWD system.\n\n## Workflow\n\n1. COM sends Contribution Monitoring Form to client for completion\n2. Client completes and returns the form\n3. COM emails TC with a specific template (\"Contribution Monitoring - Flip AWD\") to flip the AWD setting to \"Yes\"\n4. TC confirms AWD flip is complete\n5. COM saves the completed form to its folder\n6. COM loads the contribution form to FILESERVE\n\n## Why It Matters\n\nThe AWD flip step is a cross-team dependency that can delay payroll setup if not coordinated promptly. The COM owns the routing but the actual system action lives with TC. If this step is missed, contribution monitoring will not function at go-live.\n\n## Open Questions\n\n- What \"TFS\" stands for — possibly \"Total File Solution\" or similar\n- What AWD tracks (AWD full name: All Working Data — confirmed in DC brain dump)\n- What contribution monitoring actually monitors vs. standard payroll processing\n\n## Related Concepts\n\n- [[rdd-form]] — related TC-managed payroll setup form\n- [[tc]] — executes the AWD flip\n- [[payroll-support]] — OnePayroll Team; handles payroll test validation\n\n## See Also\n\n- [[roles/com]]\n- [[tc]]\n- [[rdd-form]]"},{"id":"concepts/conv-file","slug":"conv-file","rel":"concepts/conv-file.md","namespace":"documents","title":"CONV File","summary":"The input file for the Informatica Day of Wire workflow. Built in advance as a skeleton; fund totals and transfer reference numbers are filled in on liquidation day.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["conv-file","informatica","liquidation","day-of-wire","mapping","tik"],"type":"document","extras":[],"media":[{"id":"fig-1","caption":"CONV file in spreadsheet form — one row per fund, ReReg column drives Informatica behavior.","src":"SS/CONV File.jpg","type":"screenshot"}],"meta":{"title":"CONV File","type":"document","tags":["conv-file","informatica","liquidation","day-of-wire","mapping","tik"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# CONV File\n\nThe input file for the Informatica Day of Wire workflow. Built in advance as a skeleton; fund totals and transfer reference numbers are filled in on liquidation day.\n\n## Overview\n\nThe CONV file is the structured data file that drives the [[informatica]] Day of Wire workflow on liquidation day. It contains one row per fund being transferred, with all information Informatica needs to create the correct transaction records in [[p3]]. The skeleton (fund list, codes, re-reg indicators) is prepared well in advance; only the amounts and ref numbers are added on the day.\n\n## Structure\n\n| Field | Description |\n|-------|-------------|\n| Case Number | Plan case number |\n| Prior Fund Code | Prior vendor's fund identifier |\n| TA Fund Code | TransAmerica fund identifier |\n| Ref Number | Transfer reference number — created in [[p2]] on liquidation day |\n| Amount | Total dollar amount for this fund — filled in from vendor breakdown on liquidation day |\n| ReReg | Y = Transfer In Kind; N = Mapping |\n\n![CONV file in spreadsheet form — one row per fund, ReReg column drives Informatica behavior.](SS/CONV File.jpg)\n\n## ReReg Field Logic\n\n| Value | Meaning | Informatica Behavior |\n|-------|---------|---------------------|\n| N | Fund is being liquidated and mapped | Books to [[dummy-participant]] account; trades go out |\n| Y | Fund is being transferred in kind | Creates placeholder in Bill Remit; no trades |\n\nA single CONV file can contain both Y and N rows — mixed plans (some funds TIK, some mapping) are handled per-fund within the same file.\n\n## Relationship to CIT Balance File\n\n| | CONV File | CIT Balance File |\n|--|-----------|-----------------|\n| Used in | Day of Wire workflow | Participant Balance workflow |\n| Granularity | One row per **fund** | One row per **participant per source per fund** |\n| Built | In advance (skeleton); totals added day-of | From final files after liquidation |\n| Testable | **No** — runs live only | Yes — test run available |\n\n## Preparation Timeline\n\n1. **After fund and source mapping are approved:** Build the CONV file skeleton — fund list, prior and TA codes, re-reg indicators. Leave Amount and Ref Number blank.\n2. **On liquidation day:** Create ref numbers in [[p2]] → fill them in. Receive vendor fund breakdown → fill in Amounts per fund.\n3. **Before running:** Verify all fields are complete and the sum of Amounts matches the wire total confirmed by [[cashiering]].\n\n## Critical Warning\n\n> The Day of Wire workflow **cannot be tested**. Once you import the CONV file and run the workflow, it is live and real. Triple-check every field before importing.\n\nThe only mode available before production is a debug/preview — it is not a full test run.\n\n## Cash Conversion Exception\n\nCash conversions do not use a CONV file. Money goes to the [[advanced-employer]] account directly. The CONV file is only used for mapping and TIK conversions.\n\n## See Also\n\n- [[informatica]]\n- [[liquidation-day]]\n- [[p2]]\n- [[fund-mapping]]\n- [[source-mapping]]\n- [[dummy-participant]]\n- [[processes/tik-transfer|transfer-in-kind]]\n- [[conversion-types]]\n- [[advanced-employer]]"},{"id":"concepts/conversion-types","slug":"conversion-types","rel":"concepts/conversion-types.md","namespace":"reference","title":"Conversion Types","summary":"The three ways a plan's assets can be moved from a prior record keeper to TransAmerica. Conversion type is determined early in discovery and drives nearly every subsequent decision.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["conversion","cash","mapping","transfer-in-kind","core"],"type":"reference","extras":[],"media":[],"meta":{"title":"Conversion Types","type":"reference","tags":["conversion","cash","mapping","transfer-in-kind","core"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# Conversion Types\n\nThe three ways a plan's assets can be moved from a prior record keeper to TransAmerica. Conversion type is determined early in discovery and drives nearly every subsequent decision.\n\n## The Three Types\n\n### 1. Cash Conversion\n\n**What it is:** All assets at the prior record keeper are liquidated (sold) and the resulting cash is wired to TransAmerica. Money is pooled and then distributed to participants based on their current investment elections.\n\n**Key characteristics:**\n- No fund mapping — assets arrive as cash, not as specific funds\n- Participants' money is re-invested based on their current elections\n- TOA will show no \"from → to\" fund mapping\n- Simplest conversion type from a mapping standpoint\n\n**Processing flow:**\n1. Wire arrives → Cashiering confirms + provides ref number\n2. DC verifies wire total matches breakdown\n3. DC moves money to **Advanced Employer account** (temp holding)\n4. Final files arrive → DC liquidates advanced employer → runs CIT balance workflow → posts participant balances\n5. Process mode: **Immediate + Batch** (trades go out to invest the cash)\n6. Reverse dummy participant via ROC tool\n\n---\n\n### 2. Mapping Conversion\n\n**What it is:** Each fund at the prior record keeper is mapped to a specific fund at TransAmerica. Assets are liquidated and re-invested into the mapped destination funds.\n\n**Key characteristics:**\n- Fund mapping is required — defined in [[toa]]\n- All funds liquidated and invested into mapped equivalents\n- More complex than cash; simpler than TIK\n- [[dummy-participant]] (SSN 999-00-00) required in census\n\n**Processing flow:**\n1. Wire arrives → totals match → create trans ref numbers\n2. Fill CONV file (re-reg = N) → run Day of Wire workflow in [[informatica]]\n3. Dummy account receives initial booking; trades go out\n4. Final files arrive → post participant balances\n5. Reverse dummy → process P3: **Online + No Hold** (no new trades — trades already went out)\n\n**Important:** Trades go out during the Day of Wire step. When posting participant balances later, do NOT send trades again. Use Online + No Hold.\n\n---\n\n### 3. Transfer In Kind (TIK / Re-registration)\n\n**What it is:** Specific funds are transferred directly as shares — no liquidation, no re-purchase. Shares are moved from one custodian (prior RK's custodian) to TransAmerica's custodian (Fidelity pooled accounts).\n\n**Key characteristics:**\n- Only applies to specific funds (identified in [[toa]], column T = \"Y\")\n- A plan may have SOME funds TIK and SOME funds mapping/cash\n- No trades occur — shares are physically moved\n- [[matt-oconnell]]'s team must set up Fidelity accounts in advance (~10 business days)\n- Shares are identified by expected amounts (not account numbers)\n\n**Processing flow:**\n1. TOA identifies TIK funds (column T = Y) → DC fills re-registration form → sends to Matt O'Connell\n2. Matt's team sets up Fidelity pooled accounts\n3. Day of Wire: CONV file (re-reg = Y) → creates placeholder in P3 (no details, no trades)\n4. Shares arrive at Fidelity → Matt's team identifies them by expected amounts → pulls into plan\n5. Final files arrive → DC updates share estimates → posts participant balances\n6. Process mode: **Online + No Hold** (no trades — shares already transferred)\n\n---\n\n## Side-by-Side Comparison\n\n| Attribute                 | Cash                  | Mapping         | Transfer In Kind    |\n| ------------------------- | --------------------- | --------------- | ------------------- |\n| Assets liquidated         | Yes                   | Yes             | No                  |\n| Fund mapping required     | No                    | Yes             | Yes (for TIK funds) |\n| TOA fund map              | No                    | Yes             | Yes (column T = Y)  |\n| Trades on Day of Wire     | No (to adv. employer) | Yes (via dummy) | No                  |\n| Trades on balance posting | Yes                   | No              | No                  |\n| Dummy participant needed  | Yes                   | Yes             | No                  |\n| Matt O'Connell involved   | No                    | No              | Yes                 |\n| CONV file re-reg field    | N/A                   | N               | Y                   |\n| Advanced Employer used    | Yes                   | No              | No                  |\n| Fidelity pooled accounts  | No                    | No              | Yes                 |\n\n> A single plan can have a combination: some funds TIK, others mapping, others cash. The CONV file handles this per-fund.\n\n## Determining Conversion Type\n\n- Identified during discovery (PRD/onboarding package review)\n- Confirmed in the [[toa]] (TOA structure reveals the conversion strategy)\n- [[subpack]] should also specify it\n\n## See Also\n\n- [[toa]]\n- [[fund-mapping]]\n- [[liquidation-day]]\n- [[final-files-processing]]\n- [[dummy-participant]]\n- [[processes/tik-transfer|transfer-in-kind]]\n- [[matt-oconnell]]\n- [[informatica]]"},{"id":"concepts/creative-planning-managed-accounts","slug":"creative-planning-managed-accounts","rel":"concepts/creative-planning-managed-accounts.md","namespace":"reference","title":"Creative Planning Managed Accounts","summary":"Plan setup and participant-service pattern for Financial Guide / Creative Planning Managed Accounts.","updated":"2026-05-13","created":"2026-05-13","sources":1,"status":"needs-review","tags":["concept","cpma","financial-guide","managed-advice","p3","plan-setup"],"type":"concept","extras":[],"media":[],"meta":{"title":"Creative Planning Managed Accounts","type":"concept","tags":["concept","cpma","financial-guide","managed-advice","p3","plan-setup"],"created":"2026-05-13","updated":"2026-05-13","sources":1,"status":"needs-review"},"markdown":"# Creative Planning Managed Accounts\n\nPlan setup and participant-service pattern for Financial Guide / Creative Planning Managed Accounts.\n\n## Definition\n\nCreative Planning Managed Accounts (CPMA) is a fee-based managed account service connected to Financial Guide. In setup materials, enabling Financial Guide controls the participant SSO link and related participant communications.\n\n> [!warning] Source status\n> This page is built from legacy setup and case note material. Confirm current CPMA service rules, fee setup, and participant communication requirements before live use.\n\n## Why It Matters\n\nCPMA touches plan setup, fees, funds, participant communications, default allocations, DDOL/VRU access, case notes, and call center routing. It can also conflict with other services, especially OnTrack.\n\n## Evidence / Examples\n\n### Pre-Setup Requirement\n\n- Before P3 setup, the account and contract must exist in Salesforce.\n- The contract should show the CPMA connection.\n- The `services assigned` field should include `3PMA`.\n- Advisor Firm should be Creative Planning, LLC.\n- TRSC IM Asset Allocation Services should confirm the setup.\n\n### Funds Tab\n\n- CPMA uses service-exclusive funds.\n- To add a service-exclusive fund, the SEF indicator is checked when searching by fund descriptor.\n\n### Plan Service Expense Tab\n\n- CPMA requires two fee portions:\n  - Total fee for CPMA.\n  - Portion paid to Creative Planning, LLC.\n- Fees are applied to all funds used for the service.\n- Source fields include `VAC - Creative Planning Managed Accounts`, third-party BPS, total basis points, start date, and blank end date.\n\n### Default Allocation\n\n- For plans using CPMA as default, default allocation type is Financial Guide.\n- Source type uses all employee-directed source groups.\n- Effective date uses the service effective date.\n- QDIA is set to Yes if CPMA is used as QDIA.\n\n### DDOL/VRU\n\n- Financial Guide is enabled or temporarily enabled on the DDOL/VRU tab.\n- Enabling Financial Guide controls the SSO link to the Financial Guide site.\n- OnTrack cannot be turned on with Financial Guide/CPMA; OnTrack access codes should be Not Enabled.\n- IRA handling codes should be Not Enabled.\n- Third Party Referral should be Enabled.\n\n## Related Concepts\n\n- [[case-notes-template]]\n- [[go-live-checklist]]\n- Managed Advice\n- [[p3]]\n- [[wx]]\n\n## See Also\n\n- [[tc-stuff]]\n- [[tc]]\n- [[qa]]"},{"id":"glossary/csr","slug":"csr","rel":"glossary/csr.md","namespace":"glossary","title":"CSR","summary":"**Full Name:** Conversion Summary Report","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["glossary","acronym","com","qa","go-live"],"type":"glossary","extras":[],"media":[],"meta":{"title":"CSR","type":"glossary","tags":["glossary","acronym","com","qa","go-live"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# CSR\n\n**Full Name:** Conversion Summary Report\n\n**Definition:** A post-conversion report produced by the Quality Consultant at go-live. The [[roles/com]] receives it and forwards it to the client as a formal summary of the completed conversion.\n\n**Used By:** Quality Consultant (produces it); COM (routes it to client).\n\n## See Also\n\n- [[concepts/csr]] — concept page with workflow detail\n- [[roles/com]]\n- [[qa]]"},{"id":"concepts/csr","slug":"csr","rel":"concepts/csr.md","namespace":"documents","title":"CSR — Conversion Summary Report","summary":"A post-conversion report provided by the Quality Consultant at go-live. The roles/com receives it and forwards it to the client as part of the go-live close-out process.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["concept","document","com","qa","go-live"],"type":"document","extras":[],"media":[],"meta":{"title":"CSR — Conversion Summary Report","type":"document","tags":["concept","document","com","qa","go-live"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# CSR — Conversion Summary Report\n\nA post-conversion report provided by the Quality Consultant at go-live. The [[roles/com]] receives it and forwards it to the client as part of the go-live close-out process.\n\n## Definition\n\nThe Conversion Summary Report is a Quality Consultant deliverable that summarizes the completed conversion. It arrives at go-live and is routed by the COM to the client, providing an official record of the completed transition.\n\n## Why It Matters\n\nThe CSR is one of the final go-live checklist items for COM. It represents the Quality team's sign-off on the conversion and gives the client a formal summary of what was completed. COM cannot complete the go-live checklist until the CSR is received and forwarded.\n\n## Workflow\n\n1. Quality Consultant produces and sends CSR to COM at go-live\n2. COM forwards CSR to client\n\n## Open Questions\n\n- What the CSR contains (fund mapping summary? asset totals? audit findings?)\n- Whether the CSR is related to the [[audit-pack]] that the DC builds (they may be different documents serving different audiences)\n- Whether the Quality Consultant who provides the CSR is the same as the QC who handles loan analysis earlier in the workflow\n\n## Related Concepts\n\n- [[audit-pack]] — DC-built post-conversion summary; possibly related or complementary\n- [[qa]] — Quality Assurance team; likely the source of the CSR\n\n## See Also\n\n- [[roles/com]]\n- [[qa]]\n- [[audit-pack]]\n- [[glossary/csr]]"},{"id":"entities/dave-shloat","slug":"dave-shloat","rel":"entities/dave-shloat.md","namespace":"people","title":"Dave Shloat","summary":"The team's data systems expert — Alteryx and Informatica authority on the Large Market team.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["person","data","alteryx","informatica","large-market"],"type":"person","extras":[],"media":[],"meta":{"title":"Dave Shloat","type":"person","tags":["person","data","alteryx","informatica","large-market"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# Dave Shloat\r\n\r\nThe team's data systems expert — Alteryx and Informatica authority on the Large Market team.\r\n\r\n## Overview\r\n\r\nDave Shloat is the data guru on the Large Market team. His domain is the data toolchain: [[alteryx]] and [[informatica]] are his territory. If you have a question about how data flows, how a workflow is built, or how to troubleshoot a data processing issue, Dave is the person to ask. He is a deep and accessible resource — a massive pool of knowledge that is genuinely useful to the team.\r\n\r\n## Key Facts\r\n\r\n- **Team:** Large Market\r\n- **Domain expertise:** [[alteryx]] (data blending/transformation) and [[informatica]] (ETL workflows, including Day of Wire and Participant Balance)\r\n- **Contact type:** Direct — go to him with data tool questions\r\n\r\n## Role in Data Operations\r\n\r\nDave is the go-to for anything touching the data infrastructure. For DCs, this is most relevant when working with [[informatica]] workflows (Conv File, Day of Wire, Participant Balance) or any Alteryx-based data processes. He understands how the tools work at a technical level and can diagnose problems that are otherwise opaque.\r\n\r\nHe is a core piece of the team's operational capability — the kind of resource whose knowledge is hard to replace and easy to tap.\r\n\r\n## Open Questions\r\n\r\n- Dave's formal title\r\n- Whether Dave owns specific workflows or advises across all data processes\r\n- Scope of Alteryx usage relative to Informatica in the DC workflow\r\n\r\n## See Also\r\n\r\n- [[informatica]]\r\n- [[roles/lm-dc]]\r\n- [[concepts/dc-onboarding-workflow]]"},{"id":"processes/day-of-wire-audit","slug":"day-of-wire-audit","rel":"processes/day-of-wire-audit.md","namespace":"processes","title":"Day of Wire Audit","summary":"Validation pass for the high-risk checks the DC performs around day-of-wire processing.","updated":"2026-06-25","created":"2026-06-25","sources":2,"status":"needs-review","tags":["process","day-of-wire","audit","validation","balances"],"type":"process","extras":[],"media":[],"meta":{"title":"Day of Wire Audit","type":"process","tags":["process","day-of-wire","audit","validation","balances"],"created":"2026-06-25","updated":"2026-06-25","status":"needs-review","sources":2},"markdown":"# Day of Wire Audit\n\nValidation pass for the high-risk checks the DC performs around day-of-wire processing.\n\n## Overview\n\nThe day-of-wire audit is the control layer around [[liquidation-day]] and balance-import processing. It verifies that the money or shares are ready, the correct reference numbers exist, the right [[informatica]] workflow was run, and the resulting P3 detail is backed up before the process moves forward.\n\nThis page is a working reference built from existing wiki material. It should be tightened against the live DC checklist and query library when those sources are ingested.\n\n## Trigger\n\nUse this audit when a conversion reaches day-of-wire activity for:\n\n- [[balance-import-mapping]]\n- [[balance-import-tik]]\n- [[balance-import-cash]]\n- Any workflow that creates or applies transfer reference numbers on liquidation day\n\n## Audit Checks\n\n### 1. Confirm the Trigger\n\n- Cash or Mapping: confirm [[cashiering]] has booked the wire and provided the transfer reference number.\n- TIK: confirm shares have arrived or are ready to process through the TIK tracker.\n- Do not run the day-of-wire workflow from assumption alone.\n\n### 2. Confirm File Readiness\n\n- Verify the [[conv-file]] has the correct fund rows, amounts, and re-registration indicators.\n- Mapping rows should have `Re-Reg = N`.\n- TIK rows should have `Re-Reg = Y`.\n- Confirm the required [[dummy-participant]] exists for mapping conversions.\n\n### 3. Capture Informatica Evidence\n\n- Run the correct [[informatica]] workflow.\n- Remember that the Day of Wire workflow is production-only and cannot be test-run.\n- Save run output, counts, totals, errors, and any screenshots or logs required for backup.\n\n### 4. Validate P3 Posting Controls\n\n- Confirm the correct P3 processing mode for the conversion type.\n- Mapping: trades already fire on day-of-wire through the dummy participant.\n- TIK: use Online + No Hold later; do not use Process Immediate.\n- Cash: participant balance processing differs from Mapping/TIK and should follow the cash balance-import path.\n\n### 5. Run Balance Backup\n\n- Run the standard balance queries and compare counts, totals, sources, and fund detail.\n- Confirm the transfer reference numbers appear where expected.\n- Save query output with the conversion backup material.\n\n### 6. Hand Off Evidence\n\n- Add the audit evidence to the conversion backup package.\n- Use the output to support the [[audit-pack]] and downstream QA review.\n- Call out any mismatch before final-files processing continues.\n\n## Failure Modes\n\n| Risk | Why It Matters |\n|---|---|\n| Workflow run before wire/share confirmation | Creates live production activity before the trigger is real |\n| Wrong Re-Reg value | Mapping and TIK can process under the wrong transaction behavior |\n| Missing dummy participant | Mapping workflow cannot route the initial trade correctly |\n| Missing ref number evidence | Downstream backup cannot prove what was booked |\n| Incorrect P3 mode | Can create duplicate trades or wrong posting behavior |\n\n## See Also\n\n- [[liquidation-day]]\n- [[balance-import]]\n- [[balance-import-mapping]]\n- [[balance-import-tik]]\n- [[balance-import-cash]]\n- [[conv-file]]\n- [[informatica]]\n- [[p3]]\n- [[cashiering]]\n- [[audit-pack]]\n- [[final-files-processing]]"},{"id":"sources/dc-brain-dump-002","slug":"dc-brain-dump-002","rel":"sources/dc-brain-dump-002.md","namespace":"sources","title":"DC Brain Dump #002 — Payroll, Order of Processing, Loan Quirks, Auto-Enroll","summary":"Voice transcript follow-up to dc-brain-dump-001. Filling gaps and adding context. Original audio recorded by Joel; transcript saved at `new TA Brain/brain dump 2.txt`.","updated":"2026-05-03","created":"2026-05-03","sources":1,"status":"current","tags":["source","brain-dump","payroll","auto-enrollment","loans","sequencing"],"type":"source","extras":[],"media":[],"meta":{"title":"DC Brain Dump #002 — Payroll, Order of Processing, Loan Quirks, Auto-Enroll","type":"source","tags":["source","brain-dump","payroll","auto-enrollment","loans","sequencing"],"created":"2026-05-03","updated":"2026-05-03","status":"current","sources":1},"markdown":"# DC Brain Dump #002\n\nVoice transcript follow-up to [[dc-brain-dump-001]]. Filling gaps and adding context. Original audio recorded by Joel; transcript saved at `new TA Brain/brain dump 2.txt`.\n\n## What's Covered\n\n- The full payroll vendor onboarding flow (intro email through OnePayroll handoff and client demo)\n- The new operating model for the go-live payroll handoff (DC owns the bridge work; still passes off at live date regardless)\n- Order-of-processing rationale post-balance (balances → elections + loans → everything else, because payrolls can resume once those are settled)\n- Loan failure scenarios that come up in practice (frozen plans, refinances close to conversion, detail-vs-source off-by-one-payment)\n- Auto-enrollment depth (kit mail date, escalation stops at TA, default SSN list to client, the \"min or max-minus-one\" default-detection heuristic)\n- Wiki feature request — Tips & Tricks / community Resources section *(held out of ingest; tracked separately)*\n\n## Key Claims\n\n- Payroll vendor file naming convention: `\u003ccase#>_\u003ccontract>_\u003caffiliate>.xls` — timestamp gets appended on receipt for de-dup.\n- After FTP setup, immediately ask the vendor to send a random test file just to verify the connection works before real test files start flowing.\n- OnePayroll's import surfaces end-user-flavored warnings/errors that the internal DC import doesn't show — that's why their second pass is meaningful.\n- Auto-sweep / batch FTP processing isn't enabled until 2–3 good runs are observed.\n- The new model: DC does ALL the validation/bridge work themselves now (mid-market team isn't carrying it). DC still passes off at live date regardless of status.\n- Once balances + elections + loans are settled, payrolls can begin processing even before the plan is technically live. That's why those three are post-balance priorities.\n- Loan failure scenarios from the field: frozen plan with no re-amortization, recent incomplete refinance, detail report missing the last payment (off by ~one principal payment).\n- Auto-escalation does NOT continue at TA. Participants whose deferral was escalating at the prior RK will not auto-escalate post-conversion — they have to opt back in.\n- DC pulls a list of participants who *look* like they're in auto-enroll default (marked default + at min rate or max-minus-one) and sends to client so client can warn them.\n- ADP can't reliably report auto-enrollment dates *(reaffirmed; already documented)*.\n- Kit mail date drives the auto-escalation clock — must be requested as part of historical data.\n\n## Notable Quotes\n\n> \"Payroll really needs a big blowout here.\"\n\n> \"All the files have the case number underscore contract underscore affiliate. And then dot XLS or whatever. Time stamp comes in once the files actually do arrive, so there's never a duplicate.\"\n\n> \"We don't have to hold on to this until the very end, because some of these can go months after the live day. And we don't need to be handcuffed to these plans for that long.\"\n\n> \"The warnings and errors you get are different. The ones that are kind of built for the end user as opposed to an internal one.\"\n\n> \"Once those are done, even when the plan isn't live yet, the payrolls can begin to be getting processed.\"\n\n> \"The detail report was different than the source breakdown, and that's because one of those reports was inaccurate and did not include the last payment. So we're off by what really looked like one.\"\n\n> \"They may think that they're gonna be having their deferral rates escalate up to, say, 10%. But once they start with Transamerica, they will not. The escalation will cease.\"\n\n## Entities Mentioned\n\n- [[jen-curtin]] — head of FTP team; vendor connection setup goes through her team\n- [[ftp-team]]\n- [[payroll-support]] — OnePayroll team; production-level deeper validation\n- ADP — re-mention of auto-enrollment date reporting limitation\n\n## Concepts Mentioned\n\n- [[payroll-template]]\n- [[ftp-connection]]\n- [[payroll-handoff-at-go-live]]\n- [[deferrals]]\n- [[eligibility]]\n- [[final-files-processing]]\n- [[loan-setup]]\n- [[advanced-employer]]\n- [[limited-access-file]]\n\n## See Also\n\n- [[dc-brain-dump-001]]\n- [[payroll-vendor-onboarding]]\n- [[kit-mail-date]]"},{"id":"sources/dc-brain-dump-001","slug":"dc-brain-dump-001","rel":"sources/dc-brain-dump-001.md","namespace":"sources","title":"DC Brain Dump 001 — Full Job Workflow","summary":"Voice transcript brain dump covering the complete end-to-end workflow of a Data Consultant (DC) at TransAmerica, from new plan assignment through final files posting.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["dc","workflow","retirement-plans","onboarding","conversion"],"type":"source","extras":[],"media":[],"meta":{"title":"DC Brain Dump 001 — Full Job Workflow","type":"source","tags":["dc","workflow","retirement-plans","onboarding","conversion"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# DC Brain Dump 001 — Full Job Workflow\r\n\r\nVoice transcript brain dump covering the complete end-to-end workflow of a Data Consultant (DC) at TransAmerica, from new plan assignment through final files posting.\r\n\r\n## Summary\r\n\r\nA DC handles all data-related work for onboarding new retirement plans. The workflow spans from initial assignment through liquidation day and final files posting. Three conversion types — cash, mapping, and transfer in kind — each have distinct processing paths. The DC coordinates with multiple internal teams and external vendors throughout.\r\n\r\n## Key Claims\r\n\r\n- DCs receive plan assignments via NBI, doled out by managers based on caseload and conversion type.\r\n- P3 system setup can happen before or after assignment; earlier is better for specs and details.\r\n- COMs (communications coordinators) manage project timelines and meetings; DCs attend external calls only when data topics are explicitly on the agenda.\r\n- PRDs or Onboarding Packages detail all plan provisions; DCs focus on eligibility, vesting, sources, and special strategies.\r\n- Sub-packs (submission packages) define exactly what TransAmerica will do; supposed to be completed by COMs but are inconsistently done.\r\n- Base files seed the system with participant census data; only include people with balances plus imminent eligibles.\r\n- Payroll templates mirror the base file census section (~75%) plus contribution/payroll details.\r\n- FTP connections for payroll vendors must be requested early due to FTP team's large caseload.\r\n- Prior record keeper contact is established early; questionnaire covers liquidity, TIK, and test file timelines.\r\n- TOA (Transfer of Assets) is the client-signed fund map; column T (re-registering Y/N) determines if TIK applies.\r\n- Fund mapping can be done as soon as TOA is available — no test files needed.\r\n- Source mapping requires test files to identify which sources actually have money.\r\n- Matt O'Connell's team sets up Fidelity accounts for TIK; takes ~10 business days; do NOT start too early (they begin reporting immediately).\r\n- Day-of-wire Informatica workflow cannot be tested; participant balance workflow can be tested.\r\n- Dummy participant (SSN 999-00-00) must exist in census before running day-of-wire for mapping plans.\r\n- Deferrals must be posted before eligibility to prevent auto-enrollment conflicts.\r\n- Eligibility requires internal notification to QA/TC/COM before enabling in P3.\r\n- EDS outputs (warnings/errors) must be carefully reviewed after every file upload.\r\n\r\n## Key Quotes\r\n\r\n> \"A single ingest may touch 10–20 wiki pages. That is expected and correct.\" *(from schema)*\r\n\r\n> \"We don't want to blow out the system with too many unnecessary people.\"\r\n\r\n> \"Too early is bad. As crazy as it sounds in this case here.\" *(re: Matt O'Connell's team timing)*\r\n\r\n> \"We can't test [day of wire], unfortunately. Not yet at least.\"\r\n\r\n> \"Deferrals first, then eligibility.\"\r\n\r\n## Entities Mentioned\r\n\r\n- [[ellen-miller]] — manages plan assignment from NBI side\r\n- [[matt-oconnell]] — leads TIK/re-registration Fidelity account setup\r\n- [[p3]] — main plan administration system\r\n- [[eds]] — file validation and processing system\r\n- [[informatica]] — ETL workflow tool\r\n- [[nbi]] — plan assignment tracking system\r\n-  — DC, COM, Doc Ops, QA, TC, Cashiering, FTP Team, Payroll Support\r\n\r\n## Concepts Mentioned\r\n\r\n- [[dc-onboarding-workflow]] — full end-to-end process\r\n- [[conversion-types]] — cash, mapping, transfer in kind\r\n- [[prd]] — Plan Review Document\r\n- [[onboarding-package]] — alternative to PRD (PEP plans etc.)\r\n- [[subpack]] — Submission Package\r\n- [[toa]] — Transfer of Assets\r\n- [[base-file]] — census seeding template\r\n- [[payroll-template]] — payroll file format\r\n- [[fund-mapping]] — mapping prior funds to TA funds\r\n- [[source-mapping]] — mapping prior sources to TA source IDs\r\n- [[processes/tik-transfer|transfer-in-kind]] — re-registration process\r\n- [[liquidation-day]] — the main event\r\n- [[final-files-processing]] — post-liquidation balance/data posting\r\n- [[eligibility-and-deferrals]] — enabling plan eligibility in P3\r\n- [[wire-instructions]] — sent to prior record keeper\r\n- [[ftp-connection]] — payroll vendor upload setup\r\n- [[prior-record-keeper]] — prior vendor coordination\r\n- [[dummy-participant]] — SSN 999-00-00, required for mapping conversions\r\n- [[plan-classes]] — class types and DC's limited role in managing them\r\n\r\n## Contradictions / Open Questions\r\n\r\n- Sub-pack completion is inconsistent — supposed to be COMs' responsibility but frequently not done. Unclear what current process is.\r\n- Wire instructions: using default P3 account vs. plan-specific account — money arrives either way but routes differently. Low severity but worth clarifying.\r\n- Whether DC/TIK dummy participant reversal logic applies the same way as mapping — needs clarification.\r\n- EDS layout setup timing — needs to be done before test files arrive but exact trigger is unclear.\r\n\r\n## See Also\r\n- [[dc-onboarding-workflow]]\r\n- [[conversion-types]]\r\n- [[liquidation-day]]"},{"id":"concepts/dc-onboarding-workflow","slug":"dc-onboarding-workflow","rel":"concepts/dc-onboarding-workflow.md","namespace":"processes","title":"DC Onboarding Workflow","summary":"The complete end-to-end process a Data Consultant follows to onboard a new retirement plan, from assignment through final posting. This is the master reference page — every step links to a detailed concept page.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["workflow","process","master","conversion","onboarding"],"type":"process","extras":[],"media":[],"meta":{"title":"DC Onboarding Workflow","type":"process","tags":["workflow","process","master","conversion","onboarding"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# DC Onboarding Workflow\r\n\r\nThe complete end-to-end process a Data Consultant follows to onboard a new retirement plan, from assignment through final posting. This is the master reference page — every step links to a detailed concept page.\r\n\r\n## Phase Overview\r\n\r\n| Phase | Name | Key Deliverables |\r\n|-------|------|-----------------|\r\n| 1 | Assignment & Discovery | Plan on DC radar, P3 check, PRD/OB review |\r\n| 2 | Data Setup | Base file, payroll template, EDS layouts |\r\n| 3 | Vendor Coordination | Prior RK contact, payroll vendor, FTP setup |\r\n| 4 | Mapping & Documentation | TOA processing, fund mapping, source mapping |\r\n| 5 | Pre-Liquidation | CONV file prep, Matt O'Connell (TIK), final checks |\r\n| 6 | Liquidation Day | Day-of-wire workflow, money receipt |\r\n| 7 | Final Files & Posting | Balance posting, YTD data, deferrals, eligibility |\r\n\r\n---\r\n\r\n## Phase 1 — Assignment & Discovery\r\n\r\n**Trigger:** [[ellen-miller]] notifies manager → manager assigns to DC → plan tagged in [[nbi]]\r\n\r\n### Steps\r\n- [ ] Confirm plan is assigned in NBI\r\n- [ ] Check if [[p3]] is already set up (may be done early for mergers/some new plans)\r\n- [ ] Note plan type: **new plan**, **merger**, or **startup** (startup = no prior record keeper)\r\n- [ ] Note [[conversion-types|conversion type]]: cash, mapping, or transfer in kind\r\n- [ ] Attend internal kickoff meetings set up by [[roles/com|COM]]\r\n- [ ] Review [[prd]] (Plan Review Document) or [[onboarding-package]] — focus on: eligibility, vesting, sources, classes\r\n- [ ] Review [[subpack]] (Submission Package) if available — details what TA will do\r\n- [ ] Note any frozen sources, new sources, special strategies\r\n\r\n**External meetings:** Optional for DCs unless data topics (base file, payroll) are explicitly on agenda.\r\n\r\n---\r\n\r\n## Phase 2 — Data Setup\r\n\r\n**Prerequisite:** PRD/OB reviewed; plan size and conversion type understood\r\n\r\n### Steps\r\n- [ ] Build the **[[base-file]]** template — tailor to plan's specific fields (YTD comp, hours, eligibility dates, deferrals, sources)\r\n- [ ] Schedule meeting with client to walk through base file template\r\n- [ ] Collect base file from client (iterate until clean)\r\n- [ ] Build the **[[payroll-template]]** — similar to base file + contribution details\r\n- [ ] Share payroll template with client and payroll vendor\r\n- [ ] Set up all **[[eds|EDS]] layouts** early — before files arrive\r\n\r\n---\r\n\r\n## Phase 3 — Vendor Coordination\r\n\r\n**Two parallel tracks:** Prior record keeper + Payroll vendor\r\n\r\n### Prior Record Keeper Track\r\n- [ ] Identify prior RK contact\r\n- [ ] Send questionnaire (liquidity, TIK availability, test file timing)\r\n- [ ] Send [[wire-instructions]] as early as possible (use default account if P3 not set up yet)\r\n- [ ] Request test files\r\n- [ ] Resend updated wire instructions ~1 week before liquidation (once P3 is fully set up)\r\n\r\nSee [[prior-record-keeper]]\r\n\r\n### Payroll Vendor Track\r\n- [ ] Identify payroll upload contact\r\n- [ ] Set up **[[ftp-connection]]** — request from FTP team ASAP (large caseload)\r\n- [ ] Provide FTP credentials to payroll contact\r\n- [ ] Request test payroll file\r\n- [ ] Test file through [[eds|EDS]] — review output\r\n- [ ] Send clean file to [[payroll-support|Payroll Support Team]] for deeper validation\r\n- [ ] Iterate until green light\r\n\r\n> If automation isn't ready, client sends manual payroll files directly in the interim.\r\n\r\n---\r\n\r\n## Phase 4 — Mapping & Documentation\r\n\r\n**Trigger:** TOA (Transfer of Assets) signed by client\r\n\r\n### Steps\r\n- [ ] Review [[toa]] — note column T (re-registering Y/N) for each fund\r\n- [ ] If any fund has re-reg = Y → fill out re-registration form → send to [[matt-oconnell]] (time accordingly — ~10 business days before liquidation)\r\n- [ ] Build **[[fund-mapping]]** template from TOA data — no test files needed\r\n- [ ] Send fund mapping to COM, TC, QA for approval\r\n- [ ] Once test files arrive: run source summaries → identify sources with money\r\n- [ ] Build **[[source-mapping]]** from AQT source ID query + test file source codes\r\n- [ ] Send source mapping to COM, TC, QA for approval\r\n- [ ] Get approvals on both mappings ASAP — do not delay\r\n\r\n---\r\n\r\n## Phase 5 — Pre-Liquidation Prep\r\n\r\n**Timing:** Days to weeks before liquidation date\r\n\r\n### Steps\r\n- [ ] Confirm [[dummy-participant]] (SSN 999-00-0000) exists in census (required for mapping conversions)\r\n- [ ] Build **CONV file** skeleton — structure and fund list ready; totals filled in on liquidation day\r\n- [ ] Update Matt O'Connell's share estimates using test files (for TIK)\r\n- [ ] Day before liquidation: email [[cashiering|Cashiering]] as wire heads-up\r\n- [ ] Day before liquidation: email prior RK to confirm everything on track\r\n\r\nSee [[liquidation-day]] for Day-of detail\r\n\r\n---\r\n\r\n## Phase 6 — Liquidation Day\r\n\r\n**The main event.** Sequence depends on [[conversion-types|conversion type]].\r\n\r\n### All Types\r\n- [ ] Email vendor in the morning for fund breakdown + total\r\n- [ ] Notify Cashiering when vendor confirms wire sent (with expected total)\r\n- [ ] Wait for Cashiering to confirm wire receipt + transfer reference number\r\n\r\n### Cash Conversion\r\n- [ ] Verify wire total matches breakdown total\r\n- [ ] Move money to **Advanced Employer account** (P2/P3)\r\n- [ ] Email all parties confirming wire received + posted to advanced employer\r\n\r\n### Mapping Conversion\r\n- [ ] Verify wire total matches breakdown total\r\n- [ ] Create trans ref numbers in P2/P3 (one per fund)\r\n- [ ] Fill totals into CONV file\r\n- [ ] Verify dummy participant exists in census\r\n- [ ] Run **Day of Wire** workflow in [[informatica]] (cannot test)\r\n- [ ] Verify in P3 — dummy account should have balances; trades out\r\n\r\n### Transfer In Kind\r\n- [ ] Same as mapping but CONV file has re-reg = Y\r\n- [ ] Day of Wire creates placeholders in P3 (no trades, no details yet)\r\n- [ ] Shares will arrive at Fidelity accounts (Matt O'Connell's team processes)\r\n\r\nSee [[liquidation-day]] for full detail\r\n\r\n---\r\n\r\n## Phase 7 — Final Files & Posting\r\n\r\n**Trigger:** Final files received from prior record keeper\r\n\r\n### Steps\r\n- [ ] Update Matt O'Connell's share estimates with final file totals (TIK — time-sensitive, do immediately)\r\n- [ ] Build CIT balance file from final files\r\n- [ ] Test CIT balance workflow in [[informatica]] (can test)\r\n- [ ] Run participant balance workflow\r\n\r\n### Cash Conversion\r\n- [ ] Request Advanced Employer liquidation\r\n- [ ] Run CIT balance workflow\r\n- [ ] Post participant balances (Process Immediate + Batch → trades go out)\r\n- [ ] Reverse dummy participant via ROC tool in P3\r\n\r\n### Mapping Conversion\r\n- [ ] Post participant balances (Online + No Hold → NO trades, books only)\r\n- [ ] Reverse dummy participant via ROC tool in P3\r\n\r\n### Transfer In Kind\r\n- [ ] Post participant balances (Online + No Hold → NO trades)\r\n- [ ] Shares already in place; books fill in Bill Remit detail\r\n\r\n### All Types — Final Data\r\n- [ ] Post **YTD contributions** by source\r\n- [ ] Post **YTD comp** and **prior year comp** if needed\r\n- [ ] Post **hours** (current and prior year) if applicable\r\n- [ ] Post **deferral elections** (post BEFORE eligibility)\r\n- [ ] Notify QA, TC, COM → wait for go-ahead\r\n- [ ] Enable **eligibility** in P3 (per contributing source only)\r\n- [ ] Run all queries and review results\r\n- [ ] Build audit pack\r\n- [ ] Update [[nbi]]\r\n\r\nSee [[final-files-processing]] and [[eligibility-and-deferrals]]\r\n\r\n---\r\n\r\n## Key Rules to Remember\r\n\r\n1. **FTP and prior RK contact → as early as possible.**\r\n2. **Fund mapping → as soon as TOA is signed.**\r\n3. **Source mapping → as soon as test files arrive.**\r\n4. **Matt O'Connell → not too early, not too late. Target: 12 business days before liquidation.**\r\n5. **Deferrals before eligibility — always.**\r\n6. **Day of Wire cannot be tested — triple-check CONV file.**\r\n7. **EDS output must be read after every upload.**\r\n8. **Dummy participant must exist in census before Day of Wire (mapping).**\r\n9. **Process mode: Immediate+Batch for trades; Online+No Hold when no trades.**\r\n\r\n## See Also\r\n\r\n- [[conversion-types]]\r\n- [[liquidation-day]]\r\n- [[final-files-processing]]\r\n- [[base-file]]\r\n- [[toa]]\r\n- [[fund-mapping]]\r\n- [[source-mapping]]\r\n- [[eligibility-and-deferrals]]\r\n- [[p3]]\r\n- [[informatica]]"},{"id":"concepts/defaulting-elections-eds","slug":"defaulting-elections-eds","rel":"concepts/defaulting-elections-eds.md","namespace":"processes","title":"Defaulting Elections via EDS","summary":"The technique for setting a participant's investment elections to the plan default, loaded through EDS as part of (or just after) the census load. Useful for limited-access plans, startup plans, and any plan where every participant comes in","updated":"2026-05-03","created":"2026-05-03","sources":1,"status":"current","tags":["eds","elections","defaults","census","conversion","auto-enrollment"],"type":"process","extras":[],"media":[],"meta":{"title":"Defaulting Elections via EDS","type":"process","tags":["eds","elections","defaults","census","conversion","auto-enrollment"],"created":"2026-05-03","updated":"2026-05-03","sources":1,"status":"current"},"markdown":"# Defaulting Elections via EDS\n\nThe technique for setting a participant's investment elections to the plan default, loaded through EDS as part of (or just after) the census load. Useful for limited-access plans, startup plans, and any plan where every participant comes in defaulted.\n\n## When to Use It\n\n- **Limited-access plans** where most or all participants haven't actively made elections\n- **Startup plans** where every participant comes in fresh with default elections\n- Plans where a known subset of participants needs to be defaulted at conversion (alongside others who have real elections)\n- Cleanup pass when the main map-elections load left a population without elections that need defaults\n\n> **Best practice:** do census load + defaulted elections in a **single pass**, not two. Splitting them into two parts is not recommended.\n\n## Row Layout\n\nSame EDS layout as map-elections, with three differences:\n\n| Field | Map-Elections Value | Default Value |\n|-------|---------------------|---------------|\n| Fund Descriptor | populated | **blank** |\n| Percentage | populated | **blank** |\n| Default flag | **N** | **D** |\n\nOne row per participant being defaulted. That's enough — the system applies the plan's default election rules from there.\n\n## Verifying the Result\n\nOutput is queryable via [[aqt]]. After the load, run a query against the elections table to confirm the defaulted population matches the expected count.\n\n## Reconciliation Discipline\n\nWhen mixing real elections and defaulted elections in the same plan, account for the full population explicitly:\n\n> \"150 participants in the plan. 140 have elections. 10 were defaulted. That's 150. Be explicit. Don't infer.\"\n\nDon't let the defaulted population be implied — call it out in the load summary so QA, COM, and TC can sign off without guessing.\n\n## Relationship to Auto-Enrollment\n\nDefaulting elections via EDS is a **manual, DC-driven** action — distinct from P3's automatic [[eligibility|auto-enrollment]] logic, which fires when [[eligibility]] is enabled and a participant has no election on file. Both can result in defaulted elections, but the EDS path is explicit and happens at conversion time; the auto-enrollment path is rule-driven and fires later.\n\nIf you default participants via EDS, the auto-enrollment logic sees their elections and skips them — which is usually what you want.\n\n## See Also\n\n- [[eds]]\n- [[census-data]]\n- [[deferrals]]\n- [[eligibility]]\n- [[eligibility-and-deferrals]]\n- [[limited-access-file]]\n- [[aqt]]"},{"id":"concepts/deferrals","slug":"deferrals","rel":"concepts/deferrals.md","namespace":"processes","title":"Deferral Processing","summary":"The process of loading participant contribution elections into P3 during the final files phase. More complex and exception-heavy than eligibility. Must be loaded and verified before eligibility is enabled.","updated":"2026-05-03","created":"2026-04-14","sources":4,"status":"current","tags":["deferrals","auto-enrollment","p3","processing","final-files","adp"],"type":"process","extras":[],"media":[],"meta":{"title":"Deferral Processing","type":"process","tags":["deferrals","auto-enrollment","p3","processing","final-files","adp"],"created":"2026-04-14","updated":"2026-05-03","sources":4,"status":"current"},"markdown":"# Deferral Processing\n\nThe process of loading participant contribution elections into P3 during the final files phase. More complex and exception-heavy than [[eligibility]]. Must be loaded and verified before eligibility is enabled.\n\n## Core Rule\n\n> **Deferrals fill the system state. Eligibility triggers system actions.**\n\nDeferrals define what elections are already in place. When eligibility runs, the system reads those elections before deciding whether to auto-enroll. If the state is wrong, the triggered actions will be wrong — and they're harder to unwind than eligibility errors.\n\n## What Deferrals Are\n\nPer-participant, per-source contribution elections:\n- **Deferral rate** — dollar amount or percentage\n- **Auto-enrollment start date (trigger date)** — when auto-enrollment began for each participant enrolled under default settings\n- One election per source the participant contributes to\n\n## Data Sources (Preferred Order)\n\n1. **Client data** — preferred; most accurate for auto-enrollment details\n2. **Vendor data** — acceptable for most elections; unreliable for auto-enroll dates (see ADP note below)\n3. **Payroll data** — sometimes required; especially useful when client payroll systems have current contribution rates\n\nThe client decides which source to use. Confirm this before final files arrive.\n\n## The Auto-Enrollment Problem\n\nThis is the most critical and error-prone part of deferral processing.\n\n### What You Need to Capture\n\nFor every participant who is enrolled under auto-enrollment defaults:\n- Their **current deferral rate**\n- Their **auto-enrollment start date** (the date they were initially defaulted in)\n\n### Why the Start Date Matters\n\nMany plans have **escalation logic** (also called auto-escalation or step-up):\n> Example: \"Automatically increase the deferral rate by 1% each year, up to a cap of 10%.\"\n\nTo apply escalation correctly, P3 needs to know when auto-enrollment began. Without the start date, the system can't calculate how many escalation steps have already occurred, and participants may end up at the wrong rate.\n\nThe specific date the system uses is the **[[kit-mail-date]]** — the date the auto-enrollment welcome kit was mailed to the participant. That's what drives the escalation clock. Request it as part of the historical data pull.\n\n### Auto-Escalation Stops at TA\n\nThis is a participant-experience gotcha worth knowing up front:\n\n> **TransAmerica does NOT auto-escalate.** Plans escalating at the prior record keeper will *not* continue escalating after conversion. If a participant wants their rate to keep going up, they have to opt back in themselves.\n\nA participant who was on a 1%-per-year step-up at the prior RK, expecting to land at 10% over time, will sit at their current rate forever post-conversion unless they manually change it.\n\n### Default-Participant SSN List to Client\n\nTo get ahead of complaints, the DC pulls the list of participants who *look* like they're in auto-enroll default and sends it to the client so the client can warn those participants directly.\n\nThe heuristic for \"looks like they're in default\":\n- Marked default in the deferral data, AND\n- Currently sitting at the **min rate** (likely never escalated) OR at **max minus one** (likely about to escalate one more time)\n\nThat's the population most likely to expect an escalation that won't come. Send the list to the client — they communicate to participants who actually care. Most won't even realize the difference, but the few who do have a legitimate gripe if they aren't told.\n\n> *\"There's a very, very low chance that any of them even will know what the hell you're talking about. And even lower chance that people who do know would even care... but if there's that one person who's expecting it and don't get it, well, then he's got a very good gripe. So we do it the right way. We always do it the right way.\"*\n\n### The ADP Problem\n\n> **ADP does NOT reliably provide auto-enrollment dates.**\n\nIf the prior record keeper is ADP, you cannot trust their data to include accurate auto-enrollment start dates. The only reliable source is the **client**.\n\n**What to do when ADP is the prior RK:**\n1. Identify all participants who are in the auto-enrollment default\n2. Request the auto-enrollment start dates from the **client** directly\n3. If the client cannot provide them: assume those participants are **NOT in auto-enrollment default** (conservative assumption — avoids incorrect escalation)\n4. Identify the impacted participants\n5. **Notify the client** so they can communicate the correct election to their participants manually\n\nThis is a known limitation. Don't wait on ADP to provide it — go to the client first.\n\n## Workflow\n\n1. **Load deferrals FIRST** — before any eligibility action\n2. **Identify auto-enrollment participants** — flag them separately\n3. **Capture deferral rate and auto-enroll start date** for each auto-enrolled participant\n4. **Handle ADP or missing start dates** per the process above\n5. **Load through [[eds]]** — check output for warnings/errors\n6. **Post to [[p3]]** and verify\n7. **Ensure all elections and auto-enroll data is correct** before proceeding\n8. **THEN proceed to [[eligibility]]** — only after deferrals are verified clean\n\n## What Can Go Wrong\n\n| Issue | Consequence | Recoverability |\n|-------|-------------|----------------|\n| Load eligibility before deferrals | Auto-enrollment fires and overwrites elections | Painful reversal — possible but messy |\n| Missing auto-enroll start dates | Escalation logic runs incorrectly; wrong rates over time | Requires correction and client communication |\n| Wrong deferral rates from vendor | Participants have incorrect elections in the new system | Discovered at next payroll; requires correction |\n| ADP auto-enroll date trusted | Incorrect or missing start dates propagate | Go to client, not ADP |\n\n> **Deferral errors are harder to unwind than eligibility errors. Prioritize accuracy upfront.**\n\n## Characteristics\n\n- **Data-driven and exception-heavy** — each plan has its own auto-enrollment rules, escalation logic, and vendor limitations\n- More complex than [[eligibility]] in practice\n- The difficulty is not the mechanics (loading through EDS is standard) — it's getting the right data, especially auto-enrollment dates\n\n## See Also\n\n- [[eligibility]] — must run after deferrals\n- [[eligibility-and-deferrals]] — overview of the relationship and sequence\n- [[kit-mail-date]] — the date that drives auto-escalation\n- [[final-files-processing]] — broader final files context\n- [[p3]] — where deferrals are posted\n- [[eds]] — how the deferral file is validated and loaded\n- [[prior-record-keeper]] — source of vendor data (including ADP limitations)\n- [[dc-onboarding-workflow]]"},{"id":"concepts/divisions-and-affiliates","slug":"divisions-and-affiliates","rel":"concepts/divisions-and-affiliates.md","namespace":"reference","title":"Divisions and Affiliates","summary":"Plan setup pattern for division tracking, divisional reporting, and multi-affiliate plan administration.","updated":"2026-05-13","created":"2026-05-13","sources":1,"status":"needs-review","tags":["concept","divisions","affiliates","p3","psd","participant-experience"],"type":"concept","extras":[],"media":[],"meta":{"title":"Divisions and Affiliates","type":"concept","tags":["concept","divisions","affiliates","p3","psd","participant-experience"],"created":"2026-05-13","updated":"2026-05-13","sources":1,"status":"needs-review"},"markdown":"# Divisions and Affiliates\n\nPlan setup pattern for division tracking, divisional reporting, and multi-affiliate plan administration.\n\n## Definition\n\nDivisions identify participant groups inside a plan. Affiliates can create separate accounts or related plan structures that affect participant experience, payroll, loans, distributions, reporting, and web access.\n\n## Why It Matters\n\nDivisions and
