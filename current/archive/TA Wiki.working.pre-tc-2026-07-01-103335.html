aption":"Loan loading diagram — P3 setup, loan header/source validation, Informatica test and production runs, Takeover Loans, HOLB handling, confirmation email, AQT verification, and audit evidence.","src":"diagrams/loan-loading-detail.png","type":"diagram"},{"id":"fig-2","caption":"Adding the prior record keeper — Name field only, all other fields left blank.","src":"SS/Loans_Prior Vendor Entry.jpg","type":"screenshot"},{"id":"fig-3","caption":"Conversions list after the prior record keeper is saved — confirms the entry before moving to the Conversion tab.","src":"SS/Loans_After Prior Vendor.jpg","type":"screenshot"},{"id":"fig-4","caption":"Generated Conversion Number on the saved record — copy this; it's referenced in every later step.","src":"SS/Loans_Conversion Number.png","type":"screenshot"},{"id":"fig-5","caption":"P3 → Conversions → Existing Plan — the entry point for Takeover Loans.","src":"SS/Loans_Existing Conversion.jpg","type":"screenshot"}],"meta":{"title":"Loan Setup & Processing","type":"process","tags":["loans","p3","informatica","conversion","takeover-loans","holb"],"created":"2026-04-18","updated":"2026-05-05","sources":4,"status":"current"},"markdown":"# Loan Setup & Processing\r\n\r\nHow a plan's outstanding participant loans move from a prior record keeper into P3 — a 14-step workflow across two systems (P3 + Informatica) and three phases (setup, validation, takeover).\r\n\r\n## Overview\r\n\r\nWhen a plan converts to Transamerica with active loans, the loans must be re-created on P3 with their full repayment state intact: outstanding balance, source allocations, NPER (remaining periods), and any deemed status. The process is **strictly ordered**. P3 setup must complete before validation; validation must pass before Informatica runs; Informatica must succeed before Takeover Loans is submitted; Takeover Loans must finish before confirmation queries run.\r\n\r\nThe most common failure point is **Step 8 — Header = Source validation**. If the loan file's outstanding balance does not match the source totals exactly, every downstream system will compound the variance and the load will have to be reversed.\r\n\r\n![Loan loading diagram — P3 setup, loan header/source validation, Informatica test and production runs, Takeover Loans, HOLB handling, confirmation email, AQT verification, and audit evidence.](diagrams/loan-loading-detail.png)\n\n## Why It Matters\n\r\nA converting plan often arrives with hundreds of active loans, each with its own outstanding balance, source allocations, and remaining repayment schedule. Because every later step assumes loan setup is correct, a small mistake at setup compounds:\r\n\r\n- **Source balances** include outstanding loan principal — if loan principal is wrong, source balances are wrong.\r\n- **Loan repayment processing** depends on correct NPER (remaining periods) — incorrect setup causes participants to over- or under-pay.\r\n- **Deemed loan tax reporting** depends on the Deemed Date / Deemed Amount fields being correctly populated at setup.\r\n- **Takeover Loans is a one-shot system action** — reversing it requires manual intervention from the Loan team.\r\n\r\nThis is why discipline at Steps 3, 8, and 9 matters more than the rest combined.\r\n\r\n## Trigger\r\n\r\nA plan in conversion has loans on its [[toa]] (or signed loan section), the loan import file has been received from the prior record keeper, and the [[roles/lm-dc]] is ready to set up the conversion in P3.\r\n\r\n## Steps\r\n\r\n### Phase I · Setup in P3 (blue)\r\n\r\n#### 1. Open P3 and navigate to the plan — DC\r\nPull up the plan record by name or case number. Confirm with the client that the **effective date** is locked. The loan import file should be saved and accessible. Note up front whether the file contains **deemed loans** — that decides which Step 9 path applies.\r\n\r\n#### 2. Top-right dropdown → Conversions — DC\r\nFrom the plan record, open the top-right dropdown and choose **Conversions**. This opens the conversions management area for this plan.\r\n\r\n#### 3. Add Record Keeper — Name only — DC\r\nClick **Add Record Keeper**. Enter the **Name field only** — leave address, contact, and other fields blank. Click **Apply**, then **Save**. Filling extra fields here causes downstream lookup mismatches in the Informatica Loan Module (the prior vendor name must match `censuslookupfile.xls` exactly — see [[informatica-loan-module]]).\r\n\r\n![Adding the prior record keeper — Name field only, all other fields left blank.](SS/Loans_Prior Vendor Entry.jpg)\r\n\r\n![Conversions list after the prior record keeper is saved — confirms the entry before moving to the Conversion tab.](SS/Loans_After Prior Vendor.jpg)\r\n\r\n#### 4. Conversion tab → New Conversion — DC\r\nFrom the Conversions area, open the **Conversion** tab and click **New Conversion**. This creates the conversion record that every later step writes to.\r\n\r\n#### 5. Enter case number — No Affiliate — Press Enter — DC\r\nType the case number, choose **No Affiliate** from the affiliate dropdown, and press **Enter**. A new record screen loads with the date fields ready to complete.\r\n\r\n#### 6. Enter conversion / assign / effective dates — DC\r\nThree date fields. Two are derived from the effective date:\r\n- **Conversion Date** = effective date − 3 months\r\n- **Assign Date** = effective date − 3 months (same as Conversion Date)\r\n- **Effective Date** = the actual plan effective date\r\n\r\n#### 7. Conversion number generated — note it — DC\r\nSave the record. P3 generates a **Conversion Number** (CV-yyyy-####). Record it — every subsequent step (Informatica parameter file, Takeover Loans submit, confirmation queries) needs it.\r\n\r\n![Generated Conversion Number on the saved record — copy this; it's referenced in every later step.](SS/Loans_Conversion Number.png)\r\n\r\n### Phase II · File Validation & Informatica Load (yellow)\r\n\r\n#### 8. Confirm Loan Header balance = Loan Source totals — DC ⚠ critical\r\n**This is the most important step in the process.** The outstanding balance in the **Loan Header** record must match the total on the **Loan Source** record **exactly** — to the cent. Any variance, however small, must be reconciled before proceeding.\r\n\r\nValidation checklist:\r\n- Outstanding balance in Loan Header = total on Loan Source exactly\r\n- All loan records reviewed for completeness\r\n- Participant IDs in the loan file match participant records in P3\r\n\r\nIf totals do not match, contact the prior record keeper for a corrected file before going further.\r\n\r\n#### 9. Check Deemed Date & Deemed Amount fields — DC\r\nTwo fields with non-obvious blank-vs-zero rules:\r\n- **Deemed Date** — leave **blank** if there is no deemed date.\r\n- **Deemed Amount** — enter `0` if there is none. **Never leave blank.** A blank Deemed Amount throws an Informatica import error.\r\n\r\nIf the file contains deemed loans, every deemed record must have both fields populated with the actual deemed date and a non-zero deemed amount.\r\n\r\n#### 10. Run Informatica Load — DC\r\nProcess the loan file through the [[informatica-loan-module]] using the recorded Conversion Number and the prior record keeper Name from Step 3. Pre-flight checklist:\r\n- Header balance = Source total confirmed\r\n- Deemed Date / Amount fields verified\r\n- Conversion number from P3 recorded\r\n- Import file saved and path accessible\r\n\r\n**Test → Production toggle.** The Informatica loan workflow has a test mode controlled by a `test = Y/N` flag on the parameter file:\r\n\r\n1. **First run:** set `test = Y`. If it completes with no errors and the load looks clean, proceed.\r\n2. **Second run:** flip to `test = N` and re-run for production.\r\n3. If the test run errors, fix the underlying issue before flipping — don't run production over a known problem.\r\n\r\nThe module loads `PENSION.CONV_LOAN` (header) and `PENSION.CONV_LOAN_PRIN` (source balance). After it runs, check the **Loan Compare file** (all differences must equal `0`) and the **Loan BEE detail** for errors before continuing.\r\n\r\n### Phase III · Takeover Loans & Confirmation (green)\r\n\r\n#### 11. P3 → Conversions → Existing Plan → Takeover Loans → Submit — DC\r\nNavigate back to P3:\r\n- **P3** → **Conversions dropdown** → **Existing Plan** → **Takeover Loans** → **Submit**\r\n- Enter the plan in the search field\r\n- Select **Takeover Loans** from the dropdown\r\n- Press **Submit** to proceed to the upload screen\r\n\r\n![P3 → Conversions → Existing Plan — the entry point for Takeover Loans.](SS/Loans_Existing Conversion.jpg)\r\n\r\n#### 12. Click Upload — bottom-left corner — DC\r\nThe Upload button is in the **bottom-left corner** of the upload screen. Click it. Wait for processing — **do not navigate away or refresh** while the upload runs. The system queues a confirmation email when it finishes.\r\n\r\n**HOLB branch.** Before clicking Upload, check whether a [[holb|HOLB]] (Highest Outstanding Loan Balance) file exists for this plan:\r\n\r\n- **HOLB file exists** → upload it directly using the upload button\r\n- **No HOLB file** → click **Upload and Create** instead — P3 derives HOLB values from the loan data being loaded\r\n\r\nHOLB drives the loan hierarchy when a participant has multiple loans active and determines how repayments split across those loans. Both branches result in valid loan records; the difference is whether HOLB comes from a separate file or gets computed during this upload.\r\n\r\n#### 13. Wait for system confirmation email — DC\r\nThe system emails confirmation: number of loans loaded and any errors encountered. Do **not** run confirmation queries until this email arrives. If the email reports errors, review the Informatica log before proceeding — do not paper over errors with manual fixes.\r\n\r\n#### 14. Run confirmation queries — DC\r\nAfter a clean confirmation email, run the standard verification queries against the conversion to confirm loan count, total balance, and active status. Log the case number, conversion number, and effective date. Loan setup and processing is complete.\r\n\r\nThe confirmation query output (essentially the loaded loan header file) feeds into the [[audit-pack]] for QA review.\r\n\r\n## Handoff Points\r\n\r\n| # | From → To | What Moves | Risk |\r\n|---|-----------|------------|------|\r\n| 1 | Prior RK → DC | Loan import file (header + source) | Stale or partial file → Step 8 fails |\r\n| 2 | DC → P3 (Step 3) | Record Keeper name only | Extra fields filled → vendor lookup mismatch in Informatica |\r\n| 3 | DC → P3 (Step 7) | Conversion record saved | Effective date wrong → all derived dates wrong |\r\n| 4 | DC → Informatica (Step 10) | Conversion # + RK name + file | Vendor name ≠ `censuslookupfile.xls` → \"Nper is null\" |\r\n| 5 | Informatica → P3 | Loaded `CONV_LOAN` + `CONV_LOAN_PRIN` rows | Loan Compare ≠ 0 → reconcile before Takeover |\r\n| 6 | DC → P3 Takeover Loans (Step 11) | Submit + Upload | Navigate away during upload → must restart |\r\n| 7 | P3 → DC mailbox | Confirmation email | DC runs queries before email arrives → false positive |\r\n\r\n## Timing / Deadlines\r\n\r\n- **Phase I (P3 setup):** ~30 minutes once dates and case number are confirmed.\r\n- **Phase II (Validation + Informatica):** highly variable. If Header = Source on first check, ~20 minutes. If reconciliation is needed, can stretch into days while waiting on the prior RK.\r\n- **Phase III (Takeover + email):** upload itself is a few minutes; the confirmation email typically arrives within 15–30 minutes but can take longer under load.\r\n- **Sequencing:** loan setup must complete **before** participant balances post in [[final-files-processing]] — loan principal flows into source balances and the math will not reconcile if loans land later.\r\n\r\n## Failure Modes\r\n\r\n- **Header ≠ Source.** Any variance (Step 8) means the wrong totals will load. Reverse and re-pull the file from the prior RK before continuing.\r\n- **Deemed Amount left blank.** Step 9 trap — the field rejects null even when there's no deemed loan. Always enter `0`.\r\n- **Record Keeper name mismatch.** Extra fields entered in Step 3, or a name that does not exactly match `censuslookupfile.xls`, surfaces as \"Nper is null or zero\" in Informatica.\r\n- **Loans loaded after balances.** Sequence reversed — loan principal lands in source balances out of order; reconciliation breaks. Run loan setup first.\r\n- **Confirmation queries before email.** Returns partial state mid-load and looks like missing data. Wait for the email.\r\n- **Reload during Step 12.** Aborts the upload silently in some cases. Leave the tab alone.\r\n\r\n## Real-World Loan Trouble (Beyond Process Traps)\r\n\r\nThe traps above are mostly procedural. Loans also break for **business-state reasons** that the file looks fine for at first glance:\r\n\r\n- **Plan was frozen at the prior RK.** When a plan is frozen, the prior vendor often stops re-amortizing the loans. Repayment schedules drift. The loan file lands looking valid but the NPER and outstanding balance no longer match what the participant has actually been paying down.\r\n- **Recent refinance that didn't fully complete.** A participant refinanced shortly before the conversion cutoff and the prior RK's records didn't fully settle the old loan / activate the new one. The file shows partial state. Goes back to the vendor for a re-pull.\r\n- **Detail report ≠ source breakdown by ~one principal payment.** When the loan detail report disagrees with the source breakdown by an amount that suspiciously matches one principal payment, it usually means **one of the two reports dropped the last payment**. Easy to spot once you know to look — the variance is too clean a number to be anything else. Identify which report is stale and re-request it.\r\n\r\nThese are the ones that take judgment, not just a checklist. When something doesn't add up, don't reach for the file — reach for the prior RK.\r\n\r\n## See Also\r\n\r\n- [[informatica-loan-module]]\r\n- [[loan-setup]]\r\n- [[informatica]]\r\n- [[final-files-processing]]\r\n- [[plan-conversion-handoffs]]\r\n- [[roles/lm-dc]]\r\n- [[toa]]\r\n- [[holb]]\r\n- [[audit-pack]]"},{"id":"glossary/ltpt","slug":"ltpt","rel":"glossary/ltpt.md","namespace":"glossary","title":"LTPT","summary":"**Full Name:** Long-Term Part-Time (Eligibility)","updated":"2026-04-15","created":"2026-04-15","sources":1,"status":"current","tags":["glossary","eligibility","secure-act","ltpt"],"type":"glossary","extras":[],"media":[],"meta":{"title":"LTPT","type":"glossary","tags":["glossary","eligibility","secure-act","ltpt"],"created":"2026-04-15","updated":"2026-04-15","sources":1,"status":"current"},"markdown":"# LTPT\n\n**Full Name:** Long-Term Part-Time (Eligibility)\n\n## Definition\n\nLTPT refers to the Long-Term Part-Time eligibility category established by the SECURE Act 2.0. Effective January 1, 2025, employees who work at least 500 hours in two consecutive 12-month eligibility computation periods (minimum age 21) become eligible to make elective deferrals to a 401(k) or 403(b) plan — regardless of the plan's standard eligibility requirements.\n\nLTPT employees may only make **elective deferrals**; they are not eligible for employer contributions unless they also meet standard plan eligibility.\n\n## Used By\n\n- [[roles/lm-dc]] — must track hours for LTPT eligibility even for excluded-class employees; uses EDS status codes 5 and 6\n- [[eds]] — two new status codes added for LTPT: **5** = Not eligible, kit mailed due to LTPT; **6** = Eligible, LTPT\n\n## See Also\n\n- [[ltpt-eligibility]] — full concept page\n- [[eligibility]] — general eligibility processing\n- [[eds]]"},{"id":"concepts/ltpt-eligibility","slug":"ltpt-eligibility","rel":"concepts/ltpt-eligibility.md","namespace":"reference","title":"LTPT Eligibility (Long-Term Part-Time)","summary":"A Secure Act 2.0 eligibility requirement that entitles long-term part-time employees to make elective deferrals, even if they have not met the plan's standard eligibility rules. Effective January 1, 2025, the threshold is two consecutive 12","updated":"2026-04-15","created":"2026-04-15","sources":1,"status":"current","tags":["eligibility","ltpt","secure-act-2","part-time","deferrals","concept"],"type":"reference","extras":[],"media":[],"meta":{"title":"LTPT Eligibility (Long-Term Part-Time)","type":"reference","tags":["eligibility","ltpt","secure-act-2","part-time","deferrals","concept"],"created":"2026-04-15","updated":"2026-04-15","sources":1,"status":"current"},"markdown":"# LTPT Eligibility (Long-Term Part-Time)\n\nA Secure Act 2.0 eligibility requirement that entitles long-term part-time employees to make elective deferrals, even if they have not met the plan's standard eligibility rules. Effective January 1, 2025, the threshold is two consecutive 12-month periods with 500+ hours worked.\n\n## Definition\n\nLTPT (Long-Term Part-Time) eligibility is a federal mandate under the **Secure Act 2.0** that requires plan sponsors to allow certain part-time employees to participate in elective deferrals. It applies regardless of the plan's standard eligibility rules.\n\nThe key threshold: **500 hours in two consecutive 12-month eligibility computation periods** (age 21 minimum also applies).\n\n## Why It Matters\n\nPrior to this rule, many part-time employees were excluded from 401(k) and 403(b) plans by standard eligibility requirements (e.g., 1,000 hours/year). LTPT eligibility closes that gap. For the DC, this means:\n- New data to track and load\n- New participant status codes in EDS\n- Hours data must be requested and loaded going back to the start of the computation periods\n- Even excluded-class employees (e.g., union workers) may need hours tracked in case they switch to a covered class\n\n## Current Rule (As of January 1, 2025)\n\n| Item | Rule |\n|------|------|\n| Hours threshold | 500 hours per computation period |\n| Consecutive periods required | **2** (reduced from 3 for 401(k) as of Jan 1, 2025) |\n| Applies to | 401(k) and 403(b) plans |\n| Minimum age | 21 |\n| What they can do | Make elective deferrals only |\n| What they cannot do | Receive employer contributions (unless they meet standard eligibility) |\n\n## What Changed January 1, 2025\n\nThe Secure Act 2.0 reduced the required consecutive computation periods from **three to two** for both 401(k) and 403(b). This change means more part-time employees qualify sooner.\n\nFor plans converting to Transamerica after January 1, 2025: request **two years** of historic hours data (2023 and 2024 minimum). For plans converting earlier, the three-year requirement may still apply to some participants.\n\n## Historic Hours Data to Request\n\nFor participants who have not met the plan's regular eligibility requirements:\n\n| Plan Type | Computation Periods to Request |\n|-----------|-------------------------------|\n| 401(k) | 2023 and 2024 (two consecutive periods) |\n| 403(b) | 2023 and 2024 (two consecutive periods) |\n\nHours should be requested **by pay period** from the client or prior record keeper.\n\n## Who Is Exempt\n\nLTPT eligibility rules **do not apply** to:\n- Employees whose eligibility is based on **elapsed time** (not hours)\n- Employees in an **excluded class** — such as collectively bargained employees or non-resident aliens — *while they remain in that class*\n\n**Important:** Even exempt employees (excluded classes) should have hours tracked. If they move from an excluded class to a covered class, the LTPT clock should already have been running.\n\n## EDS Status Codes\n\nTwo new eligibility status codes were introduced for LTPT:\n\n| Code | Meaning |\n|------|---------|\n| **5** | Not eligible; kit mailed due to LTPT eligibility |\n| **6** | Eligible, LTPT |\n\nThese codes are passed in from the payroll/census file. The client must be able to provide these codes or the data to derive them.\n\n## Loading LTPT Data\n\nWhen loading participants under LTPT eligibility:\n\n**For Status 5 (not yet eligible, LTPT-tracked):**\n- Client does not provide a consecutive-year counter\n- Create pending records to true participants up due to LTPT (long-term part-time)\n- Create pending records for when the participant will become fully eligible\n\n**For Status 6 (LTPT eligible):**\n- Load the LTPT entry date if provided\n- If no date provided, the load job calculates it as the start of the third computation period (under old rules) or appropriate period under new rules\n- Create rows on PES to indicate LTPT eligibility has been met\n- Create pending records for when the participant next becomes eligible to become fully eligible (i.e., meets standard eligibility)\n\n## Interaction with Standard Eligibility\n\nLTPT is a **floor**, not a replacement for standard eligibility:\n- A participant who qualifies via LTPT can only defer — no employer contributions\n- Once the participant meets standard eligibility, they become fully eligible including employer contributions\n- The system must track both LTPT status and standard eligibility status simultaneously\n\n## Evidence / Examples\n\nFrom the DC Training Notebook (June 10, 2024 / January 1, 2025 effective):\n- Plans are updated in NBI with conversion steps for LTPT handling\n- Training presentations available: `LTPT - Training Presentation 3.24.24.pptx` and `LTPT Regulatory Project_01.25.2024.pptx`\n\n## Related Concepts\n\n- [[eligibility]] — Standard eligibility processing\n- [[deferrals]] — Deferral loading (LTPT participants can only defer)\n- [[eds]] — EDS layout must support status codes 5 and 6\n- [[plan-classes]] — Class-based eligibility; excluded classes and the LTPT tracking exception\n\n## See Also\n\n- [[eligibility]]\n- [[deferrals]]\n- [[eligibility-and-deferrals]]\n- [[eds]]\n- [[plan-classes]]\n- [[roles/lm-dc]]"},{"id":"entities/matt-oconnell","slug":"matt-oconnell","rel":"entities/matt-oconnell.md","namespace":"people","title":"Matt O'Connell","summary":"Leads the team responsible for setting up Fidelity pooled accounts for Transfer In Kind (re-registration) conversions.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["person","transfer-in-kind","reregistration","fidelity"],"type":"person","extras":[],"media":[],"meta":{"title":"Matt O'Connell","type":"person","tags":["person","transfer-in-kind","reregistration","fidelity"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# Matt O'Connell\n\nLeads the team responsible for setting up Fidelity pooled accounts for Transfer In Kind (re-registration) conversions.\n\n## Overview\n\nWhen a plan conversion includes funds being transferred in kind (shares moved directly rather than liquidated), Matt O'Connell's team sets up the receiving accounts at Fidelity. These accounts are pooled (not per-participant) and are identified by expected share amounts rather than account numbers.\n\n## Key Facts\n\n- Team setup time: approximately **10 business days**\n- Accounts are set up at **Fidelity** as a shared pool\n- Identification method: expected share amounts per fund (not account numbers)\n- Team begins monitoring and reporting **immediately** upon setup — do not start too early\n- Receives the **re-registration form** filled out by the DC\n- Receives updated share amount estimates from the DC (from TOA initially, then test files, then final files)\n\n## Timing Rules\n\n> Do NOT engage Matt's team too early. Once set up, they immediately begin reporting on expected vs. received shares. Starting a month early creates weeks of \"nothing here\" noise.\n\nRecommended timing:\n- Take the **liquidation date**\n- Subtract **10 business days** (Matt's team setup time)\n- Subtract **1–2 more days** as buffer\n- That is the target date to send the re-registration form\n\nGoal: accounts should be complete approximately **1–1.5 weeks before liquidation**.\n\n## Workflow with DC\n\n1. DC fills out the re-registration form (triggered by TOA column T = \"Y\")\n2. DC sends form to Matt O'Connell's team\n3. DC provides estimated share totals (from TOA current values — may be old)\n4. DC updates totals after test files arrive\n5. DC updates totals immediately when final files arrive — **time-sensitive**\n6. Matt's team identifies incoming shares by matching expected amounts\n7. Matt's team pulls shares into plan accounts once identified\n\n## Communication Method\n\nMatt's team communicates via a **shared spreadsheet**. DC fills in expected share amounts when final files arrive; Matt's team updates it when shares are received at Fidelity. DC monitors the spreadsheet to know when all shares have arrived.\n\n## Share Amount Mismatch\n\nIf shares don't match expected amounts: DC investigates and contacts the prior vendor directly.\n\n## TIK Tracker Spreadsheet\n\nYes — there is a separate **TIK tracker spreadsheet** from the re-registration form. DC fills in expected shares per fund when final files arrive. The re-reg form is the setup document; the tracker is the monitoring tool during the TIK transfer period.\n\n## See Also\n\n- [[processes/tik-transfer|transfer-in-kind]]\n- [[toa]]\n- [[final-files-processing]]\n- [[conversion-types]]"},{"id":"entities/nbi","slug":"nbi","rel":"entities/nbi.md","namespace":"systems","title":"NBI","summary":"Internal system where new plan assignments are loaded and tracked. The starting point for every DC's involvement in a new plan.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["system","assignment","plan-tracking"],"type":"system","extras":[],"media":[],"meta":{"title":"NBI","type":"system","tags":["system","assignment","plan-tracking"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# NBI\r\n\r\nInternal system where new plan assignments are loaded and tracked. The starting point for every DC's involvement in a new plan.\r\n\r\n## Overview\r\n\r\nWhen a new sale is finalized, the plan assignment is entered into NBI. NBI tracks which DCs, COMs, and other roles are assigned to each plan. Empty spots in NBI trigger [[ellen-miller]] to reach out to managers for assignment.\r\n\r\n## Key Functions\r\n\r\n- Tracks plan assignments by role (DC, COM, etc.)\r\n- Flags unassigned (\"empty\") slots\r\n- Acts as the official record of who owns what\r\n\r\n## Assignment Flow\r\n\r\n1. New sale → loaded into NBI\r\n2. Empty DC slots detected → [[ellen-miller]] notifies DC manager\r\n3. Manager reviews caseload and distributes to a DC\r\n4. Plan is now tagged to the DC in NBI\r\n\r\n## DC Interaction\r\n\r\nNBI is a **universal checklist** for every plan. Every time anything happens — a document received, a change made, a milestone hit — it gets logged in NBI.\r\n\r\nStructure:\r\n- **Sections per role:** DCs, TCs, and other team members each have their own checklist sections within the plan's NBI record\r\n- **Notes field:** Space for free-form notes on each entry\r\n- **Date stamps:** When things were done\r\n- **Universal visibility:** Anyone can jump into NBI to check the current status of any plan\r\n\r\nThe DC updates NBI continuously throughout the conversion — not just at the end. Every milestone, receipt, and action is logged.\r\n\r\n## Key Facts\r\n\r\n- **Full name:** New Business Intelligence\r\n- **Access:** Web-based tool\r\n- **Visibility:** DCs can see **all plans** — not just their own. History is also visible.\r\n- **Checklist structure:** All standard items — not free-form. Every DC works from the same checklist structure.\r\n\r\n## See Also\r\n\r\n- [[ellen-miller]]\r\n- [[p3]]\r\n- [[dc-onboarding-workflow]]"},{"id":"entities/nick-lister","slug":"nick-lister","rel":"entities/nick-lister.md","namespace":"people","title":"Nick Lister","summary":"The DC's direct manager. Recently took over after the previous manager was laid off. Into AI — part of the motivation behind building this wiki.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["person","manager","direct-manager"],"type":"person","extras":[],"media":[],"meta":{"title":"Nick Lister","type":"person","tags":["person","manager","direct-manager"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# Nick Lister\r\n\r\nThe DC's direct manager. Recently took over after the previous manager was laid off. Into AI — part of the motivation behind building this wiki.\r\n\r\n## Overview\r\n\r\nNick Lister is the DC's current direct manager. He's new to the relationship (recently promoted/reassigned), but the early read is positive — young, into AI, and supportive of the kind of tooling and documentation work this wiki represents.\r\n\r\n## Key Facts\r\n\r\n- **Role:** DC's direct manager\r\n- **Context:** Took over after the DC's previous manager was laid off\r\n- **Relationship:** New, still getting established — described as \"really cool\"\r\n- **Notable:** Into AI, which is why the DC is pushing the LLM wiki idea hard\r\n- **Contact type:** Email (for AE liquidation requests and other manager-level items)\r\n\r\n## When the DC Goes to Nick\r\n\r\n- **Advanced Employer liquidation:** Email Nick (and/or [[stacey-fortune]]) to request the AE be liquidated so final balance posting can proceed (cash conversions)\r\n- General manager escalations and approvals\r\n- Any situation requiring manager sign-off\r\n\r\n## See Also\r\n\r\n- [[stacey-fortune]]\r\n- [[final-files-processing]]"},{"id":"glossary/nsa","slug":"nsa","rel":"glossary/nsa.md","namespace":"glossary","title":"NSA","summary":"**Full Name:** New Sale Announcement","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["glossary","acronym","com","sales","trigger"],"type":"glossary","extras":[],"media":[],"meta":{"title":"NSA","type":"glossary","tags":["glossary","acronym","com","sales","trigger"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# NSA\n\n**Full Name:** New Sale Announcement\n\n**Definition:** The internal notification issued when a new retirement plan has been sold and is entering the implementation pipeline. Receipt of the NSA is the trigger that starts the [[roles/com]] workflow.\n\n**Used By:** COM (primary recipient); likely originates from a sales or business development team.\n\n## See Also\n\n- [[concepts/nsa]] — concept page with workflow detail\n- [[roles/com]]"},{"id":"concepts/nsa","slug":"nsa","rel":"concepts/nsa.md","namespace":"reference","title":"NSA — New Sale Announcement","summary":"The internal notification that a new retirement plan has been sold and is entering the conversion pipeline. The NSA is the trigger that starts the roles/com workflow.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["concept","document","trigger","com","sales"],"type":"reference","extras":[],"media":[],"meta":{"title":"NSA — New Sale Announcement","type":"reference","tags":["concept","document","trigger","com","sales"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# NSA — New Sale Announcement\n\nThe internal notification that a new retirement plan has been sold and is entering the conversion pipeline. The NSA is the trigger that starts the [[roles/com]] workflow.\n\n## Definition\n\nWhen a plan is sold and assigned to begin conversion, a New Sale Announcement (NSA) is issued internally. The COM receives this notification and uses it as the starting gun for all subsequent conversion activity — scheduling kickoffs, creating the project plan, and opening the case.\n\n## Why It Matters\n\nNothing formally begins until the NSA is received. It marks the transition from \"sale\" to \"implementation\" and is the COM's first signal that a plan is real and active. The DC, by contrast, is notified through [[nbi]] and a manager assignment — the NSA is COM's equivalent entry point.\n\n## Related Concepts\n\n- [[project-plan-com]] — the first deliverable COM creates after receiving the NSA\n- [[nbi]] — DC's equivalent trigger and tracking system\n- [[plan-conversion-handoffs]] — full handoff map from trigger through go-live\n\n## See Also\n\n- [[roles/com]]\n- [[nbi]]\n- [[plan-conversion-handoffs]]"},{"id":"onboarding/com","slug":"com","rel":"onboarding/com.md","namespace":"onboarding","title":"Onboarding Guide: Communications Coordinator (COM)","summary":"A new Communications Coordinator joining the Large Market team at Transamerica. This guide assumes no prior knowledge of TA systems or processes and is oriented around what you actually need to do in your first weeks on the job.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["onboarding","com","project-management","conversion"],"type":"onboarding","extras":[],"media":[],"meta":{"title":"Onboarding Guide: Communications Coordinator (COM)","type":"onboarding","tags":["onboarding","com","project-management","conversion"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# Onboarding Guide: Communications Coordinator (COM)\r\n\r\n## Who This Is For\r\n\r\nA new Communications Coordinator joining the Large Market team at Transamerica. This guide assumes no prior knowledge of TA systems or processes and is oriented around what you actually need to do in your first weeks on the job.\r\n\r\n## Reading Order\r\n\r\n### Foundation — What You're Walking Into\r\n\r\n1. **[[overview]]** — What TA's conversion business is, at the highest level. Read this first to understand the domain before any detail.\r\n2. **[[plan-conversion-handoffs]]** — The master map of how work moves between all teams. This is your operating context: everything you do lives inside this flow.\r\n3. **** — Who all the internal players are. COM touches every team; know them all by name before your first kickoff.\r\n4. **[[conversion-types]]** — Cash vs. mapping vs. transfer in kind. Every conversion is one of these; know the difference early.\r\n\r\n### Your Role\r\n\r\n5. **[[roles/com]]** — Your own role page. Read the full 18-phase workflow. This is the checklist translated into reference prose — understand every phase before you manage one.\r\n6. **[[concepts/nsa]]** — The trigger that starts everything for you. Know what it is and what you do the moment you receive it.\r\n7. **[[project-plan-com]]** — Your first deliverable after NSA receipt. Two formats: PEP vs. non-PEP.\r\n8. **[[nbi]]** — You upload the project plan here and complete the audit checklist here at go-live. Understand how NBI is used across all teams, not just by you.\r\n\r\n### Documents You Own or Route\r\n\r\n9. **[[prd]]** — COM authors the PRD. This is the plan design document that the DC, TC, and QA all read. You need to know what's in it and who needs it.\r\n10. **[[subpack]]** — COM creates the subpack for non-PEP plans; TC takes it over after review. Know what it contains and why it matters to the DC.\r\n11. **[[onboarding-package]]** — PEP-plan equivalent of the PRD. COM manages the tabs, PEA, and Info Sharing Form.\r\n12. **[[toa]]** — Transfer of Assets. Client-signed fund map. Relevant to your OBP workflow (PEP) and the DC's fund mapping workflow.\r\n13. **[[prior-carrier-letter]]** — You create this; know what triggers it and where it goes.\r\n14. **[[blackout-notice]]** — Legally required participant notice. Time-sensitive. Know the routing chain.\r\n15. **[[concepts/vef]]** — Vendor Expense Form. If applicable; know the 6-step routing chain through advisor → client → L&C.\r\n\r\n### Payroll Coordination\r\n\r\n16. **[[contribution-monitoring-form]]** — TFS plan payroll setup form. Involves a TC AWD flip that you must trigger.\r\n17. **[[rdd-form]]** — TC-originated, client-completed, COM-routed. Simple loop but easy to let slip.\r\n18. **[[ftp-connection]]** — The payroll vendor's file upload channel. Set up by FTP Team; you need to know this is a separate dependency from payroll test files.\r\n\r\n### Go-Live\r\n\r\n19. **[[early-access]]** — Pre-go-live participant window. COM owns the coordination; know when to request it, who activates it, and how tight the timing is.\r\n20. **[[concepts/csr]]** — Conversion Summary Report from the Quality Consultant. You receive it and send it to the client as part of go-live close-out.\r\n21. **[[audit-pack]]** — DC-built post-conversion summary. Complements (or precedes) the CSR. QA reviews it. Know it exists so you can reference it if clients ask for post-conversion documentation.\r\n\r\n### Key People to Know Immediately\r\n\r\n22. **[[ellen-miller]]** — You will route prior documents through her, send notice mailing requests through her, check SF plan setup with her, and notify her when the plan is live. Central relationship.\r\n23. **[[jen-curtin]]** — You notify her for 360° payroll plans. Understand her role as head of the FTP team.\r\n24. **[[roles/lm-dc]]** — The Data Consultant is your closest internal partner. They confirm asset receipt, provide early access templates, and receive payroll questionnaires from you. Read the DC role page to understand what they need and when.\r\n25. **[[tc]]** — Transition Consultant. They review your subpack, provide your QDIA and fee disclosures, flip AWD for contribution monitoring, activate early access, and typically set up the go-live review. Deeply intertwined with your workflow.\r\n\r\n## Key People to Meet\r\n\r\n- Your assigned DC for each plan — relationship is plan-by-plan\r\n- TC on your team — the go-live review depends on them setting it up\r\n- Ellen Miller — central routing contact; introduce yourself early\r\n- Jen Curtin — relevant as soon as you have a 360° payroll plan\r\n- The Quality Consultant on your team — they produce the CSR you'll deliver to clients\r\n\r\n## First Week Priorities\r\n\r\n1. Get access to NBI and locate the project plan upload workflow\r\n2. Understand the PEP vs. non-PEP split — almost every document decision flows from plan type\r\n3. Read an existing project plan for a plan already in progress to understand the format\r\n4. Shadow a kickoff call (internal and external) before running one yourself\r\n5. Identify your TC and DC counterparts for any plans being assigned to you\r\n\r\n## See Also\r\n\r\n- [[roles/com]]\r\n- [[plan-conversion-handoffs]]\r\n- [[roles/lm-dc]]\r\n- [[tc]]\r\n- [[nbi]]"},{"id":"onboarding/lm-dc","slug":"lm-dc","rel":"onboarding/lm-dc.md","namespace":"onboarding","title":"Onboarding Guide: Large Market Data Consultant","summary":"A reading list for anyone new to the LM DC role at Transamerica. Read these pages in order. Each one builds on the last.","updated":"2026-04-20","created":"2026-04-14","sources":1,"status":"current","tags":["onboarding","lm-dc","data-consultant","large-market"],"type":"onboarding","extras":[],"media":[],"meta":{"title":"Onboarding Guide: Large Market Data Consultant","type":"onboarding","tags":["onboarding","lm-dc","data-consultant","large-market"],"created":"2026-04-14","updated":"2026-04-20","sources":1,"status":"current"},"markdown":"# Onboarding Guide: Large Market Data Consultant\r\n\r\nA reading list for anyone new to the LM DC role at Transamerica. Read these pages in order. Each one builds on the last.\r\n\r\n## Who This Is For\r\n\r\nNew hires or transfers into the Large Market Data Consultant role. Also useful for anyone on a partner team (COM, QA, TC) who wants to understand what a DC actually does.\r\n\r\n## Reading Order\r\n\r\n1. **[[roles/lm-dc]]** — Start here. Understand the full scope of the role, every system you'll use, and every team you'll touch.\r\n\r\n2. **[[dc-onboarding-workflow]]** — The master 7-phase checklist. This is the job, start to finish. Bookmark it. You'll come back constantly.\r\n\r\n3. **[[conversion-types]]** — Everything downstream depends on whether a plan is cash, mapping, or transfer in kind. Learn these cold.\r\n\r\n4. **[[plan-conversion-handoffs]]** — How work moves between teams. Read this alongside the workflow so you understand not just your steps, but where things come from and where they go.\r\n\r\n5. **** — Who everyone is and how they relate to you. Know these names before your first kickoff meeting.\r\n\r\n6. **[[nbi]]** — The universal plan checklist. You will live in this system. Understand what it tracks and when to update it.\r\n\r\n7. **[[p3]]** — Your main platform. Where plans live, where you process files, where you fix things.\r\n\r\n8. **[[p2]]** — The back-end region you'll use on liquidation day to create transfer reference numbers. Separate from P3 — know the difference before you're in the moment.\r\n\r\n9. **[[eds]]** — How files get validated and processed. Always read the output after every run.\r\n\r\n10. **[[census-data]]** — Participant data loading: what's required, how to validate it in EDS, audit checks, and when to use vendor data instead of client data. This is one of the first things you'll work on.\r\n\r\n11. **[[prd]]** — The Plan Review Document. Understand what sections DC focuses on: eligibility, vesting, sources, classes.\r\n\r\n12. **[[subpack]]** — The internal TA execution plan. Supposed to be complete by COM at the start. Know how to work without it when it's missing.\r\n\r\n13. **[[toa]]** — Transfer of Assets. Triggers the mapping phase. Know what column T means.\r\n\r\n14. **[[fund-mapping]]** — First mapping you build after TOA is signed. No test files needed.\r\n\r\n15. **[[source-mapping]]** — Second mapping. Requires test files. Needs AQT and EDS.\r\n\r\n16. **[[prior-record-keeper]]** — How to work with the outgoing administrator: questionnaire, test files, wire coordination.\r\n\r\n17. **[[wire-instructions]]** — Send early. Resend before liquidation. Know the default account.\r\n\r\n18. **[[ftp-connection]]** — Payroll vendor file upload channel. Request this early — FTP team has a big queue.\r\n\r\n19. **[[fund-management-calendar]]** — Must be updated before 1 PM Pacific on any day trades go out. Missing this is a serious process failure. Know it before your first liquidation day.\r\n\r\n20. **[[liquidation-day]]** — The main event. Read this multiple times. Understand the sequence for each conversion type.\r\n\r\n21. **[[dummy-participant]]** — Required for mapping conversions. Must exist before Day of Wire. SSN 999-00-0000.\r\n\r\n22. **[[informatica]]** — Day of Wire and Participant Balance workflows. Day of Wire cannot be tested — understand why.\r\n\r\n23. **[[conv-file]]** — The input file for the Day of Wire workflow. Know its structure and how to build it before you're under liquidation-day pressure.\r\n\r\n24. **[[final-files-processing]]** — After liquidation: balances, YTD data, deferrals, eligibility. Order matters.\r\n\r\n25. **[[loading-basis-eds]]** — Basis loading procedure: EE basis fields, transaction rules, Roth considerations, and 457 plan restrictions. Loaded as part of final files.\r\n\r\n26. **[[eligibility-and-deferrals]]** — Deferrals before eligibility. Always. No exceptions.\r\n\r\n27. **[[processes/tik-transfer|transfer-in-kind]]** — If you have a TIK plan, read this before you do anything with Matt O'Connell.\r\n\r\n28. **[[audit-pack]]** — What you build at the end. Understand what goes in it and where it lives.\r\n\r\n29. **[[prod-support]]** — When standard tools can't fix the data, Prod Support can. Know how AWD tickets work.\r\n\r\n## Key People to Meet\r\n\r\n- **[[nick-lister]]** — Your direct manager. Intro meeting in first week.\r\n- **[[ellen-miller]]** — Manages assignments. She'll be in your workflow from day one.\r\n- **Your COM counterpart** — The COM assigned to your first plan. Get their contact info early.\r\n- **[[matt-oconnell]]** — Leads TIK re-registration. You don't need him until you have a TIK plan, but know who he is.\r\n- **[[stacey-fortune]]** — Cross-department manager. Not day-to-day, but important for escalations and AE liquidation.\r\n- **[[scott-vrba]]** — Eligibility SME. Go to him when eligibility questions go beyond standard patterns.\r\n- **[[eric-leytem]]** — FTP Team key contact. He confirms when FTP setup is complete.\n\r\n## First Week Priorities\r\n\r\n- [ ] Get NBI access — you can't track your plans without it\r\n- [ ] Get P3 access — request through your manager\r\n- [ ] Get EDS access — linked from P3 menu bar\r\n- [ ] Find out what plans are currently in your queue\r\n- [ ] Read your first PRD or onboarding package\r\n- [ ] Shadow a DC who is currently in a live conversion\r\n\r\n## See Also\r\n\r\n- [[roles/lm-dc]] — full role reference page\r\n- [[dc-onboarding-workflow]] — the master process checklist\r\n- [[conversion-types]] — the single most important concept to internalize early"},{"id":"concepts/onboarding-package","slug":"onboarding-package","rel":"concepts/onboarding-package.md","namespace":"documents","title":"Onboarding Package","summary":"An all-in-one Excel document used for certain plan types (especially PEP plans) in place of or alongside the PRD. Contains plan provisions, TOA, source details, and other conversion specs in a single file.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["document","onboarding-package","pep","plan-provisions","discovery"],"type":"document","extras":[],"media":[],"meta":{"title":"Onboarding Package","type":"document","tags":["document","onboarding-package","pep","plan-provisions","discovery"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# Onboarding Package\n\nAn all-in-one Excel document used for certain plan types (especially PEP plans) in place of or alongside the PRD. Contains plan provisions, TOA, source details, and other conversion specs in a single file.\n\n## Overview\n\nThe onboarding package consolidates into one Excel file what might otherwise be spread across multiple documents. For PEP (Pooled Employer Plans) and some other plan types, the onboarding package is the primary plan specification document.\n\n## Contents\n\nAn onboarding package typically contains:\n- **TOA (Transfer of Assets)** — the fund mapping table\n- **Plan provisions** — eligibility, vesting, sources, investment options\n- **Source details** — source names, codes, and parameters\n- Other plan-specific fields\n\n> Everything the [[prd]] covers, plus the [[toa]], in one Excel file.\n\n## Plan Types That Use It\n\n- **PEP — Pooled Employer Plans** — always use onboarding packages\n- **All other plan types** — use the [[prd]] instead\n\nPEP plans use the onboarding package. All other plan types use the PRD. The two are mutually exclusive — a plan uses one or the other, not both.\n\n## PRD vs. Onboarding Package\n\n| | PRD | Onboarding Package |\n|--|-----|--------------------|\n| Format | Typically a Word/PDF document | Excel workbook |\n| TOA included | No (separate) | Yes (included) |\n| Used for | Most plan types | PEP plans + others |\n| Signed by client | Yes | Yes |\n| Purpose | Same — detail plan provisions |\n\n## DC Use\n\nSame as with the PRD: DC focuses on eligibility, vesting, sources, and special strategies. The rest is for other departments.\n\nThe TOA being embedded means the DC can begin [[fund-mapping]] as soon as the onboarding package is signed (same rule as standalone TOA).\n\n## Authorship and Template\n\n- **This is a TA document** — not provided by the prior record keeper\n- **COMs** put it together\n- **Standard TA template** exists — COMs work from it\n- **No additional DC-specific considerations for PEP plans** — DC processes them the same way as PRD-based plans\n\n## See Also\n\n- [[prd]]\n- [[toa]]\n- [[subpack]]\n- [[fund-mapping]]\n- [[dc-onboarding-workflow]]"},{"id":"overview","slug":"overview","rel":"overview.md","namespace":"reference","title":"Overview","summary":"*High-level synthesis of the entire knowledge base. Updated after every ingest that materially changes the big picture.*","updated":"2026-05-13","created":"2026-04-14","sources":10,"status":"current","tags":["overview","synthesis"],"type":"reference","extras":[],"media":[],"meta":{"title":"Overview","type":"reference","tags":["overview","synthesis"],"created":"2026-04-14","updated":"2026-05-13","sources":10,"status":"current"},"markdown":"# Overview\r\n\r\n*High-level synthesis of the entire knowledge base. Updated after every ingest that materially changes the big picture.*\r\n\r\n---\r\n\r\n## Domain\r\n\r\n**Retirement plan recordkeeping** at TransAmerica. This wiki documents the Data Consultant (DC), Communications Coordinator (COM), Transition Consultant (TC), and Quality Assurance / QC perspectives at different depths. DC and COM are still the most complete role pages; TC and QA/QC now have stronger administrative and audit-control coverage from legacy TC source material. Doc Ops remains a stub pending fuller source material.\r\n\r\n---\r\n\r\n## Current Thesis\r\n\r\nA plan conversion is fundamentally a parallel project with multiple control lanes: DC owns data movement, COM owns project communication and document routing, TC owns administrative readiness and participant/sponsor access controls, and QA/QC owns validation and audit evidence. These lanes start separately and converge at mapping approval, eligibility, limited/full access, go-live, and closeout.\r\n\r\n**The DC role** is data orchestration — sitting at the intersection of client data, vendor data, internal systems, and multiple internal teams. Two modes: preparation (weeks to months before liquidation) and execution (liquidation day through final files).\r\n\r\n**The COM role** is project management and document routing — owning the client relationship, all participant-facing communications, document execution (DocuSign, prior RK letters, blackout notices), payroll coordination, and go-live close-out.\r\n\r\nThe biggest risks across both roles: process gaps (subpack not distributed, FTP requested too late, mapping not approved in time), timing errors (blackout notice too late, early access file late, Matt O'Connell timing), and system gotchas (dummy participant missing, wrong P3 processing mode, AWD flip not confirmed).\r\n\r\n---\r\n\r\n## Key Themes\r\n\r\n### 1. Do Things Early\r\nNearly every process has \"as early as possible\" as the guidance: FTP setup, wire instructions, prior RK contact, fund mapping, EDS layouts. The conversion timeline compresses at the end — front-load the work.\r\n\r\n### 2. Conversion Type Drives Everything\r\nWhether a plan is **cash**, **mapping**, or **transfer in kind** (TIK) determines how every major step is executed. Know the conversion type early and plan accordingly.\r\n\r\n### 3. Order Matters\r\nSeveral steps have hard sequence dependencies:\r\n- **Deferrals before eligibility** (always)\r\n- **Fund mapping before source mapping** (conceptually — but fund mapping doesn't need test files, source mapping does)\r\n- **CONV file → Day of Wire → Final Files → Balance Posting** (cannot skip steps)\r\n- **Matt O'Connell timing** — too early is bad, too late is worse\r\n\r\n### 4. Process Mode Determines Whether Trades Go Out\r\nThe [[p3]] processing mode (Immediate+Batch vs. Online+No Hold) determines whether trades are sent. Trades should only go out once per fund. Get this wrong and you generate duplicate trades or fail to invest money.\r\n\r\n### 5. EDS Output Must Always Be Read\r\nEvery file run through EDS produces output. Ignoring it risks undetected errors persisting into production.\r\n\r\n---\r\n\r\n## Key People\r\n\r\n| Name | Role |\r\n|------|------|\r\n| [[ellen-miller]] | Central routing contact — DC assignment, notice mailing, plan setup in SF, go-live notification |\r\n| [[matt-oconnell]] | TIK re-registration — sets up Fidelity accounts for share transfers |\r\n| [[jen-curtin]] | Head of FTP Team — notified by COM for 360° payroll plans; internal payroll integration authority |\r\n\r\n---\r\n\r\n## Key Systems\r\n\r\n| System | Purpose |\r\n|--------|---------|\r\n| [[nbi]] | Plan assignment tracking; project plan repository; audit checklist at go-live |\r\n| [[p3]] | Main plan administration platform |\r\n| [[eds]] | File layout, validation, and processing |\r\n| [[informatica]] | Day of Wire and Participant Balance workflows |\r\n| [[aqt]] | Database query tool for source IDs |\r\n| [[docusign]] | E-signature platform for plan documents and onboarding agreements (COM) |\r\n| [[wx]] | Plan Sponsor Site; payroll functionality (WX V2) |\r\n\r\n---\r\n\r\n## Key Documents\r\n\r\n| Document | Purpose |\r\n|----------|---------|\r\n| [[prd]] | Plan provisions — prior provider to TA |\r\n| [[onboarding-package]] | All-in-one alternative to PRD (PEP plans) |\r\n| [[subpack]] | TA's internal execution plan |\r\n| [[toa]] | Client-signed fund map + TIK identifier |\r\n| [[base-file]] | Census template to seed the system |\r\n| [[payroll-template]] | Payroll file format for vendor/client |\r\n\r\n---\r\n\r\n\n### 6. Administrative Readiness Is Its Own Lane\nTC work is not just background support. Case notes, PSD setup, DDOL/VRU access, remittance guides, admin manuals, special services, and go-live controls are their own operating lane. If this lane is late, the plan can be technically loaded but still not ready to operate.\n\n### 7. QA/QC Catches Setup Risk, Not Just Data Risk\nQA/QC validates conversion records and assets, but also reviews default allocations, default deferrals, participant website behavior, statement-related work, loans, divisions, duplicate SSNs, and system audit items. This makes QA/QC a setup-control partner for TC and DC.\r\n## Open Questions (Knowledge Gaps)\r\n\r\n**Resolved:**\r\n- ~~P2 vs P3~~ — Different systems: P2 = back-end ref number region; P3 = main plan admin region. Changes in P2 reflect in P3.\r\n- ~~AQT~~ — A SQL query program (SQL Server front-end). Read-only — view only, no table changes.\r\n- ~~Audit pack~~ — High-level conversion summary (ref numbers, amounts, prior vendor data). Built by DC, reviewed by QA, stored in client folders.\r\n- ~~Re-registration form fields~~ — Prior vendor info, contact, effective dates, fund details (QSIP, tickers, estimated amount).\r\n- ~~NBI update points~~ — Updated continuously (every milestone, document receipt, action). Universal plan checklist with role-based sections.\r\n- ~~TC team~~ — Transition Consultant. Higher-level systematic back-end work. More back-end than the COM.\r\n- ~~ROC tool navigation~~ — P3 menu bar → ROC. Query \"ROC No Reversal\" (TDA) or Cork equivalent. Enter case number + SSN.\r\n- ~~Market timing~~ — 1:00 PM Pacific / 4:00 PM Eastern. Fund Management Calendar must be updated before cutoff on trade days.\r\n\r\n**Resolved this session (Round 5 — LMDC Training Notebook ingest):**\r\n- FMC shared drive path question superseded: new Feb 2026 FMC procedure uses email distribution + file update; full procedure documented in [[fund-management-calendar]]\r\n- Informatica Day of Wire test mode confirmed: **cannot be tested end-to-end** — debug/preview only; triple-check before running live\r\n- FMC: SSBT cut-off confirmed at 4:00 PM EST; wire confirmation from Cashiering expected by 4:45 PM EST\r\n- Reversal process: Plan Correction Checklist retired as of 03/06/2026; new Reversal Form process documented\r\n- Booking assets: two booking types (4=Remit for wire, 3=Rebook for AEDA disbursement) documented\r\n- LTPT eligibility: documented — effective Jan 1, 2025; EDS codes 5 and 6; hours tracking for excluded classes required\r\n- Common Remitter Plans: \"Verify Batch After Funding\" replaces Pre-Process in P3\r\n- Payroll handoff at go-live: FILESPECRQ ticket to Fiduciary Services effective Feb 26, 2026\r\n- TM (Transition Manager): confirmed as legacy name for COM; all wiki references updated to COM\r\n\r\n**Resolved this session (Round 6 — acronyms and people):**\r\n- **CCCS** = Client Conversion Configuration Sheet ✓\r\n- **FAA** = Fund Asset Allocation ✓\r\n- **PEA** = Plan Enrollment Agreement ✓ — see [[glossary/pea]]\r\n- **AAA** = Adoption Agreement Addendum ✓ — see [[glossary/aaa]]\r\n- **SF** = Salesforce ✓ — used for plan setup confirmation and VEF L&C tickets\r\n- **Communication Consultant** = internal Doc Ops role ✓ — [[doc-ops]] handles conversion newsletter\r\n- **QC / Quality Consultant** = Paul and Danny ✓ — QA team; focus is auditing imported data and mapping; entity pages pending last names\r\n- **Rich Lippoth** = go-to for incoming shares and regular trades ✓ — see [[entities/rich-lippoth]]; most visible on Vanguard FMC deadline\r\n\r\n**Still Open:**\r\n1. **Common prior RK workflows** — Fidelity, Vanguard, Empower — DC has built them; needs documentation once finalized\r\n2. **Workflows (WFs)** — in the main DC folder; still being tuned; needs documentation as they're finalized\r\n3. **Query library** — many P3 verification queries mentioned but not yet documented; will be in a dedicated md file\r\n4. **Samantha C.** — receives Transition Communications Checklist (non-PEP); last name and team still unknown\r\n5. **Paul (QA)** — last name unknown\r\n6. **Danny (QA)** — last name unknown\r\n\r\n**Resolved this session (Round 4):**\r\n- Audit pack template: `root/Conversion/Contract`, Excel format, same-day QA review, same template for all conversion types\r\n- Re-registration form: front folder of DC folder, Excel, simple form\r\n- NBI full name: New Business Intelligence (web-based; all plans visible)\r\n- P2 navigation confirmed; trans ref number format documented (YYYYMMDD + 7-8 alphanumeric)\r\n- Eligibility P3 nav path confirmed; email template exists; same-day go-ahead turnaround\r\n- Informatica is a standalone app; CONV file fields fully documented\r\n- Fund mapping TA fields confirmed: Filter, Vendor Fund Code, Ref #, Split Ratio, Split Code, Total\r\n- Source mapping not loaded to system — added to workflows as reference doc\r\n- Wire instructions: standard template; Assurance Code in P3 determines account number\r\n- FTP setup via email; each plan has its own destination folder\r\n- FMC: cashiering/trading dept monitors; email backup process for missed cutoffs; TIK funds don't need FMC entries\r\n- Dummy participant: DC adds it; one per plan; nightmare if forgotten; not needed for TIK\r\n- Prior RK known from day of assignment; questionnaire sent in hello email; relationship shared across team\r\n- TIK: tracker spreadsheet confirmed; Matt communicates via spreadsheet; DCs investigate mismatches\r\n- Stacey Fortune: Large Market dept; general knowledge resource\r\n\r\n---\r\n\r\n## See Also\r\n\r\n- [[dc-onboarding-workflow]] — the master process reference\r\n- [[conversion-types]] — cash vs. mapping vs. TIK\r\n- [[liquidation-day]] — the critical execution day\r\n- [[final-files-processing]] — post-liquidation data posting"},{"id":"entities/p2","slug":"p2","rel":"entities/p2.md","namespace":"systems","title":"P2","summary":"A back-end system region used primarily for creating and modifying transfer reference numbers. Separate from p3 but connected — changes in P2 reflect in P3.","updated":"2026-05-03","created":"2026-04-14","sources":3,"status":"current","tags":["system","ref-numbers","back-end"],"type":"system","extras":[],"media":[{"id":"fig-1","caption":"P2 login screen — TDATEST for TD plans, CORP07 for everything else.","src":"SS/P2 login.jpg","type":"screenshot"},{"id":"fig-2","caption":"P2 home after login — top-level menu where you pick a job/option/trans path.","src":"SS/P2 second page.jpg","type":"screenshot"},{"id":"fig-3","caption":"Existing trans ref numbers for the case — the list view P2 returns after a lookup.","src":"SS/P2 ref list.jpg","type":"screenshot"},{"id":"fig-4","caption":"Add ref number screen — job 2001 / option 4 / trans 1006 entry form.","src":"SS/P2 add ref.jpg","type":"screenshot"},{"id":"fig-5","caption":"Ref number after creation — the generated YYYYMMDD + alphanumeric identifier.","src":"SS/P2 ref 2.jpg","type":"screenshot"}],"meta":{"title":"P2","type":"system","tags":["system","ref-numbers","back-end"],"created":"2026-04-14","updated":"2026-05-03","sources":3,"status":"current"},"markdown":"# P2\n\nA back-end system region used primarily for creating and modifying transfer reference numbers. Separate from [[p3]] but connected — changes in P2 reflect in P3.\n\n## Overview\n\nP2 and P3 are two distinct system regions. P2 operates on the back end. DCs interact with P2 mainly during liquidation-related processing when ref numbers need to be created or modified.\n\n![P2 login screen — TDATEST for TD plans, CORP07 for everything else.](SS/P2 login.jpg)\n\n![P2 home after login — top-level menu where you pick a job/option/trans path.](SS/P2 second page.jpg)\n\n## Key Functions\n\n- **Creating transfer reference numbers** — one per fund on liquidation day (mapping/TIK)\n- **Modifying ref numbers** — adjustments as needed\n\n## Relationship to P3\n\nP2 and P3 are connected:\n- A change made in P2 **reflects in P3**\n- P3 is the main working environment (plan details, participant data, processing)\n- P2 is the back-end environment for ref number operations\n\nThink of P2 as the engine room and P3 as the dashboard.\n\n> **Where ref numbers actually get created.** P2 is the system of record — the actual ref number is created via the P2 back-end (job 2001 / option 4 / trans 1006). P3 is where you view, recreate, or attach those ref numbers in workflow files. When the source material says \"create ref numbers in P3\" it means using the P3 UI to surface or reference what P2 holds, not that P3 is generating new identifiers independently.\n\n## When DC Uses P2\n\n- **Liquidation day:** Create trans ref numbers (one per fund) before running the Day of Wire Informatica workflow\n- **Advanced Employer:** Setting up the advanced employer account ref number (cash conversion)\n- Any time a ref number needs to be created or adjusted\n\n![Existing trans ref numbers for the case — the list view P2 returns after a lookup.](SS/P2 ref list.jpg)\n\n![Add ref number screen — job 2001 / option 4 / trans 1006 entry form.](SS/P2 add ref.jpg)\n\n![Ref number after creation — the generated YYYYMMDD + alphanumeric identifier.](SS/P2 ref 2.jpg)\n\n## Access and Permissions\n\n- **Access method:** Separate URL interface (not within P3)\n- **Who can access:** All DCs — no special restrictions\n- **Login by plan type:**\n  - **TD plans** — log in as `TDATEST`\n  - **All other plans** — log in as `CORP07`\n\n## Trans Ref Number Format\n\n`YYYYMMDD` + ~7–8 random alphanumeric characters\n\nExample structure: `20260414A3X7KL2`\n\n## Other DC Operations in P2\n\nPrimarily ref number creation and modification. Possibly other operations — not fully documented yet.\n\n## See Also\n\n- [[p3]]\n- [[liquidation-day]]\n- [[informatica]]\n- [[conversion-types]]"},{"id":"entities/p3","slug":"p3","rel":"entities/p3.md","namespace":"systems","title":"P3","summary":"The main plan administration system. Central hub for plan configuration, participant data, processing, and queries.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["system","plan-administration","core"],"type":"system","extras":[],"media":[],"meta":{"title":"P3","type":"system","tags":["system","plan-administration","core"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# P3\r\n\r\nThe main plan administration system. Central hub for plan configuration, participant data, processing, and queries.\r\n\r\n## Overview\r\n\r\nP3 is TransAmerica's primary recordkeeping platform. Almost every action in a plan conversion runs through P3 — from initial plan setup through balance posting, eligibility enabling, and final processing. DCs use P3 constantly throughout the onboarding lifecycle.\r\n\r\n## Key Functions\r\n\r\n### Plan Configuration\r\n- Eligibility rules\r\n- Vesting rules and schedules\r\n- Source names and codes\r\n- Plan classes (traditional and special)\r\n- Divisions\r\n- Investment options / fund lineup\r\n\r\n### Classes in P3\r\nTwo types of classes exist:\r\n- **Traditional/regular classes** — DC can update names and codes\r\n- **Special classes** — DC cannot add; only [[doc-ops|Doc Ops]] can add new ones. DC can update existing ones.\r\n\r\nSee [[plan-classes]] for more detail.\r\n\r\n### Processing\r\n- Creating transfer reference (trans ref) numbers — done on P2 then reflected in P3, or directly on P3 (clarify)\r\n- Processing participant balances (immediate / batch / online)\r\n- Processing eligibility (enable by source)\r\n- Reversing dummy participant details via the ROC tool\r\n\r\n### EDS Integration\r\n- P3 and EDS are connected: \"P3 to EDS\" setup is where you configure file layouts for the plan\r\n- Must set up EDS layouts in P3 before testing files through EDS\r\n- See [[eds]]\r\n\r\n### Processing Modes (Critical)\r\n| Mode | When Used | What It Does |\r\n|------|-----------|-------------|\r\n| Process Immediate + Batch | Cash conversion balance posting; mapping day-of-wire | Sends trades out |\r\n| Online + No Hold | Mapping/TIK participant balance posting (after day-of-wire) | Books to ledger only, no trades |\r\n\r\n> **Rule:** If trades have already gone out (day-of-wire workflow), use **Online, No Hold** when posting participant balances. Do NOT click Process Immediate.\r\n\r\n### Eligibility\r\n- Enable per source — only sources that will have contributions\r\n- Must notify QA, TC, and COM before enabling\r\n- See [[eligibility-and-deferrals]]\r\n\r\n### ROC Tool\r\n- Used to reverse dummy participant details after balance posting\r\n- Part of P3\r\n\r\n## Setup Timing\r\n\r\nP3 setup (by Doc Ops) can happen before or after DC assignment. Earlier is better — DC needs P3 for eligibility rules, vesting, sources, classes, divisions. If P3 is set up, DC can start filling out specs immediately.\r\n\r\n> P3 setup timing varies by team caseload. Don't assume it's ready.\r\n\r\n## ROC Tool — Detail\r\n\r\nThe ROC tool is accessed from the **P3 menu bar**. It is the only place DCs are permitted to make direct changes to database tables (AQT is read-only — view only).\r\n\r\nFor dummy participant reversal after a mapping conversion:\r\n- Query to run: **\"ROC No Reversal\"**\r\n- Region: **case number starts with \"T\" → TDA; otherwise → CORP**\r\n- Enter: **case number** + **SSN** (999-00-0000 for the dummy participant)\r\n- The tool executes the reversal\r\n- Afterwards: run the verification query to confirm the dummy's records are cleared\r\n\r\n## Eligibility Navigation Path\r\n\r\n> Plan → top left dropdown → Outsourcing Summary → click Eligibility → Enable screen\r\n\r\n## See Also\r\n\r\n- [[eds]]\r\n- [[informatica]]\r\n- [[nbi]]\r\n- [[plan-classes]]\r\n- [[dummy-participant]]\r\n- [[eligibility-and-deferrals]]\r\n- [[final-files-processing]]\r\n- [[liquidation-day]]"},{"id":"concepts/payroll-file-automation","slug":"payroll-file-automation","rel":"concepts/payroll-file-automation.md","namespace":"reference","title":"Payroll File Automation","summary":"Setup rules for automated payroll file submission through PSD or FTP.","updated":"2026-05-13","created":"2026-05-13","sources":1,"status":"needs-review","tags":["concept","payroll","automation","eds","psd","ftp","p3"],"type":"concept","extras":[],"media":[],"meta":{"title":"Payroll File Automation","type":"concept","tags":["concept","payroll","automation","eds","psd","ftp","p3"],"created":"2026-05-13","updated":"2026-05-13","sources":1,"status":"needs-review"},"markdown":"# Payroll File Automation\n\nSetup rules for automated payroll file submission through PSD or FTP.\n\n## Definition\n\nPayroll file automation allows automated PSD or automated FTP clients to submit payroll files that map to EDS layouts. It depends on P3 remittance settings, EDS layout availability, user permissions, and FTP file-to-layout mapping.\n\n> [!warning] Source status\n> Built from legacy setup notes. Validate field names, permission groups, and ticket process before live use.\n\n## Why It Matters\n\nAutomation only works if the remittance settings, EDS layouts, PSD permissions, FTP mappings, and file movement are aligned. A missing PSD Availability flag or duplicate file name can prevent the file from being routed to the right layout.\n\n## Evidence / Examples\n\n### P3 Remittance Settings\n\n- `IM Payroll Automation?` must be set to Yes for automated PSD and automated FTP clients.\n- The field displays only for IM clients.\n- When enabled, `IM PSD Error Correction?` must be selected.\n- `TA Handles Errors` routes the AWD error report to the account manager.\n- `Client Handles Errors on PSD` routes the AWD error report to the end queue with status `EDSCOMPL`.\n\n### EDS Layout Requirement\n\n- Automated PSD and FTP clients must have at least one EDS layout where `PSD Availability?` is Yes.\n- Only layouts with PSD Availability set to Yes appear for automated client use.\n\n### PSD Automated Plans\n\n- One plan sponsor user needs all Automated Payroll File Access permissions so they can delegate permissions to other users.\n\n### FTP Automated Plans\n\n- Each submitted file type must be mapped to a layout name.\n- File name should exclude appended dates.\n- FTP folder name and file layout name are required.\n- File layout options come from EDS layouts with PSD Availability set to Yes.\n- File names must be unique.\n- Saved mappings write to `FTP_LAYOUT_MAP`.\n\n### INFRA Ticket\n\n- An INFRA ticket is needed to automatically move client files from the client folder to the target processing folder.\n- The ticket should include the from-folder, to-folder, and failure-notification recipients.\n- Source timing estimate: 3-4 business days.\n\n## Related Concepts\n\n- [[payroll-template]]\n- [[ftp-connection]]\n- [[eds]]\n- [[p3]]\n- [[wx]]\n\n## See Also\n\n- [[tc-stuff]]\n- [[roles/lm-dc]]\n- [[tc]]"},{"id":"concepts/payroll-handoff-at-go-live","slug":"payroll-handoff-at-go-live","rel":"concepts/payroll-handoff-at-go-live.md","namespace":"processes","title":"Payroll Handoff at Go-Live","summary":"The formal procedure for transferring an incomplete payroll testing project to the Fiduciary Services team at go-live. Effective February 26, 2026. When payroll testing is not finished by the conversion go-live date, the DC submits a FILESP","updated":"2026-05-03","created":"2026-04-15","sources":2,"status":"current","tags":["payroll","go-live","handoff","fiduciary-services","filespecrq","process"],"type":"process","extras":[],"media":[],"meta":{"title":"Payroll Handoff at Go-Live","type":"process","tags":["payroll","go-live","handoff","fiduciary-services","filespecrq","process"],"created":"2026-04-15","updated":"2026-05-03","sources":2,"status":"current"},"markdown":"# Payroll Handoff at Go-Live\n\nThe formal procedure for transferring an incomplete payroll testing project to the Fiduciary Services team at go-live. Effective February 26, 2026. When payroll testing is not finished by the conversion go-live date, the DC submits a FILESPECRQ AWD ticket and the COM notifies the Account Manager.\n\n## Definition\n\nIf a plan reaches go-live before payroll testing is complete, the project does not stop — it is formally handed off to an internal team (Fiduciary Services) that handles inforce payroll projects. The DC and COM have specific responsibilities to document and transfer the project cleanly.\n\n## Why It Matters\n\nPlans go live regardless of whether payroll is ready. Payroll testing delays are common (vendor responsiveness, client data issues, format problems). Without a formal handoff process, the payroll project would be orphaned at go-live with no team assigned. This procedure ensures continuity and documents who is responsible.\n\n## When This Applies\n\nThis procedure activates **only when payroll testing is still underway at go-live**. If testing is complete before go-live, no action is needed.\n\n## Operating Model — DC Owns Bridge Work, Still Hands Off At Live\n\nThe shift from prior practice: previously, the mid-market team carried a chunk of the payroll testing/validation work and the DC took over from \"wherever they were\" at handoff. Now the DC owns ALL of the bridge work — vendor onboarding, template walkthrough, EDS validation, OnePayroll handoff, client demo (see [[payroll-vendor-onboarding]] for the full flow).\n\n**The handoff at go-live still happens regardless of where testing landed.** Some plans are not done at live — sometimes by months — and that's fine. The point of the handoff procedure below is exactly so DCs aren't handcuffed to a plan after live just to finish payroll. Pass it off as is, as best as it can be passed off, and move on.\n\n> *\"We don't have to hold on to this until the very end, because some of these can go months after the live day. And we don't need to be handcuffed to these plans for that long.\"* — [[dc-brain-dump-002|brain dump #002]]\n\n## Process\n\n### COM's Role (Before and During Go-Live)\n- COM communicates during the conversion process that if payroll is not completed by go-live, testing will continue with a different internal Transamerica team\n- Payroll status is a standard **discussion topic at go-live meetings**\n\n### If Testing Is Not Complete at Go-Live\n\n**DC Actions:**\n1. **Submit an AWD ticket** — Ticket type: **FILESPECRQ**\n   - Include in ticket: payroll contact info, client contact info, payroll file layout, summary of current testing status, details of prior test file results (link to shared drive documents)\n2. **Coordinate with any internal DC team members** who have been assisting with payroll testing — notify them the project is being passed to Fiduciary Services\n3. **Update NBI** to reflect:\n   - Testing is not complete\n   - The FILESPECRQ AWD ticket was submitted\n\n**COM Actions:**\n1. **Notify the Account Manager (AM)** that payroll testing was not completed during transition and the AWD ticket was submitted for completion by Fiduciary Services\n\n**Client/Vendor Notification:**\n1. The client and payroll vendor are notified that the payroll project is being moved to a new team\n2. **If testing is underway:** COM and DC coordinate to introduce the AM who will be picking up the project\n3. **If testing has not yet started:** The AM will initiate contact directly\n\n### After Handoff\n- Fiduciary Services receives the FILESPECRQ AWD ticket and follows the **Inforce Payroll Projects** process to complete payroll for the installation\n- The DC's active involvement in payroll ends once the ticket is submitted and NBI is updated\n\n## Ticket Content Checklist\n\nWhen submitting the FILESPECRQ ticket, include:\n\n- [ ] Payroll vendor contact name and email\n- [ ] Client contact name and email\n- [ ] Payroll file layout (attach or link)\n- [ ] Summary of testing status (where in the process, what's been done)\n- [ ] Details of prior test file results (pass/fail, outstanding issues)\n- [ ] Link to shared drive folder with test files and layouts\n\n## Evidence / Examples\n\nFrom the DC Training Notebook (February 26, 2026):\n\n> \"Going forward, the COMs will communicate during the conversion process that if payroll is not completed prior to go live, payroll testing will continue with a different internal Transamerica Team.\"\n\n> \"LM DC will submit Ticket type = FILESPECRQ. Ticket to include payroll contact info, client contact info, payroll file layout and summary of current testing status including details of prior test file results.\"\n\n## Related Concepts\n\n- [[payroll-template]] — the file format being tested\n- [[ftp-connection]] — the upload channel being set up alongside testing\n- [[payroll-support]] — the One Payroll team involved in pre-go-live testing\n- [[nbi]] — must be updated with testing status and ticket number\n- [[plan-conversion-handoffs]] — the broader go-live handoff context\n\n## See Also\n\n- [[payroll-vendor-onboarding]]\n- [[plan-conversion-handoffs]]\n- [[payroll-template]]\n- [[ftp-connection]]\n- [[payroll-support]]\n- [[nbi]]\n- [[roles/lm-dc]]\n- [[roles/com]]"},{"id":"entities/payroll-support","slug":"payroll-support","rel":"entities/payroll-support.md","namespace":"departments","title":"Payroll Support (OnePayroll Team)","summary":"Also known as the OnePayroll Team. Performs production-level payroll testing — the final validation gate before a payroll setup goes live.","updated":"2026-05-03","created":"2026-04-14","sources":2,"status":"current","tags":["team","payroll-support","testing","validation","onepayroll"],"type":"department","extras":[],"media":[],"meta":{"title":"Payroll Support (OnePayroll Team)","type":"department","tags":["team","payroll-support","testing","validation","onepayroll"],"created":"2026-04-14","updated":"2026-05-03","sources":2,"status":"current"},"markdown":"# Payroll Support (OnePayroll Team)\r\n\r\nAlso known as the OnePayroll Team. Performs production-level payroll testing — the final validation gate before a payroll setup goes live.\r\n\r\n## Contact\r\n\r\n**Payroll Support:** `PAYROLLSUPPORT@transamerica.com`\r\n\r\n## Overview\r\n\r\nPayroll Support runs live-environment simulations of payroll files after the DC has already validated them through EDS. Because they run in a production-equivalent environment, they catch system-level errors and warnings that EDS cannot detect. Their approval is the final gate before payroll is considered production-ready.\r\n\r\n## Role in the Validation Chain\r\n\r\n```\r\nDC → EDS Validation → Payroll Support (OnePayroll) → Production Ready\r\n```\r\n\r\nThe DC validates files internally via EDS. Once clean, the DC sends them to Payroll Support. Payroll Support runs the same files through a live simulation. Feedback is returned if issues are found. If clean, they approve — payroll setup is complete.\r\n\r\n## What They Catch\r\n\r\n- System-level errors not visible in EDS\r\n- Warnings that only appear in the production environment\r\n- Format or mapping issues that EDS does not flag\r\n\r\n### Why Their Warnings Differ From EDS\r\n\r\nOnePayroll's import is the same import the **end user** (the client uploading payroll through the production page) will hit. The internal DC import strips out a lot of the warnings and errors that the production import surfaces. So even when EDS comes back perfectly clean, OnePayroll can still flag things — and those flags are exactly the things the client would see if they uploaded today. That's why the OnePayroll pass is its own gate, not just \"EDS again.\"\r\n\r\n## DC Interaction\r\n\r\n1. DC runs payroll test file through [[eds]] — reviews all output, iterates with vendor until clean\r\n2. DC sends clean file to Payroll Support\r\n3. Payroll Support runs production-level simulation\r\n4. **If issues found:** Payroll Support returns feedback → DC obtains new test file from vendor → repeat from step 1\r\n5. **If approved:** Payroll setup is complete — FTP can go live\r\n\r\n## Also Monitors\r\n\r\n- Payroll Support (along with Account Managers) monitors FTP uploads for failed deliveries after go-live\r\n- Escalation contact for significant FTP delays affecting clients\r\n\r\n## See Also\r\n\r\n- [[payroll-vendor-onboarding]]\r\n- [[payroll-template]]\r\n- [[ftp-connection]]\r\n- [[ftp-team]]\r\n- [[eds]]\r\n- [[dc-onboarding-workflow]]"},{"id":"concepts/payroll-template","slug":"payroll-template","rel":"concepts/payroll-template.md","namespace":"documents","title":"Payroll Template","summary":"The file format specification provided to clients and payroll vendors for ongoing payroll contribution uploads after conversion.","updated":"2026-05-03","created":"2026-04-14","sources":3,"status":"current","tags":["document","payroll","template","vendor","contributions"],"type":"document","extras":[],"media":[],"meta":{"title":"Payroll Template","type":"document","tags":["document","payroll","template","vendor","contributions"],"created":"2026-04-14","updated":"2026-05-03","sources":3,"status":"current"},"markdown":"# Payroll Templa
