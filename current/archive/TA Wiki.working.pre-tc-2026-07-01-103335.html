 affiliates look like setup details, but they change how participants experience the plan and how payroll, loans, distributions, statements, and reports behave. The source warns that multiple affiliates can create confusion and processing errors when participants move between affiliates or have balances in more than one affiliate.\n\n> [!warning] Source status\n> The procedure is legacy and references screenshots that are not included. Validate current P3/PSD screens before using the steps live.\n\n## Evidence / Examples\n\n### Adding Divisions\n\n- On the Divisions tab, indicators are set to Yes for statement divisions, enrollment divisions, non-plan-defined divisions, and EDS division validation.\n- Division number, name, and optional divisional contact are added.\n- Division numbers over four characters require customization through CTS Quality and may require a JIRA ticket.\n\n### Divisional Reporting in PSD\n\n- Enable division security in Plan Sponsor Website setup.\n- Confirm user-level division access through User Maintenance.\n- For outbound files, activate division/group reporting on the Outsourcing tab and assign divisions to group names.\n\n### Multiple Affiliate Risks\n\n- Participants may see multiple accounts and make elections under the wrong affiliate.\n- Deferral changes under the wrong affiliate can cause outbound file and payroll mismatches.\n- Loan availability and repayment can be affected when a participant changes affiliates.\n- Date of termination logic does not span affiliates.\n- Rollover deposits and contract exchanges can be misrouted if affiliate numbers are missing.\n- PSD reports may need client-side aggregation.\n- Common remitter setup may be needed to track limits across related plans.\n\n## Related Concepts\n\n- [[common-remitter-plans]]\n- [[deferrals]]\n- [[loan-setup]]\n- [[payroll-template]]\n- [[wx]]\n- [[p3]]\n\n## See Also\n\n- [[tc-stuff]]\n- [[tc]]\n- [[roles/lm-dc]]"},{"id":"roles/doc-ops","slug":"doc-ops","rel":"roles/doc-ops.md","namespace":"roles","title":"Document Operations (Doc Ops)","summary":"Document Operations supports plan setup, plan document handling, and special plan class setup during a conversion. Current documentation is mostly from DC and COM perspective, so this page should be treated as a working role map until a dir","updated":"2026-06-25","created":"2026-04-14","sources":2,"status":"needs-review","tags":["role","doc-ops","documents","p3","plan-setup","pep"],"type":"role","extras":[],"media":[],"meta":{"title":"Document Operations (Doc Ops)","type":"role","tags":["role","doc-ops","documents","p3","plan-setup","pep"],"created":"2026-04-14","updated":"2026-06-25","sources":2,"status":"needs-review"},"markdown":"# Document Operations (Doc Ops)\n\nDocument Operations supports plan setup, plan document handling, and special plan class setup during a conversion. Current documentation is mostly from DC and COM perspective, so this page should be treated as a working role map until a direct Doc Ops source is ingested.\n\n## What This Role Does\n\nDoc Ops appears in the wiki in two operating lanes:\n\n1. **Plan setup / P3 configuration**\n   - Sets up plan details in [[p3]].\n   - Adds new special plan classes when the plan design requires classes that do not already exist.\n   - Supports plan-class rules that come from the [[prd]] or [[onboarding-package]].\n\n2. **Plan documents / communications support**\n   - Receives document workflow inputs from [[roles/com]].\n   - For PEP plans, provides or supports OBP, AAA, Secure 2.0 amendment, and SPD document handling.\n   - Includes a Communication Consultant function tied to conversion newsletter coordination.\n\n## Boundaries\n\n| Work Area | Doc Ops Role | DC / COM Boundary |\n|---|---|---|\n| New special classes | Adds the class in P3 | [[roles/lm-dc]] identifies need and requests the addition |\n| Existing class names/codes | Not the primary owner in current notes | DC can update existing class names and codes |\n| PRD / onboarding package conflicts | Coordinates with COM when setup does not match documents | DC flags discrepancy; COM and Doc Ops coordinate fix |\n| PEP plan documents | Provides or supports OBP, AAA, Secure 2.0, SPD | COM routes and tracks document execution |\n| Conversion newsletter | Communication Consultant role participates | COM coordinates the checklist and collects address/email files |\n\n## Key Handoffs\n\n### Special Plan Classes\n\n- **From:** [[roles/lm-dc]] to Doc Ops\n- **Trigger:** Plan requires a new special class not already available in P3\n- **What moves:** Request for class addition\n- **Doc Ops action:** Adds the class in P3\n- **Risk:** DC cannot add these directly; waiting on Doc Ops can become a timing dependency\n\n### P3 Setup Readiness\n\n- **From:** Doc Ops / setup workflow to [[roles/lm-dc]]\n- **Trigger:** Plan setup becomes available in P3\n- **What moves:** P3 plan structure, classes, sources, eligibility setup, vesting, divisions\n- **DC action:** Reviews and verifies setup before specs and downstream files are finalized\n- **Risk:** If P3 is not ready, the DC may be blocked from completing specs or validating plan rules\n\n### PEP Plan Documents\n\n- **From:** Doc Ops / docs team to [[roles/com]]\n- **Trigger:** PEP plan document workflow\n- **What moves:** OBP, AAA, Secure 2.0 amendment, SPD, and related plan document materials\n- **COM action:** Routes documents for review, signature, and client-facing execution\n\n## Known References\n\n- [[plan-classes]] documents the clearest Doc Ops boundary: new special classes are Doc Ops only.\n- [[p3]] notes that P3 setup can happen before or after DC assignment, and earlier setup helps the DC begin specs.\n- [[roles/com]] documents Doc Ops interactions in the PEP plan document workflow and conversion newsletter workflow.\n- [[plan-conversion-handoffs]] captures Doc Ops as part of the conversion handoff model.\n\n## Source Notes\n\nThis page is assembled from [[sources/com-main-checklist]], [[plan-classes]], [[p3]], [[roles/lm-dc]], and [[plan-conversion-handoffs]]. It is still `needs-review` because there is no direct Doc Ops procedure source or role interview yet.\n\n## Open Questions\n\n- What is the exact request channel for special class additions: email, ticket, AWD, or another queue?\n- What fields does Doc Ops require when a new special class is requested?\n- Which P3 setup steps are owned by Doc Ops versus another setup team?\n- What does the Communication Consultant function own inside Doc Ops?\n- What Doc Ops tasks are PEP-only versus applicable to all plans?\n- What systems does Doc Ops use beyond P3, DocuSign-adjacent document routing, and internal document queues?\n\n## See Also\n\n- [[roles/lm-dc]]\n- [[roles/com]]\n- [[plan-classes]]\n- [[p3]]\n- [[plan-conversion-handoffs]]\n- [[prd]]\n- [[onboarding-package]]"},{"id":"entities/docusign","slug":"docusign","rel":"entities/docusign.md","namespace":"systems","title":"DocuSign","summary":"An electronic signature platform used by the roles/com to send plan documents and onboarding agreements to clients for signature.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["system","tool","com","e-signature","external"],"type":"system","extras":[],"media":[],"meta":{"title":"DocuSign","type":"system","tags":["system","tool","com","e-signature","external"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# DocuSign\n\nAn electronic signature platform used by the [[roles/com]] to send plan documents and onboarding agreements to clients for signature.\n\n## Overview\n\nDocuSign is an external e-signature service. In the Transamerica conversion workflow, the COM uses it as the primary channel for getting client signatures on formal plan documents. Multiple distinct document sets are routed through DocuSign depending on plan type.\n\n## Key Facts\n\n- External vendor platform (not a TA-built system)\n- Used exclusively by COM in the documented workflow\n- Two distinct use cases in PEP conversions:\n  1. **OBP package** — On-Boarding Package, PEA, and Info Sharing Form\n  2. **Plan documents** — AAA, Secure 2.0 amendment, and SPD\n\n## Role in Plan Conversions\n\n| Document Set | Plan Type | When |\n|---|---|---|\n| OBP + PEA + Info Sharing Form | PEP only | After OBP is created and tabs updated |\n| AAA + Secure 2.0 + SPD | PEP only | After internal and client plan doc review |\n\nNon-PEP document signature workflows are not yet documented — unclear whether DocuSign is used for non-PEP agreements.\n\n## Open Questions\n\n- Whether DocuSign is used for any non-PEP document workflows\n- Whether other roles (TC, Doc Ops) also use DocuSign\n- Whether TA has a specific DocuSign account/template setup or uses it generically\n\n## See Also\n\n- [[roles/com]]\n- [[onboarding-package]]\n- [[doc-ops]]"},{"id":"concepts/dummy-participant","slug":"dummy-participant","rel":"concepts/dummy-participant.md","namespace":"reference","title":"Dummy Participant","summary":"A placeholder participant (SSN 999-00-00) required in the census before running the Day of Wire Informatica workflow for mapping conversions.","updated":"2026-05-03","created":"2026-04-14","sources":3,"status":"current","tags":["dummy","mapping","day-of-wire","processing","workaround"],"type":"reference","extras":[],"media":[],"meta":{"title":"Dummy Participant","type":"reference","tags":["dummy","mapping","day-of-wire","processing","workaround"],"created":"2026-04-14","updated":"2026-05-03","sources":3,"status":"current"},"markdown":"# Dummy Participant\n\nA placeholder participant (SSN 999-00-00) required in the census before running the Day of Wire Informatica workflow for mapping conversions.\n\n## Overview\n\nThe Informatica Day of Wire workflow, when processing a mapping conversion, routes the initial transaction through a single fake participant account. This is a system requirement — the first booking is applied to the dummy account so that trades can go out. After participant balances are posted, the dummy's details are reversed.\n\n## Key Facts\n\n- **SSN:** 999-00-0000\n- **Date of Birth:** 12/25/1955 (stand-out value)\n- **Date of Hire:** 12/25/1985 (stand-out value)\n- **Required for:** Mapping conversions\n- **Not required for:** Cash conversions (advanced employer used instead), TIK conversions\n- **Must exist in census before** Day of Wire workflow runs — check this before liquidation day\n\n## Stand-Out Date Convention\n\nThe DOB and DOH above are deliberate. Anytime one of those dates shows up in a query result or P3 screen, it's an immediate signal: **this is not a real participant — handle it differently.** [[forfeiture-loading|Forfeiture entries]] use the same convention.\n\n## Lifecycle\n\n1. **Pre-liquidation:** Verify dummy participant exists in census\n2. **Day of Wire:** Informatica processes first transaction to dummy account → trades go out\n3. **After final files / balance posting:** Reverse dummy's details via ROC tool in P3\n4. **Post-reversal:** Only participant balances remain on the books; dummy is cleared\n\n## Why It Exists\n\nThe mapping Day of Wire workflow needs to process the full trade on liquidation day — but actual participant allocations can't be posted until final files arrive (which come later). The dummy account acts as a temporary holder so that trades go out immediately on liquidation day, getting money invested at that day's NAV. Participant details fill in later without generating new trades.\n\n## Reversal Process\n\nAfter posting participant balances:\n1. Go to [[p3]] → select **ROC** from the P3 menu bar\n2. Run query: **\"ROC No Reversal\"**\n   - **Case number starts with \"T\"** → use region **TDA**\n   - **Case number starts with anything else** → use region **CORP**\n3. Enter: **case number** + **SSN 999-00-0000**\n4. Execute — the tool reverses the dummy's records\n5. Run verification query to confirm dummy records are cleared\n6. Only participant-level data should remain on the books\n\n> The ROC tool is the **only place** DCs can make direct table changes. AQT is read-only.\n\n## Key Clarifications\n\n**Who adds the dummy participant?**\nThe **DC** adds it. Not Doc Ops.\n\n**Is the dummy reused or created fresh?**\nCreated fresh — **one dummy per plan**. Not reused across plans.\n\n**Is a dummy needed for partial TIK (mixed mapping + TIK funds)?**\nNo. The dummy is only required for **mapping funds** (re-reg = N). TIK funds create placeholders differently and do not need the dummy.\n\n**What happens if you forget the dummy before Day of Wire?**\n> The data won't load correctly and will need to be cleared by Prod Support. It's a nightmare. Don't do it.\n\nThis is one of the most painful avoidable mistakes in a conversion. Check for the dummy participant before running Day of Wire — every time.\n\n## See Also\n\n- [[conversion-types]]\n- [[informatica]]\n- [[liquidation-day]]\n- [[final-files-processing]]\n- [[p3]]\n- [[processes/tik-transfer|transfer-in-kind]]\n- [[forfeiture-loading]]"},{"id":"entities/earl-sanford","slug":"earl-sanford","rel":"entities/earl-sanford.md","namespace":"people","title":"Earl Sanford","summary":"Lead Data Consultant and primary training resource for new DC hires. 25+ year TA veteran.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["person","training","data-consultant","large-market"],"type":"person","extras":[],"media":[],"meta":{"title":"Earl Sanford","type":"person","tags":["person","training","data-consultant","large-market"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# Earl Sanford\r\n\r\nLead Data Consultant and primary training resource for new DC hires. 25+ year TA veteran.\r\n\r\n## Overview\r\n\r\nEarl Sanford is the Lead Data Consultant on the Large Market team. He is the person in charge of training new employees and serves as the main day-to-day support resource for incoming DC cohorts. He is the first stop for questions — on process, systems, edge cases, or anything else that comes up in the day-to-day work of a DC. He has been at TA for over 25 years, which means his institutional knowledge runs deep.\r\n\r\n## Key Facts\r\n\r\n- **Role:** Lead Data Consultant\r\n- **Team:** Large Market\r\n- **Tenure:** 25+ years at Transamerica\r\n- **Primary function for new hires:** Training, day-to-day support, and general resource for information\r\n- **Contact type:** Direct — approach freely\r\n\r\n## Role in Onboarding\r\n\r\nEarl leads the training of new Data Consultants. For a new hire, he is the primary human anchor: the person to shadow, to ask first, and to check with when something doesn't look right. His long tenure means he has seen nearly every edge case and exception. He is also a strong team player — colleagues across the team rely on him for guidance, not just new hires.\r\n\r\n## Open Questions\r\n\r\n- Earl's specific caseload or plan assignments alongside his training responsibilities\r\n\r\n## See Also\r\n\r\n- [[roles/lm-dc]]\r\n- [[onboarding/lm-dc]]\r\n- [[dc-onboarding-workflow]]"},{"id":"concepts/early-access","slug":"early-access","rel":"concepts/early-access.md","namespace":"processes","title":"Early Access","summary":"A pre-go-live window during which participants can access the Transamerica platform before the full plan is live. Early access is optional and COM-coordinated, with the roles/lm-dc providing the file and tc activating the feature.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["concept","process","com","tc","lm-dc","participant"],"type":"process","extras":[],"media":[],"meta":{"title":"Early Access","type":"process","tags":["concept","process","com","tc","lm-dc","participant"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# Early Access\n\nA pre-go-live window during which participants can access the Transamerica platform before the full plan is live. Early access is optional and COM-coordinated, with the [[roles/lm-dc]] providing the file and [[tc]] activating the feature.\n\n## Definition\n\nSome plans offer participants a period of early access — typically for enrollment purposes — before the conversion's official go-live date. This requires a specific early access file to be loaded into the system by the DC, and a system activation by TC.\n\n## Workflow\n\n1. COM requests the early access file template from [[roles/lm-dc]]\n2. DC provides the template\n3. COM sends the template to the client for completion\n4. Client completes and returns the file to COM\n5. COM submits the completed file to DC\n6. COM verifies with DC that the file has been submitted and loaded into the system\n7. COM emails [[tc]] to turn on early access — this happens the day before early access starts\n8. COM sends email to the plan notifying participants that early access is open\n\n## Why It Matters\n\nThe early access window gives participants time to log in, review their accounts, and make enrollment elections before the conversion is fully complete. The timing is tight: TC must be notified the day before, and the client file must be in the system before that notification is sent. Any delay in the client returning the file compresses the window significantly.\n\n## Evidence / Examples\n\n- Early access is marked \"if applicable\" in the COM checklist — not every plan uses it.\n- COM owns the full coordination chain; DC owns file loading; TC owns system activation.\n\n## Related Concepts\n\n- [[roles/lm-dc]] — provides file template; loads completed file to system\n- [[tc]] — activates early access in the system\n\n## See Also\n\n- [[roles/com]]\n- [[roles/lm-dc]]\n- [[tc]]\n- [[plan-conversion-handoffs]]"},{"id":"entities/eds","slug":"eds","rel":"entities/eds.md","namespace":"systems","title":"EDS","summary":"File validation and processing system used to test and run data file uploads (payroll, balance, census, etc.) before and during conversions.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["system","file-processing","validation"],"type":"system","extras":[],"media":[],"meta":{"title":"EDS","type":"system","tags":["system","file-processing","validation"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# EDS\r\n\r\nFile validation and processing system used to test and run data file uploads (payroll, balance, census, etc.) before and during conversions.\r\n\r\n## Overview\r\n\r\nEDS sits between the raw files coming from clients/vendors and [[p3]]. DCs use EDS to validate file layouts, catch errors and warnings, and process files into the system. It is the primary tool for ingesting all structured data files.\r\n\r\n## Full Name\r\n\r\n**Electronic Data System**\r\n\r\n## Access\r\n\r\nOpen [[p3]] → select EDS from the **P3 menu bar**. It is not a separate application — it is accessed directly through P3.\r\n\r\n## Key Functions\r\n\r\n- **File layout configuration** — DC sets up the column/field layout for each plan's files before testing begins\r\n- **File validation** — runs uploaded files against the configured layout, produces output with warnings and errors\r\n- **File processing** — runs validated files through to post data into P3\r\n\r\n## Layout Setup\r\n\r\nBefore any file (payroll test, base file, balance file) can be tested through EDS, the DC must set up the layout in EDS via the **P3 to EDS** module. This must be done ahead of receiving test files — do not wait until files arrive.\r\n\r\n> All layouts you'll need can be set up well in advance. Do it early.\r\n\r\n## Output — Warnings and Errors\r\n\r\nEvery EDS run produces output emails and/or logs. These **must be read carefully**:\r\n- **Errors** — records that failed to process; require fix and resubmit\r\n- **Warnings** — records that processed but had issues; may or may not require action\r\n\r\n> \"Very, very, very important to check those out.\" Reading EDS output is non-negotiable.\r\n\r\n## Payroll File Testing Flow\r\n\r\n1. DC sets up payroll layout in EDS\r\n2. DC receives test file from payroll vendor\r\n3. DC validates file in EDS — reviews output\r\n4. If issues: feedback to vendor → new test file → repeat\r\n5. Once clean: DC sends file to [[payroll-support|Payroll Support Team]] for deeper validation\r\n6. Payroll Support runs in live-equivalent environment, catches different errors\r\n7. Green light from Payroll Support → payroll setup complete\r\n\r\n## Limitations\r\n\r\n- EDS provides internal validation only; Payroll Support's validation is a deeper, production-equivalent run\r\n- Not used for the Day of Wire Informatica workflow (that uses [[informatica]] directly)\r\n\r\n## Accepted File Formats\r\n\r\nEDS accepts **all formats** — CSV, Excel, fixed-width. No format restrictions.\r\n\r\n## Multiple Layouts Per Plan\r\n\r\nYes — **many layouts can be set up per plan simultaneously**. Each data type (balance, YTD, deferrals, eligibility, payroll, census) gets its own layout. Set them all up early.\r\n\r\n## See Also\r\n\r\n- [[p3]]\r\n- [[informatica]]\r\n- [[payroll-template]]\r\n- [[base-file]]\r\n- [[final-files-processing]]"},{"id":"concepts/eds-load-beneficiary-requirements","slug":"eds-load-beneficiary-requirements","rel":"concepts/eds-load-beneficiary-requirements.md","namespace":"processes","title":"EDS Load Beneficiary Requirements","summary":"Requirements and data elements for loading participant beneficiary designation data through EDS.","updated":"2026-06-25","created":"2026-04-16","sources":1,"status":"needs-review","tags":["eds","beneficiary","process","system"],"type":"process","extras":[],"media":[],"meta":{"title":"EDS Load Beneficiary Requirements","type":"process","tags":["eds","beneficiary","process","system"],"created":"2026-04-16","updated":"2026-06-25","sources":1,"status":"needs-review"},"markdown":"# EDS Load Beneficiary Requirements\n\nRequirements and data elements for loading participant beneficiary designation data through EDS.\n\n## Current Documentation\n\nThe EDS hub page covers the general framework applicable to beneficiary loading:\n\n> **[[eds]] — see Key Functions, Layout Setup, and Output sections**\n\nBeneficiary loading fits within the standard EDS pattern:\n- DC sets up the beneficiary layout in EDS before files arrive\n- Each data type gets its own layout — beneficiary is set up independently\n- EDS validates the file against the layout and produces errors/warnings output\n- Output must be reviewed after every run\n\nThe source document (`raw/new mds/EDS LOAD BENEFICIARY REQUIREMENTS 06-17-2011.md.txt`, dated June 2011) exists but is currently empty. Note: the 2011 date means this document may describe legacy behavior — verify whether current procedures differ before relying on it.\n\n## Source Notes\n\nCurrent content is derived from the [[eds]] hub page general layout, validation, and output rules. Beneficiary-specific requirements still need a populated source document before this can be marked current.\n\n## Full Documentation\n\nWhen the source is populated and ingested, this page will cover: beneficiary-specific layout fields, required data elements (primary/contingent beneficiary, relationship, percentage), validation rules, and any special handling for plans with beneficiary data from a prior vendor.\n\n## See Also\n- [[eds]]\n- [[processes/eligibility-loading|loading-eligibility-eds]]\n- [[loading-ytd-contributions-eds]]\n- [[final-files-processing]]"},{"id":"concepts/eligibility-and-deferrals","slug":"eligibility-and-deferrals","rel":"concepts/eligibility-and-deferrals.md","namespace":"processes","title":"Eligibility and Deferrals","summary":"Overview of the relationship between deferral processing and eligibility processing during the final files phase. These are separate processes with a hard sequencing rule between them.","updated":"2026-04-14","created":"2026-04-14","sources":3,"status":"current","tags":["eligibility","deferrals","p3","processing","auto-enrollment","sequence"],"type":"process","extras":[],"media":[],"meta":{"title":"Eligibility and Deferrals","type":"process","tags":["eligibility","deferrals","p3","processing","auto-enrollment","sequence"],"created":"2026-04-14","updated":"2026-04-14","sources":3,"status":"current"},"markdown":"# Eligibility and Deferrals\n\nOverview of the relationship between deferral processing and eligibility processing during the final files phase. These are separate processes with a hard sequencing rule between them.\n\n> See [[deferrals]] and [[eligibility]] for full detail on each. This page covers the relationship and sequence.\n\n---\n\n## The Core Rule\n\n> **Deferrals first. Eligibility second. Always.**\n\nThese are separate processes. The only connection between them is sequence:\n- **[[deferrals]]** fill the system state — elections are in place\n- **[[eligibility]]** triggers system actions — auto-enrollment, eligibility logic, entry dates\n\nIf eligibility runs before deferrals are loaded, the system has nothing to check against. Auto-enrollment fires and overwrites elections that may not match the participant's actual deferral. Reversals are messy.\n\n---\n\n## The Sequence\n\n```\nFinal files arrive\n    ↓\nPost participant balances (see [[final-files-processing]])\n    ↓\nLoad DEFERRALS  ← FIRST\n    (including auto-enrollment data — see [[deferrals]])\n    ↓\nVerify all elections are correct\n    ↓\nSend internal approval email → QA / TC / COM\n    ↓\nWait for go-ahead\n    ↓\nEnable ELIGIBILITY in P3  ← SECOND\n    ↓\nLoad and process eligibility\n    ↓\nRun queries, verify\n```\n\n---\n\n## Why Order Matters\n\nMany plans have **auto-enrollment**: if a participant is eligible but has no deferral on file, the system enrolls them at a default rate (e.g., 1%). \n\n- Deferrals loaded first → system sees the election → skips auto-enrollment for that participant ✓\n- Eligibility first → no elections in place → auto-enrollment fires for everyone → overrides actual elections ✗\n\nReversing incorrect auto-enrollment entries is possible but painful. Don't allow the situation to occur.\n\n---\n\n## Key Differences\n\n| | Deferrals | Eligibility |\n|--|-----------|-------------|\n| What it does | Fills system state (elections) | Triggers system actions |\n| Complexity | High — data-driven, exception-heavy | Structured — rules-driven |\n| Main challenge | Auto-enrollment dates (esp. ADP) | Class/service rule configuration |\n| Error recoverability | Harder to unwind | Easier, but still painful |\n| SME | — | [[scott-vrba]] |\n\n---\n\n## See Also\n\n- [[deferrals]] — full detail on deferral processing\n- [[eligibility]] — full detail on eligibility processing\n- [[final-files-processing]] — the broader final files context\n- [[scott-vrba]] — eligibility SME\n- [[p3]]\n- [[dc-onboarding-workflow]]"},{"id":"processes/eligibility-loading","slug":"eligibility-loading","rel":"processes/eligibility-loading.md","namespace":"processes","title":"Eligibility Loading Through EDS","summary":"How eligibility data for plan participants is loaded into p3 using eds — replacing the legacy AQT path into `Part_Elig_src`.","updated":"2026-06-25","created":"2026-04-16","sources":1,"status":"current","tags":["process","eligibility","eds","cit","loading"],"type":"process","extras":[],"media":[],"meta":{"title":"Eligibility Loading Through EDS","type":"process","tags":["process","eligibility","eds","cit","loading"],"created":"2026-04-16","updated":"2026-06-25","sources":1,"status":"current"},"markdown":"# Eligibility Loading Through EDS\r\n\r\nHow eligibility data for plan participants is loaded into [[p3]] using [[eds]] — replacing the legacy AQT path into `Part_Elig_src`.\r\n\r\n## Overview\r\n\r\nThe EDS eligibility data type handles both eligible participants (direct insert) and non-eligible participants (routed through the nightly batch). It uses a fixed, pre-defined layout with automatic data elements. Sources can load independently — they do not need to arrive together.\r\n\r\nThis process is a subprocess of [[final-files-processing]] but also runs on its own whenever eligibility data needs to be refreshed.\r\n\r\n## Trigger\r\n\r\nAny of the following:\r\n- Final files include eligibility data that needs to be posted.\r\n- A client sends updated eligibility mid-plan.\r\n- A previously errored load has been corrected and needs re-posting.\r\n\r\n**Pre-requisite:** Participant enrollment data must already be loaded. Eligibility loading cannot proceed without it.\r\n\r\n## Steps\r\n\r\n### 1. Confirm Layout and File Type — DC\r\nThe eligibility layout is pre-defined and fixed — all data elements auto-included, none removable. Supported file types: flat file, comma-delimited, or Excel. Standard EDS formatting functions apply to SSNs and dates.\r\n\r\n### 2. Prepare Normalized File — DC\r\nData must be normalized. **One row per participant per source.** Never combine multiple sources per row.\r\n\r\n### 3. Validate Required Fields — DC\r\nPer participant row:\r\n\r\n| Field | Rules |\r\n|-------|-------|\r\n| SSN | With or without dashes |\r\n| Source ID | Individual Source IDs, or `0` for \"all sources\" when eligibility rules match across sources. May mix `0` and specific IDs in one file — but not for the same participant |\r\n| Eligibility Status | 0 (unknown), 1 (not eligible, kit needed), 2 (not eligible, no kit), 3 (eligible), 4 (excluded) |\r\n| Eligibility Date | Optional. Valid with status 1/2/3. If provided, Plan Entry Date must also be provided |\r\n| Plan Entry Date | Optional. Valid with status 1/2/3. If provided, Eligibility Date must also be provided |\r\n| Kit Mail Date | Optional. Only if Eligibility Date and Plan Entry Date both included |\r\n| Rehire Code | Y or N. Mixed values allowed in one file |\r\n\r\nUse `N` for non-rehires or eligible participants. Use `Y` only when rehire logic is enabled, the participant is not eligible, and rehire events exist.\r\n\r\n### 4. Choose Processing Type — DC\r\nReplaces the standard Validate Only flag:\r\n\r\n| Type | When to Use |\r\n|------|-------------|\r\n| **Validate** | Test data. Validates against plan rules without posting |\r\n| **Validate/Commit** | Default for live data. Validates and posts |\r\n| **Commit Only** | Small populations that previously errored and have been corrected. Posts with limited validation |\r\n\r\n### 5. Decide When CIT Eligibility Job Runs — DC\r\nAt load time, tick the **Run Eligibility** checkbox to trigger the CIT Eligibility job immediately after the EDS load. If left unchecked, the job can be launched later from the Work Queue.\r\n\r\n> EDS Eligibility and CIT Eligibility are functionally the same process but are separate jobs.\r\n\r\n### 6. Submit the Load — DC\r\nEDS validates that eligibility is enabled on the plan and that the specified Source IDs exist. Standard formatting edits (dates, SSNs) run first.\r\n\r\n### 7. Wait for the Job Completion Email — DC\r\nWhen the CIT Eligibility job completes, an automated email arrives with load details and links to the error/warning reports.\r\n\r\n### 8. Review and Handle Warnings — DC\r\nCIT Eligibility edits vary by processing type. Example: in Validate/Commit, if a provided date doesn't match plan-rule calculation, a warning is issued. In Commit Only mode, that same mismatch produces no warning.\r\n\r\nFull edit list lives in the Functional Requirements document. Review every warning; re-submit corrections using Commit Only if appropriate.\r\n\r\n## Handoff Points\r\n\r\n| # | From → To | What Moves | Risk |\r\n|---|-----------|------------|------|\r\n| 1 | DC → EDS | Normalized eligibility file | Mixed `0` and specific Source IDs for same participant → EDS error |\r\n| 2 | EDS → CIT Eligibility job | Validated load | If \"Run Eligibility\" not checked, job waits indefinitely until manually triggered |\r\n| 3 | CIT Eligibility → DC inbox | Job completion email with error report links | Email ignored → silent data problems persist into go-live |\r\n\r\n## Timing / Deadlines\r\n\r\n- **Deferrals must load first.** See [[eligibility-and-deferrals]] — posting eligibility before deferrals breaks the enrollment logic.\r\n- **Enrollment data loaded first.** Hard pre-requisite.\r\n- **Balance posting loaded first.** Part of the final-files sequence — see [[final-files-processing]].\r\n\r\n## Failure Modes\r\n\r\n- **Missing enrollment data.** Load aborts; eligibility cannot attach to non-existent participants.\r\n- **Eligibility Date without Plan Entry Date (or vice versa).** EDS rejects the row.\r\n- **Mixed Source IDs per participant.** Using `0` and a specific Source ID on the same SSN causes an EDS error.\r\n- **Wrong Rehire Code.** `Y` only applies when rehire logic is enabled, participant is not eligible, and rehire events exist. Otherwise use `N`.\r\n- **Processing type mismatch.** Commit Only skips the rule-match check — use only for pre-validated corrections.\r\n- **\"Run Eligibility\" not checked and never launched.** Data sits in the Work Queue; nobody notices until downstream breakage.\r\n\r\n## See Also\r\n\r\n- [[eds]]\r\n- [[eligibility]]\r\n- [[eligibility-and-deferrals]]\r\n- [[final-files-processing]]\r\n- [[loading-basis-eds]]\r\n- [[loading-ytd-contributions-eds]]\r\n- [[roles/lm-dc]]"},{"id":"concepts/eligibility","slug":"eligibility","rel":"concepts/eligibility.md","namespace":"processes","title":"Eligibility Processing","summary":"The process of enabling plan eligibility rules in P3 so the system begins applying them to participants. Always runs after deferrals — eligibility triggers system actions; deferrals must already be in place first.","updated":"2026-04-15","created":"2026-04-14","sources":4,"status":"current","tags":["eligibility","p3","processing","auto-enrollment","final-files","ltpt"],"type":"process","extras":[],"media":[],"meta":{"title":"Eligibility Processing","type":"process","tags":["eligibility","p3","processing","auto-enrollment","final-files","ltpt"],"created":"2026-04-14","updated":"2026-04-15","sources":4,"status":"current"},"markdown":"# Eligibility Processing\n\nThe process of enabling plan eligibility rules in P3 so the system begins applying them to participants. Always runs after [[deferrals]] — eligibility triggers system actions; deferrals must already be in place first.\n\n## Core Rule\n\n> **Eligibility triggers system actions. Deferrals must fill the system state first.**\n\nOnce eligibility is enabled, P3 begins running auto-enrollment logic, entry date calculations, and other automated processes. If deferrals aren't already posted, those actions will override or conflict with participant elections. Enable eligibility only when the system state is ready.\n\n## What Eligibility Does\n\nEnables the plan's eligibility rules in P3 per source. Once enabled:\n- The system applies eligibility logic to participants (who qualifies, when they enter)\n- Auto-enrollment triggers for participants without a deferral on file\n- Eligibility dates and entry dates are calculated based on P3 rule configuration\n\n## Data Sources (Preferred Order)\n\n1. **Full client population data** — best case; most accurate and comprehensive\n2. **Vendor data** — acceptable; may require validation\n3. **Manual calculation** — least ideal; use only when client and vendor data are unavailable\n\nThe client decides which source to use. This decision must be confirmed before final files arrive.\n\n## P3 Rule Engine\n\nEligibility in P3 is rules-driven and structured. Key rule types:\n\n- **Class-based eligibility** — different classes (union, part-time, special groups) can have different eligibility rules. See [[plan-classes]].\n- **Service requirements** — hours worked, months of service, or both; configured per source\n- **Eligibility date vs. Entry date** — when a participant *becomes* eligible vs. when they *enter* the plan (may differ by plan design)\n- **\"ALL\" class** — if the plan uses a single \"ALL\" class, eligibility is the simplest possible: minimal restrictions, everyone eligible on the same terms\n\n## Which Sources to Process\n\n**Only enable eligibility for sources that will receive contributions.** Never enable non-contributing sources — it creates unnecessary batch jobs and orphaned eligibility records.\n\nThe list of contributing sources comes from the [[source-mapping]] and the [[prd]] or [[onboarding-package]].\n\n## Workflow\n\n1. **Prepare the eligibility file** (from final files via [[eds]] layout)\n2. **Send internal approval email** to QA, TC, and COM — use the standard template\n   > Essence: \"I'm about to start working. Go do your thing first.\"\n   - Standard email template exists — do not write from scratch\n   - Turnaround: same day, within the hour\n3. **Wait for go-ahead** from QA/TC/COM before proceeding\n4. **Enable in P3** — navigation: Plan → top left dropdown → Outsourcing Summary → Eligibility → Enable screen\n   - Enable only contributing sources\n5. **Load and process** eligibility\n6. **Verify** — run queries, confirm results\n\n## P3 Navigation\n\n> Plan → top left dropdown → Outsourcing Summary → click Eligibility → Enable screen\n\n## Auto-Enrollment Interaction\n\nIf a plan has auto-enrollment and a participant has **no deferral on file** when eligibility runs:\n- The system auto-enrolls them at the default rate (e.g., 1%)\n- This overrides what may be the participant's actual election\n\n**Prevention:** [[deferrals]] must be loaded before eligibility. The auto-enrollment logic checks for an existing deferral — if one is present, the participant is skipped.\n\nIf auto-enrollment fires before deferrals are posted: technically reversible, but it's a pain. Don't let it happen.\n\n## Eligibility Dates\n\nDetermined by one of three sources — client decides in advance:\n- Straight from the client's records\n- Straight from the prior vendor\n- Calculated by the eligibility rules configured in P3\n\nEligibility cannot be pre-active in P3 before the DC enables it. It runs plan by plan.\n\n## LTPT — Long-Term Part-Time Eligibility (Secure Act 2.0)\n\nAs of **January 1, 2025**, a new federal eligibility category applies to all 401(k) and 403(b) plans: **LTPT (Long-Term Part-Time) eligibility**.\n\n**Rule:** Employees who work at least **500 hours in two consecutive 12-month eligibility computation periods** (age 21 minimum) become eligible to make elective deferrals — regardless of the plan's standard eligibility requirements.\n\n**Key points for the DC:**\n- LTPT employees can only make **elective deferrals** — not eligible for employer contributions unless they also meet standard eligibility\n- New EDS status codes: **5** = Not eligible, kit mailed due to LTPT; **6** = Eligible, LTPT\n- **Even excluded-class employees** (collectively bargained, non-resident aliens) should have hours tracked — in case they move to a covered class\n- Hours data must be requested going back through the relevant computation periods; request **by pay period**\n- The previous threshold was three consecutive years for 401(k); reduced to two as of January 1, 2025\n\nSee [[ltpt-eligibility]] for the full concept reference.\n\n## SME\n\n**[[scott-vrba]]** is the primary eligibility resource. Go to him for complex eligibility questions, unusual rule configurations, or anything outside standard class/service patterns.\n\n## Characteristics\n\n- **Rules-driven and structured** — consistent, predictable, driven by P3 configuration\n- **Errors are recoverable** but reversals are painful — do it right the first time\n- Much simpler than [[deferrals]] in terms of data complexity; the complexity lives in the P3 rule setup\n\n## See Also\n\n- [[deferrals]] — must be processed before eligibility\n- [[eligibility-and-deferrals]] — overview of the relationship and sequence\n- [[ltpt-eligibility]] — Long-Term Part-Time eligibility (Secure Act 2.0)\n- [[final-files-processing]] — broader final files context\n- [[plan-classes]] — class-based eligibility rules\n- [[p3]] — system where eligibility is enabled\n- [[scott-vrba]] — eligibility SME\n- [[dc-onboarding-workflow]]"},{"id":"entities/ellen-miller","slug":"ellen-miller","rel":"entities/ellen-miller.md","namespace":"people","title":"Ellen Miller","summary":"Internal contact who manages the plan assignment process on the NBI side, reaching out to DC managers when new plan slots need to be filled.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":[],"type":"person","extras":[],"media":[],"meta":{"title":"Ellen Miller","type":"person","tags":"","created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current","aliases":""},"markdown":"# Ellen Miller\r\n\r\nInternal contact who manages the plan assignment process on the NBI side, reaching out to DC managers when new plan slots need to be filled.\r\n\r\n## Overview\r\n\r\nEllen Miller acts as the liaison between the NBI system and DC managers when new plan assignments come in with empty spots. She notifies managers of available assignments so they can distribute plans to appropriate Data Consultants.\r\n\r\n## Key Facts\r\n\r\n- Contacts DC managers (not DCs directly) when new plan assignments have unfilled DC slots\r\n- Part of the [[nbi]] assignment pipeline\r\n- Role appears to be on the operations/coordination side rather than data\r\n\r\n## Role in the Assignment Process\r\n\r\nWhen a new sale assignment comes out and gets loaded into NBI with empty DC spots:\r\n1. Ellen Miller reaches out to the DC's manager\r\n2. Manager reviews caseload, conversion type, and capacity\r\n3. Manager assigns the plan to a specific DC\r\n4. Plan is now officially on the DC's radar\r\n\r\n## Additional Notes\r\n\r\n- **Department:** Unknown — she communicates across many departments\r\n- **Team:** Likely has a team (not confirmed)\r\n- **Plan types:** Handles **all plans** — not limited to specific types or market segments\r\n\r\n## See Also\r\n\r\n- [[nbi]]\r\n- [[dc-onboarding-workflow]]"},{"id":"entities/eric-leytem","slug":"eric-leytem","rel":"entities/eric-leytem.md","namespace":"people","title":"Eric Leytem","summary":"Key contact on the ftp-team who handles the final step of FTP account setup and sends confirmation to the DC.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["person","ftp","payroll","file-transfer"],"type":"person","extras":[],"media":[],"meta":{"title":"Eric Leytem","type":"person","tags":["person","ftp","payroll","file-transfer"],"aliases":["eric-leyten"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# Eric Leytem\r\n\r\nKey contact on the [[ftp-team]] who handles the final step of FTP account setup and sends confirmation to the DC.\r\n\r\n## Overview\r\n\r\nEric Leytem is the DC's primary point of contact on the FTP Team. Once the FTP Team completes account setup for a payroll vendor, Eric sends the confirmation that the connection is live and ready. He is also the go-to contact for FTP status updates and any setup questions.\r\n\r\n## Key Facts\r\n\r\n- **Team:** [[ftp-team]]\r\n- **Role:** Final FTP setup and confirmation\r\n- **Contact type:** Email\r\n- **When to engage:** After submitting FTP setup request; follow up with Eric if confirmation is delayed\r\n\r\n## Open Questions\r\n\r\n- Whether Eric handles all FTP setups or only certain plan types\r\n\r\n## See Also\r\n\r\n- [[ftp-team]]\r\n- [[jen-curtin]]\r\n- [[ftp-connection]]\r\n- [[payroll-template]]"},{"id":"sources/extra-questions-001","slug":"extra-questions-001","rel":"sources/extra-questions-001.md","namespace":"sources","title":"Extra Questions — Round 4 Answers","summary":"Answers to all outstanding open questions across the wiki. Provided by DC (Marcus) via written Q&A. Covers 20+ pages.","updated":"2026-04-14","created":"2026-04-14","sources":1,"status":"current","tags":["q-and-a","clarifications","open-questions"],"type":"source","extras":[],"media":[],"meta":{"title":"Extra Questions — Round 4 Answers","type":"source","tags":["q-and-a","clarifications","open-questions"],"created":"2026-04-14","updated":"2026-04-14","sources":1,"status":"current"},"markdown":"# Extra Questions — Round 4 Answers\n\nAnswers to all outstanding open questions across the wiki. Provided by DC (Marcus) via written Q&A. Covers 20+ pages.\n\n## Summary\n\nThis source resolves nearly every open question flagged during the initial brain dump and follow-up rounds. Key areas covered: file formats and template locations, P3 navigation paths, system access details, team ownership clarifications, process nuances, and a handful of \"how do you actually handle X\" answers that weren't in the original brain dump.\n\n## Key Claims\n\n- Audit pack: Excel, stored at `root/Conversion/Contract`, same template for all conversion types, QA reviews same day\n- Base file: Excel, standard TA template trimmed per client; census loaded when population confirmed; rest at conversion time\n- Dummy participant: DC adds it, one per plan, only for mapping funds (not TIK), nightmare if forgotten\n- Eligibility P3 path: Plan → top left dropdown → Outsourcing Summary → Eligibility → Enable screen; go-ahead within the hour\n- CIT balance file structure: Case Number, Region, SSN, Source, Fund, Total\n- One EDS layout per data type (not combined)\n- Client decides whether to use vendor or own data for eligibility/deferrals\n- FTP setup via email to FTP team; each plan has its own destination folder\n- FMC owned by cashiering/trading; email backup process exists for missed cutoffs; TIK funds don't require FMC entries\n- Fund mapping TA-internal fields: Filter, Vendor Fund Code, Ref #, Split Ratio, Split Code, Total\n- Neither fund mapping nor source mapping is loaded to the system — both are reference docs used in workflows\n- P2 navigation for trans ref numbers: CORP07/tdatest → 2001 → contract/affiliate # → option 4 → trans code 1006 → proc code 3\n- Trans ref number format: YYYYMMDD + 7-8 random alphanumeric characters\n- PRD created by COM using standard TA template; signed early in the process\n- Prior RK contact known from day of assignment; questionnaire sent in hello email; relationship shared across team\n- Re-reg form: Excel, in front folder of DC folder\n- TIK tracker spreadsheet: DC fills in expected shares from final files; Matt's team updates it when shares arrive\n- Wire instructions: standard template; Assurance Code on P3 (Plan → General Plan → Assurance Codes) determines account\n- NBI full name: New Business Intelligence; web-based; all plans visible including history; standard checklist\n- Informatica: standalone app; CONV file fields fully specified\n- Stacey Fortune: Large Market dept; general knowledge resource; title unknown (humorous response)\n- Prod Support: 1-2 day standard turnaround; same-day for urgent liquidation-day corrections\n\n## Key Quotes\n\n> \"The data won't load correctly and will need to be cleared by Prod Support. It's a nightmare. Don't do it.\" — on forgetting the dummy participant\n\n> \"You gotta deal with it. Keep on banging on them. Happens a lot.\" — on unresponsive prior record keepers\n\n> \"It can delay trades that day... if we can't get into the actual file in our first try, we send an email with the details so they have it on file.\" — on missing the FMC cutoff\n\n> \"Not our job. Account Managers do that.\" — on adding new sources to payroll templates post-conversion\n\n> \"Awesome ass bad ass. I don't know for sure ;)\" — on Stacey Fortune's title\n\n## Entities Mentioned\n\n[[ellen-miller]], [[matt-oconnell]], [[stacey-fortune]], [[nick-lister]], [[prod-support]], [[eds]], [[informatica]], [[nbi]], [[p2]], [[p3]]\n\n## Concepts Mentioned\n\n[[audit-pack]], [[base-file]], [[dummy-participant]], [[eligibility-and-deferrals]], [[final-files-processing]], [[ftp-connection]], [[fund-management-calendar]], [[fund-mapping]], [[liquidation-day]], [[onboarding-package]], [[payroll-template]], [[plan-classes]], [[prd]], [[prior-record-keeper]], [[source-mapping]], [[subpack]], [[toa]], [[processes/tik-transfer|transfer-in-kind]], [[wire-instructions]]\n\n## Contradictions / Open Questions\n\n**Still open after this source:**\n1. FMC shared drive path (exact location)\n2. Common prior RK workflows (Fidelity, Vanguard, Empower) — built by DC, not yet documented\n3. DC query library — many verification queries referenced, to be documented separately\n4. Informatica Day of Wire test mode — DC to confirm whether full execution test is possible\n5. DC folder workflows (WFs) — still being tuned, documentation pending\n\n## See Also\n\n- [[sources/dc-brain-dump-001]]\n- [[overview]]\n- [[dc-onboarding-workflow]]"},{"id":"glossary/faa","slug":"faa","rel":"glossary/faa.md","namespace":"glossary","title":"FAA","summary":"**Full Name:** Fund Asset Allocation","updated":"2026-04-16","created":"2026-04-16","sources":1,"status":"current","tags":["glossary","fund","allocation","data"],"type":"glossary","extras":[],"media":[],"meta":{"title":"FAA","type":"glossary","tags":["glossary","fund","allocation","data"],"created":"2026-04-16","updated":"2026-04-16","sources":1,"status":"current"},"markdown":"# FAA\n\n**Full Name:** Fund Asset Allocation\n\n## Definition\n\nFAA refers to the fund asset allocation data requirements that the DC must satisfy during a conversion — the specific data fields and formats the prior record keeper must provide for fund-level allocation processing.\n\n## Used By\n\n- [[roles/lm-dc]] — DC is responsible for gathering and processing FAA data from the prior RK\n- [[entities/eds]] — FAA data is loaded through EDS layouts\n- [[entities/informatica]] — allocation module processes FAA data\n\n## See Also\n\n- [[fund-mapping]]\n- [[source-mapping]]\n- [[informatica-allocation-module]]"},{"id":"glossary/filespecrq","slug":"filespecrq","rel":"glossary/filespecrq.md","namespace":"glossary","title":"FILESPECRQ","summary":"**Full Name:** File Specification Request","updated":"2026-04-15","created":"2026-04-15","sources":1,"status":"current","tags":["glossary","awd","payroll","ticket-type"],"type":"glossary","extras":[],"media":[],"meta":{"title":"FILESPECRQ","type":"glossary","tags":["glossary","awd","payroll","ticket-type"],"created":"2026-04-15","updated":"2026-04-15","sources":1,"status":"current"},"markdown":"# FILESPECRQ\n\n**Full Name:** File Specification Request\n\n## Definition\n\nFILESPECRQ is an [[awd]] ticket type used by the [[roles/lm-dc]] to hand off incomplete payroll testing to Fiduciary Services at go-live. When payroll testing is not finished by the plan's go-live date, the DC submits a FILESPECRQ ticket containing the payroll vendor contact, client contact, file layout, and a summary of the current testing status. Fiduciary Services then takes over the payroll testing project using their Inforce Payroll Projects process.\n\nThis procedure became effective February 26, 2026.\n\n## Used By\n\n- [[roles/lm-dc]] — submits the ticket at go-live when payroll is not yet complete\n\n## See Also\n\n- [[payroll-handoff-at-go-live]] — full procedure\n- [[awd]]\n- [[roles/lm-dc]]"},{"id":"processes/final-files-processing","slug":"final-files-processing","rel":"processes/final-files-processing.md","namespace":"processes","title":"Final Files Processing","summary":"How the DC processes authoritative as-of-liquidation files from the prior record keeper to populate p3 with real participant data.","updated":"2026-05-03","created":"2026-04-14","sources":3,"status":"current","tags":["process","final-files","balances","posting","cit","eds","conversion"],"type":"process","extras":[],"media":[],"meta":{"title":"Final Files Processing","type":"process","tags":["process","final-files","balances","posting","cit","eds","conversion"],"created":"2026-04-14","updated":"2026-05-03","sources":3,"status":"current"},"markdown":"# Final Files Processing\n\nHow the DC processes authoritative as-of-liquidation files from the prior record keeper to populate [[p3]] with real participant data.\n\n## Overview\n\nFinal files arrive after liquidation. They carry the definitive participant data: balances by source and fund, YTD contributions, compensation, hours, deferral elections, and eligibility. The DC loads them through [[eds]] and [[informatica]] in a strict sequence — balance first, then deferrals, then eligibility, then YTD.\n\nThe specific balance-posting steps differ by [[conversion-types|conversion type]] (cash, mapping, or TIK). Everything else runs the same.\n\n## Trigger\n\nThe prior record keeper delivers the final files, typically within 5–10 business days after [[liquidation-day|Liquidation Day]]. The DC has already built all EDS layouts in advance so they can run immediately.\n\n## What's in Final Files\n\n- **Participant balances** by source and fund (as of liquidation date)\n- **YTD contributions** by source\n- **YTD compensation** (and prior year comp if applicable)\n- **Hours** (current year and prior year if applicable)\n- **Deferral elections** (by source, dollar or percentage)\n- **Eligibility data** (status, dates)\n\n## Processing Sequence\n\n**Critical order — do not reverse:**\n1. Post participant balances\n2. Post deferral elections\n3. Enable eligibility (after deferrals, always)\n4. Post YTD data (comp, contributions, hours)\n\nSee [[eligibility-and-deferrals]] for the eligibility/deferral rules.\n\n### Why Elections + Loans Get Top Priority Right After Balances\n\nOnce balances are posted, the next two things on the priority list are **elections** (deferrals) and **loans** (final reconciliation / Phase III takeover — see [[loan-setup]]). Everything else is secondary.\n\nThe reason: once balances + elections + loans are settled, **payrolls can begin processing even before the plan is technically live**. Elections tell the system where the contributions go; loans tell it where loan repayments split. With both in place, payroll can run cleanly on the first available pay period — no missed beats.\n\nIf elections or loans are still pending when payrolls start coming in, contributions either default (and have to be unwound later) or the loan repayments fail to allocate correctly. Both are clean-up nightmares. So once balances are down, elections and loans jump the queue.\n\n## Steps\n\n### 1. Confirm Client Source Policy — DC\nBefore loading, confirm what is being used from final files vs. the [[base-file]]. The client decides in advance — all vendor data, all base data, or a hybrid (e.g., \"use our data for eligibility only\"). This governs which files load into which layouts.\n\n### 2. Build CIT Balance File — DC\nConstruct the balance file from the final files.\n- Structure: `Case Number | Region | SSN | Source | Fund | Total`\n- One row per participant per source per fund.\n- Distinct from the [[conv-file]], which is fund-level — this is participant-level.\n\n### 3. Test CIT Balance Workflow — DC via Informatica\nRun the balance workflow in test mode. Catch layout and mapping errors before production. Always test; don't skip.\n\n### 4. Post Balances — DC via Informatica → P3\n**Processing mode depends on conversion type.** Trades fire only once per fund, so choose carefully.\n\n#### Cash conversion\n1. Request [[advanced-employer]] liquidation — email [[stacey-fortune]] or [[nick-lister]].\n2. Run participant balance workflow (production).\n3. In P3: **Process Immediate + Batch**. Trades go out to invest participant cash.\n4. Reverse [[dummy-participant]] via ROC tool.\n5. Verify balances in P3.\n\n#### Mapping conversion\n1. Run participant balance workflow (production).\n2. Reverse [[dummy-participant]] via ROC tool.\n3. In P3: **Online + No Hold** (NOT Process Immediate). Trades already fired on Day of Wire via the dummy account — posting only books the detail.\n4. Verify balances in P3.\n\n#### Transfer in Kind\n1. Update [[matt-oconnell]]'s share estimates with final-file totals immediately.\n2. Run participant balance workflow — fills the placeholder from Day of Wire.\n3. In P3: **Online + No Hold**. Shares are at Fidelity; no trades needed.\n4. Verify. See [[tik-transfer]] for the full TIK track.\n\n### 5. Post Deferral Elections — DC\nLoad via EDS deferral layout. Must happen before eligibility — see [[eligibility-and-deferrals]].\n\n### 6. Enable Eligibility — DC\nLoad via EDS eligibility layout. Triggers the CIT Eligibility job. See [[processes/eligibility-loading|loading-eligibility-eds]] for the detailed subprocess.\n\n### 7. Post YTD Data — DC\nThree separate EDS loads: YTD contributions, YTD compensation, hours. See [[loading-ytd-contributions-eds]] and [[hours-procedure]].\n\n### 8. Post-Processing Verification — DC\n- Run standard query set — counts, totals, source breakdown.\n- Review EDS output emails for warnings and errors.\n- Build the [[audit-pack]].\n- Update [[nbi]].\n\n## CIT Balance File\n\nThe input file for the Informatica participant balance workflow. Built by the DC from final files. Contains participant-level balance data by source. The Informatica workflow processes this file and posts balances to Bill Remit detail in P3.\n\n**Structure:** `Case Number | Region | SSN | Source | Fund | Total`\n\nNote the key difference from the [[conv-file]]: the CIT balance file is **participant-specific** (one row per participant per source per fund). The CONV file is **fund-specific** (one row per fund).\n\n## EDS Layouts for Final Files\n\nAll EDS layouts for final file types should be set up well before final files arrive. Don't wait — build them early. When files come in, you want to be able to run immediately.\n\n**One layout per data type** — balance, YTD contributions, YTD comp, hours, deferrals, and eligibility each get their own separate EDS layout. There is no combined layout.\n\n## Client Data vs. Vendor Data\n\nFor eligibility and deferral data specifically: **the client decides** whether to use vendor data or their own data. This decision must be known before final files arrive so the DC knows which files to use.\n\n## Handoff Points\n\n| # | From → To | What Moves | Risk |\n|---|-----------|------------|------|\n| 1 | Prior RK → DC | Final files | Late delivery stalls every downstream step |\n| 2 | DC → Informatica → P3 | CIT balance file | Wrong processing mode → duplicate or missing trades |\n| 3 | DC → ROC tool in P3 | Dummy participant reversal (cash + mapping only) | Skipped reversal leaves phantom balance in plan |\n| 4 | DC → [[matt-oconnell]]'s team | Updated share estimates (TIK) | Stale estimates → shares sit unclaimed |\n| 5 | DC → QA / TC | Completed posting + audit pack | Missing verification queries → errors discovered after go-live |\n\n## P3 Processing Mode Reference\n\n| Conversion | Step | Mode | Trades Fire? |\n|------------|------|------|-------------|\n| Cash | Balance posting | Immediate + Batch | Yes |\n| Mapping | Balance posting | Online + No Hold | No (fired on Day of Wire) |\n| TIK | Balance posting | Online + No Hold | No (shares already at Fidelity) |\n\n> **Rule:** Trades fire only ONCE per fund. Confirm which earlier step already sent them before choosing the mode.\n\n## Timing / Deadlines\n\n- **Before final files arrive:** all EDS layouts built and tested.\n- **Final files received:** begin balance processing immediately.\n- **Balance → Deferrals → Eligibility → YTD:** strict order, no reordering.\n- **Audit pack due:** before go-live sign-off.\n\n## Failure Modes\n\n- **Reversing the sequence.** Posting eligibility before deferrals corrupts the enrollment logic.\n- **Wrong P3 mode.** Process Immediate on a mapping or TIK conversion fires duplicate trades — requires reversal via [[reversal-submission]].\n- **Forgetting the dummy participant reversal.** Leaves a phantom balance that shows up in every subsequent audit query.\n- **Stale TIK share estimates.** Matt's team can't match incoming shares → delayed posting.\n- **EDS layout not built in advance.** Final files arrive but there's nowhere to load them → days of avoidable delay.\n- **Using wrong data source.** Loading vendor eligibility when client chose base-file eligibility (or vice versa) requires full rework.\n\n## Open Questions\n\n- What queries are run to verify balances after posting? *(Many — will be documented separately)*\n\n## See Also\n\n- [[liquidation-day]]\n- [[tik-transfer]]\n- [[processes/eligibility-loading|loading-eligibility-eds]]\n- [[loading-ytd-contributions-eds]]\n- [[dummy-participant]]\n- [[conversion-types]]\n- [[eligibility-and-deferrals]]\n- [[audit-pack]]\n- [[plan-conversion-handoffs]]\n- [[roles/lm-dc]]\n- [[informatica]]\n- [[eds]]\n- [[p3]]\n- [[base-file]]\n- [[conv-file]]\n- [[loan-setup]]"},{"id":"concepts/forfeiture-loading","slug":"forfeiture-loading","rel":"concepts/forfeiture-loading.md","namespace":"processes","title":"Forfeiture Loading","summary":"When a balance file from the prior record keeper includes forfeiture entries, the DC loads them as participant-shaped records using a **stand-out date convention** so they're never mistaken for real participants.","updated":"2026-05-03","created":"2026-05-03","sources":1,"status":"current","tags":["forfeitures","balance-import","census","dummy-participant","conversion"],"type":"process","extras":[],"media":[],"meta":{"title":"Forfeiture Loading","type":"process","tags":["forfeitures","balance-import","census","dummy-participant","conversion"],"created":"2026-05-03","updated":"2026-05-03","sources":1,"status":"current"},"markdown":"# Forfeiture Loading\n\nWhen a balance file from the prior record keeper includes forfeiture entries, the DC loads them as participant-shaped records using a **stand-out date convention** so they're never mistaken for real participants.\n\n## Why Forfeitures Show Up\n\nForfeitures are amounts that left a participant's account when they terminated without being fully vested — they sit in a plan-level pool until the plan sponsor uses them (to offset employer contributions, pay plan expenses, etc.). When a plan converts, the prior record keeper often delivers these balances as separate line items in the balance file, named for the year they belong to or the source they came from.\n\n## Naming Convention\n\nMatch the vendor's naming. Common patterns:\n\n- `2023 FORFEITURE` (year-based — most common)\n- `MATCH FORFEITURE` (source-based)\n- Whatever string the vendor used\n\nKeeping the vendor's name makes the audit trail easy to reconcile back to the original file.\n\n## Stand-Out Dates\n\nUse the same date convention as the [[dummy-participant]] so forfeiture entries are visually obvious in any participant list:\n\n| Field | Value |\n|-------|-------|\n| Date of Birth | **12/25/1955** |\n| Date of Hire | **12/25/1985** |\n\nAnytime one of these shows up in a query result or a P3 screen, it's an immediate signal: **this is not a real participant — handle it differently.**\n\n## Loading\n\nLoad through the standard [[census-data]] flow alongside (or just before) the balance import. The forfeiture record needs to exist in the system before the [[balance-import]] runs so the balance has somewhere to land.\n\n## See Also\n\n- [[dummy-participant]] — same date convention; same \"this is not a real person\" pattern\n- [[balance-import]]\n- [[census-data]]\n- [[source-mapping]]"},{"id":"concepts/ftp-connection","slug":"ftp-connection","rel":"concepts/ftp-connection.md","namespace":"processes","title":"FTP Connection","summary":"The automated file transfer channel used by payroll vendors to upload payroll files to TransAmerica's systems.","updated":"2026-05-03","created":"2026-04-14","sources":3,"status":"current","tags":["ftp","payroll","automation","vendor","file-transfer"],"type":"process","extras":[],"media":[{"id":"fig-1","caption":"Vendor-side FTP upload page — what the payroll contact sees when sending a file.","src":"SS/FTP.jpg","type":"screenshot"}],"meta":{"title":"FTP Connection","type":"process","tags":["ftp","payroll","automation","vendor","file-transfer"],"created":"2026-04-14","updated":"2026-05-03","sources":3,"status":"current"},"markdown":"# FTP Connection\r\n\r\nThe automated file transfer channel used by payroll vendors to upload payroll files to TransAmerica's systems.\r\n\r\n## Overview\r\n\r\nRather than manually delivering payroll files each pay period, payroll vendors are set up with an FTP account to upload files directly to TransAmerica. The DC initiates the account setup process by identifying the payroll upload contact and submitting the request to the FTP team.\r\n\r\n## Why FTP Matters\r\n\r\nOnce set up, the FTP connection enables automated payroll processing — the vendor uploads a file, the system picks it up and processes it without manual intervention. Without FTP, the client must manually send payroll files each period (interim state).\r\n\r\n## Setup Process\r\n\r\n1. DC identifies who at the payroll vendor (or client) will be uploading payroll files\r\n2. DC **emails the FTP team** to request account setup\r\n3. FTP team sets up the account and generates login + password credentials\r\n4. DC provides credentials to the payroll upload contact\r\n5. **Connection test — send a random file first.** Before waiting on a real test payroll file, ask the uploader to send any file just to confirm the channel works end-to-end. The thing the system catches on is the [[payroll-template#file-naming-convention|naming convention]] — `\u003ccase#>_\u003ccontract>_\u003caffiliate>.xls`. A throwaway file with the right name proves the channel works before you stake real test data on it.\r\n6. Payroll vendor tests the connection — they see a simple upload page on their end\r\n7. FTP is live — **each plan gets its own destination folder**; vendor uploads files there; system processes them\r\n\r\n![Vendor-side FTP upload page — what the payroll contact sees when sending a file.](SS/FTP.jpg)\r\n\r\n## Auto-Sweep / Batch Mode\r\n\r\nAuto-sweep — where the FTP folder is polled and files are processed automatically without anyone clicking upload — isn't enabled day one. The vendor needs **2 or 3 good runs** through the manual upload page before the channel is moved to batch processing. This typically happens months after go-live, well outside the DC's window.\r\n\r\n## Timing\r\n\r\n**Request FTP setup as early as possible.** The FTP team has a large caseload and setup takes time. Delays in FTP setup mean longer periods of manual payroll file handling.\r\n\r\n> Identify the payroll contact → immediately request FTP setup. Don't wait.\r\n\r\n## Interim: Manual Payroll Filing\r\n\r\nWhen FTP isn't ready, the client sends payroll files directly (via secure email or other secure transfer). This is:\r\n- A valid interim state\r\n- Can last weeks or months depending on FTP team backlog and vendor readiness\r\n- Requires active monitoring by the DC each pay period\r\n- Plans stuck on manual payroll for a long time are a known pain point\r\n\r\n## Monitoring and Escalation\r\n\r\n- **Who monitors failed uploads:** The Account Manager and Payroll Support team\r\n- **Escalation for significant FTP delays:** Client is notified\r\n\r\n## See Also\r\n\r\n- [[payroll-vendor-onboarding]]\r\n- [[payroll-template]]\r\n- [[eds]]\r\n- [[dc-onboarding-workflow]]"},{"id":"entities/ftp-team","slug":"ftp-team","rel":"entities/ftp-team.md","namespace":"departments","title":"FTP Team","summary":"The internal team responsible for setting up and managing FTP connections that allow payroll vendors to upload files to TransAmerica's systems.","updated":"2026-04-14","created":"2026-04-14","sources":2,"status":"current","tags":["team","ftp","payroll","file-transfer"],"type":"department","extras":[],"media":[],"meta":{"title":"FTP Team","type":"department","tags":["team","ftp","payroll","file-transfer"],"created":"2026-04-14","updated":"2026-04-14","sources":2,"status":"current"},"markdown":"# FTP Team\r\n\r\nThe internal team responsible for setting up and managing FTP connections that allow payroll vendors to upload files to TransAmerica's systems.\r\n\r\n## Overview\r\n\r\nThe FTP Team sets up automated file transfer accounts for payroll vendors. Each plan requires its own FTP account and destination folder. The team also supports payroll meetings and manages the outbound file process. Setup takes approximately 1–2 weeks — engage early.\r\n\r\n## Key Contacts\r\n\r\n**[[jen-curtin]]** — Head of the FTP Team. The authoritative go-to for anything related to internal payroll integration. Deep institutional knowledge; direct and efficient in meetings.\r\n\r\n**[[eric-leytem]]** — handles final FTP account setup and sends the completion confirmation to the DC. Primary contact for FTP requests and status updates.\r\n\r\n## Responsibilities\r\n\r\n- Setting up FTP user credentials for payroll vendors\r\n- Configuring file transfer connections and plan-specific destination folders\r\n- Sending setup confirmation once live (Eric Leytem)\r\n- Supporting payroll meetings as needed\r\n- Managing the outbound file process (not DC-owned but critical to the overall payroll flow)\r\n\r\n## DC Interaction\r\n\r\n1. DC identifies who at the payroll vendor (or client) will upload payroll files\r\n2. DC emails the FTP Team to request account setup — **as early as possible**\r\n3. FTP Team creates credentials and sets up the destination folder\r\n4. Eric Leytem confirms setup is complete\r\n5. DC provides login credentials to the payroll upload contact\r\n6. Vendor tests the connection — they see a simple upload page on their end\r\n\r\n## Timing\r\n\r\nSetup takes approximately **1–2 weeks**. The FTP Team has a large caseload. Request as soon as the payroll vendor contact is identified — do not wait.\r\n\r\n> Delays in FTP setup = extended manual payroll period. Identify the contact → immediately request setup.\r\n\r\n## See Also\r\n\r\n- [[ftp-connection]]\r\n- [[jen-curtin]]\r\n- [[eric-leytem]]\r\n- [[payroll-template]]\r\n- [[eds]]\r\n- [[dc-onboarding-workflow]]"},{"id":"concepts/fund-management-calendar","slug":"fund-management-calendar","rel":"concepts/fund-management-calendar.md","namespace":"reference","title":"Fund Management Calendar","summary":"A daily trade log that must be updated — and a distribution email sent — before the 4:00 PM EST SSBT (State Street Bank & Trust) cut-off on any day trades go out. One of the most time-critical steps in a conversion. Failure to update it ris","updated":"2026-05-03","created":"2026-04-14","sources":4,"status":"current","tags":["fund-management-calendar","trades","cutoff","liquidation","critical","fmc"],"type":"reference","extras":[],"media":[],"meta":{"title":"Fund Management Calendar","type":"reference","tags":["fund-management-calendar","trades","cutoff","liquidation","critical","fmc"],"created":"2026-04-14","updated":"2026-05-03","sources":4,"status":"current"},"markdown":"# Fund Management Calendar\n\nA daily trade log that must be updated — and a distribution email sent — before the 4:00 PM EST SSBT (State Street Bank & Trust) cut-off on any day trades go out. One of the most time-critical steps in a conversion. Failure to update it risks fund companies declining trades, requiring reversal and reprocessing.\n\n## Overview\n\nThe Fund Management Calendar (FMC) tracks every trade being sent out across all plans on a given day. When a conversion involves trades — whether from a mapping Day of Wire or a cash conversion balance posting — the DC must enter the plan's expected trade information into the FMC and send a notification email to four distribution addresses.\n\n> \"The FMC calendar is a critical step for the DC Team to ensure that our internal partners can effectively communicate nightly trade expectations with the fund companies that Transamerica is partnering with. If Transamerica does not communicate these trades to our external partners, we risk the fund companies declining our trades and may have to reverse and reprocess our files.\"\n\nThe procedure below supersedes the old FMC process. The original FMC page in the DC Training Notebook is explicitly marked **\"DO NOT USE.\"**\n\n## Why It Matters\n\nWithout an FMC entry, a large unexpected transaction ($10–20 million or more) has no advance notice and will trigger questions. An entry — even an estimate — communicates intent. Absent entries are the problem; estimates are always acceptable.\n\n> \"If you don't put it in, all of a sudden there's a $10, $20 million transaction. People are gonna question it. It's on the fund management calendar, even if it's not exact, it'll be fine.\"\n\n## Cut-Off Time\n\n| Trigger | Time |\n|---------|------|\n| **SSBT Cut-off** | 4:00 PM EST |\n| **Wire confirmation expected** | 4:45 PM EST (Cashiering confirms by this time if wire received that day) |\n\nIf the wire is not received by the 4:00 PM SSBT cut-off, the FMC must be updated to the **next business day** and a follow-up email sent.\n\n## Email Distribution List\n\nWhenever the FMC is updated with fund balances or an expected wire amount, **also send an email** to all four addresses below. This is mandatory — not optional — per the February 2026 procedure update.\n\n| Address |\n|---------|\n| TRSCFUNDCALENDAR@transamerica.com |\n| TRSCIM.Operations@transamerica.com |\n| TRSCIM.Operations.Members@transamerica.com |\n| TRSCIM.PARISIIIRemittanceBatchNotificationList@transamerica.com |\n\n**Email Subject:** `[Case Number and Affiliate] / FMC Update`\n\n**Email body must include:**\n- Plan Number / Affiliate\n- Plan Name\n- Fund Name / Fund Code / Amount per Fund\n- Expected processing date\n\nIf the wire does not arrive by cut-off and the FMC is moved to the next business day, send a follow-up email to the same list with subject: `FMC Date Change Notification`.\n\n> The email is also critical when unable to access the FMC file — it provides the information to internal teams even if the file cannot be updated.\n\n## When It Applies\n\n| Scenario | Calendar Entry + Email Required? |\n|----------|----------------------------------|\n| AC1 Mapping — Day of Wire | Yes |\n| AC1 Cash — balance posting | Yes |\n| Participant Balance Processing | No (see note below) |\n| Transfer In Kind — Day of Wire | No (shares only, no trades) |\n| Transfer In Kind — balance posting | No |\n| AE interest distribution, dividends, uncashed checks, other small late cash | No — small-money exclusion (see below) |\n\n## Cash Conversion: Three Trading Events\n\nFor a cash conversion, the FMC has to capture **three separate trading events** across different days — not just one. Forgetting any of them is the same problem as not entering anything at all.\n\n| Event | Trades? | Day | FMC Entry Required |\n|-------|---------|-----|--------------------|\n| Wire booked → Advanced Employer purchase | Yes (AE buy) | Liquidation Day | Yes |\n| AE liquidation (final files arrive) | Yes (AE sell) | Final Files Day | Yes |\n| Subsequent fund purchases (participant balances post) | Yes (fund buys) | Same as AE liquidation, or shortly after | Yes |\n\nEach event is a real trade hitting fund companies. Each one needs its own FMC entry on the right day.\n\n## Small-Money Exclusion\n\nNot every cash movement requires an FMC entry. The rule is **big money only**. The following do **not** need FMC entries:\n\n- AE interest distributions (see [[subsequent-cash-imports]])\n- Trailing dividends from prior-RK funds\n- Uncashed check reissues\n- Any other small late-arriving cash applied to participants\n\nThe threshold is judgment-based, not a hard dollar number. If it would make a fund company raise an eyebrow when the trade hit, it goes on the FMC.\n\n**Participant Balance Processing (special case):** No FMC action for the Day of Wire / initial wire step. However, when participant balance posting is run via the Informatica Balance Workflow, the FMC **must be updated with the FMC Estimate from the Informatica Balance Workflow output by 4:00 PM** on the day of processing. If Vanguard (VG) funds are involved, this must be done by **2:00 PM EST** — or approval must be obtained from Rich Lippoth via email (followed up by IM or phone).\n\n## Procedure by Conversion Type\n\n### AC1 Mapping Conversions\n\n**Preparing estimates (before liquidation day):**\n- Update FMC with test file balances using the expected TOA date\n- If a date range is provided by the prior RK, use the first date in the range; update if wires are not received on that date\n- If no test files received: request fund/source balances from prior RK or client for estimates\n- If none available: use TOA balances\n- **Deadline for entering estimates: no later than TOA minus five business days**\n\n**Day before / Day of Wire:**\n- Update FMC if actual fund balances are provided before wire receipt\n- When updating with actual fund balances, send the FMC notification email to all four addresses\n\n### AC1 Cash Conversions\n\n**Preparing estimates (before liquidation day):**\n- Same process as mapping: use test file balances with expected TOA date\n- If test files not received: request fund/source balances from prior RK or client\n- If none available: use TOA balances\n- **Deadline: no later than TOA minus five business days**\n\n**Day before / Day of Wire:**\n- Update FMC if actual wire amount is provided before wire receipt\n- When updating with actual expected wire amount, send the FMC notification email\n\n### Participant Balance Processing (Cash Conversions)\n\n- Update FMC with the **FMC Estimate from the Informatica Balance Workflow output** by 4:00 PM on the day of balance processing\n- If Vanguard funds involved: update by **2:00 PM EST** or get approval from Rich Lippoth\n- Send the FMC notification email when updating\n\n## If the FMC File Is Locked\n\nThe FMC is a shared file and gets locked when multiple people access it simultaneously. This is a known pain point.\n\n**Mitigation:** Enter estimates as early as possible. Do not wait until you have exact numbers — early estimates are better than late exact figures.\n\n**If locked at cut-off time:**\n1. Send the FMC notification email to all four distribution list addresses (this documents your trade intent even without file access)\n2. Keep trying to access the file throughout the day\n3. Update the file as soon as access is restored\n\n> The email provides the information to internal teams even when the file cannot be updated.\n\n## Trade-Slip Notification Groups\n\nSeparate from the four FMC update addresses above, there are **three internal email groups** used to notify when trades are not going as planned — for example, when the FMC couldn't be updated in time, when a wire didn't arrive that was expected, or when something has to push to the next day.\n\n> **Placeholder — fill in actual addresses:**\n> - `\u003cTRADE-SLIP-LIST-1@transamerica.com>`\n> - `\u003cTRADE-SLIP-LIST-2@transamerica.com>`\n> - `\u003cTRADE-SLIP-LIST-3@transamerica.com>`\n\nStandard wording is short:\n\n> \"Heads up — I had trades for [Plan Name] expected today but [the wire didn't arrive / I couldn't access the FMC / etc.]. I'll handle it tomorrow when [condition] is resolved. Will update FMC then.\"\n\nThis is distinct from the FMC update emails — those announce trades; the trade-slip emails announce *non-trades* or *delayed* trades.\n\n## Core Rule on Timing\n\n> It is **okay** to have an entry on the FMC and have trades **NOT** go out.\n> It is **not okay** to have trades go out **without** an entry on the FMC.\n\nWhen in doubt: put it on early.\n\n## TIK and the FMC\n\nTransfer In Kind conversions are full share transfers — no trading occurs. Therefore, TIK funds do **not** require FMC entries. Only funds that actually trade (cash and mapping conversions) need entries.\n\n## Open Questions\n\n- ~~Exact shared drive path for the FMC~~ — *Confirmed: shared drive path exists (see `\\\\yydafs-data1\\department\\` prefix — exact FMC path still not documented; may
