<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 968" role="img" aria-label="Fund Management Calendar flowchart">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#202122"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="5" dy="6" stdDeviation="0" flood-color="#202122" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1600" height="968" fill="#fbfaf5"/>
  <rect x="34" y="34" width="1532" height="900" rx="28" fill="none" stroke="#202122" stroke-width="4"/>
  <text x="74" y="78" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#7d6d2f">TRADING</text>
  <text x="74" y="116" font-family="Georgia, serif" font-size="44" fill="#202122">Fund Management Calendar</text>
  <g filter="url(#shadow)"><path d="M388 192 L420 192" stroke="#202122" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
      <g>
        <rect x="58" y="136" width="330" height="136" rx="18" fill="#fff" stroke="#202122" stroke-width="3"/>
        <circle cx="92" cy="174" r="21" fill="#7d6d2f"/>
        <text x="92" y="181" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">1</text>
        <text x="124" y="176" font-size="17" fill="#202122">Determine whether the trade</text><text x="124" y="196" font-size="17" fill="#202122">type requires calendar</text><text x="124" y="216" font-size="17" fill="#202122">notification.</text>
      </g>
<path d="M768 192 L800 192" stroke="#202122" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
      <g>
        <rect x="438" y="136" width="330" height="136" rx="18" fill="#fff" stroke="#202122" stroke-width="3"/>
        <circle cx="472" cy="174" r="21" fill="#7d6d2f"/>
        <text x="472" y="181" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2</text>
        <text x="504" y="176" font-size="17" fill="#202122">Identify the conversion type</text><text x="504" y="196" font-size="17" fill="#202122">and which trade event is</text><text x="504" y="216" font-size="17" fill="#202122">occurring.</text>
      </g>
<path d="M1148 192 L1180 192" stroke="#202122" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
      <g>
        <rect x="818" y="136" width="330" height="136" rx="18" fill="#fff" stroke="#202122" stroke-width="3"/>
        <circle cx="852" cy="174" r="21" fill="#7d6d2f"/>
        <text x="852" y="181" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">3</text>
        <text x="884" y="176" font-size="17" fill="#202122">Enter trade details before the</text><text x="884" y="196" font-size="17" fill="#202122">cut-off window whenever the</text><text x="884" y="216" font-size="17" fill="#202122">file is accessible.</text>
      </g>
<path d="M1363 272 L1363 298 L223 298 L223 316" stroke="#202122" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
      <g>
        <rect x="1198" y="136" width="330" height="136" rx="18" fill="#fff" stroke="#202122" stroke-width="3"/>
        <circle cx="1232" cy="174" r="21" fill="#7d6d2f"/>
        <text x="1232" y="181" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">4</text>
        <text x="1264" y="176" font-size="17" fill="#202122">Send the required notification</text><text x="1264" y="196" font-size="17" fill="#202122">email to the distribution</text><text x="1264" y="216" font-size="17" fill="#202122">list.</text>
      </g>
<path d="M388 382 L420 382" stroke="#202122" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
      <g>
        <rect x="58" y="326" width="330" height="136" rx="18" fill="#fff" stroke="#202122" stroke-width="3"/>
        <circle cx="92" cy="364" r="21" fill="#7d6d2f"/>
        <text x="92" y="371" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">5</text>
        <text x="124" y="366" font-size="17" fill="#202122">If the calendar file is</text><text x="124" y="386" font-size="17" fill="#202122">locked, send the email anyway</text><text x="124" y="406" font-size="17" fill="#202122">and keep trying to update the</text><text x="124" y="426" font-size="17" fill="#202122">file.</text>
      </g>
<path d="M768 382 L800 382" stroke="#202122" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
      <g>
        <rect x="438" y="326" width="330" height="136" rx="18" fill="#fff" stroke="#202122" stroke-width="3"/>
        <circle cx="472" cy="364" r="21" fill="#7d6d2f"/>
        <text x="472" y="371" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">6</text>
        <text x="504" y="366" font-size="17" fill="#202122">For cash conversions, track</text><text x="504" y="386" font-size="17" fill="#202122">the wire, Advanced Employer,</text><text x="504" y="406" font-size="17" fill="#202122">and participant balance events</text><text x="504" y="426" font-size="17" fill="#202122">separately.</text>
      </g>
<path d="M1148 382 L1180 382" stroke="#202122" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
      <g>
        <rect x="818" y="326" width="330" height="136" rx="18" fill="#fff" stroke="#202122" stroke-width="3"/>
        <circle cx="852" cy="364" r="21" fill="#7d6d2f"/>
        <text x="852" y="371" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">7</text>
        <text x="884" y="366" font-size="17" fill="#202122">Exclude small-money trailing</text><text x="884" y="386" font-size="17" fill="#202122">dividends when the procedure</text><text x="884" y="406" font-size="17" fill="#202122">says calendar entry is not</text><text x="884" y="426" font-size="17" fill="#202122">needed.</text>
      </g>

      <g>
        <rect x="1198" y="326" width="330" height="136" rx="18" fill="#fff" stroke="#202122" stroke-width="3"/>
        <circle cx="1232" cy="364" r="21" fill="#7d6d2f"/>
        <text x="1232" y="371" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">8</text>
        <text x="1264" y="366" font-size="17" fill="#202122">Confirm the intended trade is</text><text x="1264" y="386" font-size="17" fill="#202122">documented before downstream</text><text x="1264" y="406" font-size="17" fill="#202122">processing.</text>
      </g></g>
  <text x="74" y="560" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#202122">Branch points</text>
  <g>
      <path d="M232 586 L346 658 L232 730 L118 658 Z" fill="#fff8df" stroke="#202122" stroke-width="3"/>
      <text x="232" y="614" text-anchor="middle" font-size="15" font-weight="800" fill="#7d6d2f">DECISION 1</text>
      <text x="232" y="638" text-anchor="middle" font-size="17" fill="#202122">Does this event require FMC</text><text x="232" y="659" text-anchor="middle" font-size="17" fill="#202122">entry?</text>
    </g>
<g>
      <path d="M587 586 L701 658 L587 730 L473 658 Z" fill="#fff8df" stroke="#202122" stroke-width="3"/>
      <text x="587" y="614" text-anchor="middle" font-size="15" font-weight="800" fill="#7d6d2f">DECISION 2</text>
      <text x="587" y="638" text-anchor="middle" font-size="17" fill="#202122">Is this mapping, cash,</text><text x="587" y="659" text-anchor="middle" font-size="17" fill="#202122">participant balance, or TIK?</text>
    </g>
<g>
      <path d="M942 586 L1056 658 L942 730 L828 658 Z" fill="#fff8df" stroke="#202122" stroke-width="3"/>
      <text x="942" y="614" text-anchor="middle" font-size="15" font-weight="800" fill="#7d6d2f">DECISION 3</text>
      <text x="942" y="638" text-anchor="middle" font-size="17" fill="#202122">Is the calendar file</text><text x="942" y="659" text-anchor="middle" font-size="17" fill="#202122">accessible?</text>
    </g>
<g>
      <path d="M1297 586 L1411 658 L1297 730 L1183 658 Z" fill="#fff8df" stroke="#202122" stroke-width="3"/>
      <text x="1297" y="614" text-anchor="middle" font-size="15" font-weight="800" fill="#7d6d2f">DECISION 4</text>
      <text x="1297" y="638" text-anchor="middle" font-size="17" fill="#202122">Is the trade before SSBT</text><text x="1297" y="659" text-anchor="middle" font-size="17" fill="#202122">cut-off?</text>
    </g>
  <text x="74" y="788" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#202122">Systems touched</text>
  <g>
      <rect x="86" y="808" width="196" height="58" rx="12" fill="#eef5f4" stroke="#7d6d2f" stroke-width="3"/>
      <text x="184" y="844" text-anchor="middle" font-size="19" font-weight="800" fill="#202122">Fund management calendar</text>
    </g>
<g>
      <rect x="324" y="808" width="196" height="58" rx="12" fill="#eef5f4" stroke="#7d6d2f" stroke-width="3"/>
      <text x="422" y="844" text-anchor="middle" font-size="19" font-weight="800" fill="#202122">Email</text>
    </g>
<g>
      <rect x="562" y="808" width="196" height="58" rx="12" fill="#eef5f4" stroke="#7d6d2f" stroke-width="3"/>
      <text x="660" y="844" text-anchor="middle" font-size="19" font-weight="800" fill="#202122">Cashiering</text>
    </g>
<g>
      <rect x="800" y="808" width="196" height="58" rx="12" fill="#eef5f4" stroke="#7d6d2f" stroke-width="3"/>
      <text x="898" y="844" text-anchor="middle" font-size="19" font-weight="800" fill="#202122">Trading groups</text>
    </g>
<g>
      <rect x="1038" y="808" width="196" height="58" rx="12" fill="#eef5f4" stroke="#7d6d2f" stroke-width="3"/>
      <text x="1136" y="844" text-anchor="middle" font-size="19" font-weight="800" fill="#202122">SSBT</text>
    </g>
</svg>